<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Intro to LLMs Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: control-panel bench. Left rail = drill builder + settings, main = week grid / active question. Stack-light dots (red/amber/green) encode your best score per week. */
:root{
  --bg:#e9edf1; --panel:#fbfcfd; --ink:#16202a; --muted:#566373; --line:#cdd5de; --chip:#dfe5ec;
  --accent:#b97c00; --accent-soft:#f6e7c4; --accent-ink:#1d1500;
  --warn:#c98a00; --ok:#17834a; --ok-soft:#dcf2e5; --bad:#bf3434; --bad-soft:#f8e0e0; --idle:#9aa6b3;
  --f-display:"Chakra Petch","Arial Narrow",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f141a; --panel:#171e26; --ink:#e4e9ef; --muted:#93a1b0; --line:#2a3542; --chip:#222c37;
  --accent:#f0b429; --accent-soft:#3a2d0c; --accent-ink:#1d1500;
  --warn:#f0b429; --ok:#41c97c; --ok-soft:#123423; --bad:#f07272; --bad-soft:#3d1a1c; --idle:#56636f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141a; --panel:#171e26; --ink:#e4e9ef; --muted:#93a1b0; --line:#2a3542; --chip:#222c37;
  --accent:#f0b429; --accent-soft:#3a2d0c; --accent-ink:#1d1500;
  --warn:#f0b429; --ok:#41c97c; --ok-soft:#123423; --bad:#f07272; --bad-soft:#3d1a1c; --idle:#56636f; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--f-body);margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:20px 48px}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font:600 12px/1.2 var(--f-display);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

/* header */
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;padding-bottom:16px;border-bottom:2px solid var(--ink);margin-bottom:20px}
.brand h1{font:700 clamp(24px,4vw,34px)/1.05 var(--f-display);margin:4px 0 0;text-wrap:balance}
.brand h1 span{color:var(--accent)}
.meters{display:flex;gap:20px;flex-wrap:wrap}
.meter b{display:block;font:700 22px/1 var(--f-mono)}
.meter small{font-size:12px;color:var(--muted)}

/* layout */
.grid{display:grid;grid-template-columns:300px minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}
aside{display:grid;gap:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.panel h2{font:600 15px/1.2 var(--f-display);letter-spacing:.04em;text-transform:uppercase;margin:0 0 12px}

.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{background:transparent;border:0;padding:8px 4px;font-size:14px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel);font-weight:700}
.hintline{font-size:13px;color:var(--muted);margin:8px 0 0}
.check{display:flex;gap:8px;align-items:center;font-size:14px;margin-top:10px}
.check input{accent-color:var(--accent);width:16px;height:16px}

.weekpick{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.runpick{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pickhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.weekpick label,.runpick label{display:block}
.weekpick input,.runpick input{position:absolute;opacity:0;pointer-events:none}
.weekpick span,.runpick span{display:block;text-align:center;padding:6px 0;border:1px solid var(--line);border-radius:4px;font:500 13px var(--f-mono);background:var(--bg)}
.weekpick input:checked+span,.runpick input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.weekpick input:focus-visible+span,.runpick input:focus-visible+span{outline:2px solid var(--ink);outline-offset:1px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
.row select{padding:7px 8px;border:1px solid var(--line);border-radius:4px;background:var(--bg)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:9px 14px;font-weight:700;font-size:14px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.block{width:100%;margin-top:12px}
.linkish{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;font-size:13px}

/* session tabs */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px}
.tabs button{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 14px;font-size:14px;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--panel);font-weight:700}

.session{margin-bottom:28px}
.session-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.session-head h3{font:700 20px/1.2 var(--f-display);margin:0}
.weeks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.wk{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:8px}
.wk-top{display:flex;justify-content:space-between;align-items:center}
.wk-num{font:700 18px/1 var(--f-display)}
.wk-meta{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.wk-actions{display:flex;gap:6px}
.wk-actions .btn{flex:1;padding:6px 8px;font-size:13px}
.lamp{display:inline-flex;gap:3px}
.lamp i{width:9px;height:9px;border-radius:50%;background:var(--chip);border:1px solid var(--line)}
.lamp[data-l="r"] i:nth-child(1){background:var(--bad);border-color:var(--bad)}
.lamp[data-l="a"] i:nth-child(2){background:var(--warn);border-color:var(--warn)}
.lamp[data-l="g"] i:nth-child(3){background:var(--ok);border-color:var(--ok)}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}

/* quiz */
.qbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.qbar .title{font:700 18px/1.2 var(--f-display);flex:1;min-width:0}
.progress{height:4px;background:var(--chip);border-radius:2px;overflow:hidden;margin-bottom:18px}
.progress div{height:100%;background:var(--accent);transition:width .2s}
.qcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:clamp(16px,3vw,28px);max-width:820px}
.qhead{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:10px;font-size:13px;color:var(--muted)}
.qtext{font:700 clamp(18px,2.4vw,21px)/1.45 var(--f-body);margin:0 0 6px;white-space:pre-line}
.ok-chip{display:inline-block;font:600 11px var(--f-display);letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--ok);color:var(--ok);padding:1px 6px;border-radius:3px;margin-left:6px}
.flag{display:inline-block;font:600 11px var(--f-display);letter-spacing:.08em;text-transform:uppercase;border:1px dashed var(--accent);color:var(--muted);padding:1px 6px;border-radius:3px;margin-left:6px}
.imp{display:inline-block;font:600 11px/1.5 var(--f-display);letter-spacing:.08em;text-transform:uppercase;padding:1px 7px;border-radius:3px;margin-left:6px;white-space:nowrap;border:1px solid var(--accent)}
.imp.t2{background:var(--accent);color:var(--accent-ink)}
.imp.t1{color:var(--ink)}
.relq{font-size:13px;color:var(--muted);margin-top:8px}
.focus{display:grid;gap:14px;margin-bottom:20px;border-color:var(--accent)}
.focus p{margin:0;color:var(--muted);font-size:14px;max-width:62ch}
.fstats{display:flex;gap:28px;flex-wrap:wrap}
.fstat{display:grid;gap:4px;justify-items:start}
.fstat b{font:700 30px/1 var(--f-mono)}
.fstat .imp{margin-left:0}
.fstat small{font-size:12px;color:var(--muted)}
.focus .row{margin-top:0}
.wk-imp{font-size:13px;color:var(--muted)}
.wk-imp b{color:var(--ink);font-family:var(--f-mono)}
.multi{display:inline-block;font:600 12px var(--f-display);letter-spacing:.08em;text-transform:uppercase;background:var(--accent-soft);color:var(--ink);padding:2px 8px;border-radius:3px;margin-bottom:10px}
.opts{display:grid;gap:8px;margin-top:14px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:var(--r);padding:12px 14px;line-height:1.45;width:100%}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt:disabled{cursor:default}
.opt .k{flex:none;width:26px;height:26px;display:grid;place-items:center;border:1px solid var(--line);border-radius:4px;font:700 13px var(--f-mono);background:var(--panel)}
.opt span:last-child{min-width:0;overflow-wrap:anywhere}
.opt.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.opt.sel .k{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft);box-shadow:inset 0 0 0 1px var(--ok)}
.opt.ok .k{background:var(--ok);border-color:var(--ok);color:var(--panel)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft);box-shadow:inset 0 0 0 1px var(--bad)}
.opt.bad .k{background:var(--bad);border-color:var(--bad);color:var(--panel)}
.numrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:14px}
.numin{font:600 18px var(--f-mono);padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);width:min(240px,100%)}
.numin:focus{outline:2px solid var(--accent);outline-offset:1px}
.numin.ok{border-color:var(--ok);background:var(--ok-soft)}
.numin.bad{border-color:var(--bad);background:var(--bad-soft)}
.feedback{margin-top:16px;padding:12px 14px;border-radius:var(--r);border:1px solid var(--line);font-size:15px}
.feedback.ok{border-color:var(--ok);background:var(--ok-soft)}
.feedback.bad{border-color:var(--bad);background:var(--bad-soft)}
.feedback strong{font-family:var(--f-display);letter-spacing:.03em}
.src{font-size:12px;color:var(--muted);margin-top:8px;overflow-wrap:anywhere}
.src a{color:inherit}
.qactions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;justify-content:space-between}
.qactions .sp{flex:1}
.dots{display:flex;flex-wrap:wrap;gap:5px;margin-top:18px;max-width:820px}
.dots button{width:30px;height:30px;border:1px solid var(--line);background:var(--panel);border-radius:4px;font:500 12px var(--f-mono);padding:0}
.dots button.cur{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.dots button.ans{background:var(--accent-soft)}
.dots button.ok{background:var(--ok);border-color:var(--ok);color:var(--panel)}
.dots button.bad{background:var(--bad);border-color:var(--bad);color:var(--panel)}
.keys{font-size:12px;color:var(--muted);margin-top:14px}
.keys kbd{font:500 11px var(--f-mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;padding:0 4px;background:var(--panel)}

/* results + study */
.score{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin-bottom:8px}
.score b{font:700 56px/1 var(--f-mono)}
.score .of{font:500 20px var(--f-mono);color:var(--muted)}
.verdict{font:700 20px var(--f-display)}
.list{display:grid;gap:12px;margin-top:20px;max-width:820px}
.item{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.item .qtext{font-size:16px}
.item ul{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:4px}
.item li{display:flex;gap:8px;font-size:15px;padding:4px 8px;border-radius:4px}
.item li .k{font:700 13px var(--f-mono);flex:none;width:18px}
.item li.right{background:var(--ok-soft);font-weight:700}
.item li.wrong{background:var(--bad-soft);text-decoration:line-through}
.item .exp{font-size:14px;color:var(--muted);margin-top:8px}
.note{font-size:13px;color:var(--muted);max-width:820px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:8px 16px;border-radius:4px;font-size:14px}
.courses{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;margin-bottom:10px}
.courses a{color:var(--muted)}
.courses b{color:var(--ink);border-bottom:2px solid var(--accent)}
:root{--accent:#a8326c;--accent-soft:#f6e0eb;--accent-ink:#ffffff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--accent:#f07ab3;--accent-soft:#3a1828;--accent-ink:#2a0716}}
:root[data-theme="dark"]{--accent:#f07ab3;--accent-soft:#3a1828;--accent-ink:#2a0716}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>

<script>window.QUIZ_DATA = {"sets":[{"year":2026,"session":"Jan-Apr 2026","week":1,"source":"https://github.com/Shivammittal13ai/Introduction-to-Large-Language-Models_NPTEL-2026/blob/main/Assignments/Jan-Apr_2026%20(1-12).zip (Week 1 Solution.pdf) (Accepted Answers: official NPTEL assignment solution PDF for noc26_cs88)","questions":[{"q":"Consider the word “paper” in the following sentences: She submitted her research paper. He wrapped the gift in paper. The word “paper” is an example of:","options":["Homonymy","Synonymy","Polysemy","Antonymy"],"answer":[2],"verified":"official","c":0},{"q":"Based on Distributional Semantics, which of the following statements is/are true? (i) The meaning of a word is defined by its relationship to other words. (ii) The meaning of a word does not rely on its surrounding context.","options":["Both (i) and (ii) are correct","Only (ii) is correct","Only (i) is correct","Neither (i) nor (ii) is correct"],"answer":[3],"explanation":"Official key says 'Neither' (same key as the identical Jan-Apr 2025 question). Note the official solution text itself says meaning is derived from distributional properties/context, so 'Only (i)' would be the conceptually natural reading; the graded key is nevertheless (d).","verified":"official","c":335,"rel":[["Jan-Apr 2025",1,1]]},{"q":"The sentence “Ravi saw the man with the binoculars.” is ambiguous because of:","options":["Lexical ambiguity","Morphological ambiguity","Syntactic ambiguity","Pragmatic ambiguity"],"answer":[2],"explanation":"The prepositional phrase can attach to either Ravi or the man (attachment ambiguity).","verified":"official","c":2},{"q":"Consider the sentences: Anita met Kavya after work. She was tired. Who does “she” most likely refer to?","options":["Anita","Kavya","Both equally","Cannot be determined"],"answer":[3],"verified":"official","c":3},{"q":"What is the correct morpheme breakdown of the word “unhappiness”?","options":["un + happy + ness","unhappi + ness","un + happi + ness","unhappiness"],"answer":[0],"verified":"official","c":4},{"q":"In the sentence: “The chef cooked pasta for the guests.” What is the semantic role of “the guests”?","options":["Agent","Patient","Beneficiary","Instrument"],"answer":[2],"verified":"official","c":5},{"q":"Below is a sentence with lexical ambiguity. Rose rose to put rose roes on her rows of roses. How many senses of rose are present in the sentence?","options":["2","3","1","4"],"answer":[3],"explanation":"Proper noun (Rose), verb (rose = stood), adjective (rose-coloured roes), noun (the flower).","verified":"official","c":6},{"q":"What issues can be observed in the following text? On a much-needed #workcation in beautiful Goa. Workin & chillin by d waves!","options":["Idioms","Non-standard English","Tricky Entity Names","Neologisms"],"answer":[1,3],"verified":"official","c":338,"rel":[["Jul-Oct 2025",1,1],["Jan-Apr 2025",1,1]]},{"q":"Sentence 1: Arjun bought a brand-new laptop. Sentence 2: Arjun owns a laptop. (Relationship of Sentence 2 to Sentence 1)","options":["Entailed","Contradicted","Neutral"],"answer":[0],"verified":"official","c":8},{"q":"Which relation holds between “engine” and “car”?","options":["Synonymy","Antonymy","Meronymy","Hyponymy"],"answer":[2],"verified":"official","c":9}]},{"year":2026,"session":"Jan-Apr 2026","week":2,"source":"https://github.com/Shivammittal13ai/Introduction-to-Large-Language-Models_NPTEL-2026/blob/main/Assignments/Jan-Apr_2026%20(1-12).zip (Week 2 Solution.pdf) (Accepted Answers: official NPTEL assignment solution PDF for noc26_cs88)","questions":[{"q":"A language model that conditions each word on the previous three words is equivalent to which Markov model?","options":["First-order","Second-order","Third-order","Fourth-order"],"answer":[2],"verified":"official","c":126,"rel":[["Jul-Oct 2026",2,1]]},{"q":"Which smoothing technique leverages the number of unique contexts a word appears in?","options":["Good-Turing","Add-k","Kneser-Ney","Absolute Discounting"],"answer":[2],"verified":"official","c":238,"rel":[["Jul-Oct 2026",2,1],["Jul-Oct 2025",2,1]]},{"q":"Using a language model inside a machine translation system to measure BLEU score is an example of:","options":["Intrinsic evaluation","Extrinsic evaluation","Perplexity evaluation","Likelihood estimation"],"answer":[1],"verified":"official","c":12},{"q":"Consider the following corpus: <s> the wizard sees the dragon <\/s> <s> the dragon breathes fire <\/s> <s> the wizard casts a spell <\/s> Assuming a bi-gram language model, calculate the probability of the sentence: <s> the dragon casts fire <\/s> Ignore the unigram probability of P(<s>) in your calculation.","options":["2/37","1/27","0","1/36"],"answer":[2],"explanation":"P(casts|dragon) = 0, so the product is 0.","verified":"official","c":239,"rel":[["Jul-Oct 2026",2,0],["Jul-Oct 2025",2,1]]},{"q":"Consider the following corpus: <s> the wizard sees the dragon <\/s> <s> the dragon breathes fire <\/s> <s> the wizard casts a spell <\/s> Using add-one smoothing, compute the probability of the sentence: <s> the dragon casts fire <\/s> Assume vocabulary size V includes all unique words (excluding <s>, <\/s>).","options":["1/7150","1/35","1/67","1/9900"],"answer":[0],"explanation":"V = 9. P(the|<s>) = 4/12, P(dragon|the) = 3/13, P(casts|dragon) = 1/11, P(fire|casts) = 1/10, P(<\/s>|fire) = 2/10; product = 1/7150.","verified":"official","c":14},{"q":"Consider the following corpus: <s> the wizard sees the dragon <\/s> <s> the dragon breathes fire <\/s> <s> the wizard casts a spell <\/s> Using the smoothed (add-one) probability, compute the perplexity of: <s> the dragon casts fire <\/s> (Exclude <s> and <\/s> from word count.)","options":["9000^(1/5)","7150^(1/4)","(1/35)^(1/5)","(1/9900)^(1/4)"],"answer":[1],"explanation":"N = 4, P = 1/7150, PP = P^(-1/4) = 7150^(1/4).","verified":"official","c":15}]},{"year":2026,"session":"Jan-Apr 2026","week":3,"source":"https://github.com/Shivammittal13ai/Introduction-to-Large-Language-M m P(y|x) without architectural modification?","options":["Decoder-only language models","Encoder-only models","Encoder-decoder models","Character-CNN models"],"answer":[2],"verified":"official","c":54},{"q":"Which of the following corruption strategies was/were explored in the pre-training of BART?","options":["Token masking, i.e., random tokens replaced by mask markers","Token deletion","Sentence permutation","Text infilling, i.e., replacing spans with a single sentinel and tasking decoder to generate the spans."],"answer":[0,1,2,3],"verified":"official","c":55},{"q":"What were the major changes introduced in GPT-2 family of models, compared to GPT-1?","options":["Addition of layer normalization between sub-blocks","Increased vocabulary size","Increased context size","Addition of Rotary Positional Embedding (RoPE)"],"answer":[0,1,2],"verified":"official","c":56},{"q":"Which of the following architectures are most suited for the sentiment classification task (given a sentence, assign one sentiment among positive, negative and neutral to it) and the machine translation task, respectively?","options":["Sentiment Classification: Encoder-Decoder; Machine-Translation: Encoder-only","Sentiment Classification: Decoder-only; Machine-Translation: Encoder-only","Sentiment Classification: Encoder-only; Machine-Translation: Decoder-only","Sentiment Classification: Encoder-only; Machine-Translation: Encoder-Decoder"],"answer":[3],"verified":"official","c":57},{"q":"The chain-rule factorization used when training an autoregressive language model for a sentence s = {t_1, t_2, ..., t_m} leads to the log probability of s being expressed as:","options":["log P(s) = Σ_{j=1}^{m} log P(t_j)","log P(s) = log P(t_1) + Σ_{j=1}^{m-1} log P(t_{j+1} | t_1, ..., t_j)","log P(s) = log P(t_1) × Π_{j=1}^{m-1} log P(t_{j+1} | t_1, ..., t_j)","log P(s) = Π_{j=1}^{m} log P(t_j)"],"answer":[1],"verified":"official","c":58},{"q":"Why does ELMo build its input token representations from a character-level CNN instead of fixed word embeddings?","options":["To reduce training time by sharing parameters","To avoid UNK tokens and generate representations for any string","To compress embeddings to 128 dimensions","To ensure the same vector for a word in every context"],"answer":[1],"verified":"official","c":283,"rel":[["Jul-Oct 2025",7,1]]},{"q":"In the ELMo task-specific combination formula, what is the role of the scalar γ^task?","options":["It enforces a unit norm on the combined vector.","It selects which of forward/backward LSTMs to use.","It is an embedding for the task label.","It allows the downstream task to scale the overall magnitude of the combined representation."],"answer":[3],"verified":"official","c":60},{"q":"(Numerical) The einsum function in numpy is used as a generalized operation for performing tensor multiplications. Consider two matrices A = [[3, 0], [1, −1]] and B = [[−2, 8], [7, −7]]. What is the output of the following numpy operation? numpy.einsum('ij,ji->', A, B)","options":["9"],"answer":[0],"explanation":"Σ_i Σ_j A_ij B_ji = (3)(−2) + (0)(7) + (1)(8) + (−1)(−7) = 9.","verified":"official","c":61}]},{"year":2026,"session":"Jan-Apr 2026","week":8,"source":"https://github.com/Shivammittal13ai/Introduction-to-Large-Language-Models_NPTEL-2026/blob/main/Assignments/Jan-Apr_2026%20(1-12).zip (Week 8 Solution.pdf) (Accepted Answers: official NPTEL assignment solution PDF for noc26_cs88)","questions":[{"q":"Which factors influence the effectiveness of instruction tuning?","options":["The number of instruction templates used in training.","The tokenization algorithm used by the model.","The diversity of tasks in the fine-tuning dataset.","The order in which tasks are presented during fine-tuning."],"answer":[0,2,3],"verified":"official","c":394,"rel":[["Jan-Apr 2025",8,1]]},{"q":"What are key challenges of soft prompts in prompt-based learning?","options":["Forward pass with them is computationally inefficient compared to that with hard prompts.","T cial","c":407,"rel":[["Jan-Apr 2025",9,1]]},{"q":"Considering the differentiable KG approach, which elements are typically learned jointly when training an end-to-end KGQA model?","options":["The textual question representation (e.g., BERT embeddings)","The graph structure encoding (e.g., GCN or transformer-based graph embeddings)","Predefined logical forms to ensure interpretability","The final answer selection mechanism that identifies which node(s) in the graph satisfy the question"],"answer":[0,1,3],"verified":"official","c":408,"rel":[["Jan-Apr 2025",9,1]]},{"q":"Uniform negative sampling can have high variance and may require large number of samples. Why is that the case?","options":["Because the margin-based loss cannot converge without big mini-batches.","Because randomly picking negative entities does not guarantee close or challenging negatives, causing unstable training estimates.","Because negative sampling must ensure every possible negative triple is covered.","Because the number of relations in the KG is too large for small number of samples."],"answer":[1],"verified":"official","c":409,"rel":[["Jan-Apr 2025",9,1]]},{"q":"In testing embedding and score quality for KG completion, mean rank and hits@K are typical metrics. What does hits@K specifically measure in this context?","options":["The percentage of queries for which the correct answer appears in the top-K of the ranked list.","The reciprocal of the rank of the correct answer.","The probability of the correct answer appearing as the highest scored candidate.","The margin of the correct triple score relative to all negative triples."],"answer":[0],"verified":"official","c":410,"rel":[["Jan-Apr 2025",9,1]]},{"q":"In the TransE model, the scoring function for a triple (s, r, o) is typically defined as f(s, r, o) = || e_s + e_r − e_o || where e_s, e_r, e_o are embeddings of the subject, relation, and object, respectively. Which statement best explains what a low value of f(s, r, o) indicates in this presentative data conditions."],"answer":[3],"verified":"official","c":418,"rel":[["Jul-Oct 2025",10,1],["Jan-Apr 2025",10,1]]},{"q":"Which best summarizes the function of the unembedding matrix W_U?","options":["It merges the queries and keys for each token before final classification.","It converts the final residual vector into vocabulary logits for next-token prediction.","It is used for normalizing the QK and OV circuits so that their norms match.","It acts as a second attention layer that aggregates multiple heads."],"answer":[1],"verified":"official","c":419,"rel":[["Jul-Oct 2025",10,1],["Jan-Apr 2025",10,1]]},{"q":"Which definition best matches an induction head as discovered in certain Transformer circuits?","options":["A head that specifically attends to punctuation tokens to determine sentence boundaries","A feed-forward sub-layer specialized for outputting next-token probabilities for out-of-distribution tokens","A head that looks for previous occurrences of a token A, retrieves the token B that followed it last time, and then predicts B again","A masking head that prevents the model from looking ahead at future tokens"],"answer":[2],"verified":"official","c":420,"rel":[["Jul-Oct 2025",10,1],["Jan-Apr 2025",10,1]]},{"q":"In mechanistic interpretability, how can we define ‘circuit’?","options":["A data pipeline for collecting training examples in an autoregressive model","A small LSTM module inserted into a Transformer for additional memory","A device external to the neural network used to fine-tune certain parameters after training","A subgraph of the neural network hypothesized to implement a specific function or behaviour"],"answer":[3],"verified":"official","c":421,"rel":[["Jul-Oct 2025",10,1],["Jan-Apr 2025",10,1]]},{"q":"Which best describes the role of Double Quantization in QLoRA?","options":["It quantizes the attention weights twice to achieve 1-bit representations.","It reinitializes parts of the model with random bit patterns for improved regularization.","It quantizes the quantization constants themselves for additional memory savings.","It systematically reverts partial quantized weights back to FP16 whenever performance degrades."],"answer":[2],"verified":"official","c":422,"rel":[["Jul-Oct 2025",10,1],["Jan-Apr 2025",10,1]]},{"q":"Which of the following are true about sequence-level distillation for LLMs?","options":["It trains a student model by matching the teacher’s sequence outputs (e.g., predicted token sequences) rather than just individual token distributions.","It requires storing only the top-1 predictions from the teacher model for each token.","It can be combined with word-level distillation to transfer both local and global knowledge.","It forces the teacher to produce a chain-of-thought explanation for each example."],"answer":[0,2],"verified":"official","c":423,"rel":[["Jul-Oct 2025",10,1],["Jan-Apr 2025",10,1]]}]},{"year":2026,"session":"Jan-Apr 2026","week":11,"source":"https://github.com/Shivammittal13ai/Introduction-to-Large-Language-Models_NPTEL-2026/blob/main/Assignments/Jan-Apr_2026%20(1-12).zip (Week 11 Solution.pdf) (Accepted Answers: official NPTEL assignment solution PDF for noc26_cs88)","questions":[{"q":"What is the main modification that SimplE makes to DistMult-like models to handle asymmetric relations?","options":["Replacing entity embeddings with random fixed vectors","Introducing separate entity embeddings for subject and object roles, along with inverse relations","Restricting the rank of the relation tensor to 1","Using negative sampling for half of the triple set"],"answer":[1],"verified":"official","c":424,"rel":[["Jul-Oct 2026",11,0],["Jan-Apr 2025",11,1]]},{"q":"Which statements correctly characterize the basic DistMult approach for knowledge graph completion?","options":["Each relation r is parameterized by a full D×D matrix that can capture asymmetric relations.","The relation embedding is a diagonal matrix, leading to a multiplicative interaction of entity embeddings.","DistMult struggles with non-symmetric relations because score(s, r, o) = a_s^T M_r a_o is inherently symmetric in s and o.","DistMult’s performance is typically tested only on fully symmetric KGs."],"answer":[1,2],"verified":"official","c":425,"rel":[["Jul-Oct 2025",11,1],["Jan-Apr 2025",11,1]]},{"q":"Which statements about the ComplEx extension of DistMult are true?","options":["It uses complex-valued embeddings to better capture asymmetric or anti-symmetric relations.","It replaces the multiplication in DistMult with element-wise addition of real-valued vectors.","For a perfectly symmetric relation, one could set the imaginary part of the relation embedding to zero.","ComplEx requires each entity vector to be unit norm in the complex plane."],"answer":[0,2],"verified":"official","c":426,"rel":[["Jul-Oct 2026",11,0],["Jan-Apr 2025",11,1]]},{"q":"Which best describes the main advantage of using a factorized representation (e.g., DistMult, ComplEx) for large KGs?","options":["It enforces that every relation in the KG be perfectly symmetric.","It ensures each entity is stored as a one-hot vector, simplifying nearest-neighbour queries.","It collapses the entire KG into a single scalar value.","It significantly reduces parameters and enables generalization to unseen triples by capturing low-rank structure."],"answer":[3],"verified":"official","c":427,"rel":[["Jul-Oct 2025",11,1],["Jan-Apr 2025",11,1]]},{"q":"Which statement best describes the reshaping of a 3D KG tensor X ∈ R^{|E|×|R|×|E|} into a matrix factorization problem?","options":["One axis remains for subject, one axis remains for object, and relations are combined into a single expanded axis.","The subject dimension is repeated to match the relation dimension, resulting in a 2D matrix.","Each subject–relation pair is collapsed into a single dimension, while objects remain as separate entries.","The entire KG is vectorized into a 1D array and then factorized with an SVD approach."],"answer":[2],"verified":"official","c":428,"rel":[["Jul-Oct 2025",11,1],["Jan-Apr 2025",11,1]]},{"q":"Which key property of hierarchical relationships (e.g. is-a, transitivity) motivates the exploration of specialized embedding methods over standard Euclidean KG embeddings?","options":["Symmetry in the relation (A, is-a, B) implying (B, is-a, A)","Frequent presence of cycles in hierarchical graphs","Transitivity in the form (camel, is-a, mammal) and (mammal, is-a, animal) ⟹ (camel, is-a, animal)","The high dimensionality of the entity embeddings"],"answer":[2],"verified":"official","c":429,"rel":[["Jul-Oct 2026",11,0],["Jan-Apr 2025",11,1]]},{"q":"Which of the following statements correctly describe hyperbolic (Poincare) embeddings for hierarchical data?","options":["They map nodes onto a disk (or ball) such that large branching factors can be represented with lower distortion than in Euclidean space.","Distance grows slowly near the centre and becomes infinite near the boundary, making it naturally suited for tree-like structures.","They require each node to be embedded on the surface of the Poincare disk of radius 1.","They can achieve arbitrarily low distortion embeddings for trees with the same dimension as Euclidean space."],"answer":[0,1],"verified":"official","c":430,"rel":[["Jul-Oct 2025",11,1],["Jan-Apr 2025",11,1]]},{"q":"Why might a partial-order-based approach (like order embeddings) be beneficial for modelling ‘is-a’ relationships compared to purely distance-based approaches?","options":["They explicitly encode the ancestor–descendant relation as a coordinate-wise inequality or containment.","They can represent negative correlations (i.e., sibling vs. ancestor) more easily than distance metrics.","They inherently guarantee transitive closure of the hierarchy in the learned embedding space.","They do not rely on pairwise distances but use a notion of coordinate-wise ordering or interval containment."],"answer":[0,3],"verified":"official","c":431,"rel":[["Jul-Oct 2025",11,1],["Jan-Apr 2025",11,1]]},{"q":"Which statement about box embeddings in hierarchical modelling is most accurate?","options":["Each entity or type is assigned a single real-valued vector, ignoring bounding volumes.","Containment I_x ⊆ I_y in all dimensions encodes x ≺ y.","They rely on spherical distances around a central node to measure tree depth.","They cannot be used to represent set intersections or partial overlap."],"answer":[1],"verified":"official","c":432,"rel":[["Jul-Oct 2025",11,1],["Jan-Apr 2025",11,1]]},{"q":"What is a key challenge with axis-aligned open-cone (order) embeddings for hierarchical KG data?","options":["They enforce that all sibling categories have identical cone apices, which causes overlap.","They require symmetrical relationships for all edges.","They do not allow partial orders to be extended to total orders.","The volume (measure) of cones is the same regardless of how “broad” or “narrow” the cone is, making sub-categories indistinguishable by volume."],"answer":[3],"verified":"official","c":433,"rel":[["Jan-Apr 2025",11,1]]}]},{"year":2026,"session":"Jan-Apr 2026","week":12,"source":"https://github.com/Shivammittal13ai/Introduction-to-Large-Language-Models_NPTEL-2026/blob/main/Assignments/Jan-Apr_2026%20(1-12).zip (Week 12 Solution.pdf = print of a graded noc26_cs88 submission, due 2026-04-15) (Accepted Answers: graded submission print with 'Accepted Answers' block)","questions":[{"q":"Which statements correctly characterize “bias” in the context of LLMs? 1. Bias can generate objectionable or stereotypical views in model outputs. 2. Bias is always intentionally introduced by malicious data curators. 3. Bias can cause harmful real-world impacts such as reinforcing discrimination. 4. Bias only affects low-resource languages; high-resource languages are unaffected.","options":["1 and 2","1 and 3","2 and 4","1, 3, and 4"],"answer":[1],"verified":"official","c":102,"rel":[["Jul-Oct 2025",12,0],["Jan-Apr 2025",12,0]]},{"q":"The Stereotype antic role of each argument with respect to the ___________ of the sentence.","options":["noun phrase","subject","predicate","adjunct"],"answer":[2],"c":343,"rel":[["Jul-Oct 2025",1,1],["Jan-Apr 2025",1,1]]}]},{"year":2026,"session":"Jul-Oct 2026","week":2,"source":"https://github.com/rahulchaauhaan/nptel-intro-to-llm-pratice (src/data/weeks/week2.js: question text, checked against video OCR); answers = vote across solution videos: https://www.youtube.com/watch?v=gbH36K1HuT8 (Coding Solutions); https://www.youtube.com/watch?v=3I6x83YnGa8 (Engineering Study Desk); https://www.youtube.com/watch?v=SqplWrFe3dQ (NPTEL ASSIGNMENTS); https://www.youtube.com/watch?v=SJMJiRk5Uag (NPTEL Solver); https://www.youtube.com/watch?v=CPK9saXJ57Q (SwaVIDYA) (no official Accepted Answers found for this run)","questions":[{"q":"Which of the following has the least direct effect on a model's perplexity over a fixed test set?","options":["Vocabulary size","Probability assigned to the test sentences","Number of tokens in the test set","Average sentence length"],"answer":[3],"explanation":"All channels marked 'Average sentence length': perplexity over a fixed test set depends on total probability and token count, not on how tokens are grouped into sentences.","c":122},{"q":"What is the central task of a probabilistic language model?","options":["Translating between languages","Assigning probabilities to word sequences (predicting the next word)","Clustering documents by topic","Extracting named entities"],"answer":[1],"c":123},{"q":"Which equation correctly expresses the chain rule for a 3-word sentence?","options":["P(w1, w2, w3) = P(w1) × P(w2|w1) × P(w3|w1, w2)","P(w1, w2, w3) = P(w1) + P(w2|w1) + P(w3|w2)","P(w1, w2, w3) = P(w1) × P(w2) × P(w3)","P(w1, w2, w3) = P(w3|w2) × P(w2|w1)"],"answer":[0],"c":234,"rel":[["Jul-Oct 2025",2,1]]},{"q":"Which assumption allows n-gram models to reduce computation?","options":["Bayes Assumption","Chain Rule","Independence Assumption","Markov Assumptio r","Both merge the pair with the highest raw co-occurrence frequency","WordPiece merges the pair maximising Frequency(A) × Frequency(B) / Frequency(A, B)"],"answer":[0],"c":143},{"q":"Which of the following statements about subword tokenization are true?","options":["It guarantees that every word in the test set is present in the vocabulary as a single token.","Rare and morphologically complex words are split into meaningful subword units.","It offers a middle ground between word-level and character-level tokenization.","It keeps the vocabulary size bounded while still being able to represent unseen words."],"answer":[1,2,3],"c":144,"rel":[["Jan-Apr 2026",4,0]]},{"q":"Consider a word-context count matrix where: w1 = [1, 1, 0, 1] and w2 = [1, 0, 1, 1] Compute the cosine similarity between w1 and w2.","options":["0.516","0.867","0.4","0.712"],"answer":[0],"explanation":"w1 = [2,0,3,1,4], w2 = [1,3,0,2,2]: dot = 12, |w1| = sqrt(30), |w2| = sqrt(18), cos = 12/sqrt(540) = 0.516.","c":145},{"q":"Why is Word2Vec training described as self-supervised?","options":["The training labels are produced by human annotators before training begins.","The corpus itself supplies the labels, since the context of a word acts as its supervision signal.","The model supervises its own learning rate schedule during training.","An external labelled dataset is required to validate every update."],"answer":[1],"c":146},{"q":"What is the purpose of negative sampling in Word2Vec training?","options":["To reduce the dimensionality of the learned word vectors","To guarantee that gradient descent converges to a global optimum","To avoid computing the softmax normalisation over the entire vocabulary","To remove stop words from the training corpus"],"answer":[2],"c":147,"rel":[["Jul-Oct 2025",4,0]]},{"q":"Which of the following representations handles Out-Of-Vocabulary (OOV) words best?","options":["One-hot encoding","Count-based SVD embeddings","CBOW Word2Vec","FastText embeddings"],"answer":[3],"c" s?","options":["The encoder cannot process variable-length inputs.","The whole source sequence has to be compressed into a single fixed-length context vector.","The decoder cannot condition on its own previously generated tokens.","The model requires the source and target sequences to be of equal length."],"answer":[1],"c":153},{"q":"Which of the following is a correct statement about the encoder-decoder architecture?","options":["The encoder emits one output token per timestep during decoding.","The decoder produces a summary representation of the input sequence.","The decoder generates each output conditioned on the encoder representation and on its own previously generated tokens.","The encoder retains only the first token of the input sequence."],"answer":[2],"c":154,"rel":[["Jul-Oct 2025",5,0]]},{"q":"Why are RNNs preferred over fixed-window feed-forward neural language models?","options":["They always have a larger number of parameters.","They can process sequences of arbitrary length and share the same weights across timesteps.","They remove the need for a word embedding layer.","None of the above."],"answer":[1],"c":155,"rel":[["Jan-Apr 2026",5,0],["Jul-Oct 2025",5,0],["Jan-Apr 2025",5,0]]},{"q":"Which of the following statements about Seq2Seq models are true? (i) The generation of the target sequence is conditioned on the source sequence. (ii) In the basic model, the encoder compresses the input into a fixed-size vector representation. (iii) The input and output sequences must have the same length.","options":["(i) and (ii)","(ii) only","(iii) only","(i), (ii) and (iii)"],"answer":[0],"c":376,"rel":[["Jan-Apr 2026",5,1],["Jan-Apr 2025",5,1]]}]},{"year":2026,"session":"Jul-Oct 2026","week":6,"source":"https://github.com/rahulchaauhaan/nptel-intro-to-llm-pratice (src/data/weeks/week6.js: question text, checked against video OCR); answers = vote across solution videos: https://www.youtube.com/watch?v=TLjvC4gi0Fs (Engineering Study Desk); https://www.youtube.co on step.","They linearly combine the forward and backward language model losses during unsupervised pre-training."],"answer":[1],"c":168},{"q":"Which model architecture family is natively suited for sequence-to-sequence tasks such as Machine Translation and Abstractive Summarization without requiring structural modifications or prompt-based workarounds?","options":["Encoder-only models (e.g., BERT, RoBERTa)","Encoder-Decoder models (e.g., BART, T5)","Character-level CNNs with unidirectional LSTMs","Pure classifier heads with static word embeddings"],"answer":[1],"c":169},{"q":"What major modifications were introduced in the GPT-2 architecture and training recipe compared to the original GPT-1?","options":["Relocating layer normalization to the input of each sub-block (pre-LN) and adding a layer norm after the final self-attention block.","Expanding the vocabulary size to ~50,257 and increasing the context window to 1024 tokens.","Scaling residual layer weights at initialization by a factor of 1/√(2N).","All of the above."],"answer":[3],"c":170},{"q":"Which of the following statement(s) regarding token representations and pre-training objectives is/are TRUE?","options":["ELMo employs a character-level CNN at the input layer to handle out-of-vocabulary (OOV) tokens and capture morphological subword patterns.","BERT generates dynamic, context-dependent token representations using Masked Language Modeling and Next Sentence Prediction.","Standard autoregressive decoder-only models maximize the bidirectional context likelihood ∏_{t=1}^{T} P(w_t | w_1, ..., w_T).","BART incorporates a bidirectional encoder with an autoregressive decoder and trains on various noising schemes including token deletion and sentence permutation."],"answer":[0,1,3],"explanation":"One channel also ticked (C); option C is false (decoder-only models factorise left-to-right, not over the full bidirectional context).","c":171},{"q":"The einsum function in NumPy is used as a generalized operation for What is the primary purpose of that KL term?","options":["To make each gradient update cheaper to compute","To keep the optimised policy close to the reference model, so it does not drift into degenerate high-reward behaviour","To increase the entropy of the sampled responses","To remove annotator bias from the preference dataset"],"answer":[1],"c":180},{"q":"Which of the following statements about REINFORCE-style policy optimisation for language models are true?","options":["The log-derivative trick yields an unbiased estimator of the policy gradient from sampled responses.","Weighting the token-level log-probabilities by an advantage rather than the raw return reduces gradient variance.","Importance ratios are clipped when several updates are taken on samples drawn from an older policy.","The reward function must be differentiable with respect to the model parameters."],"answer":[0,1,2],"c":181},{"q":"Let ratio_t = π_new(a_t|s_t) / π_old(a_t|s_t), and let ε > 0 be the clipping parameter. When the token-level advantage A_t is negative, the PPO-CLIP objective at step t reduces to maximising:","options":["min( ratio_t, 1 + ε ) A_t","max( ratio_t, 1 - ε ) A_t","min( ratio_t, 1 - ε ) A_t","max( ratio_t, 1 + ε ) A_t"],"answer":[1],"explanation":"For A_t < 0, min(r A, clip(r, 1-eps, 1+eps) A) = A * max(r, 1-eps). Only one channel (NALANDA) showed this answer; it matches the derivation.","c":182}]},{"year":2026,"session":"Jul-Oct 2026","week":9,"source":"https://github.com/rahulchaauhaan/nptel-intro-to-llm-pratice (src/data/weeks/week9.js: question text, checked against video OCR); answers = vote across solution videos: https://www.youtube.com/watch?v=lkunyefEkaw (Engineering Study Desk); https://www.youtube.com/watch?v=G9aaGXavmao (NALANDA); https://www.youtube.com/watch?v=3sALbI8GhjE (NPTEL ASSIGNMENTS) (no official Accepted Answers found for this run)","questions":[{"q":"Which statement best explains why a knowledge graph (KG) is a more flexible representation than a traditional relational knowledge base?","options":["A KG needs no schema at all, whereas a relational knowledge base always does.","A KG stores entities as nodes joined by typed edges, so heterogeneous relations and multi-hop traversal are represented directly.","A KG stores every fact as a hypergraph, which removes all redundancy.","A KG makes textual sources unnecessary because it stores every possible fact."],"answer":[1],"c":183},{"q":"Entity and relation alignment across knowledge graphs in different languages is a hard problem. Which of the following genuinely contribute to effective alignment?","options":["Transliteration and cross-lingual string matching over entity labels","Comparing the neighbourhood structure of candidate entities in the two graphs","Requiring that every alias of an entity appears identically in both graphs","Matching relations purely on the lexical similarity of their names, ignoring context"],"answer":[0,1],"c":184},{"q":"Which of the following are learned jointly in an end-to-end differentiable KGQA system, as opposed to a semantic parsing approach?","options":["A dense representation of the natural language question","Embeddings of the entities and relations in the graph","A hand-specified logical form for each question template","The scoring mechanism that selects which node answers the question"],"answer":[0,1,3],"c":185},{"q":"Which statements correctly describe the local closed-world assumption used when generating negatives for KG training?","options":["Triples not present in the graph are treated as false during training.","It is strictly correct, because knowledge graphs are complete by construction.","Some sampled negatives are in fact missing true triples, so the training signal carries label noise.","It removes the need for a separate validation split."],"answer":[0,2],"c":186},{"q":"A KG completion model is trained with a softmax over entities to model P(o | s, r). Which of the following statements about replacing the full softmax with a sampled one are correct?","options":["The exact denominator requires scoring every entity in the graph, which is prohibitively expensive for large KGs.","The true object must be kept in the sampled denominator, otherwise the estimate is biased.","Sampling negatives uniformly tends to produce easy negatives, giving a high-variance training signal.","Sampled softmax removes the need to learn entity embeddings."],"answer":[0,1,2],"c":187},{"q":"A model is trained with the pairwise hinge loss max{0, m + f(s', r, o') - f(s, r, o)}, where (s, r, o) is a positive triple, (s', r, o') a sampled negative, m > 0 the margin, and a higher f means a more plausible triple. The loss is strictly positive when:","options":["f(s, r, o) ≥ f(s', r, o') + m","f(s, r, o) < f(s', r, o') + m","f(s', r, o') ≥ f(s, r, o) + m","only when m = 0"],"answer":[1],"c":188},{"q":"For a single test query, a KG completion model ranks the correct entity 4th out of 100 candidates. What are hits@1, hits@5 and the reciprocal rank for this query?","options":["0, 1, 0.25","1, 1, 4","0, 0, 0.25","0, 1, 4"],"answer":[0],"explanation":"Rank 4: hits@1 = 0, hits@5 = 1, reciprocal rank = 1/4.","c":189},{"q":"Which statements about filtered evaluation for KG completion are correct?","options":["Candidate entities that form known true triples in the training or validation data are removed from the ranked list before the test entity is scored.","It avoids penalising the model for placing a different, genuinely correct answer above the held-out one.","It can only ever lower the reported score compared with the raw setting.","It changes ranking metrics such as MRR and hits@K."],"answer":[0,1,3],"c":190},{"q":"Why can TransE not represent a non-trivial symmetric relation?","options":["Because the norm of every relation embedding in TransE is constrained to 1.","Because symmetry would require both s + r ≈ o and o + r ≈ s, which forces r ≈ 0 and collapses the relation.","Because the subject and object embeddings would have to be orthogonal.","Because TransE uses complex-valued embeddings that cannot encode symmetry."],"answer":[1],"c":191},{"q":"Which of the following is the RotatE scoring function?","options":["f(s, r, o) = ‖ s + r - o ‖","f(s, r, o) = ‖ s ⊙ r - o ‖, where every component of r has modulus 1","f(s, r, o) = s^T M_r o, with M_r a full matrix","f(s, r, o) = - <s, r, o>, the real part of a three-way inner product"],"answer":[1],"explanation":"NALANDA and Engineering Study Desk give B; one channel's ticks also matched option D, which is not the RotatE score.","c":192,"rel":[["Jul-Oct 2025",9,0]]}]},{"year":2026,"session":"Jul-Oct 2026","week":10,"source":"https://github.com/rahulchaauhaan/nptel-intro-to-llm-pratice (src/data/weeks/week10.js: question text, checked against video OCR); answers = vote across solution videos: https://www.youtube.com/watch?v=QNl9wrCvmX4 (Engineering Study Desk); https://www.youtube.com/watch?v=B7QQnKcFDcw (NALANDA); https://www.youtube.com/watch?v=zvwxAuQtl74 (NPTEL ASSIGNMENTS); https://www.youtube.com/watch?v=mLe6ZiYooR8 (SwaVIDYA) (no official Accepted Answers found for this run)","questions":[{"q":"In LoRA, the update to a frozen weight matrix W of shape d × k is parameterised as ΔW = B A, with B of shape d × r and A of shape r × k. For d = k = 4096 and rank r = 8, how many trainable parameters does this adapter introduce for that one matrix?","options":["65,536","32,768","16,777,216","8,192"],"answer":[0],"explanation":"d*r + r*k = 4096*8 + 8*4096 = 65,536.","c":193},{"q":"Where do prefix tuning and adapters inject their task-specific parameters in a Transformer?","options":["Prefix tuning inserts bottleneck feed-forward modules inside each block, while adapters prepend trainable vectors to the input.","Prefix tuning prepends trainable key and value vectors at every layer, while adapters insert small bottleneck modules inside the blocks.","Both modify only the final output projection, differing in how they initialise it.","Both work purely by altering the attention mask."],"answer":[1],"c":194,"rel":[["Jan-Apr 2026",10,0],["Jul-Oct 2025",10,0],["Jan-Apr 2025",10,0]]},{"q":"Which of the following statements about extensions of LoRA are correct?","options":["QLoRA trains low-rank adapters on top of a base model quantised to 4 bits.","DyLoRA trains over a range of ranks so that a rank can be selected afterwards without retraining.","AdaLoRA distributes a parameter budget across modules by importance instead of fixing one rank everywhere.","LoRA adapters cannot be folded back into the base weights, so they always add inference latency."],"answer":[0,1,2],"c":195,"rel":[["Jan-Apr 2026",10,0],["Jul-Oct 2025",10,0],["Jan-Apr 2025",10,0]]},{"q":"Why does unstructured magnitude pruning often fail to deliver a wall-clock speedup even at high sparsity?","options":["Because it removes entire attention heads and so changes the output dimension.","Because the surviving weights are scattered irregularly, and dense kernels cannot exploit that sparsity without specialised hardware or sparse formats.","Because the pruned model must be retrained from random initialisation.","Because only bias terms are eligible for removal."],"answer":[1],"c":196},{"q":"What distinguishes quantization-aware training (QAT) from post-training quantization (PTQ)?","options":["QAT simulates the quantisation error during training so the weights adapt to it, while PTQ quantises an already trained model using a small calibration set.","QAT is applied only to activations and PTQ only to weights.","PTQ requires more compute than QAT because it retrains every layer.","PTQ can only be applied to models below one billion parameters."],"answer":[0],"c":197},{"q":"In QLoRA, what does double quantization actually quantise a second time?","options":["The attention weights, taken down to 1 bit in a second pass.","The gradients, before they are accumulated into the optimiser state.","The quantisation constants themselves, that is the per-block scale factors produced by the first quantisation.","Portions of the model that are reverted to FP16 whenever accuracy drops."],"answer":[2],"c":198},{"q":"Which of the following statements about knowledge distillation for language models are correct?","options":["Word-level distillation trains the student to match the teacher's output distribution at each token position.","Sequence-level distillation trains the student on sequences generated by the teacher rather than on per-token distributions alone.","The two can be combined so the student learns both local token probabilities and global sequence structure.","Sequence-level distillation requires the teacher to emit a chain-of-thought explanation for every example."],"answer":[0,1,2],"c":199},{"q":"In mechanistic interpretability, what is meant by a circuit?","options":["A pipeline that collects and batches training examples for an autoregressive model","A recurrent module inserted into a Transformer to give it additional memory","A subgraph of the network - particular heads, neurons and connections - hypothesised to implement a specific behaviour","An external tool used to adjust parameters after training has finished"],"answer":[2],"c":200},{"q":"In-context copying of the pattern [A][B] ... [A] → [B] is attributed to induction heads. Which description matches the mechanism?","options":["A single head that attends to punctuation to segment the sequence into repeated units","A previous-token head that writes information about the preceding token, composed with a later head that attends to the token following the earlier occurrence of A and copies it","A feed-forward sub-layer that raises the probability of any token seen earlier in the context","A head that masks future positions so that repeated tokens cannot be attended to"],"answer":[1],"explanation":"Single-choice; one detection also matched C, but all other sources give B.","c":201},{"q":"In the transformer circuits framing, what do the QK and OV circuits respectively determine for an attention head?","options":["QK determines where the head attends, OV determines what is read from the attended position and written to the output.","QK determines what is written to the output, OV determines where the head attends.","Both determine how positional information is encoded.","Both are normalisation terms that keep the attention scores in a fixed range."],"answer":[0],"c":202}]},{"year":2026,"session":"Jul-Oct 2026","week":11,"source":"https://github.com/rahulchaauhaan/nptel-intro-to-llm-pratice (src/data/weeks/week11.js: question text, checked against video OCR); answers = vote across solution videos: https://www.youtube.com/watch?v=-vtPZ7wiybQ (Engineering Study Desk); https://www.youtube.com/watch?v=gGb7lVF00tc (NALANDA); https://www.youtube.com/watch?v=SFNZyNQgDs4 (NPTEL ASSIGNMENTS); https://www.youtube.com/watch?v=GwJnR3z8y5Q (Pbit P_bit_); https://www.youtube.com/watch?v=qXMl0MyKxcA (SwaVIDYA) (no official Accepted Answers found for this run)","questions":[{"q":"Which statements correctly characterise the DistMult model for knowledge graph completion?","options":["Each relation is parameterised by a full D × D matrix, which lets it capture asymmetric relations.","The relation is represented by a diagonal matrix, so the score is a multiplicative interaction of the entity embeddings.","Because the diagonal form makes the score symmetric in the subject and object, it cannot distinguish a relation from its inverse.","DistMult can only be evaluated on knowledge graphs whose relations are all symmetric."],"answer":[1,2],"c":203},{"q":"In DistMult the score of a triple is the sum over dimensions of the element-wise product of the subject, relation and object embeddings. Given: s = [1, 2, 0], r = [2, -1, 3], o = [3, 1, 4] What are the scores of (s, r, o) and of the reversed triple (o, r, s)?","options":["4 and 4","4 and -4","4 and 12","6 and 4"],"answer":[0],"explanation":"Score(s,r,o) = 1*2*3 + 2*(-1)*1 + 0*3*4 = 4; DistMult is symmetric, so the reversed triple also scores 4.","c":204},{"q":"Which statements about the ComplEx extension of DistMult are true?","options":["It moves the embeddings into the complex domain and takes the complex conjugate of the object embedding in the score.","It replaces multiplicative interaction with element-wise addition of real-valued vectors.","Setting the imaginary part of a relation embedding to zero recovers a symmetric, DistMult-like score.","Every entity embedding must have unit norm for the model to be valid."],"answer":[0,2],"explanation":"Four sources give A and C; Engineering Study Desk ticked only A.","c":205,"rel":[["Jan-Apr 2026",11,0],["Jan-Apr 2025",11,0]]},{"q":"What is the main modification SimplE makes to DistMult-style models in order to handle asymmetric relations?","options":["It replaces the entity embeddings with fixed random vectors.","It gives every entity two embeddings, one for its subject role and one for its object role, and learns an embedding for each inverse relation.","It constrains the relation tensor to rank one.","It samples negatives for only half of the training triples."],"answer":[1],"c":206,"rel":[["Jan-Apr 2026",11,0],["Jan-Apr 2025",11,0]]},{"q":"What is the main advantage of a factorised representation such as DistMult or ComplEx for a large knowledge graph?","options":["It forces every relation in the graph to be symmetric.","It stores each entity as a one-hot vector, which simplifies nearest-neighbour search.","It collapses the graph into a single scalar summary.","It replaces the full adjacency tensor with low-rank factors, which cuts the parameter count and lets the model generalise to unseen triples."],"answer":[3],"c":207},{"q":"How is a 3D knowledge graph tensor of shape |E| × |R| × |E| commonly reshaped into a matrix factorisation problem?","options":["The entire tensor is flattened into a 1D array and factorised with SVD.","Each subject-relation pair is collapsed into a single index along one axis, while the objects remain along the other axis.","The subject dimension is repeated until it matches the relation dimension.","The relation axis is discarded and the remaining two axes are factorised."],"answer":[1],"c":208},{"q":"Which property of hierarchical relations motivates specialised embedding geometries rather than standard Euclidean KG embeddings?","options":["Symmetry: (A, is-a, B) implying (B, is-a, A)","The frequent presence of cycles in a taxonomy","Transitivity: (camel, is-a, mammal) and (mammal, is-a, animal) implying (camel, is-a, animal)","The high dimensionality of the entity embeddings"],"answer":[2],"c":209,"rel":[["Jan-Apr 2026",11,0],["Jan-Apr 2025",11,0]]},{"q":"Which statements about hyperbolic (Poincaré ball) embeddings for hierarchical data are correct?","options":["The volume available grows exponentially with radius, which matches the exponential growth in the number of nodes at each level of a tree.","Distances grow slowly near the centre and increase sharply towards the boundary, so depth in a hierarchy maps naturally onto radius.","Every node must be placed exactly on the boundary of the unit ball.","They give arbitrarily low distortion for any graph, not only tree-like ones."],"answer":[0,1],"explanation":"Four sources give A and B; Engineering Study Desk ticked only A.","c":210},{"q":"Why can a partial-order approach such as order embeddings suit 'is-a' relations better than a purely distance-based one?","options":["It encodes the ancestor-descendant relation directly as a coordinate-wise inequality or containment.","It guarantees the full transitive closure of the hierarchy is recovered without any training.","It represents sibling and ancestor pairs as negatively correlated vectors.","It replaces symmetric pairwise distance with an asymmetric notion of ordering, which matches the asymmetry of is-a."],"answer":[0,3],"c":211},{"q":"Which limitation of axis-aligned cone embeddings do box embeddings address?","options":["Cones cannot represent containment at all, whereas boxes can.","A cone has the same measure regardless of how broad or narrow it is, so the size of a category cannot be read off its region, whereas a box has a finite volume that can.","Cones require all sibling categories to share an apex.","Cones cannot be trained with gradient descent."],"answer":[1],"c":212}]},{"year":2026,"session":"Jul-Oct 2026","week":12,"source":"https://github.com/rahulchaauhaan/nptel-intro-to-llm-pratice (src/data/weeks/week12.js: question text, checked against video OCR); answers = vote across solution videos: https://www.youtube.com/watch?v=k7VUZzmTUEk (NALANDA); https://www.youtube.com/watch?v=jjkl4Rp1w1Q (NPTEL ASSIGNMENTS); https://www.youtube.com/watch?v=LA4JBCk6GSw (SwaVIDYA) (no official Accepted Answers found for this run)","questions":[{"q":"Which of the following statements about bias in large language models are correct? 1. Stereotypical associations can appear in model outputs even when no one involved in building the model intended them. 2. Bias enters only during fine-tuning and never from the pretraining corpus. 3. Biased outputs can cause real-world harm by reinforcing discrimination against particular groups. 4. A model that scores highly on standard accuracy benchmarks is necessarily free of bias.","options":["1 and 2","1 and 3","2 and 4","1, 3 and 4"],"answer":[1],"c":213},{"q":"In the StereoSet framework, what does a Stereotype Score (ss) of 50 indicate?","options":["The model refuses half of all prompts that mention a demographic group.","The model chooses the stereotypical and the anti-stereotypical association equally often, which is the ideal value for this metric.","Half of the model's completions are meaningless rather than meaningful.","The model's accuracy on the stereotype detection task is 50 percent."],"answer":[1],"c":214},{"q":"StereoSet reports the idealised CAT score as: icat = lms × min(ss, 100 - ss) / 50 For a model with a language modelling score lms = 80 and a stereotype score ss = 70, what is its icat?","options":["48","56","40","24"],"answer":[0],"explanation":"icat = 80 * min(70, 30) / 50 = 48.","c":215},{"q":"Which of the following are recognised sources of bias in large language models? 1. Skewed selection of training data, over-representing some topics or communities. 2. Reliance on older corpora, producing temporal bias against current usage and norms. 3. Over-representation of low-resource languages, producing what is termed linguistic inversion. 4. Dominance of a few high-resource languages, producing cultural bias in what the model treats as default.","options":["1 and 2 only","2 and 3 only","1, 2 and 4","1, 3 and 4"],"answer":[2],"c":216},{"q":"Which of the following best describes the 'regard' metric?","options":["A measure of how well a model can explain its own decision process.","The perplexity of a model on demographically sensitive text.","A classifier-assigned label capturing the attitude that generated text expresses towards a demographic group.","The proportion of occasions on which a model spontaneously corrects discriminatory language."],"answer":[2],"c":438,"rel":[["Jan-Apr 2026",12,1],["Jul-Oct 2025",12,1],["Jan-Apr 2025",12,1]]},{"q":"In bias mitigation with adversarial triggers, what is the aim of prepending a specially chosen token sequence to the prompt?","options":["To fine-tune the model parameters so the bias is removed permanently.","To overwrite the model's prior knowledge and effectively reset it.","To exploit the model's existing distribution so that biased associations in the continuation are neutralised or reversed.","To randomise the token order so the model becomes robust to input perturbation."],"answer":[2],"c":218},{"q":"Which steps make up the approach of improving response safety through in-context learning?","options":["Retrieving safety demonstrations that resemble the incoming user query.","Fine-tuning the model on newly labelled data after each generation.","Including the retrieved demonstrations in the prompt as examples that guide the response.","Sampling many responses and returning whichever opinion appears most often."],"answer":[0,2],"c":219,"rel":[["Jan-Apr 2026",12,0],["Jul-Oct 2025",12,0],["Jan-Apr 2025",12,0]]},{"q":"Which statements about the effect of high-resource (HRL) and low-resource languages (LRL) on model training are correct?","options":["LRLs tend to show higher performance because they are spoken by smaller populations.","HRLs contribute far more training data, so the model can overfit to the cultural perspectives carried in them.","LRLs are under-represented, so the model captures their cultural nuances poorly.","The dominance of HRLs is self-reinforcing, since better performance attracts more data and more investment."],"answer":[1,2,3],"c":220,"rel":[["Jan-Apr 2026",12,0],["Jul-Oct 2025",12,0],["Jan-Apr 2025",12,0]]},{"q":"What does counterfactual data augmentation mean as a debiasing technique?","options":["Generating synthetic examples with a second model and filtering them by a reward score.","Creating additional training examples by swapping demographic terms in existing text, so that associations are balanced across groups.","Removing every sentence that mentions a demographic group from the training corpus.","Adding a penalty term to the loss whenever the model generates a demographic term."],"answer":[1],"c":221},{"q":"The idea of a 'Responsible LLM' is presented as addressing which of the following?","options":["Bias and fairness alone","A set of concerns spanning fairness, explainability, robustness, privacy and security","Only the trade-off between training cost and carbon footprint","The deployment of purely rule-based output filters"],"answer":[1],"c":222}]},{"year":2025,"session":"Jul-Oct 2025","week":1,"source":"(Accepted Answers) Scribd prints of graded NPTEL noc25_cs161 assignment pages: https://www.scribd.com/document/927043987 ; https://www.scribd.com/document/941513164","questions":[{"q":"Which of the following best demonstrates the principle of distributional semantics?","options":["Words that co-occur frequently tend to share semantic properties.","Each word has a unique, fixed meaning regardless of context.","Syntax determines the entire meaning of a sentence.","Distributional semantics is unrelated to word embeddings."],"answer":[0],"verified":"official","c":223},{"q":"Which of the following words is least likely to be polysemous?","options":["Bank","Tree","Gravity","Idea"],"answer":[2],"verified":"official","c":224,"rel":[["Jul-Oct 2026",1,0]]},{"q":"Consider the following sentence pair: Sentence 1: Riya dropped the glass. Sentence 2: The glass broke. Does Sentence 1 entail Sentence 2?","options":["Yes","No"],"answer":[1],"verified":"official","c":225},{"q":"Which sentence contains a homonym?","options":["He wound the clock before bed.","She tied her hair in a bun.","I can’t bear the noise.","He likes to bat after lunch."],"answer":[3],"explanation":"This question carried 0 points in the graded assignment; the accepted answer is shown.","verified":"official","c":226,"rel":[["Jul-Oct 2026",1,0]]},{"q":"Which of the following relationships are incorrectly labeled?","options":["Car is a meronym of wheel.","Rose is a hyponym of flower.","Keyboard is a holonym of key.","Tree is a hypernym of oak."],"answer":[0],"verified":"official","c":227,"rel":[["Jul-Oct 2026",1,1]]},{"q":"_________ studies how context influences the interpretation of meaning.","options":["Syntax","Morphology","Pragmatics","Semantics"],"answer":[2],"verified":"official","c":228,"rel":[["Jul-Oct 2026",1,1]]},{"q":"In the sentence, “After Sita praised Radha, she smiled happily,” who does “she” most likely refer to?","options":["Sita","Radha","Ambiguous","Neither"],"answer":[2],"verified":"official","c":229},{"q":"Which of the following statements is true? (i) Word embeddings capture semantic similarity through context. (ii) Morphological analysis is irrelevant in LLMs. (iii) Hypernyms are more specific than hyponyms.","options":["Only (i)","Only (i) and (iii)","Only (ii) and (iii)","All of the above"],"answer":[0],"verified":"official","c":230,"rel":[["Jul-Oct 2026",1,1]]},{"q":"What issues can be observed in the following text? On a much-needed #workcation in beautiful Goa. Workin & chillin by d waves!","options":["Idioms","Non-standard English","Tricky Entity Names","Neologisms"],"answer":[1,3],"verified":"official","c":338,"rel":[["Jan-Apr 2026",1,1],["Jan-Apr 2025",1,1]]},{"q":"In semantic role labelling, we determine the semantic role of each argument with respect to the ___________ of the sentence.","options":["noun phrase","subject","predicate","adjunct"],"answer":[2],"verified":"official","c":343,"rel":[["Jul-Oct 2026",1,1],["Jan-Apr 2025",1,1]]}]},{"year":2025,"session":"Jul-Oct 2025","week":2,"source":"(Accepted Answers) Scribd prints of graded NPTEL noc25_cs161 assignment pages: https://www.scribd.com/document/927043995 ; https://www.scribd.com/document/941642559 ; https://www.scribd.com/document/941513164","questions":[{"q":"Which of the following does not directly affect perplexity?","options":["Vocabulary size","Sentence probability","Number of tokens","Sentence length"],"answer":[0],"verified":"official","c":233},{"q":"Which equation expresses the chain rule for a 4-word sentence?","options":["P(w1, w2, w3, w4) = P(w1) + P(w2|w1) + P(w3|w2) + P(w4|w3)","P(w1, w2, w3, w4) = P(w1) × P(w2|w1) × P(w3|w1, w2) × P(w4|w1, w2, w3)","P(w1, w2, w3, w4) = P(w1) × P(w2|w1) × P(w3|w2) × P(w4|w3)","P(w1, w2, w3, w4) = P(w4|w3) × P(w3|w2) × P(w2|w1) × P(w1)"],"answer":[1],"verified":"official","c":234,"rel":[["Jul-Oct 2026",2,1]]},{"q":"Which assumption allows n-gram models to reduce computation?","options":["Bayes Assumption","Chain Rule","Independence Assumption","Markov Assumption"],"answer":[3],"verified":"official","c":235,"rel":[["Jul-Oct 2026",2,1]]},{"q":"In a trigram language model, which of the following is a correct example of linear interpolation?","options":["P(wᵢ | wᵢ₋₂, wᵢ₋₁) = λ1·P(wᵢ | wᵢ₋₂, wᵢ₋₁)","P(wᵢ | wᵢ₋₂, wᵢ₋₁) = λ1·P(wᵢ | wᵢ₋₂, wᵢ₋₁) + λ2·P(wᵢ | wᵢ₋₁) + λ3·P(wᵢ)","P(wᵢ | wᵢ₋₂, wᵢ₋₁) = max(P(wᵢ | wᵢ₋₂, wᵢ₋₁), P(wᵢ | wᵢ₋₁))","P(wᵢ | wᵢ₋₂, wᵢ₋₁) = P(wᵢ)·P(wᵢ₋₁) / P(wᵢ₋₂)"],"answer":[1],"verified":"official","c":236},{"q":"A trigram model is equivalent to which order Markov model?","options":["3","2","1","4"],"answer":[1],"verified":"official","c":237},{"q":"Which smoothing technique leverages the number of unique contexts a word appears in?","options":["Good-Turing","Add-k","Kneser-Ney","Absolute Discounting"],"answer":[2],"verified":"official","c":238,"rel":[["Jan-Apr 2026",2,1],["Jul-Oct 2026",2,1]]},{"q":"For Question 8 to 9, consider the following corpus: <s>the sky is blue<\/s> <s>birds fly in the sky<\/s> <s>the blue birds sing<\/s> Assuming a bi-gram language model, calculate the probability of the sentence: <s>birds fly in the blue sky<\/s> Ignore the unigram probability of P(<s>) in your calculation.","options":["2/37","1/27","0","1/36"],"answer":[2],"explanation":"The bigram 'blue sky' never occurs in the corpus, so the MLE bigram probability (and hence the sentence probability) is 0. (The corpus preamble in the original says 'For Question 8 to 9' but applies to questions 7-8.)","verified":"official","c":239,"rel":[["Jan-Apr 2026",2,1],["Jul-Oct 2026",2,0]]},{"q":"Assuming a bi-gram language model, calculate the perplexity of the sentence: <s>birds fly in the blue sky<\/s> Please do not consider <s>and <\/s> as words of the sentence.","options":["271/4","271/5","91/6","None of these"],"answer":[3],"explanation":"Sentence probability is 0, so perplexity is infinite/undefined; none of the listed values.","verified":"official","c":240}]},{"year":2025,"session":"Jul-Oct 2025","week":3,"source":"(Accepted Answers) Scribd prints of graded NPTEL noc25_cs161 assignment pages: https://www.scribd.com/document/941513164","questions":[{"q":"In backpropagation, which method is used to compute the gradients?","options":["Gradient descent","Chain rule of derivatives","Matrix factorization","Linear regression"],"answer":[1],"verified":"official","c":354,"rel":[["Jul-Oct 2026",3,1],["Jan-Apr 2025",3,1]]},{"q":"Which of the following functions is not differentiable at zero?","options":["Sigmoid","Tanh","ReLU","Linear"],"answer":[2],"verified":"official","c":242,"rel":[["Jul-Oct 2026",3,1]]},{"q":"In the context of regularization, which of the following statements is true?","options":["L2 regularization tends to produce sparse weights","Dropout is applied during inference to improve accuracy","L1 regularization adds the squared weight penalties to the loss function","Dropout prevents overfitting by randomly disabling neurons during training"],"answer":[3],"verified":"official","c":243},{"q":"Which activation function is least likely to suffer from vanishing gradients?","options":["Tanh","Sigmoid","ReLU"],"answer":[2],"verified":"official","c":244,"rel":[["Jan-Apr 2026",3,1],["Jul-Oct 2026",3,1]]},{"q":"Which of the following equations correctly represents the derivative of the sigmoid function?","options":["σ(x) · (1 + σ(x))","σ(x)²","σ(x) · (1 − σ(x))","1 / (1 + e^x)"],"answer":[2],"verified":"official","c":245,"rel":[["Jul-Oct 2026",3,0]]},{"q":"What condition must be met for the Perceptron learning algorithm to converge?","options":["Learning rate must be zero","Data must be non-linearly separable","Data must be linearly separable","Activation function must be sigmoid"],"answer":[2],"verified":"official","c":246},{"q":"Which of the following logic functions requires a network with at least one hidden layer to model?","options":["AND","OR","NOT","XOR"],"answer":[3],"verified":"official","c":247},{"q":"Why is it necessary to include non-linear activation functions between layers in an MLP?","options":["Without them, the network is just a linear function","They prevent overfitting","They allow backpropagation to work"],"answer":[0],"verified":"official","c requencies"],"answer":[2],"verified":"official","c":255},{"q":"Why does SVD-based word embedding struggle with adding new words tot he vocabulary?","options":["It uses online learning","It lacks semantic interpretability","It assumes word order","It is computationally expensive to retrain"],"answer":[3],"verified":"official","c":256},{"q":"Which of the following best describes the term “distributional hypothesis” in NLP?","options":["Words with high frequency have greater meaning","Words are defined by their part-of-speech tags","A word’s meaning is characterized by the words around it","Words should be normalized before vectorization"],"answer":[2],"verified":"official","c":257},{"q":"In Word2Vec, similarity between word vectors is computed using Euclidean distance.","options":["True","False"],"answer":[1],"verified":"official","c":258},{"q":"Which method solves the problem of OOV (Out-Of-Vocabulary) words better?","options":["One-hot encoding","CBOW","Skip-gram with subsampling","FastText embedding"],"answer":[3],"verified":"official","c":259},{"q":"If the word \"economy\" occurs 4 times in a corpus, and \"growth\" appears in a window of 5 words around it 3 times, what is the entry for (economy, growth) in a term-context matrix?","options":["1","2","3","4"],"answer":[2],"verified":"official","c":260}]},{"year":2025,"session":"Jul-Oct 2025","week":5,"source":"(Accepted Answers) Scribd prints of graded NPTEL noc25_cs161 assignment pages: https://www.scribd.com/document/941642563 ; https://www.scribd.com/document/941513164","questions":[{"q":"Which of the following best explains the vanishing gradient problem in RNNs?","options":["RNNs lack memory mechanisms for long-term dependencies.","Gradients grow too large during backpropagation.","Gradients shrink exponentially over long sequences.","RNNs cannot process variable-length sequences."],"answer":[2],"verified":"official","c":261},{"q":"In an attention mechanism, what does the softmax function ensure?","options":["N r odd dimensions.","options":["sine","cosine","tangent","None of these"],"answer":[1],"verified":"official","c":274,"rel":[["Jan-Apr 2026",6,1]]},{"q":"Why is positional encoding added to input embeddings in Transformers?","options":["To provide unique values for each word","To indicate the position of tokens since Transformers are non-sequential","To scale embeddings","To avoid vanishing gradients"],"answer":[1],"verified":"official","c":275},{"q":"You are given a self-attention layer with input dimension 512, using 8 heads. What is the output dimension per head?","options":["64","128","32","256"],"answer":[0],"explanation":"512 / 8 heads = 64.","verified":"official","c":276,"rel":[["Jan-Apr 2026",6,1],["Jul-Oct 2026",6,0]]},{"q":"For a transformer with d_model = 512, calculate the positional encoding for position p = 14 and model dimensions 6 and 7 using the sinusoidal formula: PE(p, 2i) = sin(p / 10000^(2i/d_model)), PE(p, 2i+1) = cos(p / 10000^(2i/d_model)).","options":["sin(14 / 10000^(3/256)), cos(14 / 10000^(3/256))","cos(14 / 10000^(6/256)), sin(14 / 10000^(7/256))","cos(14 / 10000^(3/256)), sin(14 / 10000^(3/256))","sin(14 / 10000^(3/512)), cos(14 / 10000^(3/256))"],"answer":[0],"explanation":"Dimensions 6 and 7 correspond to i = 3: exponent 2·3/512 = 3/256 for both.","verified":"official","c":385,"rel":[["Jul-Oct 2026",6,0],["Jan-Apr 2025",6,1]]}]},{"year":2025,"session":"Jul-Oct 2025","week":7,"source":"(Accepted Answers) Scribd prints of graded NPTEL noc25_cs161 assignment pages: https://www.scribd.com/document/984645060 ; https://www.scribd.com/document/941513164","questions":[{"q":"Why can a pre-trained BART model be fine-tuned directly for abstractive summarization?","options":["Its encoder alone is sufficient.","It shares vocabulary with summarization datasets.","It uses a larger context window than BERT.","It already contains a generative decoder trained jointly during pre-training."],"answer":[3],"verified":"official","c":278},{"q":"For pre-trainin
