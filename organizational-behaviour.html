"reasoning","c":3},{"q":"Perception, learning and personality are attributes of Individual Behavioural Dynamics.","options":["True","False"],"answer":[0],"explanation":"Intro to OB Part 1: individual level 'which is like their motivation, attitude, perception and things like that'; Part 2: individual level covers 'personality, attitude, motivation'. Learning is a Week 4 individual-level topic.","verified":"lecture","c":4},{"q":"The process of giving meaning to sensory stimuli through organizing and interpreting is called:","options":["Sensation","Perception","Sublimation","Organization"],"answer":[1],"explanation":"Official NPTEL key: Perception. Perception Part 1: 'Perception is process of giving meaning to sensory stimulus through organizing and interpreting it.'","verified":"official","c":291,"rel":[["Jul-Oct 2025",2,1],["Jul-Oct 2024",2,1],["Jul-Oct 2023",2,1]]},{"q":"Organizational structure is a part of Interpersonal and Group dynamics.","options":["True","False"],"answer":[1],"explanation":"Intro to OB Part 2 levels: individual, group, and 'larger organizational processes'; Organizational Structure is taught in Week 12 with Organizational Culture/Change (organizational level), not interpersonal/group dynamics.","verified":"lecture","c":6},{"q":"People differ in their level of trustworthiness.","options":["True","False"],"answer":[0],"explanation":"Not stated as such in the lectures; individual differences in traits (e.g., trust in Big Five agreeableness/Perception lecture on trusting similar others) make the statement true.","verified":"reasoning","c":7},{"q":"Perception is highly objective.","options":["True","False"],"answer":[1],"explanation":"Perception Part 1: 'So, perception is highly subjective. And when I say subjective it varies from one person to another person.'","verified":"lecture","c":8},{"q":"More output for less input or being able to provide optimal output for a given input is called:","options":["Effectiveness","Productivity","Efficiency","Motivation"],"answer":[2],"explanation":"Official NPTEL key: Efficiency. Intro to OB Part 2: 'Efficiency is more output for less input or in other words, you are able to give an optimal output for a particular input.'","verified":"official","c":284,"rel":[["Jul-Oct 2025",1,1],["Jul-Oct 2024",1,1],["Jul-Oct 2023",1,1]]}]},{"year":2026,"session":"Jul-Oct 2026","week":1,"source":"https://www.youtube.com/watch?v=Tgar3_n5voQ (NPTEL Solver); https://www.youtube.com/watch?v=QqDN1VWduao (A3 EDUCATION); https://www.youtube.com/watch?v=t-pb8LEeWc8 (Coding Solutions); https://www.youtube.com/watch?v=6-QJu4V4yRg (MY SWAYAM)","questions":[{"q":"Response of the organism or system to various stimuli or inputs, whether internal or external, conscious or subconscious, overt or covert, voluntary or involuntary is called:","options":["Organization","Behaviour","Resource","Productivity"],"answer":[1],"explanation":"Official NPTEL key: Behaviour. Intro to OB Part 1 definition of behaviour as response of the organism to stimuli.","verified":"official","c":282,"rel":[["Jul-Oct 2025",1,1],["Jul-Oct 2024",1,1],["Jul-Oct 2023",1,1]]},{"q":"Hawthorne experiments were a set of experiments conducted to study the impact of assembly line on the health of the workers.","options":["True","False"],"answer":[1],"explanation":"Intro to OB Part 5: Hawthorne experiments aimed 'to understand how physical conditions... ventilation, illumination... temperature in workplace... affected performance of employees', not assembly lines and health. NPTEL 2024 key: False.","verified":"lecture","c":11,"rel":[["Jul-Oct 2025",1,0],["Jul-Oct 2024",1,0]]},{"q":"The social expectation on an individual is called:","options":["Role","Designation","Job","Task"],"answer":[0],"explanation":"Official NPTEL key: Role. Intro to OB Part 2: 'your designation prescribes certain things which are expected from you' - social expectation = role.","verified":"official","c":283,"rel":[["Jul-Oct 2025",1,1],["Jul-Oct 2024",1,1],["Jul-Oct 2023",1,1]]},{"q":"Which of the following is not an organization?","options":["TATA Steels","UNICEF","Facebook Inc.","Germany"],"answer":[3],"explanation":"Official NPTEL key: Germany. Intro to OB Part 1 defines organization as a consciously coordinated social entity with a common goal (companies, NGOs/agencies); a country is not an organization.","verified":"official","c":280,"rel":[["Jul-Oct 2025",1,1],["Jul-Oct 2024",1,1],["Jul-Oct 2023",1,1]]},{"q":"More output for less input or being able to provide optimal output for a given input is called:","options":["Effectiveness","Productivity","Efficiency","Motivation"],"answer":[2],"explanation":"Official NPTEL key: Efficiency. Intro to OB Part 2: 'Efficiency is more output for less input or in other words, you are able to give an optimal output for a particular input.'","verified":"official","c":284,"rel":[["Jul-Oct 2025",1,1],["Jul-Oct 2024",1,1],["Jul-Oct 2023",1,1]]},{"q":"Which field can be called as the mother of Organizational behaviour?","options":["Anthropology","Economics","Industrial Psychology","Law"],"answer":[2],"explanation":"Official NPTEL key: Industrial Psychology. Intro to OB Part 4: 'industrial psychology can be called as the mother of organizational behaviour'.","verified":"official","c":285,"rel":[["Jul-Oct 2025",1,1],["Jul-Oct 2024",1,1],["Jul-Oct 2023",1,1]]},{"q":"In an experiment, the group in which you make no changes is called the:","options":["Experimental Group","Focus Group","Control Group","Target Group"],"answer":[2],"explanation":"Official NPTEL key: Control Group. Intro to OB Part 5: 'Experimental group means the group in which you change the condition. Control group means you do not do anything.'","verified":"official","c":286,"rel":[["Jul-Oct 2025",1,1],["Jul-Oct 2024",1,1],["Jul-Oct 2023",1,1]]},{"q":"The assembly line of production was first introduced by Henry Ford.","options":["True","False"],"answer":[0],"explanation":"Intro to OB Part 4 (video clip): 'in 1913 Ford introduced his most revolutionary change... the assembly line was born.' NPTEL 2024 key: True.","verified":"lecture","c":17,"rel":[["Jul-Oct 2025",1,0],["Jul-Oct 2024",1,0]]},{"q":"The scientific management movement was pioneered by:","options":["Walter Dill Scott","Edward K Strong Jr.","Hugo Munsterberg","Frederick W Taylor"],"answer":[3],"explanation":"Official NPTEL key: Frederick W Taylor. Intro to OB Part 4/5: scientific management (Taylorism) pioneered by F. W. Taylor.","verified":"official","c":287,"rel":[["Jul-Oct 2025",1,1],["Jul-Oct 2024",1,1],["Jul-Oct 2023",1,1]]},{"q":"The process of breaking down the entire job into specific tasks and see how each of these tasks are performed and how much time on an average a person will take to finish it is called:","options":["Time and Motion Study","Workplace management","Job Profile","Productivity"],"answer":[0],"explanation":"Official NPTEL key: Time and Motion Study. Intro to OB Part 4/5: time and motion study breaks the job into tasks and measures average time per task.","verified":"official","c":289,"rel":[["Jul-Oct 2025",1,1],["Jul-Oct 2024",1,1],["Jul-Oct 2023",1,1]]}]},{"year":2026,"session":"Jul-Oct 2026","week":2,"source":"https://www.youtube.com/watch?v=pzjK3EF9-XE (A3 EDUCATION); https://www.youtube.com/watch?v=M_wsvhr9AhQ (Coding Solutions); https://www.youtube.com/watch?v=qs7Y_Ai22TA (MY SWAYAM)","questions":[{"q":"Perception is highly objective.","options":["True","False"],"answer":[1],"explanation":"Perception Part 1: 'So, perception is highly subjective.' NPTEL 2024 key: False.","verified":"lecture","c":20,"rel":[["Jul-Oct 2025",2,0],["Jul-Oct 2024",2,0],["Jul-Oct 2023",2,0]]},{"q":"There are many women at the bottom and middle level management roles but only a very few make it to the top. This is due to:","options":["Impression Management techniques","Golem effect","Pygmalion effect","Glass-ceiling effect"],"answer":[3],"explanation":"Official NPTEL key: Glass-ceiling effect. Perception Part 4: 'Glass ceiling effect means there are many women at the bottom and middle level of management... but there are very few' at the top.","verified":"official","c":298,"rel":[["Jul-Oct 2025",2,1],["Jul-Oct 2024",2,1],["Jul-Oct 2023",2,1]]},{"q":"The process of giving meaning to sensory stimuli through organizing and interpreting is called:","options":["Sensation","Perception","Sublimation","Organization"],"answer":[1],"explanation":"Official NPTEL key: Perception. Perception Part 1: 'Perception is process of giving meaning to sensory stimulus through organizing and interpreting it.'","verified":"official","c":291,"rel":[["Jul-Oct 2025",2,1],["Jul-Oct 2024",2,1],["Jul-Oct 2023",2,1]]},{"q":"Which of the following is an internal factor that influence the principles of perceptual selection?","options":["Contrast","Repetition","Motion","Habit"],"answer":[3],"explanation":"Official NPTEL key: Habit. Perception Part 1: internal factors in selection: 'The first factor is habit.' (contrast, repetition, motion are external).","verified":"official","c":293,"rel":[["Jul-Oct 2025",2,1],["Jul-Oct 2024",2,1],["Jul-Oct 2023",2,1]]},{"q":"[Image: a grid of dots arranged in 4 columns and 5 rows, with dots closer together vertically than horizontally] In the above picture, we tend to see columns of dots due to a perceptual grouping effect called:","options":["Similarity","Proximity","Continuity","Symmetry"],"answer":[1],"explanation":"Official NPTEL key: Proximity. Perception Part 2: grouping 'the first one is Proximity... we try to group them based on the proximity, how close they are.'","verified":"official","c":294,"rel":[["Jul-Oct 2025",2,1],["Jul-Oct 2024",2,1],["Jul-Oct 2023",2,1]]},{"q":"[Image: a door shown closed, partly open and wide open] In the above image, one can still perceive the opening door to be of a rectangle shape due to:","options":["Figure-Ground Perception","Optical Illusions","Perceptual Constancy","Social Perception"],"answer":[2],"explanation":"Official NPTEL key: Perceptual Constancy. Perception Part 2: 'Perceptual constancy... in this example the door which you see you see it as a rectangle.'","verified":"official","c":295,"rel":[["Jul-Oct 2025",2,1],["Jul-Oct 2024",2,1],["Jul-Oct 2023",2,1]]},{"q":"The process through which individuals attempt to determine the causes behind others' behaviour is called attribution.","options":["True","False"],"answer":[0],"explanation":"Perception Part 2: 'Attribution means... trying to understand the cause behind others behaviour.' NPTEL 2024 key: True.","verified":"lecture","c":26,"rel":[["Jul-Oct 2025",2,0],["Jul-Oct 2024",2,0],["Jul-Oct 2023",2,0]]},{"q":"According to Kelley's theory of causal attribution, the extent to which other people behave in the same manner as the person we are judging is called:","options":["Consensus","Consistency","Distinctiveness","Identity"],"answer":[0],"explanation":"Official NPTEL key: Consensus. Perception Part 3: 'consensus means whether many people agree to it or whether many people feel the same.'","verified":"official","c":296,"rel":[["Jul-Oct 2025",2,1],["Jul-Oct 2024",2,1],["Jul-Oct 2023",2,1]]},{"q":"The tendency to attribute others' action to internal causes while largely ignoring external factors is called:","options":["Halo effect","Team-Halo effect","Fundamental attribution error","Similar-to-me effect"],"answer":[2],"explanation":"Official NPTEL key: Fundamental attribution error. Perception Part 3/4: tendency to attribute others' behaviour to internal causes ignoring external factors = fundamental attribution error.","verified":"official","c":290,"rel":[["Jul-Oct 2025",2,1],["Jul-Oct 2024",2,1],["Jul-Oct 2023",2,1]]},{"q":"The word \"Carpenter\" immediately brings in to memory the image of a male individual rather than a female individual. This is an example of a job stereotype.","options":["True","False"],"answer":[0],"explanation":"Perception Part 4: job stereotypes are 'gender stereotypes, but we use these criteria when we talk about certain jobs'. NPTEL 2024 key: True.","verified":"lecture","c":29,"rel":[["Jul-Oct 2025",2,0],["Jul-Oct 2024",2,0],["Jul-Oct 2023",2,0]]}]},{"year":2026,"session":"Jul-Oct 2026","week":3,"source":"https://www.youtube.com/watch?v=DZpETxBEviE (NPTEL Solver); https://www.youtube.com/watch?v=vfowVmffPAA (NPTEL ASSIGNMENTS); https://www.youtube.com/watch?v=FnihjEeA9Ak (Coding Solutions); https://www.youtube.com/watch?v=B_5UPAVp2tE (Wily Technology); https://www.youtube.com/watch?v=0N2hWbCXBg8 (MY SWAYAM)","questions":[{"q":"In Johari's Window model of self-awareness, the part of the self which is not known to ourselves, but others know is called:","options":["Open","Blind","Hidden","Unknown"],"answer":[1],"explanation":"Official NPTEL key: Blind. Personality Part 6 (Johari Window): blind self = known to others, not to self.","verified":"official","c":301,"rel":[["Jul-Oct 2025",3,1],["Jul-Oct 2024",3,1],["Jul-Oct 2023",3,1]]},{"q":"The meaning of the Latin word 'Persona' from which the word Personality arises is:","options":["Behaviour","Mask","Thought","Person"],"answer":[1],"explanation":"Official NPTEL key: Mask. Personality Part 1: 'Personality has its origins in the Latin word personare or persona which means a mask'.","verified":"official","c":302,"rel":[["Jul-Oct 2025",3,1],["Jul-Oct 2024",3,1],["Jul-Oct 2023",3,1]]},{"q":"Many psychologists argue that one's personality can be changed over a period of time because those qualities are formed because of social factors.","options":["True","False"],"answer":[0],"explanation":"Personality Part 2: 'personality... can be changed over a period of time because those qualities are formed because of social factors.' NPTEL 2024 key: True.","verified":"lecture","c":32,"rel":[["Jul-Oct 2025",3,0],["Jul-Oct 2024",3,0],["Jul-Oct 2023",3,0]]},{"q":"According to Big Five Personality Theory, people who like to experiment and try and find out new things and are less judgmental about people of other cultures are high on:","options":["Adjustment","Agreeableness","Conscientiousness","Intellectual Openness"],"answer":[3],"explanation":"Official NPTEL key: Intellectual Openness. Personality Part 7 (Big Five): 'Intellectual openness is open to new experiences; ... they like to experiment'.","verified":"official","c":304,"rel":[["Jul-Oct 2025",3,1],["Jul-Oct 2024",3,1],["Jul-Oct 2023",3,1]]},{"q":"According to Sigmund Freud's psychoanalytic theory, the deepest level of consciousness is:","options":["Subconscious","Conscious state","Unconscious","Awareness"],"answer":[2],"explanation":"Official NPTEL key: Unconscious. Personality Part 3/4 (Freud's levels of consciousness): unconscious is the deepest level.","verified":"official","c":305,"rel":[["Jul-Oct 2025",3,1],["Jul-Oct 2024",3,1],["Jul-Oct 2023",3,1]]},{"q":"According to Sigmund Freud, reality principle is followed by:","options":["Id","Super Ego","Dream","Ego"],"answer":[3],"explanation":"Official NPTEL key: Ego. Personality Part 4: 'id driven by pleasure principle, ego is driven by reality principle, super ego is driven by moral principle'.","verified":"official","c":306,"rel":[["Jul-Oct 2025",3,1],["Jul-Oct 2024",3,1],["Jul-Oct 2023",3,1]]},{"q":"In social learning theory, the withdrawal of something which somebody likes to strengthen a behaviour is called:","options":["Negative Reinforcement","Positive Reinforcement","Reward","Punishment"],"answer":[0],"explanation":"Official NPTEL key: Negative Reinforcement. Personality Part 3: 'Negative reinforcement also strengthen behaviour... Negative reinforcement means withdrawal of something which somebody likes.'","verified":"official","c":300,"rel":[["Jul-Oct 2025",3,1],["Jul-Oct 2024",3,1],["Jul-Oct 2023",3,1]]},{"q":"The main proponent of Self Theory was:","options":["Sigmund Freud","Albert Bandura","Carl Rogers","B.F. Skinner"],"answer":[2],"explanation":"Official NPTEL key: Carl Rogers. Personality Parts 4-5: Carl Rogers' self theory (unconditional positive regard).","verified":"official","c":307,"rel":[["Jul-Oct 2025",3,1],["Jul-Oct 2024",3,1],["Jul-Oct 2023",3,1]]},{"q":"Employees with high self-esteem are more ready to take responsibilities.","options":["True","False"],"answer":[0],"explanation":"Personality Part 6: employees with high self-esteem 'will be ready to take responsibilities because they know what they are capable of'. NPTEL 2024 key: True.","verified":"lecture","c":38,"rel":[["Jul-Oct 2025",3,0],["Jul-Oct 2024",3,0],["Jul-Oct 2023",3,0]]},{"q":"People with _____ locus of control believe that others control their life and whatever happens in their life is because of outside factors.","options":["Internal","External"],"answer":[1],"explanation":"Official NPTEL key: External. Personality Part 7: external locus of control - outside factors/others control one's life.","verified":"official","c":309,"rel":[["Jul-Oct 2025",3,1],["Jul-Oct 2024",3,1],["Jul-Oct 2023",3,1]]}]},{"year":2026,"session":"Jul-Oct 2026","week":4,"source":"https://www.youtube.com/watch?v=Z82B6sHj4hU (NPTEL ASSIGNMENTS); https://www.youtube.com/watch?v=XiHTOfSJ7W0 (Coding Solutions); https://www.youtube.com/watch?v=pyMaAYREqIg (MY SWAYAM)","questions":[{"q":"_____ are evaluative statements towards objects, people or events.","options":["Learning","Attitudes","Memory","Personality"],"answer":[1],"explanation":"Official NPTEL key: Attitudes. Attitudes Part 1: attitudes are evaluative statements towards objects, people or events.","verified":"official","c":400,"rel":[["Jul-Oct 2024",4,1],["Jul-Oct 2023",4,1],["Jul-Oct 2022",4,1]]},{"q":"A relatively permanent change in behaviour occurring as a result of experience is called:","options":["Thinking","Sensation","Learning","Prejudice"],"answer":[2],"explanation":"Official NPTEL key: Learning. Learning Part 1: learning is a relatively permanent change in behaviour as a result of experience.","verified":"official","c":401,"rel":[["Jul-Oct 2024",4,1],["Jul-Oct 2023",4,1],["Jul-Oct 2022",4,1]]},{"q":"Providing more information can lead to change in attitude.","options":["True","False"],"answer":[0],"explanation":"Attitudes Part 1: 'attitudes with information newer information with some persuasion you can change attitudes'. NPTEL 2024 key: True.","verified":"lecture","c":42,"rel":[["Jul-Oct 2024",4,0],["Jul-Oct 2023",4,0],["Jul-Oct 2022",4,0]]},{"q":"In Pavlov's Dog experiment, the food presented which makes the dog salivate is:","options":["Unconditional stimulus","Unconditional response","Conditioned stimulus","Conditioned response"],"answer":[0],"explanation":"Official NPTEL key: Unconditional stimulus. Learning Part 1 (Pavlov): food is the unconditioned stimulus; salivation to food is the unconditioned response.","verified":"official","c":403,"rel":[["Jul-Oct 2024",4,1],["Jul-Oct 2023",4,1],["Jul-Oct 2022",4,1]]},{"q":"In Operant conditioning, the process through which the responses that are no longer reinforced tend to gradually diminish in strength is called:","options":["Positive reinforcement","Negative Reinforcement","Punishment","Extinction"],"answer":[3],"explanation":"Official NPTEL key: Extinction. Learning Part 2: 'Extinction is what happens... after a certain point even without the reward or punishment' responses diminish.","verified":"official","c":404,"rel":[["Jul-Oct 2024",4,1],["Jul-Oct 2023",4,1],["Jul-Oct 2022",4,1]]},{"q":"After watching a Dance TV show, a kid starts to make dance moves. This is an example of:","options":["Operant conditioning","Classical conditioning","Observational learning","Negative Reinforcement"],"answer":[2],"explanation":"Official NPTEL key: Observational learning. Learning Part 2: observational (social) learning - learning by watching models.","verified":"official","c":405,"rel":[["Jul-Oct 2024",4,1],["Jul-Oct 2023",4,1],["Jul-Oct 2022",4,1]]},{"q":"Opinion is primarily _____ in nature.","options":["Affective","Cognitive","Behavioural","Unconscious"],"answer":[1],"explanation":"Official NPTEL key: Cognitive. Attitudes Part 2: 'opinion is the cognitive element of attitudes'.","verified":"official","c":406,"rel":[["Jul-Oct 2024",4,1],["Jul-Oct 2023",4,1],["Jul-Oct 2022",4,1]]},{"q":"The intensity of an attitude or the magnitude/degree of its favorableness is called","options":["Multiplexity","Relation to need","Centrality","Valence"],"answer":[3],"explanation":"Official NPTEL key: Valence. Attitudes Part 2: 'The first attribute... is valence... their intensity or the magnitude of favourableness or unfavourableness.'","verified":"official","c":407,"rel":[["Jul-Oct 2024",4,1],["Jul-Oct 2023",4,1],["Jul-Oct 2022",4,1]]},{"q":"When people do not provide honest answers to certain questions because they feel that it is not right to give those answers, it is called:","options":["Social Loafing","Fatigue","Social Desirability Effect","Sampling"],"answer":[2],"explanation":"Official NPTEL key: Social Desirability Effect. Attitudes Part 2: 'Social desirability effect means certain questions people will not give right answers, because they think it is not correct to give those kind of answers.'","verified":"official","c":408,"rel":[["Jul-Oct 2024",4,1],["Jul-Oct 2023",4,1],["Jul-Oct 2022",4,1]]},{"q":"Uncomfortable tension which comes from holding two conflicting thoughts in the mind at the same time is called Cognitive Dissonance.","options":["True","False"],"answer":[0],"explanation":"Attitudes Part 4: 'cognitive dissonance is the uncomfortable tension which happens when you have two different viewpoints about the same issue'. NPTEL 2024 key: True.","verified":"lecture","c":49,"rel":[["Jul-Oct 2024",4,0],["Jul-Oct 2023",4,0],["Jul-Oct 2022",4,0]]}]},{"year":2026,"session":"Jul-Oct 2026","week":5,"source":"https://www.youtube.com/watch?v=3TuK66pFso0 (NPTEL ASSIGNMENTS); https://www.youtube.com/watch?v=ESHaoCbO3BM (Coding Solutions); https://www.youtube.com/watch?v=-S47bScq_AE (MY SWAYAM)","questions":[{"q":"The stress which happens because of positive incidences is called:","options":["Distress","Eustress","Hypo-stress","Hyper work stress"],"answer":[1],"explanation":"Official NPTEL key. Emotions - Part 3 (stress): stress from positive events is eustress; matches NPTEL key.","verified":"official","c":321,"rel":[["Jul-Oct 2024",5,1],["Jul-Oct 2023",5,1]]},{"q":"An unfocused, relatively mild feeling that exists as background to our daily experience is called:","options":["Behaviour","Perception","Mood","Envy"],"answer":[2],"explanation":"Official NPTEL key. Emotions - Part 1: mood is defined as a mild, unfocused background feeling; matches NPTEL key.","verified":"official","c":322,"rel":[["Jul-Oct 2024",5,1],["Jul-Oct 2023",5,1]]},{"q":"The psychological effort involved in holding back one's true emotions is called:","options":["Emotional dissonance","Emotional labor","Emotional Attachment","Temperament"],"answer":[1],"explanation":"Official NPTEL key. Emotions lectures (Week 5): effort of suppressing true emotions = emotional labor; matches NPTEL key.","verified":"official","c":323,"rel":[["Jul-Oct 2024",5,1],["Jul-Oct 2023",5,1]]},{"q":"When John failed his driving license test, he starts to remember how his friends used to tease him saying he was not a good driver. This is an example of:","options":["Work-family spillover effect","Emotional dissonance","Empathy","Mood congruence effect"],"answer":[3],"explanation":"Official NPTEL key. Emotions - Part 1: 'Mood congruence means when people are in a positive mood, they tend to remember positive things. Similarly, when they have a negative' mood they recall negative things.","verified":"official","c":320,"rel":[["Jul-Oct 2024",5,1],["Jul-Oct 2023",5,1]]},{"q":"Threat-based aggression can stem from both a real stimulus or a perceived stimulus.","options":["True","False"],"answer":[0],"explanation":"Emotions - Part 2: threat-based aggression 'can be a real stimulus or it can be a perceived stimulus'. NPTEL 2024 key for the identical item: True.","verified":"lecture","c":54,"rel":[["Jul-Oct 2024",5,0],["Jul-Oct 2023",5,0]]},{"q":"_____ is when you have a goal and you are moving towards that goal and you feel that something or someone is stopping you from reaching that goal.","options":["Threat-based aggression","Instrumental aggression","Irritable aggression","Frustration-based aggression"],"answer":[3],"explanation":"Official NPTEL key. Emotions - Part 2: frustration-based aggression arises when something or someone stops you from achieving your goal.","verified":"official","c":325,"rel":[["Jul-Oct 2024",5,1],["Jul-Oct 2023",5,1]]},{"q":"Fear of being rejected is one of the main reasons that make people non-assertive.","options":["True","False"],"answer":[0],"explanation":"Emotions - Part 2: reasons people are not assertive include insecurity, 'fear of rejection', humiliation. NPTEL 2024 key for the identical item: True.","verified":"lecture","c":56,"rel":[["Jul-Oct 2024",5,0],["Jul-Oct 2023",5,0]]},{"q":"The feeling of completely tired and exhausted when you are stressed for a very long time accompanied by lack of meaning is called:","options":["Burnout","Absenteeism","Hypo stress","Alarm-reaction"],"answer":[0],"explanation":"Official NPTEL key. Emotions - Part 3 (stress): prolonged stress with exhaustion and loss of meaning = burnout; matches NPTEL key.","verified":"official","c":327,"rel":[["Jul-Oct 2024",5,1],["Jul-Oct 2023",5,1]]},{"q":"What are the behavioural symptoms of stress?","options":["Low productivity","Interpersonal conflicts","Suicidal tendencies","All of the above"],"answer":[3],"explanation":"Official NPTEL key. Emotions - Part 3: behavioural symptoms of stress listed; NPTEL key 'All of the above'.","verified":"official","c":328,"rel":[["Jul-Oct 2024",5,1],["Jul-Oct 2023",5,1]]},{"q":"_____ is a mild form of hate.","options":["Guilt","Humiliation","Resentment","Shame"],"answer":[2],"explanation":"Official NPTEL key. Emotions - Part 2: 'Resentment is mild form of hate.'","verified":"official","c":329,"rel":[["Jul-Oct 2024",5,1],["Jul-Oct 2023",5,1]]}]},{"year":2026,"session":"Jul-Oct 2026","week":6,"source":"https://www.youtube.com/watch?v=kdgJhnEJyhA (NPTEL ASSIGNMENTS; only solution video found for this week)","questions":[{"q":"_____ is the willingness of a person to put high levels of efforts to reach a goal.","options":["Emotions","Motivation","Frustration","Incentives"],"answer":[1],"explanation":"Official NPTEL key. Motivation - Part 1: motivation = willingness to exert high effort toward a goal; matches NPTEL key.","verified":"official","c":410,"rel":[["Jul-Oct 2024",6,1],["Jul-Oct 2023",6,1],["Jul-Oct 2022",6,1]]},{"q":"The need to be part of a group is categorized as:","options":["Achievement motive","Affiliation motive","Power motive","Role conflict"],"answer":[1],"explanation":"Official NPTEL key. Motivation lectures: need to belong to a group = affiliation motive; matches NPTEL key.","verified":"official","c":411,"rel":[["Jul-Oct 2024",6,1],["Jul-Oct 2023",6,1],["Jul-Oct 2022",6,1]]},{"q":"Money is a form of extrinsic motivation.","options":["True","False"],"answer":[0],"explanation":"Motivation - Part 2: 'money is an extrinsic motivation, satisfaction is intrinsic motivation'. NPTEL 2024 key for the identical item: True.","verified":"lecture","c":62,"rel":[["Jul-Oct 2024",6,0],["Jul-Oct 2023",6,0],["Jul-Oct 2022",6,0]]},{"q":"According to Maslow's hierarchy of needs, the highest level of needs one can achieve is:","options":["Self-actualization","Social Needs","Esteem needs","Safety needs"],"answer":[0],"explanation":"Official NPTEL key. Motivation - Part 4: self-actualization is the top of Maslow's hierarchy; matches NPTEL key.","verified":"official","c":413,"rel":[["Jul-Oct 2024",6,1],["Jul-Oct 2023",6,1],["Jul-Oct 2022",6,1]]},{"q":"According to Herzberg's two-factor theory of motivation, pay and security provided by a job is a Motivator.","options":["True","False"],"answer":[1],"explanation":"Motivation - Part 4: pay and job security are hygiene factors ('Pay which is basic need... job security, which is security need' = hygiene), not motivators. NPTEL 2024 key: False.","verified":"lecture","c":64,"rel":[["Jul-Oct 2024",6,0],["Jul-Oct 2023",6,0],["Jul-Oct 2022",6,0]]},{"q":"In Alderfer's ERG theory of motivation, R stands for","options":["Reputation","Regression","Resilience","Relatedness"],"answer":[3],"explanation":"Official NPTEL key. Motivation - Part 4: ERG = Existence, Relatedness, Growth; matches NPTEL key.","verified":"official","c":415,"rel":[["Jul-Oct 2024",6,1],["Jul-Oct 2023",6,1],["Jul-Oct 2022",6,1]]},{"q":"_____ means that employees feel that the organization treats its employees in a fair manner and a just way.","options":["Intra-personal conflict","Self-esteem","Power motive","Organizational Justice Climate"],"answer":[3],"explanation":"Official NPTEL key. Motivation lectures: organizational justice climate = perception that the organization treats employees fairly; matches NPTEL key.","verified":"official","c":416,"rel":[["Jul-Oct 2024",6,1],["Jul-Oct 2023",6,1],["Jul-Oct 2022",6,1]]},{"q":"_____ is when you are moving towards a certain goal, but certain barriers are stopping you from achieving that goal.","options":["Goal conflict","Role conflict","Frustration","Satisfaction"],"answer":[2],"explanation":"Official NPTEL key. Motivation lectures: frustration = barriers blocking progress toward a goal; matches NPTEL key.","verified":"official","c":417,"rel":[["Jul-Oct 2024",6,1],["Jul-Oct 2023",6,1],["Jul-Oct 2022",6,1]]},{"q":"One of the drawbacks of using money as a motivator is that it can reduce extra-role performance.","options":["True","False"],"answer":[0],"explanation":"Motivation - Part 2: rewarding extra-role behaviours with money backfires ('research say it would not' improve good behaviour). NPTEL 2024 key for the identical item: True.","verified":"lecture","c":68,"rel":[["Jul-Oct 2024",6,0],["Jul-Oct 2023",6,0],["Jul-Oct 2022",6,0]]},{"q":"John had applied for several jobs after graduation. One day he received a job offer from Tata Motors and Mahindra Group, both of which he loved to work. The conflict Mr. John is facing in selecting one job is called:","options":["Role Conflict","Approach-avoidance conflict","Approach-approach conflict","Avoidance-avoidance conflict"],"answer":[2],"explanation":"Official NPTEL key. Motivation lectures (goal conflict): choosing between two attractive options = approach-approach conflict; matches NPTEL key.","verified":"official","c":419,"rel":[["Jul-Oct 2024",6,1],["Jul-Oct 2023",6,1],["Jul-Oct 2022",6,1]]}]},{"year":2026,"session":"Jul-Oct 2026","week":7,"source":"https://www.youtube.com/watch?v=gzDpIxUesso (NPTEL ASSIGNMENTS); https://www.youtube.com/watch?v=3fabYjqlYLg (MY SWAYAM)","questions":[{"q":"When each party involved in a task tries to maximize its own gains, often at the expense of others, it is called:","options":["Cooperation","Interdependency","Competition","None of the above"],"answer":[2],"explanation":"Official NPTEL key. Interpersonal Relationships - Part 2: competition is 'if I have to win the other person has to lose'; matches NPTEL key.","verified":"official","c":420,"rel":[["Jul-Oct 2024",7,1],["Jul-Oct 2022",7,1]]},{"q":"The degree of confidence we have on others in a relationship is called:","options":["Transactional contract","Relational contract","Trust","Norms"],"answer":[2],"explanation":"Official NPTEL key. Interpersonal Relationships - Part 2: 'Trust is the degree of confidence on others'.","verified":"official","c":421,"rel":[["Jul-Oct 2024",7,1],["Jul-Oct 2022",7,1]]},{"q":"The kind of psychological contract that focuses on long-term interaction and a widely defined relationship is called relational contract.","options":["True","False"],"answer":[0],"explanation":"Interpersonal Relationships - Part 1: 'In relational contract, the focus is like very long term... long term, broad definition of a relationship'. NPTEL 2024 key for the identical item: True.","verified":"lecture","c":72,"rel":[["Jul-Oct 2024",7,0],["Jul-Oct 2022",7,0]]},{"q":"The type of trust that is established based on the credibility of a person, for e.g., trusting the doctor:","options":["Trust based on familiarity","Swift trust","Trust based on similarity","Trust based on social networks"],"answer":[1],"explanation":"Official NPTEL key. Interpersonal Relationships - Part 1: 'swift trust, which means quick trust... happens when we feel this person has some credibility. For example, if somebody is a doctor'.","verified":"official","c":423,"rel":[["Jul-Oct 2024",7,1],["Jul-Oct 2023",7,1],["Jul-Oct 2022",7,1]]},{"q":"The characteristic of being and respectful towards others is:","options":["Conscientiousness","Sportsmanship","Civic virtue","Courtesy"],"answer":[3],"explanation":"Official NPTEL key. Interpersonal Relationships - Part 2: 'Courtesy is being respectful towards others'.","verified":"official","c":424,"rel":[["Jul-Oct 2024",7,1],["Jul-Oct 2023",7,1],["Jul-Oct 2022",7,1]]},{"q":"Treating the common resources responsibly is called","options":["True","False"],"answer":[0],"explanation":"Interpersonal Relationships - Part 2: 'civic virtue means treating those common resources responsibly'. Statement is truncated on the portal; NPTEL's 2024 key for this identical item accepted True.","verified":"lecture","c":75,"rel":[["Jul-Oct 2024",7,0],["Jul-Oct 2022",7,0]]},{"q":"_____ is helping without expecting anything in return.","options":["Altruism","Competition","Cooperation","Conscientiousness"],"answer":[0],"explanation":"Official NPTEL key. Interpersonal Relationships lectures: altruism = helping without expecting anything in return; matches NPTEL key.","verified":"official","c":426,"rel":[["Jul-Oct 2024",7,1],["Jul-Oct 2022",7,1]]},{"q":"Disagreements on strategy and sharing of responsibility and resources is called:","options":["Relational conflict","Task conflict","Process conflict","Avoiding"],"answer":[2],"explanation":"Official NPTEL key. Interpersonal Relationships - Part 3: 'Process conflict is disagreement in terms of planning or sharing responsibilities... who should have more resources'.","verified":"official","c":427,"rel":[["Jul-Oct 2024",7,1],["Jul-Oct 2022",7,1]]},{"q":"People who focus on maximizing the joint outcomes of everyone involved are called:","options":["Competitors","Cooperators","Individualists","Equalizers"],"answer":[1],"explanation":"Official NPTEL key. Interpersonal Relationships - Part 2: people who maximize benefits for everyone (win-win) 'are called co-operators'.","verified":"official","c":428,"rel":[["Jul-Oct 2024",7,1],["Jul-Oct 2022",7,1]]},{"q":"Which conflict handling style is best for both the parties involved?","options":["Competing","Avoiding","Accommodating","Collaborating"],"answer":[3],"explanation":"Official NPTEL key. Interpersonal Relationships - Part 4: collaborating (win-win) is best for both parties; matches NPTEL key.","verified":"official","c":429,"rel":[["Jul-Oct 2024",7,1],["Jul-Oct 2023",7,1],["Jul-Oct 2022",7,1]]}]},{"year":2026,"session":"Jul-Oct 2026","week":8,"source":"https://www.youtube.com/watch?v=y_dDsIoHNI0 (NPTEL ASSIGNMENTS); https://www.youtube.com/watch?v=lOgqw3GQ0Cg (Coding Solutions); https://www.youtube.com/watch?v=dqcLIUUnuOA (MY SWAYAM)","questions":[{"q":"The communication style that is supportive and avoids change and confrontation is called:","options":["Animated communication style","Driver communication style","Amiable communication style","Analytical communication style"],"answer":[2],"explanation":"Official NPTEL key. Communication - Part 1: 'amiable style... very supportive in communication... they also avoid change in confrontation'.","verified":"official","c":430,"rel":[["Jul-Oct 2024",8,1],["Jul-Oct 2022",8,1]]},{"q":"In communication, the process of converting a message into symbols is called:","options":["Message","Channel","Decoding","Encoding"],"answer":[3],"explanation":"Official NPTEL key. Communication - Part 1: encoding = converting the message into symbols (language) both parties understand.","verified":"official","c":431,"rel":[["Jul-Oct 2024",8,1],["Jul-Oct 2023",8,0],["Jul-Oct 2022",8,1]]},{"q":"Any disturbance that interfere with the transmission, receipt or feedback of a message is called noise.","options":["True","False"],"answer":[0],"explanation":"Communication - Part 1/2: 'Noise is the disturbance which can happen during the communication... noise is something which interferes with communication'. NPTEL 2024 key: True.","verified":"lecture","c":82,"rel":[["Jul-Oct 2024",8,0],["Jul-Oct 2022",8,0]]},{"q":"The level of openness which exists in an organization which gives a certain level of comfort to its members is called:","options":["Common information effect","Hidden profile paradigm","Communication climate","Paralinguistic communication"],"answer":[2],"explanation":"Official NPTEL key. Communication lectures: communication climate = openness that makes members comfortable; matches NPTEL key.","verified":"official","c":433,"rel":[["Jul-Oct 2024",8,1],["Jul-Oct 2022",8,1]]},{"q":"Which of the following is NOT a non-verbal mode of communication?","options":["Facial expressions","Pupil dilation","Gestures","None of the above"],"answer":[3],"explanation":"Official NPTEL key. Communication - Part 2: facial expressions, pupil dilation and gestures are all non-verbal cues, so none of them is 'NOT non-verbal'; matches NPTEL key.","verified":"official","c":434,"rel":[["Jul-Oct 2024",8,1],["Jul-Oct 2022",8,1]]},{"q":"The study of spatial inter-relationships is called:","options":["Kinesics","Proxemics","Silence","Symbols"],"answer":[1],"explanation":"Official NPTEL key. Communication - Part 2: proxemics 'means the spatial interrelationships'.","verified":"official","c":435,"rel":[["Jul-Oct 2024",8,1],["Jul-Oct 2022",8,1]]},{"q":"Maintaining and distributing minutes of the meeting is helpful in reducing miscommunication in team meetings.","options":["True","False"],"answer":[0],"explanation":"Communication - Part 3: 'when there is minutes of meeting there is less miscommunication'. NPTEL 2024 key for the identical item: True.","verified":"lecture","c":86,"rel":[["Jul-Oct 2024",8,0],["Jul-Oct 2023",8,0],["Jul-Oct 2022",8,0]]},{"q":"When parts of some information are shared with the group members whereas other pieces of information are unshared, it gives rise to:","options":["Hidden profile paradigm","Awareness","Trust building","Minimizing status difference"],"answer":[0],"explanation":"Official NPTEL key. Communication - Part 3: shared vs unshared information pieces gives the hidden profile paradigm; matches NPTEL key.","verified":"official","c":437,"rel":[["Jul-Oct 2024",8,1],["Jul-Oct 2022",8,1]]},{"q":"In information sharing scenario, the case that has to be avoided to reduce decision making problems is:","options":["Fully shared case","Non-overlapping case","Distributed partial overlap","All of the above"],"answer":[2],"explanation":"Official NPTEL key. Communication - Part 3: distributed partial overlap (some info common, most unshared) is the problematic case; 'ideally fully shared case is preferred'.","verified":"official","c":438,"rel":[["Jul-Oct 2024",8,1],["Jul-Oct 2022",8,1]]},{"q":"Most eastern cultures are comfortable with silence between conversations.","options":["True","False"],"answer":[0],"explanation":"Communication - Part 2: 'In most eastern cultures people are comfortable with silence between conversation like I said Japanese culture.' NPTEL 2024 key: True.","verified":"lecture","c":89,"rel":[["Jul-Oct 2024",8,0],["Jul-Oct 2022",8,0]]}]},{"year":2026,"session":"Jul-Oct 2026","week":9,"source":"https://www.youtube.com/watch?v=Goduta_vMPw (NPTEL ASSIGNMENTS); https://www.youtube.com/watch?v=Ie-fVtixRQA (Coding Solutions)","questions":[{"q":"The step in team decision making where the problem is defined and a consensus is arrived about what the problem is:","options":["Discussion","Implementation","Representativeness","Orientation"],"answer":[3],"explanation":"NPTEL accepted answer: Orientation. Lecture: \"the first step is orientation ... the group has to arrive at the consensus about what is the problem\" (Decision Making - Part 3).","verified":"official","c":440,"rel":[["Jul-Oct 2024",9,1],["Jul-Oct 2022",9,1]]},{"q":"Making the smallest response possible that will reduce the problem to at least a tolerable level is called _____ to decision making.","options":["Satisficing approach","Rational Approach","Incremental approach","Garbage-can approach"],"answer":[2],"explanation":"NPTEL accepted answer: Incremental approach. \"Incremental approach is, do something at a very small level so that the problem is solved at that given point in time\" (Decision Making - Part 1).","verified":"official","c":441,"rel":[["Jul-Oct 2024",9,1],["Jul-Oct 2022",9,1]]},{"q":"Having a false sense of satisfaction even when problems start to show up is called:","options":["Complacency","Procrastination","Defensive avoidance","Panic"],"answer":[0],"explanation":"NPTEL accepted answer: Complacency. \"Complacency means having a sense of satisfaction, false sense of satisfaction\" (Decision Making - Part 1).","verified":"official","c":442,"rel":[["Jul-Oct 2024",9,1],["Jul-Oct 2022",9,1]]},{"q":"Trying to put the responsibility for decision making on somebody else is called buck passing.","options":["True","False"],"answer":[0],"explanation":"\"Buck passing is you try to put the responsibility on somebody else\" (Decision Making - Part 1); same item accepted True in the Jul-Oct 2024 key.","verified":"lecture","c":93,"rel":[["Jul-Oct 2024",9,0],["Jul-Oct 2022",9,0]]},{"q":"The tendency to be influenced by an initial figure, even when the information is largely irrelevant is called:","options":["Availability bias","Overconfidence","Anchoring and adjustment bias","Representativeness"],"answer":[2],"explanation":"NPTEL accepted answer: Anchoring and adjustment bias.","verified":"official","c":444,"rel":[["Jul-Oct 2024",9,1],["Jul-Oct 2023",9,1],["Jul-Oct 2022",9,1]]},{"q":"The group's emphasis on harmony and conformity leading to a wrong decision is called:","options":["Majority rule","Synergy","Risk taking in groups","Groupthink"],"answer":[3],"explanation":"NPTEL accepted answer: Groupthink.","verified":"official","c":445,"rel":[["Jul-Oct 2024",9,1],["Jul-Oct 2022",9,1]]},{"q":"Sunk costs can be recovered.","options":["True","False"],"answer":[1],"explanation":"\"sunk cost means, cost which cannot be recovered once they have been incurred\" (Decision Making - Part 4); same item accepted False in the Jul-Oct 2024 key.","verified":"lecture","c":96,"rel":[["Jul-Oct 2024",9,0],["Jul-Oct 2022",9,0]]},{"q":"Tendency to invest additional resources in an apparently losing proposition, influenced by effort, money and time already invested:","options":["Abilene Paradox","Delphi method","Escalation of commitment","Groupthink"],"answer":[2],"explanation":"NPTEL accepted answer: Escalation of commitment. Escalation of commitment: \"influenced by the effort money and time already invested\" (Decision Making - Part 4).","verified":"official","c":447,"rel":[["Jul-Oct 2024",9,1],["Jul-Oct 2022",9,1]]},{"q":"The tendency to make different decisions depending on how a problem is presented:","options":["Framing","Prospect theory","Representativeness","Bounded rationality"],"answer":[0],"explanation":"NPTEL accepted answer: Framing.","verified":"official","c":448,"rel":[["Jul-Oct 2024",9,1],["Jul-Oct 2022",9,1]]},{"q":"Finding a solution which is satisfactory than optimal is called satisficing approach to decision making.","options":["True","False"],"answer":[0],"explanation":"Satisficing (Herbert Simon) = \"the solution will satisfy ... good, but not necessarily the best\" (Decision Making - Part 1); same item accepted True in the Jul-Oct 2024 key.","verified":"lecture","c":99,"rel":[["Jul-Oct 2024",9,0],["Jul-Oct 2022",9,0]]}]},{"year":2026,"session":"Jul-Oct 2026","week":10,"source":"https://www.youtube.com/watch?v=ydYO9HhAnWw (NPTEL ASSIGNMENTS); https://www.youtube.com/watch?v=PZ9a974JNl4 (MY SWAYAM, disagrees on several questions)","questions":[{"q":"_____ is the ability to persuade others to seek defined objectives enthusiastically.","options":["Coercion","Behavioural change","Leadership","Authority"],"answer":[2],"explanation":"NPTEL accepted answer: Leadership.","verified":"official","c":250,"rel":[["Jul-Oct 2024",10,1]]},{"q":"The theory which states that the subordinates will be motivated to follow the leader only when they perceive that the leader can help them to fulfil their goals:","options":["Path-goal theory","Fiedler's model","Hersey and Blanchard's situational leadership theory","Trait theory"],"answer":[0],"explanation":"Same question as the 2024 run, where NPTEL accepted \"Path-goal theory\".","verified":"lecture","c":377,"rel":[["Jul-Oct 2024",10,1],["Jul-Oct 2023",10,1]]},{"q":"The source of power which is based on the capacity to administer punishment to others:","options":["Legitimate","Reward","Coercive","Expert"],"answer":[2],"explanation":"NPTEL accepted answer: Coercive.","verified":"official","c":252,"rel":[["Jul-Oct 2024",10,1]]},{"q":"Expert power is when you have certain abilities which nobody else has or is very rare.","options":["True","False"],"answer":[0],"explanation":"\"Expert power means you have certain skills and abilities ... which nobody else has, which is very rare\" (Power and Leadership - Part 1); same item accepted True in the Jul-Oct 2024 key.","verified":"lecture","c":103,"rel":[["Jul-Oct 2024",10,0]]},{"q":"Information or skills one possesses, which cannot be recorded or measured is called:","options":["Empowerment","Referent power","Gossiping","Tacit knowledge"],"answer":[3],"explanation":"NPTEL accepted answer: Tacit knowledge.","verified":"official","c":254,"rel":[["Jul-Oct 2024",10,1]]},{"q":"The form of political behaviour exhibited when employees try to form a group based on common language they speak is:","options":["Impression management","Building coalitions","Blaming","Manipulating information flow"],"answer":[1],"explanation":"NPTEL accepted answer: Building coalitions.","verified":"official","c":255,"rel":[["Jul-Oct 2024",10,1]]},{"q":"While managers rely on control, leaders _____.","options":["Ask how and when","Focus on systems and structure","Accept status quo","Inspire trust"],"answer":[3],"explanation":"NPTEL accepted answer: Inspire trust.","verified":"official","c":256,"rel":[["Jul-Oct 2024",10,1]]},{"q":"The leadership style where the responsibilities are shared by all and can be very useful in businesses where creative ideas are very important:","options":["Autocratic","Laissez-Faire","Charismatic","Paternalistic"],"answer":[1],"explanation":"NPTEL accepted answer: Laissez-Faire.","verified":"official","c":257,"rel":[["Jul-Oct 2024",10,1]]},{"q":"Democratic leadership style encourages decision making from different perspectives.","options":["True","False"],"answer":[0],"explanation":"Democratic style: leader listens to all subordinates; different perspectives \"are collated and consulted\" (Power and Leadership - Part 4); same item accepted True in the Jul-Oct 2024 key.","verified":"lecture","c":108,"rel":[["Jul-Oct 2024",10,0]]},{"q":"The ideal case in Blake Mouton Managerial Grid of Leadership style is:","options":["Country club","Impoverished","Produce or perish","Team Leader"],"answer":[3],"explanation":"NPTEL accepted answer: Team Leader.","verified":"official","c":375,"rel":[["Jul-Oct 2024",10,1],["Jul-Oct 2023",10,1]]}]},{"year":2026,"session":"Jul-Oct 2026","week":11,"source":"https://www.youtube.com/watch?v=5Sp1pkoSs9Y (MY SWAYAM; only valid solution video found - the NPTEL ASSIGNMENTS \"week 11\" upload 0P58hqFmA0w shows a different (safety) course)","questions":[{"q":"A type of thought exhibited by group members who try to minimize conflict and reach consensus without critically testing, analyzing and evaluating ideas.","options":["Groupthink","Instrumentality","Mundane task","Team cohesion"],"answer":[0],"explanation":"NPTEL accepted answer: Groupthink.","verified":"official","c":260,"rel":[["Jul-Oct 2024",11,1]]},{"q":"Airline attendant teams are an example of:","options":["Production teams","Service teams","Advisory teams","Management teams"],"answer":[1],"explanation":"NPTEL accepted answer: Service teams.","verified":"official","c":261,"rel":[["Jul-Oct 2024",11,1]]},{"q":"Groups are more cohesive than teams and groups are a subset of teams.","options":["True","False"],"answer":[1],"explanation":"\"team is a subset of group\" and teams are \"closed units than groups\" (Group Dynamics - Part 1); same item accepted False in the Jul-Oct 2024 key.","verified":"lecture","c":112,"rel":[["Jul-Oct 2024",11,0]]},{"q":"Which of the following is the source of organizational culture?","options":["Selection practices","Actions of top management","Socialization methods","Founder's vision/mission/attitudes"],"answer":[3],"explanation":"NPTEL accepted answer: Founder's vision/mission/attitudes.","verified":"official","c":388,"rel":[["Jul-Oct 2024",11,1],["Jul-Oct 2023",11,1]]},{"q":"The stage of group development at which unwritten rules for teams are established:","options":["Norming","Storming","Forming","Adjourning"],"answer":[0],"explanation":"NPTEL accepted answer: Norming.","verified":"official","c":384,"rel":[["Jul-Oct 2024",11,1],["Jul-Oct 2023",11,1]]},{"q":"Taking advantage of other members in a group and claiming ownership for their work is called:","options":["Altruism","Groupthink","Freeriding","Synergy"],"answer":[2],"explanation":"NPTEL accepted answer: Freeriding.","verified":"official","c":265,"rel":[["Jul-Oct 2024",11,1]]},{"q":"Sometimes in teams, people may think that if they work more, other people will take advantage of them and give all the responsibilities to them. So it is better to decrease their performance. This phenomenon is called:","options":["De-individualization","Social loafing","Freeriding","Sucker aversion"],"answer":[3],"explanation":"NPTEL accepted answer: Sucker aversion.","verified":"official","c":266,"rel":[["Jul-Oct 2024",11,1]]},{"q":"Low trust among the team members can often lead to social loafing.","options":["True","False"],"answer":[0],"explanation":"\"Low trust between team members can also be a reason for social loafing\" (Group Dynamics - Part 3); same item accepted True in the Jul-Oct 2024 key.","verified":"lecture","c":117,"rel":[["Jul-Oct 2024",11,0]]},{"q":"Culture influences both the conscious and unconscious level of the mind.","options":["True","False"],"answer":[0],"explanation":"\"Culture is a very powerful mechanism, which influences both conscious and unconscious level of the mind\" (Organizational Culture - Part 1); same item accepted True in the Jul-Oct 2024 key.","verified":"lecture","c":118,"rel":[["Jul-Oct 2024",11,0]]},{"q":"An organization in which its culture is driven by the motive for affiliation:","options":["Bureaucracy","Industrial Organization","Clubs","Educational Institutions"],"answer":[2],"explanation":"NPTEL accepted answer: Clubs.","verified":"official","c":269,"rel":[["Jul-Oct 2024",11,1]]}]},{"year":2026,"session":"Jul-Oct 2026","week":12,"source":"https://www.youtube.com/watch?v=kBZ2vSPkC2E (NPTEL ASSIGNMENTS); https://www.youtube.com/watch?v=a1nIiEKRTEw (MY SWAYAM)","questions":[{"q":"A set of interrelated and interdependent parts arranged in a manner that produces a unified whole is called:","options":["System","Training","Rituals","Span of control"],"answer":[0],"explanation":"NPTEL accepted answer: System.","verified":"official","c":270,"rel":[["Jul-Oct 2024",12,1],["Jul-Oct 2023",12,0]]},{"q":"Revolutionary change happens slowly in an organization and on its own.","options":["True","False"],"answer":[1],"explanation":"\"Evolutionary change means change which happens on its own, change which happens slowly\" (Organizational Change); same item accepted False in the Jul-Oct 2024 key.","verified":"lecture","c":121,"rel":[["Jul-Oct 2024",12,0]]},{"q":"The formal system of task and authority relationships that control how people coordinate their actions and use resources to achieve organizational goals is called:","options":["Organizational structure","Organizational change","Cognitive biases","Resource allocation"],"answer":[0],"explanation":"NPTEL accepted answer: Organizational structure.","verified":"official","c":272,"rel":[["Jul-Oct 2024",12,1]]},{"q":"Indian Railways having different zones of operation like Southern Railways, Central Railway etc. is an example of:","options":["Horizontal differentiation","Vertical differentiation","Spatial differentiation","None of the above"],"answer":[2],"explanation":"NPTEL accepted answer: Spatial differentiation. \"Spatial differentiation ... For example, we can have zonal units; Indian railways have different zones\" (Organizational Structure - Part 1).","verified":"official","c":393,"rel":[["Jul-Oct 2024",12,1],["Jul-Oct 2023",12,1]]},{"q":"Defining employees' roles through formal documentation is a part of formalization.","options":["True","False"],"answer":[0],"explanation":"\"formalization denotes the written policies rules and procedures\" (Organizational Structure - Part 3); same item accepted True in the Jul-Oct 2024 key.","verified":"lecture","c":124,"rel":[["Jul-Oct 2024",12,0]]},{"q":"_____ can provide more inputs into decision making and will help in reducing information overload.","options":["Centralization","Decentralization","Environmental uncertainty","None of the above"],"answer":[1],"explanation":"NPTEL accepted answer: Decentralization.","verified":"official","c":275,"rel":[["Jul-Oct 2024",12,1]]},{"q":"According to life-cycle perspective, the stage of organizational life cycle where the goals are ambiguous but there is a lot of creativity is called:","options":["Formalization-and-control stage","Collectivity stage","Elaboration-of-structure stage","Entrepreneurial stage"],"answer":[3],"explanation":"NPTEL accepted answer: Entrepreneurial stage.","verified":"official","c":276,"rel":[["Jul-Oct 2024",12,1]]},{"q":"The life-cycle perspective sees the organization as an organism.","options":["True","False"],"answer":[0],"explanation":"\"life cycle perspective ... looks at organization as an organism\" (Organizational Structure - Part 3); same item accepted True in the Jul-Oct 2024 key.","verified":"lecture","c":127,"rel":[["Jul-Oct 2024",12,0]]},{"q":"Redesigning business processes to increase organizational effectiveness is called:","options":["Restructuring","Reengineering","Organizational Ethics","Downsizing"],"answer":[1],"explanation":"NPTEL accepted answer: Reengineering.","verified":"official","c":278,"rel":[["Jul-Oct 2024",12,1]]},{"q":"Closed systems differentiate too much from the larger system and have their own identity.","options":["True","False"],"answer":[0],"explanation":"\"closed systems are the ones which differentiate too much from the larger system, which means they have their own identity\" (Organizational Structure - Part 3); same item accepted True in the Jul-Oct 2024 key.","verified":"lecture","c":129,"rel":[["Jul-Oct 2024",12,0]]}]},{"year":2025,"session":"Jul-Oct 2025","week":1,"source":"https://progiez.com/organizational-behaviour-nptel-week-1-answers (questions, noc25_mg80; answers not shown there); answers: NPTEL Accepted Answers of identical Jul-Oct 2024 questions (https://www.scribd.com/document/848535325/Nptel-Assignments-2024)","questions":[{"q":"Response of the organism or system to various stimuli or inputs, whether internal or external, conscious or subconscious, overt or covert, voluntary or involuntary is called:","options":["Organization","Behaviour","Resource","Productivity"],"answer":[1],"explanation":"Official NPTEL key: Behaviour. Intro to OB Part 1 definition of behaviour as response of the organism to stimuli.","verified":"official","c":282,"rel":[["Jul-Oct 2026",1,1],["Jul-Oct 2024",1,1],["Jul-Oct 2023",1,1]]},{"q":"Which of the following is not an organization?","options":["TATA Steels","UNICEF","Facebook Inc.","Germany"],"answer":[3],"explanation":"Official NPTEL key: Germany. Intro to OB Part 1 defines organization as a consciously coordinated social entity with a common goal (companies, NGOs/agencies); a country is not an organization.","verified":"official","c":280,"rel":[["Jul-Oct 2026",1,1],["Jul-Oct 2024",1,1],["Jul-Oct 2023",1,1]]},{"q":"More output for less input or being able to provide optimal output for a given input is called:","options":["Effectiveness","Productivity","Efficiency","Motivation"],"answer":[2],"explanation":"Official NPTEL key: Efficiency. Intro to OB Part 2: 'Efficiency is more output for less input or in other words, you are able to give an optimal output for a particular input.'","verified":"official","c":284,"rel":[["Jul-Oct 2026",0,1],["Jul-Oct 2026",1,1],["Jul-Oct 2024",1,1],["Jul-Oct 2023",1,1]]},{"q":"The social expectation on an individual is called:","options":["Role","Designation","Job","Task"],"answer":[0],"explanation":"Official NPTEL key: Role. Intro to OB Part 2: 'your designation prescribes certain things which are expected from you' - social expectation = role.","verified":"official","c":283,"rel":[["Jul-Oct 2026",1,1],["Jul-Oct 2024",1,1],["Jul-Oct 2023",1,1]]},{"q":"Which field can be called as the mother of Organizational behaviour?","options":["Anthropology","Economics","Industrial Psychology","Law"],"answer":[2],"explanation":"Official NPTEL key: Industrial Psychology. Intro to OB Part 4: 'industrial psychology can be called as the mother of organizational behaviour'.","verified":"official","c":285,"rel":[["Jul-Oct 2026",0,1],["Jul-Oct 2026",1,1],["Jul-Oct 2024",1,1],["Jul-Oct 2023",1,1]]},{"q":"The scientific management movement was pioneered by:","options":["Walter Dill Scott","Edward K Strong Jr.","Hugo Munsterberg","Frederick W Taylor"],"answer":[3],"explanation":"Official NPTEL key: Frederick W Taylor. Intro to OB Part 4/5: scientific management (Taylorism) pioneered by F. W. Taylor.","verified":"official","c":287,"rel":[["Jul-Oct 2026",1,1],["Jul-Oct 2024",1,1],["Jul-Oct 2023",1,1]]},{"q":"The assembly line of production was first introduced by Henry Ford.","options":["True","False"],"answer":[0],"explanation":"Intro to OB Part 4 (video clip): 'in 1913 Ford introduced his most revolutionary change... the assembly line was born.' NPTEL 2024 key: True.","verified":"lecture","c":136,"rel":[["Jul-Oct 2026",1,0],["Jul-Oct 2024",1,0]]},{"q":"The process of breaking down the entire job into specific tasks and see how each of these tasks are performed and how much time on an average a person will take to finish it is called:","options":["Time and Motion Study","Workplace management","Job Profile","Productivity"],"answer":[0],"explanation":"Official NPTEL key: Time and Motion Study. Intro to OB Part 4/5: time and motion study breaks the job into tasks and measures average time per task.","verified":"official","c":289,"rel":[["Jul-Oct 2026",1,1],["Jul-Oct 2024",1,1],["Jul-Oct 2023",1,1]]},{"q":"In an experiment, the group in which you make no changes is called the:","options":["Experimental Group","Focus Group","Control Group","Target Group"],"answer":[2],"explanation":"Official NPTEL key: Control Group. Intro to OB Part 5: 'Experimental group means the group in which you change the condition. Control group means you do not do anything.'","verified":"official","c":286,"rel":[["Jul-Oct 2026",1,1],["Jul-Oct 2024",1,1],["Jul-Oct 2023",1,1]]},{"q":"Hawthorne experiments were a set of experiments conducted to study the impact of assembly line on the health of the workers.","options":["True","False"],"answer":[1],"explanation":"Intro to OB Part 5: Hawthorne experiments aimed 'to understand how physical conditions... ventilation, illumination... temperature in workplace... affected performance of employees', not assembly lines and health. NPTEL 2024 key: False.","verified":"lecture","c":139,"rel":[["Jul-Oct 2026",1,0],["Jul-Oct 2024",1,0]]}]},{"year":2025,"session":"Jul-Oct 2025","week":2,"source":"https://progiez.com/organizational-behaviour-nptel-week-2-answers (questions, noc25_mg80; answers not shown there); answers: NPTEL Accepted Answers of identical Jul-Oct 2024 questions (https://www.scribd.com/document/848535325/Nptel-Assignments-2024)","questions":[{"q":"The process of giving meaning to sensory stimuli through organizing and interpreting is called:","options":["Sensation","Perception","Sublimation","Organization"],"answer":[1],"explanation":"Official NPTEL key: Perception. Perception Part 1: 'Perception is process of giving meaning to sensory stimulus through organizing and interpreting it.'","verified":"official","c":291,"rel":[["Jul-Oct 2026",0,1],["Jul-Oct 2026",2,1],["Jul-Oct 2024",2,1],["Jul-Oct 2023",2,1]]},{"q":"Perception is highly objective.","options":["True","False"],"answer":[1],"explanation":"Perception Part 1: 'So, perception is highly subjective.' NPTEL 2024 key: False.","verified":"lecture","c":141,"rel":[["Jul-Oct 2026",2,0],["Jul-Oct 2024",2,0],["Jul-Oct 2023",2,0]]},{"q":"Which of the following is an internal factor that influence the principles of perceptual selection?","options":["Contrast","Repetition","Motion","Habit"],"answer":[3],"explanation":"Official NPTEL key: Habit. Perception Part 1: internal factors in selection: 'The first factor is habit.' (contrast, repetition, motion are external).","verified":"official","c":293,"rel":[["Jul-Oct 2026",2,1],["Jul-Oct 2024",2,1],["Jul-Oct 2023",2,1]]},{"q":"[Image: a grid of dots] In the below picture, we tend to see columns of dots due to a perceptual grouping effect called:","options":["Similarity","Proximity","Continuity","Symmetry"],"answer":[1],"explanation":"Official NPTEL key: Proximity. Perception Part 2: grouping 'the first one is Proximity... we try to group them based on the proximity, how close they are.'","verified":"official","c":294,"rel":[["Jul-Oct 2026",2,1],["Jul-Oct 2024",2,1],["Jul-Oct 2023",2,1]]},{"q":"[Image: a door being opened] In the below image, one can still perceive the opening door to be of a rectangle shape due to:","options":["Figure-Ground Perception","Optical Illusions","Perceptual Constancy","Social Perception"],"answer":[2],"explanation":"Official NPTEL key: Perceptual Constancy. Perception Part 2: 'Perceptual constancy... in this example the door which you see you see it as a rectangle.'","verified":"official","c":295,"rel":[["Jul-Oct 2026",2,1],["Jul-Oct 2024",2,1],["Jul-Oct 2023",2,1]]},{"q":"According to Kelley's theory of causal attribution, the extent to which other people behave in the same manner as the person we are judging is called:","options":["Consensus","Consistency","Distinctiveness","Identity"],"answer":[0],"explanation":"Official NPTEL key: Consensus. Perception Part 3: 'consensus means whether many people agree to it or whether many people feel the same.'","verified":"official","c":296,"rel":[["Jul-Oct 2026",2,1],["Jul-Oct 2024",2,1],["Jul-Oct 2023",2,1]]},{"q":"The tendency to attribute others' action to internal causes while largely ignoring external factors is called:","options":["Halo effect","Team-Halo effect","Fundamental attribution error","Similar-to-me effect"],"answer":[2],"explanation":"Official NPTEL key: Fundamental attribution error. Perception Part 3/4: tendency to attribute others' behaviour to internal causes ignoring external factors = fundamental attribution error.","verified":"official","c":290,"rel":[["Jul-Oct 2026",2,1],["Jul-Oct 2024",2,1],["Jul-Oct 2023",2,1]]},{"q":"The word \"Carpenter\" immediately brings in to memory the image of a male individual rather than a female individual. This is an example of a job stereotype.","options":["True","False"],"answer":[0],"explanation":"Perception Part 4: job stereotypes are 'gender stereotypes, but we use these criteria when we talk about certain jobs'. NPTEL 2024 key: True.","verified":"lecture","c":147,"rel":[["Jul-Oct 2026",2,0],["Jul-Oct 2024",2,0],["Jul-Oct 2023",2,0]]},{"q":"There are many women at the bottom and middle level management roles but only a very few make it to the top. This is due to:","options":["Impression Management techniques","Golem effect","Pygmalion effect","Glass-ceiling effect"],"answer":[3],"explanation":"Official NPTEL key: Glass-ceiling effect. Perception Part 4: 'Glass ceiling effect means there are many women at the bottom and middle level of management... but there are very few' at the top.","verified":"official","c":298,"rel":[["Jul-Oct 2026",2,1],["Jul-Oct 2024",2,1],["Jul-Oct 2023",2,1]]},{"q":"The process through which individuals attempt to determine the causes behind others' behaviour is called attribution.","options":["True","False"],"answer":[0],"explanation":"Perception Part 2: 'Attribution means... trying to understand the cause behind others behaviour.' NPTEL 2024 key: True.","verified":"lecture","c":149,"rel":[["Jul-Oct 2026",2,0],["Jul-Oct 2024",2,0],["Jul-Oct 2023",2,0]]}]},{"year":2025,"session":"Jul-Oct 2025","week":3,"source":"https://progiez.com/organizational-behaviour-nptel-week-3-answers (questions, noc25_mg80; answers not shown there); answers: NPTEL Accepted Answers of identical Jul-Oct 2024 questions (https://www.scribd.com/document/848535325/Nptel-Assignments-2024)","questions":[{"q":"The meaning of the Latin word 'Persona' from which the word Personality arises is:","options":["Behaviour","Mask","Thought","Person"],"answer":[1],"explanation":"Official NPTEL key: Mask. Personality Part 1: 'Personality has its origins in the Latin word personare or persona which means a mask'.","verified":"official","c":302,"rel":[["Jul-Oct 2026",3,1],["Jul-Oct 2024",3,1],["Jul-Oct 2023",3,1]]},{"q":"Many psychologists argue that one's personality can be changed over a period of time because those qualities are formed because of social factors.","options":["True","False"],"answer":[0],"explanation":"Personality Part 2: 'personality... can be changed over a period of time because those qualities are formed because of social factors.' NPTEL 2024 key: True.","verified":"lecture","c":151,"rel":[["Jul-Oct 2026",3,0],["Jul-Oct 2024",3,0],["Jul-Oct 2023",3,0]]},{"q":"According to Sigmund Freud's psychoanalytic theory, the deepest level of consciousness is:","options":["Subconscious","Conscious state","Unconscious","Awareness"],"answer":[2],"explanation":"Official NPTEL key: Unconscious. Personality Part 3/4 (Freud's levels of consciousness): unconscious is the deepest level.","verified":"official","c":305,"rel":[["Jul-Oct 2026",3,1],["Jul-Oct 2024",3,1],["Jul-Oct 2023",3,1]]},{"q":"According to Sigmund Freud, reality principle is followed by:","options":["Id","Super Ego","Dream","Ego"],"answer":[3],"explanation":"Official NPTEL key: Ego. Personality Part 4: 'id driven by pleasure principle, ego is driven by reality principle, super ego is driven by moral principle'.","verified":"official","c":306,"rel":[["Jul-Oct 2026",3,1],["Jul-Oct 2024",3,1],["Jul-Oct 2023",3,1]]},{"q":"In social learning theory, the withdrawal of something which somebody likes to strengthen a behaviour is called:","options":["Negative Reinforcement","Positive Reinforcement","Reward","Punishment"],"answer":[0],"explanation":"Official NPTEL key: Negative Reinforcement. Personality Part 3: 'Negative reinforcement also strengthen behaviour... Negative reinforcement means withdrawal of something which somebody likes.'","verified":"official","c":300,"rel":[["Jul-Oct 2026",3,1],["Jul-Oct 2024",3,1],["Jul-Oct 2023",3,1]]},{"q":"The main proponent of Self Theory was:","options":["Sigmund Freud","Albert Bandura","Carl Rogers","B.F. Skinner"],"answer":[2],"explanation":"Official NPTEL key: Carl Rogers. Personality Parts 4-5: Carl Rogers' self theory (unconditional positive regard).","verified":"official","c":307,"rel":[["Jul-Oct 2026",3,1],["Jul-Oct 2024",3,1],["Jul-Oct 2023",3,1]]},{"q":"In Johari's Window model of self-awareness, the part of the self which is not known to ourselves, but others know is called:","options":["Open","Blind","Hidden","Unknown"],"answer":[1],"explanation":"Official NPTEL key: Blind. Personality Part 6 (Johari Window): blind self = known to others, not to self.","verified":"official","c":301,"rel":[["Jul-Oct 2026",3,1],["Jul-Oct 2024",3,1],["Jul-Oct 2023",3,1]]},{"q":"Employees with high self-esteem are more ready to take responsibilities.","options":["True","False"],"answer":[0],"explanation":"Personality Part 6: employees with high self-esteem 'will be ready to take responsibilities because they know what they are capable of'. NPTEL 2024 key: True.","verified":"lecture","c":157,"rel":[["Jul-Oct 2026",3,0],["Jul-Oct 2024",3,0],["Jul-Oct 2023",3,0]]},{"q":"People with ________ locus of control believe that others control their life and whatever happens in their life is because of outside factors.","options":["Internal","External"],"answer":[1],"explanation":"Official NPTEL key: External. Personality Part 7: external locus of control - outside factors/others control one's life.","verified":"official","c":309,"rel":[["Jul-Oct 2026",3,1],["Jul-Oct 2024",3,1],["Jul-Oct 2023",3,1]]},{"q":"According to Big Five Personality Theory, people who like to experiment and try and find out new things and are less judgmental about people of other cultures are high on:","options":["Adjustment","Agreeableness","Conscientiousness","Intellectual Openness"],"answer":[3],"explanation":"Official NPTEL key: Intellectual Openness. Personality Part 7 (Big Five): 'Intellectual openness is open to new experiences; ... they like to experiment'.","verified":"official","c":304,"rel":[["Jul-Oct 2026",3,1],["Jul-Oct 2024",3,1],["Jul-Oct 2023",3,1]]}]},{"year":2024,"session":"Jul-Oct 2024","week":1,"source":"https://www.scribd.com/document/848535325/Nptel-Assignments-2024 (screenshots of NPTEL portal, noc24_mg87, showing Accepted Answers) (Accepted Answers)","questions":[{"q":"Response of the organism or system to various stimuli or inputs, whether internal or external, conscious or subconscious, overt or covert, volunta iping","Tacit knowledge"],"answer":[3],"verified":"official","c":254,"rel":[["Jul-Oct 2026",10,1]]},{"q":"The form of political behaviour exhibited when employees try to form a group based on common language they speak is:","options":["Impression management","Building coalitions","Blaming","Manipulating information flow"],"answer":[1],"verified":"official","c":255,"rel":[["Jul-Oct 2026",10,1]]},{"q":"While managers rely on control, leaders","options":["Ask how and when","Focus on systems and structure","Accept status quo","Inspire trust"],"answer":[3],"verified":"official","c":256,"rel":[["Jul-Oct 2026",10,1]]},{"q":"The leadership style where the responsibilities are shared by all and can be very useful in businesses where creative ideas are very important:","options":["Autocratic","Laissez-Faire","Charismatic","Paternalistic"],"answer":[1],"verified":"official","c":257,"rel":[["Jul-Oct 2026",10,1]]},{"q":"Democratic leadership style encourages decision making from different perspectives.","options":["True","False"],"answer":[0],"verified":"official","c":258,"rel":[["Jul-Oct 2026",10,0]]},{"q":"The ideal case in Blake Mouton Managerial Grid of Leadership style is:","options":["Country club","Impoverished","Produce or perish","Team Leader"],"answer":[3],"verified":"official","c":375,"rel":[["Jul-Oct 2026",10,1],["Jul-Oct 2023",10,1]]}]},{"year":2024,"session":"Jul-Oct 2024","week":11,"source":"https://www.scribd.com/document/848535325/Nptel-Assignments-2024 (screenshots of NPTEL portal, noc24_mg87, showing Accepted Answers) (Accepted Answers)","questions":[{"q":"A type of thought exhibited by group members who try to minimize conflict and reach consensus without critically testing, analyzing and evaluating ideas.","options":["Groupthink","Instrumentality","Mundane task","Team cohesion"],"answer":[0],"verified":"official","c":260,"rel":[["Jul-Oct 2026",11,1]]},{"q":"Airline attendant teams are an example of:","options":["Production teams","Service teams","Advisory teams","Management teams"],"answer":[1],"verified":"official","c":261,"rel":[["Jul-Oct 2026",11,1]]},{"q":"Groups are more cohesive than teams and groups are a subset of teams.","options":["True","False"],"answer":[1],"verified":"official","c":262,"rel":[["Jul-Oct 2026",11,0]]},{"q":"Which of the following is the source of organizational culture?","options":["Selection practices","Actions of top management","Socialization methods","Founder's vision/mission/attitudes"],"answer":[3],"verified":"official","c":388,"rel":[["Jul-Oct 2026",11,1],["Jul-Oct 2023",11,1]]},{"q":"The stage of group development at which unwritten rules for teams are established:","options":["Norming","Storming","Forming","Adjourning"],"answer":[0],"verified":"official","c":384,"rel":[["Jul-Oct 2026",11,1],["Jul-Oct 2023",11,1]]},{"q":"Taking advantage of other members in a group and claiming ownership for their work is called:","options":["Altruism","Groupthink","Freeriding","Synergy"],"answer":[2],"verified":"official","c":265,"rel":[["Jul-Oct 2026",11,1]]},{"q":"Sometimes in teams, people may think that if they work more, other people will take advantage of them and give all the responsibilities to them. So it is better to decrease their performance. This phenomenon is called:","options":["De-individualization","Social loafing","Freeriding","Sucker aversion"],"answer":[3],"verified":"official","c":266,"rel":[["Jul-Oct 2026",11,1]]},{"q":"Low trust among the team members can often lead to social loafing.","options":["True","False"],"answer":[0],"verified":"official","c":267,"rel":[["Jul-Oct 2026",11,0]]},{"q":"Culture influences both the conscious and unconscious level of the mind.","options":["True","False"],"answer":[0],"verified":"official","c":268,"rel":[["Jul-Oct 2026",11,0]]},{"q":"An organization in which its culture is driven by the motive for affiliation:","options":["Bureaucracy","Industrial Organization","Clubs","Educational Institutions"],"answer":[2],"verified":"official","c":269,"rel":[["Jul-Oct 2026",11,1]]}]},{"year":2024,"session":"Jul-Oct 2024","week":12,"source":"https://www.scribd.com/document/848535325/Nptel-Assignments-2024 (screenshots of NPTEL portal, noc24_mg87, showing Accepted Answers) (Accepted Answers)","questions":[{"q":"A set of interrelated and interdependent parts arranged in a manner that produces a unified whole is called:","options":["System","Training","Rituals","Span of control"],"answer":[0],"verified":"official","c":270,"rel":[["Jul-Oct 2026",12,1],["Jul-Oct 2023",12,0]]},{"q":"Revolutionary change happens slowly in an organization and on its own.","options":["True","False"],"answer":[1],"verified":"official","c":271,"rel":[["Jul-Oct 2026",12,0]]},{"q":"The formal system of task and authority relationships that control how people coordinate their actions and use resources to achieve organizational goals is called:","options":["Organizational structure","Organizational change","Cognitive biases","Resource allocation"],"answer":[0],"verified":"official","c":272,"rel":[["Jul-Oct 2026",12,1]]},{"q":"Indian Railways having different zones of operation like Southern Railways, Central Railway etc. is an example of:","options":["Horizontal differentiation","Vertical differentiation","Spatial differentiation","None of the above"],"answer":[2],"verified":"official","c":393,"rel":[["Jul-Oct 2026",12,1],["Jul-Oct 2023",12,1]]},{"q":"Defining employees' roles through formal documentation is a part of formalization.","options":["True","False"],"answer":[0],"verified":"official","c":274,"rel":[["Jul-Oct 2026",12,0]]},{"q":"__________ can provide more inputs into decision making and will help in reducing information overload.","options":["Centralization","Decentralization","Environmental uncertainty","None of the above"],"answer":[1],"verified":"official","c":275,"rel":[["Jul-Oct 2026",12,1]]},{"q":"According to life-cycle perspective, the stage of organizational life cycle where the goals are ambiguous but there is a lot of creativity is called:","options":["Formalization-and-control stage","Collectivity stage","Elaboration-of-structure stage","Entrepreneurial stage"],"answer":[3],"verified":"official","c":276,"rel":[["Jul-Oct 2026",12,1]]},{"q":"The life-cycle perspective sees the organization as an organism.","options":["True","False"],"answer":[0],"verified":"official","c":277,"rel":[["Jul-Oct 2026",12,0]]},{"q":"Redesigning business processes to increase organizational effectiveness is called:","options":["Restructuring","Reengineering","Organizational Ethics","Downsizing"],"answer":[1],"verified":"official","c":278,"rel":[["Jul-Oct 2026",12,1]]},{"q":"Closed systems differentiate too much from the larger system and have their own identity.","options":["True","False"],"answer":[0],"verified":"official","c":279,"rel":[["Jul-Oct 2026",12,0]]}]},{"year":2023,"session":"Jul-Oct 2023","week":1,"source":"https://www.youtube.com/watch?v=vpuaUaSbOOY (nptel edu, noc23_mg73 portal recording; question text/options); answers: NPTEL Accepted Answers of identical Jul-Oct 2024 questions (https://www.scribd.com/document/848535325/Nptel-Assignments-2024)","questions":[{"q":"Which of the following is not an organization?","options":["TATA Steels","UNICEF","Facebook Inc.","Germany"],"answer":[3],"explanation":"Official NPTEL key: Germany. Intro to OB Part 1 defines organization as a consciously coordinated social entity with a common goal (companies, NGOs/agencies); a country is not an organization.","verified":"official","c":280,"rel":[["Jul-Oct 2026",1,1],["Jul-Oct 2025",1,1],["Jul-Oct 2024",1,1]]},{"q":"Hawthorne experiments were a set of experiments conducted to study the impact of assembly lines on the health of the workers.","options":["True","False"],"answer":[1],"explanation":"Intro to OB Part 5: Hawthorne experiments aimed 'to understand how physical conditions... ventilation, illumination... temperature in workplace... affected performance of employees', not assembly lines and health. NPTEL 2024 key: False.","verified":"lecture","c":281},{"q":"Response of the organism or system to various stimuli or inputs, whether internal or external, conscious or subconscious, overt or covert, voluntary or involuntary is called:","options":["Organization","Behaviour","Resource","Productivity"],"answer":[1],"explanation":"Official NPTEL key: Behaviour. Intro to OB Part 1 definition of behaviour as response of the organism to stimuli.","verified":"official","c":282,"rel":[["Jul-Oct 2026",1,1],["Jul-Oct 2025",1,1],["Jul-Oct 2024",1,1]]},{"q":"The social expectation on an individual is called:","options":["Role","Designation","Job","Task"],"answer":[0],"explanation":"Official NPTEL key: Role. Intro to OB Part 2: 'your designation prescribes certain things which are expected from you' - social expectation = role.","verified":"official","c":283,"rel":[["Jul-Oct 2026",1,1],["Jul-Oct 2025",1,1],["Jul-Oct 2024",1,1]]},{"q":"More output for less input or being able to provide optimal output for a given input is called:","options":["Effectiveness","Productivity","Efficiency","Motivation"],"answer":[2],"explanation":"Official NPTEL key: Efficiency. Intro to OB Part 2: 'Efficiency is more output for less input or in other words, you are able to give an optimal output for a particular input.'","verified":"official","c":284,"rel":[["Jul-Oct 2026",0,1],["Jul-Oct 2026",1,1],["Jul-Oct 2025",1,1],["Jul-Oct 2024",1,1]]},{"q":"Which field can be called as the mother of Organizational behaviour?","options":["Anthropology","Economics","Industrial Psychology","Law"],"answer":[2],"explanation":"Official NPTEL key: Industrial Psychology. Intro to OB Part 4: 'industrial psychology can be called as the mother of organizational behaviour'.","verified":"official","c":285,"rel":[["Jul-Oct 2026",0,1],["Jul-Oct 2026",1,1],["Jul-Oct 2025",1,1],["Jul-Oct 2024",1,1]]},{"q":"In an experiment, the group in which you make no changes is called the:","options":["Experimental Group","Focus Group","Control Group","
