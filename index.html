<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IIoT Quiz Bench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: control-panel bench. Left rail = drill builder + settings, main = week grid / active question. Stack-light dots (red/amber/green) encode your best score per week. */
:root{
  --bg:#e9edf1; --panel:#fbfcfd; --ink:#16202a; --muted:#566373; --line:#cdd5de; --chip:#dfe5ec;
  --accent:#b97c00; --accent-soft:#f6e7c4; --accent-ink:#1d1500;
  --warn:#c98a00; --ok:#17834a; --ok-soft:#dcf2e5; --bad:#bf3434; --bad-soft:#f8e0e0; --idle:#9aa6b3;
  --f-display:"Chakra Petch","Arial Narrow",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f141a; --panel:#171e26; --ink:#e4e9ef; --muted:#93a1b0; --line:#2a3542; --chip:#222c37;
  --accent:#f0b429; --accent-soft:#3a2d0c; --accent-ink:#1d1500;
  --warn:#f0b429; --ok:#41c97c; --ok-soft:#123423; --bad:#f07272; --bad-soft:#3d1a1c; --idle:#56636f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141a; --panel:#171e26; --ink:#e4e9ef; --muted:#93a1b0; --line:#2a3542; --chip:#222c37;
  --accent:#f0b429; --accent-soft:#3a2d0c; --accent-ink:#1d1500;
  --warn:#f0b429; --ok:#41c97c; --ok-soft:#123423; --bad:#f07272; --bad-soft:#3d1a1c; --idle:#56636f; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--f-body);margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:20px 48px}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font:600 12px/1.2 var(--f-display);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

/* header */
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;padding-bottom:16px;border-bottom:2px solid var(--ink);margin-bottom:20px}
.brand h1{font:700 clamp(24px,4vw,34px)/1.05 var(--f-display);margin:4px 0 0;text-wrap:balance}
.brand h1 span{color:var(--accent)}
.meters{display:flex;gap:20px;flex-wrap:wrap}
.meter b{display:block;font:700 22px/1 var(--f-mono)}
.meter small{font-size:12px;color:var(--muted)}

/* layout */
.grid{display:grid;grid-template-columns:300px minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}
aside{display:grid;gap:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.panel h2{font:600 15px/1.2 var(--f-display);letter-spacing:.04em;text-transform:uppercase;margin:0 0 12px}

.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{background:transparent;border:0;padding:8px 4px;font-size:14px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel);font-weight:700}
.hintline{font-size:13px;color:var(--muted);margin:8px 0 0}
.check{display:flex;gap:8px;align-items:center;font-size:14px;margin-top:10px}
.check input{accent-color:var(--accent);width:16px;height:16px}

.weekpick{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.runpick{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pickhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.weekpick label,.runpick label{display:block}
.weekpick input,.runpick input{position:absolute;opacity:0;pointer-events:none}
.weekpick span,.runpick span{display:block;text-align:center;padding:6px 0;border:1px solid var(--line);border-radius:4px;font:500 13px var(--f-mono);background:var(--bg)}
.weekpick input:checked+span,.runpick input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.weekpick input:focus-visible+span,.runpick input:focus-visible+span{outline:2px solid var(--ink);outline-offset:1px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
.row select{padding:7px 8px;border:1px solid var(--line);border-radius:4px;background:var(--bg)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:9px 14px;font-weight:700;font-size:14px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.block{width:100%;margin-top:12px}
.linkish{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;font-size:13px}

/* session tabs */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px}
.tabs button{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 14px;font-size:14px;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--panel);font-weight:700}

.session{margin-bottom:28px}
.session-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.session-head h3{font:700 20px/1.2 var(--f-display);margin:0}
.weeks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.wk{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:8px}
.wk-top{display:flex;justify-content:space-between;align-items:center}
.wk-num{font:700 18px/1 var(--f-display)}
.wk-meta{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.wk-actions{display:flex;gap:6px}
.wk-actions .btn{flex:1;padding:6px 8px;font-size:13px}
.lamp{display:inline-flex;gap:3px}
.lamp i{width:9px;height:9px;border-radius:50%;background:var(--chip);border:1px solid var(--line)}
.lamp[data-l="r"] i:nth-child(1){background:var(--bad);border-color:var(--bad)}
.lamp[data-l="a"] i:nth-child(2){background:var(--warn);border-color:var(--warn)}
.lamp[data-l="g"] i:nth-child(3){background:var(--ok);border-color:var(--ok)}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}

/* quiz */
.qbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.qbar .title{font:700 18px/1.2 var(--f-display);flex:1;min-width:0}
.progress{height:4px;background:var(--chip);border-radius:2px;overflow:hidden;margin-bottom:18px}
.progress div{height:100%;background:var(--accent);transition:width .2s}
.qcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:clamp(16px,3vw,28px);max-width:820px}
.qhead{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:10px;font-size:13px;color:var(--muted)}
.qtext{font:700 clamp(18px,2.4vw,21px)/1.45 var(--f-body);margin:0 0 6px;white-space:pre-line}
.ok-chip{display:inline-block;font:600 11px var(--f-display);letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--ok);color:var(--ok);padding:1px 6px;border-radius:3px;margin-left:6px}
.flag{display:inline-block;font:600 11px var(--f-display);letter-spacing:.08em;text-transform:uppercase;border:1px dashed var(--accent);color:var(--muted);padding:1px 6px;border-radius:3px;margin-left:6px}
.imp{display:inline-block;font:600 11px/1.5 var(--f-display);letter-spacing:.08em;text-transform:uppercase;padding:1px 7px;border-radius:3px;margin-left:6px;white-space:nowrap;border:1px solid var(--accent)}
.imp.t2{background:var(--accent);color:var(--accent-ink)}
.imp.t1{color:var(--ink)}
.relq{font-size:13px;color:var(--muted);margin-top:8px}
.focus{display:grid;gap:14px;margin-bottom:20px;border-color:var(--accent)}
.focus p{margin:0;color:var(--muted);font-size:14px;max-width:62ch}
.fstats{display:flex;gap:28px;flex-wrap:wrap}
.fstat{display:grid;gap:4px;justify-items:start}
.fstat b{font:700 30px/1 var(--f-mono)}
.fstat .imp{margin-left:0}
.fstat small{font-size:12px;color:var(--muted)}
.focus .row{margin-top:0}
.wk-imp{font-size:13px;color:var(--muted)}
.wk-imp b{color:var(--ink);font-family:var(--f-mono)}
.multi{display:inline-block;font:600 12px var(--f-display);letter-spacing:.08em;text-transform:uppercase;background:var(--accent-soft);color:var(--ink);padding:2px 8px;border-radius:3px;margin-bottom:10px}
.opts{display:grid;gap:8px;margin-top:14px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:var(--r);padding:12px 14px;line-height:1.45;width:100%}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt:disabled{cursor:default}
.opt .k{flex:none;width:26px;height:26px;display:grid;place-items:center;border:1px solid var(--line);border-radius:4px;font:700 13px var(--f-mono);background:var(--panel)}
.opt span:last-child{min-width:0;overflow-wrap:anywhere}
.opt.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.opt.sel .k{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft);box-shadow:inset 0 0 0 1px var(--ok)}
.opt.ok .k{background:var(--ok);border-color:var(--ok);color:var(--panel)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft);box-shadow:inset 0 0 0 1px var(--bad)}
.opt.bad .k{background:var(--bad);border-color:var(--bad);color:var(--panel)}
.numrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:14px}
.numin{font:600 18px var(--f-mono);padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);width:min(240px,100%)}
.numin:focus{outline:2px solid var(--accent);outline-offset:1px}
.numin.ok{border-color:var(--ok);background:var(--ok-soft)}
.numin.bad{border-color:var(--bad);background:var(--bad-soft)}
.feedback{margin-top:16px;padding:12px 14px;border-radius:var(--r);border:1px solid var(--line);font-size:15px}
.feedback.ok{border-color:var(--ok);background:var(--ok-soft)}
.feedback.bad{border-color:var(--bad);background:var(--bad-soft)}
.feedback strong{font-family:var(--f-display);letter-spacing:.03em}
.src{font-size:12px;color:var(--muted);margin-top:8px;overflow-wrap:anywhere}
.src a{color:inherit}
.qactions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;justify-content:space-between}
.qactions .sp{flex:1}
.dots{display:flex;flex-wrap:wrap;gap:5px;margin-top:18px;max-width:820px}
.dots button{width:30px;height:30px;border:1px solid var(--line);background:var(--panel);border-radius:4px;font:500 12px var(--f-mono);padding:0}
.dots button.cur{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.dots button.ans{background:var(--accent-soft)}
.dots button.ok{background:var(--ok);border-color:var(--ok);color:var(--panel)}
.dots button.bad{background:var(--bad);border-color:var(--bad);color:var(--panel)}
.keys{font-size:12px;color:var(--muted);margin-top:14px}
.keys kbd{font:500 11px var(--f-mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;padding:0 4px;background:var(--panel)}

/* results + study */
.score{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin-bottom:8px}
.score b{font:700 56px/1 var(--f-mono)}
.score .of{font:500 20px var(--f-mono);color:var(--muted)}
.verdict{font:700 20px var(--f-display)}
.list{display:grid;gap:12px;margin-top:20px;max-width:820px}
.item{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.item .qtext{font-size:16px}
.item ul{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:4px}
.item li{display:flex;gap:8px;font-size:15px;padding:4px 8px;border-radius:4px}
.item li .k{font:700 13px var(--f-mono);flex:none;width:18px}
.item li.right{background:var(--ok-soft);font-weight:700}
.item li.wrong{background:var(--bad-soft);text-decoration:line-through}
.item .exp{font-size:14px;color:var(--muted);margin-top:8px}
.note{font-size:13px;color:var(--muted);max-width:820px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:8px 16px;border-radius:4px;font-size:14px}
.courses{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;margin-bottom:10px}
.courses a{color:var(--muted)}
.courses b{color:var(--ink);border-bottom:2px solid var(--accent)}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>

<script>window.QUIZ_DATA = {"sets":[{"year":2023,"session":"Jan-Apr 2023","week":1,"source":"https://progiez.com/nptel-introduction-to-industry-4-assignment-1-answers","questions":[{"q":"In the context of static characteristics of a sensor, which of the following signifies resolution?","options":["It provides the smallest change in the input that a sensor is capable of Sensing","It is the difference between the standard value and the value produced by Sensor","It is the deviation of sensor value curve from a particular straight line","It represents the correctness of the output compared to a superior system"],"answer":[0],"explanation":"Lecture 01 (Sensing & Actuation): 'resolution is about the smallest change in the input that a sensor is capable of sensing'.","verified":"lecture","c":0},{"q":"What is the general operating voltage range of commercial sensors which are available for circuit enthusiasts and hobbyists?","options":["3.3 to 5 V","4.5 to 8 V","3.5 to 12 V","3.3 to 8 V"],"answer":[0],"explanation":"Not stated in the lecture transcript; hobbyist sensor modules (DHT, MQ, HC-SR04, PIR) typically run at 3.3-5 V, matching all answer keys.","verified":"reasoning","c":1},{"q":"Which of the following actuators produce linear displacement?","options":["Manual Linear Actuator","Fluid Power Linear Actuator","Electric Linear Actuator","All of the above"],"answer":[3],"explanation":"Lecture 01 (Sensing & Actuation): electric linear, fluid power linear and manual linear actuators all produce linear displacement.","verified":"lecture","c":2},{"q":"IEEE 802.15.4 uses __ protocol for data transmission.","options":["ALOHA","CSMA-CA","CSMA-CD","None of the above"],"answer":[1],"explanation":"Lecture 02 (IoT Connectivity Part I): for 802.15.4 'The MAC protocol that is typically used is the CSMA-CA protocol'.","verified":"lecture","c":3},{"q":"Which of the following is not an operating frequency of ZigBee?","options":["950 KHz","868 MHz","902-928 MHz","2.4 GHz"],"answer":[0],"explanation":"Lecture 02 (IoT Connectivity Part I): ZigBee 'operates in three frequencies 868 MHz, 902 to 928 MHz and 2.4 GHz' - 950 KHz is not one.","verified":"lecture","c":4},{"q":"What is/are the role(s) of adaptation layer in 6LoWPAN?","options":["Packet fragmentation & packet reassembly","Compression of header","Routing of data link layer","All the above"],"answer":[3],"explanation":"Lecture 02 (IoT Connectivity Part I): 6LoWPAN adaptation layer does fragmentation/reassembly, 'compression of header, routing of data link layer'.","verified":"lecture","c":5},{"q":"Maximum payload allowed in wireless HART is ______ bytes?","options":["63","127","255","512"],"answer":[1],"explanation":"Lecture 02 (IoT Connectivity Part I): WirelessHART 'payload size that is allowed is 127 bytes'.","verified":"lecture","c":6},{"q":"Radio dead-spots can be bypassed using a process called _______.","options":["Healing","Multi-hop","Adaptation","Reduction"],"answer":[0],"explanation":"Lecture 03 (IoT Connectivity Part II): radio dead-spots 'can be bypassed using a process in Z-wave which is known as healing'.","verified":"lecture","c":7},{"q":"In which application domain does ISA 100.11a is primarily used?","options":["Home/Office Automation","System for Smart Security and Surveillance","Systems for Smart Energy Management","Automation in large scale complex industries"],"answer":[3],"explanation":"Lecture 03 (IoT Connectivity Part II): ISA 100.11a applications are 'automation in large scale complex industries'.","verified":"lecture","c":8},{"q":"Which wireless communication technology is based on Ad-hoc Piconets?","options":["Wireless HART","ZigBee","Bluetooth","Z-Wave"],"answer":[2],"explanation":"Lecture 03 (IoT Connectivity Part II): Bluetooth forms 'Ad-hoc networks' organised as Piconets.","verified":"lecture","c":9},{"q":"What does the abbreviation, NFC, stands for?","options":["New Frequency communication","Near Frequency communication","Near Field communication","Non-Friendly communication"],"answer":[2],"explanation":"Lecture 03 (IoT Connectivity Part II): NFC is near field communication (close proximity <10 cm).","verified":"lecture","c":10},{"q":"Which of the following work groups extend the integration of the IoT devices from network to service level.","options":["6LoWPAN","ROLL","CoRE","None of the above"],"answer":[2],"explanation":"Lecture 04 (IoT Networking Part I): 'CoRE ... extends the integration of IoT devices from networks to the service level'.","verified":"lecture","c":11},{"q":"QoS policies for IoT Network includes ______.","options":["Resource utilization","Data timeliness","Data availability","All of the above"],"answer":[3],"explanation":"Lecture 04 (IoT Networking Part I): 'QoS policies for IoT networks includes resource utilization, data timeliness, data availability, and data delivery'.","verified":"lecture","c":12,"rel":[["Jul-Oct 2022",1,0]]},{"q":"Which IoT networking protocol supports caching capabilities to improve the response time and reduce bandwidth consumption?","options":["MQTT","XMPP","CoAP","AMQP"],"answer":[2],"explanation":"Lecture does not discuss caching; among the options only CoAP (RFC 7252) has built-in response caching/proxying to cut latency and bandwidth.","verified":"reasoning","c":13},{"q":"Which IoT networking protocol is used in the Military?","options":["DDS RTPS","IEEE 1888","AMCP","CoAP"],"answer":[0],"explanation":"Lecture 05 (IoT Networking Part II): DDS RTPS 'application such as military, industrial and healthcare monitoring'.","verified":"lecture","c":14}]},{"year":2023,"session":"Jan-Apr 2023","week":2,"source":"https://progiez.com/nptel-introduction-to-industry-4-assignment-2-answers","questions":[{"q":"Which industrial revolution is coined as “The second Machine Age” by Prof. Erik Brynjolfsson and Andrew McAfee of MIT?","options":["First Industrial Revolution","Second Industrial Revolution","Third Industrial Revolution","Fourth Industrial Revolution"],"answer":[3],"explanation":"Lecture 06 (The Fourth Revolution): 'the fourth industrial revolution, this term was coined as the second machine age by Prof. Erik ... and Andrew McAfee'.","verified":"lecture","c":15},{"q":"Automation in manufacturing system, computers, the Internet, and usage of renewable energies are some of the advancement in technologies, which took place during the ______.","options":["First Industrial Revolution","Second Industrial Revolution","Third Industrial Revolution","Fourth Industrial Revolution"],"answer":[2],"explanation":"Lecture 06 (The Fourth Revolution): third revolution (1960s) brought computers, digitization, internet; renewables listed alongside.","verified":"lecture","c":16},{"q":"Which of the following is/are probable tipping points in 2025?","options":["Intergalactic travels","Clothes connected to the internet","Mars Exploration","AI with human emotions"],"answer":[1],"explanation":"Lecture 06 (The Fourth Revolution): tipping points by 2025 include 'clothing ... connected to the internet'.","verified":"lecture","c":17},{"q":"Which of the following is provided in a sustainable Industry?","options":["Renewable energy","Low toxic gas emission","Low-waste production","High value products"],"answer":[2],"explanation":"Lecture 07 (Sustainability Assessment of Manufacturing Industry): 'A sustainable industry basically provides energy efficiency, conservation of resources, and low waste production'.","verified":"lecture","c":18},{"q":"Which of the following is an example of Information and Communication Technology (ICT)?","options":["Enterprise Resource Planning (ERP)","Global Positioning System (GPS)","Radio Frequency Identification (RFID) system","All of the above"],"answer":[3],"explanation":"Lecture 07 (Sustainability Assessment of Manufacturing Industry): ICT enables ERP, wireless communication, GPS and RFID systems.","verified":"lecture","c":19},{"q":"How many different categories of countries are there based on population growth?","options":["2","3","4","5"],"answer":[1],"explanation":"Lecture 07 (Sustainability Assessment of Manufacturing Industry): 'three different types of countries based on the population growth'.","verified":"lecture","c":20},{"q":"Which of the following is an optimistic view of population growth?","options":["Enhances the economic growth","Consumes most of the economic investments in safety, need for schools, hospitals, universities","Increases globalization issue such as trade and commerce","None of the above"],"answer":[2],"explanation":"Lecture 07 (Sustainability Assessment of Manufacturing Industry): 'optimistic view ... increases the globalization issues such as trade and commerce'.","verified":"lecture","c":21},{"q":"Which company developed Lean Production System?","options":["Hyundai Motor Company","Honda Motor Company","Kia Corporation","Toyota motor corporation"],"answer":[3],"explanation":"Lecture 08 (Lean Production System): lean originated in Toyota (Toyota Production System).","verified":"lecture","c":22},{"q":"Why should companies implement lean approach?","options":["Increase product quality","Improved lead times","Cost efficient","All of the above"],"answer":[3],"explanation":"Lecture 08 (Lean Production System): lean is adopted 'to reduce the cost, to reduce the time of production, and to improve the quality'.","verified":"lecture","c":23},{"q":"Which of the following cannot be considered as a medium of getting smart and connected?","options":["Embedded Systems","Cloud computing","Manufacturing system","Sensors"],"answer":[2],"explanation":"Lecture 09 (Smart and Connected Business Perspective): mediums for smart & connected are sensors/actuators, IoT network, cloud, embedded systems - not the manufacturing system.","verified":"lecture","c":24},{"q":"What are the four key attributes of smart business models?","options":["Value addition, revenue enhancements, and technologies","Value proposition, revenue centralization, and technologies","Value addition, revenue streams, and emer "Lecture 10 (Smart Factories): big data analytics helps 'improving the value streams ... predicting the future ... KPIs'.","verified":"lecture","c":29}]},{"year":2023,"session":"Jan-Apr 2023","week":3,"source":"https://progiez.com/nptel-introduction-to-industry-4-assignment-3-answers","questions":[{"q":"Which of the following is true regarding Cyber-Physical Systems?","options":["They are devices having information processing systems embedded into them.","They are typically confined to a single device","They are networked set of embedded systems","All of the above"],"answer":[2],"explanation":"L11 CPS: embedded system is 'confined to this particular single device' while 'in a cyber physical system ... a network set of such kind of embedded systems'.","verified":"lecture","c":30},{"q":"What are the 5 Cs in the CPS “5C architecture” for Industry 4.0?","options":["Connection, Conversion, Cyber, Cognition, Configuration","Connection, Communication, Cyber, Cognition, Configuration","Connection, Communication, Cyber, Carrier, Configuration","Connection, Conversion, Cyber, Cognition, Carrier"],"answer":[0],"explanation":"L11 CPS: '5C architecture ... Connectivity, conversion, cyber, cognition, and configuration'.","verified":"lecture","c":31,"rel":[["Jan-Apr 2024",3,0]]},{"q":"What are Smart Sensors?","options":["They are the integration of sensors and actuators with a processor and a communication module.","They are universal sensors which can sense a wide range of different stimuli.","They are the kind of sensors which do not require a power source to operate.","All of the above"],"answer":[0],"explanation":"L11 CPS: smart sensors are 'integration of sensors and actuators, with a processor and a communication module'.","verified":"lecture","c":32},{"q":"Which of the following is an example of Collaboration platform","options":["Google Drive","Outlook","Backblaze","ProWork Flow"],"answer":[3],"explanation":"L12 Collaboration Platform & PLM: 'pro-work flow ... is the name ulations","Semi-immersive simulations","Non-immersive simulations","Both (a) and (b)"],"answer":[0],"explanation":"L13: fully-immersive simulations deliver 'a wide field of view using different head mounted displays, motion detecting devices'.","verified":"lecture","c":39},{"q":"State true or false — “Linear regression, logistic regression, random forest, decision tree are some of the most popular unsupervised learning algorithms”.","options":["False","True"],"answer":[0],"explanation":"Linear/logistic regression, random forest and decision trees are supervised algorithms, so the statement is false (L14 AI does not list them).","verified":"reasoning","c":40},{"q":"A computer program without AI uses __ method whereas computer program with AI uses _ method","options":["Large database and algorithmic search, Large knowledge base and heuristic search","Large knowledge base and heuristic search, Large database and algorithmic search","Large knowledge base and algorithmic search, Large database and heuristic search","None of the above"],"answer":[0],"explanation":"L14 AI: 'a computer program without AI uses large databases and ... algorithmic search ... with AI uses large knowledge base and heuristic search'.","verified":"lecture","c":41},{"q":"Which of the following is correct?","options":["Machine Learning ⊆ Deep Learning ⊆ Artificial Intelligence","Deep Learning ⊆ Artificial Intelligence ⊆ Machine Learning","Deep Learning ⊆ Machine Learning ⊆ Artificial Intelligence","Artificial Intelligence ⊆ Machine Learning ⊆ Deep Learning"],"answer":[2],"explanation":"L14: 'deep learning is a branch of machine learning. Machine learning or deep learning are basically branches of artificial intelligence'.","verified":"lecture","c":42},{"q":"Big data consists of __ .","options":["Both structured and non-structured data","Only structured data","Only non-structured data","None of the above"],"answer":[0],"explanation":"L15 Big Data: big data 'exhibit the properties of non-structured data, but they could also have structure data'.","verified":"lecture","c":43},{"q":"What does the word “veracity” indicate in Big Data?","options":["It indicates the data which have no restriction over the input data formats.","It indicates velocity of generation of data.","It indicates the data whose meaning is constantly changing.","It indicates biasness in the data, unusualness and noise in data."],"answer":[3],"explanation":"L15: 'Veracity indicates the biasness in the data and ... the unusualness and noise in the data'.","verified":"lecture","c":44}]},{"year":2023,"session":"Jan-Apr 2023","week":4,"source":"https://progiez.com/nptel-introduction-to-industry-4-assignment-4-answers","questions":[{"q":"Protection of internet-connected systems from cyber-attacks is known as _ .","options":["Network security","Internet security","Web security","Cybersecurity"],"answer":[3],"explanation":"L16 Cybersecurity: protection of the internet-connected cyber infrastructure (hardware, software, data) against attacks.","verified":"lecture","c":45},{"q":"In which category of countermeasure does an application firewall fall?","options":["Hardware","Software","Both (a) and (b)","None of the above"],"answer":[1],"explanation":"L16: 'Software level, one could use different application firewalls'.","verified":"lecture","c":46},{"q":"State true or false — “Cybersecurity is recognized as a subset of information security”.","options":["True","False"],"answer":[1],"explanation":"L16: 'Information security, it is basically recognized as a subset of Cybersecurity'. The statement reverses this.","verified":"lecture","c":47},{"q":"Which of the following is/are correct regarding network security?","options":["It provides protection from unofficial access, improper use, fault, deletion, demolition","It is an analytical action which categorizes information benefits.","It ensures the protection of applications from outer threats.","All of the above"],"answer":[0],"explanation":"L16: network security 'would provide protection from unauthorized access, improper use, fault, deletion, demolition'. B is OPSEC and C is application security.","verified":"lecture","c":48},{"q":"What is a malware?","options":["A computer program which is used to disturb the computer user, such as computer viruses, spyware etc.","A computer program which breaks security policy to get critical information, which is typically secured.","A computer program which provides a facility to the attacker in which the attacker locks the user’s computer files by using an encryption and demand some money to unlock them.","None of the above"],"answer":[0],"explanation":"L16: 'Malware ... is a computer program which is used to disturb the computer user such as different computer viruses, spyware'.","verified":"lecture","c":49},{"q":"What is SDCMA stand for?","options":["Software-Defined Cloud Management Architecture","Software-Developed Cloud Manufacturing Architecture","Software-Developed Cloud Management Architecture","Software-Defined Cloud Manufacturing Architecture"],"answer":[3],"explanation":"L16: 'software defined cloud manufacturing architecture' (SDCMA).","verified":"lecture","c":50,"rel":[["Jul-Oct 2022",4,0]]},{"q":"What are the three key differences between IIoT and Automation?","options":["Connectivity, advanced analytics, and IT tools and methodologies","Ubiquitous sensing, advanced analytics, and IT tools and methodologies","Advance sensing, connectivity, and IT tools and methodologies","Ubiquitous sensing, connectivity, and advanced analytics"],"answer":[1],"explanation":"L17 Basics of IIoT: differences between IIoT and automation are ubiquitous sensing, analytics, and IT tools and methodologies.","verified":"lecture","c":51,"rel":[["Jan-Apr 2024",4,0],["Jan-Apr 2025",4,0]]},{"q":"What is the role of optimum scheduling in transportation & logistics?","options":["It provides good customer services by reducing cancellation and delays.","It provides better safety to both the on boarded passengers and machines.","It reduces maintenance expenses.","It enhances end-to-end automation."],"answer":[0],"explanation":"L17: 'optimum scheduling we will provide good customer services by reducing cancellations and delays'.","verified":"lecture","c":52},{"q":"Which one of the following digital industrial companies coined the term, Industrial Internet?","options":["Siemens Global","General Electric","Accenture","Digital Industry"],"answer":[1],"explanation":"L18 Industrial Internet Systems: 'General Electric, who coined this term industrial internet'.","verified":"lecture","c":53},{"q":"The __ started with the invention of internal combustion engines and electricity","options":["First Stage of the Industrial Revolution","Second Stage of the Industrial Revolution","Third Stage of the Industrial Revolution","Fourth Stage of the Industrial Revolution"],"answer":[1],"explanation":"L18: 'the second stage ... started in 1870 ... with the invention of the IC engines ... and electricity'.","verified":"lecture","c":54},{"q":"Why is outage a huge problem in power industries?","options":["Because the service provided by any power industry is very large.","Because power lines and other equipment are not mobile.","Because replacing a broken equipment is hard.","Because locating a broken power line or equipment is not an easy task."],"answer":[3],"explanation":"L18: 'it is now important to locate the point where the power line is broken or where the equipment ... has gone down'.","verified":"lecture","c":55},{"q":"The emergence of __ system will replace the isolated systems","options":["Edge-based","Cloud-based","Real-time","All of the above"],"answer":[1],"explanation":"L18: 'replacing the isolated systems with the help of cloud-based systems'.","verified":"lecture","c":56},{"q":"Which of the following is a sensors technology manufacturer?","options":["NVDIA","General Electric","Intel","Honeywell"],"answer":[3],"explanation":"L19 Industrial Sensing & Actuation: 'DTS, Bosch, Honeywell, OMEGA, these are some of the common sensor manufacturers'.","verified":"lecture","c":57},{"q":"What are the three main modules in PLC architecture?","options":["CPU, power supply, and I/O","Sensors, processor, and actuation","Sensors, CPU, and power supply","Sensors, CPU, and network"],"answer":[0],"explanation":"L19: 'a typical PLC has three different modules. The CPU module ... power supply module ... input output module'.","verified":"lecture","c":58},{"q":"Which of the following is not an actuators technology manufacturer?","options":["MOOG","SPAT","ADAFRUIT","ZABER"],"answer":[2],"explanation":"L19 shows an actuator-manufacturers slide without reading names; Moog and Zaber are industrial actuator makers, while Adafruit is a hobby-electronics retailer.","verified":"reasoning","c":59}]},{"year":2023,"session":"Jan-Apr 2023","week":5,"source":"https://progiez.com/nptel-introduction-to-industry-4-assignment-5-answers","questions":[{"q":"Lumada is an IoT platform with advanced AI-based analytics. Which of the following companies created Lumada?","options":["Boeing","Hitachi","Amazon","Google"],"answer":[1],"explanation":"Lecture 21 (Industrial Processes - Part 2): Hitachi 'have the Lumada IoT platform' providing AI-based advanced analytics.","verified":"lecture","c":60},{"q":"Which type of reference architecture for IIoT enables quick device-to-device integrations, automated data delivery of applications within the buses, isolation of hierarchical subsystems, and integrations of sensors and actuators?","options":["Three-tier IIoT architecture","Layered Databus IIoT architecture","Gateway-based IIoT architecture","Virtual IIoT architecture"],"answer":[1],"explanation":"Lecture 24 (Reference Architecture - Part 1): layered databus pattern 'allows fast device to device integration with minimum response time, automatic data and application delivery ... hierarchical subsystem isolation'.","verified":"lecture","c":61},{"q":"Values for customer segments in a Business Model can be categorized as _ .","options":["Qualitative","Quantitative","Both a and b","None of the above"],"answer":[2],"explanation":"Lecture 22 (Business Models - Part 1): value proposition values 'could be quantitative such as price ... or qualitative such as design, customization, customer experience'.","verified":"lecture","c":62},{"q":"Which of the following properties is/are part of the Outcome-based Business Model?","options":["Customers are relieved from the responsibilities of ownership and maintenance.","Businesses deliver to the customer the outcome that the product/service provides.","It reduces the negotiation cycle.","All of the above"],"answer":[3],"explanation":"Lecture 22 (Business Models - Part 1): outcome-based model - customer 'relieved from the responsibility of ownership and maintenance', pay-per-outcome, and advantages include 'reduced negotiation cycle'.","verified":"lecture","c":63},{"q":"In which of the business models does businesses virtually consolidate and share their IoT-enabled assets among multiple customers or with other business entities in exchange of revenue?","options":["Asset-Sharing Model.","Outcome-based Model.","Subscription Model.","None of the above"],"answer":[0],"explanation":"Lecture 22 (Business Models - Part 1): asset-sharing model is where 'businesses virtually consolidate and share their IoT-enabled assets among multiple customers ... in exchange of revenue'.","verified":"lecture","c":64,"rel":[["Jul-Oct 2026",5,0]]},{"q":"What is/are the challenges of implementing IoT-as-a-Service?","options":["Product compatibility","Better customer relation","Reduced licensing cost","None of the above"],"answer":[0],"explanation":"Lecture 22 (Business Models - Part 1): IoT-as-a-Service challenges are 'product compatibility, maintaining data accuracy, security of data'; reduced licensing cost and better customer relations are advantages.","verified":"lecture","c":65},{"q":"Platform-as-a-Service is a type of_______________.","options":["Cloud-based IIoT business model","Service-oriented IIoT business model","Process-oriented business model","None of the above"],"answer":[0],"explanation":"Lecture 23 (Business Models - Part 2): IaaS, PaaS and SaaS are the three cloud-based service models under the cloud-based IIoT business model.","verified":"lecture","c":66},{"q":"What is/are the challenges(s) of IIoT business model?","options":["Lack of interoperability","Data privacy and security","Increased cost","All of the above"],"answer":[3],"explanation":"Lecture 23 (Business Models - Part 2): IIoT business model challenges include 'security and data privacy ... lack of interoperability ... increased complexity, increased cost'.","verified":"lecture","c":67},{"q":"Which one of the following is/are core competency(ies) of the Cloud-based IIoT business model?","options":["Platform","Data","Software infrastructure","All of the above"],"answer":[2],"explanation":"Lecture 23 (Business Models - Part 2): cloud-based model core competencies are 'IT resources - software, hardware infrastructure, and the technical knowhow'; platform and data are core competencies of the service/process-oriented models.","verified":"lecture","c":68},{"q":"Which of the following defines IIRA?","options":["It is a standard architecture for IIoT systems","It is a business model for IIoT","It is a factory manufacturing IoT products","It is the fourth stage of the Industrial Revolution"],"answer":[0],"explanation":"Lecture 24 (Reference Architecture - Part 1): 'IIRA ... is the architectural standard that is used for most of these IIoT applications'.","verified":"lecture","c":69},{"q":"What is the function of leading KPI?","options":["Leading KPI is used to predict the economy","Leading KPI is used to measure the changes in economy after it has begun","Leading KPI is used as a technical indicator of the economy after it has begun","Leading KPI captures the number of fatalities for OSH"],"answer":[0],"explanation":"Lecture 24 (Reference Architecture - Part 1): 'leading KPI ... is mainly used to predict the economy, it is input-oriented, and is hard to measure'.","verified":"lecture","c":70},{"q":"What is Industrial Internet Consortium?","options":["A for-profit organization for promotion of open standards","A non-profit organization for promotion of open standards","A software platform","All of the above"],"answer":[1],"explanation":"Lecture 24 (Reference Architecture - Part 1): IIC is 'a non-profit consortium ... promoting open standards, standards for interoperability'.","verified":"lecture","c":71},{"q":"Which of the following is/are not part of the IIRA Framework?","options":["Stakeholder","Viewpoint","Architecture Frame","Position Frame"],"answer":[3],"explanation":"Lecture 24 (Reference Architecture - Part 1): IIRA framework concepts are stakeholder, viewpoint, architecture frame and architectural representation; no 'position frame'.","verified":"lecture","c":72},{"q":"How many viewpoints are there in the IIRA?","options":["6","4","5","3"],"answer":[1],"explanation":"Lecture 25 (Reference Architecture - Part 2): 'we have the business viewpoint, usage viewpoint, functional viewpoint and the implementation viewpoint' (four).","verified":"lecture","c":73},{"q":"What is Role in context of the Usage viewpoint of IIRA?","options":["Describes the functional component of the task maps.","Coordination of specific tasks","Set of capacities assumed by an entity or organization","All of the above"],"answer":[2],"explanation":"Lecture 25 (Reference Architecture - Part 2): 'the role is the set of capacities that are assumed by an entity or an organization'.","verified":"lecture","c":74}]},{"year":2023,"session":"Jan-Apr 2023","week":6,"source":"https://progiez.com/nptel-introduction-to-industry-4-assignment-6-answers","questions":[{"q":"What are the befits of using sensor in industrial applications?","options":["Real-time monitoring","Improving visibility","Remote diagnosis","All of the above"],"answer":[3],"explanation":"Lecture 26 (Key Enablers: Sensing - Part 1): benefits: real-time monitoring, 'improving the visibility', efficiency ... 'remote diagnostics'.","verified":"lecture","c":75},{"q":"What is the function of LM 35 sensor?","options":["Analog temperature monitoring","Digital temperature monitoring","Analog humidity monitoring","Digital humidity monitoring"],"answer":[0],"explanation":"Lecture 26 (Key Enablers: Sensing - Part 1): 'LM 35 is ... an analog temperature sensor, that generates analog voltage'.","verified":"lecture","c":76},{"q":"ADXL335 sensor can generate the magnitude and direction of the acceleration. True or false?","options":["True","False"],"answer":[0],"explanation":"Lecture 26 (Key Enablers: Sensing - Part 1): ADXL335 accelerometer gives X, Y, Z values (magnitude and direction).","verified":"lecture","c":77},{"q":"MQ-2 sensor is used for measuring the concentration of which of the following gases?","options":["Helium, Argon, Neon","Nitrogen, Hydrogen, Oxygen","LPG, Propane Hydrogen","All of the above"],"answer":[2],"explanation":"Lecture 26 (Key Enablers: Sensing - Part 1): MQ-2 'monitor the concentration of LPG, propane and hydrogen'.","verified":"lecture","c":78},{"q":"__ sensor is used to measure time-varying stresses and strains in ferromagnetic materials?","options":["Torque","Acceleration","Magnetostrictive","None of the above"],"answer":[2],"explanation":"Lecture 26 (Key Enablers: Sensing - Part 1): 'magnetostrictive sensors ... measure and detect the time varying stresses or strains in ferromagnetic materials'.","verified":"lecture","c":79},{"q":"MOS is one of the electrical variations of gas sensing methods. What is the full form of MOS?","options":["Metal Oxide Semiconductors","Metal Oxide Sensing","Monitoring Olfactory Sensor","Moisture Onsite Sensing"],"answer":[0],"explanation":"Lecture 27 (Key Enablers: Sensing - Part 2): metal oxide semiconductor (MOS) gas sensors.","verified":"lecture","c":80},{"q":"What is/are the requirements of industrial communication?","options":["Real-time communication","Low latency","Low jitter","All of the above"],"answer":[3],"explanation":"Lecture 28 (Connectivity - Part 1): requirements: real-time, very low duty cycle, very low latency, very low jitter.","verified":"lecture","c":81,"rel":[["Jul-Oct 2024",6,0]]},{"q":"Industrial Ethernet is used in scenarios that require _ .","options":["Clock synchronization","Periodic I/O data transfer","Local Area Network of field devices","All of the above"],"answer":[0],"explanation":"Lecture 28 (Connectivity - Part 1): fieldbus is for LAN of field devices and 'periodic input-output data transfer', so those are not Industrial Ethernet; Profinet IRT handles clock synchronization (progiez key also (a)).","verified":"lecture","c":82},{"q":"Profinet in industrial communication is based on which of the following technologies?","options":["Fieldbus","Industrial Ethernet","Profibus","DeviceNet"],"answer":[1],"explanation":"Lecture 28 (Connectivity - Part 1): 'Profinet is a standard for Industrial Ethernet'.","verified":"lecture","c":83},{"q":"How many active connections or sockets are supported by ModBus-TCP, simultaneously?","options":["10","8","5","254"],"answer":[0],"explanation":"Lecture 28 (Connectivity - Part 1): 'Modbus TCP basically supports up to 10 active connections or sockets at one time'.","verified":"lecture","c":84},{"q":"Which of the following methods is used by EtherCat for bit error recognition?","options":["Hamming code","CRC checksum","Parity check","Binary check"],"answer":[1],"explanation":"Lecture 28 (Connectivity - Part 1): EtherCAT uses 'CRC checks ... checksum mechanism' for error detection.","verified":"lecture","c":85},{"q":"What is the full form of Profinet?","options":["Process Field Network","Public Field Network","Process Full Network","Private Field Networking"],"answer":[0],"explanation":"Profinet = PROcess FIeld NETwork (Lecture 29 gives Profibus as process field bus).","verified":"reasoning","c":86,"rel":[["Jul-Oct 2023",6,0]]},{"q":"What is the maximum number of subscribers supported by the Interbus?","options":["512","215","125","251"],"answer":[0],"explanation":"Lecture 29 (Connectivity - Part 2): Interbus ring topology 'will provide connectivity to about 512 subscribers'.","verified":"lecture","c":87},{"q":"Select the statement that best describes Tactile Internet.","options":["It enables haptic communication","It enables real-time transmission of touch, sense and actuation","Both a and b","None of the above"],"answer":[2],"explanation":"Lecture 30 (Connectivity - Part 3): tactile internet offers 'real time transmission of touch sense ... and actuating' and 'haptic communication'.","verified":"lecture","c":88},{"q":"What is the frequency spectrum for mmWave communication?","options":["30-300 GHz","30-300 KHz","30-300 MHz","30-300 Hz"],"answer":[0],"explanation":"Lecture 30 (Connectivity - Part 3): mmWave communication is in 'the spectrum 30 to 300 Giga hertz band'.","verified":"lecture","c":611,"rel":[["Jul-Oct 2023",6,0],["Jan-Apr 2024",6,1]]}]},{"year":2023,"session":"Jan-Apr 2023","week":7,"source":"https://progiez.com/nptel-introduction-to-industry-4-assignment-7-answers","questions":[{"q":"What is the maximum payload of a SIGFOX message?","options":["12 bytes","140 bytes","100 bits","257 bytes"],"answer":[0],"explanation":"'SIGFOX network gives up to 140 messages per day, with a payload of 12 bytes per message' (Lecture 31: Key Enablers of IIoT: Connectivity – Part 4 (LoRa/SIGFOX + NodeMCU demo)).","verified":"lecture","c":90},{"q":"Which of the following modulation techniques is used by LoRA?","options":["Frequency-hopping Spread Spectrum Modulation","Direct-sequence Spread Spectrum Modulation","Chirp Spread Spectrum Modulation","Time-hopping Spread Spectrum Modulation"],"answer":[2],"explanation":"'LoRa incorporates a spread spectrum modulation technique ... CSS ... Chirp Spread Spectrum' (Lecture 31: Key Enablers of IIoT: Connectivity – Part 4 (LoRa/SIGFOX + NodeMCU demo)).","verified":"lecture","c":91},{"q":"Which of the following libraries is used to work with LoRA along with NodeMCU?","options":["DHT Sensor Library","MESH library","Radiohead library","Stepper library"],"answer":[2],"explanation":"'You also need this Radiohead library for this LoRa module to work' with NodeMCU (Lecture 31: Key Enablers of IIoT: Connectivity – Part 4 (LoRa/SIGFOX + NodeMCU demo)).","verified":"lecture","c":92},{"q":"Which of the following protocols is used in the physical and MAC layer of the Zigbee communication protocol?","options":["IEEE 802.3.4","IEEE 802.15.4","IEEE 804.15.4","IEEE 805.3.4"],"answer":[1],"explanation":"Zigbee 'follows the specification of IEEE 802.15.4' (Lecture 32: Key Enablers of IIoT: Connectivity – Part 5 (Zigbee/Xbee demo)).","verified":"lecture","c":93},{"q":"What is a coordinator device in Zigbee network?","options":["It is a device to relay information to other nodes in the network","It is a node to generate power for the other nodes in the network","It is only connected to the parent node with no data relaying","It is the root of the network and acts as a bridge between different networks"],"answer":[3],"explanation":"'The coordinator is the root of the network and it acts as the bridge between these different networks' (Lecture 32: Key Enablers of IIoT: Connectivity – Part 5 (Zigbee/Xbee demo)).","verified":"lecture","c":94},{"q":"XCTU is a software is for configuration of which of the following devices?","options":["NodeMCU","LoRa","Xbee","Bluetooth"],"answer":[2],"explanation":"'XCTU will be used to configure the Xbee modules before they can be used for communication' (Lecture 32: Key Enablers of IIoT: Connectivity – Part 5 (Zigbee/Xbee demo)).","verified":"lecture","c":95},{"q":"What is/are the characteristic(s) of IIoT data?","options":["Correlation in space, time and other dimensions","Temporal and causal relationships in data","Polymorphism","All of the above"],"answer":[3],"explanation":"IIoT data characteristics listed: massive polymorphism, real-time, dynamic heterogeneity, temporal/causal relationships, correlation in space, time and other dimensions (Lecture 33: Key Enablers of IIoT: Processing – Part 1).","verified":"lecture","c":96,"rel":[["Jan-Apr 2024",7,0]]},{"q":"What is the function of Rule-based engine in Complex Event Processing (CEP)?","options":["Extract causal and temporal patterns using predefined rules","Provides services according to device functionality","Handle single data stream at a time","Batch processing"],"answer":[0],"explanation":"CEP via rule-based engine: 'it is very important to extract the causal and temporal patterns' (Lecture 33: Key Enablers of IIoT: Processing – Part 1); other options are middleware/batch distractors.","verified":"lecture","c":97},{"q":"Middleware is a software layer between infrastructure layer and application layer IIoT. True or false?","options":["True","False"],"answer":[0],"explanation":"'middleware means it's a software layer which will be standing between the infrastructure layer and the application layer' (Lecture 33: Key Enablers of IIoT: Processing – Part 1).","verified":"lecture","c":98},{"q":"What are the different types of business processing analytics?","options":["Industrial, private, public","Descriptive, prescriptive, predictive","Actuation and sensing","Predictive, visualization, actuation"],"answer":[1],"explanation":"'business processing analytics could be of three different types ... prescriptive, descriptive or predictive' (Lecture 33: Key Enablers of IIoT: Processing – Part 1).","verified":"lecture","c":99},{"q":"What type of analytics is supported by MIDAS: IoT/M2M platform?","options":["Batch analytics","Runtime analytics","Both a and b","None of the above"],"answer":[2],"explanation":"MIDAS IoT/M2M platform: 'runtime analytics could be performed or batch analytics could be performed' (Lecture 33: Key Enablers of IIoT: Processing – Part 1).","verified":"lecture","c":100},{"q":"Industrial rechargeable sensor network uses __ for grid-based routing and charging. Fill in the blanks.","options":["Proactive algorithm","Reactive algorithm","Genetic algorithm","TCAM"],"answer":[0],"explanation":"Not in the lecture transcripts; source paper (Han et al., 'A grid-based joint routing and charging algorithm for industrial wireless rechargeable sensor networks', Computer Networks 2016) proposes proactive (vs passive) charging.","verified":"reasoning","c":101},{"q":"What are the 4 major components of an industrial control system?","options":["Set points, process variables, controllers, and manipulating variables","Data plane, control plane, variables, and controllers","Set points, dynamic points, variables, and controllers","Feedback loop, controllers, variables, and actuation"],"answer":[0],"explanation":"'four major components': process variable, set points, controller, manipulating variables (Lecture 35: Key Enablers of IIoT: Process Control).","verified":"lecture","c":102,"rel":[["Jan-Apr 2025",7,0]]}]},{"year":2023,"session":"Jan-Apr 2023","week":8,"source":"https://progiez.com/nptel-introduction-to-industry-4-assignment-8-answers","questions":[{"q":"Which of the following is not a part of IIoT analytics ?","options":["Real time data analysis","Dynamic operations optimization","Prognostic maintenance","Renewable energy"],"answer":[3],"explanation":"Lecture 36: IIoT Analytics and Data Management: Introduction describes IIoT analytics as real-time/streaming analysis, operations optimization and prognostics (RUL); renewable energy is not an analytics function.","verified":"reasoning","c":103},{"q":"Prescriptive analytics is one of the categories of IIoT analytics. True or False?","options":["True","False"],"answer":[0],"explanation":"Three types: descriptive, predictive, prescriptive (Lecture 36: IIoT Analytics and Data Management: Introduction).","verified":"lecture","c":104},{"q":"Volume, veracity, velocity are the characteristics of which of the following entity?","options":["SDN","Image processing","Big data","Machine learning"],"answer":[2],"explanation":"Big data: volume, velocity, variability, veracity, variety (Lecture 36: IIoT Analytics and Data Management: Introduction).","verified":"lecture","c":105},{"q":"Feature engineering is absent in which of the following tools or algorithms?","options":["Machine learning","Deep learning","Both a and b","Clustering"],"answer":[1],"explanation":"'in deep learning ... there is no feature engineering aspects present' (Lecture 36: IIoT Analytics and Data Management: Introduction).","verified":"lecture","c":106},{"q":"What is the purpose of diagnostic analytics ?","options":["Detect irregular behavior of assets quickly in the timescale of milliseconds","Identify the root cause of an anomaly in the timescale of minutes","Inform about remaining useful life of an asset","None of the above"],"answer":[1],"explanation":"'in minutes are diagnostic analytics ... identify the root cause of any anomaly' (Lecture 36: IIoT Analytics and Data Management: Introduction).","verified":"lecture","c":107},{"q":"How many different categories of clustering are there?","options":["2, hard and soft clustering","2, long and short clustering","2, labeled and unlabelled clustering","No categories"],"answer":[0],"explanation":"'two main classifications of clustering algorithms one is known as hard clustering and the other ... soft clustering' (Lecture 37: Machine Learning and Data Science – Part 1).","verified":"lecture","c":108},{"q":"Fuzzy c-Means Clustering can be used when –","options":["Data points may belong to more than one clusters","Faster clustering is required","Both a and b","Data points strictly belong to only one cluster"],"answer":[2],"explanation":"FCM: 'one data point may belong to more than one cluster' and 'FCM is extremely faster, much faster compared to the K-means' (Lecture 37: Machine Learning and Data Science – Part 1).","verified":"lecture","c":109},{"q":"Which of the following statements is/are true about linear regression?","options":["It is an unsupervised learning algorithm","It is used to label the data","It is use for prediction of values","All of the above"],"answer":[2],"explanation":"Linear regression is supervised and predicts Y for an unknown X (Lecture 37: Machine Learning and Data Science – Part 1).","verified":"lecture","c":110},{"q":"Select the machine learning-base IIoT application(s) used in the retail sector?","options":["Drug discovery","Product recommendation","Dynamic price setup","All of the above"],"answer":[1],"explanation":"'For retail, product recommendation'; drug discovery = healthcare, dynamic price setup = travel (Lecture 37: Machine Learning and Data Science – Part 1).","verified":"lecture","c":111},{"q":"Select the correct statement.","options":["Artificial intelligence is a subset of machine learning","Machine learning is a subset of deep learning","Machine learning is a subset of artificial intelligence","Artificial intelligence is a subset of deep learning"],"answer":[2],"explanation":"L14: 'Deep learning, basically, is a subset of machine learning'.","verified":"lecture","c":206,"rel":[["Jul-Oct 2023",3,1]]},{"q":"What does deep in deep learning refer to?","options":["Number of visible neurons","Number of hidden layers","Number of deep neurons","Number of deep layers"],"answer":[1],"explanation":"'deep basically refers to the number of hidden layers' (Lecture 38: Machine Learning and Data Science – Part 2).","verified":"lecture","c":113},{"q":"What is/are the critical requirement(s) of deep learning applications?","options":["Large amount of data.","High quality data.","Both a and b.","Small amount of data"],"answer":[2],"explanation":"Critical requirements: 'large quantity of data and ... higher accuracy requirements higher quality' (Lecture 38: Machine Learning and Data Science – Part 2).","verified":"lecture","c":114},{"q":"Which of the following is/are example(s) of Software-as-a-Service?","options":["MindSphere","Microsoft Azure","DropBox","All of the above"],"answer":[2],"explanation":"Lecture 39: Cloud Computing in IIoT – Part 1 classifies MindSphere as PaaS and Azure as IaaS; DropBox is a SaaS application.","verified":"reasoning","c":115},{"q":"What is/are the characteristic(s) of Good SLA?","options":["Achievable","Meaningful","Affordable","All of the above"],"answer":[3],"explanation":"Good SLA: achievable, meaningful, quantifiable, controllable, mutually acceptable, affordable (Lecture 40: Cloud Computing in IIoT – Part 2).","verified":"lecture","c":116,"rel":[["Jul-Oct 2025",8,0]]},{"q":"Which of the following is/are the limitation(s) of cloud-based approaches in IIoT?","options":["Unlimited storage","Interoperability","Cost efficient","Higher latency"],"answer":[3],"explanation":"Cloud-based limitations: 'there is going to be higher latency' (Lecture 40: Cloud Computing in IIoT – Part 2).","verified":"lecture","c":117}]},{"year":2023,"session":"Jan-Apr 2023","week":10,"source":"https://progiez.com/nptel-introduction-to-industry-4-assignment-10-answers","questions":[{"q":"What does the abbreviation, TSCH, stands for?","options":["Time slotted channel hopping","Time scheduling channel hopping","Time scheduled communication hopping","None of the above"],"answer":[0],"explanation":"Lecture 46 (SDN in IIoT Part 2) (speaker says 'Time Scheduled Channel Hopping ... channel hopping in a time slotted mechanism'); the standard IEEE 802.15.4e/IETF expansion is Time Slotted Channel Hopping.","verified":"reasoning","c":118},{"q":"Which type of communication is used in time slotted channel hopping?","options":["Deterministic communication","Non-deterministic communication","Predictive communication","None of the above"],"answer":[0],"explanation":"Lecture 46 (SDN in IIoT Part 2): 'in a time schedule channel hopping ... we are talking about deterministic communication'.","verified":"lecture","c":119},{"q":"What is/are the objective (s) satisfied in the IETF 6TiSCH?","options":["Unreliable link – low power and lossy network","Control overhead due to message exchange between SDN controller and devices","Increased jitter","All of the above"],"answer":[3],"explanation":"Lecture 46 (SDN in IIoT Part 2): SD-6TiSCH addresses unreliable lossy low-power links and SDN control overhead, providing deterministic low-latency (low-jitter) communication.","verified":"lecture","c":120},{"q":"In which layer, Software-Defined 6TiSCH supports the slicing mechanism?","options":["Layer 2","Layer 1","Layer 3","Layer 4"],"answer":[0],"explanation":"Lecture 46 (SDN in IIoT Part 2) describes the slicing mechanism for control overhead; the cited work is 'Isolating SDN control traffic with layer-2 slicing in 6TiSCH industrial networks'.","verified":"reasoning","c":121},{"q":"μSDN incorporates features for minimizing __ overhead.","options":["Data","Controller","Transmission","All of the above"],"answer":[1],"explanation":"Lecture 46 (SDN in IIoT Part 2): micro-SDN 'lightweight protocol stack that is capable of reducing the control plane overhead'.","verified":"lecture","c":122},{"q":"SD-Edge IIoT architecture comprises of __ .","options":["Cluster head","Industrial cloud","Edge network","All of the above"],"answer":[3],"explanation":"Lecture 46 (SDN in IIoT Part 2): SD-edge IIoT components 'cluster head, industrial cloud, edge network, SDN controller, devices and equipments'.","verified":"lecture","c":973,"rel":[["Jan-Apr 2025",10,1]]},{"q":"What is/are the basic step(s) of the IIoT security risk management?","options":["Avoiding risks","Mitigating risks","Outsourcing, accepting, and balancing residual risks","All of the above"],"answer":[3],"explanation":"Lecture 47 (Security in IIoT Part 1): risk management - avoid, mitigate, outsource, accept and balance residual risks.","verified":"lecture","c":1542,"rel":[["Jan-Apr 2026",10,1]]},{"q":"Select the correct cyber attacker class(es) from the following options.","options":["Outsourced firms","Internal unethical employees","Organized crime groups","All of the above"],"answer":[3],"explanation":"Lecture 47 (Security in IIoT Part 1): attackers - outsourced firms, hardware vendors, third-party providers, internal unethical employees, organized crime groups.","verified":"lecture","c":125},{"q":"Which of the following attack vector(s) is/are applicable in the application layer?","options":["Data spoofing","SQL injection","All of the options","Reversal attack"],"answer":[2],"explanation":"Lecture 47 (Security in IIoT Part 1): application layer - data spoofing, SQL injection, DoS/DDoS, replay, resource exemption, reversal attack.","verified":"lecture","c":126},{"q":"The different type(s) of IIoT attack vectors in the physical layer is/are __ .","options":["DoS or DDoS","Replay attack","Reversal attack","None of the above"],"answer":[3],"explanation":"Lecture 47 (Security in IIoT Part 1): physical layer - impersonation, jamming, device tampering; DoS/replay/reversal are application-layer.","verified":"lecture","c":127},{"q":"The different type(s) of IIoT attack vectors in the network layer is/are __ .","options":["Data spoofing","Reversal attack","None of the options","Impersonation attack"],"answer":[2],"explanation":"Lecture 47 (Security in IIoT Part 1): network layer - traffic flooding, MITM, misrouting, packet sniffing, resource exemption; none of the listed ones.","verified":"lecture","c":128},{"q":"What is/are the benefit(s) of making factory smart?","options":["Reduced changeover time","Reduced production time","Flexibility and easy management","All of the above"],"answer":[3],"explanation":"Lecture 49 (Factories and Assembly Line): smart factory gives 'reduced change over time ... reduced production time ... flexibility ... ease of management'.","verified":"lecture","c":129},{"q":"Kuka is a __ .","options":["A German robotics maker company","A German toy maker company","A German mining company","None of the above"],"answer":[0],"explanation":"Lecture 49 (Factories and Assembly Line): 'a German robotics maker name is Kuka'.","verified":"lecture","c":130},{"q":"What is/are the benefit(s) of maintaining transparency in the supply chain?","options":["Availability of real-time data about products","Easier to find inefficiencies","Easier to meet food safety regulations","All of the above"],"answer":[3],"explanation":"Lecture 50 (Food Industry): transparency of supply chain, real-time info, traceability, food safety regulation; all options are benefits.","verified":"reasoning","c":131},{"q":"What is/are the major challenge(s) associated with the healthcare?","options":["Avoidable medical errors","Increasing age of the population","Costly hospitals and clinics","All of the above"],"answer":[3],"explanation":"Lecture 51 (Healthcare): 'Populations are ageing ... diseases are increasing; expenditure of hospitals ... increasing' (slide also lists avoidable medical errors).","verified":"lecture","c":132,"rel":[["Jul-Oct 2023",11,0]]}]},{"year":2023,"session":"Jan-Apr 2023","week":11,"source":"https://progiez.com/nptel-introduction-to-industry-4-assignment-11-answers","questions":[{"q":"What is/are the challenges associated with healthcare?","options":["Populations are aging all over the world","Different diseases are increasing","Expenditure of hospitals and medical clinic are increasing","All of the above"],"answer":[3],"explanation":"L51 'IIoT Applications: Healthcare' slide 'Healthcare Challenges': populations ageing, diseases increasing, expenditure of hospitals increasing.","verified":"lecture","c":133},{"q":"The number of persons aged 60 years or over is expected to increase more than __ during 2017-2050.","options":["Double","Triple","Quadruple","Quintuple"],"answer":[0],"explanation":"L51 'IIoT Applications: Healthcare' slide: 'Between 2017 to 2050, persons aged 60 years or over is expected to increase more than double.'","verified":"lecture","c":134},{"q":"Which of the following factor(s) is/are considered in authentication in the context of software security?","options":["Identification of user","Verification of credentials entered (local or remote)","Protection of resources","All of the above"],"answer":[3],"explanation":"L54 'Plant Security and Safety' slide 'Authentication': Identification of user; Verification of credentials entered (local or remote); Access control based on these credentials; Protection of resources.","verified":"lecture","c":135},{"q":"The key factor(s) of software security in the context of plant security and safety is/are __ .","options":["Integrity","Authentication","Availability","All of the above"],"answer":[3],"explanation":"L54 'Plant Security and Safety' slide 'Software Security': Integrity, Authentication, Availability.","verified":"lecture","c":136},{"q":"What is/are the scope(s) of IoT in the facility management?","options":["Accessing new insights","Implementing new technologies","Addressing cost barriers","All of the above"],"answer":[3],"explanation":"L55 'Facility Management' slide 'Scope of IoT in Facility Management': accessing new insights, implementing new technology, addressing cost barrier.","verified":"lecture","c":137},{"q":"Which resource(s) is/are optimized in the IoT-based facility management system?","options":["Manpower","Assets","Technology","All of the above"],"answer":[3],"explanation":"L55 'Facility Management' slide 'Optimization': optimized usage of resources - manpower, assets, technology.","verified":"lecture","c":138},{"q":"Which parameter is monitored by the device developed by Dexcom?","options":["ECG","Blood","Glucose","Respiration rates"],"answer":[2],"explanation":"L51 'IIoT Applications: Healthcare' slide: 'Dexcom develops continuous glucose monitoring devices.'","verified":"lecture","c":139},{"q":"“Asthma is lifelong disease, can be controlled, not cured” __ state whether the following statement is true or false.","options":["True","False"],"answer":[0],"explanation":"L51 'IIoT Applications: Healthcare' slide 'IIoT Based Asthma Treatment': 'Asthma is lifelong disease, can be controlled, not cured.'","verified":"lecture","c":140},{"q":"Which of the following parameter(s) is/are monitored by ADAMM?","options":["Asthma","Blood pressure","Body temperature","Oxygen saturation level"],"answer":[2],"explanation":"Corrected after checking the lecture (was: Asthma). L51 'IIoT Applications: Healthcare' slide: 'ADAMM Intelligent Asthma Monitoring device ... From the body temperature, cough rate, heart rate, it predicts pre symptoms of asthma attack.' Body temperature is the listed monitored parameter (BP/O2 belong to other devices); answer keys mark 'Asthma' (the condition monitored), so the official key may be Asthma.","verified":"unsure","c":141},{"q":"Select the correct option (s) from the below.","options":["Google Fit: Keeps track of different physical activities","Health Assistant: Keeps track of health condition","Fingerprint Thermometer: Determine body temperature from the fingerprint","All of the above"],"answer":[3],"explanation":"L51 'IIoT Applications: Healthcare' slide 'Smartphone Based Healthcare App': Health Assistant, Google Fit, Fingerprint Thermometer with exactly these descriptions.","verified":"lecture","c":142},{"q":"Which of the following feature(s) act(s) as the drivers of IIoT in a power plant?","options":["Low cost powerful chips","Standardization with IPV6","Standardization with software technology","All of the above"],"answer":[3],"explanation":"L52 'IIoT Applications: Power Plants' slide 'Drivers of IIoT in Power Plant': low cost powerful chips, standardization with IPv6, standardization of software technology.","verified":"lecture","c":143},{"q":"Which option(s) is/are included in the power flow of a smart grid?","options":["Generation","Transmission","Distribution and consumption","All of the above"],"answer":[3],"explanation":"L52 'IIoT Applications: Power Plants': power flow goes 'from the generation station through the transmission to the distribution and consumption units'.","verified":"lecture","c":144},{"q":"Inventory management activity entails __ .","options":["Controlling, overseeing, and ordering","Storage","Determine supply for sale","All of the above"],"answer":[3],"explanation":"L53 'Inventory Management & Quality Control': inventory management activities 'controlling, overseeing, ordering, storage, then determining the supply for sale'.","verified":"lecture","c":145},{"q":"What is/are the component(s) of a facility management system?","options":["Buildings","Finance","People","All of the above"],"answer":[3],"explanation":"L55 'Facility Management': 'facility management we are talking about buildings, finance, people, contracts'.","verified":"lecture","c":146,"rel":[["Jan-Apr 2024",11,0]]},{"q":"The IoT-based remote patient health monitoring system is more __ .","options":["Robust","Costly","Secure","All of the above"],"answer":[0],"explanation":"Not stated in L51 'IIoT Applications: Healthcare'. Slide says IIoT healthcare service is 'cheapest' (rules out Costly/All); security is listed as a requirement/challenge, so Robust is the best fit.","verified":"reasoning","c":147}]},{"year":2023,"session":"Jan-Apr 2023","week":12,"source":"https://progiez.com/nptel-introduction-to-industry-4-assignment-12-answers","questions":[{"q":"The integration of IoT with industry __","options":["Maximizes profit","Minimizes profit","Does not affect profit optimization","All of the above"],"answer":[0],"explanation":"L56 'Oil, Chemical and Pharmaceutical Industry' slide 'IoT and the Industry': 'Maximize profit by the predictions; IoT cloud slash cost'.","verified":"lecture","c":148},{"q":"Which of the following type(s) of analytics is/are used in the oil and gas industry workflow?","options":["Predictive","Prescriptive","Diagnostic","None of the above"],"answer":[0],"explanation":"L56 'Oil, Chemical and Pharmaceutical Industry' slide 'Oil and Gas Industry Work-flow' starts with 'Apply predictive analytics'.","verified":"lecture","c":149},{"q":"IoT in the oil and gas industry improves operational excellence by using __ maintenance.","options":["Predictive","Prescriptive","Diagnostic","Descriptive"],"answer":[0],"explanation":"L56 'Oil, Chemical and Pharmaceutical Industry' slide 'Improve operational Excellence': predictive maintenance.","verified":"lecture","c":150},{"q":"IoT increases customer loyalty by __ .","options":["Connecting business and car","Smart application","Monitoring energy consumption profiles","All of the above"],"answer":[3],"explanation":"L56 'Oil, Chemical and Pharmaceutical Industry' slide 'IoT increases customer loyalty': connects business and car, smart application, energy consumption profiles.","verified":"lecture","c":151},{"q":"Which of the following option(s) is/are included in a case study?","options":["A small geographical area","A very limited number of individuals","Both a and b","All of the above"],"answer":[2],"explanation":"L58 'Case Studies for Industry 4.0 & IIoT' slide: 'in a case study, a small geographical area or a very limited number of individuals, are selected as the subject'.","verified":"lecture","c":152},{"q":"Which of the following point(s) is/are true for a case study?","options":["Provides in-depth knowledge about the topic","Provides clarity of concepts regarding the research topic","Both a and b","None of the above"],"answer":[2],"explanation":"L58 'Case Studies for Industry 4.0 & IIoT' slide: 'Case studies provide in-depth knowledge and clarity of concepts regarding the research topic.'","verified":"lecture","c":153},{"q":"IoT helps the chemical industry by __ .","options":["Reducing energy expenses","Minimizing supply chain risk","Improving logistics","All of the above"],"answer":[3],"explanation":"L56 'Oil, Chemical and Pharmaceutical Industry': chemical industry benefits include reduction of energy expenses, minimizing supply chain risk, improving logistics.","verified":"lecture","c":154},{"q":"In the context of “IoT in Chemical Industry,” the predictive maintenance __ .","options":["Reduces equipment breakdown","Increases equipment breakdown","Does not affect equipment breakdown","All of the above"],"answer":[0],"explanation":"L56 'Oil, Chemical and Pharmaceutical Industry' slide 'Predictive maintenance': 'Reduce equipment breakdown'.","verified":"lecture","c":155},{"q":"Which of the following option(s) is/are true for IoT sensors in the pharmaceutical industry?","options":["Deployed in production areas","Access huge data of different manufacturing departments","Able to control the areas remotely","All of the above"],"answer":[3],"explanation":"L56 'Oil, Chemical and Pharmaceutical Industry' pharma slide: deployed in production areas, access huge data of different manufacturing departments, real time monitoring, able to control the areas remotely.","verified":"lecture","c":156},{"q":"Which of the following factor(s) is/are detected by IoT in the pharmaceutical industry?","options":["Adverse Drugs Reaction (ADR)","Effects of pharmaceutical excipients","Allergies","All of the above"],"answer":[3],"explanation":"L56 'Oil, Chemical and Pharmaceutical Industry' slide: IoT examines drugs to detect ADR, effects of pharmaceutical excipients, allergies.","verified":"lecture","c":157},{"q":"UAVs connected to IoT __ .","options":["Can be programmed once","Cannot be programmed","Can be programmed multiple times","None of the above"],"answer":[2],"explanation":"L57 'UAVs in Industries' slide 'UAVs are connected to IoT': 'Re-programmable'.","verified":"lecture","c":158},{"q":"Which of the following option correctly defines the first generation of UAVs?","options":["Fundamental Remote Control UAVs of different forms","Static design, fixing camera mount, still photography, video recording, and manual steering control","Added two-axis gimbals, essential safety models. HD video, assisted guiding","Transformable designs with 360°gimbals, high quality video or higher-value instrumentation, improved piloting modes"],"answer":[0],"explanation":"L57 'UAVs in Industries' slide 'UAV Technology Generations': First Generation - 'Fundamental Remote Control UAVs of different forms'.","verified":"lecture","c":159},{"q":"In which area(s), UAV-based systems can be used?","options":["Agriculture","Construction Sites","Mining","All of the above"],"answer":[3],"explanation":"L57 'UAVs in Industries': UAVs used in agriculture, construction sites, mining, energy, telecom, etc.","verified":"lecture","c":160},{"q":"Which of the following point(s) need to be considered for all industrial case studies?","options":["Transformation of existing processes for Industry 4.0 adoption","Assessment of existing processes","Target objectives","All of the above"],"answer":[3],"explanation":"L58 'Case Studies for Industry 4.0 & IIoT' slide 'Points to ponder (for all case studies)': transformation of existing processes, assessment of existing processes, target objectives.","verified":"lecture","c":161},{"q":"UAVs use recorded infrared, hyperspectral, and ultraviolet images to __ .","options":["Monitor crop health","Analyze soil quality","Both a and b","None of the above"],"answer":[2],"explanation":"Not on the L57 'UAVs in Industries' slides (agriculture slide covers crop health monitoring incl. stress factors and, separately, soil quality/plant counting). Infrared/hyperspectral/UV imagery is used for both crop-health and soil analysis, so 'Both' is the best reasoning-based answer.","verified":"unsure","c":162}]},{"year":2023,"session":"Jul-Oct 2023","week":1,"source":"Official NPTEL noc23_cs82 question images (pattern https://storage.googleapis.com/swayam-node1-production.appspot.com/assets/img/noc23_cs82/w1a1q1.png ... q15); answers by domain knowledge","questions":[{"q":"Which of the following is/are not a type of transducer?","options":["Speaker","Microphone","Solar panel","Connecting wire"],"answer":[3],"explanation":"Lecture 01 (Sensing & Actuation): speaker, microphone etc. convert energy between forms; a wire does not (solar panel also converts light to electricity).","verified":"lecture","c":163},{"q":"“Sensor is sensitive to only the measured property. It is insensitive to any other property besides what it is designed to detect.” True or false?","options":["True","False"],"answer":[0],"explanation":"Not in the IIoT transcript; Misra's IoT-course sensor basics list 'sensitive to the measured property only, insensitive to others' as a sensor property.","verified":"reasoning","c":164},{"q":"“________ sensors produce an output proportional to the magnitude of the quantity being measured.” Fill in the blank.","options":["Scalar","Vector","Analog","Digital"],"answer":[0],"explanation":"Lecture 01 (Sensing & Actuation): scalar sensor response 'is a function of the magnitude of the input parameter only'.","verified":"lecture","c":165},{"q":"What is the resolution of a sensor?","options":["It provides the difference between the measured value and the actual value of the sensing parameter.","It provides the smallest change in the input that a sensor is capable of sensing.","It provides the incremental changes produced in response by the system.","All of the above."],"answer":[1],"explanation":"Lecture 01 (Sensing & Actuation): resolution 'is about the smallest change in the input that a sensor is capable of sensing'.","verified":"lecture","c":166},{"q":"____________ is a part of the system that deals with the control actions required in the system.","options":["Sensor","Actuator","Manager","None of the above"],"answer":[1],"explanation":"Lecture 01 (Sensing & Actuation): 'an actuator is a part of the system that deals with the control action that is required'.","verified":"lecture","c":167},{"q":"What is the function of an electric rotary actuator?","options":["Converts mechanical energy into electrical energy","Converts analog signals to digital signals","Converts electrical energy into rotational motion","All of the above"],"answer":[
