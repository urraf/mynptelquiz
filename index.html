g preventive actions","Flexibility and adaptability"],"answer":[1],"explanation":"Lecture 49 (Factories and Assembly Line): smart factory optimized 'without any human intervention or with minimal human intervention'.","verified":"lecture","c":1161,"rel":[["Jan-Apr 2025",10,1]]},{"q":"Fill in the blanks. The YuMi initiative by ABB focuses on ______.","options":["Smart packaging with only Bluetooth-enabled systems","Human-robot collaboration","Maximize human involvement","Robotic shelves for warehouses"],"answer":[1],"explanation":"Lecture 49 (Factories and Assembly Line): ABB YuMi 'initiative for collaboration between ... robots and the humans'.","verified":"lecture","c":1162},{"q":"What is the primary purpose of the SmartLabel initiative by the Grocery Manufacturers Association (GMA)?","options":["To provide consumers with detailed product information such as ingredients and nutrition through QR codes","To control temperature settings of smart refrigerators remotely","To enable drone delivery of grocery items","To print manufacturing dates on food packaging"],"answer":[0],"explanation":"Lecture 50 (Food Industry): SmartLabel by GMA uses QR code for ingredients, allergens, nutrition.","verified":"lecture","c":1163},{"q":"What is the impact of IoT in food industry?","options":["Increased wastage of food","Longer production cycles","Transparency of the supply chain","Complete elimination of temperature monitoring"],"answer":[2],"explanation":"Lecture 50 (Food Industry): 'We are going to have transparency of the supply chain'.","verified":"lecture","c":1164},{"q":"Fill in the blanks. The BioRanger device developed by Diagenetix is primarily used for ______.","options":["Monitoring livestock health","Detecting microbial diseases in food","Monitoring soil moisture","Infusing flavors into beverages"],"answer":[1],"explanation":"Lecture 50 (Food Industry): BioRanger detects microbial diseases/pathogens in food.","verified":"lecture","c":1165},{"q":"State true or false. SCADA is a system of hardware and software components, which enable remote control, monitoring, and maintenance of local and remote industrial processes in real-time.","options":["True","False"],"answer":[0],"explanation":"Lecture 45 (SDN in IIoT Part 1) places SCADA at supervisory control level; standard definition of SCADA matches the statement.","verified":"reasoning","c":1166}]},{"year":2025,"session":"Jul-Oct 2025","week":11,"source":"https://www.youtube.com/watch?v=3X1n2cr16Ko","questions":[{"q":"What is the utility of Dexcom?","options":["To monitor oxygen saturation in patients","To measure and track blood pressure remotely","To monitor glucose levels continuously and notify abnormalities","To detect asthma symptoms using inhalers"],"answer":[2],"explanation":"L51 'IIoT Applications: Healthcare' slide: Dexcom continuous glucose monitoring; 'It notifies the doctors and patients if any abnormal situation occur'.","verified":"lecture","c":1167},{"q":"Which of the following represents an IoT-based blood pressure monitoring system?","options":["iHealth BP5","Manual mercury sphygmomanometer","Analog wrist blood pressure cuff","Traditional glass thermometer"],"answer":[0],"explanation":"L51 'IIoT Applications: Healthcare' slide: 'iHealth BP5 is IoT based blood [pressure] monitoring system'.","verified":"lecture","c":1168},{"q":"Which of the following is a key security requirement in IIoT healthcare?","options":["Confidentiality, Integrity, Authentication, Availability","Scalability, Flexibility, Latency, Mobility","Cloud storage, Big Data, Sensors, Networks","None of these"],"answer":[0],"explanation":"L51 'IIoT Applications: Healthcare' slide 'IIoT Healthcare Security Requirement': Confidentiality, Integrity, Authentication, Availability.","verified":"lecture","c":1169},{"q":"What is a major benefit of a digital power plant using IIoT?","options":["More human supervision","Higher energy cost","Turbine's performance improvement and remote monitoring","Manual performance tracking"],"answer":[2],"explanation":"L52 'IIoT Applications: Power Plants' slide benefits of digital power plant: 'Turbine's performance improvement, remote monitoring'.","verified":"lecture","c":1170},{"q":"Which network is primarily used for in-home IoT devices in a smart grid?","options":["Wide Area Network (WAN)","Home Area Network (HAN)","Field Area Network (FAN)","Neighborhood Area Network (NAN)"],"answer":[1],"explanation":"L52 'IIoT Applications: Power Plants' slide: 'Home area network - Covers in-home IoT devices. Wireless: Zigbee, 6LowPan'.","verified":"lecture","c":1171},{"q":"Which component of the Advanced Metering Infrastructure (AMI) is responsible for analyzing the collected data?","options":["Smart meters","Meter data management system","Programmable logic controllers","Remote terminal units"],"answer":[1],"explanation":"L52 'IIoT Applications: Power Plants': 'the meter data management system (MDMS) ... helps in analyzing the data that are collected from these smart meters'.","verified":"lecture","c":1172},{"q":"What type of RFID tag has an onboard battery but no active transmitter?","options":["Passive","Active","Semi-passive","Beacon-based"],"answer":[2],"explanation":"L53 'Inventory Management & Quality Control': semi-passive tag has an onboard battery to power the IC but no active transmitter.","verified":"lecture","c":1173,"rel":[["Jan-Apr 2025",11,0]]},{"q":"Which of the following is not a key requirement for effective inventory management?","options":["Meet anticipated demand","Hedge against price increases","Increase inventory management cost","Smoothen the flow of operations"],"answer":[2],"explanation":"L53 'Inventory Management & Quality Control': requirements for effective inventory management: meet demand, hedge against price increases, smoothen operations; increasing cost is not one.","verified":"lecture","c":1174},{"q":"Which of the following is a major limitation of barcodes compared to RFID tags?","options":["Vulnerable to forgery","Require line of sight","Only one can be read at a time","All of these"],"answer":[3],"explanation":"L53 'Inventory Management & Quality Control' slide 'RFID tags over Barcodes': barcodes need line of sight, only one read at a time, less security and hence can be forged.","verified":"lecture","c":1175},{"q":"Which of the following does NOT represent a type of network security?","options":["Detection of abnormal behavior by the network","Prevention of unauthorized sharing of sensitive data","Protection against phishing attack","Predictive maintenance of HVAC systems"],"answer":[3],"explanation":"L54 'Plant Security and Safety' network security types include behavioral analytics, data loss prevention, email security (phishing); HVAC maintenance is not one.","verified":"lecture","c":1176},{"q":"What does \"Integrity\" in software security ensure?","options":["Assurance of data accuracy and consistency throughout its lifecycle","Verification of user credentials before granting access","Extent to which software remains available during component failures","Prevention of phishing attacks via email"],"answer":[0],"explanation":"L54 'Plant Security and Safety' slide 'Integrity': assurance of uncorrupted data; maintain consistency, accuracy and trustworthiness of data over its entire life cycle.","verified":"lecture","c":1177},{"q":"Which of the following is not a major risk associated with AR/VR in industrial applications?","options":["Privacy and security issues","Compromised content on the screen by hackers","Intellectual property concerns","Reduced risk of accidents and improved worker safety"],"answer":[3],"explanation":"L54 'Plant Security and Safety' slide 'Risks (AR/VR)': attacks by hackers, compromised content on screen, IP rights, privacy and security; reduced accident risk is a benefit, not a risk.","verified":"lecture","c":1178},{"q":"Which of the following does not represent a typical application of analytics in facility management?","options":["Managing energy consumption","Determining exact square-foot utilization of office space","Enhancing real-time gameplay in virtual environments","Operational cost-optimization"],"answer":[2],"explanation":"L55 'Facility Management' analytics slide: energy consumption, data-driven decisions, cost optimization, remote monitoring, exact square-foot utilization; gameplay is unrelated.","verified":"lecture","c":1179},{"q":"Which is a key benefit of IoT-based facility management?","options":["Increase unauthorized access","Real-time tracking and better customer experience","Increase all maintenance costs","Make manual monitoring mandatory"],"answer":[1],"explanation":"L55 'Facility Management' benefits slide: improve customer experience, prevent unauthorized access, real-time tracking.","verified":"lecture","c":1180},{"q":"Fill in the blanks. ______ is one of the examples of the IoT-based body temperature monitoring device that takes into account the age, temperature, and symptoms of the patient to provide suggestions for the appropriate medicines or alert doctors.","options":["Kinsa","Dexcom","iHealth","QardioCore"],"answer":[0],"explanation":"L51 'IIoT Applications: Healthcare': Kinsa smart thermometer is the IoT body-temperature monitoring device (others are glucose, BP, ECG devices).","verified":"lecture","c":1181}]},{"year":2025,"session":"Jul-Oct 2025","week":12,"source":"https://www.youtube.com/watch?v=NsUxE_5J-Ms","questions":[{"q":"Which of the following is not a benefit of using IoT in the oil and gas industry?","options":["Increase production efficiency","Save cost and time","Improve asset maintenance","Guarantee unlimited oil reserves"],"answer":[3],"explanation":"L56 'Oil, Chemical and Pharmaceutical Industry' benefits: production efficiency, save cost and time, improve asset maintenance; unlimited oil reserves is not a benefit.","verified":"lecture","c":1182,"rel":[["Jul-Oct 2022",12,0],["Jan-Apr 2025",12,0]]},{"q":"Which of the following is not a direct benefit of predictive maintenance using IoT in chemical industries?","options":["Increase in energy prices","Reduced equipment breakdown","Improve quality by efficient IoT analytics programs","Efficient and effective maintenance"],"answer":[0],"explanation":"L56 'Oil, Chemical and Pharmaceutical Industry' slide 'Predictive maintenance': reduce breakdown, efficient maintenance, improve quality by IoT analytics; increased energy prices is not one.","verified":"lecture","c":1183},{"q":"Which of the following is not a feature of IoT-enabled logistics improvement in the chemical industry?","options":["Ensuring product location using sensors or RFID tags","Tracking assets to prevent loss","Detecting contamination or possible attacks","Random manual checks without sensor support"],"answer":[3],"explanation":"L56 'Oil, Chemical and Pharmaceutical Industry' slide 'Improve Logistics': product location via sensors/RFID, track assets, detect contamination, alerts, warehouse monitoring.","verified":"lecture","c":1184},{"q":"Which of the following best describes condition-based monitoring in IoT-based chemical industries?","options":["Predicting quality by continuous monitoring and analyzing factors such as water, nutrients, and pesticides.","Running manual quality inspections once a year.","Ignoring environmental factors like weather and focusing only on sales data.","Setting random pricing models without data-driven insights."],"answer":[0],"explanation":"L56 'Oil, Chemical and Pharmaceutical Industry' slide 'Condition-based monitoring': 'Predict quality by continuous monitoring; Water, nutrients, and pesticides analysis'.","verified":"lecture","c":1185},{"q":"Which of the following is a way IoT helps minimize supply chain risks in the chemical industry?","options":["Conducting only annual manual audits of warehouses","Real-time monitoring of equipment, materials, processes, environment, and workers","Ignoring process data and focusing only on final product delivery","Depending solely on human inspections without sensors"],"answer":[1],"explanation":"L56 'Oil, Chemical and Pharmaceutical Industry' slide 'Minimize Supply Chain Risk': real-time monitor of equipment, material, environment, process, workers.","verified":"lecture","c":1186},{"q":"What function does the IoT play in the pharmaceutical industry related to drug safety?","options":["Automated surgery","Developing vaccines","Detecting adverse drug reactions and allergens","Building hospital infrastructure"],"answer":[2],"explanation":"L56 'Oil, Chemical and Pharmaceutical Industry' slide: detect ADR, excipient effects, allergies.","verified":"lecture","c":1187},{"q":"Which of the following represents the key features of sixth-generation drone technology?","options":["Platform and payload adaptability, automated safety modes, intelligent piloting models and full autonomy, airspace awareness","Manual flight control with static camera mount and basic video recording","Single-axis gimbal with limited flight time and analog signal transmission","Pre-programmed routes with no adaptability and no safety protocols"],"answer":[0],"explanation":"L57 'UAVs in Industries' generations slide: Sixth - 'Improved safety and regulatory, platform and payload adaptability, automated safety modes, intelligent piloting models and full autonomy, airspace awareness'.","verified":"lecture","c":1188},{"q":"State true or false - UAV-based light displays are generally more expensive than traditional firework displays and cannot be reused.","options":["True","False"],"answer":[1],"explanation":"L57 'UAVs in Industries' entertainment slide: UAV light displays are 'cheaper and more exciting than traditional firework display'.","verified":"lecture","c":1189,"rel":[["Jul-Oct 2023",12,0]]},{"q":"How are UAVs primarily used in precision forestry applications?","options":["To increase lumber pricing","To measure canopy height, density and volume estimation","To stop monitoring wild life","To increase cost of forest maintanace"],"answer":[1],"explanation":"L57 'UAVs in Industries' forestry slide: 'Measurement of canopy height, density and volume estimation'.","verified":"lecture","c":1190},{"q":"State true or false. One of the applications of UAVs in telecommunication is to perform tower inspection.","options":["True","False"],"answer":[0],"explanation":"L57 'UAVs in Industries' telecom slide: 'Tower inspection by UAVs'.","verified":"lecture","c":1191,"rel":[["Jul-Oct 2023",12,0]]},{"q":"Which of the following is an application of UAVs in delivery and healthcare?","options":["Transporting blood samples to laboratories","Conducting remote surgeries inside hospitals","Manufacturing medical syringes","Hiring doctors for clinics"],"answer":[0],"explanation":"L57 'UAVs in Industries' slide 'Delivery and Healthcare': 'Transport blood samples to laboratories for testing crucial diseases'.","verified":"lecture","c":1192},{"q":"Which of the following activities can be performed by using UAVs in the mining?","options":["Regular surface survey for optimized blast design","Manage stockpiles","Site exploration","All of these"],"answer":[3],"explanation":"L57 'UAVs in Industries' slide 'Application in Mining': regular surface survey for optimized blast design, manage stockpiles, site exploration.","verified":"lecture","c":1193,"rel":[["Jan-Apr 2024",12,1]]},{"q":"Which of the following is not a reason why case studies are necessary?","options":["Provide in-depth knowledge and clarity","Explore real-life phenomena","Enable detailed quantitative and qualitative analysis","Guarantee faster industrial automation by themselves"],"answer":[3],"explanation":"L58 'Case Studies for Industry 4.0 & IIoT' slide lists in-depth knowledge/clarity, real-life phenomenon, quantitative & qualitative analysis; 'guarantee faster automation' is not listed.","verified":"lecture","c":1194,"rel":[["Jul-Oct 2022",12,0]]},{"q":"Which of the following is not typically part of a case study subject matter?","options":["A small geographical area","A limited number of individuals","National-level government policies","Real-life related events"],"answer":[2],"explanation":"L58 'Case Studies for Industry 4.0 & IIoT' slide: subject is 'a small geographical area or a very limited number of individuals'; national policies are not.","verified":"lecture","c":1195},{"q":"State true or false. Almost all mining industries rely on conveyer-belt based systems for loading/unloading of mined materials.","options":["True","False"],"answer":[0],"explanation":"Corrected after checking the lecture (was: False). Not covered by the original lectures (L58 case studies have no mining case); appears to come from a newer mining/conveyor-belt case study (Transco/LoRaWAN). The sentence reads like a verbatim lecture premise, so True is more likely than the uploader's unconfirmed False.","verified":"unsure","c":1196}]},{"year":2026,"session":"Jul-Oct 2026","week":0,"source":"https://www.youtube.com/watch?v=3BswvWBtx7M","questions":[{"q":"Which component of a computer system is primarily responsible for executing instructions and performing logical calculations?","options":["Random Access Memory (RAM)","Hard Disk Drive (HDD)","Central Processing Unit (CPU)","Motherboard"],"answer":[2],"explanation":"CPU executes instructions; the Jul-Oct 2026 W0 submission screen in the solve video shows 'Accepted answer is C. Central Processing Unit (CPU)'.","verified":"reasoning","c":1197},{"q":"What is the primary purpose of an IP address in a computer network?","options":["To identify the physical location of the user","To uniquely identify a device connected to a network","To encrypt data before transmission","To provide power to network interfaces"],"answer":[1],"explanation":"An IP address uniquely identifies a device on a network.","verified":"reasoning","c":1198},{"q":"Which of the following best describes the function of Random Access Memory (RAM)?","options":["It permanently stores the operating system.","It acts as volatile, temporary storage for data actively being used.","It handles long-term archival of documents.","It connects the computer to a local network."],"answer":[1],"explanation":"RAM is volatile working memory for data in active use.","verified":"reasoning","c":1199},{"q":"Which service is responsible for translating human-readable domain names into numerical IP addresses?","options":["Dynamic Host Configuration Protocol (DHCP)","File Transfer Protocol (FTP)","Domain Name System (DNS)","Hypertext Transfer Protocol (HTTP)"],"answer":[2],"explanation":"DNS translates domain names into IP addresses.","verified":"reasoning","c":1200},{"q":"A network that connects computers and devices within a limited physical area, such as a single office building or a university laboratory, is known as a:","options":["Wide Area Network (WAN)","Personal Area Network (PAN)","Local Area Network (LAN)","Metropolitan Area Network (MAN)"],"answer":[2],"explanation":"A network within a building/lab is a LAN.","verified":"reasoning","c":1201},{"q":"In the context of a basic computing architecture, which of the following acts as an input device (analogous to a sensor in an IoT system)?","options":["Printer","Keyboard","Monitor","Speaker"],"answer":[1],"explanation":"Keyboard is the input device among the options.","verified":"reasoning","c":1202},{"q":"A Media Access Control (MAC) address is a hardware identification number typically hardcoded into which component?","options":["Central Processing Unit (CPU)","Power Supply Unit (PSU)","Network Interface Card (NIC)","System BIOS"],"answer":[2],"explanation":"MAC address is burned into the NIC.","verified":"reasoning","c":1203},{"q":"At the most fundamental hardware level, how is all digital data represented inside a computer?","options":["As alphanumeric characters","As hexadecimal codes","As continuous analog wave signals","As binary digits (0s and 1s)"],"answer":[3],"explanation":"Digital data is represented as binary 0s and 1s.","verified":"reasoning","c":1204},{"q":"Which networking device operates by examining incoming data packets and determining the best path to forward them to their destination across different networks?","options":["Network Hub","Network Router","Network Switch","Wireless Access Point"],"answer":[1],"explanation":"Routers choose paths between different networks.","verified":"reasoning","c":1205},{"q":"What does the term \"Cloud Storage\" fundamentally refer to in basic internet architecture?","options":["Storing data on a localized external hard drive attached to a router","Storing data on remote servers managed by a provider and accessed via the internet","Compacting and zipping files to save space on a hard drive","Temporarily saving data in the computer's RAM"],"answer":[1],"explanation":"Cloud storage = data on provider-managed remote servers accessed over the internet.","verified":"reasoning","c":1206},{"q":"What is the primary function of an Operating System (OS)?","options":["To protect the computer from physical hardware theft","To manage computer hardware resources and provide common services for computer programs","To translate foreign languages on web pages","To physically cool the CPU during heavy workloads"],"answer":[1],"explanation":"OS manages hardware resources and provides common services to programs.","verified":"reasoning","c":1207},{"q":"In a web browser's URL bar, what does the \"S\" in HTTPS signify?","options":["Standard","System","Secure","Server"],"answer":[2],"explanation":"HTTPS = HTTP Secure.","verified":"reasoning","c":1208},{"q":"Before a real-world physical metric (like temperature) can be processed by a computer, an analog signal must usually pass through which component?","options":["Digital-to-Analog Converter (DAC)","Arithmetic Logic Unit (ALU)","Analog-to-Digital Converter (ADC)","Universal Serial Bus (USB)"],"answer":[2],"explanation":"Analog sensor signals pass through an ADC before digital processing.","verified":"reasoning","c":1209},{"q":"What does the acronym URL stand for?","options":["Universal Record Locator","Uniform Resource Locator","Unified Routing Link","Universal Resource Link"],"answer":[1],"explanation":"URL = Uniform Resource Locator.","verified":"reasoning","c":1210},{"q":"Which protocol is the foundational standard for transmitting web pages and data over the World Wide Web?","options":["File Transfer Protocol (FTP)","Simple Mail Transfer Protocol (SMTP)","Secure Shell (SSH)","Hypertext Transfer Protocol (HTTP)"],"answer":[3],"explanation":"HTTP is the web's transfer protocol; the 2026 W0 submission screen shows 'Accepted answer is D. Hypertext Transfer Protocol (HTTP)'.","verified":"reasoning","c":1211}]},{"year":2026,"session":"Jul-Oct 2026","week":1,"source":"https://www.youtube.com/watch?v=3BswvWBtx7M","questions":[{"q":"Which sensor can detect gases like LPG, CH4, and CO?","options":["DHT22","MQ-5","HC-SR04","PIR"],"answer":[1],"explanation":"Lecture 01 (Sensing & Actuation) shows a 'gas sensor for detecting LPG gas, methane, carbon monoxide'; MQ-5 is that LPG/CH4/CO module (DHT22 temp/humidity, HC-SR04 ultrasonic, PIR motion).","verified":"lecture","c":1212,"rel":[["Jul-Oct 2024",1,1]]},{"q":"Which modulation scheme does Zigbee use for the 2.4 GHz band?","options":["BPSK","QPSK","OQPSK","FSK"],"answer":[2],"explanation":"Lecture 02 (IoT Connectivity Part I): 'the 2.4 gigahertz band uses OQPSK'.","verified":"lecture","c":1213,"rel":[["Jul-Oct 2024",1,0]]},{"q":"What does the Constrained RESTful Environments (CoRE) framework include for service discovery?","options":["Registration Interface (RI)","Resource Directory (RD)","REST based protocols such as HTTP and CoAP","All of the above"],"answer":[3],"explanation":"Lecture 04 (IoT Networking Part I): CoRE service discovery uses the resource directory, the registration interface and REST-based protocols (HTTP/CoAP).","verified":"lecture","c":1214,"rel":[["Jul-Oct 2024",1,1]]},{"q":"What is the maximum data rate of Z-Wave communication technology?","options":["100 kbps","250 kbps","500 kbps","1 Mbps"],"answer":[0],"explanation":"Lecture 03 (IoT Connectivity Part II): Z-wave 'data rate is up to offered is up to about 100 kbps' over ~30 m.","verified":"lecture","c":1215,"rel":[["Jan-Apr 2025",1,1]]},{"q":"Which protocol is CoAP based on?","options":["TCP","FTP","UDP","HTTP"],"answer":[2],"explanation":"Lecture 05 (IoT Networking Part II): CoAP 'works on top of UDP in the transport layer'.","verified":"lecture","c":1216,"rel":[["Jul-Oct 2024",1,1]]},{"q":"Which coding scheme is used by the IEEE 802.15.4 standard for transmitting information?","options":["CSS","THSS","OFDM","DSSS"],"answer":[3],"explanation":"Lecture 02 (IoT Connectivity Part I): 'DSSS, the direct sequence spread spectrum coding scheme that is used to transmit information'.","verified":"lecture","c":1217,"rel":[["Jan-Apr 2025",1,1]]},{"q":"What does 'Range' indicate in a sensor?","options":["The correctness of the output","The smallest change in input that can be detected","The difference between the standard value and the value produced by the sensor","The highest and the lowest value of the physical quantity within which the sensor can actually sense"],"answer":[3],"explanation":"Lecture 01 (Sensing & Actuation): range 'means the range of operation lowest value to highest value'.","verified":"lecture","c":1218,"rel":[["Jul-Oct 2024",1,0],["Jan-Apr 2025",1,1]]},{"q":"Which organization has developed the ISA 100.11a standard?","options":["Instrument Society of America","International Society of Automation","International Studies Association","International Solar Alliance"],"answer":[1],"explanation":"Lecture 03 (IoT Connectivity Part II): ISA 100.11a 'was developed by international society for automation the ISA'.","verified":"lecture","c":1219,"rel":[["Jan-Apr 2025",1,1]]},{"q":"Which of the following is/are the drawbacks of proprietary non-IP-based solutions?","options":["Limited flexibility to end users","Interoperability","Limited last-mile connectivity","All of these"],"answer":[3],"explanation":"Lecture 04 (IoT Networking Part I): drawbacks of non-IP solutions: limited flexibility to end users, interoperability, limited last mile connectivity.","verified":"lecture","c":1220,"rel":[["Jan-Apr 2025",1,1]]},{"q":"Which MQTT QoS Level is also known as \"at most once\" delivery?","options":["QoS 0","QoS 1","QoS 2","None of these"],"answer":[0],"explanation":"Lecture 05 (IoT Networking Part II): 'QoS 0 which is about ensuring at most once delivery'.","verified":"lecture","c":1221,"rel":[["Jan-Apr 2025",1,1]]},{"q":"Fill in the blank space designated by the question mark. [Diagram: Input Signal -> Sensor -> ?","options":["Snubber","Repeater","Processor","Amplifier"],"answer":[2],"explanation":"Lecture 01 (Sensing & Actuation): 'this sensor plus the processor ... this is a transducer. Similarly, actuator plus processor is also a transducer'.","verified":"lecture","c":1222,"rel":[["Jan-Apr 2025",1,1]]},{"q":"Which of the following best describes a vector sensor?","options":["Its response depends only on the temperature.","Its response depends only on the magnitude of the input.","Its response depends on the magnitude, direction, and orientation of the input parameter.","Its response is independent of the input parameter."],"answer":[2],"explanation":"Lecture 01 (Sensing & Actuation): vector sensor response depends on 'the magnitude, the direction and the orientation'.","verified":"lecture","c":1223,"rel":[["Jul-Oct 2022",1,0]]},{"q":"Which of the following frequency ranges is used by 6LoWPAN worldwide?","options":["902-929 MHz","2400-2483.5 MHz","1800-1900 MHz","5.8 GHz"],"answer":[1],"explanation":"Lecture 02 (IoT Connectivity Part I): 6LoWPAN uses '2400 to 2483.5 megahertz frequency band which is used worldwide' (902-929 MHz is North America).","verified":"lecture","c":1224},{"q":"In DDS RTPS, data is referred to as:","options":["Packets","Frames","Messages","Topics"],"answer":[3],"explanation":"Lecture 05 (IoT Networking Part II): DDS RTPS 'is a data centric binary protocol and this data in this context are termed as topics'.","verified":"lecture","c":1225},{"q":"Which of the following IoT protocols is based on the session layer of the OSI model?","options":["MQTT","CoAP","AMQP","DTLS"],"answer":[1],"explanation":"Corrected after checking the lecture (was: MQTT). Lecture 05 (IoT Networking Part II): the only protocol the lecture calls a session protocol is CoAP: 'CoAP is kind of an application layered protocol ... even more specifically it ensures session, so, session protocol' (Misra's slide: 'CoAP - session layer protocol designed by IETF CoRE'). MQTT/AMQP are described only as pub/sub over TCP; uploaders split AMQP vs MQTT, so moderate confidence.","verified":"lecture","c":1226,"rel":[["Jan-Apr 2025",1,1]]}]},{"year":2026,"session":"Jul-Oct 2026","week":2,"source":"https://www.youtube.com/watch?v=3BswvWBtx7M (cross-checked with https://www.youtube.com/watch?v=7RvC6BDJF-Q)","questions":[{"q":"What is a significant characteristic of new materials in the context of the Fourth Industrial Revolution?","options":["High cost and scarcity","Lighter, stronger, recyclable, and adaptive","Easily available but very expensive","Non-recyclable and heavy"],"answer":[1],"explanation":"Lecture 06 (The Fourth Revolution): 'Newer materials, lighter materials, stronger materials, materials that are recyclable'.","verified":"lecture","c":1227,"rel":[["Jul-Oct 2024",2,1]]},{"q":"Which of the following is NOT a characteristic of the Fourth Industrial Revolution?","options":["Extensive use of the ubiquitous and mobile internet","Use of artificial intelligence and machine learning","Invention of the steam engine","Development of Cyber Physical Systems (CPS)"],"answer":[2],"explanation":"Lecture 06 (The Fourth Revolution): steam engine belongs to the first revolution (1760-1840).","verified":"lecture","c":1228,"rel":[["Jan-Apr 2024",2,0],["Jul-Oct 2024",2,1]]},{"q":"What is considered the main nervous system of any manufacturing industry?","options":["Human Resources","Information and Communication Technology (ICT)","Supply Chain Management (SCM)","Marketing"],"answer":[1],"explanation":"Lecture 07 (Sustainability Assessment of Manufacturing Industry): ICT is the backbone/nervous system of manufacturing industries.","verified":"lecture","c":1229,"rel":[["Jul-Oct 2022",2,0],["Jul-Oct 2024",2,1],["Jul-Oct 2025",2,0]]},{"q":"Which of the following is not a characteristic of a sustainable industry?","options":["Energy efficiency","Reliance on government subsidy","Conservation of resource","Low-waste production"],"answer":[1],"explanation":"Lecture 07 (Sustainability Assessment of Manufacturing Industry): sustainable industry = energy efficiency, resource conservation, low waste - not reliance on subsidy.","verified":"lecture","c":1230,"rel":[["Jul-Oct 2022",2,0],["Jul-Oct 2024",2,1]]},{"q":"What does L, D and T stand for under 'People Engagement' in the Lean production System?","options":["Learn, Do, Teach","Leverage, Divulge, Teardown","Lean, Diverse, Timid","Loan, Deploy, Test"],"answer":[0],"explanation":"Lecture 08 (Lean Production System): people engagement objectives 'learn, do, teach'.","verified":"lecture","c":1231,"rel":[["Jul-Oct 2024",2,1]]},{"q":"Which resource is associated with the 'Optimization' categorization of Smart and connected products?","options":["Optimization algorithms","Manual controls","Marketing data","Financial reports"],"answer":[0],"explanation":"Lecture 09 (Smart and Connected Business Perspective): optimization uses optimization solutions/algorithms.","verified":"lecture","c":1232,"rel":[["Jul-Oct 2024",2,1]]},{"q":"State True or False. The amalgamation of CPS and the evolution of Internet-based technologies led to the development of the Industrial Internet.","options":["True","False"],"answer":[0],"explanation":"Same statement as Jul-Oct 2024 W2 Q14; Industrial Internet = CPS combined with Internet technologies - True.","verified":"reasoning","c":1233,"rel":[["Jul-Oct 2024",2,0]]},{"q":"State True or False. Real-time supply chain monitoring reduces inventory and capital requirements.","options":["True","False"],"answer":[0],"explanation":"Same statement as Jul-Oct 2024 W2 Q15; real-time supply-chain monitoring reduces inventory and capital - True.","verified":"reasoning","c":1234,"rel":[["Jul-Oct 2024",2,0]]},{"q":"In the context of Industry 4.0, what is the full form of CPS?","options":["Controlled Power System","Customer Provisioning Service","Cloud Processing Service","Cyber Physical Systems"],"answer":[3],"explanation":"CPS = Cyber Physical Systems (named in Lecture 06 and Lecture 11).","verified":"reasoning","c":1235,"rel":[["Jan-Apr 2025",2,1]]},{"q":"What does ERP stand for in the context of ICT?","options":["Enterprise Resource Planning","Electronic Resource Platform","Enhanced Reporting Protocol","Economic Resource Planning"],"answer":[0],"explanation":"Lecture 07 (Sustainability Assessment of Manufacturing Industry): ICT enables 'Enterprise Resource Planning ERP based systems'.","verified":"lecture","c":1236,"rel":[["Jan-Apr 2025",2,1]]},{"q":"What is a 'value stream' in Lean Production System?","options":["A set of tools for production","All the actions required for a product from order to delivery","A method of employee training","A type of waste reduction"],"answer":[1],"explanation":"Lecture 08 (Lean Production System): 'value streams are all the actions that are required for a product from order ... to the delivery'.","verified":"lecture","c":1237,"rel":[["Jul-Oct 2024",2,1],["Jan-Apr 2025",2,1]]},{"q":"Which of the following are key attributes of a smart business model?","options":["Manual processes, cost reduction, and labor dependency","Value proposition, revenue streams, and technologies","Traditional marketing, fixed costs, and limited innovation","Centralized control, non-digital strategies, and fixed processes"],"answer":[1],"explanation":"Lecture 09 (Smart and Connected Business Perspective): key attributes are value proposition, revenue stream and technologies.","verified":"lecture","c":1238,"rel":[["Jul-Oct 2022",2,0],["Jan-Apr 2025",2,1],["Jul-Oct 2025",2,0]]},{"q":"Which of the following is not a component of a Smart Factory?","options":["Smart machines","Smart manufacturing processes","Information Technology","Physical ledgers"],"answer":[3],"explanation":"Lecture 10 (Smart Factories): smart factory components are smart machines, processes, engineering, devices, IT, analytics - not physical ledgers.","verified":"lecture","c":1239,"rel":[["Jan-Apr 2023",2,0],["Jul-Oct 2022",2,0],["Jan-Apr 2025",2,1]]},{"q":"In which format is healthcare data transmitted to maintain data uniformity and interoperability?","options":["HL-7","LH-5","HD-7","None of these"],"answer":[0],"explanation":"Not in Weeks 1-2 transcripts; HL7 (Health Level Seven) is the healthcare data interchange standard (covered in the IIoT healthcare lecture).","verified":"reasoning","c":1240,"rel":[["Jan-Apr 2025",2,1]]},{"q":"What are the key characteristics of agility?","options":["Stability, Rigidity, and Standardization","Flexibility, Adaptation, and Self-configuration","Planning, Controlling, and Monitoring","Automation, Documentation, and Testing"],"answer":[1],"explanation":"Lecture 10 (Smart Factories): agility covers flexibility, adaptation and self-configuration.","verified":"lecture","c":1241}]},{"year":2026,"session":"Jul-Oct 2026","week":3,"source":"https://www.youtube.com/watch?v=s9Iyj-zPKjs (cross-checked with https://www.youtube.com/watch?v=3BswvWBtx7M)","questions":[{"q":"What does \"reactive computation\" in CPS signify?","options":["Systems with zero response time","Interaction with the environment in an ongoing manner","Predefined computation processes","Complete isolation from physical feedback"],"answer":[1],"explanation":"L11: 'reactive computation means ... interaction of the system with the environment in a continuous fashion'.","verified":"lecture","c":1242,"rel":[["Jan-Apr 2025",3,1]]},{"q":"Fill in the blanks. In healthcare applications, CPS is used for _____.","options":["Image-guided surgery and therapy","Manual monitoring of vitals","Static hospital management systems","Front desk management"],"answer":[0],"explanation":"L11: 'robotic surgery or image-guided surgery. These are examples of cyber physical systems ... in healthcare'.","verified":"lecture","c":1243,"rel":[["Jan-Apr 2025",3,1]]},{"q":"Which level in the \"5C Architecture\" ensures the gathering of precise status information of machines?","options":["Conversion","Cognition","Cyber","Configuration"],"answer":[2],"explanation":"Connection is not offered; in the 5C model the Cyber level is the central hub where information from every machine is gathered to give insight into each machine's status (L11: data 'received at some kind of a hub').","verified":"reasoning","c":1244,"rel":[["Jan-Apr 2025",3,1]]},{"q":"Fill in the blanks. Intelligent sensors are capable of _____.","options":["Only sensing data","Processing sensed data and managing external sensors/devices","Limited communication","Basic analog-to-digital conversion"],"answer":[1],"explanation":"L11: intelligent sensors 'are capable of processing sensed data ... capable of managing and controlling external sensors and devices'.","verified":"lecture","c":1245,"rel":[["Jan-Apr 2025",3,1]]},{"q":"How many steps are there in the PLM solution approach in Industry 4.0?","options":["10","12","8","7"],"answer":[0],"explanation":"L12: 'for Industry 4.0, these are the 10 step approaches that can be used for PLM'.","verified":"lecture","c":1246,"rel":[["Jan-Apr 2025",3,1]]},{"q":"Which of the following is not a key component of an AR Device?","options":["Sensors","Cameras","Projection Screen","Remote Control"],"answer":[3],"explanation":"L13: AR device components are 'sensors and cameras, projection screen, processing unit, reflection systems like mirrors'.","verified":"lecture","c":1247,"rel":[["Jan-Apr 2025",3,1]]},{"q":"Which of the following is NOT a challenge of AI in IIoT?","options":["Connecting devices","Understanding data","Training AI models","Lack of available data"],"answer":[3],"explanation":"L14 AI: 'challenges of AI in IIoT. Connecting different devices, understanding the data, training the data, making it accessible, making ... actionable'. Lack of data is not listed; connecting devices is.","verified":"lecture","c":1248,"rel":[["Jan-Apr 2025",3,1]]},{"q":"Which of the following is not one of the primary constraints of mobile CPS?","options":["Stability of the network","Power requirement","Security","Design aesthetics"],"answer":[3],"explanation":"Not in the transcripts; mobile CPS are constrained by network stability, power and security; design aesthetics is not a constraint.","verified":"reasoning","c":1249,"rel":[["Jul-Oct 2024",3,0],["Jan-Apr 2025",3,1]]},{"q":"What are the components of the 5C architecture for CPS?","options":["Connection, Conversion, Cyber, Cognition, Configuration","Creation, Controlling, Continuation, Convergence, Compatibility","Calculation, Catalysis, Convergence, Convenience, Cognizance","None of these"],"answer":[0],"explanation":"L11: 5C = connection, conversion, cyber, cognition, configuration.","verified":"lecture","c":1250,"rel":[["Jan-Apr 2025",3,1]]},{"q":"What is one of the key features of CPS in terms of computation?","options":["Static computation","Reactive computation","Limited computation","Redundant computation"],"answer":[1],"explanation":"L11: 'Reactive computation is very important'.","verified":"lecture","c":1251,"rel":[["Jul-Oct 2024",3,1]]},{"q":"What is a collaboration platform in the context of Industry 4.0?","options":["A type of business software that combines organizational networking capacities with operations","A social media platform for employees","A traditional project management tool","A financial management system"],"answer":[0],"explanation":"L12 describes a business software platform combining a social/networking layer with business operations, matching option A.","verified":"reasoning","c":1252,"rel":[["Jul-Oct 2024",3,1]]},{"q":"What is a key feature of Augmented Reality (AR)?","options":["Completely replacing the physical environment","Enhancing the present perception of reality","Only providing auditory feedback","Operating in isolated systems"],"answer":[1],"explanation":"L13: AR gives an 'amplified environment, where the present perception of reality is improved'.","verified":"lecture","c":1253,"rel":[["Jul-Oct 2024",3,1]]},{"q":"Who proposed the first use of the phrase \"Artificial Intelligence\"?","options":["Alan Turing","John McCarthy","Marvin Minsky","Herbert Simon"],"answer":[1],"explanation":"Not in the transcript; John McCarthy coined the term 'Artificial Intelligence' (1955-56 Dartmouth proposal).","verified":"reasoning","c":1254,"rel":[["Jul-Oct 2024",3,1]]},{"q":"Which of the following statements is true?","options":["A program without AI uses a large knowledge base and a heuristic search method","A program with AI uses a large database and an algorithmic search method","A program with AI uses a large knowledge base and a heuristic search method","A program without AI uses a large database and a heuristic search method"],"answer":[2],"explanation":"L14: program with AI uses large knowledge base and heuristic search.","verified":"lecture","c":1255},{"q":"Which of the following are constraints of mobile CPS?","options":["Network stability","Power requirement","Security","All of the above"],"answer":[3],"explanation":"Not in the transcripts; network stability, power requirement and security are all standard mobile-CPS constraints.","verified":"reasoning","c":1256,"rel":[["Jul-Oct 2024",3,1],["Jan-Apr 2025",3,0]]}]},{"year":2026,"session":"Jul-Oct 2026","week":4,"source":"https://www.youtube.com/watch?v=--xqJazgW3s","questions":[{"q":"What does Application Security aim to protect against?","options":["Unauthorized physical access","Threats to the software applications","Data breaches from the internet","Network architecture issues"],"answer":[1],"explanation":"L16: application security protects applications from outsider threats.","verified":"lecture","c":1257},{"q":"What is Ransomware?","options":["A type of malware that provides a facility to the attacker to lock users' computer files by using encryption and demand money to unlock them","A program that increases computer performance","A system to enhance network speed","A method to secure data from unauthorized access"],"answer":[0],"explanation":"L16: ransomware 'provides a facility to the attacker in which the attacker locks the user's computer files by using an encryption and ... demand some money'.","verified":"lecture","c":1258,"rel":[["Jul-Oct 2024",4,1]]},{"q":"What is a major challenge in the deployment of IIoT?","options":["Legacy installations","Cybersecurity","Lack of standardization","All of the above"],"answer":[3],"explanation":"L17: challenges include cyber security, lack of standardization and legacy installations.","verified":"lecture","c":1259,"rel":[["Jul-Oct 2022",4,0],["Jul-Oct 2024",4,1]]},{"q":"What are the three waves of industrial level innovation according to GE?","options":["The Internet Revolution, The Digital Revolution, The Industrial Internet","The Industrial Revolution, The Internet Revolution, The Industrial Internet","The Agricultural Revolution, The Internet Revolution, The Industrial Internet","The Scientific Revolution, The Industrial Revolution, The Internet Revolution"],"answer":[1],"explanation":"L18: 'first wave was the industrial revolution ... second wave was the internet revolution ... third wave ... industrial internet'.","verified":"lecture","c":1260,"rel":[["Jan-Apr 2024",4,0],["Jul-Oct 2024",4,1]]},{"q":"What is a major drawback of the Industrial Revolution?","options":["It had no impact on the environment","It created a bad working environment and inefficient processes","It reduced the use of fossil fuels","It enhanced the quality of life for all workers"],"answer":[1],"explanation":"L18: drawbacks were 'bad working environment of the workers' and 'inefficiency' (plus environmental waste).","verified":"lecture","c":1261,"rel":[["Jul-Oct 2024",4,1]]},{"q":"Which component is NOT part of the configurations involved in smart sensors?","options":["Multiparameter Sensing Unit","Analog Detection Circuit","Digital Signal Conditioning Unit","Manual Control Unit"],"answer":[3],"explanation":"L19: smart sensor configurations are 'multi parameter sensing unit ... analog detection circuit, digital signal conditioning unit, and interfacing unit to the bus'.","verified":"lecture","c":1262,"rel":[["Jul-Oct 2024",4,1]]},{"q":"Which sector is predicted to have the highest growth in Industry 4.0?","options":["Electronics","Manufacturing","Defense","Automotive"],"answer":[0],"explanation":"L20 shows the sector growth chart (electronics, manufacturing, defense, transportation, chemical, automotive, construction) and highlights electronics: 'current growth trend is about 40 to 50 percent ... predicted ... 70 to 80, so it is a huge leap'. The chart values for other sectors are not read out.","verified":"unsure","c":1263,"rel":[["Jul-Oct 2024",4,1]]},{"q":"What is the focus of the 'Control Layer' in the 5C Architecture for Cyber Physical Systems?","options":["Data collection","Sensor-based monitoring","Supervised control: Self-configure, Self-optimize, Self-adjust","Human-readable interpretation and data visualization"],"answer":[2],"explanation":"L20: 'the control layer ... supervised control, then ... self-configuration, self-optimization, self-adjustment'.","verified":"lecture","c":1264,"rel":[["Jul-Oct 2023",4,0],["Jul-Oct 2024",4,1]]},{"q":"Why are IIoT Security Standards required, especially when diverse systems and equipment are integrated on a smart factory floor?","options":["To reduce the cost of implementing IIoT.","Because leaving security to individual IIoT implementers is dangerous and every weak line puts the whole factory at risk.","To ensure that only new systems are implemented, not legacy ones.","To increase the complexity of the smart factory floor."],"answer":[1],"explanation":"L16: 'every weak line in the production system ... puts the whole factory at risk. So, leaving security at the hands of the individual IIoT implementers is ... dangerous'.","verified":"lecture","c":1265,"rel":[["Jul-Oct 2025",4,1]]},{"q":"In the mining industry, how do sensor networks with gas sensors, strata monitoring devices, and RFID tags contribute to safety and efficiency?","options":["They only help in tracking miners' locations.","They are primarily used for communication between miners.","They replace the need for human inspection.","They provide early disaster warning, monitor working conditions, and help locate miners."],"answer":[3],"explanation":"L17: mining benefits are 'early disaster warning, working condition of the miners can be monitored ... Locating and monitoring the miners'.","verified":"lecture","c":1266,"rel":[["Jul-Oct 2025",4,1]]},{"q":"Who coined the term \"Industrial Internet\"?","options":["IBM","General Electric (GE)","Intel","Siemens"],"answer":[1],"explanation":"L18: General Electric coined 'industrial internet'.","verified":"lecture","c":1267,"rel":[["Jul-Oct 2025",4,1]]},{"q":"In a milk packaging unit, how is flow measured?","options":["Using a thermometer","Via a spinning impeller that sends signals when milk flows","With a smart camera","Using a GPS module"],"answer":[1],"explanation":"L19: 'impeller spins when the milk moves and sends the electrical signal to the control unit'.","verified":"lecture","c":1268,"rel":[["Jul-Oct 2025",4,1]]},{"q":"Which component is responsible for converting analog data to digital data in a smart sensor node?","options":["Processor","Memory","ADC","DAC"],"answer":[2],"explanation":"L19: smart sensor node has 'the ADC, the analog to digital converter'.","verified":"lecture","c":1269,"rel":[["Jul-Oct 2025",4,1]]},{"q":"Fill in the blanks. Thames Water's smart water management system, as an example of Industrial Process 4.0 operation efficiency, primarily benefits from","options":["Data monetization and pay-per-use models.","Sensor-based equipment status monitoring and failure detection.","Augmented Reality-based problem diagnosis.","Controlled power generation using weather forecasts."],"answer":[1],"explanation":"L20: Thames Water example: 'sensor based equipment monitoring the status monitoring, detection of failures'.","verified":"lecture","c":1270,"rel":[["Jul-Oct 2025",4,1]]},{"q":"State true or false. In the case of spear phishing, the attackers send thousands of deceitful emails that resemble actual emails from credible sources, while email phishing attacks are targeted at a specific person or organization to obtain sensitive information.","options":["True","False"],"answer":[1],"explanation":"Same as the Jul-Oct 2025 item: spear phishing is targeted and email phishing is mass, so the statement is False.","verified":"reasoning","c":1271,"rel":[["Jul-Oct 2025",4,0]]}]},{"year":2026,"session":"Jul-Oct 2026","week":5,"source":"https://www.youtube.com/watch?v=FnPr2bGkzP4","questions":[{"q":"Which company employs the \"Air-as-a-Service\" model by using sensor-equipped air compressors where users pay per cubic meter of air?","options":["John Deere","Kaeser Kompressoren","Magna Steyr","Gehring"],"answer":[1],"explanation":"Lecture 21 (Industrial Processes - Part 2): Kaeser Kompressoren air-as-a-service.","verified":"lecture","c":1272},{"q":"In the context of the Hitachi integrated IIoT platform, what is the name of the core IoT platform used for AI-powered advanced analytics?","options":["Predix","MindSphere","Lumada","Connext"],"answer":[2],"explanation":"Lecture 21 (Industrial Processes - Part 2): Hitachi's Lumada IoT platform provides AI-based advanced analytics.","verified":"lecture","c":1273},{"q":"In the context of Smart Logistics, which company uses IoT and analytics to remotely monitor and optimize fuel consumption for refrigerated and dry cargo containers?","options":["Boeing","Maersk","Komatsu","Stanley Black & Decker"],"answer":[1],"explanation":"Lecture 21 (Industrial Processes - Part 2): Maersk uses IoT and analytics 'to optimize the route and fuel consumption for containers' (dry, refrigerated cargo).","verified":"lecture","c":1274},{"q":"In the building blocks of a business model, which of the following represents a quantitative value proposition?","options":["Design","Brand perception","Customer experience","Post-purchase cost reduction"],"answer":[3],"explanation":"Lecture 22 (Business Models - Part 1): quantitative values are price/cost and performance; design, brand, experience are qualitative.","verified":"lecture","c":1275},{"q":"Which IoT business model enables businesses to virtually consolidate and share their IoT-enabled assets among multiple customers to minimize downtime and maximize utilization?","options":["Subscription Model","Asset-Sharing Model","Outcome-Based Model","IoT-as-a-Service"],"answer":[1],"explanation":"Lecture 22 (Business Models - Part 1): asset-sharing - 'aim is basically to minimize the downtime, and maximize the utilization of the assets'.","verified":"lecture","c":1276,"rel":[["Jan-Apr 2023",5,0]]},{"q":"In a Cloud-Based Business Model, which offering provides development-oriented platforms to facilitate the integration of applications into existing solutions?","options":["Software-as-a-Service (SaaS)","Infrastructure-as-a-Service (IaaS)","Platform-as-a-Service (PaaS)","Network-as-a-Service (NaaS)"],"answer":[2],"explanation":"Lecture 23 (Business Models - Part 2): PaaS is 'the development platform ... integration of different applications'.","verified":"lecture","c":1277},{"q":"In the functional flow of IIoT business models, which model specifically employs Cloud-based business models to gather data, analyze it, and sell it as a service?","opt stem after the successful completion of an activity?","options":["Trigger","Workflow","Constraints","Effect"],"answer":[3],"explanation":"Lecture 25 (Reference Architecture - Part 2): 'Effect is the state of the IIoT system after successful completion of an activity'.","verified":"lecture","c":1282},{"q":"Which functional domain in the IIRA functional viewpoint represents the set of functions responsible for the provisioning, deployment, and management of assets?","options":["Control domain","Operations domain","Information domain","Application domain"],"answer":[1],"explanation":"Lecture 25 (Reference Architecture - Part 2) lists the operations domain without detail; per IIRA the operations domain covers provisioning, deployment, management and monitoring of assets.","verified":"reasoning","c":1283},{"q":"An IIoT system architect is designing a framework that requires the semantic transformation of assembled data and the subsequent implementation of specific rules to realize a targeted business function. According to the IIRA Functional Viewpoint, which two domains are specifically responsible for handling these respective requirements?","options":["Information domain and Application domain","Operations domain and Business domain","Information domain and Business domain","Application domain and Control domain"],"answer":[0],"explanation":"Lecture 25 (Reference Architecture - Part 2): information domain does 'syntactic transformation, semantic transformation'; application domain 'implement the application logic ... logics and rules'.","verified":"lecture","c":1284},{"q":"Which of the following is NOT categorized as one of the fundamental activities in a business model?","options":["Production","Problem-solving","Platform management","Philanthropy"],"answer":[3],"explanation":"Lecture 22 (Business Models - Part 1): activities are 'production, problem solving, platform ... network'.","verified":"lecture","c":1285},{"q":"In the context of IIoT business models, what is The ability to return to its base resistance value"],"answer":[0],"explanation":"Lecture 27 (Key Enablers: Sensing - Part 2): selectivity definition.","verified":"lecture","c":1290},{"q":"What happens to the resistance of an n-type metal oxide semiconductor (MOS) gas sensor when it is exposed to a reducing gas?","options":["It remains unchanged","It increases","It decreases","It fluctuates randomly"],"answer":[2],"explanation":"Lecture 27 (Key Enablers: Sensing - Part 2): 'In n-type sensors the resistance decreases ... with respect to the baseline resistance when ... exposed to a target gas'.","verified":"lecture","c":1291,"rel":[["Jan-Apr 2025",6,0],["Jul-Oct 2025",6,1]]},{"q":"How many active connections or sockets does the ModBus-TCP protocol typically support at one time?","options":["Up to 5","Up to 10","Up to 64","Up to 254"],"answer":[1],"explanation":"Lecture 28 (Connectivity - Part 1): up to 10 active connections.","verified":"lecture","c":1292},{"q":"In EtherNet/IP, which primary type of communication is used to handle real-time I/O data through continuous message transfer?","options":["Implicit","Explicit","Acyclic","Asynchronous"],"answer":[0],"explanation":"Lecture 28 (Connectivity - Part 1): 'implicit handles real time input output data ... the message transfer is continuous'.","verified":"lecture","c":1293},{"q":"Time-Sensitive Networking (TSN) is an extension of Ethernet developed to enable deterministic communication. Which IEEE standard is it primarily based on?","options":["IEEE 802.15.4","IEEE 802.1Q","IEEE 802.1F","IEEE 802.1P"],"answer":[1],"explanation":"Lecture 28 (Connectivity - Part 1): TSN 'is built on top of IEEE 802.1Q'.","verified":"lecture","c":1294},{"q":"In a Profibus DP (Decentralized Peripherals) network, how many devices are supported at a single time without the use of repeaters?","options":["10","128","64","32"],"answer":[3],"explanation":"Lecture 29 (Connectivity - Part 2): Profibus DP 'supporting up to about 32 devices at a ti lowing is considered a primary disadvantage of millimeter-wave (mmWave) communication?","options":["It requires huge antenna element sizes","It utilizes the heavily congested GHz band","It suffers from high penetration loss and shadowing","It provides very low data throughput"],"answer":[2],"explanation":"Lecture 30 (Connectivity - Part 3): mmWave 'suffers from high penetration loss, and shadowing'.","verified":"lecture","c":1301}]},{"year":2026,"session":"Jul-Oct 2026","week":7,"source":"https://www.youtube.com/watch?v=hQxHZXG48YQ","questions":[{"q":"Which modulation technique is incorporated by LoRa technology?","options":["Frequency Shift Keying (FSK)","Phase Shift Keying (PSK)","Chirp Spread Spectrum (CSS)","Amplitude Shift Keying (ASK)"],"answer":[2],"explanation":"CSS (Lecture 31: Key Enablers of IIoT: Connectivity – Part 4 (LoRa/SIGFOX + NodeMCU demo)).","verified":"lecture","c":1302},{"q":"What is the maximum wireless throughput achieved by the SIGFOX network?","options":["Up to 100 bits per second","Up to 100 bytes per second","Up to 140 bits per second","Up to 1000 bits per second"],"answer":[0],"explanation":"'up to 100 bps' (Lecture 31: Key Enablers of IIoT: Connectivity – Part 4 (LoRa/SIGFOX + NodeMCU demo)).","verified":"lecture","c":1303},{"q":"Depending on the device variant, what is the typical communication range for a Zigbee network?","options":["1 to 5 meters","10 to 100 meters","500 to 1000 meters","1 to 10 kilometers"],"answer":[1],"explanation":"10 to 100 meters (Lecture 32: Key Enablers of IIoT: Connectivity – Part 5 (Zigbee/Xbee demo)).","verified":"lecture","c":1304},{"q":"In a Zigbee network, which device is specifically responsible for relaying information to other nodes and can also run small-scale applications?","options":["Coordinator","End device","Gateway","Router"],"answer":[3],"explanation":"Router relays information to other nodes (Lecture 32: Key Enablers of IIoT: Connectivity – Part 5 (Zigbee/Xbee demo)).","verified":"lecture"," p learning requires features to be explicitly mentioned by domain experts","Deep learning requires very low computational power"],"answer":[1],"explanation":"'Deep learning is an end-to-end learning which extracts features on its own' (Lecture 38: Machine Learning and Data Science – Part 2).","verified":"lecture","c":1322},{"q":"Which company utilizes Collaborative Distributed Deep Learning technology where the learning process is performed in the cloud while inference is conducted at the edge?","options":["Zebra Medical Vision","Intel","H2O","TOSHIBA"],"answer":[3],"explanation":"Toshiba's 'collaborative distributed deep learning ... learning process is performed in the cloud ... inferencing ... in the edge' (Lecture 38: Machine Learning and Data Science – Part 2).","verified":"lecture","c":1323},{"q":"Which of the following is an example of an industrial Software-as-a-Service (SaaS) application?","options":["Industrial Machinery Catalyst from Siemens","Microsoft Azure","GE Predix","Amazon Web Services (AWS)"],"answer":[0],"explanation":"'Industrial Machinery Catalyst ... developed by Siemens ... SaaS cloud for industrial use' (Lecture 39: Cloud Computing in IIoT – Part 1).","verified":"lecture","c":1324},{"q":"A cloud setup that is designed by combining two or more unique cloud infrastructures (public or private) to provide flexibility for data and application movement is called a:","options":["Public Cloud","Community Cloud","Hybrid Cloud","Private Cloud"],"answer":[2],"explanation":"Hybrid cloud: 'set up by two or more unique cloud setup providers ... both public and private' (Lecture 39: Cloud Computing in IIoT – Part 1).","verified":"lecture","c":1325},{"q":"Which industrial cloud platform utilizes \"Digital Twin Technology\" for learning, estimating, optimizing, and representing assets?","options":["Sentience (Honeywell)","GE Predix","Siemens MindSphere","Meshify"],"answer":[1],"explanation":"Predix 'has the support for Digital Twin ... learning, estimation, optimization and representation of different assets' (Lecture 39: Cloud Computing in IIoT – Part 1).","verified":"lecture","c":1326},{"q":"The C3 IoT platform provides a storage service for unstructured data known as the C3 Data Lake. In which format is this data primarily managed?","options":["XML format","RESTful format","Simple Object format","SQL Relational format"],"answer":[1],"explanation":"C3 Data Lake stores unstructured data 'in ... the RESTful architecture format' (Lecture 40: Cloud Computing in IIoT – Part 2).","verified":"lecture","c":1327},{"q":"Which of the following industrial IoT platforms specifically provides solutions like \"Now\" and \"Tracker\" for real-time asset tracking with geo-localized data?","options":["Uptake","C3 IoT","Meshify","Honeywell"],"answer":[2],"explanation":"Meshify components: Now (real-time asset tracking), Tracker, Enterprise (Lecture 40: Cloud Computing in IIoT – Part 2).","verified":"lecture","c":1328},{"q":"Which of the following is a crucial feature that an IIoT cloud platform provider should offer for effective device management?","options":["Device decommission","Physical hardware manufacturing","Manual data provisioning","Increasing network blind spots"],"answer":[0],"explanation":"Device management features include 'device decommissioning, commissioning, configuration, control' (Lecture 40: Cloud Computing in IIoT – Part 2).","verified":"lecture","c":1329},{"q":"According to Sturm et al., which of the following is one of the defined characteristics of a \"Meaningful SLA\" (Service Level Agreement)?","options":["Subjective","Uncontrollable","Quantifiable","Unachievable"],"answer":[2],"explanation":"Meaningful SLA traits include quantifiable (Lecture 40: Cloud Computing in IIoT – Part 2).","verified":"lecture","c":1330},{"q":"How does Fog Computing primarily address the limitations of a purely centralized cloud-based approach in IIoT?","options":["By identifying useful data and reducing the amount of raw data sent to the cloud","By completely replacing the cloud infrastructure","By increasing the latency of time-sensitive data","By restricting the mobility of edge devices"],"answer":[0],"explanation":"Fog does 'meaningful processing of some raw data, before it is actually sent to the cloud' (filtering, aggregation) (Lecture 40: Cloud Computing in IIoT – Part 2, Lecture 41: Fog Computing in IIoT).","verified":"lecture","c":1331}]},{"year":2026,"session":"Jul-Oct 2026","week":9,"source":"https://www.youtube.com/watch?v=FETiQu0VAyc","questions":[{"q":"How does fog computing prevent unnecessary noisy big data from crowding the cloud?","options":["By storing all raw data permanently in the cloud","By performing prior filtration at the edge","By disabling real-time control algorithms","By increasing the frequency of sensor transmission"],"answer":[1],"explanation":"Lecture 41 (Fog Computing in IIoT): filtration done at the fog prevents unnecessary noisy data reaching the cloud.","verified":"lecture","c":1332},{"q":"Which capability is provided by the fog-based industrial platform?","options":["Merging real-time and non-real-time workloads","Restricting the platform to non-real-time workloads","Transmitting all sensor data without processing","Eliminating control of IoT endpoints"],"answer":[0],"explanation":"Fog platforms (e.g., Nebbiolo fogOS) consolidate real-time and non-real-time workloads on one platform; other options are negations.","verified":"reasoning","c":1333},{"q":"Which fog-platform provider offers an edge-node software solution that supports any protocol, any PLC, and any hardware?","options":["FogHorn","Sonm","Crosser","Nebbiolo Technologies"],"answer":[2],"explanation":"Lecture 41 (Fog Computing in IIoT): 'Crosser is an edge node software solution ... runs on ... PLCs, end devices, computer hardware ... supports ... different types of protocols'.","verified":"lecture","c":1334},{"q":"What is the purpose of the %in% special operator in R?","options":["To create a series of numbers for a vector","To check whether an element belongs to a vector","To perform integer division","To assign a value globally"],"answer":[1],"explanation":"Lecture 42 (Tutorial for R & Julia): '%in% will help to check an element belonging to a vector or not'.","verified":"lecture","c":1335},{"q":"Which validation method is used in the demonstrated R machine-learning execution process to estimate model accuracy?","options":["Two-fold cross-validation","Leave-one-out validation","Ten-fold cross-validation","Validation without data partitioning"],"answer":[2],"explanation":"Lecture 42 (Tutorial for R & Julia): 'trainControl(method = cv, number = 10) ... 10-fold cross validation for estimation of accuracy'.","verified":"lecture","c":1336},{"q":"Which Julia function is used to create a dictionary?","options":["Tuple()","Array()","Dictn()","Dict()"],"answer":[3],"explanation":"Lecture 42 (Tutorial for R & Julia): 'to create a dictionary ... my phonebook equal to Dict(...)'.","verified":"lecture","c":1337},{"q":"During data preprocessing, which operation eliminates repeated data through detection, filtering, and compression?","options":["Data integration","Data cleaning","Redundancy mitigation","Data visualization"],"answer":[2],"explanation":"Lecture 43 (Data Management with Hadoop): 'mitigating the redundancies such as eliminating data repetition through detection, filtering, compression'.","verified":"lecture","c":1338},{"q":"Which Hadoop component assigns CPU, memory, and storage resources to applications running on a Hadoop cluster?","options":["Hadoop Common","Hadoop Distributed File System","MapReduce","Yet Another Resource Negotiator"],"answer":[3],"explanation":"Lecture 43 (Data Management with Hadoop): 'YARN ... assigns CPU, memory, storage to different applications running on the Hadoop cluster'.","verified":"lecture","c":1339},{"q":"Which of the following is listed as an application of integrating MongoDB with Hadoop?","options":["Batch aggregation","Physical network cabling","Sensor manufacturing","Firewall configuration"],"answer":[0],"explanation":"Lecture 43 (Data Management with Hadoop): MongoDB with Hadoop supports 'batch aggregation, data warehousing and ETL'.","verified":"lecture","c":1340},{"q":"Which source-routing protocol is used by the BCube data-center network topology?","options":["Border Gateway Protocol","BCube Source Routing","Open Shortest Path First","Spanning Tree Protocol"],"answer":[1],"explanation":"Lecture 44 (Data Center Networks): 'BSR the B cube source routing protocol'.","verified":"lecture","c":1341},{"q":"Why may an IIoT-based data center require an increase in inbound network bandwidth?","options":["IIoT devices generate a bulk amount of small messages containing sensor data","IIoT completely removes the need for data transmission","Sensor data is transmitted only once during deployment","Industrial devices communicate exclusively with one another without a data center"],"answer":[0],"explanation":"Lecture 44 (Data Center Networks) discusses IIoT-DCN bandwidth requirements; IIoT devices send huge numbers of small sensor messages, increasing inbound bandwidth needs. Other options are absurd.","verified":"reasoning","c":1342},{"q":"Which of the following is an advantage of a Software-Defined Data Centre?","options":["Static workload management","Permanent coupling of software with hardware","Programmable infrastructure and workload management","Elimination of network virtualization"],"answer":[2],"explanation":"Lecture 44 (Data Center Networks): SDDC separates control/data planes for centralized, elastic, dynamic workload management.","verified":"lecture","c":1343},{"q":"When an SDN forwarding device has insufficient rule capacity, how can two existing flow rules be converted into a single rule?","options":["By applying wildcard-based rule combination","By disconnecting the SDN controller","By disabling the forwarding device","By changing TCP into UDP"],"answer":[0],"explanation":"Lecture 45 (SDN in IIoT Part 1): 'using some wild card ... S-10.0.0.* which will match both' to combine rules when TCAM is full.","verified":"lecture","c":1344},{"q":"How can SDN meet the dynamically changing forwarding requirements of IIoT sensor data?","options":["By assigning the same priority to every type of data permanently","By using rule-based forwarding policies","By preventing the controller from updating forwarding rules","By transmitting data without considering the real-time situation"],"answer":[1],"explanation":"Lecture 45 (SDN in IIoT Part 1): 'rule based forwarding policies in SDN would be able to meet the dynamic change in the requirements of IIoT'.","verified":"lecture","c":1345},{"q":"Which statement best describes Software-Defined Automation?","options":["It uses only manually controlled physical equipment","It eliminates real-time control from industrial systems","It uses a virtualized platform for dynamic, real-time system control","It restricts control operations to sensors at Level 0"],"answer":[2],"explanation":"Lecture 45 (SDN in IIoT Part 1): software-defined automation uses virtualized controllers/PLCs/SCADA/HMI instances for dynamic control.","verified":"lecture","c":1346}]},{"year":2026,"session":"Jul-Oct 2026","week":10,"source":"https://www.youtube.com/watch?v=YqMFUtaSyUk","questions":[{"q":"In Software-Defined 6TiSCH, at which layer is the slicing mechanism proposed to isolate SDN control overhead?","options":["Physical Layer","Layer 2","Transport Layer","Application Layer"],"answer":[1],"explanation":"Lecture 46 (SDN in IIoT Part 2) slicing mechanism for control overhead; cited work uses layer-2 slicing in 6TiSCH.","verified":"reasoning","c":1347},{"q":"In the adaptive transmission architecture for Software-Defined Edge Computing in IIoT, data streams are divided into which two categories?","options":["Local and global data streams","Secure and insecure data streams","Ordinary and emergent data streams","Wired and wireless data streams"],"answer":[2],"explanation":"SD-edge adaptive transmission architecture (lecture slide) divides streams into ordinary and emergent data streams.","verified":"reasoning","c":1348},{"q":"According to the challenges and opportunities of Software-Defined IIoT, fog nodes/access devices play an important role in providing which type of service?","options":["Delay-constrained emergent services","Long-term archival services","Offline batch-processing services","Manual configuration services"],"answer":[0],"explanation":"Fog/access devices near the edge serve delay-constrained emergent services (SDIIoT challenges slide); other options contradict low-latency role.","verified":"reasoning","c":1349},{"q":"In a trustworthy IIoT system, which property refers to the ability of the system to function correctly under dynamic adversarial conditions?","options":["Privacy","Reliability","Safety","Resilience"],"answer":[3],"explanation":"Lecture 47 (Security in IIoT Part 1): resilience = function correctly under dynamic adversarial conditions.","verified":"lecture","c":1350},{"q":"In the STRIDE threat model, what does the letter \"E\" represent?","options":["Encryption","Elevation of privilege","Exposure of information","Endpoint security"],"answer":[1],"explanation":"Lecture 47 (Security in IIoT Part 1): 'elevation of privilege'.","verified":"lecture","c":1351},{"q":"Which participant in the IIoT trust flow is responsible for designing a cost-efficient trustworthy system. definina trust reauirements for components. and conductina tests and certifications?","options":["System Owner","End User","System Builder","Cloud Service Provider"],"answer":[2],"explanation":"Lecture 47 (Security in IIoT Part 1): 'system builder who is more concerned about building a cost efficient trust worthy system. The trust requirements for every component ... timely trust verification'.","verified":"lecture","c":1352},{"q":"Which of the following is suggested as a solution for protecting resource-constrained IIoT end devices?","options":["Lightweight symmetric key cryptography","Increasing the size of every transmitted packet","Disabling device authentication","Storing all security operations only in the cloud"],"answer":[0],"explanation":"Lecture 48 (Security in IIoT Part 2): 'lightweight symmetric key cryptographic mechanisms should be used'.","verified":"lecture","c":1353},{"q":"Which three states of data are considered under data protection in IIoT?","options":["Data-at-source, Data-at-cloud, and Data-at-edge","Data-at-Rest, Data-in-Use, and Data-in-Transit","Structured, Semi-structured, and Unstructured data","Sensor data, Control data, and Application data"],"answer":[1],"explanation":"Lecture 48 (Security in IIoT Part 2): 'data in use ... data in transit ... data at rest'.","verified":"lecture","c":1354},{"q":"Which standard listed under OT security provides guidance for security in Industrial Control Systems?","options":["ISO 27017","NIST SP 800-82","ISO/IEC 154083","NIST SP 800-144"],"answer":[1],"explanation":"Lecture 48 (Security in IIoT Part 2): OT standards incl. IEC 62443 and NIST; NIST SP 800-82 is the Guide to ICS security, whereas ISO 27017/SP 800-144 are cloud and ISO/IEC 15408 is IT.","verified":"reasoning","c":1355},{"q":"Which of the following is NOT one of the five layers of Hitachi's Lumada IoT platform?","options":["Edge","Core","Analytics","Transport"],"answer":[3],"explanation":"Lecture 49 (Factories and Assembly Line): Lumada 'comprising of 5 layers, ... edge, core, analytics, studio and foundry'.","verified":"lecture","c":1356},{"q":"In the North Star BlueScope Steel smart-factory application, sensors are used to detect which environmental hazards?","options":["Radiation and toxic gases","Network congestion and packet loss","Inventory shortages and production delays","Voltage fluctuations and cloud failures"],"answer":[0],"explanation":"Lecture 49 (Factories and Assembly Line): North Star BlueScope - 'whether there is any radiation ... or ... toxic gases'.","verified":"lecture","c":1357},{"q":"What technology does SmartLabel use to provide product-related information such as ingredients, allergens, and nutritional value to consumers?","options":["RFID tag","Bluetooth beacon","QR code","GPS receiver"],"answer":[2],"explanation":"Lecture 50 (Food Industry): SmartLabel uses QR codes.","verified":"lecture","c":1358},{"q":"In the Intellicup smart beverage-vending solution, what is integrated at the base of the IoT-enabled cup?","options":["GPS module","NFC chip","Temperature sensor","Wi-Fi router"],"answer":[1],"explanation":"Lecture 50 (Food Industry): Intellicup cups 'have NFC integrated chips at the base of the cup'.","verified":"lecture","c":1359},{"q":"Which characteristic of a smart factory allows process parameters such as machine configuration, material flow, and temperature control to be optimally adjusted?","options":["Flexibility","Isolation","Centralization","Redundancy"],"answer":[0],"explanation":"Lecture 49 (Factories and Assembly Line): smart factory flexibility/agility; flexibility is the only valid option.","verified":"lecture","c":1360},{"q":"Which network-security mechanism acts as a fence between a trusted internal network and an unauthorized external network and uses a set of rules to allow or block traffic?","options":["Hypervisor","Firewall","Load balancer","Data logger"],"answer":[1],"explanation":"Lecture 48 (Security in IIoT Part 2) lists firewalls for communication protection; a firewall filters traffic between trusted and untrusted networks by rules.","verified":"reasoning","c":1361}]},{"year":2026,"session":"Jul-Oct 2026","week":11,"source":"https://www.youtube.com/watch?v=nnq3mxhdvwQ","questions":[{"q":"What is the correct sequence of stages presented in the IIoT healthcare architecture?","options":["Sensing → Processing → Sending → Learning → Storing","Sensing → Sending → Processing → Storing → Learning","Sending → Sensing → Storing → Processing → Learning","Sensing → Learning → Processing → Sending → Storing"],"answer":[1],"explanation":"L51 'IIoT Applications: Healthcare' slide 'IIoT Healthcare Architecture': Sensing, Sending, Processing, Storing, Learning (bottom to top).","verified":"lecture","c":1362},{"q":"Which parameters are used by the ADAMM Intelligent Asthma Monitoring device to predict pre-symptoms of an asthma attack?","options":["Blood pressure, glucose level, and oxygen saturation","Body temperature, cough rate, and heart rate","Weight, respiration rate, and blood pressure","Skin temperature, blood glucose, and pulse pressure"],"answer":[1],"explanation":"L51 'IIoT Applications: Healthcare' slide: ADAMM 'From the body temperature, cough rate, heart rate, it predicts pre symptoms of asthma attack.'","verified":"lecture","c":1363},{"q":"Which of the following is identified as a challenge in IIoT-based healthcare systems?","options":["Unlimited computational capability of devices","Excessive on-device memory","Designing scalable algorithms without compromising security","Absence of mobile healthcare devices"],"answer":[2],"explanation":"L51 'IIoT Applications: Healthcare' slide 'IoT Healthcare Challenges': 'Designing scalable algorithm without compromising security is challenge.'","verified":"lecture","c":1364},{"q":"In the IIoT maturity model for power plants, which stage immediately follows optimization?","options":["Monitor","Control","Autonomy","Device autonomy"],"answer":[2],"explanation":"L52 'IIoT Applications: Power Plants' maturity model: Monitor -> Control -> Optimization -> Autonomy.","verified":"lecture","c":1365},{"q":"Which communication technologies are associated with a Field Area Network in the power-plant communication network?","options":["Zigbee and 6LoWPAN only","WiMAX, 3G, and 4G for wireless communication and Ethernet for wired communication","Bluetooth and NFC only","RFID and LoRa only"],"answer":[1],"explanation":"L52 'IIoT Applications: Power Plants' slide: Field area network 'Wireless: WiMAX, 3G, 4G. Wired: Ethernet.'","verified":"lecture","c":1366},{"q":"In Advanced Metering Infrastructure (AMI), which component analyzes the data collected from smart meters?","options":["Meter data acquisition system","Communication network","Meter data management system","Smart meter"],"answer":[2],"explanation":"L52 'IIoT Applications: Power Plants': MDMS 'helps in analyzing the data that are collected from these smart meters' (MDAS gathers).","verified":"lecture","c":1367},{"q":"Which of the following is a function of inventory management?","options":["Increasing the probability of stock-outs","Protection against stock-outs","Eliminating all order cycles","Increasing production interruptions"],"answer":[1],"explanation":"L53 'Inventory Management & Quality Control' functions include 'protecting against stock outs'.","verified":"lecture","c":1368},{"q":"Which statement correctly describes a semi-passive RFID tag?","options":["It has no battery and obtains all power from the RFID reader","It has an onboard battery and an active transmitter","It has an onboard battery to power the IC but does not have an active transmitter","It continuously broadcasts information as a beacon"],"answer":[2],"explanation":"L53 'Inventory Management & Quality Control': semi-passive tags have an onboard battery to power the IC and no active transmitter.","verified":"lecture","c":1369},{"q":"Which of the following information is included under \"comprehensive visibility\" provided by RFIDbased inventory management?","options":["Inventory levels, expiration dates, item location, and forecast demand","Employee passwords, salaries, and attendance","Network IP addresses and routing tables only","Machine source code and operating-system files"],"answer":[0],"explanation":"L53 'Inventory Management & Quality Control': 'comprehensive visibility: inventory levels, expiration dates, item locations, demand forecasting'.","verified":"lecture","c":1370},{"q":"In software security, how is availability defi
