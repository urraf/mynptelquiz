s model?","options":["Value proposition, revenue streams, technologies","Smart engineering, smart homes, accuracy","Smart homes, innovation, value proposition","Innovation, revenue"],"answer":[0],"explanation":"Lecture 09 (Smart and Connected Business Perspective): key attributes: value proposition, revenue streams, technologies.","verified":"lecture","c":370,"rel":[["Jan-Apr 2025",2,0],["Jul-Oct 2025",2,0],["Jul-Oct 2026",2,0]]},{"q":"What is/are the function(s) of digital layer in the smart business model?","options":["Stores the data","Analyzes the data","Processes the data","All of the above"],"answer":[3],"explanation":"Lecture 09 (Smart and Connected Business Perspective): 'Digital layers talks about storing the data analyzing the data processing the data'.","verified":"lecture","c":371},{"q":"Which of the following is not a component of smart factory?","options":["Smart devices","Automation","High energy consumption","All of the above"],"answer":[2],"explanation":"Lecture 10 (Smart Factories): smart devices and automation are part of smart factories; high energy consumption is not (smart grid reduces it).","verified":"lecture","c":372,"rel":[["Jan-Apr 2023",2,0],["Jan-Apr 2025",2,0],["Jul-Oct 2026",2,0]]}]},{"year":2022,"session":"Jul-Oct 2022","week":3,"source":"Official NPTEL noc22_cs95 question images (pattern https://storage.googleapis.com/swayam-node1-production.appspot.com/assets/img/noc22_cs95/w3a3q1.png ... q15); answers by domain knowledge; cross-checked with https://progiez.com/nptel-introduction-to-industry-4-assignment-3-answers (JUL-DEC 2022 section)","questions":[{"q":"What is the difference between a Cyber-Physical System (CPS) and an embedded system?","options":["CPS is confined to one system, while embedded system is a networked set of multiple CPSs","Embedded system is confined to one system, while CPS is a networked set of multiple embedded systems","Both a and b","None of the above"],"answer":[1],"explanation":"L11: embedded system confined to a single device; CPS is a networked set of embedded systems.","verified":"lecture","c":373},{"q":"“Cyber-Physical systems are equipped with control systems with feedback loop”. Is the statement true or false?","options":["True","False"],"answer":[0],"explanation":"L11: CPS 'have some kind of a control system in them ... with certain feedback loop'.","verified":"lecture","c":374},{"q":"What is cognition in CPS architecture for IIoT?","options":["Conversion of machine data to meaningful information","Supervisory control to determine actions to be taken by the machines","Both a and b","Proper presentation of information to users for generating thorough knowledge of the system"],"answer":[3],"explanation":"L11: 'cognition ... proper presentation of information to users for generating thorough knowledge of the system'.","verified":"lecture","c":375},{"q":"“Sensors with small memory and standardized physical connection to enable the communication with processor and data network”. Select the option which refers to this statement.","options":["Smart sensor","DHT sensor","LED sensor","ESP32"],"answer":[0],"explanation":"L19: 'smart sensors are the ones which have some small memory and standardized physical connection ... as per the IEEE 1451 standard'.","verified":"lecture","c":376},{"q":"What are the advantages of intelligent sensors?","options":["Reduce data communication","Application-specific customization of sensor nodes","Continuous calibrating and monitoring of the sensors","All of the above"],"answer":[3],"explanation":"L11: intelligent sensors give 'reduced data communication ... continuous calibration and monitoring' and can customize embedded algorithms on the fly.","verified":"lecture","c":377},{"q":"Which of the following statements is/are true about Collaboration platform?","options":["Category of business software which combines organizational networking capacities to operations.","It does not include knowledge management into business operation to encourage","Collaboration platform restricts employees to share information","All of the above"],"answer":[0],"explanation":"L12: collaboration platforms combine the social/networking layer with business operations and include knowledge management; B and C contradict the lecture.","verified":"reasoning","c":378},{"q":"How many key parts are there which enable collaborative productivity in Industry 4.0?","options":["5","4","7","9"],"answer":[1],"explanation":"L12: four key parts: IT proliferation, single source of truth, industrialization, coordination.","verified":"lecture","c":379},{"q":"In context of Industry 4.0, what does PLM stand for?","options":["Product Life Management","Product Lifecycle Management","Both (a) and (b)","None of the above"],"answer":[1],"explanation":"L12: PLM = Product Lifecycle Management.","verified":"lecture","c":380,"rel":[["Jan-Apr 2024",3,0]]},{"q":"How many phases are there in a product lifecycle?","options":["6","9","5","3"],"answer":[2],"explanation":"L12: five phases of the product lifecycle.","verified":"lecture","c":381},{"q":"Which of the following is/are features of smart factory?","options":["Connected Environment","Transparency of process status","Both a and b","None of the above"],"answer":[2],"explanation":"L10 Smart Factories: connected devices and 'transparency is also promoted in a smart factory'.","verified":"lecture","c":382},{"q":"Which of the following is not a type of augmented reality?","options":["Marker-based AR","Markerless AR","Superimposition-based AR","Timer-based AR"],"answer":[3],"explanation":"L13: types are marker-based, markerless, projection-based, superimposition-based; no timer-based.","verified":"lecture","c":383},{"q":"“Semi-immersive simulations provide a partial or fully immersive experience of the user’s senses.” True or False?","options":["True","False"],"answer":[0],"explanation":"Corrected after checking the lecture (was: False). L13 AR/VR: 'Semi-immersive ... partially or fully-immersive experience is gathered by the users'. The statement copies the lecture, so it is True.","verified":"lecture","c":384},{"q":"“Machine learning is a subset of deep learning which can learn automatically by finding the features of the object by own.” True or False?","options":["True","False"],"answer":[1],"explanation":"L14: 'Deep learning ... is a subset of machine learning, which can learn automatically by finding the features'. The statement reverses this.","verified":"lecture","c":385},{"q":"What is velocity in Big Data?","options":["Speed of generation of data","Categories of data","Data with constantly changing meaning","All of the above"],"answer":[0],"explanation":"L15: 'Velocity, speed of generation'.","verified":"lecture","c":386},{"q":"Select the types of analytics for big data?","options":["Descriptive","Prescriptive","Predictive","All of the above"],"answer":[3],"explanation":"L15: 'prescriptive analytics, predictive analytics, and descriptive analytics'.","verified":"lecture","c":387}]},{"year":2022,"session":"Jul-Oct 2022","week":4,"source":"Official NPTEL noc22_cs95 question images (pattern https://storage.googleapis.com/swayam-node1-production.appspot.com/assets/img/noc22_cs95/w4a4q1.png ... q15); answers by domain knowledge; cross-checked with https://progiez.com/nptel-introduction-to-industry-4-assignment-4-answers (JUL-DEC 2022 section)","questions":[{"q":"What is Cybersecurity?","options":["Protection of internet-connected systems from cyber-attacks","Protection of factories systems from the government is known as cybersecurity.","Protection of laborers in the work environment is known as cybersecurity.","None of the above"],"answer":[0],"explanation":"L16: cybersecurity protects internet-connected cyber infrastructure against attacks.","verified":"lecture","c":388},{"q":"Which of the following is not a component of cybersecurity?","options":["Application Security","Network Security","Both a and b","None of the above"],"answer":[3],"explanation":"L16: components are 'application security, information security ..., network security, operational security, and end-user education'. Both A and B are components.","verified":"lecture","c":389},{"q":"Trojan Horse is a type of _______","options":["Ransom-ware","Hardware","Malware","All of the above"],"answer":[2],"explanation":"L16: malware includes 'computer viruses, spyware ... like Trojan Horse'.","verified":"lecture","c":390},{"q":"What is the aim of phishing?","options":["It enables industrial intelligent actions to use advanced data analytic tools for gettable business results","To get critical data, such as login information or credit card information.","Both a and b","None of the above"],"answer":[1],"explanation":"L16: phishing aims 'to get critical data such as login information or credit card information'.","verified":"lecture","c":391},{"q":"“Cyber-attack recognition systems deal with an extensive volume of big dimensional data along with uniform advancing attack features.” True or false?","options":["True","False"],"answer":[0],"explanation":"L16 introduces cyber-attack detection systems without this sentence; the statement paraphrases the course textbook's description of attack-recognition systems, and keys give True.","verified":"reasoning","c":392},{"q":"what is/are the benefit(s) of IIoT?","options":["Improves productivity","Enables remote diagnosis","Reduces operation time","All of the above"],"answer":[3],"explanation":"L17: benefits include 'improving productivity ... reducing operation time' and 'remote diagnosis'.","verified":"lecture","c":393},{"q":"What is SDCMA?","options":["Software-Defined Cyber Manufacturing Architecture","Sensor-Defined Cloud Management Architecture","Sensor-Defined Cloud Management Architecture","Software-Defined Cloud Manufacturing Architecture"],"answer":[3],"explanation":"L16: Software Defined Cloud Manufacturing Architecture.","verified":"lecture","c":394,"rel":[["Jan-Apr 2023",4,0]]},{"q":"Which of the following is not a challenge in deployment of IIoT?","options":["Cyber security","Legacy installations","Lack of skills","Advanced IT technologies"],"answer":[3],"explanation":"L17 challenges: data integration, cyber security, lack of standardization, legacy installations, lack of skills. Advanced IT is not a challenge.","verified":"lecture","c":395,"rel":[["Jul-Oct 2024",4,0],["Jul-Oct 2026",4,0]]},{"q":"What are the key elements in the Industrial Internet?","options":["Intelligent machines, Advanced analytics, People at work","Intelligent people, Advanced machines, Internet at work","Sensors, Actuators, communication protocols","None of the above"],"answer":[0],"explanation":"L18: intelligent machines, advanced analytics, people at work.","verified":"lecture","c":396,"rel":[["Jan-Apr 2024",4,0],["Jul-Oct 2024",4,0],["Jan-Apr 2025",4,0],["Jul-Oct 2025",4,0]]},{"q":"Industrial internet can benefit the commercial aviation industry by ________.","options":["Improving airlines operations","Improving asset management","Both a and b","None of the above"],"answer":[2],"explanation":"L18: 'improving both airline operations and asset management'.","verified":"lecture","c":397},{"q":"What does “self-decision making” mean in terms of smart sensor function?","options":["Sensing multiple parameters at a single sensor node","Communicating vital information like measured, calibration and compensation data to the Central control unit","Actuator","Self-monitor its operation and changes in the ambience by taking proper decision for required compensation by itself or by alerting human for required action"],"answer":[3],"explanation":"L19: self-decision making: 'it can self-monitor and based on the ambient conditions it can make certain decisions on its own'.","verified":"lecture","c":398},{"q":"What is SCADA?","options":["Software Control and Data Acquisition","Supervisory Communication and Data Acquisition","Supervisory Control and Data Acquisition","Software for Communication and Data Acquisition"],"answer":[2],"explanation":"L19: 'SCADA basically stands for Supervisory Control and Data Acquisition'.","verified":"lecture","c":399},{"q":"____________ combine the advantages of Electric and Pneumatic actuators.","options":["Cyber security systems","Electro-hydrostatic actuation systems","Both a and b","Electro-pneumatic systems"],"answer":[3],"explanation":"L19: 'electro-pneumatic systems ... have the combined advantages of the electric actuators and the pneumatic actuator'.","verified":"lecture","c":400},{"q":"What is/are the benefit(s) of operation efficiency in Industrial Process 4.0?","options":["Improved resource utilization","Increased productivity","Cost reduction","All of the above"],"answer":[3],"explanation":"L20: operational efficiency gives 'improved resource utilization ... increased productivity ... and cost reduction'.","verified":"lecture","c":401},{"q":"Which of the following is/are not part of the operational domain of Industrial Process?","options":["Management","Deployment","Both a and b","Transportation"],"answer":[3],"explanation":"L20: operational domain includes 'control domain, the management, deployment, monitoring and diagnostics, operations, and optimization'. Transportation is not part.","verified":"lecture","c":402}]},{"year":2022,"session":"Jul-Oct 2022","week":5,"source":"Official NPTEL noc22_cs95 question images (pattern https://storage.googleapis.com/swayam-node1-production.appspot.com/assets/img/noc22_cs95/w5a5q1.png ... q15); answers by domain knowledge; cross-checked with https://progiez.com/nptel-introduction-to-industry-4-assignment-5-answers (JUL-DEC 2022 section)","questions":[{"q":"The different sectors of Industry 4.0 includes ______________.","options":["Smart robotics","Intelligent Manufacturing","Both (a) and (b)","None of the above"],"answer":[2],"explanation":"Lecture 21 (Industrial Processes - Part 2): sectors include smart robotics and intelligent manufacturing.","verified":"lecture","c":403},{"q":"The caterpillar denotes ____________.","options":["Smart view using IoT and Augmented Reality (AR)","Real time machine status and condition monitoring","Long term data analytic to predict future failures and budget","All of the above"],"answer":[3],"explanation":"Lecture 21 (Industrial Processes - Part 2): Caterpillar - IoT + AR smart view, 'real-time machine status ... condition', data used 'to predict future failures, and if there is any budget issue'.","verified":"lecture","c":404},{"q":"Which of the following does John Deere facilitate?","options":["Precision agriculture","Traffic navigation system","Drone-based package delivery","None of the above"],"answer":[0],"explanation":"Lecture 21 (Industrial Processes - Part 2): John Deere machinery 'can be used for precision agriculture'.","verified":"lecture","c":405},{"q":"Which of the following are the primary components of a generic business model?","options":["Revenue generation and Margins","Relationship with customers","Essential Resources","All of the above"],"answer":[0],"explanation":"Corrected after checking the lecture (was: All of the above). Lecture 22 (Business Models - Part 1): building blocks are market segment, value chain structure, value proposition, revenue generation and margins, position in value network, competitive strategy (Chesbrough-Rosenbloom). Customer relationships/resources are not listed; progiez key also gives (a).","verified":"lecture","c":406},{"q":"The Kaeser Kompressoren is ________.","options":["Air-as-a-Service","Platform-as-a-Service","Infrastructure-as-a-Service","Software-as-a-Service"],"answer":[0],"explanation":"Lecture 21 (Industrial Processes - Part 2): Kaeser Kompressoren - 'air-as-a-service ... users are able to pay per cubic meter of air'.","verified":"lecture","c":407},{"q":"Gehring: Connected Manufacturing denotes __________.","options":["Internet-connected sensor-equipped machinery enables real-time data streaming","Cloud-based analytics to reduce production downtime","Cloud-based analytics to increase productivity","All of the above"],"answer":[3],"explanation":"Lecture 21 (Industrial Processes - Part 2) says Gehring's internet-connected, sensor-equipped machinery streams data in real time; the slide/progiez key gives 'All of the above' (Gehring uses cloud analytics).","verified":"lecture","c":408},{"q":"Which of the following are included in the building blocks of a business model of IIoT?","options":["Cost","Revenue","Both (a) and (b)","None of the above"],"answer":[2],"explanation":"Lecture 23 (Business Models - Part 2): each IIoT business model has a 'cost structure' and a 'revenue model' block.","verified":"lecture","c":409},{"q":"The advantages of IoT-as-a-Service are __________.","options":["Reduced licensing costs","Increased revenue from planned upgrades","Better customer relations","All of the above"],"answer":[3],"explanation":"Lecture 22 (Business Models - Part 1): IoTaaS advantages: 'reduced licensing costs, increased revenue from planned upgrades ... improved customer relations'.","verified":"lecture","c":410},{"q":"The challenges of IoT-as-a-Service is/are __________.","options":["Product compatibility","Maintaining data accuracy","Both (a) and (b)","None of the above"],"answer":[2],"explanation":"Lecture 22 (Business Models - Part 1): IoTaaS challenges: 'product compatibility, maintaining data accuracy, security of data'.","verified":"lecture","c":411},{"q":"Key performance indicators for OSH is __________.","options":["a measure of the activities of an organization","Connect/communicate with customer","Drive towards improvement","All of the above"],"answer":[3],"explanation":"Lecture 24 (Reference Architecture - Part 1): OSH KPIs 'are basically a measure of the activities of an organization ... connectivity and communication with customers ... driving towards further improvement'.","verified":"lecture","c":412},{"q":"The edge layer of IIRA includes __________.","options":["Gathers data from the edge nodes","Breadth of distribution","Governance","All of the above"],"answer":[3],"explanation":"Lecture 24 (Reference Architecture - Part 1): edge layer 'gathers data from the edge nodes ... includes the breadth of distribution, governance, and location of the data'.","verified":"lecture","c":413},{"q":"The gateway devices of IIRA act as __________.","options":["Management point for the edge devices locally","Local connectivity among the devices","Data transfer, processing and analytics","All of the above"],"answer":[3],"explanation":"Lecture 24 (Reference Architecture - Part 1): gateway devices act 'as the management points for the edge devices locally', with local LAN connectivity, data transfer, processing and analysis.","verified":"lecture","c":414},{"q":"The elements of an activity in the usage viewpoint includes __________.","options":["Trigger","Control domain","Information domain","Application domain"],"answer":[0],"explanation":"Lecture 25 (Reference Architecture - Part 2): activity elements are trigger, workflow, effects and constraints.","verified":"lecture","c":415},{"q":"In IIRA framework stakeholders are __________.","options":["Individual, team or organizations having interest concerning to a system","Interest in the viewpoint and system","Both (a) and (b)","None of the above"],"answer":[2],"explanation":"Lecture 24 (Reference Architecture - Part 1): stakeholders are 'individuals teams or organizations having interest concerning the system ... have some interest in the viewpoints and the system'.","verified":"lecture","c":416},{"q":"The full form of IIC is __________.","options":["Industrial Internet Consortium","Intranet Internet Consortium","Integrated Internet Consortium","Intermediate Internet Consortium"],"answer":[0],"explanation":"Lecture 24 (Reference Architecture - Part 1): IIC = Industrial Internet Consortium.","verified":"lecture","c":417}]},{"year":2022,"session":"Jul-Oct 2022","week":6,"source":"Official NPTEL noc22_cs95 question images (pattern https://storage.googleapis.com/swayam-node1-production.appspot.com/assets/img/noc22_cs95/w6a6q1.png ... q15); answers by domain knowledge","questions":[{"q":"What are the benefits of sensor usage in Industry?","options":["Real-time monitoring","Operational efficiency","Both of the above","None of the above"],"answer":[2],"explanation":"Lecture 26 (Key Enablers: Sensing - Part 1): benefits: real-time monitoring and operational efficiency.","verified":"lecture","c":418},{"q":"The output voltage of LM35 is ____________.","options":["Linearly proportional to Celsius","Linearly proportional to Fahrenheit","Inversely proportional to Celsius","Inversely proportional to Fahrenheit"],"answer":[0],"explanation":"Lecture 26 (Key Enablers: Sensing - Part 1): LM35 output 'linearly proportional to the Celsius temperature'.","verified":"lecture","c":419},{"q":"The temperature sensor DS1621 is ____________.","options":["Digital Sensor","Analog Sensor","10 bits temperature sensor","None of the above"],"answer":[0],"explanation":"Lecture 26 (Key Enablers: Sensing - Part 1): DS1621 is a digital temperature sensor (9-bit).","verified":"lecture","c":420},{"q":"Which of the following is/are not referred to as the electrical variations of gas sensing methods?","options":["Polymer","Gas chromatograph","CNT or carbon nanotube","MOS or Metal Oxide Semiconductors"],"answer":[1],"explanation":"Lecture 27 (Key Enablers: Sensing - Part 2): electrical variants are moisture-absorbing, CNT, polymer and MOS; chromatographic method is not.","verified":"lecture","c":421},{"q":"What does VOC stand for?","options":["Volatile Organic Compound","Volatile Organic Communication","Variable Organic Communication","Volatile Ontological Compound"],"answer":[0],"explanation":"Lecture 27 (Key Enablers: Sensing - Part 2): sensor detects 'volatile organic compounds'.","verified":"lecture","c":422},{"q":"The operating voltage of temperature sensor DS1621 is ____________.","options":["2.7 to 5 Volt","1.7 to 5 Volt","3.7 to 5 Volt","2.5 to 5 Volt"],"answer":[0],"explanation":"Lecture 26 (Key Enablers: Sensing - Part 1): DS1621 'operates in the range 2.7 to 5.5 volts'; closest option is 2.7 to 5 V.","verified":"lecture","c":423},{"q":"An accelerometer is a type of ____________ sensor.","options":["Electrical","Electromechanical","Electrochemical","Hydraulic"],"answer":[1],"explanation":"An accelerometer (e.g., MEMS ADXL335) is an electromechanical sensor.","verified":"reasoning","c":424},{"q":"The torque sensor ____________.","options":["Measures rotating torque","Used to measure the speed of rotation","Measures different variables such as speed, water level, and gas/water flow","Both (a) and (b)"],"answer":[3],"explanation":"Lecture 26 only names torque sensors. Rotary torque sensors measure rotating torque and usually rotational speed too, so 'Both (a) and (b)' is the best guess, but no key is available.","verified":"unsure","c":425},{"q":"A gas sensing system plays a vital role for monitoring the concentration of ____________.","options":["Flammable gases","Combustible gases","Toxic gases","All of the above"],"answer":[3],"explanation":"Lecture 27 (Key Enablers: Sensing - Part 2): 'monitoring the concentration of flammable combustible toxic gases'.","verified":"lecture","c":426},{"q":"In n-type sensors MOS gas sensor ____________.","options":["Resistance decreases with respect to the Baseline resistance when exposed to a reducing gas","Resistance increases with respect to the Baseline resistance when exposed to a reducing gas","Resistance remains same with respect to the Baseline resistance when exposed to a reducing gas","None of the above"],"answer":[0],"explanation":"Lecture 27 (Key Enablers: Sensing - Part 2): n-type resistance decreases relative to baseline on exposure.","verified":"lecture","c":427},{"q":"The objectives of Small Cell deployment is ____________.","options":["Alleviating burden on backhaul","Improving energy efficiency","Decreasing dead zones","All of the above"],"answer":[3],"explanation":"Lecture 30 (Connectivity - Part 3): small cell objectives: 'alleviating burden on the backhaul, improving energy efficiency and decreasing the dead zones'.","verified":"lecture","c":428},{"q":"The characteristics of Tactile Internet are ____________.","options":["Real-time transmission of touch/sense and actuation","Provides new facet to human-machine interaction","Enables haptic communication","All of the above"],"answer":[3],"explanation":"Lecture 30 (Connectivity - Part 3): tactile internet - real-time touch/actuation, 'new facet to human machine interaction', haptic communication.","verified":"lecture","c":429},{"q":"The variants of Profibus are ____________.","options":["Profibus FMS","Profibus FSM","Profibus SP","Profibus QP"],"answer":[0],"explanation":"Lecture 29 (Connectivity - Part 2): variants are Profibus FMS, DP, PA.","verified":"lecture","c":430},{"q":"Match each element in the left column of the table with each element in the right column of the table correctly. Industry versions: i. 1.0, ii. 2.0, iii. 3.0, iv. 4.0. Characteristics (fill the blank against each): ____ Electrification, ____ Connectivity, ____ Mechanization, ____ Computation","options":["ii, iv, iii, i","ii, iv, i, iii","iv, ii, i, iii","ii, i, iv, iii"],"answer":[1],"explanation":"Lecture 30 (Connectivity - Part 3) notes Industry 4.0 focuses on connectivity; standard mapping 1.0 mechanization, 2.0 electrification, 3.0 computation/automation.","verified":"lecture","c":431},{"q":"The maximum data rate of EtherNet/IP is ____________.","options":["1500 bytes per packet","2500 bytes per packet","1600 bytes per packet","1800 bytes per packet"],"answer":[0],"explanation":"Lecture 28 (Connectivity - Part 1): EtherNet/IP 'supports data rate of up to about 1500 bytes per [packet]'.","verified":"lecture","c":432}]},{"year":2022,"session":"Jul-Oct 2022","week":7,"source":"Official NPTEL noc22_cs95 question images (pattern https://storage.googleapis.com/swayam-node1-production.appspot.com/assets/img/noc22_cs95/w7a7q1.png ... q15); answers by domain knowledge","questions":[{"q":"LPWAN enables long range wireless communication among “things” at a ____________.","options":["Low bit rate","High bit rate","Customized bit rate","None of the above"],"answer":[0],"explanation":"'for long range wireless communication between different things at a low bit rate ... LPWAN techniques are useful' (Lecture 31: Key Enablers of IIoT: Connectivity – Part 4 (LoRa/SIGFOX + NodeMCU demo)).","verified":"lecture","c":433},{"q":"“LoRa defines only the physical layer of the OSI stack, LoRaWAN handles the networking aspects of communication.” True or false?","options":["True","False"],"answer":[0],"explanation":"Lecture 31: Key Enablers of IIoT: Connectivity – Part 4 (LoRa/SIGFOX + NodeMCU demo) says 'LoRaWAN is a network in which LoRa operates'; LoRa is the PHY and LoRaWAN the network/MAC layer.","verified":"reasoning","c":434},{"q":"The SIGFOX radio link operates in the ____________.","options":["Unlicensed ISM radiobands","Licensed ISM radiobands","Both (a) and (b)","None of the above"],"answer":[0],"explanation":"'SIGFOX radio link operates in the unlicensed ISM radio bands' (Lecture 31: Key Enablers of IIoT: Connectivity – Part 4 (LoRa/SIGFOX + NodeMCU demo)).","verified":"lecture","c":435},{"q":"Xbee is a ____________.","options":["Mesh communication protocol based on the IEEE802.15.4","Product that uses the Zigbee communication protocol for radio communication.","All of the above","None of the above"],"answer":[1],"explanation":"'Xbee is a product from the company Digi' that follows Zigbee; the mesh protocol on 802.15.4 is Zigbee (Lecture 32: Key Enablers of IIoT: Connectivity – Part 5 (Zigbee/Xbee demo)).","verified":"lecture","c":436},{"q":"Which of the following is/are true about ZigBee?","options":["Zigbee is a communication protocol with its physical layer-based on the IEEE 802.15.4.","Supports 4 topologies: Bus, Star, Tree and Mesh","Used in home and industrial automation applications","All of the above"],"answer":[0,2],"explanation":"Zigbee follows IEEE 802.15.4; topologies are star, tree, mesh (no bus); used for home and industrial automation (Lecture 32: Key Enablers of IIoT: Connectivity – Part 5 (Zigbee/Xbee demo)). So (a),(c) true, (b) and (d) false.","verified":"lecture","c":437},{"q":"In Zigbee, end devices ____________.","options":["Acts as a bridge between different networks.","Relays the information to other nodes in the network","Responsible to connect to the parent node, no relaying of information is supported.","None of the above"],"answer":[2],"explanation":"'end devices are only responsible to connect to the parent node, and no relaying of information is done' (Lecture 32: Key Enablers of IIoT: Connectivity – Part 5 (Zigbee/Xbee demo)).","verified":"lecture","c":438},{"q":"The main components of Distributed Control Systems (DCS) ____________.","options":["Central supervisory controller","Distributed controllers","Field devices such as sensors and actuators","All of the above"],"answer":[3],"explanation":"DCS components: 'central supervisory controller, distributed controller, field devices such as sensors, actuators' and communication backbone (Lecture 35: Key Enablers of IIoT: Process Control).","verified":"lecture","c":439},{"q":"Which of the following is/are type(s) of Industrial Control Systems?","options":["Programmable Logic Controllers (PLCs)","Distributed Control Systems (DCS)","Supervisory control and Data Acquisition (SCADA)","All of the above"],"answer":[3],"explanation":"PLC, DCS and SCADA are the ICS types (Lecture 35: Key Enablers of IIoT: Process Control).","verified":"lecture","c":440,"rel":[["Jul-Oct 2024",7,0]]},{"q":"Which one is correct Pin configuration of a DHT sensor?","options":["PIN 1- 3.3V-5V Power supply, PIN 2- Data, PIN 3- Null and PIN 4- Ground","PIN 1- Data, PIN 2- 3.3V-5V Power supply, PIN 3- Null and PIN 4- Ground","PIN 1- Data, PIN 2- Null, PIN 3- 3.3V-5V Power supply and PIN 4- Ground","PIN 1- Ground, PIN 2- Data, PIN 3- Null and PIN 4- 3.3V-5V Power supply"],"answer":[0],"explanation":"'PIN 1 ... 3.3 volt to 5 volt power supply. PIN 2 is the data, PIN 3 is the null, and PIN 4 is the ground' (Lecture 31: Key Enablers of IIoT: Connectivity – Part 4 (LoRa/SIGFOX + NodeMCU demo)).","verified":"lecture","c":441},{"q":"Which one is the correct NodeMCU – DHT interfacing?","options":["GPIO 4 – Data, 3V3 – Vcc, and Gnd – Gnd","GPIO 4 – Gnd, 3V3 – Vcc, and Gnd – Data","GPIO 4 – Vcc, 3V3 – Data, and Gnd – Gnd","None of the above"],"answer":[0],"explanation":"'GPIO 4 of Node MCU connects to ... the data of the DHT. 3V3 ... connects to the Vcc and ground to ground' (Lecture 31: Key Enablers of IIoT: Connectivity – Part 4 (LoRa/SIGFOX + NodeMCU demo)).","verified":"lecture","c":442},{"q":"What does iRobot-Factory enforce to improve its manufacturing process?","options":["Cognitive intelligence","Managerial intelligence","Logistic intelligence","All of the above"],"answer":[0],"explanation":"iRobot-Factory: 'cognitive manufacturing ... cognitive means intelligence' (Lecture 34: Key Enablers of IIoT: Processing – Part 2).","verified":"lecture","c":443},{"q":"The architectural layers of SmartSantander include ____________.","options":["Accessible, Authorization, and Accounting subsystem","Authentication, Authorization, and Accounting subsystem","Authentication, Authorization, and Accommodation subsystem","None of the above"],"answer":[1],"explanation":"Architectural layers: 'authentication, authorization, accounting ...' subsystem (Lecture 34: Key Enablers of IIoT: Processing – Part 2).","verified":"lecture","c":444},{"q":"Rule-based engine of IIoT processing ____________.","options":["Extract causal and temporal patterns using predefined rules","Handles multiple data streams and correlates them to provide meaningful output","Both (a) and (b)","None of the above"],"answer":[2],"explanation":"Corrected after checking the lecture (was: Extract causal and temporal patterns using predefined rules). Lecture 33: Key Enablers of IIoT: Processing – Part 1 attributes to the rule-based CEP engine both extracting causal/temporal patterns and correlating event streams from different sources; later runs (Jan 2024/Jan 2025 'which is false', Jul 2024 'All of the above') treat 'handles multiple data streams and correlates them' as true of the rule-based engine.","verified":"lecture","c":445,"rel":[["Jan-Apr 2024",7,0],["Jan-Apr 2025",7,0]]},{"q":"Software layer between infrastructure layer and application layer ____________.","options":["Provides services according to device functionality","Support for heterogeneity, security","Both (a) and (b)","None of the above"],"answer":[2],"explanation":"Middleware 'will provide different services according to the device functionalities ... implement security ... handle device heterogeneity' (Lecture 33: Key Enablers of IIoT: Processing – Part 1).","verified":"lecture","c":446},{"q":"A typical industrial control system includes ____________ types of control loop.","options":["1","2","3","4"],"answer":[1],"explanation":"'there are two types of control loops one is the open loop control ... the other one is the feedback control or the closed loop' (Lecture 35: Key Enablers of IIoT: Process Control).","verified":"lecture","c":447}]},{"year":2022,"session":"Jul-Oct 2022","week":8,"source":"Official NPTEL noc22_cs95 question images (pattern https://storage.googleapis.com/swayam-node1-production.appspot.com/assets/img/noc22_cs95/w8a8q1.png ... q15); answers by domain knowledge; cross-checked with https://progiez.com/nptel-introduction-to-industry-4-assignment-8-answers (JUL-DEC 2022 section)","questions":[{"q":"What are the different types of IIoT analytics?","options":["Descriptive analytics","Predictive analytics","Prescriptive analytics","All of the above"],"answer":[3],"explanation":"Descriptive, predictive, prescriptive (Lecture 36: IIoT Analytics and Data Management: Introduction).","verified":"lecture","c":448,"rel":[["Jul-Oct 2023",8,1]]},{"q":"Which of the following is/are the challenges of analytics","options":["Timing","Safety","Automatic","All of the above"],"answer":[3],"explanation":"Challenges: correctness, causal, automatic, streaming, semantics, distributed, safety, timing, context (Lecture 36: IIoT Analytics and Data Management: Introduction).","verified":"lecture","c":449},{"q":"Big data analytics in data science considers __________ of data.","options":["Volume","Velocity","Both (a) and (b)","None of the above"],"answer":[2],"explanation":"Big data: 'huge volumes ... high velocities' (Lecture 36: IIoT Analytics and Data Management: Introduction).","verified":"lecture","c":450},{"q":"Which of the following is the correct sequence of implementing machine learning","options":["Data collection, feature extraction, model creation, model validation, deployment","Data collection, model creation, feature extraction, model validation, deployment","Data collection, feature extraction, model validation, model creation, deployment","Data collection, feature extraction, model creation, deployment, model validation"],"answer":[0],"explanation":"Collection → feature extraction → model creation → model validation → deployed (Lecture 36: IIoT Analytics and Data Management: Introduction).","verified":"lecture","c":451},{"q":"What is Machine Learning?","options":["Machine learning is a subset of Artificial Intelligence","Machine learning is a subset of Deep Learning","Both (a) and (b)","None of the above"],"answer":[0],"explanation":"'machine learning is nothing, but it is a subset of artificial intelligence' (Lecture 37: Machine Learning and Data Science – Part 1).","verified":"lecture","c":452},{"q":"In decision tree, decision node __________.","options":["is used to test or decide the outcome based on some value of an attribute","Denotes the classification of an example","Both (a) and (b)","None of the above"],"answer":[0],"explanation":"Decision node 'will be used to test or decide the outcome based on some value of an attribute'; leaf nodes denote classification (Lecture 37: Machine Learning and Data Science – Part 1).","verified":"lecture","c":453},{"q":"The main components of reinforcement learning includes __________.","options":["State","Action","Agent","All of the above"],"answer":[3],"explanation":"RL: agent, environment, action, reward/penalty and state information (Lecture 37: Machine Learning and Data Science – Part 1).","verified":"lecture","c":454},{"q":"Which of the following is/are true?","options":["Pfizer exploits IBM Watson for drug discovery","Genentech provide personalized treatment for patients","Both (a) and (b)","None of the above"],"answer":[2],"explanation":"'Pfizer ... exploit IBM Watson for drug discovery. Genentech provide personalized treatment' (Lecture 37: Machine Learning and Data Science – Part 1).","verified":"lecture","c":455},{"q":"The important factors required by deep learning methods in IIoT for solving critical issues are __________.","options":["Large Quantity of data","High Quality and accuracy of reliable data","Both (a) and (b)","None of the above"],"answer":[2],"explanation":"Large quantity of data and higher accuracy/quality (Lecture 38: Machine Learning and Data Science – Part 2).","verified":"lecture","c":456},{"q":"Digitization Process includes __________.","options":["Data acquisition","Resource management","Knowledge management","All of the data"],"answer":[3],"explanation":"'digitization process involves acquisition of the data ... management of assets, management of resources, knowledge management' (Lecture 39: Cloud Computing in IIoT – Part 1).","verified":"lecture","c":457},{"q":"Software-as-a-Service in cloud includes __________.","options":["Industrial applications with web or program Interface","Subscribe-and-use feature to industry clients with final product","Everything managed by the service provider","All of the above"],"answer":[3],"explanation":"SaaS: industrial applications with web/programming interface, subscribed by clients for the final product, 'managed through this software service provider' (Lecture 39: Cloud Computing in IIoT – Part 1).","verified":"lecture","c":458},{"q":"Microsoft Azure facilitates ______________.","options":["Infrastructure-as-a-Service","Platform-as-a-service","Both (a) and (b)","None of the above"],"answer":[2],"explanation":"Lecture 39: Cloud Computing in IIoT – Part 1 slide lists Azure under IaaS examples, but the demo shows the Microsoft cloud as the PaaS example (Amazon as IaaS); progiez gave (a). Azure provides both.","verified":"unsure","c":459},{"q":"Meshify provides","options":["Industrial IoT platform","Real-time monitoring","Low-cost solutions","All of the above"],"answer":[3],"explanation":"Meshify: IIoT platform, 'real time monitoring', 'solutions ... of low cost' (Lecture 40: Cloud Computing in IIoT – Part 2).","verified":"lecture","c":460},{"q":"Which of the following is/are the IIoT requirements in Industry 4.0?","options":["Achieve greater production","Deeper insights of analysis and prediction","Connected world of machines","All of the above"],"answer":[3],"explanation":"IIoT requirements: greater production, deeper insights of analysis and prediction, connected world of machines (Lecture 40: Cloud Computing in IIoT – Part 2).","verified":"lecture","c":461},{"q":"In comparison with the centralized approach, decentralized approach in IIoT __________.","options":["Increases load at cloud","Does not have any impact at cloud","Reduces load at cloud","None of the above"],"answer":[2],"explanation":"'decentralized approach that will decrease some of the load on the cloud' (Lecture 40: Cloud Computing in IIoT – Part 2).","verified":"lecture","c":462}]},{"year":2022,"session":"Jul-Oct 2022","week":9,"source":"Official NPTEL noc22_cs95 question images (pattern https://storage.googleapis.com/swayam-node1-production.appspot.com/assets/img/noc22_cs95/w9a9q1.png ... q15); answers by domain knowledge","questions":[{"q":"Which of the following is not a reason for using fog computing concept in IIoT?","options":["The generated data can be time-sensitive which require immediate response to avoid hazards","Fog can address the weaknesses of industrial automation","To enable new functionalities along with additional features","Fog simplifies the interoperability among different devices which work on different protocols"],"answer":[3],"explanation":"Corrected after checking the lecture (was: Fog can address the weaknesses of industrial automation). Lecture 41 (Fog Computing in IIoT) 'Why fog computing?': data time-sensitive/hazards, 'goal is to address the weaknesses of industrial automation', 'enabling newer functionalities ... along with the additional features' are all stated reasons; interoperability simplification is not one of the listed reasons.","verified":"lecture","c":463},{"q":"Which of the following are the use cases of IIoT?","options":["Smart Grid and Power","Oil and Gas Industries","Both (a) and (b)","None of the above"],"answer":[2],"explanation":"Lecture 41 (Fog Computing in IIoT): use cases include mining, power sector/smart grid, transportation, oil and gas.","verified":"lecture","c":464},{"q":"Which of the following is not a fog service provider?","options":["FogHorn","Amazon Web Services","Crosser","Sonm"],"answer":[1],"explanation":"Lecture 41 (Fog Computing in IIoT): fog providers FogHorn, Nebbiolo, Crosser, Sonm; AWS is a cloud provider.","verified":"lecture","c":465},{"q":"“As the fog nodes are placed closer to the source device, it provides a quicker response to the computation, resources, storage, and service request of the end-users.” True or false?","options":["True","False"],"answer":[0],"explanation":"Lecture 41 (Fog Computing in IIoT): fog processing closer to the origin of data gives faster response.","verified":"lecture","c":466},{"q":"Which of the following is not an object in R?","options":["Vectors","Raw","Data Frames","Matrices"],"answer":[1],"explanation":"Lecture 42 (Tutorial for R & Julia): R objects are 'vectors lists matrices arrays factors data frames'; raw is a data type.","verified":"lecture","c":467},{"q":"Which of the following package contains the functions for creating predictive models?","options":["Rpart","e1071","caret","igraph"],"answer":[2],"explanation":"Lecture 42 (Tutorial for R & Julia): 'caret for having different functions for creating predictive models'.","verified":"lecture","c":468},{"q":"Julia merges the benefits of _____ language with the performance of ______ language.","options":["Java, Python","Python, C","C, Python","C++, Python"],"answer":[1],"explanation":"Lecture 42 (Tutorial for R & Julia): Julia combines benefits of Python with performance of C.","verified":"lecture","c":469},{"q":"Which of the following is/are the essential characteristic(s) of cloud computing according to NIST?","options":["On-demand self service","Resource pooling","Rapid elasticity","All the above"],"answer":[3],"explanation":"Lecture 43 (Data Management with Hadoop): on-demand self service, broad network access, resource pooling, rapid elasticity, measured service.","verified":"lecture","c":470,"rel":[["Jan-Apr 2024",9,0]]},{"q":"Which of the following are the processes associated with Data Management in IIoT?","options":["Generation, Acquisition, Storage, and Analysis","Generation, Transmission, Storage, and Analysis","Generation, Transmission, Storage, and Filtration","None the above"],"answer":[0],"explanation":"Lecture 43 (Data Management with Hadoop): 'it starts with generation of the data, acquisition of the data, there after storage ... and finally the analysis'.","verified":"lecture","c":471},{"q":"In Hadoop Master/Slave architecture, which of the following is not the task of the Master?","options":["Executes operations like opening, closing, and renaming files and directories","Determines the mapping of blocks to data nodes","Serves read and write requests from the file system’s clients","None of the above"],"answer":[2],"explanation":"Lecture 43 (Data Management with Hadoop): master executes open/close/rename and maps blocks to data nodes; slaves serve read/write requests from clients.","verified":"lecture","c":472},{"q":"Choose the one which is wrong:","options":["Data center network should be agile","Data center network should be reliable","Data center network should be scalable","none of the above"],"answer":[3],"explanation":"Lecture 44 (Data Center Networks): DCN should be stable, secure, reliable, scalable and agile - all three statements are right.","verified":"lecture","c":473},{"q":"How many topology does the data center network have?","options":["3","4","5","6"],"answer":[1],"explanation":"Lecture 44 (Data Center Networks): 'three-tier ..., fat tree ..., Dcell and the BCube these are the four different data centre network topologies'.","verified":"lecture","c":474},{"q":"What are the components of Software-Defined Data Center?","options":["Edge node virtualization, OS virtualization, machine virtualization, Arithmetic logic layer","Network virtualization, Storage virtualization, Server virtualization, Business logic layer","Component virtualization, System virtualization, Server optimization, Network logic layer","Network optimization, Storage optimization, Server optimization, Arithmetic logic unit"],"answer":[1],"explanation":"Lecture 44 (Data Center Networks): SDDC needs 'network virtualization, storage virtualization, server virtualization' plus 'a separate business logic layer'.","verified":"lecture","c":475},{"q":"What is SDN?","options":["It is not a new technology, but rather reshaping the current network architecture.","It is restructuring the current network infrastructure in order to achieve an improved network management.","Both a) and b)","Neither b) nor a)"],"answer":[2],"explanation":"Lecture 45 (SDN in IIoT Part 1): 'restructuring of the current network infrastructure for improved network management ... not a new technology'.","verified":"lecture","c":476},{"q":"What are the three layers of SDN?","options":["Data plane, Network plane, and Infrastructure plane.","Data plane, Network plane, and Application plane.","Data plane, Control plane, and Application plane.","Data plane, Control plane, and Network plane."],"answer":[2],"explanation":"Lecture 45 (SDN in IIoT Part 1): SDN has 'data layer, ... control layer and ... application layer'.","verified":"lecture","c":477}]},{"year":2022,"session":"Jul-Oct 2022","week":10,"source":"Official NPTEL noc22_cs95 question images (pattern https://storage.googleapis.com/swayam-node1-production.appspot.com/assets/img/noc22_cs95/w10a10q1.png ... q15); answers by domain knowledge","questions":[{"q":"Which of the following is not performed on the control plan of SDIIoT Architecture – Public Networks?","options":["Network monitoring,","Management and optimization","Data transmission","Fault tolerance"],"answer":[3],"explanation":"Corrected after checking the lecture (was: Data transmission). Lecture 46 (SDN in IIoT Part 2): public-network control plane has 'network monitoring, then data transmission service and management and optimization'; fault tolerance is listed under applications, so it is the one not performed in the control plane.","verified":"lecture","c":478},{"q":"What are the two categories of data stream?","options":["Ordinary data stream and Emergent data stream","Noised data stream and Emergent data stream","Ordinary data stream and Noised data stream","None of the above"],"answer":[0],"explanation":"SD-edge adaptive transmission architecture (lecture slide) classifies streams into ordinary and emergent data streams.","verified":"reasoning","c":479},{"q":"What is the long form of DERMS?","options":["Decentralized entropy resource management system","Decentralized energy resource management system","Distributed entropy resource management system","Distributed energy resource management system"],"answer":[3],"explanation":"Lecture 46 (SDN in IIoT Part 2): 'DERMS which is basically ... Distributed Energy Resource Management System'.","verified":"lecture","c":480},{"q":"What is data confidentiality?","options":["Data must not be changed either accidentally or maliciously while transmitted; If changed, then it must be detected","Data make sense only for intended users and garbage to all others","Authorized users must get access to data when needed irrespective of any threats and failure","It can mean any of the above three statements"],"answer":[1],"explanation":"Lecture 47 (Security in IIoT Part 1): 'Confidentiality basically ensures that only the intended users will get access ... for all others ... not of any use'.","verified":"lecture","c":481},{"q":"In the STRIDE threat model, what is “I” stands for?","options":["Interruption of network","Interruption of service","Information disclosure","Information retrieval"],"answer":[2],"explanation":"Lecture 47 (Security in IIoT Part 1): STRIDE 'Information disclosure'.","verified":"lecture","c":482},{"q":"Which of the following is an application layer IIoT attack vector?","options":["Impersonation attack","SQL injection","Resource exemption","Traffic flooding"],"answer":[1],"explanation":"Lecture 47 (Security in IIoT Part 1): application layer lists data spoofing, SQL injection, DoS/DDoS, replay, resource exemption and reversal; resource exemption is listed in both application and network layers, so SQL injection is the unambiguous answer but resource exemption could also count.","verified":"unsure","c":483,"rel":[["Jan-Apr 2025",10,0]]},{"q":"What is/are the challenge in end device protection?","options":["Resource constrained","Many devices are mobile","No support for standard cryptographic protocols","All the above"],"answer":[3],"explanation":"Lecture 48 (Security in IIoT Part 2): end devices are resource constrained, heterogeneous, 'no standard cryptographic protocols'; slide also notes mobility.","verified":"lecture","c":484},{"q":"Which of the following is not included in cloud security?","options":["Data privacy","Energy efficiency management","Identity management","Access control"],"answer":[1],"explanation":"Lecture 48 (Security in IIoT Part 2): cloud security covers data privacy, security controls, identity management, access control - not energy efficiency.","verified":"lecture","c":485},{"q":"What are the three components of data protection?","options":["Confidentiality, Integrity, and Availability","Confidentiality, Integrity, and Authenticity","Confidentiality, Authority, and Availability","Authenticity, Authority, and Availability"],"answer":[0],"explanation":"Lecture 48 (Security in IIoT Part 2): 'confidentiality, integrity and availability'.","verified":"lecture","c":486},{"q":"What are the advantages of smart factories?","options":["Increase in efficiency","Reduction in overall production cost","Enhanced prediction of errors","All of the above"],"answer":[3],"explanation":"Lecture 49 (Factories and Assembly Line): benefits incl. real-time data, quality control, reduced production time; all options are benefits.","verified":"lecture","c":487},{"q":"Kuka – IoT Enabled Factory is __________.","options":["A German robotics maker","A German smart wearable maker","A Russian robotics maker","None of the above"],"answer":[0],"explanation":"Lecture 49 (Factories and Assembly Line): 'a German robotics maker name is Kuka'.","verified":"lecture","c":488},{"q":"Name a smart factory which produce honing machine?","options":["DeWalt – Construction Internet of Things","Gehring – Connected Manufacturing","Caterpillar","ABB - YuMi"],"answer":[1],"explanation":"Lecture 49 (Factories and Assembly Line): 'Gehring is in the space of connected manufacturing it makes honing machines'.","verified":"lecture","c":489},{"q":"What are the impacts of IoT in food Industries?","options":["Less wastage","Food safety","Transparency of the supply chain","All the above"],"answer":[3],"explanation":"Lecture 50 (Food Industry): efficient production, food safety, transparency of supply chain, minimized wastage.","verified":"lecture","c":490},{"q":"Name a service offers by Intellicup – Smart Cups.","options":["Detects the presence of microbial disease in food","Provides intelligent indoor garden to grow fruits, herbs, vegetables, greens, and edible flowers","Smart cooking","Smart beverage vending"],"answer":[3],"explanation":"Lecture 50 (Food Industry): 'Intellicup has the smart cups solution which basically is a smart beverage vending machine'.","verified":"lecture","c":491},{"q":"Which of the following food industry produces smart coffee brewing machines?","options":["Spinn Inc.","FarmSelf","Culinary Science Industries","Eskesso"],"answer":[0],"explanation":"Lecture 50 (Food Industry): 'Spinn Inc for smart coffee brewing'.","verified":"lecture","c":492}]},{"year":2022,"session":"Jul-Oct 2022","week":11,"source":"Official NPTEL noc22_cs95 question images (pattern https://storage.googleapis.com/swayam-node1-production.appspot.com/assets/img/noc22_cs95/w11a11q1.png ... q15); answers by domain knowledge","questions":[{"q":"What are the benefits of IIoT health care?","options":["Hospital staff can predict the arrival of a patient in PACU.","Hygiene monitoring system can detect the cleanliness of hand","Both a) and b)","None of the above"],"answer":[2],"explanation":"L51 'IIoT Applications: Healthcare' slide 'Benefits': 'Hospital staff can predict the arrival of a patient in PACU'; 'Hygiene monitoring system can detect the cleanliness of hand'.","verified":"lecture","c":493},{"q":"“Markerless AR technology is also known as position-based or location-based AR”. True or false?","options":["True","False"],"answer":[0],"explanation":"L13 'Augmented Reality and Virtual Reality': markerless AR uses no marker but GPS, digital compass, accelerometer to give location of a person/device (i.e., location/position-based).","verified":"lecture","c":494},{"q":"Which of the following is/are smart phone-based healthcare app?","options":["ECG self-monitoring","Instant heart rate","Fingerprint Thermometer","All of the above"],"answer":[3],"explanation":"L51 'IIoT Applications: Healthcare' slide 'Smartphone Based Healthcare App': ECG Self Monitoring, Instant Heart Rate, Fingerprint Thermometer all listed.","verified":"lecture","c":495},{"q":"Which of the following is/are the benefits of digital power plant?","options":["Improves performance","Reduce cost","Reduce energy and demand","All the above"],"answer":[3],"explanation":"L52 'IIoT Applications: Power Plants': digital power plant benefits - increased efficiency/performance, reduced cost, reduced energy demands.","verified":"lecture","c":496},{"q":"WiMAX is a wireless __________.","options":["Wide area network","Field area network","Neighborhood area network","None of the above"],"answer":[1],"explanation":"Corrected after checking the lecture (was: Wide area network). L52 'IIoT Applications: Power Plants' slide 'Communication Network': 'Field area network ... Wireless: WiMAX, 3G, 4G. Wired: Ethernet.' (spoken as 'wide area wireless technologies such as WiMAX' within FAN). WiMAX is listed under FAN; 'Wide area network' is plausible from the narration, so not certain.","verified":"unsure","c":497},{"q":"What is/are the Communication network(s) used in Advanced Metering Infrastructure (AMI)?","options":["Broadband over power-line","Fixed radio frequency","Neither a) nor b)","Both a) and b)"],"answer":[3],"explanation":"L52 'IIoT Applications: Power Plants': AMI communication network uses 'broadband over power line, fixed radio frequency'.","verified":"lecture","c":498},{"q":"What are the components of RFID tagging system?","options":["The RFID tag and host system","The RFID tag, read/write device, and host system","The RFID tag, transmitter, and host system","The RFID tag, read/write device, and transmitter"],"answer":[1],"explanation":"L53 'Inventory Management & Quality Control' slide: 'RFID Tagging system consists of: The RFID tag, Read/write device, Host System'.","verified":"lecture","c":499},{"q":"Which RFID tags broadcasts information signal in the form of a beacons?","options":["Active","Passive","Semi-Passive","None of the above"],"answer":[0],"explanation":"L53 'Inventory Management & Quality Control': active tags 'broadcast the information signal in the form of beacons'.","verified":"lecture","c":500},{"q":"How are RFID tags used in transportation?","options":["Track time and place of congestion","Compute delay and alternate routes","Commute with efficient time and mode","All the above"],"answer":[3],"explanation":"L53 'Inventory Management & Quality Control': transportation - tracking time and place of congestion, computing delay and alternate routes, commuting with efficient time and mode.","verified":"lecture","c":501},{"q":"What is authenticity in software security?","options":["Access control based on these credentials","Assurance that data is not altered by unauthorized people","Ratio of time of functioning to the total time","None of these"],"answer":[0],"explanation":"Corrected after checking the lecture (was: Assurance that data is not altered by unauthorized people). L54 'Plant Security and Safety' slide 'Authentication' bullets include 'Access control based on these credentials'; 'assurance that data is not altered by unauthorized people' is on the Integrity slide and the ratio of functioning time is Availability.","verified":"lecture","c":502},{"q":"Why do we use Intrusion prevention systems?","options":["Prevention of unauthorized sharing of sensitive data","Detection of abnormal behavior by the network","Detection and blocking attacks","All the above"],"answer":[2],"explanation":"L54 'Plant Security and Safety' slide: 'Intrusion prevention systems - Detection and blocking attacks' (data loss prevention and behavioral analytics are the other two options).","verified":"lecture","c":503},{"q":"Which of the following is not true about : 'UAVs are capable of taking aerial imagery, visual imagery, thermal imagery and also radio-frequency imagery of factory stations and substations' - all three options are listed.","verified":"lecture","c":512},{"q":"Precision forestry and canopy mapping refers to ______________.","options":["Wildland fires tracking","Measurement of canopy height, density and volume estimation","Resisting deforestation","Manage forest plantations and evenly distribute seedlings sprinkling fertilizer"],"answer":[1],"explanation":"L57 'UAVs in Industries' forestry slide: 'Precision forestry and canopy mapping: Measurement of canopy height, density and volume estimation'.","verified":"lecture","c":513},{"q":"Why are case studies necessary?","options":["Case studies provide in-depth knowledge and clarity of concepts regarding the research topic.","Case study enables a researcher to closely examine the data","Case study provides quantitative and qualitative analysis of the data","All of the above"],"answer":[3],"explanation":"L58 'Case Studies for Industry 4.0 & IIoT' slide 'Why are case studies necessary?': in-depth knowledge and clarity; closely examine the data; quantitative and qualitative analysis.","verified":"lecture","c":514,"rel":[["Jul-Oct 2025",12,0]]},{"q":"Which of the following is not a step of oil and gas industry work-flow?","options":["Apply predictive analytics","Data moves to a cloud-based analytics platform","Create a roadmap","Deploy IoT solutions in different locations"],"answer":[2],"explanation":"L56 'Oil, Chemical and Pharmaceutical Industry': 'Create a roadmap' is a step of the ML & cloud services flow, not the oil and gas work-flow (apply predictive analytics, deploy IoT, simulated data, ETL, cloud platform, identify maintenance).","verified":"lecture","c":515},{"q":"Real-time monitor in supply chain includes monitoring-","options":["Equipment and materials","Process and environment","Workers","All of the above"],"answer":[3],"explanation":"L56 'Oil, Chemical and Pharmaceutical Industry' slide 'Minimize Supply Chain Risk': real-time monitor of equipment, material, environment, process, workers.","verified":"lecture","c":516},{"q":"We can use IoT devices to detect-","options":["Adverse Drugs Reaction (ADR)","Effects of pharmaceutical excipients","Allergies","All of the above"],"answer":[3],"explanation":"L56 'Oil, Chemical and Pharmaceutical Industry' slide: detect ADR, effects of pharmaceutical excipients, allergies.","verified":"lecture","c":517},{"q":"UAVs have an _______ connection via wireless, from user to controller.","options":["Multi-hop","End-to-end","Both b) and a)","Neither a) nor b)"],"answer":[1],"explanation":"L57 'UAVs in Industries' slide: 'UAVs have an end-to-end connection via wireless, from user to controller'.","verified":"lecture","c":518},{"q":"The first-generation UAVs have only __________________.","options":["High quality video or higher-value instrumentation","Fundamental Remote-Control UAVs of different forms","Autopilot modes","None of the above"],"answer":[1],"explanation":"L57 'UAVs in Industries' generations slide: First - 'Fundamental Remote Control UAVs of different forms'.","verified":"lecture","c":519},{"q":"UAVs are applicable in which of the following fields?","options":["Energy Management","Warehousing and Inventory","Construction Sites","All of the above"],"answer":[3],"explanation":"L57 'UAVs in Industries' 'Application Fields' slide: energy management, warehousing and inventory, construction sites, etc.","verified":"lecture","c":520},{"q":"Crop health monitoring using UAVs include-","options":["Fertilization dispersal to different areas as per needed","Monitor crop stress factors (like over fertilization or drought)","Both a) and b)","Neither a) nor b)"],"answer":[2],"explanation":"Corrected after checking the lecture (was: Monitor crop stress factors (like over fertilization or drought)). L57 'UAVs in Industries' slide 'Application in Agriculture': under 'Crop health monitoring:' both sub-bullets 'Fertilizer dispersal to different areas as per needed' and 'Monitoring crop stress factors (like over fertilization or drought)' appear.","verified":"lecture","c":521},{"q":"What does 3D mapping of carbon storage in the forest refer to?","options":["The estimation of the amount of vegetation","The measurement of the carbon storage in biomass by remote sensing","The Estimation of the greenhouse gases trapped in the forest through remote sensing","All of the above"],"answer":[1],"explanation":"L57 'UAVs in Industries' forestry slide: '3D mapping of carbon storage in the forest: Measure the carbon storage in biomass by remote sensing'.","verified":"lecture","c":522}]},{"year":2024,"session":"Jan-Apr 2024","week":1,"source":"https://progiez.com/nptel-introduction-to-industry-4-assignment-1-answers","questions":[{"q":"What is a transducer?","options":["A device that converts energy from one form to another","A type of sensor that detects only energy","A digital communication device","A part of a computer processor"],"answer":[0],"explanation":"Lecture 01 (Sensing & Actuation): a transducer 'converts the energy from one form to the energy in another form'.","verified":"lecture","c":523},{"q":"What does sensor accuracy refer to?","options":["The range of the sensor","The smallest detectable input change","The correctness of the output compared to a standard value","The sensor’s response time"],"answer":[2],"explanation":"Lecture 01 (Sensing & Actuation): accuracy 'is about the correctness of the output compared to a superior system' - only option matching.","verified":"lecture","c":524},{"q":"What is an active sensor?","options":["A sensor that can only sense physical changes","A sensor that operates without an external power source","A sensor that independently senses the input","A sensor that operates without any energy consumption"],"answer":[2],"explanation":"Lecture 01 (Sensing & Actuation): 'active sensors are the ones which can independently sense the input'.","verified":"lecture","c":525},{"q":"What does ‘Actuator’ primarily refer to in IIoT systems?","options":["A device that stores data","A device that processes information","A device that converts signals into physical action","A device that enhances signal strength"],"answer":[2],"explanation":"Lecture 01 (Sensing & Actuation): actuator takes a control signal plus energy and produces mechanical action.","verified":"lecture","c":526},{"q":"Zigbee technology is popular for ________.","options":["Long-range communications","High power consumption","Low-cost, low-power wireless mesh networks","High data rate transfer"],"answer":[2],"explanation":"Lecture 02 (IoT Connectivity Part I): ZigBee offers low power, low data rate, medium range with mesh as the most used topology.","verified":"lecture","c":527},{"q":"Which of the following is true about 6LoWPAN?","options":["It is used for high-power industrial networks","It enables IPv6 packets over low-power wireless networks","It focuses on high-speed ethernet","It’s a standard for satellite communications"],"answer":[1],"explanation":"Lecture 02 (IoT Connectivity Part I): 6LoWPAN 'is about use of IPv6 over ... low power wireless personal area networks'.","verified":"lecture","c":528},{"q":"Near Field Communication (NFC) is typically used for:","options":["Long-range satellite communications","High-power industrial networks","Short-range wireless interaction between electronic devices","Storing large amounts of data"],"answer":[2],"explanation":"Lecture 03 (IoT Connectivity Part II): NFC works 'within close proximity', range < 10 cm.","verified":"lecture","c":529},{"q":"Which of the following actuators work on the principle of compression and decompression?","options":["Hydraulic Actuators","Thermal Actuators","Electric Actuators","Mechanical Actuators"],"answer":[0],"explanation":"Not in the IIoT transcript; Misra's IoT-course/textbook actuator section describes hydraulic actuators as working on compression and decompression of fluids.","verified":"reasoning","c":530},{"q":"ISA 100.11a is significant in IIoT because it _______________.","options":["Provides high-speed internet connectivity","Focuses on wireless network technology for industrial automation","Is used for long-range satellite communications","Enhances Bluetooth signal strength"],"answer":[1],"explanation":"Lecture 03 (IoT Connectivity Part II): ISA 100.11a 'is a standard that is used for wireless network technology ... primarily focuses on automation in industrial environments'.","verified":"lecture","c":531},{"q":"What is the primary function of IEEE 802.15.4 in IoT?","options":["High-speed data transmission","Providing security algorithms","Establishing low-rate wireless personal area networks","Data storage and retrieval"],"answer":[2],"explanation":"Lecture 02 (IoT Connectivity Part I): 802.15.4 provides PHY/MAC framework for low-power, low-rate wireless personal area networks.","verified":"lecture","c":532},{"q":"Z-Wave technology is best suited for __________.","options":["Industrial communication","Home automation","Satellite communication","High-speed internet"],"answer":[1],"explanation":"Lecture 03 (IoT Connectivity Part II): Z-wave 'is useful particularly for home automation application'.","verified":"lecture","c":533},{"q":"What is the maximum data rate possible in Wireless HART?","options":["2500 b/s","2.5mb/s","250 kb/s","None of the above"],"answer":[2],"explanation":"Lecture 02 (IoT Connectivity Part I): WirelessHART 'using data rates of up to about 250 kbps'.","verified":"lecture","c":534},{"q":"QoS 2 in MQTT is also known as ____________.","options":["At most once","At least once","Exactly once","None of the above"],"answer":[2],"explanation":"Lecture 05 (IoT Networking Part II): 'QoS 2 ... is about exactly once delivery'.","verified":"lecture","c":535},{"q":"CoAP works on Request/Response framework based on the _______ architecture.","options":["UDP","TCP","SCTP","DCCP"],"answer":[0],"explanation":"Lecture 05 (IoT Networking Part II): CoAP works on top of UDP (with DTLS).","verified":"lecture","c":536},{"q":"Infra-red sensor is an example of __________.","options":["Acoustic Sensor","Mechanical Sensor","Electrical Sensor","Optical Sensor"],"answer":[3],"explanation":"Infra-red sensors detect light (IR radiation) - an optical sensor; not discussed in the lecture.","verified":"reasoning","c":537}]},{"year":2024,"session":"Jan-Apr 2024","week":2,"source":"https://progiez.com/nptel-introduction-to-industry-4-assignment-2-answers","questions":[{"q":"Which of the following is a key characteristic of the Fourth Industrial Revolution?","options":["Extensive use of steam engines","Evasion of corporate taxes","Widespread use of artificial intelligence","Introduction of assembly lines"],"answer":[2],"explanation":"Lecture 06 (The Fourth Revolution): Industry 4.0 uses 'artificial intelligence, machine learning, cyber physical systems'.","verified":"lecture","c":538,"rel":[["Jul-Oct 2024",2,0],["Jul-Oct 2026",2,0]]},{"q":"Which of the following is not a physical megatrend?","options":["Cloud Computing","3D Printer","Autonomous Vehicle","Advanced Robotics"],"answer":[0],"explanation":"Lecture 06 (The Fourth Revolution): physical megatrends are autonomous vehicles, 3D printing, advanced robotics, new materials - cloud is not.","verified":"lecture","c":539},{"q":"How does Industry 4.0 enhance sustainability in manufacturing industries?","options":["By increasing manual labor","Through globalization and emerging technologies","By reducing the use of digital technologies","Focusing on traditional manufacturing methods"],"answer":[1],"explanation":"Lecture 07 (Sustainability Assessment of Manufacturing Industry): Industry 4.0 'incorporates globalization and emerging issues' for sustainability.","verified":"lecture","c":540},{"q":"What is a crucial aspect of Supply Chain Management (SCM) in sustainable manufacturing?","options":["Prioritizing high-cost production","Ignoring environmental concerns","Outsourcing without strategic planning","Considering environmental concerns such as climate change, contamination, and resource consumption"],"answer":[3],"explanation":"Lecture 07 (Sustainability Assessment of Manufacturing Industry): SCM 'has many additional environmental concerns ... climate change, contamination, resource consumption'.","verified":"lecture","c":541},{"q":"What role does ICT play in the manufacturing industry?","options":["Reducing communication within the enterprise","Serving as the main nervous system of any manufacturing industry","Discouraging the sharing of information between customer, producer, and supplier","Eliminating the need for enterprise resource planning"],"answer":[1],"explanation":"Lecture 07 (Sustainability Assessment of Manufacturing Industry): ICT is 'the backbone of most of the modern manufacturing industries' (slide: main nervous system).","verified":"lecture","c":542},{"q":"What characterizes an emerging market in the context of Industry 4.0?","options":["Markets that are fully developed and static","Markets that meet the standards of newly developed innovative products","Markets that exclusively focus on traditional products","Markets that resist globalization"],"answer":[1],"explanation":"Lecture 07 (Sustainability Assessment of Manufacturing Industry): emerging markets: 'markets are able to meet the standards of newly developed innovative products'.","verified":"lecture","c":543},{"q":"What is the primary focus of the Lean Production System?","options":["Overworking the employees to boost production","Prioritizing customer needs","Increasing the price of products","Reducing technology use"],"answer":[1],"explanation":"Lecture 08 (Lean Production System): lean 'mainly focuses on addressing the customer's needs directly'.","verified":"lecture","c":544},{"q":"Which among the following are aspects of socio-economic issues of sustainability in Industry 4.0?","options":["Social","Economic","Environmental","All of the above"],"answer":[3],"explanation":"Lecture 07 (Sustainability Assessment of Manufacturing Industry): regulation/sustainability issues are economic, social and environmental.","verified":"lecture","c":545},{"q":"The Lean Production System mainly focuses on the customer’s need. Which company is credited for the development of Lean Production System?","options":["Siemens","Toyota Motors","Hitachi","Microsoft"],"answer":[1],"explanation":"Lecture 08 (Lean Production System): lean 'has its origin in the Toyota motor corporation'.","verified":"lecture","c":546},{"q":"What is a major concern in implementing Lean Production in the context of Industry 4.0?","options":["Reducing digital technology use","Integrating humans in plants","Ignoring customer feedback","Avoiding environmental considerations"],"answer":[1],"explanation":"Lecture 08 (Lean Production System): lean in Industry 4.0 concerns 'the integration of humans in the plant'.","verified":"lecture","c":547},{"q":"Which of the following is not a benefit of smart and connected products?","options":["Decreased environmental impact","Better usage of product","Rapid increment in the sale price of a product","Smart Supply Chain"],"answer":[2],"explanation":"Lecture 09 (Smart and Connected Business Perspective): benefits are faster, cheaper, better usage, improved recall, decreased environmental impact, smart supply chain - not price increase.","verified":"lecture","c":548,"rel":[["Jul-Oct 2024",2,0]]},{"q":"Which of the following is not a fundamental building block of a smart and connected business in the context of Industry 4.0?","options":["Blueprint of profits","Customer values","Key resources and processes","None of the above"],"answer":[3],"explanation":"Lecture 09 (Smart and Connected Business Perspective): building blocks are 'customer values, blueprint of profits, key resources and key processes' - all options are blocks.","verified":"lecture","c":549},{"q":"What is a major advantage of smart factories?","options":["Increased production costs","Reduced efficiency","Improvement in quality and safety","Limited product variety"],"answer":[2],"explanation":"Lecture 10 (Smart Factories): advantages include 'improving the quality ... improving the safety'.","verified":"lecture","c":550},{"q":"How is information technology utilized in smart factories?","options":["For manual data processing","To avoid data analysis","For smart software applications and to control processes","To limit connectivity and communication"],"answer":[2],"explanation":"Lecture 10 (Smart Factories): IT provides 'smart software, smart hardware, smart management, smart monitoring, smart control'.","verified":"lecture","c":551},{"q":"Communication, trust and capital with respect to the created values play an important role in IIoT business model.","options":["False","True"],"answer":[1],"explanation":"Not found in Weeks 1-2 transcripts; consistent with the course's IIoT business-model material (value creation relies on communication, trust and capital) - True.","verified":"reasoning","c":552}]},{"year":2024,"session":"Jan-Apr 2024","week":3,"source":"https://progiez.com/introduction-to-industry-4-and-industrial-iot-week-3","questions":[{"q":"Which of the following is not a feature of Cyber-Physical Systems?","options":["Reactive Computation","Concurrency","Real-Time Computation","Standalone non-networked Computation"],"answer":[3],"explanation":"L11: CPS features are reactive computation, concurrency, feedback control, real-time computation; CPS are networked, not standalone.","verified":"lecture","c":553},{"q":"In the context of CPS in Smart Grid, what is the full form of DAU?","options":["Data Aggregation Unit","Data Analytic Unit","Distributed Augmented Universe","Dedicated Accounting Unit"],"answer":[0],"explanation":"L11 lists smart-grid CPS 'PMUs Phasor Measurement Units, Data Acquisition Unit'; of the given options only Data Aggregation Unit fits DAU.","verified":"lecture","c":554},{"q":"Which of the following is not a component of CPS’s “5C Architecture” for Industry 4.0?","options":["Connection","Conversion","Compatibility","Cognition"],"answer":[2],"explanation":"L11: the 5Cs are connection, conversion, cyber, cognition, configuration; compatibility is not one.","verified":"lecture","c":555,"rel":[["Jan-Apr 2023",3,0]]},{"q":"What are the key parts enabling collaboration productivity in Industry 4.0?","options":["IT Proliferation, Single Source of Truth, Industrialization, Coordination","Financial Analysis, Market Research, Legal Compliance, Public Relations","Human Resources, Sales Targets, Customer Feedback, Advertising","Supply Chain Management, Quality Control, Cost Reduction, Branding"],"answer":[0],"explanation":"L12: collaboration productivity enabled by key parts 'IT, single source of truth, industrialization, and coordination'.","verified":"lecture","c":556},{"q":"What does ‘PLM’ stand for in the context of Industry 4.0?","options":["Product Lifecycle Management","Public Liability Marketing","Professional Learning Modules","Personal Leadership Mastery"],"answer":[0],"explanation":"L12: PLM = product lifecycle management.","verified":"lecture","c":557,"rel":[["Jul-Oct 2022",3,0]]},{"q":"What does the Technique ‘ABC’ in PLM stand for?","options":["Activity Based Costing","Advanced Business Computing","Analytical Business Concepts","Automated Banking Coordination"],"answer":[0],"explanation":"L12 techniques and methods: 'activity based costing, concurrent engineering, design for sustainability, and lifecycle assessment'.","verified":"lecture","c":558},{"q":"In which fields are AR and VR used in Industry 4.0?","options":["Cooking and nutrition","Fashion design only","Machining, production, and education","Network Security"],"answer":[2],"explanation":"L13: AR/VR use cases 'machining and production ... education, training, collaboration, assembly line'.","verified":"lecture","c":559},{"q":"Which among the following is one type of categorization of AR?","options":["Marker-attached AR","Markerless AR","Null AR","Marker-like AR"],"answer":[1],"explanation":"L13: AR types include 'marker less augmented reality'.","verified":"lecture","c":560},{"q":"What type of AR uses visual markers for outcomes?","options":["Marker-based Augmented Reality","Markerless Augmented Reality","Projection Based Augmented Reality","Superimposition Based Augmented Reality"],"answer":[0],"explanation":"L13: 'Marker based augmented reality gives an outcome when the reader is sensed by the camera and the visual marker'.","verified":"lecture","c":741,"rel":[["Jul-Oct 2024",3,1]]},{"q":"What type of knowledge is used in AI techniques?","options":["Only historical data","Only factual information","Procedural, declarative, and heuristic knowledge","Limited to scientific formulas"],"answer":[2],"explanation":"L14: forms of knowledge are procedural/operational, declarative/relational, and heuristic.","verified":"lecture","c":562},{"q":"What is the use of AI in IIoT?","options":["No use in IIoT","Only for data storage","Machine safety, efficient product lifecycle, efficient manufacturing processes, and others","Limited to basic calculations"],"answer":[2],"explanation":"L14: 'machine safety, efficient products lifecycle, efficient manufacturing processes, these could be achieved with the help of AI'.","verified":"lecture","c":563},{"q":"Which of the following characterizes Big Data?","options":["Limited to textual data only","Consists of structured and non-structured data","Only includes numerical data","Data that is always organized"],"answer":[1],"explanation":"L15: big data is 'non-structured as well as structured data'.","verified":"lecture","c":564},{"q":"What does a distributed file system in Big Data ensure?","options":["Inconsistency of data","Unreliable data storage","Consistency, accessibility, and fault tolerance of data","Limited data access"],"answer":[2],"explanation":"Distributed file systems (GFS/HDFS, L15) store large fi
