],"explanation":"Lecture 49 (Factories and Assembly Line): smart factory optimized 'without any human intervention or with minimal human intervention'.","verified":"lecture","c":1161,"rel":[["Jan-Apr 2024",10,0],["Jul-Oct 2025",10,1]]},{"q":"Which of the following statements is INCORRECT about Fanuc - Zero Downtime System?","options":["Is a robot maker","Uses predictive maintenance to reduce downtime","Does not predict component failure","Performs cloud-based analytics with the help of in-built sensors"],"answer":[2],"explanation":"Lecture 49 (Factories and Assembly Line): Fanuc zero downtime 'predicts component failure'.","verified":"lecture","c":983,"rel":[["Jul-Oct 2023",10,1]]},{"q":"What is the purpose of SmartLabel in the food industry?","options":["To provide consumers with product-related information via QR codes","To remove ingredient details from food packaging","To eliminate allergen warnings for consumers","To prevent transparency in the food supply chain"],"answer":[0],"explanation":"Lecture 50 (Food Industry): SmartLabel 'uses QR code to provide product related information to the consumers'.","verified":"lecture","c":984},{"q":"Which of the following devices is primarily used to detect the presence of microbial disease in food?","options":["Diagenetix-BioRanger","Eskesso-The Cooking Sorcery","Intellicup-Smart Cups","Intellicup-The Cooking Sorcery"],"answer":[0],"explanation":"Lecture 50 (Food Industry): 'Diagenetix ... bio ranger which can help in detecting the presence of microbial diseases in the food'.","verified":"lecture","c":985},{"q":"What is the unique feature of Spinn Inc.'s smart coffee machines?","options":["They connect with Amazon Echo and have an auto-order feature","They remove automation from coffee brewing","They require manual input for all brewing processes","They prevent connectivity with IoT platforms"],"answer":[0],"explanation":"Lecture 50 (Food Industry) only names Spinn for smart coffee brewing; Spinn machines integrate with Amazon Alexa/Echo and auto-reorder beans; other options are negations.","verified":"reasoning","c":986}]},{"year":2025,"session":"Jan-Apr 2025","week":11,"source":"https://www.youtube.com/watch?v=RJXW0SV_rCk","questions":[{"q":"What is one of the primary benefits of IIoT in healthcare?","options":["Increasing the number of hospital visits","Remote monitoring of patient health conditions","Limiting the use of wearable healthcare devices","Reducing the need for medical data storage"],"answer":[1],"explanation":"L51 'IIoT Applications: Healthcare' slide 'Benefits of IIoT in Healthcare': 'Monitor patient's health condition remotely'.","verified":"lecture","c":987},{"q":"Which IoT-enabled device is used for continuous glucose level monitoring?","options":["QardioCore","Dexcom Glucose Sensor","iHealth BP5","Kinsa Smart Thermometer"],"answer":[1],"explanation":"L51 'IIoT Applications: Healthcare': 'Dexcom develops continuous glucose monitoring devices.'","verified":"lecture","c":988},{"q":"Which IIoT device monitors body temperature using wearable sensors?","options":["Kinsa Smart Thermometer","Dexcom Glucose Sensor","iHealth BP5","ADAMM Intelligent Asthma Monitor"],"answer":[0],"explanation":"L51 'IIoT Applications: Healthcare': 'Kinsa smart thermometer is IoT based body temperature monitoring device' (wearable sensor).","verified":"lecture","c":989},{"q":"Which of the following ensures that medical data is not accessible by unauthorized users?","options":["Integrity","Authentication","Confidentiality","Availability"],"answer":[2],"explanation":"L51 'IIoT Applications: Healthcare' slide: 'Confidentiality: It ensures medical data is not accessible by unauthorized users.'","verified":"lecture","c":990},{"q":"What is a major benefit of smart metering in IIoT?","options":["Reduces operational costs by enabling remote management","Increases the chance of energy loss","Eliminates the need for grid optimization","Limits data collection from power systems"],"answer":[0],"explanation":"L52 'IIoT Applications: Power Plants': smart metering - 'IoT is used to reduce the operational cost as the operations are remotely managed'.","verified":"lecture","c":991},{"q":"What is a key advantage of Advanced Metering Infrastructure (AMI)?","options":["Prevents broadband and radio frequency communications","Enables smart meters to collect and transmit energy consumption data","Eliminates the need for automated power distribution","Reduces the effectiveness of metering data management"],"answer":[1],"explanation":"L52 'IIoT Applications: Power Plants': AMI comprises smart meters, communication networks; smart meters collect energy data, MDAS gathers, MDMS analyzes.","verified":"lecture","c":992},{"q":"How does IIoT benefit the wind energy sector?","options":["Predicts turbine issues before large-scale damage occurs","Prevents automation in remote power plants","Increases the difficulty of maintaining remote turbines","Disables predictive maintenance in wind farms"],"answer":[0],"explanation":"L52 'IIoT Applications: Power Plants': wind sector - IIoT improves efficiency and remote monitoring/control of turbines; only the predictive option is a benefit.","verified":"lecture","c":993},{"q":"Which of the following is NOT a key function of Inventory Management?","options":["Decouple components of the production-distribution system","Hedge against price increases or take advantage of quantity discounts","Eliminating stock monitoring","Smoothen the flow of operations"],"answer":[2],"explanation":"L53 'Inventory Management & Quality Control' functions: meet anticipated demand, decoupling, protect against stock-outs, hedge against price increases, smoothen flow; 'eliminating stock monitoring' is not one.","verified":"lecture","c":994},{"q":"What type of RFID tag has an onboard battery but no active transmitter?","options":["Active RFID Tag","Passive RFID Tag","Semi-Passive RFID Tag","Dynamic RFID Tag"],"answer":[2],"explanation":"L53 'Inventory Management & Quality Control': semi-passive tags have 'an onboard battery to power the IC ... no active transmitter'.","verified":"lecture","c":995,"rel":[["Jul-Oct 2025",11,0]]},{"q":"Which of the following is NOT true about RFID tags?","options":["RFID tags can store additional information like temperature and damage status.","RFID tags require a line-of-sight for data reading.","RFID tags are used for product identification and visibility.","RFID tags have better security compared to barcodes."],"answer":[1],"explanation":"L53 'Inventory Management & Quality Control': it is barcodes that 'need to be on Line of Sight of the readers'; RFID does not.","verified":"lecture","c":996},{"q":"Which network security measure is used to detect and prevent malware?","options":["Access control","Antivirus and antimalware software","Virtual Private Network","Data encryption"],"answer":[1],"explanation":"L54 'Plant Security and Safety' slide: 'Antivirus and antimalware software - Scan for malware detection and prevention'.","verified":"lecture","c":997},{"q":"Which of the following is not a key feature of AR?","options":["AR creates the perception of a mixed reality spectrum.","AR produces an enhanced view of the real world using multiple sensory modalities - auditory, haptic, somatosensory, olfactory, and visual.","AR completely replaces the real-world environment with a fully virtual space.","AR utilizes the existing physical environment and overlays additional useful information on top of it."],"answer":[2],"explanation":"L13 'Augmented Reality and Virtual Reality': AR overlays digital elements on the real environment (middle of mixed reality spectrum); fully replacing reality is VR.","verified":"lecture","c":998},{"q":"How does IoT enhance security in facility management?","options":["By monitoring alarms, smoke detectors, and life safety systems remotely","By disconnecting emergency response systems","By preventing real-time access to security alerts","By limiting surveillance capabilities in buildings"],"answer":[0],"explanation":"L55 'Facility Management' slide: 'Security and Safety Alarms - Monitor alarms, smoke detector, other life safety systems remotely'.","verified":"lecture","c":999},{"q":"Which of the following is NOT a type of network security?","options":["Intrusion prevention systems","Firewalls","Mobile device security","Manual error tracking"],"answer":[3],"explanation":"L54 'Plant Security and Safety' types of network security: firewalls, IPS, mobile device security, etc.; 'manual error tracking' is not listed.","verified":"lecture","c":1000},{"q":"Which of the following is NOT a component of an RFID system?","options":["RFID reader","Antenna","Integrated Circuit Card (ICC)","RFID tag or smart label"],"answer":[2],"explanation":"L53 'Inventory Management & Quality Control': RFID system = tag, reader (read/write device with antenna), host system; an Integrated Circuit Card is not a component.","verified":"reasoning","c":1001}]},{"year":2025,"session":"Jan-Apr 2025","week":12,"source":"https://www.youtube.com/watch?v=kqvD0ZeMCXs","questions":[{"q":"Which of the following is NOT a benefit of IoT in the oil and gas industry?","options":["Improving work safety","Enhancing production efficiency","Eliminating equipment maintenance","Saving cost and time"],"answer":[2],"explanation":"L56 'Oil, Chemical and Pharmaceutical Industry' benefits: production efficiency, save cost and time, improve asset maintenance, work safety; eliminating maintenance is not one.","verified":"lecture","c":1002,"rel":[["Jul-Oct 2025",12,0]]},{"q":"What is a key application of IoT sensors in the pharmaceutical industry?","options":["Detecting adverse drug reactions (ADR)","Eliminate utilization of equipment","Increasing production costs intentionally","Avoiding remote control of equipment"],"answer":[0],"explanation":"L56 'Oil, Chemical and Pharmaceutical Industry': IoT examines drugs to detect Adverse Drug Reactions.","verified":"lecture","c":1003},{"q":"Which of the following cannot be achieved by performing condition-based monitoring using IoT?","options":["Predicting quality through continuous monitoring","Analytics-based weather prediction and its impact on farming","Adjust the amount of required material","Eliminating pricing models entirely"],"answer":[3],"explanation":"L56 'Oil, Chemical and Pharmaceutical Industry' slide 'Condition-based monitoring': predict quality, water/nutrients/pesticides analysis, weather prediction, adjust material, 'Pricing model with the profit margin'.","verified":"lecture","c":1004},{"q":"How does IoT improve logistics for industries?","options":["Preventing product location tracking with sensors or RFID tags","Ensuring contamination detection and alert notifications","Avoiding warehouse monitoring altogether","Ignoring asset tracking to prevent loss"],"answer":[1],"explanation":"L56 'Oil, Chemical and Pharmaceutical Industry' slide 'Improve Logistics': 'Detection of contamination or attacks', 'Alert notification'.","verified":"lecture","c":1005},{"q":"How does IoT contribute to reducing energy expenses in industries?","options":["By analyzing real-time data to identify inefficiencies","By increasing regulatory control burdens","By avoiding usage pattern analysis","By ignoring energy usage optimization"],"answer":[0],"explanation":"L56 'Oil, Chemical and Pharmaceutical Industry' slide 'Reduce Energy Expenses': analyze real time data, improve usage pattern, inefficiency.","verified":"lecture","c":1006},{"q":"Which of the following can be achieved by using IoT in the chemical industry?","options":["Reduction in Energy Expenses","Predictive Maintenance","Improve Logistics","All of these"],"answer":[3],"explanation":"L56 'Oil, Chemical and Pharmaceutical Industry': chemical industry benefits include reduced energy expenses, predictive maintenance, improved logistics.","verified":"lecture","c":1007},{"q":"Which generation of UAVs introduced transformable designs, 1080 HD video, and three-axis gimbals?","options":["Second Generation","Fourth Generation","Fifth Generation","Sixth Generation"],"answer":[1],"explanation":"L57 'UAVs in Industries' generations slide: Fourth - 'Transformable designs, 1080 HD video or higher value instrumentation, three-axis gimbals'.","verified":"lecture","c":1008},{"q":"How do UAVs help in the mining industry?","options":["Digging entire tunnels","Managing stockpiles and grading control","Operating drilling machinery","Refining extracted minerals"],"answer":[1],"explanation":"L57 'UAVs in Industries' mining slide: 'Manage stockpiles', 'Helps in grading control'.","verified":"lecture","c":1009},{"q":"How do UAVs help in agriculture?","options":["Monitor crop stress factors like over-fertilization or drought","Reduce human labor completely","Eliminate the need for fertilizers","Increase soil erosion"],"answer":[0],"explanation":"L57 'UAVs in Industries' agriculture slide: 'Monitoring crop stress factors (like over fertilization or drought)'.","verified":"lecture","c":1010},{"q":"What is a major advantage(s) of UAVs in telecommunication?","options":["Monitor towers from any angle and height","Covers wide areas with less cost","Broadcasting live events","All of these"],"answer":[3],"explanation":"L57 'UAVs in Industries' telecom slide: monitor towers from any angle and height; covers wide areas with less cost (broadcasting live events not on the original slide but 'All of these' is the only option covering the listed advantages).","verified":"lecture","c":1011},{"q":"Which of the following is most suitable for scanning a huge number of items in a warehouse, checking the missing items, and monitoring full inventory?","options":["Unmanned Aerial Vehicle (UAV)","Automated Guided Vehicle (AGV)","Autonomous Underwater Vehicle (AUV)","Segway"],"answer":[0],"explanation":"L57 'UAVs in Industries' slide 'Warehousing and Inventory': UAVs scan a huge number of items, check missing items, monitor full inventory in a day.","verified":"lecture","c":1012},{"q":"Which generation of UAVs introduced transformable designs with 360° gimbals and high-quality video instrumentation?","options":["Third Generation","Fourth Generation","Fifth Generation","Sixth Generation"],"answer":[2],"explanation":"L57 'UAVs in Industries' generations slide: Fifth - 'Transformable designs with 360° gimbals, high quality video or higher-value instrumentation'.","verified":"lecture","c":1013,"rel":[["Jan-Apr 2026",12,0]]},{"q":"Which of the following is NOT an application of UAVs in forestry?","options":["Conducting forestry surveys to show information about forest species, including the humans around the forest","Precision forestry and canopy mapping for measuring canopy height, density, and volume estimation","Tracking wildland fires","Eradicating endangered species"],"answer":[3],"explanation":"L57 'UAVs in Industries' forestry slide: forestry survey, precision forestry & canopy mapping, wildland fires tracking, 'Protecting endangered species'.","verified":"lecture","c":1014},{"q":"What is one of the primary applications of UAVs in construction sites?","options":["Painting buildings","Monitoring job sites","Replacing construction workers","Manufacturing construction materials"],"answer":[1],"explanation":"L57 'UAVs in Industries' construction slide: 'Monitoring job sites: Monitor progress, works, and safety standards'.","verified":"lecture","c":1015},{"q":"Which of the following is/are FALSE about the necessity of case studies?","options":["The case study investigates real-life phenomena through a detailed analysis of related events.","The case study generally selects a vast geographical area or a large number of individuals as the subject matter.","Both (a) and (b)","Neither (a) nor (b)"],"answer":[1],"explanation":"L58 'Case Studies for Industry 4.0 & IIoT' slide: case study selects 'a small geographical area or a very limited number of individuals', so (b) is false; (a) is stated as true.","verified":"lecture","c":1016,"rel":[["Jul-Oct 2023",12,1]]}]},{"year":2025,"session":"Jul-Oct 2025","week":1,"source":"https://www.youtube.com/watch?v=4es0cfNyxzU","questions":[{"q":"Which sensor system type is characterized by an output that oscillates before reaching steady state?","options":["Zero order system","First order system","Second order system","Linear system"],"answer":[2],"explanation":"Lecture 01 (Sensing & Actuation): second order systems' output 'will typically oscillate before the steady state'.","verified":"lecture","c":1017},{"q":"Which of the following is NOT a correct example of a transducer?","options":["Microphone","Wire","Speaker","Antenna"],"answer":[1],"explanation":"Lecture 01 (Sensing & Actuation): microphone, speaker, antenna are transducers; a wire is not.","verified":"lecture","c":1018,"rel":[["Jul-Oct 2022",1,0]]},{"q":"The response of which of the following sensors depends on the magnitude of the direction and orientation of input parameter?","options":["Scalar sensor","Passive sensor","Analog sensor","Vector sensor"],"answer":[3],"explanation":"Lecture 01 (Sensing & Actuation): vector sensors depend on magnitude, direction and orientation.","verified":"lecture","c":1019},{"q":"Which type of Zigbee node is responsible for network initialization and maintenance?","options":["Router","End Device","Coordinator","Sensor"],"answer":[2],"explanation":"Lecture 02 (IoT Connectivity Part I): coordinator 'takes care of issues of initialization, maintaining, and controlling of the network'.","verified":"lecture","c":1020},{"q":"Which two layers does IEEE 802.15.4 provide a framework for?","options":["MAC and PHY","IP and TCP","HTTP and SSL","FTP and DNS"],"answer":[0],"explanation":"Lecture 02 (IoT Connectivity Part I): 802.15.4 defines 'the physical layer and the MAC layer'.","verified":"lecture","c":1021},{"q":"How often are time slots allocated in Wireless HART?","options":["1 per second","10ms per slot","100ms per slot","1 second per device"],"answer":[1],"explanation":"Lecture 02 (IoT Connectivity Part I): WirelessHART groups '100 consecutive time slots per second' into a superframe, i.e. 10 ms per slot.","verified":"lecture","c":1022},{"q":"How do passive RFID tags operate?","options":["Use an internal battery","Use an external solar panel","Are powered by the reader inductively","Are manually activated"],"answer":[2],"explanation":"Lecture 03 (IoT Connectivity Part II): passive tags 'will have to be powered inductively'.","verified":"lecture","c":1023},{"q":"Bluetooth technology is based on which type of networking?","options":["Mesh","Piconet (Ad-hoc)","Star","Bus"],"answer":[1],"explanation":"Lecture 03 (IoT Connectivity Part II): Bluetooth forms ad-hoc networks organised as Piconets.","verified":"lecture","c":1024},{"q":"What process is used by Z-wave to bypass radio dead spots?","options":["Network Slicing","Subnetting","Healing","Network Partitioning"],"answer":[2],"explanation":"Lecture 03 (IoT Connectivity Part II): dead spots 'can be bypassed ... known as healing'.","verified":"lecture","c":1025},{"q":"Which of the following best represents the 'trunk' in the IoT analogy?","options":["ARM (Architectural Reference Model)","IoT applications","Communication protocols","End-user interfaces"],"answer":[0],"explanation":"Lecture 04 (IoT Networking Part I): 'this trunk is basically the architectural reference model of IoT'.","verified":"lecture","c":1026},{"q":"What is the function of the Registration Interface (RI) in CoRE?","options":["Processes user login","Assigns MAC addresses","Encrypts transmitted data","Registers IoT resources to the directory"],"answer":[3],"explanation":"Lecture 04 (IoT Networking Part I): devices 'register their resources to the resource directory' through the registration interface.","verified":"lecture","c":1027},{"q":"Which of the following is not a message type in CoAP?","options":["CON","NON","RST","ECHO"],"answer":[3],"explanation":"Lecture 05 (IoT Networking Part II): CoAP message types are confirmable, non-confirmable, reset (RST) and acknowledgement - no ECHO.","verified":"lecture","c":1028},{"q":"Which of the following is an IP-based solution proposed by IETF for IoT?","options":["Zigbee Alliance","Bluetooth SIG","CoRE","Wi-Fi Alliance"],"answer":[2],"explanation":"Lecture 04 (IoT Networking Part I): IETF IP-based solutions are 6LoWPAN, ROLL and CoRE.","verified":"lecture","c":1029},{"q":"State true or false. Sensor calibration is typically used for weeding-out repeatable errors in sensor readings.","options":["True","False"],"answer":[0],"explanation":"Not in the lecture; calibration removes systematic (repeatable) errors, random errors cannot be calibrated out - True.","verified":"reasoning","c":1030},{"q":"Which of the following is NOT true about WirelessHART?","options":["It is a license-free protocol","It is not compatible with any legacy devices","WirelessHART uses the IEEE 802.15.4 standard for its protocols designing","WirelessHART makes device placements more accessible and cheaper"],"answer":[1],"explanation":"WirelessHART is backward compatible with existing HART devices, so 'not compatible with any legacy devices' is the false statement; lecture confirms it is 802.15.4-based.","verified":"reasoning","c":1031}]},{"year":2025,"session":"Jul-Oct 2025","week":2,"source":"https://www.youtube.com/watch?v=rWFea39oqME","questions":[{"q":"Which technological innovation drove the First Industrial Revolution?","options":["Electricity and the assembly line","Invention of steam engine and construction of railways","Semiconductor fabrication techniques","Artificial Intelligence and Cyber-Physical Systems"],"answer":[1],"explanation":"Lecture 06 (The Fourth Revolution): first revolution 'started with the invention of steam engine ... construction of railways'.","verified":"lecture","c":1032},{"q":"Which of the following sectors is considered as the conventional application area for robots?","options":["Automotive industry","Precision agriculture","Nursing","Space exploration"],"answer":[0],"explanation":"Lecture 06 (The Fourth Revolution): 'connected robotic equipments are being used in the automotive industries' (the conventional domain).","verified":"lecture","c":1033},{"q":"Fill in the blanks. A depression, compared to a recession, is characterized by ________________________.","options":["Increased investment in manufacturing","Shorter duration of economic hardship","Lower unemployment rates","Higher levels of economic damage and longer duration"],"answer":[3],"explanation":"Lecture 07 (Sustainability Assessment of Manufacturing Industry): depression 'is the extremity of recession ... duration is more than two years'.","verified":"lecture","c":1034},{"q":"In a manufacturing industry, which system is described as the \"main nervous system\"?","options":["Supply-Chain Management (SCM)","Information and Communication Technology (ICT)","Energy-price monitoring","Human-resources planning"],"answer":[1],"explanation":"Lecture 07 (Sustainability Assessment of Manufacturing Industry): ICT is the backbone/main nervous system of manufacturing.","verified":"lecture","c":1035,"rel":[["Jul-Oct 2024",2,0],["Jul-Oct 2026",2,0]]},{"q":"Fill in the blanks. Emerging markets are expected to be found primarily in ______.","options":["Developed countries","Developing countries","Polar regions","Nations with zero population growth"],"answer":[1],"explanation":"Lecture 07 (Sustainability Assessment of Manufacturing Industry): emerging markets consideration 'is very important, particularly for developing countries'.","verified":"lecture","c":1036},{"q":"Which of the following is a key feature of Lean production approach?","options":["It emphasizes automation over manual labor","It focuses solely on financial outcomes","It considers the customer's perspective","It aims to increase inventory levels"],"answer":[2],"explanation":"Lecture 08 (Lean Production System): 'lean approach is basically look from the customers' perspective'.","verified":"lecture","c":1037},{"q":"Alongside Jidoka, Lean production is founded on which second pillar?","options":["Kaizen","Just-in-Time","Kanban","Total Productive Maintenance"],"answer":[1],"explanation":"Lecture 08 (Lean Production System): lean's two pillars are JIDOKA and just-in-time.","verified":"lecture","c":1038},{"q":"What is the first step in the \"5 steps of walking a value stream\"?","options":["Build a leadership team","Walk it – discuss value and list ideas","Focus on a single value stream","Schedule follow-up"],"answer":[2],"explanation":"Lecture 08 (Lean Production System): five steps start with 'Focusing on a single value stream'.","verified":"lecture","c":1039},{"q":"What is included among the fundamental building blocks of a smart business model?","options":["Marketing campaigns","Customer values and key processes","Warehouse locations","Stock exchange metrics"],"answer":[1],"explanation":"Lecture 09 (Smart and Connected Business Perspective): building blocks: customer values, blueprint of profits, key resources and key processes.","verified":"lecture","c":1040},{"q":"Which of the following represents the key attributes of a smart business model?","options":["Value proposition","Revenue streams","Technologies","All of these"],"answer":[3],"explanation":"Lecture 09 (Smart and Connected Business Perspective): key attributes: value proposition, revenue stream, technologies.","verified":"lecture","c":1041,"rel":[["Jan-Apr 2023",2,0],["Jul-Oct 2022",2,0],["Jan-Apr 2025",2,0],["Jul-Oct 2026",2,0]]},{"q":"Fill in the blanks. Big Data analytics in smart factories can help with_________________.","options":["Generating knowledge","Reducing data storage","Eliminating sensors","Increasing manual paperwork"],"answer":[0],"explanation":"Lecture 10 (Smart Factories): big data analytics is about 'generating knowledge out of the information'.","verified":"lecture","c":1042},{"q":"Why are smart factories increasingly necessary in today's industry?","options":["They reduce the number of products needed","They support rigid, static manufacturing systems","They help achieve high production in less time with reduced risks of failure","They operate only in low-demand markets"],"answer":[2],"explanation":"Lecture 10 (Smart Factories): smart factories needed for competitiveness, 'high amount of production within minimum timeline', 'reducing the risk of failure'.","verified":"lecture","c":1043},{"q":"State True or False. Smart Grid is considered as a supporting technology for Smart Factories.","options":["True","False"],"answer":[0],"explanation":"Lecture 10 (Smart Factories): 'smart grid is also a very important supporting technologies for building smart factories'.","verified":"lecture","c":1044},{"q":"Timely delivery and reliability are highlighted within sustainability under which supply-related concept?","options":["Supply-Chain Management loop","Single-sourcing","Random demand generation","Personal mail delivery"],"answer":[0],"explanation":"Lecture 07 (Sustainability Assessment of Manufacturing Industry) covers SCM as the strategic globalization element for sustainability; timely delivery/reliability belong to the SCM loop - other options are distractors.","verified":"reasoning","c":1045},{"q":"State True or False. Industry 4.0 is commonly referred to as the fourth industrial revolution pertaining to digitization in the manufacturing industry.","options":["True","False"],"answer":[0],"explanation":"Lecture 06 (The Fourth Revolution): Industry 4.0 is the synonym of the fourth industrial revolution, digitizing/connecting manufacturing.","verified":"lecture","c":1046}]},{"year":2025,"session":"Jul-Oct 2025","week":3,"source":"https://www.youtube.com/watch?v=tayDassOJdM","questions":[{"q":"What distinguishes CPS from traditional embedded systems?","options":["CPS are always smaller in size","CPS have limited computational power","CPS are networked set of embedded systems and not resource-constrained","CPS rely solely on manual controls"],"answer":[2],"explanation":"L11: CPS is a networked set of embedded systems and 'may not be resource constrained'.","verified":"lecture","c":1047},{"q":"Fill in the blanks. Reactive Computation, as a feature of Cyber-Physical Systems, primarily involves ______.","options":["Performing computations only when explicitly commanded by a user.","Interacting with the environment in an ongoing manner through observed inputs and outputs.","Executing a fixed set of operations without external influence.","Storing large amounts of data for later analysis."],"answer":[1],"explanation":"L11: reactive computation is interaction with the environment continuously, 'a sequence of observed inputs and outputs'.","verified":"lecture","c":1048},{"q":"A smart traffic management system that monitors traffic signals and cameras in real-time to optimize traffic flow and provide transit signal priority for emergency vehicles is an example of CPS application in which domain?","options":["Healthcare","Smart Grid","Transportation","Industry"],"answer":[2],"explanation":"L11: transportation CPS for 'real time monitoring of traffic ... signals, cameras ... transit signal priority ... for ambulances'.","verified":"lecture","c":1049},{"q":"Which of the following are the four key parts that enable collaboration productivity in Industry 4.0?","options":["IT Proliferation, Single Source of Truth, Industrialization, Coordination","Hardware, Software, Networks, People","Planning, Execution, Monitoring, Control","Design, Development, Testing, Deployment"],"answer":[0],"explanation":"L12: IT proliferation, single source of truth, industrialization, coordination.","verified":"lecture","c":1050},{"q":"What is identified as a major challenge for PLM in Industry 4.0?","options":["Lack of skilled workers","High energy consumption","Short product lifecycle and increasing outsourcing","Limited internet connectivity"],"answer":[2],"explanation":"L12: business challenges for PLM are a 'shortened product lifecycle' and 'increased outsourcing'.","verified":"lecture","c":1051},{"q":"How does Augmented Reality (AR) function in a user's environment?","options":["Replaces the real world with a fictional setting","Adds digital elements into the actual environment","Creates a full simulation with no real-world connection","Only uses audio input"],"answer":[1],"explanation":"L13: 'digital elements are added to the actual environment'.","verified":"lecture","c":1052},{"q":"Which sensor modalities are supported by Augmented Reality?","options":["Auditory only","Tactile only","Visual, auditory, and haptic","Taste and smell"],"answer":[2],"explanation":"L13: AR 'provides multiple sensor modalities, which can be visual, auditory or, haptic'.","verified":"lecture","c":1053},{"q":"According to Patterson, what is Artificial Intelligence (AI)?","options":["Deals with studying and creation of computer systems exhibiting some form of intelligent behavior","A method of transmitting wireless data","A system that replicates human hardware","A mechanical replacement for programming languages"],"answer":[0],"explanation":"L14: per Patterson, AI 'deals with the study and the creation of computer systems that exhibit some form of intelligence'.","verified":"lecture","c":1054},{"q":"Which of the following is NOT listed as a scope of AI?","options":["Games","Data Entry","Natural Language Processing (NLP)","Robotics"],"answer":[1],"explanation":"L14 scope of AI: games, NLP, vision, speech, robotics, expert systems; data entry is not listed.","verified":"lecture","c":1055},{"q":"Which of the following is listed as a challenge of AI in IIoT?","options":["Increasing efficiency","Saving costs","Understanding data","Boosting resources"],"answer":[2],"explanation":"L14: challenges include 'understanding the data'. Efficiency, cost and resources are listed as advantages.","verified":"lecture","c":1056},{"q":"The statement \"Data whose meaning is constantly changing\" best describes which characteristic of Big Data?","options":["Variety","Veracity","Variability","Visualization"],"answer":[2],"explanation":"L15: variability is 'the data whose meaning is constantly changing'.","verified":"lecture","c":1057},{"q":"Which of the following is a notable distributed file system derived from the open-source codes of GFS, mentioned in the context of Big Data storage?","options":["HDFS","NoSOL","SOL","RDBMS"],"answer":[0],"explanation":"L15: 'HDFS file system is a notable file system derived from the open source codes of GFS'.","verified":"lecture","c":1058},{"q":"Why are traditional Data Warehouse (DW) architectures generally not suitable for Big Data applications?","options":["They are designed for unstructured data.","They lack the ability to perform parallel processing.","They cannot handle the characteristics that Big Data possess, requiring distributed, parallel performing, scale-out frameworks","They are too expensive for Big Data."],"answer":[2],"explanation":"L15: 'big data applications cannot be fit in traditional data warehouse architectures' due to large volumes; they need distributed scale-out tools.","verified":"lecture","c":1059},{"q":"Fill in the blanks. ________ acts as the interface for the different applications during the entire lifecycle management of the product.","options":["Product Lifecycle Management","Customer Relationship Management","Enterprise Resource Planning","Manufacturing Execution System"],"answer":[0],"explanation":"L12 presents PLM as the management system spanning the product's entire lifecycle, so PLM is the interface across lifecycle applications.","verified":"reasoning","c":1060},{"q":"Which of the following statements is incorrect about Big Data?","options":["Big data analytics can process real-time data from IoT devices and store them using various storage schemes.","Big data consists only of structured datasets generated by IoT applications.","The classification of data as big data depends on characteristics such as volume, variety, value, velocity, and veracity.","Big data can be used to analyze patterns in network behavior, customer experiences, and connectivity issues."],"answer":[1],"explanation":"L15: big data includes structured and non-structured data, so 'only structured' is incorrect.","verified":"lecture","c":1061}]},{"year":2025,"session":"Jul-Oct 2025","week":4,"source":"https://www.youtube.com/watch?v=NI8PviQZ3bQ","questions":[{"q":"Which of the following components of cybersecurity focuses on maintaining the availability, integrity, and confidentiality of business data?","options":["Network Security","Operational Security","Information Security","End-user Education"],"answer":[2],"explanation":"L16: information security maintains 'the availability, the integrity, and the confidentiality of the data'.","verified":"lecture","c":1062},{"q":"Network security combines multiple layers of defenses at which locations?","options":["At the edge and in the network","Only within the network's core","Only at the edge of the network","At individual user devices only"],"answer":[0],"explanation":"L16 calls network security a protective platform over the network; the standard definition is multiple layers of defenses 'at the edge and in the network'.","verified":"reasoning","c":1063},{"q":"Why are IIoT Security Standards required, especially when diverse systems and equipment are integrated on a smart factory floor?","options":["To reduce the cost of implementing IIoT","Because leaving security to individual IIoT implementers is dangerous and every weak line puts the whole factory at risk","To ensure that only new systems are implemented, not legacy ones","To increase the complexity of the smart factory floor"],"answer":[1],"explanation":"L16: 'every weak line in the production system ... puts the whole factory at risk. So, leaving security at the hands of the individual IIoT implementers is ... dangerous'.","verified":"lecture","c":1265,"rel":[["Jul-Oct 2026",4,1]]},{"q":"In IIoT, where are sensors and actuators primarily used compared to traditional automation?","options":["Only for critical elements","Almost everywhere to control, enhance, and optimize various functions","Exclusively for emergency systems","To replace human operators entirely"],"answer":[1],"explanation":"L17: in IIoT, sensors and actuators are 'used everywhere to control, enhance, and optimize various functions'.","verified":"lecture","c":1065},{"q":"In the mining industry, how do sensor networks with gas sensors, strata monitoring devices, and RFID tags contribute to safety and efficiency?","options":["They only help in tracking miners' locations","They are primarily used for communication between miners","They replace the need for human inspection","They provide early disaster warning, monitor working conditions, and help locate miners"],"answer":[3],"explanation":"L17: mining benefits are 'early disaster warning, working condition of the miners can be monitored ... Locating and monitoring the miners'.","verified":"lecture","c":1266,"rel":[["Jul-Oct 2026",4,1]]},{"q":"Who coined the term \"Industrial Internet\"?","options":["IBM","General Electric (GE)","Intel","Siemens"],"answer":[1],"explanation":"L18: General Electric coined 'industrial internet'.","verified":"lecture","c":1267,"rel":[["Jul-Oct 2026",4,1]]},{"q":"What are the three key elements of the Industrial Internet?","options":["Big Data, Cloud, and AI","Intelligent Machines, Advanced Analytics, People at Work","Sensors, Processors, and Actuators","Software, Hardware, and Middleware"],"answer":[1],"explanation":"L18: intelligent machines, advanced analytics, people at work.","verified":"lecture","c":1068,"rel":[["Jul-Oct 2022",4,0],["Jan-Apr 2024",4,0],["Jul-Oct 2024",4,0],["Jan-Apr 2025",4,0]]},{"q":"In a milk packaging unit, how is flow measured?","options":["Using a thermometer","Via a spinning impeller that sends signals when milk flows","With a smart camera","Using a GPS module"],"answer":[1],"explanation":"L19: 'impeller spins when the milk moves and sends the electrical signal to the control unit'.","verified":"lecture","c":1268,"rel":[["Jul-Oct 2026",4,1]]},{"q":"Which component is responsible for converting analog data to digital data in a smart sensor node?","options":["Processor","Memory","ADC","DAC"],"answer":[2],"explanation":"L19: smart sensor node has 'the ADC, the analog to digital converter'.","verified":"lecture","c":1269,"rel":[["Jul-Oct 2026",4,1]]},{"q":"In the context of the agriculture industry, what is the primary use of smart sensors like soil and water sensors?","options":["To track real-time objects","To predict driver destinations","To prevent patient falls in hospitals","For accurate use of fertilizers and determining crop health"],"answer":[3],"explanation":"L19: agriculture smart sensors monitor soil moisture, water level, fertilizer and nutrition content.","verified":"lecture","c":1071},{"q":"Fill in the blanks. Thames Water's smart water management system, as an example of Industrial Process 4.0 operation efficiency, primarily benefits from _________________.","options":["Data monetization and pay-per-use models","Sensor-based equipment status monitoring and failure detection","Augmented Reality-based problem diagnosis","Controlled power generation using weather forecasts"],"answer":[1],"explanation":"L20: Thames Water example: 'sensor based equipment monitoring the status monitoring, detection of failures'.","verified":"lecture","c":1270,"rel":[["Jul-Oct 2026",4,1]]},{"q":"Fill in the blanks. Interoperability in the design philosophy of IIoT for Industrial Processes refers to _________________.","options":["Empowering smart objects to reduce human intervention","Facilitating communication between heterogeneous objects","Virtualization of objects and digital models","Enabling smart objects to take independent decisions"],"answer":[1],"explanation":"L20: 'Interoperability is about facilitating communication between heterogeneous objects'.","verified":"lecture","c":1073},{"q":"In the 5C architecture of Cyber-Physical Systems, what does the \"Conversion Layer\" do?","options":["Interprets sensors data for information","Stores backup data","Converts analog signal to mechanical action","Synchronizes robotic arms"],"answer":[0],"explanation":"L20: conversion layer covers 'the conversion of the data into information, and its interpretation'.","verified":"lecture","c":1074},{"q":"State true or false. In the case of spear phishing, the attackers send thousands of deceitful emails that resemble actual emails from credible sources while email phishing attacks are targeted to a specific person or organization to obtain sensitive information.","options":["True","False"],"answer":[1],"explanation":"The roles are swapped: spear phishing targets a specific person or organization, while email phishing sends mass deceptive emails. So False.","verified":"reasoning","c":1075,"rel":[["Jul-Oct 2026",4,0]]},{"q":"Which of the following statements is incorrect about the CIA triad in network and computer system security?","options":["Confidentiality ensures that information is concealed and protected from unauthorized access","Integrity refers to maintaining the accuracy and consistency of data, and can always be violated by intentional attacks","Availability is compromised when authorized users are denied access to information due to network attacks like DDoS","None of these"],"answer":[1],"explanation":"L16: integrity ensures data cannot be changed in an unauthorized manner. Saying it 'can always be violated by intentional attacks' is the incorrect statement; A and C are correct.","verified":"reasoning","c":1076}]},{"year":2025,"session":"Jul-Oct 2025","week":5,"source":"https://www.youtube.com/watch?v=g97T1sbD5L0","questions":[{"q":"According to the ICP DAS framework for Industry 4.0, under which category does \"System health diagnosis\" fall?","options":["Energy","Safety","M2M","Manufacturing"],"answer":[3],"explanation":"Corrected after checking the lecture (was: Safety). Lecture 21 (Industrial Processes - Part 2): ICP DAS 'In the context of manufacturing, machine internetworking, system health diagnostics, system health monitoring, production efficiency'; safety covers plant safety, surveillance, info security.","verified":"lecture","c":1077},{"q":"Kaeser Kompressoren coined a new term for their service-based business model, in which users pay per cubic meter of compressed air used. What is this model called?","options":["Renting Model","Selling Model","Subscription Model","Air-as-a-Service"],"answer":[3],"explanation":"Lecture 21 (Industrial Processes - Part 2): air-as-a-service, 'pay per cubic meter of air'.","verified":"lecture","c":1078},{"q":"Which company is highlighted for its use of smart glasses for fault detection in its manufacturing process?","options":["KUKA","Maersk","Boeing","Cisco"],"answer":[2],"explanation":"Lecture 21 (Industrial Processes - Part 2) credits Boeing's smart manufacturing with 'reduced errors in the manufacturing process' (the smart-glasses detail is on the slide, not spoken); Boeing is the known smart-glasses user.","verified":"reasoning","c":1079},{"q":"What is a business model as defined by the \"Business Model Generation\" book?","options":["The organizational and financial architecture of a business","The rationale of how an organization creates, delivers, and captures value","A description of how a business intends to earn profits","The network of suppliers and partners that optimize a business"],"answer":[1],"explanation":"Lecture 22 (Business Models - Part 1): business model 'captures ... the rationale behind how the organization ... deliver value ... capturing the value' (Osterwalder's Business Model Generation definition).","verified":"lecture","c":1080,"rel":[["Jul-Oct 2023",5,0]]},{"q":"Which IoT business model relieves the customer from the responsibilities of ownership and maintenance, focusing on a \"Pay-per-outcome\" approach?","options":["Subscription Model","Asset-Sharing Model","Outcome-Based Model","IoT-as-a-Service"],"answer":[2],"explanation":"Lecture 22 (Business Models - Part 1): outcome-based = 'pay-per-outcome ... customer is basically relieved from the responsibility of ownership, and maintenance'.","verified":"lecture","c":1081},{"q":"In a Cloud-Based Business Model, how do customers typically access services?","options":["By outright purchase","By manual installation","Via government funding","Through temporary leasing of resources"],"answer":[3],"explanation":"Lecture 23 (Business Models - Part 2): cloud resources offered on demand/subscription, i.e. temporarily leased.","verified":"lecture","c":1082},{"q":"What is the primary purpose of the revenue model in Service-Oriented Business Models in IIoT?","options":["Only subscription fees","Physical sales","Monetization of collected data","Rental income"],"answer":[2],"explanation":"Lecture 23 (Business Models - Part 2): service-oriented revenue model: 'collecting and monetizing from the collected data directly or indirectly'.","verified":"lecture","c":1083},{"q":"Which type of Cloud-Based Business Model aims at providing the required hardware and software online in the cloud?","options":["Software-as-a-Service (SaaS)","Platform-as-a-Service (PaaS)","Infrastructure-as-a-Service (IaaS)","Business-as-a-Service (BaaS)"],"answer":[2],"explanation":"Lecture 23 (Business Models - Part 2): IaaS - hardware/computing infrastructure as a service.","verified":"lecture","c":1084,"rel":[["Jul-Oct 2023",5,0]]},{"q":"What is the purpose of the Industrial Internet Reference Architecture (IIRA)?","options":["Allowing interoperability and guiding IIoT technologies","Reducing network speed","Designing personal computer systems","Building only mobile applications"],"answer":[0],"explanation":"Lecture 24 (Reference Architecture - Part 1): IIRA applies 'to allow interoperability, mapping application technologies, and in guiding the use of these technologies'.","verified":"lecture","c":1085},{"q":"An IIoT product is being tested in different continents for performance, standardization, and interoperability before its release. Which organization is most likely facilitating this?","options":["IEEE","Industrial Internet Consortium (IIC)","ISO","NIST"],"answer":[1],"explanation":"Lecture 24 (Reference Architecture - Part 1): IIC testbeds, where innovations are 'rigorously tested ... before they are actually launched in the market'.","verified":"lecture","c":1086},{"q":"Which of the following is an example of a Lagging KPI for OSH?","options":["Frequency of observed unsafe behaviour","Number of OSH audits","Number of lost-time incident frequency rate","Percentage of managers with adequate OSH training"],"answer":[2],"explanation":"Lecture 24 (Reference Architecture - Part 1): lagging KPIs: 'number of lost-time incident frequency rate ... number of fatalities'.","verified":"lecture","c":1087},{"q":"In the usage Viewpoint, which element of an Activity defines the conditions under which the activity is initiated?","options":["Workflow","Effects","Constraints","Trigger"],"answer":[3],"explanation":"Lecture 25 (Reference Architecture - Part 2): 'Trigger basically are the conditions under which the activity is initiated'.","verified":"lecture","c":1088},{"q":"In the context of the Usage Viewpoint of the Industrial Internet Reference Architecture (IIRA), what is considered the basic unit of work?","options":["System","Network","Component","Task"],"answer":[3],"explanation":"Lecture 25 (Reference Architecture - Part 2): task is the basic unit of work.","verified":"lecture","c":1089},{"q":"Which of the following represents key feature(s) of the process-oriented business model?","options":["Execution of various business processes within the organization","Presence of process owners to supervise the processes","Evaluation of process performance","All of these"],"answer":[3],"explanation":"Lecture 23 (Business Models - Part 2) describes process optimization within/across companies; executing processes, process owners and process performance evaluation are all standard features, so 'All of these'.","verified":"reasoning","c":1090},{"q":"Fill in the blanks. __________________ is an electrical framework that provides two-way communication between the consumers and suppliers. With the help of smart meters, smart appliances, and energy-efficient resources, it efficiently delivers electricity to the consumers.","options":["Smart grid","Load Balancer","Railway Signaling System","None of these"],"answer":[0],"explanation":"Definition of smart grid (two-way communication, smart meters); Lecture 26 lists smart grid among IIoT applications.","verified":"reasoning","c":1091}]},{"year":2025,"session":"Jul-Oct 2025","week":6,"source":"https://www.youtube.com/watch?v=iRSUQw4WusM","questions":[{"q":"In the diagram for the manufacturing process, which unit comes immediately after the \"Quality Testing Unit\"?","options":["Packaging Unit","Production Unit","Product Counting Unit","Transporting Unit"],"answer":[2],"explanation":"Lecture 26 (Key Enablers: Sensing - Part 1): after quality testing 'we are going to have the counting of these different units of product', then packaging.","verified":"lecture","c":1092},{"q":"The analog temperature sensor LM35 generates an output voltage that is linearly proportional to what temperature scale?","options":["Fahrenheit","Kelvin","Celsius","Rankine"],"answer":[2],"explanation":"Lecture 26 (Key Enablers: Sensing - Part 1): proportional to Celsius.","verified":"lecture","c":1093},{"q":"The MQ-2 gas sensor is specifically mentioned to detect the concentration of which gases?","options":["Oxygen, Nitrogen, and Carbon Dioxide","LPG, propane, and hydrogen","Methane, Ammonia, and Carbon Monoxide","Ozone, Sulfur Dioxide, and Nitrous Oxide"],"answer":[1],"explanation":"Lecture 26 (Key Enablers: Sensing - Part 1): MQ-2 detects LPG, propane, hydrogen.","verified":"lecture","c":1094},{"q":"What happens to the resistance of an n-type MOS sensor when it is exposed to a reducing gas?","options":["It increases with respect to the Baseline resistance","It decreases with respect to the Baseline resistance","It remains unchanged","It fluctuates randomly"],"answer":[1],"explanation":"Lecture 27 (Key Enablers: Sensing - Part 2): 'In n-type sensors the resistance decreases ... with respect to the baseline resistance when ... exposed to a target gas'.","verified":"lecture","c":1291,"rel":[["Jan-Apr 2025",6,1],["Jul-Oct 2026",6,1]]},{"q":"According to the working principle of MOS gas sensors, what is the \"Optimum Temperature\"?","options":["The maximum temperature the sensor can withstand","The minimum temperature required for operation","The particular temperature at which the sensor gives the best response","The temperature of the surrounding environment"],"answer":[2],"explanation":"Lecture 27 (Key Enablers: Sensing - Part 2): optimum temperature definition.","verified":"lecture","c":1096},{"q":"ModBus-TCP uses which protocol suite for data transmission?","options":["RS-232","TCP/IP & Ethernet","CAN","IEEE 802.15.4"],"answer":[1],"explanation":"Lecture 28 (Connectivity - Part 1): Modbus TCP uses TCP/IP and Ethernet.","verified":"lecture","c":1097},{"q":"What does the acronym EtherCAT stand for?","options":["Ethernet Control and Transmission","Ethernet Common Automation Technology","Ethernet Control Automation Technology","Ethernet Communication and Telemetry"],"answer":[2],"explanation":"Lecture 28 (Connectivity - Part 1): 'the full form of CAT is Control Automation Technology'.","verified":"lecture","c":1098},{"q":"In the ModBus-TCP data frame, what is the name of the 7-byte header that identifies the Application Data Unit (ADU)?","options":["TCP Header","PDU Header","MBAP (MODBUS Application Protocol) header","Ethernet Header"],"answer":[2],"explanation":"Lecture 28 (Connectivity - Part 1): 'MBAP stands for Modbus application protocol header, which is of length 7 bytes'.","verified":"lecture","c":1099},{"q":"Which variant of CC-Link offers the highest transmission rate of 1 Gbps?","options":["Standard CC-Link","CC-Link LT","CC-Link Safety","CC-Link IE (Industrial Ethernet)"],"answer":[3],"explanation":"Lecture 29 (Connectivity - Part 2): 'industrial Ethernet is 1 Gbps'.","verified":"lecture","c":1100},{"q":"Profibus is based on which international standard?","options":["IEC 61158","IEEE 802.3","ISO 9001","IEC 61850"],"answer":[0],"explanation":"Lecture 29 (Connectivity - Part 2): Profibus 'is based on ... IEC 61158'.","verified":"lecture","c":1101},{"q":"What is the Availability requirement for uRLLC?","options":["90% availability","99% availability","99.9999% availability (6-nines)","50% availability"],"answer":[2],"explanation":"Lecture 30 (Connectivity - Part 3): URLLC 'availability in the order of 99.9999 percent'.","verified":"lecture","c":1102},{"q":"What is the end-to-end round trip latency supported by the Tactile Internet?","options":["< 10 ms","< 1 ms","< 100 ms","< 250 ms"],"answer":[1],"explanation":"Lecture 30 (Connectivity - Part 3): tactile internet < 1 ms RTT.","verified":"lecture","c":1103},{"q":"Which frequency bands are used by 5G NR?","options":["Only below 1 GHZ","Low band (< 1 GHz), middle band (1-6 GHz), and high band (>24 GHz) millimeter wave","Only Wi-Fi bands","Satellite communication bands"],"answer":[1],"explanation":"Lecture 30 (Connectivity - Part 3): 5G NR bands with high band > 24 GHz (mmWave); low < 1 GHz and mid 1-6 GHz.","verified":"lecture","c":1104},{"q":"State true or false. The PROFINet protocol handles data transmission of large packets between PLCs and PCs, as well as enable integration with the Internet and Intranet through Ethernet.","options":["True","False"],"answer":[0],"explanation":"Lecture 28 (Connectivity - Part 1) says Profinet is an Industrial Ethernet standard connecting controllers and field devices; Ethernet-based large-packet PLC-PC transfer with Internet/intranet integration fits, so True.","verified":"reasoning","c":1105},{"q":"Fill in the blanks. DeviceNet was designed by Rockwell Automation to enable communications between ______ and ______.","options":["PLCs, field devices","PLCs, human-machine interfaces (HMIs)","Routers, enterprise servers","SCADA systems, cloud platforms"],"answer":[0],"explanation":"Lecture 29 (Connectivity - Part 2): DeviceNet 'links different sensors actuators with PLCs' (designed by Allen-Bradley/Rockwell).","verified":"reasoning","c":1106}]},{"year":2025,"session":"Jul-Oct 2025","week":7,"source":"https://www.youtube.com/watch?v=s6P5CMg3deY","questions":[{"q":"Which modulation technique does LoRa use?","options":["Amplitude Modulation","Frequency Modulation","Chirp Spread Spectrum","Time Division Multiplexing"],"answer":[2],"explanation":"Chirp Spread Spectrum (Lecture 31: Key Enablers of IIoT: Connectivity – Part 4 (LoRa/SIGFOX + NodeMCU demo)).","verified":"lecture","c":1107},{"q":"Fill in the blanks. SIGFOX network give a performance of upto ______ messages per day with a payload of ______ bytes per message.","options":["140, 12","50, 2","60, 3","100, 10"],"answer":[0],"explanation":"'up to 140 messages per day, with a payload of 12 bytes' (Lecture 31: Key Enablers of IIoT: Connectivity – Part 4 (LoRa/SIGFOX + NodeMCU demo)).","verified":"lecture","c":1108},{"q":"What is the key difference between a Zigbee Router and a Zigbee End Device?","options":["A router can relay information to other nodes, while an end device cannot.","An end device is the root of the network, while a router is not.","A router can only connect to a coordinator, while an end device can connect to any node.","There is no functional difference between them."],"answer":[0],"explanation":"'The router basically relays the information ... end devices ... no relaying' (Lecture 32: Key Enablers of IIoT: Connectivity – Part 5 (Zigbee/Xbee demo)).","verified":"lecture","c":1109},{"q":"What software tool is used to configure Xbee modules before communication?","options":["Arduino IDE","Python","XCTU","Wireshark"],"answer":[2],"explanation":"XCTU (Lecture 32: Key Enablers of IIoT: Connectivity – Part 5 (Zigbee/Xbee demo)).","verified":"lecture","c":1110,"rel":[["Jul-Oct 2026",7,0]]},{"q":"Which characteristic of IIoT data refers to the fact that it comes from heterogeneous sensors with different metrics, precision, and formats?","options":["Real-time","Dynamic heterogeneity","Polymorphism","Correlation"],"answer":[2],"explanation":"'massive polymorphism ... heterogeneous data ... different formats, precision levels ... metrics' (Lecture 33: Key Enablers of IIoT: Processing – Part 1).","verified":"lecture","c":1111},{"q":"What is the role of middleware in an IIoT system?","options":["It is the physical hardware layer of sensors and actuators.","It is the final user-facing application.","It is the communication protocol for data transfer.","It is a software layer between the infrastructure and application layers that provides services and supports heterogeneity."],"answer":[3],"explanation":"Middleware definition (Lecture 33: Key Enablers of IIoT: Processing – Part 1).","verified":"lecture","c":1112},{"q":"Which type of analytics answers the question, \"What will happen and why?\"","options":["Predictive","Descriptive","Diagnostic","Prescriptive"],"answer":[0],"explanation":"Predictive analytics: 'what will happen and why' (Lecture 33: Key Enablers of IIoT: Processing – Part 1, slide label; narration slips the name).","verified":"lecture","c":1113},{"q":"Which type of analytics aims to determine the best possible business decision?","options":["Predictive","Descriptive","Diagnostic","Prescriptive"],"answer":[3],"explanation":"Prescriptive: 'the outcome is the best possible business decision' (Lecture 33: Key Enablers of IIoT: Processing – Part 1).","verified":"lecture","c":1114},{"q":"What is the primary goal of the FarmBeats platform?","options":["To manage smart city infrastructure","To enable data-driven precision agriculture","To automate cognitive manufacturing","To monitor the health of vineyards"],"answer":[1],"explanation":"FarmBeats: data-driven precision agriculture (Lecture 34: Key Enablers of IIoT: Processing – Part 2).","verified":"lecture","c":1115},{"q":"In the iRobot-Factory architecture, which component is responsible for cloud-based, high-performance, long-term data analytics using AI?","options":["Intelligent Terminal","Cognitive Engine","Edge Computing Node","Intelligent Device Unit"],"answer":[1],"explanation":"All iRobot-Factory components 'interacting with this cloud based cognitive engine' (Lecture 34: Key Enablers of IIoT: Processing – Part 2).","verified":"lecture","c":1116,"rel":[["Jul-Oct 2026",7,0]]},{"q":"In an Industrial Control System, what are the \"Set Points\"?","options":["The standard values of process parameters for controlled operation","The values of process parameters measured by sensors","The process variables that are modified by the controller","The final output of the industrial process"],"answer":[0],"explanation":"'set points are basically the standard values of the process parameters for controlled operation' (Lecture 35: Key Enablers of IIoT: Process Control).","verified":"lecture","c":1117},{"q":"Which of the following best describes a Closed Loop (Feedback) Control system?","options":["The control decision is made without considering the process variable","It operates independently of the measured output","The control decision depends on the measured value of the process variable","It is not used in industrial automation"],"answer":[2],"explanation":"'in the closed loop mechanism the control decision basically depends on the measured value of the process variable' (Lecture 35: Key Enablers of IIoT: Process Control).","verified":"lecture","c":1118},{"q":"Fill in the blanks. Programmable Logic Controllers (PLCs) comprises of ______.","options":["Processor unit, memory unit, power supply and communication modules","Sensor array, signal generator, analog filter, and PLC terminal","Actuator controller, logic gate module, and cooling system","Voltage regulator, touchscreen unit, hard disk, and keyboard interface"],"answer":[0],"explanation":"PLC 'comprises of a processor unit a memory unit power supply and communication modules' (Lecture 35: Key Enablers of IIoT: Process Control).","verified":"lecture","c":1119},{"q":"Which of the following statements about the DHT sensor in IoT applications is correct?","options":["It measures only temperature and requires no external library.","It measures both humidity and temperature, and Adafruit provides a dedicated library for its use.","It measures pressure and temperature using built-in Python functions.","It measures humidity only and is used exclusively for industrial automation and does not need external support."],"answer":[1],"explanation":"DHT = digital humidity and temperature sensor; 'adafruit library ... will make this DHT 22 sensor to work' (Lecture 31: Key Enablers of IIoT: Connectivity – Part 4 (LoRa/SIGFOX + NodeMCU demo)).","verified":"lecture","c":1120},{"q":"Which of the following best describes the role of a SCADA system in industrial processes?","options":["It is only a hardware-based system for controlling pumps and valves locally.","It enables real-time remote monitoring and control of industrial processes using sensors and actuators, with data visualization through HMI.","It is a vendor-specific communication protocol designed only for power plants.","It functions as a replacement for PLCs without data logging or visualization features."],"answer":[1],"explanation":"SCADA used for supervisory remote monitoring/control with HMI, sensors, actuators (Lecture 35: Key Enablers of IIoT: Process Control).","verified":"lecture","c":1121}]},{"year":2025,"session":"Jul-Oct 2025","week":8,"source":"https://www.youtube.com/watch?v=uINuCD_3E0A","questions":[{"q":"What is the goal of prognostic analytics in IIoT?","options":["Identify root cause of an anomaly","Inform about remaining useful life of an asset","Detect real-time behavior","Filter low-quality data"],"answer":[1],"explanation":"'prognostic analytics basically inform about the remaining useful life of an asset' (Lecture 36: IIoT Analytics and Data Management: Introduction).","verified":"lecture","c":1122},{"q":"What are the three types of IIoT Analytics?","options":["Logical, Statistical, and Neural","Predictive, Adaptive, and Reactive","Descriptive, Predictive, and Prescriptive","Linear, Non-linear, and Mixed"],"answer":[2],"explanation":"Descriptive, predictive, prescriptive (Lecture 36: IIoT Analytics and Data Management: Introduction).","verified":"lecture","c":1123,"rel":[["Jul-Oct 2023",8,0]]},{"q":"What is a key difference between the process of Machine Learning and Deep Learning?.","options":["Machine Learning uses neural networks, while Deep Learning does not.","Deep Learning requires the \"Feature extraction\" step, while Machine Learning does not.","Machine Learning requires manual feature extraction, while Deep Learning learns features automatically.","Deep Learning is a type of unsupervised learning only"],"answer":[2],"explanation":"ML needs feature extraction; DL learns features automatically (Lecture 36: IIoT Analytics and Data Management: Introduction, Lecture 38: Machine Learning and Data Science – Part 2).","verified":"lecture","c":1124},{"q":"According to the Venn diagram, Data Science is the intersection of Computer Science, Domain Expertise, and what other field?","options":["Mathematics and Statistical Research","Mechanical Engineering","Business Management","Psychology"],"answer":[0],"explanation":"Data science = intersection of mathematics, computer science, domain expertise (Lecture 37: Machine Learning and Data Science – Part 1).","verified":"lecture","c":1125},{"q":"Supervised learning is divided into two main types of problems. What are they?","options":["Clustering and Association","K-Means and Fuzzy c-Means","State and Action","Regression and Classification"],"answer":[3],"explanation":"'supervised learning ... one technique is to basically classify the other one is to do regression' (Lecture 37: Machine Learning and Data Science – Part 1).","verified":"lecture","c":1126},{"q":"In Reinforcement Learning, what does an \"agent\" learn from?","options":["An environment by taking actions and receiving rewards or penalties","An unlabeled dataset with hidden patterns","A labeled dataset provided by a supervisor","A set of predefined rules"],"answer":[0],"explanation":"Agent learns by interacting with environment, which rewards or penalizes actions (Lecture 37: Machine Learning and Data Science – Part 1).","verified":"lecture","c":1127},{"q":"How does the performance of Deep Learning typically compare to traditional Machine Learning as the amount of data increases?","options":["The performance of both levels off at the same point.","Traditional ML performance continues to improve, while DL performance levels off","DL performance often continues to improve with more data, while traditional ML performance may level off.","Both show decreased performance with more data"],"answer":[2],"explanation":"'DL ... performance improves whereas ML ... will gradually come to a stagnation' (Lecture 38: Machine Learning and Data Science – Part 2).","verified":"lecture","c":1128},{"q":"The deep learning concept of breaking a complex task into simpler tasks follows what principle?","options":["A nested hierarchy of concepts","A linear regression model","Random decision making","A last-in, first-out stack"],"answer":[0],"explanation":"'deep learning also follows the concept of nested hierarchy. And it makes the complex tasks into simpler tasks' (Lecture 38: Machine Learning and Data Science – Part 2).","verified":"lecture","c":1129},{"q":"Which of the following statements about MindSphere is false?","options":["It is a cloud-based operating system platform for IoT.","It offers enterprise-oriented solutions.","It is an open platform-as-a-service that integrates with AWS.","It is a mobile app used only for home automation."],"answer":[3],"explanation":"MindSphere: cloud-based OS for IoT, open PaaS with AWS, enterprise oriented (Lecture 39: Cloud Computing in IIoT – Part 1).","verified":"lecture","c":1130,"rel":[["Jan-Apr 2025",8,0]]},{"q":"What is a major reason for needing cloud computing in IIoT?","options":["To decrease the number of connected devices.","To handle the huge amount of unorganized and heterogeneous data, including data from M2M sensors.","To ensure all data has the same quality.","To reduce the need for networking"],"answer":[1],"explanation":"IIoT data is unstructured, heterogeneous machine/sensor data in huge volumes (Lecture 39: Cloud Computing in IIoT – Part 1).","verified":"lecture","c":1131},{"q":"Which IIoT platform, offered by a software firm, provides a storage service called C3 Data Lake for unstructured data?","options":["GE Predix","Siemens MindSphere","C3 IoT","Uptake"],"answer":[2],"explanation":"'stored in something called the C3 Data Lake' (Lecture 40: Cloud Computing in IIoT – Part 2).","verified":"lecture","c":1132},{"q":"Which of the following is a characteristic of a good SLA?","options":["Vague and unmeasurable","Unachievable","Uncontrollable","Quantifiable and Mutually Acceptable"],"answer":[3],"explanation":"Good SLA: quantifiable, mutually acceptable ... (Lecture 40: Cloud Computing in IIoT – Part 2).","verified":"lecture","c":1133,"rel":[["Jan-Apr 2023",8,0],["Jul-Oct 2023",8,0]]},{"q":"Which of the following represents the characteristics of a good SLA?","options":["Affordable","Achievable","Quantifiable","All of these"],"answer":[3],"explanation":"Achievable, meaningful, quantifiable, controllable, mutually acceptable, affordable (Lecture 40: Cloud Computing in IIoT – Part 2).","verified":"lecture","c":1134},{"q":"State true or false. Based on the application type, two popular types of deep learning methods are convolutional neural networks (CNNs) and recurrent neural networks (RNNs).","options":["True","False"],"answer":[0],"explanation":"Not in the original lectures; CNNs (spatial/image) and RNNs (sequential) are the two standard DL families by application type.","verified":"reasoning","c":1135},{"q":"Which of the following are the key characteristics that classify data as Big Data in IoT applications?","options":["Accuracy, redundancy, scalability, latency, security","Volume, variety, value, velocity, veracity","Throughput, delay, integrity, topology, clustering","Capacity, compatibility, complexity, connectivity, coverage"],"answer":[1],"explanation":"Lecture 36: IIoT Analytics and Data Management: Introduction lists volume, velocity, variability, veracity, variety; (b) is the only option made of big-data V's.","verified":"reasoning","c":1136}]},{"year":2025,"session":"Jul-Oct 2025","week":9,"source":"https://www.youtube.com/watch?v=RwU9s_EEW2g","questions":[{"q":"In the Fog Computing architecture for IIoT, where are the Fog Devices located?","options":["Above the Cloud layer.","Between the Cloud and the Industrial End Devices.","As part of the Industrial End Devices.","Inside the Cloud."],"answer":[1],"explanation":"Lecture 41 (Fog Computing in IIoT): fog layer sits between the edge devices and the cloud.","verified":"lecture","c":1137},{"q":"Which of the following is not a fog platform provider?","options":["FogHorn","Nebbiolo Technologies","Crosser","Sony"],"answer":[3],"explanation":"Lecture 41 (Fog Computing in IIoT): providers FogHorn, Nebbiolo, Crosser, Sonm - not Sony.","verified":"lecture","c":1138,"rel":[["Jul-Oct 2023",9,0],["Jul-Oct 2024",9,0]]},{"q":"Which command in R programming is used to see the list of reserved words like \"if\", \"else\", \"TRUE\", and \"NULL\"?","options":["?reserved","list.reserved()","show.words()","getKeywords()"],"answer":[0],"explanation":"Lecture 42 (Tutorial for R & Julia): 'if you type in question mark reserved or help reserved ... you are going to get these reserved words'.","verified":"lecture","c":1139},{"q":"What is the result of the following expression in R programming, if N is a vector containing integers from 1 to 10? 15 %in% N","options":["TRUE","1","FALSE","An error"],"answer":[2],"explanation":"Lecture 42 (Tutorial for R & Julia): %in% checks whether an element belongs to a vector; 15 is not in 1:10 so FALSE.","verified":"lecture","c":1140},{"q":"Which of the following is NOT a data structure in Julia programming?","options":["Tuples","Dictionary","Coroutine","Arrays"],"answer":[2],"explanation":"Lecture 42 (Tutorial for R & Julia): Julia data structures shown: tuples, dictionaries, arrays.","verified":"lecture","c":1141},{"q":"Which of the following does NOT fall under the essential characteristics of cloud computing according to NIST?","options":["On-demand self-service","Broad network access","Resource pooling","Manual server configuration"],"answer":[3],"explanation":"Lecture 43 (Data Management with Hadoop): NIST characteristics on-demand self-service, broad network access, resource pooling, rapid elasticity, measured service.","verified":"lecture","c":1142,"rel":[["Jan-Apr 2024",9,0]]},{"q":"Which of the following does NOT represent a NoSQL database?","options":["Key-value databases","Column-oriented databases","Document-oriented databases","Relational databases"],"answer":[3],"explanation":"Lecture 43 (Data Management with Hadoop): NoSQL = key-value, column-oriented, document-oriented; relational tables use SQL.","verified":"lecture","c":1143},{"q":"State true or false. In Hadoop Distributed File System (HDFS), the Namenode stores the actual data blocks, while Datanodes maintain the metadata information about the files.","options":["True","False"],"answer":[1],"explanation":"Lecture 43 (Data Management with Hadoop): 'name node ... maintains all this meta data ... data nodes ... store the actual data' - reversed, so False.","verified":"lecture","c":1144},{"q":"Which property of a DCN refers to its ability to support any service on any server at any time?","options":["Security","Reliability","Scalability","Agility"],"answer":[3],"explanation":"Lecture 44 (Data Center Networks): 'agility property means that a data centre network should be able to provide any kind of service on any server at any time'.","verified":"lecture","c":1145},{"q":"What is the main architectural difference between the DCell/BCube topologies and the traditional Three-Tier topology?","options":["DCell and BCube are server-centric, providing better scalability and fault tolerance.","DCell and BCube are switch-centric, while the Three-Tier topology is servercentric.","DCell and BCube use a single core switch, creating a single point of failure.","The Three-Tier topology provides better server-to-server bandwidth."],"answer":[0],"explanation":"Lecture 44 (Data Center Networks): BCube is 'a server centric approach rather than a switch centric'; DCell recursively interconnects servers, fault tolerant, no single point of failure.","verified":"lecture","c":1146},{"q":"What is the core principle of a Software-Defined Data Center (SDDC)?","options":["All hardware must be from a single vendor.","The data center infrastructure is virtualized and abstracted from the underlying hardware.","The control and data planes are tightly coupled within the hardware.","It relies on manual configuration for all provisioning and operations."],"answer":[1],"explanation":"Lecture 44 (Data Center Networks): SDDC = virtualized data centres, logical instances beyond the physical ones.","verified":"lecture","c":1147},{"q":"In the SDN architecture, which plane contains the physical forwarding devices (switches and routers)?","options":["Data Plane","Control Plane","Application Plane","Management Plane"],"answer":[0],"explanation":"Lecture 45 (SDN in IIoT Part 1): 'layer 1 devices are like forwarding devices like your routers' (data layer).","verified":"lecture","c":1148},{"q":"Which protocol is commonly used to facilitate communication between the SDN controller and the forwarding devices?","options":["OpenFlow","BGP","TCP/IP","HTTP"],"answer":[0],"explanation":"Lecture 45 (SDN in IIoT Part 1): OpenFlow is the southbound protocol supporting SDN.","verified":"lecture","c":1149},{"q":"Which of the following software platforms is commonly required to perform executions on semi- structured data such as JSON or NoSQL?","options":["Oracle RDBMS","Microsoft Excel","Apache Hadoop","PowerPoint"],"answer":[2],"explanation":"Lecture 43 (Data Management with Hadoop): Hadoop/MapReduce with NoSQL handles unstructured/semi-structured big data.","verified":"lecture","c":1150},{"q":"In Industry 4.0, why is Big Data analytics essential for handling the huge amount of data generated by IoT devices and sensors?","options":["To eliminate the use of IoT devices in operation","To store data only in traditional relational databases","To extract actionable insights for predictive maintenance, process optimization, and quality control","To eliminate the need for cloud and fog computing in smart factories"],"answer":[2],"explanation":"Big data analytics extracts actionable insights (predictive maintenance, optimization, quality control) - the only sensible option.","verified":"reasoning","c":1151}]},{"year":2025,"session":"Jul-Oct 2025","week":10,"source":"https://www.youtube.com/watch?v=Ad2155oC6qE","questions":[{"q":"State true or false. The main role of uSDN in the SD-6TISCH protocol stack is to minimize control overhead.","options":["True","False"],"answer":[0],"explanation":"Lecture 46 (SDN in IIoT Part 2): micro-SDN 'capable of reducing the control plane overhead'.","verified":"lecture","c":1152},{"q":"In SD-IIoT (Software Defined Industrial IoT) Architecture, network monitoring is performed by which of the following component?","options":["Application","Data Plane","Control Plane","All of these"],"answer":[2],"explanation":"Lecture 46 (SDN in IIoT Part 2): control plane includes 'network monitoring, ... data transmission service and management and optimization'.","verified":"lecture","c":1153},{"q":"What are the basic goals of information security?","options":["Facilitate Availability, Integrity, and Confidentiality","Increase production cost, and promote manual operations only","Decrease scalability, interoperability, and real-time performance","Increase latency, and minimize throughput"],"answer":[0],"explanation":"Lecture 47 (Security in IIoT Part 1): 'basic security goals ... availability ... integrity ... confidentiality'.","verified":"lecture","c":1154},{"q":"Which of the following represents the \"Resilience\" aspect of a Trustworthy IIoT system?","options":["Safe operations of devices and people without risks and injury","Protecting the system from unauthorized access, modification, and destruction","Ability of the system to function correctly under dynamic adversarial conditions","Restriction on data access - who can access and by whom it can be disclosed"],"answer":[2],"explanation":"Lecture 47 (Security in IIoT Part 1): 'Resilience ... system is able to function correctly on ... dynamic adversarial conditions'.","verified":"lecture","c":1155},{"q":"Which of the following is NOT a security requirement for Cloud Complied IIoT?","options":["OT infrastructure is controlled and managed at external networked cloud","Data from thousands of devices stored in the cloud","Third-party services with trust-boundaries for security and privacy","Completely eliminating the need to safeguard control systems from incoming cloud information flow"],"answer":[3],"explanation":"Lecture 47 (Security in IIoT Part 1): cloud is third party - extend trust boundaries and 'safeguard the control systems ... from the incoming cloud information flow'.","verified":"lecture","c":1156},{"q":"Which of the following statements is incorrect about the protection of fog devices in IIoT?","options":["Fog devices require the same security measures as end devices.","Standard cryptographic protocols are used for authentication between fog devices and the cloud.","Lightweight cryptography is recommended for authenticating end devices.","Fog devices serve only as storage units without computing capability."],"answer":[3],"explanation":"Lecture 48 (Security in IIoT Part 2): fog devices are semi-constrained with computing/storage and need crypto for authentication; not mere storage units.","verified":"lecture","c":1157},{"q":"Which of the following standards is specifically associated with industrial automation and control systems security (OT security)?","options":["ISO/IEC 15408","NIST SP 800-144","IEC 62443","ISO 27017"],"answer":[2],"explanation":"Lecture 48 (Security in IIoT Part 2): 'IEC 62443 which is an industrial automation and control system security standard'.","verified":"lecture","c":1158,"rel":[["Jan-Apr 2025",10,1]]},{"q":"Which of the following is incorrect about the security requirements in Healthcare IoT?","options":["Device data protection can involve passwords, signatures, and digital certificates.","Communication data is secured using techniques like ciphering and hashing.","Data stored in the cloud may be protected with access control lists, signatures, and digital certificates.","Security management in Healthcare IoT completely avoids cloud involvement to minimize risks."],"answer":[3],"explanation":"Lecture 48 (Security in IIoT Part 2): healthcare security management includes 'global security handling at the cloud'.","verified":"lecture","c":1159},{"q":"Which company launched Construction Internet of Things to monitor large sites?","options":["Kuka","DeWalt","Maersk","ABB"],"answer":[1],"explanation":"Lecture 49 (Factories and Assembly Line): 'construction internet of things ... by the company DeWalt'.","verified":"lecture","c":1160},{"q":"Which of the following is NOT a feature of a Smart Factory?","options":["Continuous real-time data","Maximize manual intervention","Prediction of future outcomes for takin
