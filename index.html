<script>
(function(){
"use strict";
const D = window.QUIZ_DATA || {sets:[]};
const C = window.COURSE || {lskey: 'quiz', meta: '', heading: 'Quiz', note: '', nav: []};
const app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s ?? '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
const LS = {
  get(k, d){ try { const v = localStorage.getItem(C.lskey+':'+k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(C.lskey+':'+k, JSON.stringify(v)); } catch(e){} }
};
const hash = s => { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36); };
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const LETTERS = 'ABCDEFGH';
const pad = n => String(n).padStart(2, '0');

// ---- data prep
const sessKey = s => { const y = +((String(s).match(/\d{4}/) || [0])[0]); return y + (/jul|aug|sep|oct/i.test(s) ? 0.5 : 0); };
const sets = (D.sets || []).filter(s => s.questions && s.questions.length).map(s => ({...s, id: (s.session + '|w' + s.week).replace(/\s+/g, '_')}))
  .sort((a, b) => sessKey(b.session) - sessKey(a.session) || a.week - b.week);
const sessions = [...new Set(sets.map(s => s.session))];
const allQ = [];
sets.forEach(s => s.questions.forEach(q => {
  q.key = hash(norm(q.q) + '|' + q.options.map(norm).sort().join('|'));
  q.origin = s.session + ' · Week ' + s.week;
  q.source = q.source || s.source;
  q.week = s.week;
  q.sess = s.session;
  q.rel = (q.rel || []).sort((a, b) => sessKey(b[0]) - sessKey(a[0]));
  q.runs = 1 + new Set(q.rel.map(r => r[0])).size;
  q.tier = q.runs >= 3 ? 2 : q.runs === 2 ? 1 : 0;
  q.unsure = q.verified ? q.verified === 'unsure' : /uncertain|verify|caution|not confirmed|unconfirmed|could not (be )?confirm|couldn.t confirm|unverified|judg(e)?ment call|only one source|single source|beubihar lists|progiez lists|arguably|another .*video .*marked|source answer false|videos split|judged wrong|chose [a-d]\b.*\bchose [a-d]\b|but this is corrected/i.test(q.explanation || '');
  allQ.push(q);
}));
// sets are newest-first, so each repeat cluster keeps its newest wording
const uniqueQ = []; { const seen = new Set(); allQ.forEach(q => { if (!seen.has(q.c)) { seen.add(q.c); uniqueQ.push(q); } }); }
const byKey = new Map(); allQ.forEach(q => { if (!byKey.has(q.key)) byKey.set(q.key, q); });
const focusN = t => uniqueQ.filter(q => q.tier === t).length;
const weeksAvail = [...new Set(sets.map(s => s.week))].sort((a, b) => a - b);

// ---- persistent prefs
const S = {
  view: 'home',
  tab: LS.get('tab', 'all'),
  mode: LS.get('mode', 'practice'),
  shuf: LS.get('shuf', false),
  drillWeeks: LS.get('dw', weeksAvail),
  drillRuns: LS.get('dr', sessions),
  drillCount: LS.get('dc', 20),
  uniq: LS.get('uniq', true),
  pool: LS.get('dp', 'all'),
  quiz: null
};
if (S.tab !== 'all' && !sessions.includes(S.tab)) S.tab = 'all';
S.drillRuns = S.drillRuns.filter(x => sessions.includes(x));
if (!S.drillRuns.length && !LS.get('dr', null)) S.drillRuns = sessions.slice();
const best = () => LS.get('best', {});
const mistakes = () => LS.get('miss', []);
function setMistake(key, wrong){
  let m = mistakes().filter(k => k !== key);
  if (wrong) m.unshift(key);
  LS.set('miss', m.slice(0, 1000));
}
function lampLevel(r){ if (!r) return ''; const p = r.s / r.n; return p >= .8 ? 'g' : p >= .5 ? 'a' : 'r'; }
const flag = q => q.verified === 'official' ? '<span class="ok-chip" title="NPTEL showed this as the accepted answer after the deadline.">NPTEL accepted answer</span>' : q.verified === 'lecture' ? '<span class="ok-chip" title="This answer was checked against what the lecture says.">Checked against lecture</span>' : q.unsure ? '<span class="flag" title="No official key found for this one. Check it against the lecture slides.">Check this answer</span>' : '';
const imp = q => q.tier === 2 ? `<span class="imp t2" title="Same question or topic asked in ${q.runs} course runs">Must know · ${q.runs} runs</span>`
  : q.tier === 1 ? '<span class="imp t1" title="Same question or topic asked in 2 course runs">Repeated</span>' : '';
const relHTML = q => q.rel.length ? `<div class="relq">Also asked in: ${q.rel.map(r => esc(r[0]) + ' W' + r[1] + (r[2] ? '' : ' (reworded)')).join(' · ')}</div>` : '';
const lamp = l => `<span class="lamp" data-l="${l}" aria-hidden="true"><i></i><i></i><i></i></span>`;

let toastT;
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 1800); }

// ---- quiz construction
function buildItem(q){
  // a single "option" is a typed answer (numeric fill-in)
  if (q.options.length === 1) return {q, opts: [{t: q.options[0], c: true}], numeric: true, value: '', multi: false, chosen: [], checked: false};
  let opts = q.options.map((t, i) => ({t, c: q.answer.includes(i)}));
  const fixed = opts.some(o => /(all|none|both|neither) of (the )?(the )?(above|these)|^both|^none|^all of/i.test(o.t));
  if (S.shuf && !fixed) opts = shuffle(opts);
  return {q, opts, multi: q.answer.length > 1, chosen: [], checked: false};
}
function startQuiz(title, questions, extra = {}){
  if (!questions.length) { toast('No questions match that selection.'); return; }
  S.quiz = {title, items: questions.map(buildItem), i: 0, mode: extra.mode || S.mode, finished: false, setId: extra.setId || null, review: !!extra.review};
  S.view = 'quiz';
  render(); window.scrollTo(0, 0);
}
function startSet(id){ const s = sets.find(x => x.id === id); startQuiz(s.session + ' · Week ' + s.week, s.questions, {setId: s.id}); }
function drillPool(){
  const weeks = new Set(S.drillWeeks), runs = new Set(S.drillRuns);
  const minTier = {all: 0, rep: 1, must: 2}[S.pool] || 0;
  let pool = allQ.filter(q => runs.has(q.sess) && weeks.has(q.week) && q.tier >= minTier);
  // allQ is newest-first, so skipping repeats keeps the newest wording
  if (S.uniq) { const seen = new Set(); pool = pool.filter(q => !seen.has(q.c) && seen.add(q.c)); }
  return pool;
}
function startDrill(){
  let pool = shuffle(drillPool());
  if (S.drillCount !== 'all') pool = pool.slice(0, +S.drillCount);
  const runs = S.drillRuns.length === sessions.length ? 'All runs' : S.drillRuns.join(', ');
  startQuiz('Mixed drill · ' + runs + ' · Weeks ' + compactWeeks(S.drillWeeks.slice()), pool);
}
function nextSet(id){
  const i = sets.findIndex(x => x.id === id), n = sets[i + 1];
  return i >= 0 && n && n.session === sets[i].session ? n : null;
}
function nextBtn(){
  const n = S.quiz.setId && nextSet(S.quiz.setId);
  return n ? `<button class="btn primary" data-act="nextweek">Next: Week ${pad(n.week)} →</button>` : '';
}
function startFocus(minTier, mode){
  let qs = uniqueQ.filter(q => q.tier >= minTier);
  qs = mode === 'study' ? qs.slice().sort((a, b) => b.runs - a.runs || a.week - b.week) : shuffle(qs);
  startQuiz(minTier === 2 ? 'Must know · asked in 3+ runs' : 'Repeated questions · asked in 2+ runs', qs, mode ? {mode} : {});
}
function startMistakes(){
  const qs = mistakes().map(k => byKey.get(k)).filter(Boolean);
  startQuiz('Mistake review', shuffle(qs), {review: true});
}
function compactWeeks(w){
  w = w.sort((a, b) => a - b); const out = []; let s = w[0], p = w[0];
  for (let i = 1; i <= w.length; i++) { if (w[i] === p + 1) { p = w[i]; continue; } out.push(s === p ? s : s + '–' + p); s = p = w[i]; }
  return out.join(', ');
}
const toNum = v => parseFloat(String(v).replace(/,/g, '').trim());
function sameAnswer(v, t){
  const a = toNum(v), b = toNum(t);
  if (isFinite(a) && isFinite(b)) return Math.abs(a - b) <= Math.max(1e-6, Math.abs(b) * 0.01);
  return norm(v) !== '' && norm(v) === norm(t);
}
const isRight = it => { if (it.numeric) return sameAnswer(it.value, it.opts[0].t); const want = it.opts.map((o, i) => o.c ? i : -1).filter(i => i >= 0); return want.length === it.chosen.length && want.every(i => it.chosen.includes(i)); };

function choose(idx){
  const Q = S.quiz, it = Q.items[Q.i];
  if (it.checked) return;
  if (it.multi) it.chosen = it.chosen.includes(idx) ? it.chosen.filter(x => x !== idx) : [...it.chosen, idx];
  else it.chosen = [idx];
  if (Q.mode === 'practice' && !it.multi) return check();
  render();
}
function check(){
  const it = S.quiz.items[S.quiz.i];
  if (!it.chosen.length || it.checked) return;
  it.checked = true;
  setMistake(it.q.key, !isRight(it));
  render();
}
function go(n){ const Q = S.quiz; Q.i = Math.max(0, Math.min(Q.items.length - 1, n)); render(); }
function finish(){
  const Q = S.quiz;
  if (Q.mode === 'exam') Q.items.forEach(it => { if (!it.checked) { it.checked = true; if (it.chosen.length) setMistake(it.q.key, !isRight(it)); } });
  Q.finished = true;
  const s = Q.items.filter(isRight).length, n = Q.items.length;
  if (Q.setId) { const b = best(); if (!b[Q.setId] || s / n > b[Q.setId].s / b[Q.setId].n) { b[Q.setId] = {s, n}; LS.set('best', b); } }
  render(); window.scrollTo(0, 0);
}

// ---- views
function header(){
  return `<header class="top">
    <div class="brand">${C.nav.length > 1 ? `<nav class="courses" aria-label="Courses">${C.nav.map(c => c.current ? `<b>${esc(c.name)}</b>` : `<a href="${esc(c.href)}">${esc(c.name)}</a>`).join('')}</nav>` : ''}
      <div class="label">${esc(C.meta)}</div>
      <h1>${C.heading}</h1></div>
    <div class="meters">
      <div class="meter"><b>${sessions.length}</b><small>course runs</small></div>
      <div class="meter"><b>${sets.length}</b><small>weekly sets</small></div>
      <div class="meter"><b>${uniqueQ.length}</b><small>unique questions</small></div>
      <div class="meter"><b>${mistakes().filter(k => byKey.has(k)).length}</b><small>to review</small></div>
    </div></header>`;
}
function sidebar(){
  const missN = mistakes().filter(k => byKey.has(k)).length;
  const modeHint = {practice: 'Answer is checked as soon as you pick.', exam: 'No feedback until you submit, like the real assignment.', study: 'Answer sheet: every question shown with its answer.'}[S.mode];
  return `<aside>
    <section class="panel"><h2>Mode</h2>
      <div class="seg" role="group" aria-label="Quiz mode">
        ${['practice', 'exam', 'study'].map(m => `<button data-mode="${m}" aria-pressed="${S.mode === m}">${m[0].toUpperCase() + m.slice(1)}</button>`).join('')}
      </div>
      <p class="hintline">${modeHint}</p>
      <label class="check"><input type="checkbox" id="opt-shuf" ${S.shuf ? 'checked' : ''}> Shuffle answer options</label>
    </section>
    <section class="panel"><h2>Mixed drill</h2>
      <div class="pickhead"><span class="label">Runs</span><span><button class="linkish" data-drall="1">All</button> · <button class="linkish" data-drall="0">None</button></span></div>
      <div class="runpick">${sessions.map((ss, i) => `<label><input type="checkbox" id="dr-${i}" data-dr="${esc(ss)}" ${S.drillRuns.includes(ss) ? 'checked' : ''}><span>${esc(ss)}</span></label>`).join('')}</div>
      <div class="label" style="margin:14px 0 8px">Weeks</div>
      <div class="weekpick">${weeksAvail.map(w => `<label><input type="checkbox" id="dw-${w}" data-dw="${w}" ${S.drillWeeks.includes(w) ? 'checked' : ''}><span>${pad(w)}</span></label>`).join('')}</div>
      <div class="row" style="justify-content:space-between">
        <button class="linkish" data-dwall="1">All</button><button class="linkish" data-dwall="0">None</button>
        <span class="sp" style="flex:1"></span>
        <label for="dc" class="label">Questions</label>
        <select id="dc">${['10', '20', '30', '50', 'all'].map(v => `<option value="${v}" ${String(S.drillCount) === v ? 'selected' : ''}>${v === 'all' ? 'All' : v}</option>`).join('')}</select>
      </div>
      <div class="row"><label for="dp" class="label">From</label>
        <select id="dp">${[['all', 'All questions'], ['rep', 'Repeated only'], ['must', 'Must know only']].map(([v, t]) => `<option value="${v}" ${S.pool === v ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
      <label class="check"><input type="checkbox" id="opt-uniq" ${S.uniq ? 'checked' : ''}> Skip repeats across years</label>
      <button class="btn primary block" data-act="drill" ${S.drillWeeks.length && S.drillRuns.length ? '' : 'disabled'}>Start mixed drill</button>
      <p class="hintline">${drillPool().length} questions match these choices</p>
    </section>
    <section class="panel"><h2>Mistakes</h2>
      <p class="hintline" style="margin-top:0">${missN ? `${missN} question${missN > 1 ? 's' : ''} you got wrong. Answer one right and it leaves this list.` : 'Questions you get wrong collect here.'}</p>
      <button class="btn block" data-act="miss" ${missN ? '' : 'disabled'}>Review mistakes</button>
      ${missN ? '<button class="linkish" data-act="clearmiss" style="margin-top:8px">Clear list</button>' : ''}
    </section>
  </aside>`;
}
function weekCard(s){
  const b = best()[s.id];
  return `<div class="wk">
    <div class="wk-top"><span class="wk-num">Week ${pad(s.week)}</span>${lamp(lampLevel(b))}</div>
    <div class="wk-meta"><span>${s.questions.length} Qs</span><span class="mono">${b ? 'best ' + b.s + '/' + b.n : 'not tried'}</span></div>
    <div class="wk-imp"><b>${s.questions.filter(q => q.tier).length}</b> repeated in other years</div>
    <div class="wk-actions"><button class="btn primary" data-set="${esc(s.id)}">Start</button></div>
  </div>`;
}
function home(){
  const shown = S.tab === 'all' ? sessions : [S.tab];
  const body = !sets.length ? `<div class="empty">No question sets loaded yet.</div>` : shown.map(ss => {
    const list = sets.filter(s => s.session === ss);
    const n = list.reduce((a, s) => a + s.questions.length, 0);
    return `<section class="session"><div class="session-head"><h3>${esc(ss)}</h3><span class="label">${list.length} weeks · ${n} questions</span></div>
      <div class="weeks">${list.map(weekCard).join('')}</div></section>`;
  }).join('');
  const focus = `<section class="panel focus"><div><h2>Focus on repeats</h2>
      <p>These questions, or the same topic in new wording, came up in more than one run of the course. The examiners keep returning to them, so learn them first.</p></div>
      <div class="fstats">
        <div class="fstat"><b>${focusN(2)}</b><span class="imp t2">Must know</span><small>asked in 3 or more runs</small></div>
        <div class="fstat"><b>${focusN(1)}</b><span class="imp t1">Repeated</span><small>asked in 2 runs</small></div>
      </div>
      <div class="row">
        <button class="btn primary" data-act="focus2">Practice must know</button>
        <button class="btn" data-act="focus1">Practice all repeated</button>
        <button class="btn ghost" data-act="focusStudy">Read the repeated list</button>
      </div></section>`;
  app.innerHTML = header() + `<div class="grid">${sidebar()}<main>${focus}
    <div class="tabs" role="tablist">${['all', ...sessions].map(t => `<button role="tab" data-tab="${esc(t)}" aria-selected="${S.tab === t}">${t === 'all' ? 'All runs' : esc(t)}</button>`).join('')}</div>
    ${body}
    <p class="note">${esc(C.note)}</p>
  </main></div>`;
}

function quizBar(){
  const Q = S.quiz;
  return `<div class="qbar"><button class="btn ghost" data-act="home">← All sets</button><div class="title">${esc(Q.title)}</div>
    <span class="label">${Q.mode}</span></div>`;
}
function optHTML(it, o, i, reveal){
  let cls = it.chosen.includes(i) ? 'sel' : '';
  if (reveal) { if (o.c) cls = 'ok'; else if (it.chosen.includes(i)) cls = 'bad'; }
  return `<button class="opt ${cls}" data-opt="${i}" ${reveal ? 'disabled' : ''}><span class="k">${LETTERS[i]}</span><span>${esc(o.t)}</span></button>`;
}
function srcHTML(q){
  return `<div class="src">${esc(q.origin)}${q.source ? ` · <a href="${esc(q.source)}" target="_blank" rel="noopener">source</a>` : ''}</div>`;
}
function question(){
  const Q = S.quiz, it = Q.items[Q.i], n = Q.items.length;
  const reveal = Q.mode === 'practice' && it.checked;
  const last = Q.i === n - 1;
  const right = reveal && isRight(it);
  const correctLetters = it.numeric ? it.opts[0].t : it.opts.map((o, i) => o.c ? LETTERS[i] : '').filter(Boolean).join(', ');
  const done = Q.items.filter(x => Q.mode === 'practice' ? x.checked : x.chosen.length).length;
  const score = Q.items.filter(x => x.checked && isRight(x)).length;
  let actions = `<button class="btn" data-act="prev" ${Q.i ? '' : 'disabled'}>Prev</button><span class="sp"></span>`;
  if (Q.mode === 'practice') {
    if (!it.checked && (it.multi || it.numeric)) actions += `<button class="btn primary" data-act="check" ${it.chosen.length ? '' : 'disabled'}>Check answer</button>`;
    if (it.checked) actions += last ? `<button class="btn primary" data-act="finish">See results</button>` : `<button class="btn primary" data-act="next">Next</button>`;
    else if (!last) actions += `<button class="btn" data-act="next">Skip</button>`;
  } else {
    actions += last ? `<button class="btn primary" data-act="finish">Submit (${done}/${n} answered)</button>` : `<button class="btn primary" data-act="next">Next</button>`;
  }
  const dots = Q.items.map((x, i) => {
    let c = i === Q.i ? 'cur ' : '';
    if (Q.mode === 'practice' && x.checked) c += isRight(x) ? 'ok' : 'bad';
    else if (x.chosen.length) c += 'ans';
    return `<button class="${c}" data-go="${i}" aria-label="Question ${i + 1}">${i + 1}</button>`;
  }).join('');
  app.innerHTML = quizBar() + `
    <div class="progress"><div style="width:${(done / n * 100).toFixed(1)}%"></div></div>
    <article class="qcard">
      <div class="qhead"><span class="mono">Q ${pad(Q.i + 1)} / ${pad(n)}${imp(it.q)}${reveal ? flag(it.q) : ''}</span>${Q.mode === 'practice' ? `<span class="mono">score ${score}/${Q.items.filter(x => x.checked).length}</span>` : ''}</div>
      <h2 class="qtext">${esc(it.q.q)}</h2>
      ${it.multi ? '<span class="multi">Select all that apply</span>' : it.numeric ? '<span class="multi">Type your answer</span>' : ''}
      ${it.numeric ? `<div class="numrow"><label for="num-ans" class="label">Your answer</label><input id="num-ans" class="numin ${reveal ? (right ? 'ok' : 'bad') : ''}" inputmode="decimal" autocomplete="off" value="${esc(it.value)}" ${reveal ? 'disabled' : ''}></div>`
        : `<div class="opts">${it.opts.map((o, i) => optHTML(it, o, i, reveal)).join('')}</div>`}
      ${reveal ? `<div class="feedback ${right ? 'ok' : 'bad'}"><strong>${right ? 'Correct.' : 'Not quite.'}</strong> ${right ? '' : 'Answer: ' + correctLetters + '.'}
        ${it.q.explanation ? `<div style="margin-top:6px">${esc(it.q.explanation)}</div>` : ''}${relHTML(it.q)}${srcHTML(it.q)}</div>` : ''}
      <div class="qactions">${actions}</div>
    </article>
    <nav class="dots" aria-label="Jump to question">${dots}</nav>
    <p class="keys"><kbd>A</kbd>–<kbd>D</kbd> or <kbd>1</kbd>–<kbd>4</kbd> pick · <kbd>Enter</kbd> check / next · <kbd>←</kbd> <kbd>→</kbd> move</p>`;
  const inp = it.numeric && !reveal && document.getElementById('num-ans');
  if (inp && inp.focus) inp.focus();
}
function itemHTML(it, idx, showPick){
  return `<div class="item"><div class="qhead"><span class="mono">Q ${pad(idx + 1)}${imp(it.q)}${flag(it.q)}</span><span>${esc(it.q.origin)}</span></div>
    <div class="qtext">${esc(it.q.q)}</div>
    <ul>${it.numeric ? `<li class="right"><span class="k">=</span><span>${esc(it.opts[0].t)}</span></li>${showPick && it.value && !isRight(it) ? `<li class="wrong"><span class="k">×</span><span>${esc(it.value)}</span></li>` : ''}`
      : it.opts.map((o, i) => `<li class="${o.c ? 'right' : (showPick && it.chosen.includes(i) ? 'wrong' : '')}"><span class="k">${LETTERS[i]}</span><span>${esc(o.t)}</span></li>`).join('')}</ul>
    ${it.q.explanation ? `<div class="exp">${esc(it.q.explanation)}</div>` : ''}
    ${relHTML(it.q)}
    ${it.q.source ? `<div class="src"><a href="${esc(it.q.source)}" target="_blank" rel="noopener">source</a></div>` : ''}</div>`;
}
function results(){
  const Q = S.quiz, n = Q.items.length, s = Q.items.filter(isRight).length, p = s / n;
  const wrong = Q.items.map((it, i) => [it, i]).filter(([it]) => !isRight(it));
  const verdict = p >= .8 ? 'Exam ready on this set.' : p >= .5 ? 'Close. Review the misses below.' : 'Go back over these lectures.';
  app.innerHTML = quizBar() + `
    <section class="panel" style="max-width:820px">
      <div class="score"><div><b>${s}</b><span class="of"> / ${n}</span></div>${lamp(p >= .8 ? 'g' : p >= .5 ? 'a' : 'r')}
        <div><div class="verdict">${Math.round(p * 100)}%</div><div class="hintline" style="margin:0">${verdict}</div></div></div>
      <div class="row">
        ${nextBtn()}
        <button class="btn ${nextBtn() ? '' : 'primary'}" data-act="retry">Retry all</button>
        ${wrong.length ? `<button class="btn" data-act="retrywrong">Retry the ${wrong.length} missed</button>` : ''}
        <button class="btn ghost" data-act="home">Back to sets</button>
      </div>
    </section>
    ${wrong.length ? `<h2 class="label" style="margin-top:24px">Missed or skipped</h2><div class="list">${wrong.map(([it, i]) => itemHTML(it, i, true)).join('')}</div>` : ''}`;
}
function study(){
  const Q = S.quiz;
  app.innerHTML = quizBar() + `<p class="note">Correct options are highlighted. Switch to Practice or Exam mode to test yourself.</p>
    <div class="list">${Q.items.map((it, i) => itemHTML(it, i, false)).join('')}</div>
    <div class="row">${nextBtn()}<button class="btn ${nextBtn() ? '' : 'primary'}" data-act="practiceThis">Practice this set</button><button class="btn ghost" data-act="home">Back to sets</button></div>`;
}
function render(){
  if (S.view === 'home' || !S.quiz) return home();
  if (S.quiz.mode === 'study') return study();
  if (S.quiz.finished) return results();
  question();
}

// ---- events
app.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const d = b.dataset;
  if (d.mode) { S.mode = d.mode; LS.set('mode', S.mode); return render(); }
  if (d.tab) { S.tab = d.tab; LS.set('tab', S.tab); return render(); }
  if (d.set) return startSet(d.set);
  if (d.drall) { S.drillRuns = d.drall === '1' ? sessions.slice() : []; LS.set('dr', S.drillRuns); return render(); }
  if (d.dwall) { S.drillWeeks = d.dwall === '1' ? weeksAvail.slice() : []; LS.set('dw', S.drillWeeks); return render(); }
  if (d.opt != null) return choose(+d.opt);
  if (d.go != null) return go(+d.go);
  const Q = S.quiz;
  switch (d.act) {
    case 'drill': return startDrill();
    case 'miss': return startMistakes();
    case 'focus2': return startFocus(2);
    case 'focus1': return startFocus(1);
    case 'focusStudy': return startFocus(1, 'study');
    case 'clearmiss': LS.set('miss', []); toast('Mistake list cleared'); return render();
    case 'home': S.view = 'home'; render(); return window.scrollTo(0, 0);
    case 'prev': return go(Q.i - 1);
    case 'next': return go(Q.i + 1);
    case 'check': return check();
    case 'finish': return finish();
    case 'retry': return startQuiz(Q.title, Q.items.map(it => it.q), {setId: Q.setId});
    case 'retrywrong': return startQuiz(Q.title + ' · missed', Q.items.filter(it => !isRight(it)).map(it => it.q));
    case 'nextweek': { const n = nextSet(Q.setId); if (n) startSet(n.id); return; }
    case 'practiceThis': S.mode = 'practice'; LS.set('mode', 'practice'); return startQuiz(Q.title, Q.items.map(it => it.q), {setId: Q.setId});
  }
});
app.addEventListener('input', e => {
  if (e.target.id !== 'num-ans' || !S.quiz) return;
  const it = S.quiz.items[S.quiz.i];
  it.value = e.target.value;
  it.chosen = it.value.trim() ? [0] : [];
  const b = app.querySelector('[data-act="check"]');
  if (b) b.disabled = !it.chosen.length;
});
app.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'opt-shuf') { S.shuf = t.checked; LS.set('shuf', S.shuf); }
  else if (t.id === 'opt-uniq') { S.uniq = t.checked; LS.set('uniq', S.uniq); render(); }
  else if (t.id === 'dp') { S.pool = t.value; LS.set('dp', S.pool); render(); }
  else if (t.dataset.dr) {
    const r = t.dataset.dr;
    S.drillRuns = t.checked ? [...new Set([...S.drillRuns, r])] : S.drillRuns.filter(x => x !== r);
    LS.set('dr', S.drillRuns); render();
  }
  else if (t.id === 'dc') { S.drillCount = t.value; LS.set('dc', S.drillCount); }
  else if (t.dataset.dw) {
    const w = +t.dataset.dw;
    S.drillWeeks = t.checked ? [...new Set([...S.drillWeeks, w])] : S.drillWeeks.filter(x => x !== w);
    LS.set('dw', S.drillWeeks); render();
  }
});
document.addEventListener('keydown', e => {
  if (S.view !== 'quiz' || !S.quiz || S.quiz.finished || S.quiz.mode === 'study') return;
  if (e.target.id === 'num-ans' && e.key === 'Enter') {
    e.preventDefault();
    const Q = S.quiz, it = Q.items[Q.i];
    if (Q.mode === 'practice' && !it.checked) return check();
    return Q.i === Q.items.length - 1 ? finish() : go(Q.i + 1);
  }
  if (e.metaKey || e.ctrlKey || e.altKey || /input|select|textarea/i.test(e.target.tagName)) return;
  const Q = S.quiz, it = Q.items[Q.i], k = e.key.toLowerCase();
  let idx = '1234'.indexOf(k); if (idx < 0) idx = 'abcd'.indexOf(k);
  if (idx >= 0 && idx < it.opts.length) { e.preventDefault(); return choose(idx); }
  if (k === 'arrowright') return go(Q.i + 1);
  if (k === 'arrowleft') return go(Q.i - 1);
  if (k === 'enter') {
    e.preventDefault();
    const last = Q.i === Q.items.length - 1;
    if (Q.mode === 'practice' && !it.checked && it.multi && it.chosen.length) return check();
    if (Q.mode === 'practice' && !it.checked) return;
    return last ? finish() : go(Q.i + 1);
  }
});
render();
})();
</script>

</body>
</html>
