2],"explanation":"Lecture 01 (Sensing & Actuation): electric rotary actuators 'converts the electrical energy into ... the rotational motion'.","verified":"lecture","c":168},{"q":"Which of the following communication standards provide a framework for WPAN ?","options":["6LowPan","IEEE 802.15.4","Z- wave","Wireless HART"],"answer":[1],"explanation":"Lecture 02 (IoT Connectivity Part I): 802.15.4 'provides the framework ... for networks such as the wireless personal area networks'.","verified":"lecture","c":169},{"q":"The IEEE 802.15.4 standard uses DSSS scheme for data transmission. What does DSSS stand for?","options":["Double Spread Spectrum Scheme","Direct-Sequence Spread Spectrum","Discrete-Sequence Spread Spectrum","Dynamic-Sequence Spread Spectrum"],"answer":[1],"explanation":"Lecture 02 (IoT Connectivity Part I): 'DSSS, the direct sequence spread spectrum coding scheme'.","verified":"lecture","c":170},{"q":"When does Zigbee uses the OQPSK modulation scheme?","options":["When the operating frequency is less the 2.4 GHz","When the operating frequency is more than 2.4 GHz","When the operating frequency is 2.4 GHz","All of the above"],"answer":[2],"explanation":"Lecture 02 (IoT Connectivity Part I): 'the 2.4 gigahertz band uses OQPSK'; lower bands use BPSK.","verified":"lecture","c":171},{"q":"Which of the following statements is true about the end devices in Zigbee protocol?","options":["End devices do not participate in data routing","End device manages and controls the network","End devices contribute in data relaying","There can be only one end device in a Zigbee network"],"answer":[0],"explanation":"Lecture 02 (IoT Connectivity Part I): end devices 'are the recipients of the data they do not contribute to further routing'.","verified":"lecture","c":172},{"q":"What is the maximum packet size supported by IEEE 802.15.4 standard?","options":["1280 bytes","125 bytes","127 bytes","256 bytes"],"answer":[2],"explanation":"Lecture 02 (IoT Connectivity Part I): '802.15.4 can ... permit a packet size of upto 127 bytes'.","verified":"lecture","c":173},{"q":"Z-wave uses _____ network topology. Fill in the blank.","options":["Bus","Star","Tree","Mesh"],"answer":[3],"explanation":"Lecture 03 (IoT Connectivity Part II): 'Z-wave uses a mesh network topology'.","verified":"lecture","c":174},{"q":"Passive tags in RFID are powered by their own power source. True or False?","options":["True","False"],"answer":[1],"explanation":"Lecture 03 (IoT Connectivity Part II): passive tags 'do not have [own power] ... will have to be powered inductively'.","verified":"lecture","c":175},{"q":"What is the full form of IETF in the context of the Internet?","options":["Internet Enforced Task Force","Internet for Engineers Task Force","Internet Engineers Task Force","Internet Engineering Task Force"],"answer":[3],"explanation":"Lecture 04 (IoT Networking Part I): IETF initiatives (6LoWPAN, ROLL, CoRE); IETF = Internet Engineering Task Force.","verified":"lecture","c":176},{"q":"MQTT works on ________framework on top of TCP/IP. Fill in the blank.","options":["Push/Pull","Publish/Subscribe","Client/Server","None of the above"],"answer":[1],"explanation":"Lecture 05 (IoT Networking Part II): MQTT works on Publish/Subscribe on top of TCP/IP.","verified":"lecture","c":177}]},{"year":2023,"session":"Jul-Oct 2023","week":2,"source":"Official NPTEL noc23_cs82 question images (pattern https://storage.googleapis.com/swayam-node1-production.appspot.com/assets/img/noc23_cs82/w2a1q1.png ... q15); answers by domain knowledge","questions":[{"q":"Which of the following is a feature of the Fourth industrial revolution?","options":["Use of Mainframes and the Internet","Mass production","Utilization of machines in production processes","Use of AI ML, and CPS"],"answer":[3],"explanation":"Lecture 06 (The Fourth Revolution): Industry 4.0 uses 'artificial intelligence, machine learning, cyber physical systems'.","verified":"lecture","c":178},{"q":"___________ has helped in producing objects that are mutable and adaptable. Fill in the blank.","options":["Digital fabrication","Additive manufacturing","Synthetic biology","None of the above"],"answer":[0],"explanation":"Lecture 06 (The Fourth Revolution): 'digital fabrication technologies are able to communicate with biological world ... It is now easy to mutate these products, and also have these products adaptable' (digital fabrication is the umbrella; AM and synthetic biology are its ingredients).","verified":"lecture","c":179},{"q":"Select the option that best describes the tipping point.","options":["Radical change in the future that leads to innovation","Change that leads to failing economy","A point which marks the profit in business","A space in factory floor for goods collection"],"answer":[0],"explanation":"Lecture 06 (The Fourth Revolution): tipping points are 'the changes that are coming in the future' (radical future change driving innovation).","verified":"lecture","c":180},{"q":"Which of the following is/are drivers of sustainability in Industry 4.0?","options":["Globalization","Socio-economic factors","Environmental factors","All of the above"],"answer":[3],"explanation":"Lecture 07 (Sustainability Assessment of Manufacturing Industry): sustainability drivers are globalization and emerging issues (socio-economic, environmental).","verified":"lecture","c":181},{"q":"Information regulation in public is covered under which of the following laws?","options":["Employment and Labor rules","Advertisement regulations","Environmental rules","Privacy regulation"],"answer":[1],"explanation":"Corrected after checking the lecture (was: Privacy regulation). Lecture 07 (Sustainability Assessment of Manufacturing Industry): 'advertisement regulations protect customers, firm honesty about a product, information regulation publicly, then transparency on distribution' - information regulation is listed under advertisement regulations, not privacy (privacy covers sensitive employee/stakeholder data).","verified":"lecture","c":182},{"q":"How does population growth affect the manufacturing industry?","options":["It affects the food supplies","It affects the availability of industrial locations","It affects the political actions and outcomes","All of the above"],"answer":[3],"explanation":"Lecture 07 (Sustainability Assessment of Manufacturing Industry): population growth 'affects the industry growth, food supplies, ... politics, industry locations'.","verified":"lecture","c":183},{"q":"Which of the following statements is true about recession?","options":["Recession is the extremity of depression","Recession stays for only two months","Recession is observable on GDP of a country","All of the above"],"answer":[2],"explanation":"Lecture 07 (Sustainability Assessment of Manufacturing Industry): depression is the extremity of recession (a is reversed) and lasts >2 years; recession is a decline in economic activity, seen in GDP.","verified":"lecture","c":184},{"q":"The lean manufacturing system, introduced by Toyoto, is based on which of the following approaches?","options":["JIDOKA","JIT","Both a and b","SUDOKA"],"answer":[2],"explanation":"Lecture 08 (Lean Production System): lean 'has considerations of two different types of systems ... JIDOKA ... just-in-time'.","verified":"lecture","c":185},{"q":"Which of the following is not an impact of the Lean production system on manufacturing?","options":["Highest lead time","Low cost","High quality","All of the above"],"answer":[0],"explanation":"Lecture 08 (Lean Production System): impact of lean is best quality, lower cost, shortest time - not highest lead time.","verified":"lecture","c":186},{"q":"What is KPI in the context of performance management?","options":["Key Product Index","Key Performance Indicator","Key Performance Index","Key Product Identifier"],"answer":[1],"explanation":"Lecture 08 (Lean Production System): 'KPIs means key performance indicators'.","verified":"lecture","c":187},{"q":"Which of the following statements is/are true about smart and connected products?","options":["Smart and connected products are cheaper","Decrease environmental impact","Improves recall process of products","All of the above"],"answer":[3],"explanation":"Lecture 09 (Smart and Connected Business Perspective): benefits: cheaper, improved recall process, decreased environmental impact.","verified":"lecture","c":188},{"q":"Lock-in centric business models helps in","options":["Preventing customer migration","Eliminating errors","Making faster transactions","Creating new market for innovative product"],"answer":[0],"explanation":"Lecture 09 (Smart and Connected Business Perspective): lock-in centric model 'prevents the customer from migration'.","verified":"lecture","c":189},{"q":"What is the function of the digital layer in a smart business architecture?","options":["Data storage","Data analysis","Data processing","All of the above"],"answer":[3],"explanation":"Lecture 09 (Smart and Connected Business Perspective): digital layer stores, analyzes and processes data.","verified":"lecture","c":190},{"q":"Which of the following is not a characteristic of a smart factory?","options":["Proactivity","Agility","Opaque","Optimization"],"answer":[2],"explanation":"Lecture 10 (Smart Factories): characteristics are connection, optimization, transparency, proactivity, agility - not opaque.","verified":"lecture","c":191},{"q":"Which of the following falls under the Agility characteristic of a smart factory?","options":["Predicting future challenges","Real-time tracking","Connected smart devices","Self-configuration"],"answer":[3],"explanation":"Lecture 10 (Smart Factories): agility includes flexibility, adaptation and self-configuration.","verified":"lecture","c":192}]},{"year":2023,"session":"Jul-Oct 2023","week":3,"source":"Official NPTEL noc23_cs82 question images (pattern https://storage.googleapis.com/swayam-node1-production.appspot.com/assets/img/noc23_cs82/w3a3q1.png ... q15); answers by domain knowledge","questions":[{"q":"What is the full form of CPS?","options":["Central-Physical System","Cyber-Physical System","Cyber-Property System","Central-Private System"],"answer":[1],"explanation":"L11: CPS = Cyber Physical Systems.","verified":"lecture","c":193},{"q":"Select the statement(s) that best describes a CPS.","options":["A CPS interacts with the physical world through sensors and actuators.","A CPS is a network of physical and computational components.","It is a set of multiple networked embedded systems.","All of the above"],"answer":[3],"explanation":"L11: CPS interacts via sensors/actuators, 'interacting networks of physical and computational components', and is a networked set of embedded systems.","verified":"lecture","c":194},{"q":"What does conversion refer to in context of CPS architecture for IIoT?","options":["Conversion of CPS into individual components.","Conversion of machine data to meaningful information.","Conversion of present data into future data prediction.","Conversion of analog signal to digital signal."],"answer":[1],"explanation":"L11: 'conversion of machine data to some information, that can be made meaningful and useful'.","verified":"lecture","c":195},{"q":"Select the statement which describes one of the limitations of smart sensors.","options":["Sensor data aggregation not possible.","Cannot connect with an actuator.","Cannot connect to a network","All of the above"],"answer":[0],"explanation":"L11 smart sensor limitations: 'sensor data aggregation using the sensors is not possible or limitedly possible'.","verified":"lecture","c":196},{"q":"_____sensors are capable of processing sensed data and performing pre-defined functions by processing data. Fill in the blank with the appropriate option.","options":["Smart","Intelligent","Digital","Scalar"],"answer":[1],"explanation":"Corrected after checking the lecture (was: Smart). L11: 'these intelligent sensors are capable of processing sensed data and performing predefined functions by processing the data'. That is intelligent, not smart, sensors.","verified":"lecture","c":197},{"q":"Which of the following allows application-specific customization of sensor nodes?","options":["Smart sensors","Intelligent sensors","ADC","None of the above"],"answer":[1],"explanation":"L11: intelligent sensors are 'capable of customizing embedded algorithms on the fly unlike the smart sensors'.","verified":"lecture","c":198},{"q":"___________ allows employees to share information and solve business problems. Fill in the blank.","options":["Sharing platform","Business platform","E-Commerce platform","Collaboration platform"],"answer":[3],"explanation":"L12: collaboration platform 'helps the employees to share information and solve certain business problems'.","verified":"lecture","c":199},{"q":"Coordination is one of the four keys that enable collaboration productivity. How can one initiate coordination?","options":["Provide authority to decision-makers in a decentralized system.","Format data model to store every data element exactly once.","Bridge the gap between the virtual and physical world.","All of the above"],"answer":[0],"explanation":"L12: coordination initiated by establishing a network and 'providing authority to decision makers in a decentralized system'. B is SSoT and C is industrialization.","verified":"lecture","c":200},{"q":"How many components are there in PLM that are used to handle a product across its lifetime?","options":["3","5","7","9"],"answer":[3],"explanation":"L12: 'there are nine components in PLM to handle a product across its lifecycle'.","verified":"lecture","c":201},{"q":"Which of the following statements is true about Augmented reality?","options":["It is a mixture of interactive hardware and software-based artificial environment.","It creates and enhances an imaginary reality.","It amplifies the present perception of reality.","All of the above"],"answer":[2],"explanation":"L13: AR improves 'the present perception of reality'. A and B are the lecture's VR descriptions.","verified":"lecture","c":202},{"q":"What is projection-based AR?","options":["It gives outcomes by projecting light on real world surfaces.","It substitutes the original view with of an object with the augmented view.","It gives the output when a marker is detected.","It is used for GPS-denied regions"],"answer":[0],"explanation":"L13: projection-based AR 'gives an outcome by projecting light onto the real world surfaces'.","verified":"lecture","c":203},{"q":"Semi-immersive simulation is a type of","options":["AR","VR","Both a and b","None of the above"],"answer":[1],"explanation":"L13: non-, semi- and fully-immersive simulations are 'different types of virtual reality'.","verified":"lecture","c":204},{"q":"Which of the following search methods is used by a computer program that does not use artificial intelligence?","options":["Heuristic","Algorithmic","Approximation","None of the above"],"answer":[1],"explanation":"L14: program without AI uses 'algorithmic search method'.","verified":"lecture","c":205},{"q":"Select the correct statement.","options":["Artificial intelligence is a type of machine learning","Deep learning is a subset of machine learning","Deep learning cannot learn the features on its own.","Machine learning is a subset of deep learning."],"answer":[1],"explanation":"L14: 'Deep learning, basically, is a subset of machine learning'.","verified":"lecture","c":206,"rel":[["Jan-Apr 2023",8,1]]},{"q":"Which of the following statements is true about the GFS file system?","options":["It is based on the Hadoop Distributed File System","It is a distributed file system that supports large-scale file system","It is a centralized file management system","It is a file system designed specifically for unstructured data management"],"answer":[1],"explanation":"L15: 'GFS is a distributed file system that helps in supporting ... storage of large scale files'. HDFS is derived from GFS.","verified":"lecture","c":207}]},{"year":2023,"session":"Jul-Oct 2023","week":4,"source":"Official NPTEL noc23_cs82 question images (pattern https://storage.googleapis.com/swayam-node1-production.appspot.com/assets/img/noc23_cs82/w4a4q1.png ... q15); answers by domain knowledge","questions":[{"q":"Cybersecurity involves the security of","options":["Hardware and software","Software and data","Hardware, software, and data","Hardware, software, data and processes"],"answer":[2],"explanation":"L16: 'how to protect the hardware, how to protect the software and how to protect the data'.","verified":"lecture","c":208},{"q":"________ security represents the set of policies that monitor and prevent unauthorized access, safeguard the data and network from network traffic. Fill in the blank.","options":["Information","Hardware","Software","Network"],"answer":[3],"explanation":"L16: network security protects the network from unauthorized access, improper use and damage.","verified":"lecture","c":209},{"q":"Locky is an example of which type of cybersecurity threat?","options":["Ransomware","Malware","Phishing","All of the above"],"answer":[0],"explanation":"L16: 'Locky is a ransom-ware type of attack'.","verified":"lecture","c":210},{"q":"What does C represent in the CIA-Triad in cybersecurity?","options":["Cyber-physical","Centralized","Confidentiality","Critical"],"answer":[2],"explanation":"L16: 'C stands for confidentiality'.","verified":"lecture","c":211},{"q":"What is ubiquitous sensing in IIoT?","options":["In IIoT, sensors and actuators are used to control critical elements.","In IIoT, sensors and actuators are used almost everywhere to control, enhance and optimize various functions.","In IIoT, advanced analytics helps to enhance the working condition, increase machine life and optimize operational efficiency.","None of the above"],"answer":[1],"explanation":"L17: 'in IIoT sensors and actuators have been also used everywhere to control, enhance, and optimize various functions'.","verified":"lecture","c":212},{"q":"Which of the following is a data integration challenge in deploying IIoT?","options":["Understanding the generated data for analysis and application in business.","Storing the data","Lack of skills","Cybersecurity"],"answer":[0],"explanation":"L17: data integration challenge is integrating and analyzing heterogeneous high-volume data; 'to manage this data, to analyze this data is a very herculean task'.","verified":"lecture","c":213},{"q":"Commercialization and the mass production of steam engines marked the beginning of the______ stage of the Industrial revolution. Fill in the blank.","options":["Fourth","Third","Second","First"],"answer":[3],"explanation":"L18: 'the first stage was the commercialization and the mass production of steam engines'.","verified":"lecture","c":214},{"q":"What were the negative effects of Industrial revolution?","options":["Harm to environment by waste products","Inefficient","Bad working environment","All of the above"],"answer":[3],"explanation":"Corrected after checking the lecture (was: Harm to environment by waste products, Bad working environment). L18 lists three drawbacks of the industrial revolution: waste products harming the environment, 'bad working environment of the workers', and 'Third is the inefficiency'. So all of the above.","verified":"lecture","c":215},{"q":"How many key elements are there in the Industrial internet?","options":["4","3","5","2"],"answer":[1],"explanation":"L18: 'the industrial internet has three key elements'.","verified":"lecture","c":216},{"q":"How does sensing contributes to the industry?","options":["Increase downtime","Increase cost","Higher degree of automation","Safety hazards"],"answer":[2],"explanation":"L19: sensors in industry should help 'promoting higher degree of automation'.","verified":"lecture","c":217},{"q":"A smart sensor can perform multiple sensing, unlike the traditional sensors. True or false?","options":["True","False"],"answer":[0],"explanation":"L19: smart sensors support 'multi parameter sensing ... same sensor can be used to measure multiple gases'.","verified":"lecture","c":218},{"q":"What is self-decision making in a smart sensor?","options":["It can self-monitor its operation and changes in the ambience by taking proper decision by itself.","Reduce the cost by reduced downtime","Communicate data","Enable multiple parameter sensing"],"answer":[0],"explanation":"L19: self-decision making: 'it can self-monitor and based on the ambient conditions it can make certain decisions on its own'.","verified":"lecture","c":219},{"q":"What is the full form of SCADA?","options":["Supervisory Confidential and Data Acquisition","Supervisory Control and Data Acquisition","Smart Control and Data Acquisition","Smart Controlled and Direct Acquisition"],"answer":[1],"explanation":"L19: Supervisory Control and Data Acquisition.","verified":"lecture","c":220},{"q":"What does the Cognitive layer in the 5C architecture for Cyber-physical Systems represents?","options":["System for supervised control: Self-configure, Self-Optimize, Self-Adjust","Sensor records machine health data: data to information interpretation","System for optimized decision: Human-readable interpretation & data visualization","All of the above"],"answer":[2],"explanation":"L20: 'cognitive layer ... systems for optimized decision making ... data visualization, human-readable interpretation'.","verified":"lecture","c":221,"rel":[["Jul-Oct 2024",4,0],["Jul-Oct 2026",4,0]]},{"q":"How can smart factory be beneficial in inventory tracking?","options":["Global inter-connectivity of smart factory facilitates real-time updates of inventory","Ease of process re-adjustment facility","End-to-end production line management with sensors","None of the above"],"answer":[0],"explanation":"L20: inventory management uses 'Global inter-connectivity facilities in real-time, and providing real-time updates'.","verified":"lecture","c":222}]},{"year":2023,"session":"Jul-Oct 2023","week":5,"source":"Official NPTEL noc23_cs82 question images (pattern https://storage.googleapis.com/swayam-node1-production.appspot.com/assets/img/noc23_cs82/w5a5q1.png ... q15); answers by domain knowledge","questions":[{"q":"Which of the following is a feature of Amazon Smart Warehousing's logistics and supply chain management?","options":["Manual control of supply fleet","Logistic status update with future market demand","Centralized customer service","Distributed parking and space surrounding control"],"answer":[1],"explanation":"Lecture 21 (Industrial Processes - Part 2): Amazon achieves 'smart control of their supply fleet' and 'status update of their logistics with future market demand'.","verified":"lecture","c":223},{"q":"How does Boeing achieve efficient manufacturing?","options":["Using smart & digital manufacturing facility","By lowering assembly delay & response time","By reducing errors in manufacture & assembly","All the above"],"answer":[3],"explanation":"Lecture 21 (Industrial Processes - Part 2): Boeing - smart and digital manufacturing facility, 'lower assembly delay and lowered response time, reduced errors'.","verified":"lecture","c":224},{"q":"Which of the following company provides Air-as-a-Service?","options":["Kaeser Kompressoren","Hitachi","John Deere","Komatsu"],"answer":[0],"explanation":"Lecture 21 (Industrial Processes - Part 2): air-as-a-service by Kaeser Kompressoren.","verified":"lecture","c":225},{"q":"According to the International Labor Organization, what is the approximate death rate owing to occupational disease or accident?","options":["~1/5 seconds","~1/10 seconds","~1/15 seconds","~1/20 seconds"],"answer":[2],"explanation":"Lecture 21 (Industrial Processes - Part 2): 'one death occurs every 15 seconds due to different accidents in the industry'.","verified":"lecture","c":226},{"q":"What is a Business Model?","options":["A business model describes the rationale of how an organization creates, delivers, and captures value.","It is the embodiment of the organizational and financial architecture of a business.","It is the description of how a business intends to operate and earn profits in a specific marketplace.","All of the above"],"answer":[3],"explanation":"Lecture 22 (Business Models - Part 1): business model is the rationale of creating/delivering/capturing value, 'an embodiment of the organizational and the financial architecture', and how the business intends to operate and earn profits.","verified":"lecture","c":227,"rel":[["Jul-Oct 2025",5,0]]},{"q":"What is a Market Segment?","options":["It is the different groups of customers or end-user organizations that the business enterprise aims to serve.","It is the key resources and activities that a business requires to create value proposition.","It is the products or services that create value for the customer segment.","All of the above"],"answer":[0],"explanation":"Lecture 22 (Business Models - Part 1): market segment = 'different groups of customers, the end-user organizations that the business enterprise aims to serve'.","verified":"lecture","c":228},{"q":"Which of the following statement is true w.r.t. Subscription Model?","options":["It can be used for Smart Energy","It brings together the businesses and their customers to monetize the solutions","It aims to minimize downtime and maximize utilization of the assets","It is capable of generating “recurring” revenue"],"answer":[3],"explanation":"Lecture 22 (Business Models - Part 1): subscription model is 'capable of generating recurrent revenues'; smart energy is the asset-sharing example; monetizing jointly is outcome-based.","verified":"lecture","c":229},{"q":"Which of the following is not an IIoT business models?","options":["Cloud-based Business Model","Service-Oriented Business Model","Outcome-based Business Model","Process-Oriented Business Model"],"answer":[2],"explanation":"Lecture 23 (Business Models - Part 2): IIoT business models are cloud-based, service-oriented, process-oriented; outcome-based is an IoT model (Lecture 22).","verified":"lecture","c":230,"rel":[["Jul-Oct 2024",5,0]]},{"q":"Which of the following Cloud-Based Business Model aims to provide the required hardware and software online in the cloud?","options":["Infrastructure-as-a-Service","Platform-as-a-Service","Software-as-a-Service","All of the above"],"answer":[0],"explanation":"Corrected after checking the lecture (was: Platform-as-a-Service). Lecture 23 (Business Models - Part 2): IaaS offers 'hardware infrastructure ... computing infrastructure' as a service while PaaS is the development platform; progiez Jul-Oct 2024 keys IaaS = 'Required hardware and software online in the cloud'.","verified":"lecture","c":231,"rel":[["Jul-Oct 2025",5,0]]},{"q":"Which of the following is a/are challenge(s) of IIoT Business Model?","options":["Lack of interoperability","Immature or untested technologies","Increase complexity","All of the above"],"answer":[3],"explanation":"Lecture 23 (Business Models - Part 2): challenges include 'lack of interoperability ... increased complexity ... immature or untested technologies'.","verified":"lecture","c":232},{"q":"What is the full form of IIRA?","options":["Industrial Internet Related Architecture","Industrial Internet Regional Architecture","Industrial Internet Reference Architecture","Industrial Internet Real-time Architecture"],"answer":[2],"explanation":"Lecture 24 (Reference Architecture - Part 1): Industrial Internet Reference Architecture.","verified":"lecture","c":233},{"q":"“Industrial Internet Consortium (IIC) is a non-profit organization created to promote open standards and interoperability for industry technologies and machine-to-machine (M2M) environments.” – Is the statement True or False?","options":["True","False"],"answer":[0],"explanation":"Lecture 24 (Reference Architecture - Part 1): IIC is 'a non-profit consortium ... promoting open standards ... used in industries and for M2M communication'.","verified":"lecture","c":234},{"q":"Which of the following are the components of Gateway-Mediated Edge Architecture?","options":["Edge layer, Platform layer, Enterprise layer","Physical layer, Edge devices/Gateway, Cloud","Sensors and Actuators, Edge devices/Gateway, Wide Area Network","Smart Machines, System of Systems, Industrial Internet"],"answer":[2],"explanation":"Lecture 24 (Reference Architecture - Part 1): gateway-mediated edge: 'sensors and actuators ... gateway devices, edge devices ... sent to the wide area network'.","verified":"lecture","c":235},{"q":"Which of the following is not a viewpoint of IIRA?","options":["Business viewpoint","Market viewpoint","Functional viewpoint","Usage viewpoint"],"answer":[1],"explanation":"Lecture 25 (Reference Architecture - Part 2): viewpoints are business, usage, functional, implementation.","verified":"lecture","c":236},{"q":"How many domains are there in the Functional Viewpoint of IIRA?","options":["4","5","6","7"],"answer":[1],"explanation":"Lecture 25 (Reference Architecture - Part 2): functional viewpoint has 'control domain, operations domain, information domain, application domain, and the business domain' (5).","verified":"lecture","c":237}]},{"year":2023,"session":"Jul-Oct 2023","week":6,"source":"Official NPTEL noc23_cs82 question images (pattern https://storage.googleapis.com/swayam-node1-production.appspot.com/assets/img/noc23_cs82/w6a6q1.png ... q15); answers by domain knowledge","questions":[{"q":"Which type of voltage does LM 35 temperature sensor generate?","options":["Analog","Digital","Both analog and digital","It is unable to generate any voltage"],"answer":[0],"explanation":"Lecture 26 (Key Enablers: Sensing - Part 1): LM35 generates analog voltage.","verified":"lecture","c":238},{"q":"Temperature sensor DS1621 is a ______ sensor, which generates ______ bits temperature data.","options":["analog, 5","analog, 9","digital, 5","digital, 9"],"answer":[3],"explanation":"Lecture 26 (Key Enablers: Sensing - Part 1): DS1621 digital, 9 bits.","verified":"lecture","c":239},{"q":"Which of the following is the application of Ultrasonic sensor?","options":["Detects radiations coming from human body in its surrounding area","Distance measurement, pattern matching, color checking, structured lighting, and motion capture","Automatic door open/close, human detection, lift lobby, common staircase, and shopping Mall","Liquid level monitoring of tank, trash level monitoring"],"answer":[3],"explanation":"Lecture 26 (Key Enablers: Sensing - Part 1): ultrasonic sensors used for 'liquid level monitoring of tanks, trash monitoring'.","verified":"lecture","c":240},{"q":"What is the Baseline Resistance of a sensor?","options":["Resistance of the sensor material in air when not exposed to the target gas","Resistance of the sensor material in air when exposed to the target gas","Resistance of the sensor material when not exposed to the atmosphere","Resistance of the sensor material when exposed to the atmosphere"],"answer":[0],"explanation":"Lecture 27 (Key Enablers: Sensing - Part 2): baseline resistance 'is basically the resistance of the sensor material in air when it is not exposed to the target gas'.","verified":"lecture","c":241},{"q":"Which type of sensor decreases its resistance w.r.t. the baseline resistance when exposed to a reducing gas?","options":["c-type sensors","p-type sensors","n-type sensors","All the sensor types"],"answer":[2],"explanation":"Lecture 27 (Key Enablers: Sensing - Part 2): n-type resistance decreases.","verified":"lecture","c":242},{"q":"Define the Sensitivity of a gas sensor.","options":["It is the ability to detect a particular gas in a mixture of different gases.","It is the change in the output signal with respect to unit change in input.","It is characteristic of the sensor which ensures its resistance to return to its base resistance value if exposure to the target gas is stopped.","None of the above"],"answer":[1],"explanation":"Lecture 27 (Key Enablers: Sensing - Part 2): sensitivity definition.","verified":"lecture","c":243},{"q":"Which of the following protocol falls under the category of Industrial Ethernet??","options":["CC-Link","DeviceNet","Time-Sensitive Networking (TSN)","Interbus"],"answer":[2],"explanation":"Lecture 28 (Connectivity - Part 1): Industrial Ethernet protocols: Modbus TCP, EtherCAT, EtherNet/IP, Profinet, TSN.","verified":"lecture","c":244},{"q":"What are the two units defined in the ModBus-TCP data frame?","options":["Protocol Data Unit and Application Data Unit","Protocol Data Unit and Communication Data Unit","Communication Data Unit and Application Data Unit","None of the above"],"answer":[0],"explanation":"Lecture 28 (Connectivity - Part 1): ADU and PDU.","verified":"lecture","c":245},{"q":"Which of the following network topology/(ies) is/are not supported by EtherCat?","options":["tree","hybrid","star","mesh"],"answer":[3],"explanation":"Lecture 28 (Connectivity - Part 1): EtherCAT topologies: 'tree ... star ... line ... ring ... hybrid' - not mesh.","verified":"lecture","c":246,"rel":[["Jan-Apr 2026",7,0]]},{"q":"What is the maximum data rate per packet of EtherNet/IP?","options":["500 bytes","100 bytes","1500 bytes","2000 bytes"],"answer":[2],"explanation":"Lecture 28 (Connectivity - Part 1): EtherNet/IP up to about 1500 bytes.","verified":"lecture","c":247},{"q":"What is the full form of Profinet?","options":["PReplanned FIeld NETwork","PROcess Figured NETwork","PReplanned Figured NETwork","PROcess FIeld NETwork"],"answer":[3],"explanation":"Profinet = PROcess FIeld NETwork.","verified":"reasoning","c":248,"rel":[["Jan-Apr 2023",6,0]]},{"q":"Which of the following communication infrastructure is an example of wired connectivity?","options":["LPWAN","PSTN","IEC-PAS 62601/WIA-PA","ISA 100"],"answer":[1],"explanation":"Lecture 29 (Connectivity - Part 2): wired technologies DSL, modem, PSTN; WIA-PA, ISA100, LPWAN are wireless.","verified":"lecture","c":249},{"q":"Which of the following is/are the limitation(s) of satellite communication?","options":["Launching of satellite in space comes at a higher cost","Propagation delay is more compared to other terrestrial methods","Difficulty in repairs in case of any damage","All of the above"],"answer":[3],"explanation":"Lecture 29 (Connectivity - Part 2): satellite 'devices come at higher cost ... huge propagation delay ... repairing ... much more difficult'.","verified":"lecture","c":250},{"q":"What is the frequency spectrum of mmWave for cellular communication?","options":["30 – 100 GHz","30 – 100 MHz","57 – 64 GHz","57 – 64 MHz"],"answer":[0],"explanation":"Lecture 30 (Connectivity - Part 3) states mmWave is 30-300 GHz, which is not offered; 30-100 GHz is the only option inside that cellular mmWave range (57-64 GHz is the unlicensed 60 GHz band). No key available.","verified":"unsure","c":251,"rel":[["Jan-Apr 2023",6,0],["Jan-Apr 2024",6,0]]},{"q":"The output voltage of LM 35 temperature sensor is _________ proportional to the Celsius temperature.","options":["quadratically","exponential","linearly","None of the above"],"answer":[2],"explanation":"Lecture 26 (Key Enablers: Sensing - Part 1): linearly proportional to Celsius.","verified":"lecture","c":252}]},{"year":2023,"session":"Jul-Oct 2023","week":7,"source":"Official NPTEL noc23_cs82 question images (pattern https://storage.googleapis.com/swayam-node1-production.appspot.com/assets/img/noc23_cs82/w7a7q1.png ... q15); answers by domain knowledge","questions":[{"q":"What is the payload per message of SIGFOX?","options":["10 bytes","11 bytes","12 bytes","13 bytes"],"answer":[2],"explanation":"'payload of 12 bytes per message' (Lecture 31: Key Enablers of IIoT: Connectivity – Part 4 (LoRa/SIGFOX + NodeMCU demo)).","verified":"lecture","c":253},{"q":"Which of the following is a processor?","options":["DHT","LoRa","NodeMCU","None of the above"],"answer":[2],"explanation":"'LoRa communication module interfaced with the processor, which is the NodeMCU' (Lecture 31: Key Enablers of IIoT: Connectivity – Part 4 (LoRa/SIGFOX + NodeMCU demo)).","verified":"lecture","c":254},{"q":"“We can use Arduino IDE to program a NodeMCU board.” --- Is this statement True/False?","options":["True","False"],"answer":[0],"explanation":"NodeMCU 'is compliant with the Arduino IDE' (Lecture 31: Key Enablers of IIoT: Connectivity – Part 4 (LoRa/SIGFOX + NodeMCU demo)).","verified":"lecture","c":255},{"q":"Which of the following topology(ies) is/are supported by ZigBee?","options":["Star","Tree","Mesh","All of the above"],"answer":[3],"explanation":"Star, tree and mesh are all supported (Lecture 32: Key Enablers of IIoT: Connectivity – Part 5 (Zigbee/Xbee demo)).","verified":"lecture","c":256,"rel":[["Jan-Apr 2026",7,0]]},{"q":"Which software is used to configure XBee?","options":["XCTU","Arduino IDE","NodeMCU","DHT"],"answer":[0],"explanation":"XCTU configures Xbee modules (Lecture 32: Key Enablers of IIoT: Connectivity – Part 5 (Zigbee/Xbee demo)).","verified":"lecture","c":257},{"q":"Which Python library is necessary/imported while using Xbee?","options":["numpy","TensorFlow","DigiMesh","OpenCV"],"answer":[2],"explanation":"Python transmitter/receiver code 'talks about importing the Digi-Mesh library' (Lecture 32: Key Enablers of IIoT: Connectivity – Part 5 (Zigbee/Xbee demo)).","verified":"lecture","c":258},{"q":"Which of the following statements is true about Complex Event Processing (CEP)?","options":["It analyses and correlates event stream from different data sources","Can process data in near real-time","Extract causal and temporal patterns using predefined rules","All of the above"],"answer":[3],"explanation":"CEP: correlations between event streams from different sources, 'process the data in near real-time', extract causal and temporal patterns (Lecture 33: Key Enablers of IIoT: Processing – Part 1).","verified":"lecture","c":259},{"q":"Edge provides _____ computing, and cloud provides ________ computing.","options":["distributed, decentralized","centralized , r","iRobot-Factory","FarmBeats","None of the above"],"answer":[1],"explanation":"iRobot-Factory = cognitive manufacturing (Lecture 34: Key Enablers of IIoT: Processing – Part 2).","verified":"lecture","c":264},{"q":"What are the three different phases of smart manufacturing?","options":["Organize & process data, decision making, and Generating & controlling the events in real-time","Collection of the service offerings & infrastructure, virtualization, allocation & management of services, and on-demand service provisioning","Authentication, Authorization and Accounting (AAA), Test bed management, and Application","Integration of data and contextual information, synthesis & analysis, innovation in process & production"],"answer":[3],"explanation":"Big-data-driven smart manufacturing: integration of data & context, synthesis & analysis, innovation in process & production (Lecture 34: Key Enablers of IIoT: Processing – Part 2).","verified":"lecture","c":265},{"q":"What is the three user entities in Industrial Manufacturing?","options":["Providers, manufacturers, operators","Providers, consumers, operators","Providers, manufacturers, distributers","Providers, consumers, distributers"],"answer":[1],"explanation":"Industrial manufacturing solution entities: 'the providers, the consumers and the operators' (Lecture 34: Key Enablers of IIoT: Processing – Part 2).","verified":"lecture","c":266},{"q":"How many major components comprise Industrial Control Systems?","options":["4","5","6","7"],"answer":[0],"explanation":"'there are four major components' (Lecture 35: Key Enablers of IIoT: Process Control).","verified":"lecture","c":267}]},{"year":2023,"session":"Jul-Oct 2023","week":8,"source":"Official NPTEL noc23_cs82 question images (pattern https://storage.googleapis.com/swayam-node1-production.appspot.com/assets/img/noc23_cs82/w8a8q1.png ... q15); answers by domain knowledge","questions":[{"q":"What are the three types of IIoT Analytics?","options":["Systematic Analytics, Predictive Analytics, Prescriptive Analytics","Descriptive Analytics, Systematic Analytics, Prescriptive Analytics","Descriptive Analytics, Predictive Analytics, Systematic Analytics","Descriptive Analytics, Predictive Analytics, Prescriptive Analytics"],"answer":[3],"explanation":"Descriptive, predictive, prescriptive (Lecture 36: IIoT Analytics and Data Management: Introduction).","verified":"lecture","c":448,"rel":[["Jul-Oct 2022",8,1],["Jul-Oct 2025",8,0]]},{"q":"What are the main 5 Vs of big data?","options":["Volume, virtualization, viscosity, veracity, variety","Volume, virtualization, variability, viscosity, variety","Volume, velocity, virtualization, veracity, viscosity","Volume, velocity, variability, veracity, variety"],"answer":[3],"explanation":"Volume, velocity, variability, veracity, variety (Lecture 36: IIoT Analytics and Data Management: Introduction).","verified":"lecture","c":269},{"q":"“Machine learning is a subset of deep learning.” --- True/False?","options":["True","False"],"answer":[1],"explanation":"ML is a subset of AI; DL is a subset of ML (Lecture 38: Machine Learning and Data Science – Part 2).","verified":"lecture","c":270},{"q":"Which of the following is an example of Classification?","options":["Bayes Regression","Support Vector Machine","Gaussian Mixture Model","All of the above"],"answer":[1],"explanation":"GMM for anomaly detection, SVM for classification, Bayesian for regression (Lecture 36: IIoT Analytics and Data Management: Introduction).","verified":"lecture","c":271,"rel":[["Jan-Apr 2024",8,0]]},{"q":"Clustering is used in _________ learning?","options":["Unsupervised","Supervised","Reinforcement","None of the above"],"answer":[0],"explanation":"Clustering is an unsupervised technique (Lecture 37: Machine Learning and Data Science – Part 1).","verified":"lecture","c":272},{"q":"Which machine learning algorithm enables machines to improve performance by automatically learning the ideal behaviors for a specific environment??","options":["Unsupervised Learning","Supervised Learning","Reinforcement Learning","Deep Learning"],"answer":[2],"explanation":"RL 'enables machines to improve its performance by automatically learning the ideal behaviors for a specific environment' (Lecture 37: Machine Learning and Data Science – Part 1).","verified":"lecture","c":945,"rel":[["Jan-Apr 2025",8,1]]},{"q":"Which node in the Decision Tree evaluates or determines the outcome based on an attribute's value?","options":["Parent node","Leaf node","Decision node","Root node"],"answer":[2],"explanation":"Decision node (Lecture 37: Machine Learning and Data Science – Part 1).","verified":"lecture","c":274},{"q":"What is the subfield of machine learning that mimics the working function of billions of neurons in our brain??","options":["Regression","Deep Learning","Decision tree","Reinforcement learning"],"answer":[1],"explanation":"Deep learning 'mimics the working function of billions of neurons in our brain' (Lecture 38: Machine Learning and Data Science – Part 2).","verified":"lecture","c":275},{"q":"Why do we need cloud?","options":["For high computational speed for data monitoring and analytics","For storage of huge amount of data","For effective data acquisition","All of the above"],"answer":[3],"explanation":"Cloud reasons: computational speed, storage, scalability/security, efficient acquisition (Lecture 39: Cloud Computing in IIoT – Part 1).","verified":"lecture","c":276},{"q":"What are the three types of services offered by cloud computing?","options":["SeaaS, PaaS and IaaS","SeaaS, CaaS and IaaS","SaaS, PaaS and IaaS","NaaS, CaaS and IaaS"],"answer":[2],"explanation":"SaaS, PaaS, IaaS (Lecture 39: Cloud Computing in IIoT – Part 1).","verified":"lecture","c":277},{"q":"Which of the following is an example of Infrastructure-as-a-Service?","options":["Google App Engine","Microsoft Azure","Microsoft 365","All of the above"],"answer":[1],"explanation":"IaaS examples 'Microsoft Azure, Google Compute Engine, I ss control analytics","All of the above"],"answer":[3],"explanation":"Lecture 41 (Fog Computing in IIoT): fog enables newer functionalities, enriches existing ones and enables real-time process control/analytics.","verified":"lecture","c":283},{"q":"What is the sub-application area of fog computing in smart road transportation systems?","options":["Smart traffic signal system","Healthcare","Mining industry","None of the above"],"answer":[0],"explanation":"Lecture 41 (Fog Computing in IIoT): transportation use cases - smart parking, traffic lights, internet of vehicles, location-aware services.","verified":"lecture","c":284},{"q":"State true or false — Smart parking, smart traffic light system, location-aware services, and the Internet of Vehicles are the possible use cases of Intelligent transportation systems.","options":["True","False"],"answer":[0],"explanation":"Lecture 41 (Fog Computing in IIoT): 'smart parking, traffic lights, internet of vehicles, location aware services'.","verified":"lecture","c":285},{"q":"Which of the following provide/s the fog platform?","options":["Nebbiolo Technologies","Crosser","FogHorn","All of the above"],"answer":[3],"explanation":"Lecture 41 (Fog Computing in IIoT): providers FogHorn, Nebbiolo, Crosser, Sonm.","verified":"lecture","c":286,"rel":[["Jul-Oct 2025",9,0]]},{"q":"Which of the following represents reserve word(s) in R programming?","options":["LOOPING","TRUE","BREAK-IN","CONTINUING"],"answer":[1],"explanation":"Lecture 42 (Tutorial for R & Julia): reserved words 'if else repeat while function for ... next break TRUE FALSE'.","verified":"lecture","c":287},{"q":"Which of the following cannot be performed by R programming?","options":["Assembly code generation","Data visualization","Graphics representation","Data Analysis"],"answer":[0],"explanation":"Lecture 42 (Tutorial for R & Julia): R is for programming, statistical analysis, graphics, data visualization/analytics - not assembly code generation.","verified":"lecture","c":288},{"q":"Which of the following way/s can be used for the declaration of variables in R programming?","options":["A:=10","B<->“Hi”","TRUE->C","10<-D"],"answer":[2],"explanation":"Lecture 42 (Tutorial for R & Julia) covers =, <-, <<-, -> assignment operators; only 'TRUE->C' is valid R (value -> name).","verified":"reasoning","c":289},{"q":"Fill in the blanks. _________ operator can be used to calculate the remainder of the division in R programming.","options":["/","\\","%%","!"],"answer":[2],"explanation":"Lecture 42 (Tutorial for R & Julia): '%% ... remainder of a division'.","verified":"lecture","c":290},{"q":"State true or false — ‘&’ is a special operator that can create a series of numbers for a vector in R programming.","options":["True","False"],"answer":[1],"explanation":"Lecture 42 (Tutorial for R & Julia): ':' creates a series of numbers; '&' is logical AND.","verified":"lecture","c":291},{"q":"Which of the following represents the correct order for the process of Data management?","options":["Acquisition -> Generation -> Storage -> Analysis","Generation -> Acquisition -> Storage -> Analysis","Acquisition -> Storage -> Generation -> Analysis","Generation -> Analysis -> Storage -> Acquisition"],"answer":[1],"explanation":"Lecture 43 (Data Management with Hadoop): generation -> acquisition -> storage -> analysis.","verified":"lecture","c":292},{"q":"Fill in the blanks. __________ is used to find the spatial relationship between the objects and to analyze the geographic relation among them.","options":["Streaming analytics","Time-series analytics","Spatial analytics","Descriptive analytics"],"answer":[2],"explanation":"Spatial analytics analyzes spatial/geographic relationships among objects (analytics types in Lecture 36 slides).","verified":"reasoning","c":293},{"q":"Which of the following represents the properties of data center networks?","options":["Inconsistent","Unreliable","Secure","Unscalable"],"answer":[2],"explanation":"Lecture 44 (Data Center Networks): DCN 'has to be stable, secure, reliable, ... scalable and ... agile'.","verified":"lecture","c":294},{"q":"Which of the following represents the topology used by the data center network?","options":["Eight-tier DCN","Jcell","Dcell","QCube"],"answer":[2],"explanation":"Lecture 44 (Data Center Networks): topologies three-tier, fat-tree, DCell, BCube.","verified":"lecture","c":295},{"q":"What are the challenges of a data center network?","options":["Scalability","Static resource assignment","Fault-tolerance","All of the above"],"answer":[3],"explanation":"Lecture 44 (Data Center Networks): challenges include scalability, static resource assignment, resource fragmentation, fault tolerance.","verified":"lecture","c":296},{"q":"State true or false —Software-Defined Network (SDN) never use OpenFlow protocol.","options":["True","False"],"answer":[1],"explanation":"Lecture 45 (SDN in IIoT Part 1)/Lecture 46 (SDN in IIoT Part 2): OpenFlow is the SDN protocol (demo uses OpenFlow 1.1).","verified":"lecture","c":297}]},{"year":2023,"session":"Jul-Oct 2023","week":10,"source":"Official NPTEL noc23_cs82 question images (pattern https://storage.googleapis.com/swayam-node1-production.appspot.com/assets/img/noc23_cs82/w10a10q1.png ... q15); answers by domain knowledge","questions":[{"q":"Which of the following is/are available within the public network in an SDIIoT architecture?","options":["Switches","Routers","Both (a) and (b)","None of the above"],"answer":[2],"explanation":"Lecture 46 (SDN in IIoT Part 2): public networks consist of switches, routers and access devices.","verified":"lecture","c":298},{"q":"State true or false — In SDIIoT architecture, the industrial cloud focuses on the data center network.","options":["True","False"],"answer":[0],"explanation":"Lecture 46 (SDN in IIoT Part 2): industrial cloud - 'data center and cloud data center networks more specifically'.","verified":"lecture","c":299},{"q":"Which of the following is addressed by a trustworthy IIoT?","options":["Security","Safety","Resilience","All of the above"],"answer":[3],"explanation":"Lecture 47 (Security in IIoT Part 1): trustworthiness covers security, privacy, reliability, resilience, safety.","verified":"lecture","c":300},{"q":"Fill in the blanks. The application layer of IIoT attack vectors includes ___________.","options":["Traffic Flooding","Misrouting","Data spoofing","Packet sniffing"],"answer":[2],"explanation":"Lecture 47 (Security in IIoT Part 1): data spoofing is an application-layer attack; flooding, misrouting, sniffing are network-layer.","verified":"lecture","c":301},{"q":"Which of the following is not a part of IIoT attack vectors in the physical layer?","options":["Impersonation attack","Man-in-the-middle attack","Jamming attack","Device tampering"],"answer":[1],"explanation":"Lecture 47 (Security in IIoT Part 1): physical - impersonation, jamming, device tampering; MITM is network layer.","verified":"lecture","c":302,"rel":[["Jan-Apr 2025",10,0]]},{"q":"Which of the following risk(s) is/are involved in IIoT security risk management?","options":["Avoiding risk","Mitigating risk","Outsourcing risk","All of the above"],"answer":[3],"explanation":"Lecture 47 (Security in IIoT Part 1): avoid, mitigate, outsource, accept/balance risks.","verified":"lecture","c":303,"rel":[["Jan-Apr 2026",10,0]]},{"q":"State true or false — The data protection of IIoT security does not address confidentiality.","options":["True","False"],"answer":[1],"explanation":"Lecture 48 (Security in IIoT Part 2): data protection includes confidentiality, integrity, availability.","verified":"lecture","c":304},{"q":"The building blocks of IIoT security include which of the following?","options":["Cloud Security","Fog device protections","Data Protection","All of the above"],"answer":[3],"explanation":"Lecture 48 (Security in IIoT Part 2): building blocks include cloud security, fog device security, data protection.","verified":"lecture","c":305,"rel":[["Jan-Apr 2024",10,0]]},{"q":"Fill in the blanks. Security standards for IIoT should include requirements of _______ and _______.","options":["International technology, Optional technology","Information technology, Operational technology","Intense technology, Operative technology","None of the above"],"answer":[1],"explanation":"Lecture 48 (Security in IIoT Part 2): 'security standards conforming with the requirements of IT and OT. Information technology and operation technology'.","verified":"lecture","c":306},{"q":"Which of the following represents the benefits of a smart factory?","options":["Unavailability of the real-time data","Unbalanced workload","Provisioning data analysis and quality control","Extended production time"],"answer":[2],"explanation":"Lecture 49 (Factories and Assembly Line): smart factory data 'analyzed and based on the analysis, quality control can be done'.","verified":"lecture","c":307},{"q":"Match the following. Features of Smart Factory: 1. Connected, 2. Transparent, 3. Agile, 4. Optimized. Description: i. Minimum manual intervention, ii. Continuous real-time data, iii. Live metrics for quick decision, iv. Flexibility and adaptability","options":["1-i, 2-ii, 3-iii, 4-iv","1-ii, 2-iii, 3-iv, 4-i","1-iii, 2-iv, 3-i, 4-ii","1-iv, 2-i, 3-ii, 4-iii"],"answer":[1],"explanation":"Lecture 49 (Factories and Assembly Line): connected = continuous real-time data; transparent = live metrics for decisions; agile = flexibility; optimized = minimal human intervention.","verified":"lecture","c":308},{"q":"Which of the following is false about Fanuc – Zero Downtime System?","options":["Is a robot maker","Uses predictive maintenance for reducing downtime","Does not predict component failure","Performs cloud-based analytics with the help of in-built sensors"],"answer":[2],"explanation":"Lecture 49 (Factories and Assembly Line): Fanuc zero downtime 'predicts component failure'.","verified":"lecture","c":983,"rel":[["Jan-Apr 2025",10,1]]},{"q":"State true or false. CityCrop renders intelligent indoor gardens for growing fruits, herbs, vegetables, greens, and edible flowers.","options":["True","False"],"answer":[0],"explanation":"Lecture 50 (Food Industry): 'CityCrop ... intelligent indoor garden to grow fruits, herbs, vegetables, greens and edible flowers'.","verified":"lecture","c":310},{"q":"Which of the following does not represent the characteristics of a smart factory?","options":["Connected environment","Improper utilization of resources","Dynamic decision making","Transparency of process status"],"answer":[1],"explanation":"Lecture 49 (Factories and Assembly Line): smart factory is connected, optimized, transparent, proactive, agile - not improper resource utilization.","verified":"lecture","c":311},{"q":"State true or false - As different persons and devices are associated with healthcare IoT systems, the risk of data tampering is high.","options":["True","False"],"answer":[0],"explanation":"Lecture 48 (Security in IIoT Part 2)/Lecture 51 (Healthcare): healthcare IoT involves many devices/people across device, fog, cloud layers, so tampering risk is high.","verified":"reasoning","c":312}]},{"year":2023,"session":"Jul-Oct 2023","week":11,"source":"Official NPTEL noc23_cs82 question images (pattern https://storage.googleapis.com/swayam-node1-production.appspot.com/assets/img/noc23_cs82/w11a11q1.png ... q15); answers by domain knowledge","questions":[{"q":"Which of the following is/are the major challenge(s) associated with the healthcare industry?","options":["Drug overdose","Wrong drug prescription","Costly hospitals and clinics","All of the above"],"answer":[3],"explanation":"L51 'IIoT Applications: Healthcare' lists ageing population, increasing diseases, rising hospital expenditure; drug overdose and wrong prescription are not in the lecture but are recognised healthcare problems, and 'All of the above' fits the template.","verified":"reasoning","c":313,"rel":[["Jan-Apr 2023",10,0]]},{"q":"Fill in the blanks. __________ is an example of a wireless ECG monitoring device.","options":["QardioCore","BMP280","ESP8266","BME280"],"answer":[0],"explanation":"L51 'IIoT Applications: Healthcare': 'QardioCore is an example of wireless ECG monitoring device.'","verified":"lecture","c":314},{"q":"Which of the following is a body temperature monitoring device?","options":["Ihealth BP5","Kinsa smart thermometer","Dexcom","ADAMM"],"answer":[1],"explanation":"L51 'IIoT Applications: Healthcare': 'Kinsa smart thermometer is IoT based body temperature monitoring device'.","verified":"lecture","c":315},{"q":"Which of the following represents an intelligent asthma monitoring device?","options":["BME280","Kinsa smart thermometer","ADAMM","Dexcom"],"answer":[2],"explanation":"L51 'IIoT Applications: Healthcare': 'ADAMM Intelligent Asthma Monitoring device'.","verified":"lecture","c":316},{"q":"Which of the following does not represents the challenge of IIoT in a power plant?","options":["Security issues","Scalability issues","Smart metering","Low power devices"],"answer":[2],"explanation":"L52 'IIoT Applications: Power Plants' challenges: security issues, low power devices, scalability, determinism; smart metering is an application, not a challenge.","verified":"lecture","c":317},{"q":"Fill in the blanks. _______ is the full form of SCDA.","options":["Supervisory Control and Data Acquisition","Superlative Control and Data Acquitance","Supervisory Condition and Data Acceptance","None of the above"],"answer":[0],"explanation":"L52 'IIoT Applications: Power Plants': 'SCADA-based control, supervisory control and data acquisition'.","verified":"lecture","c":318},{"q":"Which of the following does not represents communication networks?","options":["Home area network","House area network","Wide area network","Neighborhood area network"],"answer":[1],"explanation":"L52 'IIoT Applications: Power Plants' slide 'Communication Network': home area, neighborhood area, field area, wide area networks - no 'house area network'.","verified":"lecture","c":319},{"q":"State true or false — RFID tagging system comprises of RFID tag, read/write devices, and a host system.","options":["True","False"],"answer":[0],"explanation":"L53 'Inventory Management & Quality Control' slide: RFID tagging system consists of the RFID tag, read/write device, host system.","verified":"lecture","c":320},{"q":"Which of the following is true about passive RFID tags?","options":["Broadcasts information signals in the form of a beacons","Relies on backscattering","Have longer range than active RFID tags","Bulky and expensive as compared to active RFID"],"answer":[1],"explanation":"L53 'Inventory Management & Quality Control': passive tags 'work on the principle of backscattering'; beacons/longer range/bulky describe active tags.","verified":"lecture","c":321},{"q":"Which of the following is represented through the following statement? Statement- It has an onboard battery for powering the IC but does not have an active transmitter. It relies on backscattering. However, it neither depends on signals from the reader for power nor creates additional noise.","options":["Active RFID tags","Passive RFID tags","Semi-passive Tags","None of the above"],"answer":[2],"explanation":"L53 'Inventory Management & Quality Control': semi-passive tags have 'an onboard battery to power the IC ... no active transmitter ... relies on backscattering'.","verified":"lecture","c":322},{"q":"Match the following. Types of Network Security: 1. Firewalls, 2. Intrusion prevention systems, 3. Access control, 4. Antivirus and antimalware software. Description: i. Provide access based on user identity, ii. Scan for malware detection and prevention, iii. Barrier between the trusted internal network and the external networks, iv. Detection and blocking attacks","options":["1-iii, 2-iv, 3-i, 4-ii","1-ii, 2-iii, 3-iv, 4-i","1-i, 2-ii, 3-iii, 4-iv","1-iv, 2-i, 3-ii, 4-iii"],"answer":[0],"explanation":"L54 'Plant Security and Safety' slides: Firewalls - barrier between trusted internal and external networks; IPS - detection and blocking attacks; Access control - access based on user identity; Antivirus - scan for malware.","verified":"lecture","c":323},{"q":"Which of the following is an example of augmented reality?","options":["Oculus Rift","Samsung Gear VR","Bus stop prank by Pepsi Max","Google Cardboard"],"answer":[2],"explanation":"L54 'Plant Security and Safety' VR slide lists Oculus Rift, Samsung Gear VR, Google Cardboard as VR examples; the Pepsi Max bus-stop prank is the AR example.","verified":"lecture","c":324},{"q":"Which of the following represents IoT applications in facility management?","options":["Smart meter","Security and safety alarms","Both (a) and (b)","Neither (a) nor (b)"],"answer":[2],"explanation":"L55 'Facility Management' slides: IoT applications include Smart Meters and Security and Safety Alarms.","verified":"lecture","c":325,"rel":[["Jul-Oct 2022",11,0]]},{"q":"Which of the following does not represents the benefit of the IIoT applications in inventory management?","options":["Automation in the process of inventory tracking and packing","Inability to recognize the reason behind the bottlenecks in the operation","Optimization of the amount of inventory","Real-time update of the quality of inventory items, their location, and tracking"],"answer":[1],"explanation":"L53 'Inventory Management & Quality Control': IIoT brings automation, optimization, real-time visibility; inability to identify bottlenecks is not a benefit.","verified":"lecture","c":326},{"q":"Which of the following can be achieved by performing analytics in facility management?","options":["Unmanaged energy consumption","Unoptimized operational cost","Remote monitoring of the facilities","None of the above"],"answer":[2],"explanation":"L55 'Facility Management' slide 'Analytics in Facility Management': managing energy consumption, operational cost-optimization, remote monitoring of facilities.","verified":"lecture","c":327}]},{"year":2023,"session":"Jul-Oct 2023","week":12,"source":"Official NPTEL noc23_cs82 question images (pattern https://storage.googleapis.com/swayam-node1-production.appspot.com/assets/img/noc23_cs82/w12a12q1.png ... q15); answers by domain knowledge","questions":[{"q":"What are the benefits of using IoT in Oil and Gas Industries?","options":["Decreased production efficiency","Save cost and time","Deteriorate asset maintenance","None of the above"],"answer":[1],"explanation":"L56 'Oil, Chemical and Pharmaceutical Industry' benefits slide: 'Save cost and time'.","verified":"lecture","c":328},{"q":"Which of the following statement does not represents the advantage of using IoT in the chemical industry?","options":["Predictive maintenance","Reduce energy expenses","Maximize supply chain risks","Improve logistics"],"answer":[2],"explanation":"L56 'Oil, Chemical and Pharmaceutical Industry': chemical benefits include predictive maintenance, reduce energy expenses, improve logistics, MINIMIZE supply chain risk.","verified":"lecture","c":329},{"q":"What is/are the advantages of using IoT in the Pharmaceutical industry?","options":["Real-time monitoring","Inability to control the areas remotely","Increased production cost and wastage","All of the above"],"answer":[0],"explanation":"L56 'Oil, Chemical and Pharmaceutical Industry' pharma slide: 'Real time monitoring' (others are inverted).","verified":"lecture","c":330},{"q":"Which of the following can be performed through predictive maintenance?","options":["Address real-time issues","Reduce equipment breakdown","Efficient and effective maintenance","All of the above"],"answer":[3],"explanation":"L56 'Oil, Chemical and Pharmaceutical Industry' slide 'Predictive maintenance': address real time issues, reduce equipment breakdown, efficient and effective maintenance.","verified":"lecture","c":331},{"q":"State true or false — Through the application of IoT in the Pharmaceutical industry, it is possible to examine drugs and detect adverse drug reactions.","options":["True","False"],"answer":[0],"explanation":"L56 'Oil, Chemical and Pharmaceutical Industry' slide: 'Examine drugs - Detect Adverse Drugs Reaction (ADR)'.","verified":"lecture","c":332},{"q":"Which of the following is true about the features of second-generation UAVs?","options":["Static design, fixing camera mount, still photography, video recording, and manual steering control","Transformable designs, 1080 HD video or higher value instrumentation, three-axis gimbals","Improved safety and regulatory, platform and payload adaptability, automated safety modes","Enhanced intelligent piloting models and full autonomy, full airspace awareness, auto action"],"answer":[0],"explanation":"L57 'UAVs in Industries' generations slide: Second - 'Static design, fixing camera mount, still photography, video recording, and manual steering control'.","verified":"lecture","c":333},{"q":"What is/are the application field(s) of UAVs?","options":["Agriculture","Mining","Forestry","All of the above"],"answer":[3],"explanation":"L57 'UAVs in Industries': applications in agriculture, mining, forestry, etc.","verified":"lecture","c":334},{"q":"Which of the following does not represents an application of UAV in Agriculture?","options":["Crop health monitoring","Monitoring soil quality, counting plants, identifying plot size","Inspect construction site infrastructure and construct roadways","Increase effective yields"],"answer":[2],"explanation":"L57 'UAVs in Industries': 'Inspect infrastructures and constructing roadways' is on the Construction slide; the rest are Agriculture.","verified":"lecture","c":335},{"q":"State true or false — Precision forestry and canopy mapping cannot be performed through the application of UAV in forestry.","options":["True","False"],"answer":[1],"explanation":"L57 'UAVs in Industries' forestry slide lists 'Precision forestry and canopy mapping' as an application, so the statement is False.","verified":"lecture","c":336},{"q":"Which of the following does not represents the application of UAVs for energy management?","options":["Optimized use of seed, fertilizer, and water","Eliminate the need to get close to the dangerous wires","Inspections without climbing power poles","None of the above"],"answer":[0],"explanation":"L57 'UAVs in Industries' Energy Management slide: inspections without climbing poles, no need to get close to dangerous wires; seed/fertilizer/water is Agriculture.","verified":"lecture","c":337},{"q":"State true or false — One of the applications of UAVs in telecommunication is to perform tower inspection.","options":["True","False"],"answer":[0],"explanation":"L57 'UAVs in Industries' telecom slide: 'Tower inspection by UAVs'.","verified":"lecture","c":338,"rel":[["Jul-Oct 2025",12,0]]},{"q":"Match the following. Sector: 1. Mining, 2. Healthcare, 3. Forestry, 4. Warehousing. Application of UAVs: i. Scan a large number of items available in a warehouse, ii. Regular surface survey for optimized blast design, iii. Delivery of medicines, vaccines, and snake bite serum, iv. Display information about the forest species","options":["1-iii, 2-iv, 3-i, 4-ii","1-ii, 2-iii, 3-iv, 4-i","1-i, 2-ii, 3-iii, 4-iv","1-iv, 2-i, 3-ii, 4-iii"],"answer":[1],"explanation":"L57 'UAVs in Industries' slides: Mining - surface survey for blast design; Healthcare - delivery of medicines, vaccines, snake bite serum; Forestry - forest species info; Warehousing - scan items.","verified":"lecture","c":339},{"q":"What is/are the application(s) of UAVs in oil and gas industry?","options":["Reducing manpower requirements and increasing safety by eliminating the need for industrial mountaineering","Monitoring pipelines for detecting leakage of oil and gas pipelines","Collecting videos and thermal imagery of oil and gas fields","All of the above"],"answer":[3],"explanation":"L57 'UAVs in Industries' 'Application in Oil and Gas' slides: data collection (videos, thermal imagery), pipeline leak detection, reduce manpower/no industrial mountaineering.","verified":"lecture","c":340},{"q":"State true or false - UAV-based light displays are generally more expensive than traditional firework displays and cannot be reused.","options":["True","False"],"answer":[1],"explanation":"L57 'UAVs in Industries' slide 'Application in Entertainment': 'UAV-based light displays are cheaper and more exciting than traditional firework display'.","verified":"lecture","c":341,"rel":[["Jul-Oct 2025",12,0]]},{"q":"Which of the following is/are true about the necessity of case studies?","options":["The case study investigates real-life phenomena through a detailed analysis of related events.","The case study generally selects a vast geographical area or a large number of individuals as the subject matter.","Both (a) and (b)","Neither (a) nor (b)"],"answer":[1],"explanation":"Corrected after checking the lecture (was: The case study investigates real-life phenomena through a detailed analysis of related events.). L58 'Case Studies for Industry 4.0 & IIoT' slide: case study selects 'a small geographical area or a very limited number of individuals', so (b) is false; (a) is stated as true.","verified":"lecture","c":1016,"rel":[["Jan-Apr 2025",12,1]]}]},{"year":2022,"session":"Jul-Oct 2022","week":1,"source":"Official NPTEL noc22_cs95 question images (pattern https://storage.googleapis.com/swayam-node1-production.appspot.com/assets/img/noc22_cs95/w1a1q1.png ... q15); answers by domain knowledge; cross-checked with https://progiez.com/nptel-introduction-to-industry-4-assignment-1-answers (JUL-DEC 2022 section)","questions":[{"q":"Which of the following is/are the example(s) of a transducer?","options":["Strain gauge","Microphone","Speaker","All of the above"],"answer":[3],"explanation":"Lecture 01 (Sensing & Actuation): microphone, speaker, antenna and strain gauge are given as transducer examples.","verified":"lecture","c":343,"rel":[["Jul-Oct 2025",1,0]]},{"q":"Which of the following best describes the accuracy characteristic of a sensor?","options":["The highest and the lowest value that a sensor can sense","The degree of correctness or closeness with which a sensor can quantify a physical phenomenon.","Both (a) and (b)","None of the above"],"answer":[1],"explanation":"Lecture 01 (Sensing & Actuation): accuracy = correctness of the output; option a describes range.","verified":"lecture","c":344},{"q":"The ratio of incremental change in the response of the system with respect to incremental change in input parameter is known as-","options":["Linearity","Sensitivity","Repeatability","Drift"],"answer":[1],"explanation":"Lecture 01 (Sensing & Actuation): 'sensitivity indicates the ratio of incremental change in the response ... with respect to the incremental change in the input'.","verified":"lecture","c":345},{"q":"A sensor which is not capable of sensing any input independently is categorized as a -","options":["Dumb Sensor","Passive Sensor","Active Sensor","None of the above"],"answer":[1],"explanation":"Lecture 01 (Sensing & Actuation): 'A passive sensor cannot independently sense the input'.","verified":"lecture","c":346},{"q":"LDR is a type of ____________.","options":["Actuator","Digital sensor","Analog sensor","None of the above"],"answer":[2],"explanation":"Lecture 01 (Sensing & Actuation): analog sensors include 'light detection sensor, LDR'.","verified":"lecture","c":347},{"q":"Which of the following topologies is/are supported by the Zigbee protocol?","options":["Star","Mesh","Both (a) and (b)","None of the above"],"answer":[2],"explanation":"Lecture 02 (IoT Connectivity Part I): ZigBee supports star, P2P/cluster tree and mesh, so star and mesh both.","verified":"lecture","c":348},{"q":"What is a vector sensor?","options":["A sensor whose response is a function of magnitude of the input parameter only.","A sensor whose response depends on the magnitude of the direction and orientation of the input parameter.","Both a and b","None of the above"],"answer":[1],"explanation":"Lecture 01 (Sensing & Actuation): vector sensor response 'depends on the magnitude, the direction and the orientation'.","verified":"lecture","c":349,"rel":[["Jul-Oct 2026",1,0]]},{"q":"What does WPAN stand for in the context of IEEE communication protocols?","options":["Wireless Power Attention Network","Wireless Power Aggregator Network","Wireless Personal Area Network","None of the above"],"answer":[2],"explanation":"Lecture 02 (IoT Connectivity Part I): 802.15.4 is for 'wireless personal area networks'.","verified":"lecture","c":350},{"q":"Which of the following network topologies is/are supported by IEEE 802.15.4 ?","options":["Star","Peer-to-peer","Both a and b","None of the above"],"answer":[2],"explanation":"Lecture 02 (IoT Connectivity Part I): 802.15.4 topologies 'peer to peer topology, the star topology'.","verified":"lecture","c":351},{"q":"How many types of nodes are supported in the Zigbee protocol?","options":["3","2","1","0"],"answer":[0],"explanation":"Lecture 02 (IoT Connectivity Part I): 'ZigBee protocol defines three types of nodes: coordinator, router, end devices'.","verified":"lecture","c":352},{"q":"Which of the following Zigbee node(s) do(es) not contribute to routing in the Zigbee network?","options":["Coordinator","Router","End device","Both a and c"],"answer":[2],"explanation":"Lecture 02 (IoT Connectivity Part I): end devices 'do not contribute to further routing'.","verified":"lecture","c":353},{"q":"What is the maximum number of nodes supported in a Z-wave network?","options":["5","500","232","254"],"answer":[2],"explanation":"Lecture 03 (IoT Connectivity Part II): Z-wave mesh 'supporting up to about 232 nodes in a network'.","verified":"lecture","c":354},{"q":"Which of the following is/are not QoS policies of an IoT network?","options":["Data delivery","Data timeliness","Data optimization","Resource utilization"],"answer":[2],"explanation":"Lecture 04 (IoT Networking Part I): QoS policies are resource utilization, timeliness, availability, delivery - not data optimization.","verified":"lecture","c":355,"rel":[["Jan-Apr 2023",1,0]]},{"q":"Which of the following statements is true for MQTT?","options":["Works on Publish/Subscribe framework on top of TCP/IP architecture","Introduced by IBM and standardized by OASIS in 2018","Supports 5-level of QoS","Unreliable and expensive"],"answer":[0],"explanation":"Lecture 05 (IoT Networking Part II): MQTT 'introduced by IBM and standardized by OASIS in 2013 ... Publish/Subscribe ... on top of the existing TCP/IP'.","verified":"lecture","c":356},{"q":"________ works on the Request/Response framework based on the UDP architecture, including Datagram Transport Layer Security (DTLS) secure.","options":["MQTT","CoAP.","Zigbee","LoRA."],"answer":[1],"explanation":"Lecture 05 (IoT Networking Part II): CoAP works on top of UDP with DTLS for security (request/response).","verified":"lecture","c":357}]},{"year":2022,"session":"Jul-Oct 2022","week":2,"source":"Official NPTEL noc22_cs95 question images (pattern https://storage.googleapis.com/swayam-node1-production.appspot.com/assets/img/noc22_cs95/w2a2q1.png ... q15); answers by domain knowledge; cross-checked with https://progiez.com/nptel-introduction-to-industry-4-assignment-2-answers (JUL-DEC 2022 section)","questions":[{"q":"The Internet was a result of which of the following industrial revolutions?","options":["First Industrial Revolution","Second Industrial Revolution","Third Industrial Revolution","None of the above"],"answer":[2],"explanation":"Lecture 06 (The Fourth Revolution): third revolution brought computers, internet and the world wide web.","verified":"lecture","c":358},{"q":"______ Industrial Revolution is coined as “The Second Machine Age”","options":["Second","Internet","Fourth","Third"],"answer":[2],"explanation":"Lecture 06 (The Fourth Revolution): the fourth industrial revolution was called 'the second machine age'.","verified":"lecture","c":359},{"q":"Which of the following is/are the tipping points of 2025?","options":["Unlimited free storage","Connected clothing","Robotic Pharmacist","All of the above"],"answer":[3],"explanation":"Lecture 06 (The Fourth Revolution): 2025 tipping points: connected clothing, 'unlimited and free storage', trillions of sensors, 'robotic pharmacists'.","verified":"lecture","c":360},{"q":"Sustainable industry provides -","options":["Energy efficiency","Conservation of resources","Low-waste production","All of the above"],"answer":[3],"explanation":"Lecture 07 (Sustainability Assessment of Manufacturing Industry): sustainable industry provides energy efficiency, conservation of resources, low waste production.","verified":"lecture","c":361,"rel":[["Jul-Oct 2024",2,0],["Jul-Oct 2026",2,0]]},{"q":"____________ is considered the main nervous system of any manufacturing industry?","options":["Information and communication technology","Sustainable development","MQTT protocol","None of the above"],"answer":[0],"explanation":"Lecture 07 (Sustainability Assessment of Manufacturing Industry): ICT is the backbone/main nervous system of manufacturing industries.","verified":"lecture","c":362,"rel":[["Jul-Oct 2024",2,0],["Jul-Oct 2026",2,0]]},{"q":"What are the benefits of government regulation in manufacturing industries?","options":["Prevents the manufacturing industry from unfair competition","Prevents the manufacturing industry from compensating the workers fairly","Both a and b","None of the above"],"answer":[0],"explanation":"Lecture 07 (Sustainability Assessment of Manufacturing Industry): 'government regulation will help in basically avoiding unfair competition'.","verified":"lecture","c":363},{"q":"Waste elimination is one of the objectives of Lean manufacturing. Which of the following is a type of waste in manufacturing?","options":["Waiting time","Inventory","Transportation","Energy efficiency"],"answer":[0,1,2],"explanation":"Lecture 08 (Lean Production System): the seven wastes include transportation, waiting, motion, inventory, over-processing, defects, overproduction - energy efficiency is not a waste.","verified":"lecture","c":364},{"q":"What are the business requirements for the implementation of lean production system?","options":["Set right objectives","Clear about strategy","Clear about contributions","All of the above"],"answer":[3],"explanation":"Lecture 08 (Lean Production System): business requirements: 'setting the right objectives ... strategy ... contributions should be also clear'.","verified":"lecture","c":365},{"q":"What are the three drivers of motivation for companies to implement Lean production?","options":["Cost, time, quality","Technology, MQTT, CoAP","Learn, Teach, Adapt","Adapt, Do, Teach"],"answer":[0],"explanation":"Lecture 08 (Lean Production System): reasons to implement lean: reduce cost, reduce time, improve quality.","verified":"lecture","c":366},{"q":"Smart and connected products help in optimization by –","options":["Enhancing performance","Enabling remote services","Assisting in repairing the product","All of the above"],"answer":[3],"explanation":"Lecture 09 (Smart and Connected Business Perspective): optimization effect: 'enhance the overall performance ... enabling remote services, assisting in repairing the product'.","verified":"lecture","c":367},{"q":"What are the benefits of smart and connected products –","options":["Faster","Cheaper","Smart supply chain","All of the above"],"answer":[3],"explanation":"Lecture 09 (Smart and Connected Business Perspective): benefits: faster, cheaper, ... smart supply chain.","verified":"lecture","c":368},{"q":"Which of the following is/are mediums to get smart and connected products?","options":["Internet of Things","Sensors","Cloud computing","All of the above"],"answer":[3],"explanation":"Lecture 09 (Smart and Connected Business Perspective): mediums are sensors, IoT network, cloud and embedded systems.","verified":"lecture","c":369},{"q":"What are the key attributes of a smart busines
