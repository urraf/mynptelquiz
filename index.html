],"explanation":"L17: firefighting: 'real time monitoring of fires ... and early warning of different incoming disasters'.","verified":"lecture","c":752},{"q":"What are the three waves of industrial level innovation according to GE?","options":["The Internet Revolution, The Digital Revolution, The Industrial Internet","The Industrial Revolution, The Internet Revolution, The Industrial Internet","The Agricultural Revolution, The Internet Revolution, The Industrial Internet","The Scientific Revolution, The Industrial Revolution, The Internet Revolution"],"answer":[1],"explanation":"L18: 'first wave was the industrial revolution ... second wave was the internet revolution ... third wave ... industrial internet'.","verified":"lecture","c":1260,"rel":[["Jan-Apr 2024",4,0],["Jul-Oct 2026",4,1]]},{"q":"What are the three key elements of the Industrial Internet?","options":["Manual machines, basic analytics, isolated systems","Advanced analytics, intelligent machines, people at work","Traditional methods, paper-based records, local systems","Low-level computing, limited data, manual labor"],"answer":[1],"explanation":"L18: intelligent machines, advanced analytics, people at work.","verified":"lecture","c":754,"rel":[["Jul-Oct 2022",4,0],["Jan-Apr 2024",4,0],["Jan-Apr 2025",4,0],["Jul-Oct 2025",4,0]]},{"q":"What is a major drawback of Industrial Revolution?","options":["It had no impact on the environment","It created a bad working environment and inefficient processes","It reduced the use of fossil fuels","It enhanced the quality of life for all workers"],"answer":[1],"explanation":"L18: drawbacks were 'bad working environment of the workers' and 'inefficiency' (plus environmental waste).","verified":"lecture","c":1261,"rel":[["Jul-Oct 2026",4,1]]},{"q":"What is the primary source of IIoT data?","options":["Actuators","Controllers","Sensors","Network systems"],"answer":[2],"explanation":"L19: 'sensors are basically the primary source of IIoT data'.","verified":"lecture","c":756},{"q":"Which component is NOT part of the configurations involved in smart sensors?","options":["Multiparameter Sensing Unit","Analog Detection Circuit","Digital Signal Conditioning Unit","Manual Control Unit"],"answer":[3],"explanation":"L19: smart sensor configurations are 'multi parameter sensing unit ... analog detection circuit, digital signal conditioning unit, and interfacing unit to the bus'.","verified":"lecture","c":1262,"rel":[["Jul-Oct 2026",4,1]]},{"q":"What is the role of conventional sensing in industrial control systems?","options":["To increase the complexity of systems","To involve feedback automation of a process","To disconnect systems from feedback loops","To reduce the reliability of systems"],"answer":[1],"explanation":"L19: 'conventional sensing it involved getting some kind of feedback, automation of a process, in an industrial control system'.","verified":"lecture","c":758},{"q":"Which sector is predicted to have the highest growth in Industry 4.0 as per PwC’s Global Industry 4.0 Survey of 2016?","options":["Electronics","Manufacturing","Defense","Automotive"],"answer":[0],"explanation":"L20 shows the sector growth chart (electronics, manufacturing, defense, transportation, chemical, automotive, construction) and highlights electronics: 'current growth trend is about 40 to 50 percent ... predicted ... 70 to 80, so it is a huge leap'. The chart values for other sectors are not read out.","verified":"unsure","c":1263,"rel":[["Jul-Oct 2026",4,1]]},{"q":"What is the focus of the ‘Control Layer’ in the 5C Architecture for Cyber Physical Systems?","options":["Data collection","Sensor-based monitoring","Supervised control: Self-configure, Self-optimize, Self-adjust","Human-readable interpretation and data visualization"],"answer":[2],"explanation":"L20: 'the control layer ... supervised control, then ... self-configuration, self-optimization, self-adjustment'.","verified":"lecture","c":1264,"rel":[["Jul-Oct 2023",4,0],["Jul-Oct 2026",4,1]]},{"q":"In the existing GSM cellular phones, a smart card is used to provide security to e-commerce applications, using encryption and digital signatures. What is it called?","options":["Wireless Identity Module (WIM)","Trusted Platform Module (TPM)","USB Token","None of the above"],"answer":[0],"explanation":"Not in the transcripts; the smart card in GSM/WAP phones that gives e-commerce security through encryption and digital signatures is the Wireless Identity Module (WIM). TPM is a PC chip.","verified":"reasoning","c":761}]},{"year":2024,"session":"Jul-Oct 2024","week":5,"source":"https://progiez.com/introduction-to-industry-4-and-industrial-iot-week-5 ; cross-checked with https://www.beubihar.org.in/2024/08/nptel-introduction-to-industry-40-and_20.html","questions":[{"q":"Which of the following is an inclusion in the Industry 4.0 application as per ICP DAS?","options":["Manual data entry","Supply chain automation","Isolated machine operation","Traditional logistics"],"answer":[1],"explanation":"Lecture 21 (Industrial Processes - Part 2): ICP DAS M2M sector covers 'supply chain automation, logistics, motion control'.","verified":"lecture","c":762},{"q":"Which technology does Caterpillar integrate with IoT for enhanced machine interaction?","options":["Virtual Reality (VR)","Augmented Reality (AR)","Blockchain","Manual controls"],"answer":[1],"explanation":"Lecture 21 (Industrial Processes - Part 2): Caterpillar uses IoT and augmented reality.","verified":"lecture","c":763},{"q":"What is the objective of the Cisco & Fanuc smart factory initiative?","options":["Maximize downtime in industrial facilities","Minimize downtime in industrial facilities","Increase manual operations","Decrease system efficiency"],"answer":[1],"explanation":"Lecture 21 (Industrial Processes - Part 2): Cisco & Fanuc smart factory 'objective is to minimize the downtime in the industrial facility'.","verified":"lecture","c":764},{"q":"Which of the following is NOT one of the building blocks of a business model?","options":["Value Proposition","Market Segment","Employee Satisfaction","Revenue Generation and Margins"],"answer":[2],"explanation":"Lecture 22 (Business Models - Part 1): building blocks listed; employee satisfaction is not one.","verified":"lecture","c":765},{"q":"Which of the following is NOT a type of customer segment?","options":["Mass Market","Niche Market","Segmented Market","Unsegmented Market"],"answer":[3],"explanation":"Lecture 22 (Business Models - Part 1): segments: mass, niche, segmented, diversified, multi-sided.","verified":"lecture","c":766},{"q":"What is a characteristic of the Subscription Model in IoT business models?","options":["One-time charge","Recurring revenue through regular subscription fees","High upfront cost","Limited customer interaction"],"answer":[1],"explanation":"Lecture 22 (Business Models - Part 1): subscription model - not a one-time charge; fees charged on periodic usage, recurring revenue.","verified":"lecture","c":767},{"q":"Which of the following is NOT a type of IIoT business model?","options":["Cloud-based Business Model","Service-Oriented Business Model","Process-Oriented Business Model","Product-Based Business Model"],"answer":[3],"explanation":"Lecture 23 (Business Models - Part 2): IIoT models are cloud-based, service-oriented, process-oriented.","verified":"lecture","c":768,"rel":[["Jul-Oct 2023",5,0]]},{"q":"What is an SLA in the context of business transactions?","options":["Service-level agreement","Socio legal amendment","Stop Loss Activation","Symmetrical Link Aggregation"],"answer":[0],"explanation":"SLA = service-level agreement (standard term; not a lecture topic).","verified":"reasoning","c":769},{"q":"What does Infrastructure-as-a-Service (IaaS) provide?","options":["Only software online in the cloud","Required hardware and software online in the cloud","Only data storage services","Manual computing resources"],"answer":[1],"explanation":"Lecture 23 (Business Models - Part 2): IaaS - hardware/computing infrastructure offered as a service (slide: required hardware and software online).","verified":"lecture","c":770},{"q":"Which business model aims at process optimization within a company and across company","options":["Cloud-Based Business Model","Service-Oriented Business Model","Process-Oriented Business Model","Product-Based Business Model"],"answer":[2],"explanation":"Lecture 23 (Business Models - Part 2): process-oriented model - 'processes will have to be optimized within a company, and across different company borders'.","verified":"lecture","c":771},{"q":"What type of KPI is input-oriented and hard to measure?","options":["Leading KPI","Lagging KPI","Output KPI","Static KPI"],"answer":[0],"explanation":"Lecture 24 (Reference Architecture - Part 1): leading KPI 'is input-oriented, and is hard to measure'.","verified":"lecture","c":772},{"q":"Which of the following is a major focus and activity of Industrial Internet Consortium (IIC) members?","options":["Market analysis","Testbeds","Customer surveys","Manual data entry"],"answer":[1],"explanation":"Lecture 24 (Reference Architecture - Part 1): 'testbeds are an area of major focus and activity of the different IIC members'.","verified":"lecture","c":773},{"q":"What does the Usage Viewpoint in IIRA relate to?","options":["System requirements and key objectives","High-level specifications and fundamental capabilities","Key capabilities identified in the business viewpoint and activities coordinating different units of work","Interfaces, protocols, and system characteristics"],"answer":[2],"explanation":"Lecture 25 (Reference Architecture - Part 2): 'usage viewpoints are related with the key capabilities that are identified in the business viewpoint and the activities that coordinate the different units of work'.","verified":"lecture","c":774},{"q":"What are the elements of an activity in the Usage Viewpoint of IIRA?","options":["Role, Task, Workflow, Implementation Map","Trigger, Workflow, Constraints, Effects","Physical Systems, Control, Sense, Actuation","Vision, Values, Key Objectives, Fundamental Capabilities"],"answer":[1],"explanation":"Lecture 25 (Reference Architecture - Part 2): activity elements are trigger, workflow, effects and constraints.","verified":"lecture","c":775},{"q":"Which viewpoint relates to the technical representation of an IIoT system, including interfaces and protocols?","options":["Business Viewpoint","Usage Viewpoint","Functional Viewpoint","Implementation Viewpoint"],"answer":[3],"explanation":"Lecture 25 (Reference Architecture - Part 2): 'Implementation viewpoint relates to the technical presentation of the IIoT system ... interconnection of different components'.","verified":"lecture","c":1476,"rel":[["Jan-Apr 2026",5,1]]}]},{"year":2024,"session":"Jul-Oct 2024","week":6,"source":"https://progiez.com/introduction-to-industry-4-and-industrial-iot-week-6 ; cross-checked with https://www.beubihar.org.in/2024/08/nptel-introduction-to-industry-40-and_30.html","questions":[{"q":"Which of the following is one of the benefits of sensor usage in industry?","options":["Increasing downtime due to routine maintenance","Reduced manual intervention for sensing in hazardous areas","Manual data entry","Limited operational efficiency"],"answer":[1],"explanation":"Lecture 26 (Key Enablers: Sensing - Part 1): sensors improve safety, monitoring, remote diagnostics; the other options are not benefits.","verified":"lecture","c":777},{"q":"Ultrasonic sensors can be used for – Fill in the blank.","options":["Object detection","Distance measurement","Dynamic body detection","All of the above"],"answer":[3],"explanation":"Lecture 26 (Key Enablers: Sensing - Part 1): ultrasonic sensors 'used for object detection, measuring distance, dynamic body detection'.","verified":"lecture","c":778},{"q":"Which sensor can be used for distance measurement, pattern matching, color checking, structured lighting, and motion capture?","options":["Acceleration sensor","PIR Sensor","Ultrasonic sensor","Image sensor"],"answer":[3],"explanation":"Lecture 26 (Key Enablers: Sensing - Part 1) lists image sensors without detail; distance measurement, pattern matching, color checking, structured lighting, motion capture are image-sensor uses (PIR/ultrasonic uses are given separately).","verified":"reasoning","c":779},{"q":"What is another name for MOS gas sensors?","options":["Electro-Resistive Gas sensors","Chemi-Resistive Gas sensors","Photo-Resistive Gas sensors","Thermo-Resistive Gas sensors"],"answer":[1],"explanation":"Lecture 27 (Key Enablers: Sensing - Part 2): 'MOS gas sensors are chemi-resistive gas sensors'.","verified":"lecture","c":780},{"q":"What is the ‘Optimum Temperature’ in the context of MOS gas sensors?","options":["The temperature at which the sensor does not respond","The temperature at which the sensor gives the best response","The lowest temperature at which the sensor operates","The highest temperature the sensor can withstand"],"answer":[1],"explanation":"Lecture 27 (Key Enablers: Sensing - Part 2): 'a particular temperature at which the sensor gives the best response ... that is optimum temperature'.","verified":"lecture","c":781},{"q":"What happens to the resistance of a gas sensor when it detects Volatile Organic Compounds (VOCs)?","options":["The resistance remains constant","The resistance changes from its baseline resistance","The resistance increases only","The resistance decreases only"],"answer":[1],"explanation":"Lecture 27 (Key Enablers: Sensing - Part 2): on sensing VOCs 'their resistive properties change with respect to the baseline resistance'.","verified":"lecture","c":782},{"q":"What are the typical requirements for industrial communication?","options":["High duty-cycle, high latency, high jitter","Real-time, very low duty-cycle, very low latency, very low jitter","Manual data processing, high latency, low duty-cycle","High duty-cycle, low latency, high jitter"],"answer":[1],"explanation":"Lecture 28 (Connectivity - Part 1): real-time, 'very low duty cycle', 'very low latency', 'very low jitter'.","verified":"lecture","c":783,"rel":[["Jan-Apr 2023",6,0]]},{"q":"What is the range of data transmission rate for EtherCat?","options":["10 Mbps","100 Mbps","1Gbps","200 Mbps"],"answer":[3],"explanation":"Lecture 28 (Connectivity - Part 1): 'range of data transmission in EtherCAT is typically ... about 200 Mbps'.","verified":"lecture","c":784},{"q":"Which topology is the EtherNet/IP standard based on?","options":["Universal Serial Bus topology","Active star topology","Passive bus topology","Hybrid ring topology"],"answer":[1],"explanation":"Lecture 28 (Connectivity - Part 1): 'Ethernet IP uses the star topology'.","verified":"lecture","c":785},{"q":"Which Profibus variant handles communication between PCs and Programmable Logic Controllers?","options":["Profibus DP","Profibus PA","Profibus FMS","Profibus MBP"],"answer":[2],"explanation":"Lecture 29 (Connectivity - Part 2): 'Profibus FMS ... handles the communication between the PCs and the PLCs'.","verified":"lecture","c":1489,"rel":[["Jan-Apr 2026",6,1]]},{"q":"Which Profibus variant is suitable for hazardous environments?","options":["Profibus DP","Profibus PA","Profibus FMS","Profibus MBP"],"answer":[1],"explanation":"Lecture 29 (Connectivity - Part 2): Profibus PA/MBP for hazardous environments.","verified":"lecture","c":787},{"q":"Which network topology does the Interbus use?","options":["Active Ring Topology","Bus Topology","Mesh Topology","Star Topology"],"answer":[0],"explanation":"Lecture 29 (Connectivity - Part 2): Interbus ring topology.","verified":"lecture","c":788,"rel":[["Jan-Apr 2026",6,0]]},{"q":"What is the latency supported by Tactile Internet?","options":["<1ms round trip latency","10-20 ms round trip latency","50-100 ms round trip latency","200-500 ms round trip latency"],"answer":[0],"explanation":"Lecture 30 (Connectivity - Part 3): 'low end-to-end latency of less than 1 millisecond RTT'.","verified":"lecture","c":789},{"q":"Which frequency band does the 5G NR use for high-band communication?","options":["<1GHz","1-6 GHz",">24GHz","10-20 GH"],"answer":[2],"explanation":"Lecture 30 (Connectivity - Part 3): high band > 24 GHz.","verified":"lecture","c":790},{"q":"What are the three components of the Modbus architecture?","options":["Modbus Node, Modbus Junction, Modbus Branch","Modbus Client, Modbus Router, Modbus Server","Modbus Publisher, Modbus Broker, Modbus Subscribers.","Modbus Master, Modbus Gateway, Modbus Slaves"],"answer":[3],"explanation":"Lecture 28 (Connectivity - Part 1): Modbus TCP firmware example - PLC/HMI/SCADA masters over Ethernet to a device master (gateway) and Modbus serial slaves.","verified":"lecture","c":791}]},{"year":2024,"session":"Jul-Oct 2024","week":7,"source":"https://progiez.com/introduction-to-industry-4-and-industrial-iot-week-7","questions":[{"q":"_______________stands for L in LPWAN. Fill in the blanks","options":["Low","Less","Light","Level"],"answer":[0],"explanation":"LPWAN = low power wide area network (Lecture 31: Key Enablers of IIoT: Connectivity – Part 4 (LoRa/SIGFOX + NodeMCU demo)).","verified":"lecture","c":792},{"q":"In which of the following radio bands does the SIGFOX radio link operate?","options":["Licensed ISM radio bands","Unlicensed ISM radio bands","Licensed GPS radio bands","Unlicensed GPS radio bands"],"answer":[1],"explanation":"'unlicensed ISM radio bands' (Lecture 31: Key Enablers of IIoT: Connectivity – Part 4 (LoRa/SIGFOX + NodeMCU demo)).","verified":"lecture","c":793},{"q":"The wireless throughput achieved by SIGFOX is up to ……………..bits per second. Fill in the blanks.","options":["10","100","1000","10000"],"answer":[1],"explanation":"'throughput ... using SIGFOX is up to 100 bps' (Lecture 31: Key Enablers of IIoT: Connectivity – Part 4 (LoRa/SIGFOX + NodeMCU demo)).","verified":"lecture","c":794},{"q":"Which IEEE standard is the physical and MAC layer of Zigbee based on?","options":["IEEE 802.11","IEEE 802.15.20","IEEE 802.15.4","IEEE 802.3"],"answer":[2],"explanation":"IEEE 802.15.4 (Lecture 32: Key Enablers of IIoT: Connectivity – Part 5 (Zigbee/Xbee demo)).","verified":"lecture","c":795,"rel":[["Jan-Apr 2026",7,0]]},{"q":"“Zigbee’s communication ranges typically vary between 10-100 meters depending on the device variant.” State true or false.","options":["True","False"],"answer":[0],"explanation":"'The communication range in ZigBee varies from 10 to 100 meters' (Lecture 32: Key Enablers of IIoT: Connectivity – Part 5 (Zigbee/Xbee demo)).","verified":"lecture","c":796},{"q":"Which of the following is a product by Digi?","options":["XBee","Jbee","Xigbee","Jigbee"],"answer":[0],"explanation":"'Xbee is a product from the company Digi' (Lecture 32: Key Enablers of IIoT: Connectivity – Part 5 (Zigbee/Xbee demo)).","verified":"lecture","c":797},{"q":"What is the full form of CPS that seamlessly monitors and controls the physical processes by integrating computational and physical components?","options":["Cyber Physical Systems","Cyber Practical Systems","Computer Physical Systems","Cyber Physical Store"],"answer":[0],"explanation":"CPS = Cyber Physical Systems (used throughout the processing/analytics lectures); other expansions are not real terms.","verified":"reasoning","c":798},{"q":"Which of the following is/are true about rule-based engines in the context of Complex Event Processing?","options":["Extract causal and temporal patterns using predefined rules","Handles multiple data streams and correlates them to provide meaningful output","Can process data in near real-time","All of the above"],"answer":[3],"explanation":"Extract causal/temporal patterns, correlate event streams from different sources, process in near real-time — all attributed to rule-based CEP (Lecture 33: Key Enablers of IIoT: Processing – Part 1).","verified":"lecture","c":799},{"q":"Which of the following is false about middleware in the context of IIoT processing?","options":["It is the software layer between the infrastructure layer and the application layer","It provides services according to device functionality","It does not support for heterogeneity, security","Many middleware solutions are based on service-oriented architecture"],"answer":[2],"explanation":"Middleware provides services per device functionality, handles heterogeneity and security, many are SOA-based (Lecture 33: Key Enablers of IIoT: Processing – Part 1); (c) is the false one.","verified":"lecture","c":800},{"q":"The SWAMP project developed IoT-based methods and approaches for smart water management in the precision irrigation domain. Which of the following services can be rendered by Smart Water Management Platform?","options":["Entirely replicable services","Fully customizable services","Application-specific services","All of the above"],"answer":[3],"explanation":"SWAMP services: replicable services, customizable services for water management/distribution, application-specific services (Lecture 34: Key Enablers of IIoT: Processing – Part 2).","verified":"lecture","c":801},{"q":"“The objectives of Vineyard Health Monitoring is to increase the yield and quality of grapes with optimal water use.” State true or false.","options":["True","False"],"answer":[0],"explanation":"Vineyard monitoring objective: 'increase yield, quality of grapes and optimal use of water' (Lecture 34: Key Enablers of IIoT: Processing – Part 2).","verified":"lecture","c":802},{"q":"SmartSantander is an IoT-based smart city deployment platform for large-scale applications. What does AAA stand for in its architecture layer?","options":["Authentication, Authorization, and Accounting","Automation, Application, and Accounting","Automation, Authorization, and Accounting","Authentication, Application, and Accounting"],"answer":[0],"explanation":"'authentication authorization accounting' (Lecture 34: Key Enablers of IIoT: Processing – Part 2).","verified":"lecture","c":803},{"q":"“Open Loop Control is never used to control decisions independent of process variables in Industrial Control Systems.” State true or false.","options":["True","False"],"answer":[1],"explanation":"'open loop ... the control decision is made independent of the process variable' (Lecture 35: Key Enablers of IIoT: Process Control) — so 'never used' is false.","verified":"lecture","c":804},{"q":"_____________is a type of Industrial Control Systems. Fill in the blanks.","options":["Programmable Local Controllers","Distributed Command Systems","Supervisory Control and Data Acquisition","Distinct Control Systems"],"answer":[2],"explanation":"SCADA is one of the three ICS types (Lecture 35: Key Enablers of IIoT: Process Control).","verified":"lecture","c":805,"rel":[["Jul-Oct 2022",7,0]]},{"q":"Which of the following is not a component of Supervisory Control and Data Acquisition?","options":["Remote Telemetry Units","Remote Telephonic Units","SCADA master units","Human-Machine Interface"],"answer":[1],"explanation":"SCADA components include telemetry units, SCADA master units, HMI (Lecture 35: Key Enablers of IIoT: Process Control); 'Remote Telephonic Units' is not one.","verified":"lecture","c":806}]},{"year":2024,"session":"Jul-Oct 2024","week":8,"source":"https://progiez.com/introduction-to-industry-4-and-industrial-iot-week-8 ; cross-checked with https://www.beubihar.org.in/2024/09/nptel-introduction-to-industry-40-and.html","questions":[{"q":"Which of the following statements is TRUE about unsupervised methods?","options":["They require labeled data to function.","They find structure in the input data on their own.","They are always more accurate than supervised methods.","They are not at all useful for clustering tasks."],"answer":[1],"explanation":"'unsupervised learning methods basically extract a structure ... in the input data on their own' (Lecture 36: IIoT Analytics and Data Management: Introduction).","verified":"lecture","c":807},{"q":"“Deployment of IIoT analytics typically consists of three steps – i) train a (predictive) analytics model, ii) test and validate the model on previously unseen data, and iii) deploy the model to make predictions on real (streaming) data.” State True or False.","options":["True","False"],"answer":[0],"explanation":"'train a model ... test and validate ... on some previously unseen data and thereafter deploy that model to make predictions on ... data ... streamed in real time' (Lecture 36: IIoT Analytics and Data Management: Introduction).","verified":"lecture","c":808},{"q":"……………………….requires fine-tuning a trained model. This approach requires less amount of data. Therefore, the time required for processing and computation may be reduced from hours to minutes and from weeks to days. Fill in the blanks.","options":["Transfer Learning","Decision Tree","Regression","Naive Bayes"],"answer":[0],"explanation":"Not in the original lectures; fine-tuning a pretrained model with less data is transfer learning.","verified":"reasoning","c":809},{"q":"Which of the following is false about Reinforcement Learning?","options":["There is an external supervisor to guide the agent.","There is a reward function which acts as feedback to the agent.","It builds a knowledge graph from the constant feedback of the corresponding actions.","None of the above"],"answer":[0],"explanation":"RL has 'a reward-penalty structure'; it has no external supervisor, builds a knowledge graph from feedback, and has an input-output mapping (Lecture 37: Machine Learning and Data Science – Part 1).","verified":"lecture","c":810,"rel":[["Jan-Apr 2024",8,1]]},{"q":"Which of the following machine learning techniques is used to identify similar groups of data, coined as clustering?","options":["Supervised","Unsupervised","Classification","Regression"],"answer":[1],"explanation":"Unsupervised learning identifies similar groups — clustering (Lecture 37: Machine Learning and Data Science – Part 1).","verified":"lecture","c":811},{"q":"In………… one data point may belong to more than one cluster. Fill in the blanks.","options":["K-Means","Fuzzy c-Means","Naive Bayes","Decision Tree"],"answer":[1],"explanation":"FCM (Lecture 37: Machine Learning and Data Science – Part 1).","verified":"lecture","c":812,"rel":[["Jan-Apr 2026",8,0]]},{"q":"“Machine learning is a subset of deep learning which can learn automatically by finding the features of the object on its own.” State True or False.","options":["True","False"],"answer":[1],"explanation":"Reversed: DL is a subfield of ML that learns features on its own (Lecture 38: Machine Learning and Data Science – Part 2).","verified":"lecture","c":813,"rel":[["Jan-Apr 2024",8,0]]},{"q":"When does a deep learning model typically provide better accuracy?","options":["When the amount of data is very limited","When the amount of data is huge","When data is unavailable","All of the above"],"answer":[1],"explanation":"'DL gives improved performance with respect to accuracy when the data volume increases' (Lecture 38: Machine Learning and Data Science – Part 2).","verified":"lecture","c":814},{"q":"Which of the following can be achieved by deploying cloud in IIoT?","options":["High computational speed for data monitoring and analytics","Scalable and secure services","Storage of huge amounts of data","All of the above"],"answer":[3],"explanation":"High computational speed, storage, scalable/secure services (Lecture 39: Cloud Computing in IIoT – Part 1).","verified":"lecture","c":815},{"q":"Which of the following services can NOT be provided by utilizing cloud computing?","options":["Software-as-a-Service","Platform-as-a-Service","Pivot-as-a-Service","Infrastructure-as-a-Service"],"answer":[2],"explanation":"SaaS, PaaS, IaaS (Lecture 39: Cloud Computing in IIoT – Part 1).","verified":"lecture","c":816},{"q":"Which of the following is rendered by a Consumer IoT cloud platform?","options":["A large number of data points","Modest security","Return on investment (ROI) sensitive","Quality of Service"],"answer":[1],"explanation":"Consumer IoT clouds have 'modest levels of security'; large data points, QoS and ROI belong to industrial IoT clouds (Lecture 39: Cloud Computing in IIoT – Part 1).","verified":"lecture","c":817},{"q":"MindSphere is the cloud-based, open IoT operating system. Which of the following features are supported by the MindSphere?","options":["Security supports","Procurement and distribution","Automated exploitation of performance and intelligence","All of the above"],"answer":[3],"explanation":"MindSphere features: 'security support ... procurement and distribution ... automated exploration of performance and intelligence' (Lecture 39: Cloud Computing in IIoT – Part 1).","verified":"lecture","c":818},{"q":"Which of the following is not a C3 IoT Platform tool?","options":["ExMachina","Data Explorer","Data Science Notebook","Type Developer"],"answer":[3],"explanation":"C3 IoT tools: Data Integrator, IDE, Data Explorer, Analytics Designer, Ex Machina, Data Science Notebook, Type Designer (Lecture 40: Cloud Computing in IIoT – Part 2) — not 'Type Developer'.","verified":"lecture","c":819},{"q":"“Cashify is an Industrial IoT platform that facilitates real-time monitoring and low-cost solutions.” State true or false.","options":["True","False"],"answer":[1],"explanation":"That description is of Meshify, not Cashify (Lecture 40: Cloud Computing in IIoT – Part 2).","verified":"lecture","c":820},{"q":"Which of the following statements is false about fog computing?","options":["An added layer between the edge and the cloud layer","A complete replacement of Cloud","Distributed at one level, centralized on the other","Intelligent in providing services like filtering, aggregation, and translation"],"answer":[1],"explanation":"'fog cannot do everything ... it is not that fog layer can do all the processing' (Lecture 40: Cloud Computing in IIoT – Part 2); 'fog does not stand on its own' (Lecture 41: Fog Computing in IIoT).","verified":"lecture","c":821,"rel":[["Jan-Apr 2025",9,0]]}]},{"year":2024,"session":"Jul-Oct 2024","week":9,"source":"https://progiez.com/introduction-to-industry-4-and-industrial-iot-week-9","questions":[{"q":"Why is fog computing important for IIoT applications?","options":["To decrease the cloud storage capacity","To provision immediate action and quick response to time-sensitive data","To eliminate local data processing","To eliminate the need for provisioning data security"],"answer":[1],"explanation":"Lecture 41 (Fog Computing in IIoT): time-sensitive critical data needs 'immediate action or quicker response'.","verified":"lecture","c":822},{"q":"Which of the following IIoT solutions can be rendered using Fog?","options":["Virtualization","Automation","Communication","All of the above"],"answer":[3],"explanation":"Lecture 41 (Fog Computing in IIoT): 'fog advanced hardware and software features such as virtualization, automation, communication, analysis, prediction'.","verified":"lecture","c":823},{"q":"Which of the following is not a fog platform provider?","options":["FogHorn","DHT11","Crosser","Sonm"],"answer":[1],"explanation":"Lecture 41 (Fog Computing in IIoT): providers FogHorn, Nebbiolo, Crosser, Sonm; DHT11 is a temperature/humidity sensor.","verified":"lecture","c":824,"rel":[["Jul-Oct 2025",9,0]]},{"q":"“Reserve words in R programming language have special meanings and can be used as variable names and function names.” State True or False.","options":["True","False"],"answer":[1],"explanation":"Lecture 42 (Tutorial for R & Julia): reserved words 'have some special meaning and ... cannot be used as a variable name'.","verified":"lecture","c":825},{"q":"Which of the following methods is the correct format for declaring a variable in the R programming language?","options":["A=10","A->10","#A=>10","A=10"],"answer":[0],"explanation":"Lecture 42 (Tutorial for R & Julia): 'a equal to 20' assignment (A=10) is valid; A->10 and #A=>10 are invalid (duplicate option text is a scraping artifact).","verified":"lecture","c":826},{"q":"………..syntax is used by Julia programming language to print in the console. Fill in the blanks.","options":["println()","print()","p()","printx()"],"answer":[0],"explanation":"Lecture 42 (Tutorial for R & Julia): 'println ... is used for printing'.","verified":"lecture","c":827},{"q":"……….is the data type available in the R programming language. Fill in the blanks.","options":["TRUE","else","Integer","break"],"answer":[2],"explanation":"Lecture 42 (Tutorial for R & Julia): data types logical, numeric, integer, complex, character, raw; TRUE/else/break are reserved words.","verified":"lecture","c":828},{"q":"Which of the following syntax is used to load the package in R programming language?","options":["library()","load()","package()","import()"],"answer":[0],"explanation":"Lecture 42 (Tutorial for R & Julia): 'library caret ... will basically help you in loading these libraries'.","verified":"lecture","c":829},{"q":"Which of the following statements is false about the Julia programming language?","options":["Open source","Distributed computation and parallelism possible","Does not efficiently support Unicode","Call c functions directly"],"answer":[2],"explanation":"Lecture 42 (Tutorial for R & Julia): Julia is open source, supports distributed computation/parallelism and C function calls; Julia has full Unicode support, so 'does not support Unicode' is false.","verified":"reasoning","c":830},{"q":"Which of the following file systems is derived from the open-source codes of Google File System?","options":["HDFS","FAT","NTFS","UDF"],"answer":[0],"explanation":"Lecture 43 (Data Management with Hadoop): HDFS listed with GFS; Hadoop is 'open source implementation for GFS and MapReduce'.","verified":"lecture","c":831},{"q":"“Hadoop is an open-source implementation for Google File System and MapReduce.” State True or False.","options":["True","False"],"answer":[0],"explanation":"Lecture 43 (Data Management with Hadoop): 'open source implementation for GFS and MapReduce'.","verified":"lecture","c":832},{"q":"Which of the following is not a property of Data Center Networks?","options":["Rigid","Secure","Reliable","Scalable"],"answer":[0],"explanation":"Lecture 44 (Data Center Networks): desirable properties stable, secure, reliable, scalable, agile - not rigid.","verified":"lecture","c":833},{"q":"Which of the following represent(s) data center network topologies?","options":["Three-tier DCN","BCube","DCell","All of the above"],"answer":[3],"explanation":"Lecture 44 (Data Center Networks): four topologies three-tier, fat-tree, DCell, BCube.","verified":"lecture","c":834},{"q":"“In Software Defined Networking (SDN), forwarding devices forward an incoming traffic based on the control logic defined by the SDN controller.” State True or False.","options":["True","False"],"answer":[0],"explanation":"Lecture 45 (SDN in IIoT Part 1): 'forwarding devices that forward the incoming traffic based on certain control logic ... defined by the SDN controller'.","verified":"lecture","c":835},{"q":"A ______ consists of single or multiple public, community, or private fog nodes, which are logically combined to provide services to multiple organizations. Fill in the blank.","options":["Private fog node","Community fog node","Public fog node","Hybrid fog node"],"answer":[3],"explanation":"NIST fog deployment models (private/community/public/hybrid fog node): a hybrid fog node is a composition of two or more private, community or public fog nodes.","verified":"reasoning","c":836}]},{"year":2025,"session":"Jan-Apr 2025","week":1,"source":"https://www.youtube.com/watch?v=9W3LLBpTd0E","questions":[{"q":"Fill in the blank space designated by the question mark. [Diagram: Input Signal -> Sensor -> ? -> Actuator -> Output Signal; Sensor and '?' are grouped as the transducer's input side, '?' and Actuator as the transducer's output side]","options":["Snubber","Repeater","Processor","Amplifier"],"answer":[2],"explanation":"Lecture 01 (Sensing & Actuation): 'this sensor plus the processor ... this is a transducer. Similarly, actuator plus processor is also a transducer'.","verified":"lecture","c":1222,"rel":[["Jul-Oct 2026",1,1]]},{"q":"What is the maximum data rate of Z-Wave communication technology?","options":["100 kbps","250 kbps","500 kbps","1 Mbps"],"answer":[0],"explanation":"Lecture 03 (IoT Connectivity Part II): Z-wave 'data rate is up to offered is up to about 100 kbps' over ~30 m.","verified":"lecture","c":1215,"rel":[["Jul-Oct 2026",1,1]]},{"q":"Which device converts electromagnetic energy into electricity and vice versa?","options":["Speaker","Antenna","Microphone","Strain gauge"],"answer":[1],"explanation":"Lecture 01 (Sensing & Actuation): 'antennas which will convert electromagnetic energy into electrical energy and vice versa'.","verified":"lecture","c":839},{"q":"What does 'Range' indicate in a sensor?","options":["The correctness of the output","The smallest change in input that can be detected","The difference between the standard value and the value produced by the sensor","The highest and the lowest value of the physical quantity within which the sensor can actually sense"],"answer":[3],"explanation":"Lecture 01 (Sensing & Actuation): range 'means the range of operation lowest value to highest value'.","verified":"lecture","c":1218,"rel":[["Jul-Oct 2024",1,0],["Jul-Oct 2026",1,1]]},{"q":"Which coding scheme is used by the IEEE 802.15.4 standard for transmitting information?","options":["CSS","THSS","OFDM","DSSS"],"answer":[3],"explanation":"Lecture 02 (IoT Connectivity Part I): 'DSSS, the direct sequence spread spectrum coding scheme that is used to transmit information'.","verified":"lecture","c":1217,"rel":[["Jul-Oct 2026",1,1]]},{"q":"What is the standard transmission range of IEEE 802.15.4?","options":["10 m to 75 m","1m to 9 m","15 cm to 60 cm","1 cm to 10 km"],"answer":[0],"explanation":"Lecture 02 (IoT Connectivity Part I): 802.15.4 'range typically is about 10 to 75 meters'.","verified":"lecture","c":842},{"q":"Which low-power radio communication technology was designed as a simpler and cheaper alternative to Zigbee for small to medium-range connectivity?","options":["Bluetooth","Z-Wave","RFID","NFC"],"answer":[1],"explanation":"Lecture 03 (IoT Connectivity Part II): 'unlike ZigBee this particular technology Z-wave is simpler and cheaper' for small/medium range.","verified":"lecture","c":843},{"q":"Which organization has developed the ISA 100.11a standard?","options":["Instrument Society of America","International Society of Automation","International Studies Association","International Solar Alliance"],"answer":[1],"explanation":"Lecture 03 (IoT Connectivity Part II): ISA 100.11a 'was developed by international society for automation the ISA'.","verified":"lecture","c":1219,"rel":[["Jul-Oct 2026",1,1]]},{"q":"What communication modes are supported between two NFC devices?","options":["Broadcast-Multicast","Master-Slave","Active-Active or Active-Passive","All of these"],"answer":[2],"explanation":"Lecture 03 (IoT Connectivity Part II): NFC 'two communication modes are supported ... active active and ... active passive'.","verified":"lecture","c":845},{"q":"Which of the following is/are the drawbacks of proprietary non-IP-based solutions?","options":["Limited flexibility to end users","Interoperability","Limited last-mile connectivity","All of these"],"answer":[3],"explanation":"Lecture 04 (IoT Networking Part I): drawbacks of non-IP solutions: limited flexibility to end users, interoperability, limited last mile connectivity.","verified":"lecture","c":1220,"rel":[["Jul-Oct 2026",1,1]]},{"q":"Which MQTT QoS Level is also known as \"at most once\" delivery?","options":["QoS 0","QoS 1","QoS 2","None of these"],"answer":[0],"explanation":"Lecture 05 (IoT Networking Part II): 'QoS 0 which is about ensuring at most once delivery'.","verified":"lecture","c":1221,"rel":[["Jul-Oct 2026",1,1]]},{"q":"Fill in the blank: In CoRE, the IoT client uses ______ for the discovery of IoT devices.","options":["Lookup interface","Resource Directory","Registration Interface","None of these"],"answer":[0],"explanation":"Lecture 04 (IoT Networking Part I): 'IoT client uses the lookup interface for discovery of IoT devices'.","verified":"lecture","c":848},{"q":"Apart from MQTT, which IoT networking protocol supports the publish/subscribe framework?","options":["XMPP","AMQP","DDS RTPS","All of these"],"answer":[3],"explanation":"Lecture 05 (IoT Networking Part II): XMPP, AMQP and DDS RTPS are all described as publish/subscribe based.","verified":"lecture","c":849},{"q":"Which of the following IoT protocols is based on the session layer of the OSI model?","options":["MQTT","CoAP","AMQP","DTLS"],"answer":[1],"explanation":"Corrected after checking the lecture (was: AMQP). Lecture 05 (IoT Networking Part II): the only protocol the lecture calls a session protocol is CoAP: 'CoAP is kind of an application layered protocol ... even more specifically it ensures session, so, session protocol' (Misra's slide: 'CoAP - session layer protocol designed by IETF CoRE'). MQTT/AMQP are described only as pub/sub over TCP; uploaders split AMQP vs MQTT, so moderate confidence.","verified":"lecture","c":1226,"rel":[["Jul-Oct 2026",1,1]]},{"q":"Which of the following is not a component of RFID?","options":["RFID Tag","RFID reader","Antenna","Router"],"answer":[3],"explanation":"Lecture 03 (IoT Connectivity Part II): RFID has 3 components - tag, reader, software (antenna is inside the tag); a router is not a component.","verified":"lecture","c":851}]},{"year":2025,"session":"Jan-Apr 2025","week":2,"source":"https://www.youtube.com/watch?v=GNoHgfrH6Lg","questions":[{"q":"In the context of Industry 4.0, what is the full form of CPS?","options":["Controlled Power System","Customer Provisioning Service","Cloud Processing Service","Cyber Physical Systems"],"answer":[3],"explanation":"CPS = Cyber Physical Systems (named in Lecture 06 and Lecture 11).","verified":"reasoning","c":1235,"rel":[["Jul-Oct 2026",2,1]]},{"q":"State True or False: Business, providing information goods, has virtually zero transportation and replication cost.","options":["True","False"],"answer":[0],"explanation":"Lecture 06 (The Fourth Revolution): 'business providing information goods has virtually zero transportation and replication cost'.","verified":"lecture","c":853},{"q":"Which of the following technologies is used by research scientists to selectively modify the DNA of living organisms?","options":["3D Printing","Nanomedicine","Liquid Biopsy","Genetic Engineering"],"answer":[3],"explanation":"Lecture 06 (The Fourth Revolution): biological megatrends: manipulating DNA, 'advanced genetic engineering is a reality'.","verified":"lecture","c":854},{"q":"Which of the following statements is true about addressing an economic crisis or recession?","options":["Observing an increase in prices of major commodities is a key indicator.","Increasing productivity and reducing costs can help recover from a recession.","The main economy of a manufacturing location should always be based on only one resource to avoid crisis.","Recovery from a depression is faster than recovery from a recession when the same solution is applied."],"answer":[1],"explanation":"Lecture 07 (Sustainability Assessment of Manufacturing Industry): in crisis/recession 'reduction in prices ... important to increase the productivity and reduce the overall cost'.","verified":"lecture","c":855},{"q":"What does ERP stand for in the context of ICT?","options":["Enterprise Resource Planning","Electronic Resource Platform","Enhanced Reporting Protocol","Economic Resource Planning"],"answer":[0],"explanation":"Lecture 07 (Sustainability Assessment of Manufacturing Industry): ICT enables 'Enterprise Resource Planning ERP based systems'.","verified":"lecture","c":1236,"rel":[["Jul-Oct 2026",2,1]]},{"q":"How can enterprises improve sustainability with respect to energy consumption?","options":["Increasing usage of non-renewable energy sources","Reducing energy consumption from non-renewable sources and increasing use of renewable energy","Focusing solely on reducing renewable energy costs","Ignoring energy price fluctuations"],"answer":[1],"explanation":"Lecture 07 (Sustainability Assessment of Manufacturing Industry): reduce energy consumption and produce energy from renewable sources like solar, wind.","verified":"lecture","c":857},{"q":"What is the primary goal of \"Just-In-Time\" in a Lean Production System?","options":["Ensuring each process produces what is needed by the next process in a continuous flow","Producing in advance to meet potential future demand","Reducing production costs by purchasing cheap materials","Increasing inventory to minimize disruptions"],"answer":[0],"explanation":"Lecture 08 (Lean Production System): JIT 'each process produces what is needed by the next process in a continuous flow'.","verified":"lecture","c":858},{"q":"What is a 'value stream' in a Lean Production System?","options":["A set of tools for production","All the actions required for a product from order to delivery","A method of employee training","A type of waste reduction"],"answer":[1],"explanation":"Lecture 08 (Lean Production System): 'value streams are all the actions that are required for a product from order ... to the delivery'.","verified":"lecture","c":1237,"rel":[["Jul-Oct 2024",2,1],["Jul-Oct 2026",2,1]]},{"q":"Which of the following is an objective of Lean Production in Industry 4.0?","options":["Increasing waste in processes to improve flexibility","Focusing on non-value-added activities to reduce costs","Identifying waste in processes and eliminating it","Eliminating continuous improvement efforts"],"answer":[2],"explanation":"Lecture 08 (Lean Production System): lean in Industry 4.0 includes 'identifying waste in the processes and eliminating them'.","verified":"lecture","c":860},{"q":"Which of the following technologies is a ure","c":873},{"q":"How many steps are there in the PLM solution approach in Industry 4.0?","options":["8","9","10","12"],"answer":[2],"explanation":"L12: 'for Industry 4.0, these are the 10 step approaches that can be used for PLM'.","verified":"lecture","c":1246,"rel":[["Jul-Oct 2026",3,1]]},{"q":"Which of the following is not a key component of an AR Device?","options":["Sensors","Cameras","Projection Screen","Remote Control"],"answer":[3],"explanation":"L13: AR device components are 'sensors and cameras, projection screen, processing unit, reflection systems like mirrors'.","verified":"lecture","c":1247,"rel":[["Jul-Oct 2026",3,1]]},{"q":"Which of the following statements is incorrect?","options":["Deep Learning is a subset of Machine Learning","Deep Learning is a subset of Artificial Intelligence","Machine Learning is a superset of Artificial Intelligence","Artificial Intelligence is a superset of Machine Learning"],"answer":[2],"explanation":"L14: ML is a branch of AI, so 'Machine Learning is a superset of Artificial Intelligence' is the incorrect statement.","verified":"lecture","c":876},{"q":"Which of the following is NOT a challenge of AI in IIoT?","options":["Connecting devices","Understanding data","Training AI models","Lack of available data"],"answer":[3],"explanation":"L14 AI: 'challenges of AI in IIoT. Connecting different devices, understanding the data, training the data, making it accessible, making ... actionable'. Lack of data is not listed; connecting devices is.","verified":"lecture","c":1248,"rel":[["Jul-Oct 2026",3,1]]},{"q":"What is the primary purpose of data preprocessing in Big Data analytics?","options":["To store data without modification","To remove noises and redundancies before analysis","To generate fake data for testing purposes","To visualize trends before collection"],"answer":[1],"explanation":"L15: 'The data will have to be pre-processed to remove noise redundancy, inconsistency'.","verified":"lecture","c":878},{"q":"What type  WSAN advantages are easy deployment, self-organization, 'pre installed infrastructure' and low cost; needing no power is not one.","verified":"lecture","c":892},{"q":"Which of the following is a major challenge for industrial processes in Industry 4.0?","options":["Decreasing demand for automation","Unlimited availability of skilled workers","Constrained workforce and resource utilization","Reduced need for supply chain management"],"answer":[2],"explanation":"L20 challenges: dynamic market conditions, 'constrained work force', supply chain, resource utilization, product management.","verified":"lecture","c":893},{"q":"What is a key benefit of an autonomous pull economy in Industrial Process 4.0?","options":["High waste generation","Complete manual supervision","End-to-end automation facility","Lack of updated demand information"],"answer":[2],"explanation":"L20: autonomous pull economy benefit 'end-to-end automation facility'.","verified":"lecture","c":894,"rel":[["Jan-Apr 2024",4,0]]},{"q":"Which of the following represents the basic components of a SCADA system?","options":["Programmable Logic Controllers (PLC) and Remote Terminal Units (RTU)","Supervisory System","Communication Infrastructure","All of the above"],"answer":[3],"explanation":"L19: SCADA components are supervisory system, HMI, RTU, communication interface, SCADA programming and PLC.","verified":"lecture","c":895},{"q":"According to IEEE 1451 standards, how is a smart sensor defined?","options":["Sensor with limited memory and no communication capabilities","Sensor with small memory and standardized physical connection to enable communication with the processor and data network","A basic sensor without processing or networking capabilities","Sensor that only works in standalone mode without network integration"],"answer":[1],"explanation":"L19: IEEE 1451 smart sensor has 'small memory and standardized physical connection to enable communication with the processor and data network'.","verified":"lecture","c":896}]},{"year":2025,"session":"Jan-Apr 2025","week":5,"source":"https://www.youtube.com/watch?v=nxZhlygzyhw","questions":[{"q":"Which of the following is NOT a key sector of Industry 4.0?","options":["Smart robotics","Smart Warehousing","Intelligent manufacturing","Paper-Based Inventory Management"],"answer":[3],"explanation":"Lecture 21 (Industrial Processes - Part 2): Industry 4.0 sectors include smart robotics, intelligent manufacturing, smart warehousing; paper-based inventory is not one.","verified":"lecture","c":897},{"q":"What is a key advantage of the Outcome-Based Model in IoT business?","options":["Decreased profit margin","Increased negotiation cycle","Higher customer satisfaction","Increased risks"],"answer":[2],"explanation":"Lecture 22 (Business Models - Part 1): outcome-based model advantages include 'increased customer satisfaction', reduced negotiation cycle, reduced risk, increased profit margin.","verified":"lecture","c":898},{"q":"Which layer in the Industrial Internet Reference Architecture (IIRA) implements domain-specific applications and decision support systems and provides interfaces to end-users?","options":["Edge Layer","Enterprise Layer","Platform Layer","Gateway Layer"],"answer":[1],"explanation":"Lecture 24 (Reference Architecture - Part 1): 'the enterprise layer basically implements domain-specific requirements, decision support systems, and ... interfaces to end-users'.","verified":"lecture","c":899},{"q":"Which of the following is NOT a component of IIoT business models?","options":["Value Proposition","Value Capturing Mechanism","Value Extraction Model","Value Communication"],"answer":[2],"explanation":"Lecture 23 (Business Models - Part 2): IIoT business model components are 'value proposition, value capturing mechanism, value network, value communication'.","verified":"lecture","c":900},{"q":"What is the primary purpose of a Cloud-Based Business Model in IIoT?","options":["Selling software licenses","Leasing cloud computing resources temporarily","Manufacturing industrial equipment","Increasing industrial workforce requirements"],"answer":[1],"explanation":"Lecture 23 (Business Models - Part 2): cloud services offered on demand/subscription (lease of compute, storage); temporary leasing is the fitting purpose.","verified":"lecture","c":901},{"q":"Fill in the blanks. Based on the leading and lagging Occupational Safety and Health (OSH) indicators, Key Performance Indicators (KPIs) are also categorized into ______ and ______.","options":["Leading KPI and Lagging KPI","Low KPI and High KPI","Level KPI and ground KPI","None of these"],"answer":[0],"explanation":"Lecture 24 (Reference Architecture - Part 1): 'leading KPI and lagging KPI are the two different KPI categories for OSH'.","verified":"lecture","c":902},{"q":"Which of the following is NOT one of the four viewpoints in the Industrial Internet Reference Architecture (IIRA)?","options":["Business viewpoint","Usage viewpoint","Functional viewpoint","Financial viewpoint"],"answer":[3],"explanation":"Lecture 25 (Reference Architecture - Part 2): the four viewpoints are business, usage, functional and implementation; no financial viewpoint.","verified":"lecture","c":903},{"q":"State true or false. In the Usage Viewpoint of IIRA, \"Task\" is a basic unit of work carried out by a party assuming a role.","options":["True","False"],"answer":[0],"explanation":"Lecture 25 (Reference Architecture - Part 2): 'the task is a basic unit of work, that is carried out by a party, that assumes a specific role'.","verified":"lecture","c":904},{"q":"Which of the following is a challenge uniquely associated with assetsharing IoT business models?","options":["Profit margin","Asset configuration","Scalability","Resource utilization"],"answer":[1],"explanation":"Lecture 22 (Business Models - Part 1): asset-sharing challenges include security, mutual arrangements, 'asset configuration', device synchronization; resource utilization/scalability are listed ecture 23 (Business Models - Part 2): challenges listed include security/data privacy, lack of interoperability, increased complexity/cost, lack of data governance.","verified":"lecture","c":910},{"q":"Which of the following is NOT a standard IIoT reference architecture?","options":["Three-tier IIoT architecture","Gateway-based IIoT architecture","Layered Databus IIoT architecture","Sixty four-tier IIoT architecture"],"answer":[3],"explanation":"Lecture 24 (Reference Architecture - Part 1): patterns are three-tier, gateway-mediated edge, layered databus.","verified":"lecture","c":911}]},{"year":2025,"session":"Jan-Apr 2025","week":6,"source":"https://www.youtube.com/watch?v=dakMiIqeQPY","questions":[{"q":"Which industrial communication technology is suitable for hazardous environments?","options":["ModBus-TCP","EtherCat","Profibus PA","TSN"],"answer":[2],"explanation":"Lecture 29 (Connectivity - Part 2): Profibus PA uses MBP which 'is very useful for hazardous environment'.","verified":"lecture","c":912},{"q":"Which type of modem allows simultaneous bi-directional communication?","options":["Simplex","Half-duplex","Duplex","Synchronous"],"answer":[2],"explanation":"Lecture 29 (Connectivity - Part 2): 'duplex bi-directional and at the same time; that means simultaneously'.","verified":"lecture","c":913},{"q":"Which of the following industrial communication protocols follow a clientserver architecture?","options":["MECHATROLINK","ModBus-TCP","Hostlink","DeviceNet"],"answer":[1],"explanation":"Lecture 28 (Connectivity - Part 1): Modbus TCP 'uses client-server architecture'.","verified":"lecture","c":914},{"q":"What type of tasks is enabled by Smallcell Deployment in cellular networks?","options":["Increasing dead zones","Alleviating backhaul burden and reducing latency","Limiting energy efficiency","Eliminating spectrum flexibility"],"answer":[1],"explanation":"Lecture 30 (Connectivity - Part 3): small cell deployment objectives include 'alleviating burden on the backhaul', energy efficiency, decreasing dead zones.","verified":"lecture","c":915},{"q":"The DS1621 temperature sensor generates how many bits of temperature data?","options":["8 bits","9 bits","10 bits","12 bits"],"answer":[1],"explanation":"Lecture 26 (Key Enablers: Sensing - Part 1): DS1621 'will generate 9 bits of temperature data'.","verified":"lecture","c":916},{"q":"Which of the following sensors is used to measure acceleration and provides 3-axis (X, Y, Z) values?","options":["TCS3200","LM35","MQ-2","ADXL335"],"answer":[3],"explanation":"Lecture 26 (Key Enablers: Sensing - Part 1): ADXL335 accelerometer gives X, Y, Z values.","verified":"lecture","c":917},{"q":"Which sensor is used for detecting human presence based on infrared radiation?","options":["Image sensor","Ultrasonic sensor","PIR sensor","Magnetostrictive sensor"],"answer":[2],"explanation":"Lecture 26 (Key Enablers: Sensing - Part 1): 'PIR sensor basically detect the infrared radiation coming from the human body'.","verified":"lecture","c":918},{"q":"In an MOS gas sensor, what happens to the resistance in an n-type sensor when exposed to a reducing gas?","options":["Resistance remains the same","Resistance decreases","Resistance increases","Resistance fluctuates randomly"],"answer":[1],"explanation":"Lecture 27 (Key Enablers: Sensing - Part 2): 'In n-type sensors the resistance decreases ... with respect to the baseline resistance when ... exposed to a target gas'.","verified":"lecture","c":1291,"rel":[["Jul-Oct 2025",6,1],["Jul-Oct 2026",6,0]]},{"q":"Which of the following characteristics describes a gas sensor's ability to detect a specific gas in the presence of other gases?","options":["Sensitivity","Stability","Selectivity","Reversibility"],"answer":[2],"explanation":"Lecture 27 (Key Enablers: Sensing - Part 2): 'Selectivity is the ability to detect a particular gas in a mixture of different gases'.","verified":"lecture","c":920},{"q":"What is the maximum data transmission range for EtherCat using optical waveguides?","options":["100 meters","500 meters","10 kilometers","20 kilometers"],"answer":[3],"explanation":"Not spoken in Lecture 28 (slide detail); EtherCAT spans up to 20 km over optical fibre.","verified":"reasoning","c":921},{"q":"Which communication protocol uses Common Industrial Protocol (CIP) over Ethernet?","options":["EtherNet/IP","Profinet","EtherCat","Modbus-TCP"],"answer":[0],"explanation":"Lecture 28 (Connectivity - Part 1): 'Ethernet IP basically happens to be like, CIP over Ethernet'.","verified":"lecture","c":922},{"q":"What is the total bus length supported by Interbus?","options":["7 kilometers","10 kilometers","13 kilometers","24n-2 meters, where n is the number of slaves"],"answer":[2],"explanation":"Lecture 29 (Connectivity - Part 2): Interbus 'total bus length is 13 kilometres'.","verified":"lecture","c":923},{"q":"Which of the following is a key requirement for Industrial communication?","options":["High latency communication","Manual device control","Single-band connectivity","Very low latency"],"answer":[3],"explanation":"Lecture 28 (Connectivity - Part 1): industrial communication requires 'very low latency'.","verified":"lecture","c":924},{"q":"How are sensors categorized based on their power requirements?","options":["Active and Passive","Analog and Digital","Load Resistive and Load Reactive","Battery-Powered and Line-Powered"],"answer":[0],"explanation":"Lecture 1 (Sensing & Actuation): sensors 'could be classified as either passive sensor or active sensor' (based on whether they need external power/excitation).","verified":"lecture","c":925},{"q":"Modbus is an industrial communication protocol for Fieldbuses that follows a master-slave architecture. What is the maximum number of slave devices supported by the master node in this protocol?","options":["128","247","256","494"],"answer":[1],"explanation":"Not covered in the lecture; Modbus serial addressing allows 247 slave addresses (1-247).","verified":"reasoning","c":926}] , HMIs (human-machine interface), communication infrastructure (Lecture 35: Key Enablers of IIoT: Process Control); no 'M2MI'.","verified":"lecture","c":931},{"q":"Fill in the blanks. Zigbee uses the ______ standard for defining its physical and medium access control (layers 1 and 2 of the OSI stack).","options":["IEEE 802.16.6","IEEE 802.15.4","IEEE 502.15.4","IEEE 502.16.6"],"answer":[1],"explanation":"IEEE 802.15.4 (Lecture 32: Key Enablers of IIoT: Connectivity – Part 5 (Zigbee/Xbee demo)).","verified":"lecture","c":932},{"q":"State True or False. The SIGFOX network can transmit up to 140 messages per day with a payload of 12 bytes per message.","options":["True","False"],"answer":[0],"explanation":"'up to 140 messages per day, with a payload of 12 bytes per message' (Lecture 31: Key Enablers of IIoT: Connectivity – Part 4 (LoRa/SIGFOX + NodeMCU demo)).","verified":"lecture","c":933},{"q":"Which of the following is/are false about the rule-based engine?","options":["Extract causal and temporal patterns using predefined rules","Handles multiple data streams and correlates them to provide meaningful output","Cannot process data in near real-time","All of the above"],"answer":[2],"explanation":"Lecture stresses CEP must 'process the data in real near real-time' (Lecture 33: Key Enablers of IIoT: Processing – Part 1), so 'cannot process data in near real-time' is the false one.","verified":"lecture","c":934,"rel":[["Jul-Oct 2022",7,0],["Jan-Apr 2024",7,1]]},{"q":"Which of the following is NOT a Zigbee device type?","options":["Coordinator","Router","End device","Hub"],"answer":[3],"explanation":"'A ZigBee module basically can be of 3 types ... coordinator, a router, and an end device' (Lecture 32: Key Enablers of IIoT: Connectivity – Part 5 (Zigbee/Xbee demo)).","verified":"lecture","c":935},{"q":"What is the role of message brokers like MQTT and Apache Kafka in real-time IoT processing systems?","options":["They store IoT data permanently","They transfer data to an 35: Key Enablers of IIoT: Process Control).","verified":"lecture","c":940},{"q":"Which of the following is NOT a major component of an Industrial Control System?","options":["Process Variables","Set Points","Industrial Internet","Manipulating Variables"],"answer":[2],"explanation":"Four ICS components: process variable, set points, controller, manipulating variables (Lecture 35: Key Enablers of IIoT: Process Control).","verified":"lecture","c":941,"rel":[["Jan-Apr 2023",7,0]]}]},{"year":2025,"session":"Jan-Apr 2025","week":8,"source":"https://www.youtube.com/watch?v=D3uY38RBelg","questions":[{"q":"Which of the following is NOT a key characteristic of Big Data Analytics in IIoT?","options":["Volume","Velocity","Veracity","Validation"],"answer":[3],"explanation":"Volume, velocity, variability, veracity, variety (Lecture 36: IIoT Analytics and Data Management: Introduction).","verified":"lecture","c":942},{"q":"Which software is commonly used for batch-oriented analytics?","options":["C++ and Java","Apache Hadoop and Apache Spark","Pandas and Numpy","MongoDB and MySQL"],"answer":[1],"explanation":"Apache Hadoop, Apache Spark (Lecture 36: IIoT Analytics and Data Management: Introduction).","verified":"lecture","c":943,"rel":[["Jan-Apr 2024",8,0]]},{"q":"Which of the following is NOT a fundamental type of IIoT Analytics?","options":["Descriptive Analytics","Predictive Analytics","Prescriptive Analytics","Structural Analytics"],"answer":[3],"explanation":"Descriptive, predictive, prescriptive (Lecture 36: IIoT Analytics and Data Management: Introduction).","verified":"lecture","c":944},{"q":"Which machine learning algorithm enables machines to improve their performance by automatically learning the ideal behaviors for a specific environment?","options":["Supervised Learning","Unsupervised Learning","Reinforcement Learning","Regression"],"answer":[2],"explanation":"RL 'enables machines to improve its performance by automatically learning the ideal behaviors for a specific environment' (Lecture 37: Machine Learning and Data Science – Part 1).","verified":"lecture","c":945,"rel":[["Jul-Oct 2023",8,1]]},{"q":"Which of the following represents a key feature of Fuzzy c-Means clustering?","options":["A data point can belong to more than one cluster","A data point belongs strictly to only one cluster","Extremely slower than K-Means","None of these"],"answer":[0],"explanation":"FCM point may belong to multiple clusters, and is faster (not slower) than K-means (Lecture 37: Machine Learning and Data Science – Part 1).","verified":"lecture","c":946},{"q":"Which of the following is TRUE about the ThingWorx platform?","options":["Perform complex analytical process","Deliver real-time perception","Has the ability to monitor the condition","All of these"],"answer":[3],"explanation":"ThingWorx 'performs complex analytical processes, deliver real-time perception, offers the ability of condition monitoring' (Lecture 37: Machine Learning and Data Science – Part 1).","verified":"lecture","c":947},{"q":"State True or False. Deep learning is an \"end-to-end learning\", which extracts features on its own. On the contrary, in machine learning, features are to be explicitly mentioned.","options":["True","False"],"answer":[0],"explanation":"'Deep learning is an end-to-end learning which extracts features on its own ... in machine learning features are to be explicitly manually mentioned' (Lecture 38: Machine Learning and Data Science – Part 2).","verified":"lecture","c":948},{"q":"Which of the following statements is TRUE about machine learning (ML)?","options":["ML is the subset of AI that can learn automatically from the object features","ML is the subset of DL which can learn automatically by finding the features of the object on its own","ML always performs better than Deep Learning models","ML can only be used for image recognition tasks"],"answer":[0],"explanation":"'machine learning focuses on learning automatically from certain object features'; ML is a subset of AI (Lecture 38: Machine Learning and Data Science – Part 2).","verified":"lecture","c":949},{"q":"Which of the following statements about MindSphere is incorrect?","options":["Cloud-based operating system platform for IoT","Open safety-as-a-service","Bring together IoT data from products, factories, machines, and systems to exploit its prosperity","Enterprise oriented solutions"],"answer":[1],"explanation":"MindSphere 'is an open Platform-as-a-Service' (not safety-as-a-service), cloud-based OS for IoT, enterprise oriented (Lecture 39: Cloud Computing in IIoT – Part 1).","verified":"lecture","c":950,"rel":[["Jul-Oct 2025",8,0]]},{"q":"Which of the following is/are key characteristic(s) of a Consumer IoT cloud platform?","options":["Provide very specific applications for end users","Provide modest security","Generally cost-sensitive","All of these"],"answer":[3],"explanation":"Consumer IoT clouds: 'very specific applications ... modest levels of security ... very cost sensitive' (Lecture 39: Cloud Computing in IIoT – Part 1).","verified":"lecture","c":951},{"q":"Which of the following is NOT a fundamental cloud computing service?","options":["Software-as-a-Service","Platform-as-a-Service","ERP-as-a-Service","Infrastructure-as-a-Service"],"answer":[2],"explanation":"Three fundamental services: SaaS, PaaS, IaaS (Lecture 39: Cloud Computing in IIoT – Part 1).","verified":"lecture","c":952},{"q":"Which of the following services is NOT provided by C3 IoT?","options":["Predictive Maintenance","Inventory Optimization","IoT Hardware Analysis","Fraud Detection"],"answer":[2],"explanation":"C3 SaaS tools: predictive maintenance, inventory optimisation, supply network, energy management, fraud detection, sensor health monitoring (Lecture 40: Cloud Computing in IIoT – Part 2).","verified":"lecture","c":953},{"q":"Which of the following cloud platform providers does not offer IIoT device management services?","options":["Bosch IoT Remote Manager","Facebook Cloud Services","AWS's IoT Device Management","ICP DAS's IoTstar"],"answer":[1],"explanation":"Device management providers: Bosch IoT Remote Manager, AWS IoT Device Management, Verismic, ICP IoTstar, Cumulocity (Lecture 40: Cloud Computing in IIoT – Part 2).","verified":"lecture","c":954},{"q":"What does \"Variety\" refer to in the context of data generation?","options":["The speed at which data is generated","The amount of data generated","The format of data generated, such as structured, semi-structured, or unstructured","The accuracy and reliability of data generated"],"answer":[2],"explanation":"Variety = different forms/formats of data (structured, semi-structured, unstructured); the other options are velocity, volume, veracity.","verified":"reasoning","c":955},{"q":"What does the 'K' in K-means clustering represent?","options":["Number of features in the dataset","Number of clusters to be identified","Maximum iterations allowed in the process","Number of data points in each cluster"],"answer":[1],"explanation":"'2-means would mean that we are talking about two clusters, two centroids' (Lecture 37: Machine Learning and Data Science – Part 1).","verified":"lecture","c":956}]},{"year":2025,"session":"Jan-Apr 2025","week":9,"source":"https://www.youtube.com/watch?v=DYGCwdq5dlg","questions":[{"q":"Which of the following can be rendered by the fog-enabled IIoT?","options":["Real-time monitoring and visualization","End-to-end security","Scalability and flexibility","All of these"],"answer":[3],"explanation":"Lecture 41 (Fog Computing in IIoT): fog-enabled IIoT offers 'real-time monitoring and visualization, end-to-end security, scalability ... flexible, reducing cost'.","verified":"lecture","c":957},{"q":"Which of the following is a Fog Computing platform provider?","options":["Netflix","FogHorn","Google Search","Twitter Analytics"],"answer":[1],"explanation":"Lecture 41 (Fog Computing in IIoT): fog platform providers FogHorn, Nebbiolo, Crosser, Sonm.","verified":"lecture","c":958},{"q":"What is the primary use of the R programming language?","options":["ERP data handling","Statistical analysis and data visualization","SDN security provisioning","Mobile application development"],"answer":[1],"explanation":"Lecture 42 (Tutorial for R & Julia): R offers 'statistical analysis platform ... graphical representation, data visualization'.","verified":"lecture","c":959},{"q":"Which operator in R is used to obtain the remainder of a division?","options":["/","%/%","%%","^"],"answer":[2],"explanation":"Lecture 42 (Tutorial for R & Julia): 'double percentage which is basically the remainder of a division'.","verified":"lecture","c":960},{"q":"Which of the following is NOT a data type in R?","options":["Logical","Integer","Binary","Complex"],"answer":[2],"explanation":"Lecture 42 (Tutorial for R & Julia): R data types 'logical numeric integer complex character raw'; no binary.","verified":"lecture","c":961},{"q":"What is the function of the 'caret' package in R?","options":["Provides functions for network security","Provides functions for creating predictive models","Manages file system operations","Helps in game development"],"answer":[1],"explanation":"Lecture 42 (Tutorial for R & Julia): 'caret for having different functions for creating predictive models'.","verified":"lecture","c":962},{"q":"In Julia programming language, which of the following is used for string interpolation?","options":["&","%","$","@"],"answer":[2],"explanation":"Lecture 42 (Tutorial for R & Julia): 'dollar sign is used for string interpolation' in Julia.","verified":"lecture","c":963},{"q":"Which of the following is NOT a basic service model of cloud computing?","options":["Infrastructure-as-a-Service (IaaS)","Platform-as-a-Service (PaaS)","Software-as-a-Service (SaaS)","Analytics-as-a-Service (AaaS)"],"answer":[3],"explanation":"Lecture 43 (Data Management with Hadoop)/Lecture 39 (Cloud Computing in IIoT Part 1): cloud service models IaaS, PaaS, SaaS.","verified":"lecture","c":964},{"q":"What is the primary purpose of data pre-processing in IIoT?","options":["To always append 50% randomly generated data with the existing dataset","To clean, integrate, and filter data before analysis","To always delete 50% of the existing data randomly","To transfer data directly to users without modification"],"answer":[1],"explanation":"Lecture 43 (Data Management with Hadoop): pre-processing = integration, cleaning and redundancy mitigation before storage/analysis.","verified":"lecture","c":965},{"q":"State true or false. Hadoop Distributed File System (HDFS) and Kosmosfs are notable file systems derived from the open source codes of Google File System (GFS).","options":["True","False"],"answer":[0],"explanation":"Lecture 43 (Data Management with Hadoop): GFS is the notable DFS; HDFS and Kosmosfs listed as file systems (both are open-source GFS derivatives per the slides/textbook).","verified":"lecture","c":966},{"q":"Which of the following is NOT a key requirement for a Data Center Network?","options":["VM migration without changing IP addresses","Fast detection of failure","In-house power plant","Efficient repair of failure"],"answer":[2],"explanation":"Lecture 44 (Data Center Networks): DCN requirements - VM migration without changing IP, no switch config before deployment, paths among end hosts, failure detection, efficient repair. No power plant.","verified":"lecture","c":967},{"q":"Edge, Aggregation, and Core are the components of which Data Center Network topology?","options":["DCell","Fat-Tree DCN","BCube","Hybrid Cloud Network"],"answer":[1],"explanation":"Lecture 44 (Data Center Networks): fat-tree DCN 'there are 3 tiers ... the edge tier, the aggregation tier and the core tier'.","verified":"lecture","c":968},{"q":"Which of the following statements about the Data Center Network topology- BCube is incorrect?","options":["Server-centric approach, rather than the switch-oriented practice","Places intelligence on modular data center (MDC) servers","Provides single serial short paths between any pair of servers","Runs a source routing protocol called BSR (Bcube Source Routing)"],"answer":[2],"explanation":"Lecture 44 (Data Center Networks): BCube 'provides multiple parallel short paths between any pair of servers', so 'single serial' is incorrect.","verified":"lecture","c":969,"rel":[["Jan-Apr 2024",9,0]]},{"q":"What is the role of the SDN controller in a network?","options":["It modifies data packets before forwarding to end users","It defines and manages flow rules for forwarding devices","It directly replaces physical network switches","It completely eliminates the need for network security"],"answer":[1],"explanation":"Lecture 45 (SDN in IIoT Part 1): forwarding devices forward traffic 'based on certain control logic ... defined by the SDN controller' placed as flow rules.","verified":"lecture","c":970},{"q":"Which of the following statements is FALSE about fog computing?","options":["The fog layer analyzes a huge volume of real-time data generated from industrial devices and machines.","The fog layer simultaneously collects data from various interconnected industrial machines, smart sensors, devices, and robots.","The fog layer generates the decisions from the sensed data and delivers them to the actuators with minimum latency.","The fog layer increases unnecessary data transmission to the cloud and server by bypassing data filtering and restructuring."],"answer":[3],"explanation":"Lecture 41 (Fog Computing in IIoT): fog filters data to 'prevent ... unnecessary noisy data' reaching the cloud; the statement says the opposite.","verified":"lecture","c":971,"rel":[["Jul-Oct 2024",8,0]]}]},{"year":2025,"session":"Jan-Apr 2025","week":10,"source":"https://www.youtube.com/watch?v=O0Hh2D0euBE","questions":[{"q":"Which of the following is NOT a component of the SDIIoT architecture?","options":["SDIIoT - WSN","SDIIoT - Industrial Bus & Network","SDIIoT - ERP Framework","SDIIoT - Industrial Cloud"],"answer":[2],"explanation":"Lecture 46 (SDN in IIoT Part 2): SDIIoT - sensor network, public network, industrial cloud, industrial bus network; no ERP framework.","verified":"lecture","c":972,"rel":[["Jan-Apr 2024",10,0]]},{"q":"Which of the following is NOT a component of SD-Edge IIoT Architecture?","options":["Cluster Head","Industrial Cloud","Edge Network","Standalone Firewall"],"answer":[3],"explanation":"Lecture 46 (SDN in IIoT Part 2): SD-edge IIoT components 'cluster head, industrial cloud, edge network, SDN controller, devices and equipments'.","verified":"lecture","c":973,"rel":[["Jan-Apr 2023",10,1]]},{"q":"Which of the following is NOT a key attribute of trustworthy IIoT?","options":["Reliability","Security","Unlimited network access","Privacy"],"answer":[2],"explanation":"Lecture 47 (Security in IIoT Part 1): trustworthiness - security, privacy, reliability, resilience, safety.","verified":"lecture","c":974},{"q":"Which of the following is an example of an IIoT attack at the physical layer?","options":["SQL injection","Device tampering","Traffic flooding","Man-in-the-middle attack"],"answer":[1],"explanation":"Lecture 47 (Security in IIoT Part 1): physical layer - impersonation, jamming, device tampering.","verified":"lecture","c":975,"rel":[["Jul-Oct 2023",10,0]]},{"q":"What does the STRIDE threat model in IIoT security stand for?","options":["Spoofing, Tampering, Repudiation, Information Disclosure, Denial of Service, Elevation of Privilege","Secure Transmission, Reliable Data, Industrial Deployment, Encryption","Software, Tracking, Response, Integration, Data, Encryption","Security Threats, Risk Identification, Detection, Evaluation"],"answer":[0],"explanation":"Lecture 47 (Security in IIoT Part 1): spoofing, tampering, repudiation, information disclosure, DoS, elevation of privilege.","verified":"lecture","c":976},{"q":"Which of the following is an attack vector in the network layer of IIoT?","options":["SQL injection","Traffic flooding","Jamming attack","Data spoofing"],"answer":[1],"explanation":"Lecture 47 (Security in IIoT Part 1): network layer - traffic flooding, MITM, misrouting, packet sniffing.","verified":"lecture","c":977,"rel":[["Jul-Oct 2022",10,0]]},{"q":"Which of the following is NOT a building block of IIoT security?","options":["Cloud security","Data protection","Physical network topologies","Communication Protection"],"answer":[2],"explanation":"Lecture 48 (Security in IIoT Part 2): building blocks end devices, fog devices, cloud security, data protection, communication protection, security management.","verified":"lecture","c":978},{"q":"Which of the following standards is related to Industrial automation and control systems security?","options":["ISO/IEC 154083","IEC 62443","ISO 27017","NIST SP 800-144"],"answer":[1],"explanation":"Lecture 48 (Security in IIoT Part 2): 'IEC 62443 which is an industrial automation and control system security standard'.","verified":"lecture","c":1158,"rel":[["Jul-Oct 2025",10,1]]},{"q":"Which of the following is NOT a key principle of data protection in IIoT?","options":["Confidentiality","Integrity","Availability","Unrestricted access"],"answer":[3],"explanation":"Lecture 48 (Security in IIoT Part 2): data protection = confidentiality, integrity, availability.","verified":"lecture","c":980},{"q":"State true or false. Caterpillar's AR app generates an end-to-end view of the factory floor, enabling machine operators to detect tool replacement needs and send instructions for replacement.","options":["True","False"],"answer":[0],"explanation":"Lecture 49 (Factories and Assembly Line): Caterpillar AR app 'generates end to end view of the factory floor ... operators can detect the need for tool replacement'.","verified":"lecture","c":981},{"q":"Which of the following is NOT a key feature of a Smart Factory?","options":["Continuous real-time data","Prediction of future outcomes for taking preventive actions","High manual operation","Flexibility and adaptability"],"answer":[2
