ned in the lecture?","options":["Ratio of encrypted packets to total packets","Ratio of time of functioning to the total time","Ratio of authenticated users to total users","Ratio of successful attacks to failed attacks"],"answer":[1],"explanation":"L54 'Plant Security and Safety': availability 'talks about the ratio of the time of functioning to the total time'.","verified":"lecture","c":1371},{"q":"What is the primary purpose of network segmentation as a network-security technique?","options":["To combine all network devices into a single unrestricted network","To divide the network into smaller parts and explicitly enforce security policies","To disable encryption between endpoints","To prevent the creation of virtual private networks"],"answer":[1],"explanation":"L54 'Plant Security and Safety' slide: 'Network segmentation - Divide the network into smaller parts and enforce security policies explicitly'.","verified":"lecture","c":1372},{"q":"How does IoT help address the cost barrier in facility management?","options":["By increasing maintenance activities","By eliminating all installed devices","By increasing operating efficiency and reducing maintenance cost","By preventing the collection of facility data"],"answer":[2],"explanation":"L55 'Facility Management' slide: 'Addressing cost barrier - Increases operating efficiency and reduce maintenance cost'.","verified":"lecture","c":1373},{"q":"Which of the following is an application of analytics in facility management?","options":["Determining the exact square-foot utilization of office space","Increasing manual inspection of every facility","Preventing remote monitoring","Eliminating data-driven decision-making"],"answer":[0],"explanation":"L55 'Facility Management' analytics slide: 'Determining the Exact Square-foot Utilization of Office Space'.","verified":"lecture","c":1374},{"q":"Active RFID tags are classified into which two types?","options":["Inlays and hard tags","Wet tags and dry tags","Transponders and beacons","Passive and semi-passive tags"],"answer":[2],"explanation":"L53 'Inventory Management & Quality Control': active tags broadcast beacons; active tag types are transponders and beacons.","verified":"lecture","c":1375},{"q":"Which mobile-device security component can identify attacks in advance and, through cloud-integrated security, help prevent an attack detected on one network branch from spreading to other branches?","options":["Secure web gateway","RFID reader","Meter data acquisition system","Load balancer"],"answer":[0],"explanation":"L54 'Plant Security and Safety' slide 'Components' (mobile device security): 'Secure web gateway - Identification of an attack on one location and prevention of the same at other locations (integration of security with the cloud)'.","verified":"lecture","c":1376}]},{"year":2026,"session":"Jul-Oct 2026","week":12,"source":"https://www.youtube.com/watch?v=fmy6nZge_jg","questions":[{"q":"In the oil and gas industry workflow, what happens before data moves to a cloud-based analytics platform?","options":["Predictive analytics is applied","IoT solutions are deployed at different locations","Data analysis is performed through extraction, transform, and load processes","Required maintenance is identified"],"answer":[2],"explanation":"L56 'Oil, Chemical and Pharmaceutical Industry' workflow slide: Data analysis by ETL -> Data moves to a cloud-based analytics platform.","verified":"lecture","c":1377},{"q":"Which of the following is an objective of predictive maintenance using IoT in the chemical industry?","options":["Increase equipment breakdown","Address real-time issues and reduce equipment breakdown","Eliminate IoT analytics","Replace real-time monitoring with manual inspection"],"answer":[1],"explanation":"L56 'Oil, Chemical and Pharmaceutical Industry' slide 'Predictive maintenance': address real time issues, reduce equipment breakdown.","verified":"lecture","c":1378},{"q":"How can IoT improve logistics in the chemical industry?","options":["By preventing the use of RFID tags","By avoiding warehouse monitoring","By tracking product locations through sensors or RFID tags","By eliminating alert notifications"],"answer":[2],"explanation":"L56 'Oil, Chemical and Pharmaceutical Industry' slide 'Improve Logistics': 'Ensure product location through sensors or RFID tags'.","verified":"lecture","c":1379},{"q":"Which elements are monitored in real time to minimize supply-chain risk in the chemical industry?","options":["Equipment, material, process, environment, and workers","Only equipment and workers","Only material and warehouse location","Customers, competitors, and advertisements"],"answer":[0],"explanation":"L56 'Oil, Chemical and Pharmaceutical Industry' slide: real-time monitor in supply chain - equipment, material, environment, process, workers.","verified":"lecture","c":1380},{"q":"Which of the following can IoT applications in the pharmaceutical industry help detect while examining drugs?","options":["Adverse Drug Reactions, effects of pharmaceutical excipients, and allergies","Only production cost","Only equipment temperature","Network routing failures only"],"answer":[0],"explanation":"L56 'Oil, Chemical and Pharmaceutical Industry' slide: detect ADR, effects of pharmaceutical excipients, allergies.","verified":"lecture","c":1381},{"q":"Which industrial control system can UAVs communicate with directly in an industrial environment?","options":["RFID","SCADA","Bluetooth","GPS"],"answer":[1],"explanation":"L57 'UAVs in Industries' slide: UAVs communicate directly to an industrial control system such as SCADA.","verified":"lecture","c":1382},{"q":"Which UAV technology generation introduces improved safety and regulatory features, platform and payload adaptability, intelligent piloting models, full autonomy, and airspace awareness?","options":["Third Generation","Fourth Generation","Sixth Generation","Second Generation"],"answer":[2],"explanation":"L57 'UAVs in Industries' generations slide: Sixth generation features as quoted.","verified":"lecture","c":1383},{"q":"How can UAVs help optimize inputs in agricultural applications?","options":["By increasing the use of water and fertilizer regardless of requirement","By optimizing the use of seed, fertilizer, and water","By eliminating crop-health monitoring","By replacing field measurements with manual estimates"],"answer":[1],"explanation":"L57 'UAVs in Industries' agriculture slide: 'Optimized inputs: Optimize use of seed, fertilizer, water'.","verified":"lecture","c":1384},{"q":"Which of the following is an advantage of UAVs for energy-management applications?","options":["They require workers to climb power poles for every inspection","They can observe miles of transmission lines in a single flight","They cannot inspect wind turbines","They are restricted from monitoring solar panels"],"answer":[1],"explanation":"L57 'UAVs in Industries' energy slide: 'Observe miles of transmission lines in a single flight'.","verified":"lecture","c":1385},{"q":"Which activity is supported by UAVs in mining applications?","options":["Regular surface surveys for optimized blast design","Increasing the probability of misfires","Eliminating site exploration","Preventing stockpile management"],"answer":[0],"explanation":"L57 'UAVs in Industries' mining slide: 'Regular surface survey for optimized blast design'.","verified":"lecture","c":1386},{"q":"Which healthcare task can be performed using UAVs?","options":["Delivery of medicines, vaccines, defibrillators, and snake-bite serum","Replacement of all hospital medical equipment","Manufacture of drugs during flight","Elimination of laboratory testing"],"answer":[0],"explanation":"L57 'UAVs in Industries' slide: 'Delivery of medicines, vaccines, defibrillators, snake bite serum'.","verified":"lecture","c":1387},{"q":"In forestry applications, what can UAV-based remote sensing be used to measure for 3D mapping?","options":["Carbon storage in biomass","Network bandwidth","Fuel consumption of vehicles","Pharmaceutical production rate"],"answer":[0],"explanation":"L57 'UAVs in Industries' forestry slide: 'Measure the carbon storage in biomass by remote sensing'.","verified":"lecture","c":1388},{"q":"Which of the following should be considered while evaluating the transformation of an existing process for Industry 4.0 adoption in a case study?","options":["Only the purchase cost of sensors","Sensors, actuators, networks, interoperability, automated fault detection and maintenance, and feedback","Only employee attendance","Elimination of real-time and non-real-time data analysis"],"answer":[1],"explanation":"L58 'Case Studies for Industry 4.0 & IIoT' slide 'Points to ponder': 'Sensors, actuators, networks, interoperability, automated fault detection & maintenance, feedback control'.","verified":"lecture","c":1389},{"q":"Which communication technology was used by Transco Industries to monitor conveyor-belt systems in its mining-industry IIoT implementation?","options":["Bluetooth and Zigbee","Semtech LoRa devices and LoRaWAN","Wi-Fi and NFC","Ethernet and RFID"],"answer":[1],"explanation":"Not in the original lecture set (newer case study). Transco Industries' conveyor-belt monitoring used Semtech LoRa devices on private LoRaWAN networks (mining-technology.com / RCR Wireless).","verified":"reasoning","c":1390},{"q":"What was one major benefit obtained from the IIoT-based monitoring of conveyor-belt systems in the mining-industry case study?","options":["Increased dependence on manual inspection","Increased maintenance cost","Ability to obtain a holistic view of the conveyor-belt line and localize defects","Elimination of all sensing devices"],"answer":[2],"explanation":"Newer mining case study not in the original lectures; the only option describing a benefit (holistic view of the belt line, localizing defects) is consistent with the Transco/Semtech deployment.","verified":"reasoning","c":1391}]},{"year":2026,"session":"Jan-Apr 2026","week":0,"source":"https://myquizprep.pages.dev/solutions/introduction-to-industry-4-0-and-industrial-internet-of-things-apr26/week0","questions":[{"q":"Which of the following is an example of a unguided transmission medium?","options":["Coaxial cable","Microwave","Twisted pair","Optical fiber"],"answer":[1],"explanation":"Microwave is wireless (unguided); coax, twisted pair and fiber are guided media.","verified":"reasoning","c":1392},{"q":"Which OSI layer is responsible for logical addressing?","options":["Transport layer","Application layer","Network layer","Data link layer"],"answer":[2],"explanation":"Logical (IP) addressing is a Network-layer function.","verified":"reasoning","c":1393},{"q":"What is the default port number for HTTPS?","options":["20","53","110","443"],"answer":[3],"explanation":"HTTPS uses TCP port 443.","verified":"reasoning","c":1394},{"q":"Which of the following IP addresses belongs to Class B?","options":["150.10.5.1","230.12.1.5","12.0.0.8","192.0.2.1"],"answer":[0],"explanation":"Class B first octet is 128-191, so 150.10.5.1 is Class B (230=D, 12=A, 192=C).","verified":"reasoning","c":1395},{"q":"Which protocol maps a domain name to its corresponding IP address?","options":["FTP","DNS","Telnet","SMTP"],"answer":[1],"explanation":"DNS resolves domain names to IP addresses.","verified":"reasoning","c":1396},{"q":"Which protocol is used for sending email from a client to a mail server?","options":["POP3","IMAP","SMTP","SNMP"],"answer":[2],"explanation":"SMTP is used to send mail from client to server (POP3/IMAP retrieve).","verified":"reasoning","c":1397},{"q":"Ethernet operates primarily at which two OSI layers?","options":["Network and Transport","Data link and Physical","Transport and Application","Physical and Network"],"answer":[1],"explanation":"Ethernet (IEEE 802.3) specifies the Physical and Data link layers.","verified":"reasoning","c":1398},{"q":"Which device separates collision domains in a network?","options":["Hub","Switch","Repeater","Access point"],"answer":[1],"explanation":"Each switch port is its own collision domain; hubs/repeaters share one.","verified":"reasoning","c":1399},{"q":"Which metric refers to the variation in packet delay?","options":["Bandwidth","Latency","Jitter","Throughput"],"answer":[2],"explanation":"Jitter is the variation in packet delay.","verified":"reasoning","c":1400},{"q":"Which method is used for error detection in data frames?","options":["ARP","CRC","DNS","FTP"],"answer":[1],"explanation":"CRC (cyclic redundancy check / FCS) detects errors in frames.","verified":"reasoning","c":1401}]},{"year":2026,"session":"Jan-Apr 2026","week":1,"source":"https://myquizprep.pages.dev/solutions/introduction-to-industry-4-0-and-industrial-internet-of-things-apr26/week1","questions":[{"q":"Which of the following sensors is an example of a Zero Order System?","options":["Thermometer","Potentiometer","Accelerometer","Gyroscope"],"answer":[1],"explanation":"Lecture 01 (Sensing & Actuation): zero order system responds with no delay; 'a potentiometer ... is an example of a zero order system'.","verified":"lecture","c":1402},{"q":"Which Zigbee device type acts as the root and also functions as the network bridge?","options":["Zigbee Router","Zigbee End Device","Zigbee Coordinator","Zigbee Gateway"],"answer":[2],"explanation":"Lecture 02 (IoT Connectivity Part I): coordinator handles 'initialization, maintaining, and controlling of the network', one per network (root/bridge role per textbook).","verified":"lecture","c":1403},{"q":"Which physical principle primarily explains the operation of hydraulic actuators?","options":["Pascal’s law","Bernoulli’s principle","Ideal gas law","Faraday’s law"],"answer":[0],"explanation":"Hydraulic actuators transmit force through an incompressible fluid - Pascal's law; not stated in the transcript.","verified":"reasoning","c":1404},{"q":"At which OSI layer does the 6LoWPAN protocol primarily operate to enable IPv6 packets over IEEE 802.15.4?","options":["Physical Layer","Network Layer (Adaptation Layer)","Transport Layer","Application Layer"],"answer":[1],"explanation":"Lecture 02 (IoT Connectivity Part I): 6LoWPAN adaptation layer 'is introduced in between the MAC and the network layer'.","verified":"lecture","c":1405},{"q":"Which IEEE 802.15.4 variant introduces Direct Sequence Ultra-Wideband (UWB) Physical Layer?","options":["802.15.4a","802.15.4b","802.15.4e","802.15.4g"],"answer":[0],"explanation":"Lecture 02 (IoT Connectivity Part I) only says 802.15.4a increased range capability; 802.15.4a-2007 is the amendment that added the UWB (and CSS) PHY.","verified":"reasoning","c":1406},{"q":"In the context of sensor characteristics, the properties of the system’s transient response to an input are collectively termed as __________ characteristics.","options":["Dynamic characteristics","Static characteristics","Time-domain characteristics","Steady-state characteristics"],"answer":[0],"explanation":"Lecture 01 (Sensing & Actuation): 'dynamic characteristics are about the properties of the systems transient response to an input'.","verified":"lecture","c":1407},{"q":"In the context of the WirelessHART standard (IEC 62591) operating in the 2.4 GHz ISM band, what is the frequency gap maintained between two adjacent channels?","options":["2 MHz","5 MHz","20 MHz","25 MHz"],"answer":[1],"explanation":"Lecture 02 (IoT Connectivity Part I): WirelessHART channels have 'a spacing of about 5 megahertz between two adjacent channels'.","verified":"lecture","c":1408},{"q":"State True or False. A Passive NFC device can neither transmit nor read any data.","options":["True","False"],"answer":[1],"explanation":"Lecture 03 (IoT Connectivity Part II): 'a passive device can only transmit data, but cannot read' - so the statement is False.","verified":"lecture","c":1409},{"q":"What is the data rate of Bluetooth 2.0?","options":["1 Mbps","2 Mbps","3 Mbps","4 Mbps"],"answer":[2],"explanation":"Lecture 03 (IoT Connectivity Part II): Bluetooth '1 Mbps in the version 1.2 ... version 2 basically 3 Mbps'.","verified":"lecture","c":1410},{"q":"The primary focus of the ISA 100.11a technology is the implementation of __________ in the industrial environment.","options":["Automation","Connectivity","Predictive maintenance","Security"],"answer":[0],"explanation":"Lecture 03 (IoT Connectivity Part II): ISA 100.11a 'primarily focuses on automation in industrial environments'.","verified":"lecture","c":1411},{"q":"State True or False. Classical Internet is not meant for constrained IoT devices.","options":["True","False"],"answer":[0],"explanation":"Lecture 04 (IoT Networking Part I): 'classical internet ... is not meant for these constraint IoT devices'.","verified":"lecture","c":1412},{"q":"In the context of CoRE Service Discovery, IoT devices register their resources to the Resource Directory (RD) using which interface?","options":["Lookup Interface (LI)","Transport Interface (TI)","Registration Interface (RI)","Application Interface (AI)"],"answer":[2],"explanation":"Lecture 04 (IoT Networking Part I): 'CoRE devices ... register their resources to the resource directory and the registration interface'.","verified":"lecture","c":1413},{"q":"In the context of QoS for IoT Networks, which data timeliness policy mandates dropping stale data and notifying the application that a deadline has been missed?","options":["Latency budget policy","Deadline policy","Retention policy","Priority policy"],"answer":[1],"explanation":"Lecture 04 (IoT Networking Part I): data timeliness policies are deadline (max inter-arrival time) and latency budget; missed-deadline handling is the deadline policy.","verified":"lecture","c":1414},{"q":"State True or False. MQTT works on the Request/Response framework on top of UDP.","options":["True","False"],"answer":[1],"explanation":"Lecture 05 (IoT Networking Part II): MQTT 'is based on the concept of Publish/Subscribe ... on top of the existing TCP/IP' - not request/response over UDP.","verified":"lecture","c":1415},{"q":"Which of the following is/are advantages of XMPP?","options":["Interoperability","Extensibility","Flexibility","All of these"],"answer":[3],"explanation":"Lecture 05 (IoT Networking Part II): XMPP advantages are interoperability, extensibility and flexibility.","verified":"lecture","c":1416}]},{"year":2026,"session":"Jan-Apr 2026","week":2,"source":"https://myquizprep.pages.dev/solutions/introduction-to-industry-4-0-and-industrial-internet-of-things-apr26/week2","questions":[{"q":"Which type of waste in the Lean Production System is defined as \"Non value-added movement of people\"?","options":["Transportation","Motion","Waiting","Defects"],"answer":[1],"explanation":"Lecture 08 (Lean Production System): 'motion which is basically non value-added movement of people'.","verified":"lecture","c":1417},{"q":"Which type of business model value proposition exists when a bunch of goods/services are of higher value compared to the individual value of that product?","options":["Efficiency-centric","Novelty-centric","Lock-in centric","Complementary"],"answer":[3],"explanation":"Lecture 09 (Smart and Connected Business Perspective): complementary value creation bundles products/services, assets, technologies whose combined value exceeds individual value.","verified":"lecture","c":1418},{"q":"In the context of Lean Manufacturing wastes, what causes \"Processing waste\"?","options":["Producing products before demand","Use of inappropriate tools for processing","Excess inventory on the factory floor","Non-value added movement of personnel"],"answer":[1],"explanation":"Lecture 08 (Lean Production System) defines over-processing as doing more work than the customer values; of the options only 'inappropriate tools' describes processing waste (others are overproduction, inventory, motion).","verified":"reasoning","c":1419},{"q":"Which resource is primarily utilized to achieve \"Optimization\" in smart and connected products?","options":["Optimization algorithms","Custom software","External data sources","Sensors only"],"answer":[0],"explanation":"Lecture 09 (Smart and Connected Business Perspective): optimization category uses 'different optimization solutions, different algorithms'.","verified":"lecture","c":1420},{"q":"Which specific \"New Material\" mentioned in the context of Physical Megatrends is described as being stronger than steel but thinner than a human hair?","options":["Carbon Fiber","Graphene","Aerogel","Titanium Alloy"],"answer":[1],"explanation":"Lecture 06 (The Fourth Revolution): new materials include 'Graphene, carbon nanotubes'; graphene is the stronger-than-steel, thinner-than-hair example (Schwab).","verified":"lecture","c":1421},{"q":"What are the three types of work to be noticed when analyzing \"Value streams\"?","options":["Design, Production, and Delivery","Value-added, Incidental, and Pure Waste","Manual, Automated, and Hybrid","Planning, Execution, and Monitoring"],"answer":[1],"explanation":"Lecture 08 (Lean Production System): 'three types of works to be noticed. One is value added; second is incidental, and pure waste'.","verified":"lecture","c":1422},{"q":"What are the three categories of Megatrends driving the Fourth Industrial Revolution?","options":["Economic, Social, Political","Physical, Digital, Biological","Hardware, Software, Network","Local, National, Global"],"answer":[1],"explanation":"Lecture 06 (The Fourth Revolution): megatrends: 'physical ... digital ... biological transformation'.","verified":"lecture","c":1423},{"q":"Which material except Graphene is cited as an example of \"New Materials\" under Physical Megatrends?","options":["Silicon","Thermoset plastics","Copper","Aluminum"],"answer":[1],"explanation":"Lecture 06 (The Fourth Revolution): new materials 'recyclable plastics' besides graphene - thermoset plastics per slide (Schwab's recyclable thermosets); the other options are not new materials.","verified":"lecture","c":1424},{"q":"How do you define Sustainability in the context of a Manufacturing Industry?","options":["To increase profit margins annually","To continue at a fixed rate","To eliminate all waste products","To automate all processes"],"answer":[1],"explanation":"Lecture 07 (Sustainability Assessment of Manufacturing Industry): 'the term sustainability means to continue at a fixed rate'.","verified":"lecture","c":1425},{"q":"In the context of \"Government Regulations,\" what does the acronym EPA stand for?","options":["Economic Policy Agency","Environmental Protection Agencies","Energy Production Association","Employment Protection Act"],"answer":[1],"explanation":"Lecture 07 (Sustainability Assessment of Manufacturing Industry): environmental regulations 'maintained by ... the environmental protection agency'.","verified":"lecture","c":1426},{"q":"Which of the following is a characteristic of an economic depression?","options":["Duration is less than a year","High employment rates","Exponential unemployment increase","Increase in available credit"],"answer":[2],"explanation":"Lecture 07 (Sustainability Assessment of Manufacturing Industry): depression 'is observed by exponential unemployment increase, reduction in available credit'.","verified":"lecture","c":1427},{"q":"Which layer in the architecture of smart and connected products is responsible for collecting and acquiring data?","options":["Digital layer","Connectivity layer","Physical layer","Application layer"],"answer":[2],"explanation":"Lecture 09 (Smart and Connected Business Perspective): 'the physical layer is responsible for collecting and acquiring data with the help of sensors'.","verified":"lecture","c":1428},{"q":"Which of the following is a \"Lock-in centric\" value creation model?","options":["Focusing on novelty","Improving transaction efficiency","Preventing customer migration","Offering complementary products"],"answer":[2],"explanation":"Lecture 09 (Smart and Connected Business Perspective): 'Lock-in centric business model prevents the customer from migration'.","verified":"lecture","c":1429},{"q":"Which characteristic of smart factories involves \"Self-configuration\"?","options":["Proactivity","Transparency","Agility","Connection"],"answer":[2],"explanation":"Lecture 10 (Smart Factories): under agility: flexibility, adaptation, 'Self-configuration'.","verified":"lecture","c":1430},{"q":"In the automation pyramid of a smart factory, which level is at the very top?","options":["Device level","Control level","Manufacturing execution system level","ERP level"],"answer":[1],"explanation":"Corrected after checking the lecture (was: ERP level). Lecture 10 (Smart Factories): automation pyramid 'device level, then ... the control level, then ... manufacturing system level, and the ERP level' - Control is directly above Device (the 'ERP level' alt copy is wrong).","verified":"lecture","c":1431,"rel":[["Jan-Apr 2025",2,1]]}]},{"year":2026,"session":"Jan-Apr 2026","week":3,"source":"https://myquizprep.pages.dev/solutions/introduction-to-industry-4-0-and-industrial-internet-of-things-apr26/week3","questions":[{"q":"Who developed the first functioning Augmented Reality (AR) system in 1992?","options":["Ivan Sutherland","Louis Rosenberg","Thomas Caudell","Morton Heilig"],"answer":[1],"explanation":"L13: 'In 1992, Louise Rosenberg ... came up with the first functioning AR augmented reality system'.","verified":"lecture","c":1432},{"q":"In the 5C Architecture of CPS, which level provides the \"Collaborative Diagnostics\" functionality?","options":["Cyber Level","Cognition Level","Configuration Level","Conversion Level"],"answer":[1],"explanation":"L11: cognition covers 'collaborative diagnostics, decision making for prioritization'.","verified":"lecture","c":1433},{"q":"State True or False. AR technologies are widely used in the field of medical science to perform complex surgeries in the domain of Neurosurgery, MRI, and X-Ray systems.","options":["True","False"],"answer":[0],"explanation":"L13 lists medical environments and surgery as AR applications; the statement matches the course material's AR medical examples.","verified":"reasoning","c":1434},{"q":"Which \"V\" of Big Data refers to the fact that Big Data supports diverse categories and formats of data with no restrictions over input data formats?","options":["Volume","Velocity","Variety","Value"],"answer":[2],"explanation":"L15: 'Variety ... all different types of data without any restriction about the data format'.","verified":"lecture","c":1435},{"q":"In the context of Data Acquisition in Industry 4.0, what are the three main steps followed during the \"Data pre-processing\" of relational data?","options":["Collection, Transmission, Storage","Integration, Clearing, Redundancy Mitigation","Analysis, Visualization, Decision Making","Encryption, Compression, Archiving"],"answer":[1],"explanation":"L15: 'pre-processing of relational data mainly follows integration, clearing, and redundancy mitigation'.","verified":"lecture","c":1436},{"q":"What is the first step involved in the working of a Virtual Reality (VR) system?","options":["Display screen shows the user view through lenses","Processing unit creates sensations for the user","Lenses focus and reshape the image for each eye","Sensors estimate the user's motion and direction in space"],"answer":[3],"explanation":"L13 VR working: first 'sensors can detect the motion the direction in space', then lenses, processing unit, display.","verified":"lecture","c":1437},{"q":"State True or False. Brain-machine interfaces are engineered systems based on cognition and neuroscience and are a part of CPS.","options":["True","False"],"answer":[0],"explanation":"L11: 'brain machine interfaces, prosthetics ... examples of cyber physical systems ... based on cognition and neuroscience'.","verified":"lecture","c":1438},{"q":"What are PMUs in the context of CPS for Smart Grid?","options":["Power Management Unit","Phasor Measurement Unit","Performance Monitoring Unit","Project Management Unit"],"answer":[1],"explanation":"L11: 'PMUs Phasor Measurement Units'.","verified":"lecture","c":1439},{"q":"Which of the following options best describes a Collaboration Platform?","options":["Manufacturing hardware device","Business networking software","Entertainment social app","Financial record database"],"answer":[1],"explanation":"L12: collaboration platform is a software platform helping employees share information and solve business problems (business software with networking).","verified":"lecture","c":1440},{"q":"What are the five phases of the Product Lifecycle?","options":["Plan, Do, Check, Act","Design, Build, Test, Deploy","Ideate, Create, Market, Sell","Visualize, Explain, Perceive, Retire"],"answer":[3],"explanation":"L12: phases visualize, explain, perceive, use, retire; only option D matches.","verified":"lecture","c":1441},{"q":"Which of the following is a Technique/Method proposed to refine production across the lifecycle?","options":["ABC (Activity Based Costing)","XYZ Analysis","PQR Theory","LMN Modeling"],"answer":[0],"explanation":"L12: techniques to refine production across lifecycle include 'activity based costing'.","verified":"lecture","c":1442},{"q":"Which of the following best describes Artificial Intelligence (AI)?","options":["Hardware manufacturing process","Manmade thinking power","Database management system","Manual data entry"],"answer":[1],"explanation":"L14: AI is 'a creation of man-made thinking power'.","verified":"lecture","c":1443},{"q":"Declarative knowledge is also known as ________.","options":["Operational knowledge","Heuristic knowledge","Relational knowledge","Procedural knowledge"],"answer":[2],"explanation":"L14: 'declarative or, relational knowledge, this is also known as descriptive knowledge'.","verified":"lecture","c":1444},{"q":"Which of the following is an usecase of AI in Industry 4.0?","options":["Increasing manual labor","Reducing internet usage","Slowing production cycles","Ensuring machine safety"],"answer":[3],"explanation":"L14: 'machine safety, efficient products lifecycle ... could be achieved with the help of AI'.","verified":"lecture","c":1445},{"q":"Which of the following statement best describes the characteristics of Unstructured data?","options":["Possesses pre-defined model","Stored in relational databases","Managed by SQL","No pre-defined model"],"answer":[3],"explanation":"L15: for unstructured data 'there is no predefined data model'.","verified":"lecture","c":1446}]},{"year":2026,"session":"Jan-Apr 2026","week":4,"source":"https://myquizprep.pages.dev/solutions/introduction-to-industry-4-0-and-industrial-internet-of-things-apr26/week4","questions":[{"q":"Which component of Cybersecurity protects applications from outer threats, often using firewalls?","options":["Application Security","Network Security","Cloud Security","End-user Education"],"answer":[0],"explanation":"L16: 'Application security basically ensures that you are protecting the different applications from outsider threats ... application firewalls'.","verified":"lecture","c":1447},{"q":"What is Zephyr?","options":["A Smart Sensor","An Website","An OS","None of these"],"answer":[2],"explanation":"L19: 'Zephyr, Ubuntu, Opensuse ... these are some of the different operating systems used in the smart sensors'.","verified":"lecture","c":1448},{"q":"Fill in the blank: Most of the commonly used ransomware attacks use ________, where the user receives a legal file as an attachment and is skillfully forced to download or open it.","options":["Worm","Virus","Trojan","Malware"],"answer":[2],"explanation":"Not in the transcript; a malicious file disguised as a legitimate attachment is a Trojan, the usual ransomware delivery vector.","verified":"reasoning","c":1449},{"q":"In the Software-Defined Cloud Manufacturing Architecture (SDCMA), which component is responsible for detecting abnormality?","options":["Control Elements (CE)","Hardware Plane","Ensemble Intelligence Framework (EIF)","Software Plane"],"answer":[2],"explanation":"L16: in SDCMA 'this EIF is also responsible for detecting the abnormality'.","verified":"lecture","c":1450},{"q":"Fill in the blank: Typically, ________ form the core of the smart sensor nodes.","options":["Transistors","Microprocessors","MOSFETS","Diodes"],"answer":[1],"explanation":"L19: in the smart sensor node the processor, 'where all this processing are taking place', is 'very important'. Microprocessors form the core.","verified":"lecture","c":1451},{"q":"Which cybersecurity component involves strategies to maintain the availability, integrity, and confidentiality of business data?","options":["Network Security","Operational Security","Information Security","Physical Security"],"answer":[2],"explanation":"L16: information security policies 'maintain the availability, the integrity, and the confidentiality of the data'.","verified":"lecture","c":1452},{"q":"Which of the following is NOT a protected asset in cybersecurity?","options":["Hardware","Software","Data","Public domain information"],"answer":[3],"explanation":"L16: cybersecurity protects hardware, software and data; public domain information is not a protected asset.","verified":"lecture","c":1453},{"q":"How does IIoT modify traditional automation techniques?","options":["By removing all sensors","By exploiting IT technology","By using manual tools","By ignoring data"],"answer":[1],"explanation":"L17: 'IIoT basically modifies the traditional automation techniques by exploiting the IT technology'.","verified":"lecture","c":1454},{"q":"Which of the following has been identified as a major challenge in IIoT deployment?","options":["Excessive standardization","Lack of generated data","Surplus of skilled workers","Data integration challenges"],"answer":[3],"explanation":"L17: 'There are data integration challenges' in IIoT deployment.","verified":"lecture","c":1455},{"q":"How does Industrial Internet assist Power Production?","options":["Increases inspection costs","Locates broken equipment easily","Disconnects the grid","Hides performance data"],"answer":[1],"explanation":"L18: industrial internet helps 'locate the point where the power line is broken or where the equipment ... has gone down'.","verified":"lecture","c":1456},{"q":"State True or False: The Industrial Internet can benefit commercial aviation industries by improving both airline operations and asset management.","options":["True","False"],"answer":[0],"explanation":"L18: 'industrial internet has benefited the commercial aviation industries by improving both airline operations and asset management'.","verified":"lecture","c":1457},{"q":"What is considered the primary source of IIoT data?","options":["Cloud Server","Actuator","Sensor","Microprocessor"],"answer":[2],"explanation":"L19: 'sensors are basically the primary source of IIoT data'.","verified":"lecture","c":1458},{"q":"Fill in the blank: Conventional Sensing is primarily involved in ________.","options":["Feedback automation","Cloud computing","Internet connectivity","Big data analytics"],"answer":[0],"explanation":"L19: 'conventional sensing it involved getting some kind of feedback, automation of a process'.","verified":"lecture","c":1459},{"q":"Which challenge of Industry 4.0 is directly associated with ageing society and lack of skilled workers?","options":["Dynamic market conditions","Resource utilization","Constrained workforce","Product management"],"answer":[2],"explanation":"L20: 'Constrained work force means, the work force ... is not already skilled'.","verified":"lecture","c":1460},{"q":"Efficient use of materials, water, and energy is categorized under which expected feature of Industry 4.0?","options":["Competitiveness","Innovation","Workforce","Efficiency"],"answer":[3],"explanation":"L20: under efficiency, 'efficient utilization of energy, efficient utilization of water, or other resources, and other materials'.","verified":"lecture","c":1461}]},{"year":2026,"session":"Jan-Apr 2026","week":5,"source":"https://myquizprep.pages.dev/solutions/introduction-to-industry-4-0-and-industrial-internet-of-things-apr26/week5","questions":[{"q":"In the context of the \"Value Proposition\" building block, which of the following is considered a qualitative value?","options":["Price","Post-purchase cost reduction","Customer experience","Product performance"],"answer":[2],"explanation":"Lecture 22 (Business Models - Part 1): qualitative values are 'design, customization, the customer experience, the branding'.","verified":"lecture","c":1462},{"q":"A business model that serves specific and specialized customer groups is known as a:","options":["Mass market","Segmented market","Niche market","Diversified market"],"answer":[2],"explanation":"Lecture 22 (Business Models - Part 1): customer segments - 'Niche market means the specific type of market that will be considered by the business'.","verified":"lecture","c":1463},{"q":"Credits and cash owned by an organization are classified under which asset category?","options":["Physical assets","Human assets","Intellectual assets","Financial assets"],"answer":[3],"explanation":"Lecture 22 (Business Models - Part 1): value-chain resources can be 'physical, intellectual, human, financial'; cash/credits are financial assets.","verified":"lecture","c":1464},{"q":"Which component of the IIoT business model focuses on solving the complexities and uncertainties inherent in interactions between various business actors?","options":["Value Proposition","Value Network","Value Capturing","Value Communication"],"answer":[3],"explanation":"Not explained in Lecture 23 (only named). Lecture 23 is based on Ehret & Wirtz (2017), which says value communication addresses interactions between actors where 'complexity and uncertainty are high'.","verified":"reasoning","c":1465},{"q":"The \"Information Domain\" in IIRA handles data persistence. In the context of Big Data generated by IIoT, which \"V\" refers to the trustworthiness or quality of the data?","options":["Volume","Velocity","Variety","Veracity"],"answer":[3],"explanation":"Lecture 15 (Big Data): veracity 'indicates the biasness ... unusualness and noise in the data' - the trustworthiness/quality V.","verified":"lecture","c":1466},{"q":"Which of the following is considered a \"Lagging KPI\" for occupational safety?","options":["Percentage of workers with adequate safety training","Number of OSH audits performed","Frequency of observed unsafe behavior","Number of production days lost due to sickness absence"],"answer":[3],"explanation":"Lecture 24 (Reference Architecture - Part 1): lagging KPIs include 'production days lost due to sickness absence'; training %, audits, unsafe behaviour are leading KPIs.","verified":"lecture","c":1467,"rel":[["Jul-Oct 2026",5,0]]},{"q":"Caterpillar uses IoT combined with which technology for machine monitoring?","options":["Virtual Reality (VR)","Augmented Reality (AR)","Blockchain technology","Quantum computing"],"answer":[1],"explanation":"Lecture 21 (Industrial Processes - Part 2): 'Caterpillar basically has implemented IoT and augmented reality solutions'.","verified":"lecture","c":1468},{"q":"Fill in the blank. Maersk uses IoT primarily for ________.","options":["Smart Logistics","Manufacturing cars","Generating electricity","Mining coal"],"answer":[0],"explanation":"Lecture 21 (Industrial Processes - Part 2): 'Maersk is basically a company in the smart logistics domain'.","verified":"lecture","c":1469},{"q":"What does a Business Model primarily describe?","options":["Technical hardware specifications","Rationale of creating value","Employee holiday schedules","Office floor plan"],"answer":[1],"explanation":"Lecture 22 (Business Models - Part 1): business model captures 'the rationale behind how the organization ... deliver value ... capturing the value'.","verified":"lecture","c":1470},{"q":"State True or False: Lack of interoperability leads to increased complexity.","options":["True","False"],"answer":[0],"explanation":"Lecture 23 (Business Models - Part 2) lists lack of interoperability and increased complexity together as IIoT business-model challenges (needs seamless data sharing across vendors).","verified":"lecture","c":1471},{"q":"Fill in the blank. The three categories of IIoT business models are Cloud-based, Process-Oriented, and ________ Business Model.","options":["Hardware-Oriented","Service-Oriented","Product-Oriented","Data-Oriented"],"answer":[1],"explanation":"Lecture 23 (Business Models - Part 2): IIoT business models 'could be cloud-based business model, service-oriented business model or process-oriented business model'.","verified":"lecture","c":1472},{"q":"In the IIRA Framework, what are defined as \"collection of ideas which describe, analyze, and solve the set of specific concerns\"?","options":["Stakeholders","Architecture Frames","Viewpoints","Testbeds"],"answer":[2],"explanation":"Lecture 24 (Reference Architecture - Part 1): viewpoints are the stakeholders' ideas 'describing ... analyzing the ideas, and solving the set of specific concerns'.","verified":"lecture","c":1473},{"q":"Which architecture pattern allows for fast device-to-device integration with minimum response time?","options":["Three-tier architecture","Client-Server architecture","Layered Databus pattern","Gateway-mediated architecture"],"answer":[2],"explanation":"Lecture 24 (Reference Architecture - Part 1): layered databus allows 'device to device integration with minimum response time'.","verified":"lecture","c":1474},{"q":"Which element in the Usage Viewpoint of IIRA is defined as the \"basic unit of work\" carried out by a party assuming a role?","options":["Task","Activity","Agent","Workflow"],"answer":[0],"explanation":"Lecture 25 (Reference Architecture - Part 2): 'the task is a basic unit of work, that is carried out by a party, that assumes a specific role'.","verified":"lecture","c":1475},{"q":"Which IIRA viewpoint relates to the technical representation of an IIoT system including interfaces, protocols, and behaviors?","options":["Functional Viewpoint","Implementation Viewpoint","Usage Viewpoint","Business Viewpoint"],"answer":[1],"explanation":"Lecture 25 (Reference Architecture - Part 2): 'Implementation viewpoint relates to the technical presentation of the IIoT system ... interconnection of different components'.","verified":"lecture","c":1476,"rel":[["Jul-Oct 2024",5,1]]}]},{"year":2026,"session":"Jan-Apr 2026","week":6,"source":"https://myquizprep.pages.dev/solutions/introduction-to-industry-4-0-and-industrial-internet-of-things-apr26/week6","questions":[{"q":"What is the usual packet size requirement for uRLLC?","options":["8 B","16–32 B","32–200 B","1024 B"],"answer":[2],"explanation":"Lecture 30 (Connectivity - Part 3): URLLC 'packet size of thirty[-two] to 200 bytes'.","verified":"lecture","c":1477},{"q":"Fill in the blank: ModBus-TCP is an industrial communication protocol that is primarily designed to run over ______.","options":["Serial RS-232 links","Standard Ethernet and TCP/IP","Bluetooth Low Energy","Satellite communication"],"answer":[1],"explanation":"Lecture 28 (Connectivity - Part 1): Modbus TCP 'uses the TCP/IP and the Ethernet for data transmission'.","verified":"lecture","c":1478},{"q":"Which Profibus variant is designed for high-speed communication between automation systems and equipment using RS-485 or fiber optics?","options":["Profibus PA","Profibus FMS","Profibus DP","Profinet"],"answer":[2],"explanation":"Lecture 29 (Connectivity - Part 2): Profibus DP (Decentralized Peripherals) uses RS-485, 9.6 kbps-12 Mbps, for automation devices.","verified":"lecture","c":1479},{"q":"What is the maximum transmission rate of the “Standard CC-Link” technology?","options":["156 kbps","500 kbps","10 Mbps","1 Gbps"],"answer":[2],"explanation":"Lecture 29 (Connectivity - Part 2): data rates '10 Mbps for standard'.","verified":"lecture","c":1480},{"q":"Which gas sensing method relies specifically on “Electrical Variation” for detection?","options":["Acoustic Methods","Optic Methods","Metal Oxide Semiconductors (MOS)","Calorimetric Method"],"answer":[2],"explanation":"Lecture 27 (Key Enablers: Sensing - Part 2): CNT, polymer and metal oxide semiconductor methods 'are the electrical variants'.","verified":"lecture","c":1481},{"q":"In manufacturing processes, Fieldbus is primarily used for which type of data transfer?","options":["Clock synchronization","High-performance analytics","Periodic I/O data transfer","Wide Area Network (WAN) management"],"answer":[2],"explanation":"Lecture 28 (Connectivity - Part 1): fieldbus 'is primarily used for manufacturing processes dealing with periodic input-output data transfer'.","verified":"lecture","c":1482},{"q":"Under which category of sensors do “smoke detectors” and “alcohol detectors” fall in an industrial monitoring context?","options":["Optical sensors","Thermal sensors","Chemical sensors","Electrical sensors"],"answer":[2],"explanation":"Smoke and alcohol detectors sense chemical species, so they are chemical sensors (Lecture 27 lists alcohol breath test among gas-sensor uses).","verified":"reasoning","c":1483},{"q":"Which variant of the CC-Link protocol is specifically designed to ensure error-free data communication of large data through Industrial Ethernet?","options":["CC-Link Safety","CC-Link LT","CC-Link IE","CC-Link RTU"],"answer":[2],"explanation":"Lecture 29 (Connectivity - Part 2): CC-Link variants; CC-Link IE (Industrial Ethernet, 1 Gbps) handles large data over Industrial Ethernet.","verified":"lecture","c":1484},{"q":"Improvement of which of the following is emphasized as a key concern in IIoT systems?","options":["Only profitability","Only system throughput","Efficiency, productivity, health, and safety","Hardware miniaturization alone"],"answer":[2],"explanation":"Lecture 26 (Key Enablers: Sensing - Part 1): 'we are talking about improvement of efficiency, productivity, health, safety, etcetera of the systems'.","verified":"lecture","c":1485},{"q":"State True or False: The output voltage of the LM35 sensor is linearly proportional to Kelvin temperature.","options":["True","False"],"answer":[1],"explanation":"Lecture 26 (Key Enablers: Sensing - Part 1): LM35 output 'is linearly proportional to the Celsius temperature', not Kelvin.","verified":"lecture","c":1486},{"q":"Fill in the blank: Air quality monitoring and alert systems with gas sensing units are primarily deployed to ______.","options":["Improve network bandwidth","Avoid risks of harmful gas exposure","Reduce hardware cost","Increase cloud storage"],"answer":[1],"explanation":"Lecture 27 (Key Enablers: Sensing - Part 2): gas monitoring so 'as not to harm these individuals from exposure to these harmful gases'.","verified":"lecture","c":1487},{"q":"Which of the following belongs to the Fieldbus category?","options":["Profinet","EtherNet/IP","TSN","Modbus-RTU"],"answer":[3],"explanation":"Lecture 28 (Connectivity - Part 1): fieldbus protocols: 'Modbus-RTU ... Profibus, Interbus, CC-link, DeviceNet'.","verified":"lecture","c":1488},{"q":"Which Profibus variant handles communication between PCs and Programmable Logic Controllers?","options":["Profibus DP","Profibus PA","Profibus FMS","Profibus IE"],"answer":[2],"explanation":"Lecture 29 (Connectivity - Part 2): 'Profibus FMS ... handles the communication between the PCs and the PLCs'.","verified":"lecture","c":1489,"rel":[["Jul-Oct 2024",6,1]]},{"q":"Which network topology is used by Interbus?","options":["Bus","Star","Active ring","Hybrid"],"answer":[2],"explanation":"Lecture 29 (Connectivity - Part 2): Interbus 'network topology that is supported is the ring topology' (active ring).","verified":"lecture","c":1490,"rel":[["Jul-Oct 2024",6,0]]},{"q":"Which frequency band is classified as high band in 5G NR?","options":["< 1 GHz","1–6 GHz","> 24 GHz","6–24 GHz"],"answer":[2],"explanation":"Lecture 30 (Connectivity - Part 3): 5G NR 'high band, which is basically more than this 24 Giga hertz band'.","verified":"lecture","c":1491}]},{"year":2026,"session":"Jan-Apr 2026","week":7,"source":"https://myquizprep.pages.dev/solutions/introduction-to-industry-4-0-and-industrial-internet-of-things-apr26/week7","questions":[{"q":"What does LPWAN stand for?","options":["Low Power Wireless Access Network","Long Power Wide Area Network","Low Power Wide Area Network","Long Power Wireless Area Network"],"answer":[2],"explanation":"'low power wide area network ... LPWAN' (Lecture 31: Key Enablers of IIoT: Connectivity – Part 4 (LoRa/SIGFOX + NodeMCU demo)).","verified":"lecture","c":1492},{"q":"LoRa technology operates in which of the following frequency bands?","options":["License-free sub-gigahertz bands","Licensed microwave bands","Optical frequency bands","Millimeter-wave bands"],"answer":[0],"explanation":"'LoRa operates in the license free sub gigahertz radio frequency band' (Lecture 31: Key Enablers of IIoT: Connectivity – Part 4 (LoRa/SIGFOX + NodeMCU demo)).","verified":"lecture","c":1493},{"q":"What is the maximum wireless throughput achieved by SIGFOX?","options":["1 kbps","500 bps","10 kbps","100 bps"],"answer":[3],"explanation":"'the throughput that is achieved using SIGFOX is up to 100 bps' (Lecture 31: Key Enablers of IIoT: Connectivity – Part 4 (LoRa/SIGFOX + NodeMCU demo)).","verified":"lecture","c":1494},{"q":"Which IEEE standard forms the basis of the physical and MAC layers of Zigbee?","options":["IEEE 802.11","IEEE 802.3","IEEE 802.15.4","IEEE 802.16"],"answer":[2],"explanation":"IEEE 802.15.4 (Lecture 32: Key Enablers of IIoT: Connectivity – Part 5 (Zigbee/Xbee demo)).","verified":"lecture","c":1495,"rel":[["Jul-Oct 2024",7,0]]},{"q":"Which of the following is NOT a Zigbee-supported network topology?","options":["Star","Tree","Mesh","Ring"],"answer":[3],"explanation":"Supported: star, tree, mesh (Lecture 32: Key Enablers of IIoT: Connectivity – Part 5 (Zigbee/Xbee demo)).","verified":"lecture","c":1496,"rel":[["Jul-Oct 2023",6,0],["Jul-Oct 2023",7,0],["Jan-Apr 2024",7,0]]},{"q":"What is Xbee in the context of Zigbee communication?","options":["A network protocol","A product that uses the Zigbee protocol","A routing algorithm","A MAC-layer standard"],"answer":[1],"explanation":"'Xbee ... is a product from one of these companies ... which follows the ZigBee protocol' (Lecture 32: Key Enablers of IIoT: Connectivity – Part 5 (Zigbee/Xbee demo)).","verified":"lecture","c":1497},{"q":"Which sensor in an autonomous vehicle generates data in the range of 20–40 MB/s?","options":["GPS","RADAR","Camera","SONAR"],"answer":[2],"explanation":"Autonomous car data rates: GPS ~50 kbps, sonar/radar 10–100 kbps, LiDAR 10–70 MBps, 'cameras 20 to 40' MBps (Lecture 33: Key Enablers of IIoT: Processing – Part 1).","verified":"lecture","c":1498},{"q":"What type of computing processes data closer to sensors before sending it to the cloud?","options":["Edge computing","Centralized computing","Distributed computing","Batch computing"],"answer":[0],"explanation":"Processing 'close to the sensors ... at the edge' before the cloud (Lecture 33: Key Enablers of IIoT: Processing – Part 1).","verified":"lecture","c":1499},{"q":"In an end-to-end IIoT processing pipeline, where are rules initially configured?","options":["At the sensor nodes","In the cloud","At the edge analytics agent","At the actuators"],"answer":[1],"explanation":"'step one is configuring the rules and actions in the cloud ... then deploy these rules at the edge' (Lecture 33: Key Enablers of IIoT: Processing – Part 1).","verified":"lecture","c":1500},{"q":"What is the main objective of AR drones-based precision agriculture?","options":["Monitoring soil moisture","Precise fertilizer spray to weeds","Autonomous harvesting","Livestock monitoring"],"answer":[1],"explanation":"AR drones work: 'precise fertilizer spray to the weeds' (Lecture 34: Key Enablers of IIoT: Processing – Part 2).","verified":"lecture","c":1501},{"q":"SWAMP enables a smart management layer between which two systems?","options":["Water distribution network and farm-based irrigation system","Cloud services and mobile applications","Sensors and actuators","Enterprise and automation networks"],"answer":[0],"explanation":"SWAMP integrates data from the water distribution network and farm-based irrigation decisions (Lecture 34: Key Enablers of IIoT: Processing – Part 2).","verified":"lecture","c":1502},{"q":"What do process variables represent in an industrial control system?","options":["Controller decision outputs","Standard operating limits","Values of process parameters measured using sensors","Signals sent to actuators"],"answer":[2],"explanation":"'process variable are basically the values of the process parameters measured using devices such as sensors' (Lecture 35: Key Enablers of IIoT: Process Control).","verified":"lecture","c":1503},{"q":"What is the fundamental element of industrial control systems for automatic control?","options":["Control loops","Sensors","Controllers","Actuators"],"answer":[0],"explanation":"'this control loop is the fundamental element of industrial control systems' (Lecture 35: Key Enablers of IIoT: Process Control).","verified":"lecture","c":1504},{"q":"Which component of a SCADA system interfaces directly with sensors to read and convert data?","options":["The Supervisory System","The Human Machine Interface (HMI)","The Communication Infrastructure","Programmable Logic Controllers (PLC) and Remote Terminal Units (RTU)"],"answer":[3],"explanation":"SCADA architecture: signal goes through the network 'to the plc to the rtu; from the plc the sensors, actuators ... field devices are controlled' (Lecture 35: Key Enablers of IIoT: Process Control).","verified":"lecture","c":1505},{"q":"What is a primary advantage of PLCs over traditional hard-wired systems?","options":["They are physically larger and more durable","They can be easily reprogrammed, making maintenance and upgrades more economical","They operate at a much higher voltage","They do not require a power supply"],"answer":[1],"explanation":"Not explicit in Lecture 35: Key Enablers of IIoT: Process Control (PLC acts on a predefined program); reprogrammability is the standard PLC advantage over hard-wired relay logic; other options are absurd.","verified":"reasoning","c":1506}]},{"year":2026,"session":"Jan-Apr 2026","week":8,"source":"https://myquizprep.pages.dev/solutions/introduction-to-industry-4-0-and-industrial-internet-of-things-apr26/week8","questions":[{"q":"What is the purpose of feature extraction in ML?","options":["Convert raw data into compressed bitstreams only","Convert raw data to information that relates to the physical state of the asset","Encrypt sensor data for security","Remove time stamps from data"],"answer":[1],"explanation":"'feature extraction methods ... convert the raw data into information that relates to the physical state of the asset' (Lecture 36: IIoT Analytics and Data Management: Introduction).","verified":"lecture","c":1507},{"q":"What is a primary goal of applying analytics in industrial systems?","options":["Maximizing data volume","Replacing all controllers with cloud services","Improving operational platform, performance, and safety","Eliminating human workers completely"],"answer":[2],"explanation":"Lecture 36: IIoT Analytics and Data Management: Introduction: analytics derives insights for improved operations, efficiency and safety; other options are absurd.","verified":"reasoning","c":1508},{"q":"What kind of data does supervised learning require?","options":["Completely unlabeled streams","Only binary sensor signals","Labeled datasets with known output classes or values","Data without any prior samples"],"answer":[2],"explanation":"Supervised learning uses labeled training data (Lecture 36: IIoT Analytics and Data Management: Introduction, Lecture 37: Machine Learning and Data Science – Part 1).","verified":"lecture","c":1509},{"q":"Which of the following is explicitly listed as a goal of IIoT analytics?","options":["Manual inspection","Dynamic operations optimization","Hardware miniaturization","Network routing"],"answer":[1],"explanation":"Analytics value drivers include data-driven process optimization (Lecture 36: IIoT Analytics and Data Management: Introduction); only option that is an analytics goal.","verified":"reasoning","c":1510},{"q":"What approach replaces physics-based models in modern IIoT analytics?","options":["Data-driven modelling using ML and DL","Heuristic optimization","Rule-based control","Manual calibration"],"answer":[0],"explanation":"Lecture 36: IIoT Analytics and Data Management: Introduction: 'systems are data driven'; ML/DL models built from data replace hand-built models; others are not analytics approaches.","verified":"reasoning","c":1511},{"q":"Data Science is an interdisciplinary field involving which of the following areas?","options":["Only computer science","Only data processing","Only artificial intelligence","Computer science, statistics, mathematics, machine learning, and domain expertise"],"answer":[3],"explanation":"'data science combines the knowledge from mathematics, computer science and domain expertise ... statistical techniques, data processing, machine learning' (Lecture 37: Machine Learning and Data Science – Part 1).","verified":"lecture","c":1512},{"q":"Fill in the blank. Unsupervised learning is primarily used for identifying similar groups of data called ______.","options":["Clustering","Classification","Regression","Prediction"],"answer":[0],"explanation":"'identify similar groups of data and this process is known as clustering' (Lecture 37: Machine Learning and Data Science – Part 1).","verified":"lecture","c":1513},{"q":"Which clustering algorithm allows a data point to belong to more than one cluster?","options":["K-Means","Linear Regression","Decision Tree","Fuzzy c-Means"],"answer":[3],"explanation":"Fuzzy c-means (Lecture 37: Machine Learning and Data Science – Part 1).","verified":"lecture","c":1514,"rel":[["Jul-Oct 2024",8,0]]},{"q":"Fill in the blank. Machine learning algorithms are not useful for ______ data.","options":["Structured","Temporal","High dimensional","Labeled"],"answer":[2],"explanation":"'Machine learning algorithms are not useful for high dimensional data' (Lecture 38: Machine Learning and Data Science – Part 2).","verified":"lecture","c":1515},{"q":"State True or False. Deep learning mimics the working function of billions of neurons in the human brain.","options":["True","False"],"answer":[0],"explanation":"'it mimics the working function of billions of neurons in our brain' (Lecture 38: Machine Learning and Data Science – Part 2).","verified":"lecture","c":1516},{"q":"Platform-as-a-Service mainly allows industries to do what?","options":["Only deploy hardware","Self-develop applications","Store raw sensor data only","Replace networking infrastructure"],"answer":[1],"explanation":"PaaS gives development platforms to industries (Lecture 39: Cloud Computing in IIoT – Part 1).","verified":"lecture","c":1517},{"q":"Which type of data is explicitly mentioned as contributing to cloud demand in IIoT?","options":["Image data","M2M sensor data","Social media data","Textual reports"],"answer":[1],"explanation":"Lecture 39: Cloud Computing in IIoT – Part 1 cites heterogeneous machine/sensor data as the reason cloud is needed; M2M sensor data is the matching option (cf. Jul 2025 item wording).","verified":"reasoning","c":1518},{"q":"State True or False. Increase in number of devices makes IIoT ecosystems more complex, necessitating cloud-based device management.","options":["True","False"],"answer":[0],"explanation":"'the ecosystem overall is highly complex' with large numbers of devices, so cloud-based device management is needed (Lecture 40: Cloud Computing in IIoT – Part 2).","verified":"lecture","c":1519},{"q":"What is one key purpose of a Service Level Agreement (SLA) for IIoT?","options":["Eliminating cloud providers","Promising deliverables from cloud providers","Increasing hardware redundancy","Enforcing local computation"],"answer":[1],"explanation":"SLA: 'a promise of delivering something through some formal agreement' from the cloud provider (Lecture 40: Cloud Computing in IIoT – Part 2).","verified":"lecture","c":1520},{"q":"Fill in the blank. A good SLA should be affordable, quantifiable, controllable, meaningful, mutually acceptable, and ______.","options":["Flexible","Enforceable","Achievable","Adaptive"],"answer":[2],"explanation":"'a good SLA should be achievable' (Lecture 40: Cloud Computing in IIoT – Part 2).","verified":"lecture","c":1521}]},{"year":2026,"session":"Jan-Apr 2026","week":9,"source":"https://myquizprep.pages.dev/solutions/introduction-to-industry-4-0-and-industrial-internet-of-things-apr26/week9","questions":[{"q":"Why is Julia programming considered advantageous?","options":["It is slower than Python.","It merges Python’s benefits with C’s performance.","It is a closed-source language.","It does not support parallelism."],"answer":[1],"explanation":"Lecture 42 (Tutorial for R & Julia): Julia 'builds on the benefits ... from Python and the performance ... with C language'.","verified":"lecture","c":1522},{"q":"What relationship does Linear Regression detect?","options":["A non-linear relationship between binary variables","A clustering pattern in unlabeled data","A random relationship between unrelated variables","A linear relationship between a dependent variable and independent variables"],"answer":[3],"explanation":"Lecture 37 (ML & Data Science Part 1): linear regression 'learns a linear function from the given instances of the X and Y values'.","verified":"lecture","c":1523},{"q":"Which core concept defines Software-Defined Networking (SDN)?","options":["Hardwiring control logic into every switch","Decoupling the control plane from the data plane","Combining all network functions into a single monolithic server","Eliminating the need for any software in networking"],"answer":[1],"explanation":"Lecture 45 (SDN in IIoT Part 1): 'In SDN we are typically talking about decoupling of the control plane from the data plane'.","verified":"lecture","c":1524},{"q":"Fill in the blank. Fog computing architecture places fog nodes between ______ and the cloud.","options":["Industrial end devices","Enterprise servers","Mobile applications","Databases"],"answer":[0],"explanation":"Lecture 41 (Fog Computing in IIoT): fog layer 'is going to sit between this particular edge layer and the cloud layer' (end devices - fog - cloud).","verified":"lecture","c":1525},{"q":"What is the major challenge in handling data from sensors and machines in IIoT?","options":["High cost of sensors","Diversity in protocols, data syntax, and data sources","Lack of storage capacity","Insufficient processing power"],"answer":[1],"explanation":"Lecture 41 (Fog Computing in IIoT): 'the major challenge is to handle the diversity of the data in real time' (slide: protocols, data syntax, sources).","verified":"lecture","c":1526},{"q":"State True or False. Fog computing in IIoT prevents unnecessary noisy big data crowd at the cloud.","options":["True","False"],"answer":[0],"explanation":"Lecture 41 (Fog Computing in IIoT): 'required to prevent as much as possible the unnecessary noisy data from the cloud through some kind of a filtration process ... at the fog'.","verified":"lecture","c":1527},{"q":"State True or False. R is an open source tool for programming, statistical analysis, and graphics representation.","options":["True","False"],"answer":[0],"explanation":"Lecture 42 (Tutorial for R & Julia): R offers a programming language, statistical analysis, graphical representation, and is open source.","verified":"lecture","c":1528},{"q":"Which R package provides functions for fuzzy clustering, support vector machine, and naive bayes classifier?","options":["rpart","e1071","nnet","caret"],"answer":[1],"explanation":"Lecture 42 (Tutorial for R & Julia): 'e1071 is a package ... which supports fuzzy clustering, SVM, naive Bayes classifier'.","verified":"lecture","c":1529},{"q":"Fill in the blank. The basic service models provided by cloud computing include IaaS, PaaS, and ______.","options":["DaaS","NaaS","SaaS","FaaS"],"answer":[2],"explanation":"Lecture 43 (Data Management with Hadoop): 'infrastructure as a service, platform as a service and software as a service'.","verified":"lecture","c":1530},{"q":"Which Hadoop component is described as a module containing the utilities that support the other Hadoop components?","options":["HDFS","MapReduce","Hadoop Common","YARN"],"answer":[2],"explanation":"Lecture 43 (Data Management with Hadoop): 'Hadoop common ... a module that contains the utilities that would support the other Hadoop components'.","verified":"lecture","c":1531},{"q":"What routing protocol does BCube run?","options":["BSR (BCube Source Routing)","BGP","OSPF","RIP"],"answer":[0],"explanation":"Lecture 44 (Data Center Networks): 'BSR the B cube source routing protocol'.","verified":"lecture","c":1532},{"q":"Which of the following is mentioned as a data center network challenge?","options":["High cost","Poor server-to-server connectivity","Complex configuration","Limited vendors"],"answer":[1],"explanation":"Lecture 44 (Data Center Networks): DCN challenges include scalability, 'poor server-to-server connectivity', static resource assignment, resource fragmentation, fault tolerance.","verified":"lecture","c":1533},{"q":"Which protocol is mentioned as part of SDN components?","options":["TCP","UDP","OpenFlow","HTTP"],"answer":[2],"explanation":"Lecture 45 (SDN in IIoT Part 1): OpenFlow is the SDN protocol listed among SDN components.","verified":"lecture","c":1534},{"q":"State True or False. GCAM is used to place flow-rules in SDN forwarding devices, but it is limited in capacity.","options":["True","False"],"answer":[1],"explanation":"Lecture 45 (SDN in IIoT Part 1): the limited-capacity memory storing flow rules is TCAM ('Ternary Content Addressable Memory'), not GCAM; as literally worded the statement is False, but if 'GCAM' is a typo for TCAM NPTEL would mark True.","verified":"unsure","c":1535},{"q":"Which advantage of SDIIoT enables events to be processed in order through deterministic forwarding of traffic?","options":["Deterministic networking","High availability","Low-latency virtualization","Robust security"],"answer":[0],"explanation":"Lecture 45 (SDN in IIoT Part 1): 'Deterministic networking ... rule based priority forwarding ... deterministic forwarding of traffic ... so that the events are processed in order'.","verified":"lecture","c":1536}]},{"year":2026,"session":"Jan-Apr 2026","week":10,"source":"https://myquizprep.pages.dev/solutions/introduction-to-industry-4-0-and-industrial-internet-of-things-apr26/week10","questions":[{"q":"What is the primary objective of the IETF 6TiSCH protocol in the context of IIoT?","options":["To enable deterministic communication and efficient resource allocation","To increase non-deterministic communication","To replace SDN controllers entirely","To increase jitter in the network"],"answer":[0],"explanation":"Lecture 46 (SDN in IIoT Part 2): deterministic communication ensures 'provisioning of resource allocation efficiently in constraint networks'.","verified":"lecture","c":1537},{"q":"μSDN is integrated with which protocol stack?","options":["Zigbee stack","IPv4 stack","Contiki IEEE 802.15.4-2015 stack","LTE stack"],"answer":[2],"explanation":"Lecture 46 (SDN in IIoT Part 2): micro-SDN 'based on the IEEE 802.15.4 implementation in ... Contiki'.","verified":"lecture","c":1538},{"q":"Fill in the blank. The public network in SDIIoT consists of switches, routers, and ______ network.","options":["Sensor","Access","Control","Storage"],"answer":[1],"explanation":"Lecture 46 (SDN in IIoT Part 2): 'public networks will consist of ... switches, routers and access devices'.","verified":"lecture","c":1539},{"q":"State True or False. Trustworthy IIoT incl T Part 2): 'We need to have end to end security'.","verified":"lecture","c":1545},{"q":"Which feature of a smart factory enables prediction of future outcomes?","options":["Transparent","Connected","Proactive","Agile"],"answer":[2],"explanation":"Lecture 49 (Factories and Assembly Line): 'Proactive ... we can predict the future outcomes and take ... preventive actions'.","verified":"lecture","c":1546},{"q":"Airbus uses which technology to visualize production processes in real time?","options":["Augmented Reality","Blockchain visualization","Virtual reality only","3D real-time visualization"],"answer":[3],"explanation":"Lecture 49 (Factories and Assembly Line): Airbus - '3D real time visualization of the production process is possible'.","verified":"lecture","c":1547},{"q":"What technology does Amazon use to automate product search and retrieval in its warehouse?","options":["Automated conveyor belts","Robotic shelves","Augmented Reality devices","Autonomous forklifts"],"answer":[1],"explanation":"Lecture 49 (Factories and Assembly Line): Amazon robotic shelves.","verified":"lecture","c":1548},{"q":"What is the role of the sensing layer in IoT-enabled food supply chains?","options":["Data encryption","Monitoring food quality using sensors","Providing cloud analytics","Managing business operations"],"answer":[1],"explanation":"Lecture 50 (Food Industry): 'networked sensors for food quality monitoring along the supply chain'.","verified":"lecture","c":1549},{"q":"What is one major benefit of supply chain transparency in the food industry?","options":["Increased manual intervention","Reduced food wastage","Reduced sensor usage","Elimination of automation"],"answer":[1],"explanation":"Lecture 50 (Food Industry): impact - transparency of supply chain, 'minimize the wastage'.","verified":"lecture","c":1550},{"q":"What does the \"Flavor Matrix\" by Culinary Science Industries use to enhance dishes?","options":["Robot chefs","Augmented Reality menus","3D printed food","Machine learning and data analysis of food ingredients"],"answer":[3],"explanation":"Lecture 50 (Food Industry): Flavor Matrix 'uses ... machine learning and data analysis to enhance the flavor of dishes'.","verified":"lecture","c":1551}]},{"year":2026,"session":"Jan-Apr 2026","week":11,"source":"https://myquizprep.pages.dev/solutions/introduction-to-industry-4-0-and-industrial-internet-of-things-apr26/week11","questions":[{"q":"In the context of the IIoT Healthcare Architecture, which process immediately follows \"Sensing\"?","options":["Learning","Storing","Sending","Processing"],"answer":[2],"explanation":"L51 'IIoT Applications: Healthcare' slide 'IIoT Healthcare Architecture': Sensing -> Sending -> Processing -> Storing -> Learning.","verified":"lecture","c":1552},{"q":"State True or False: Asthma is a lifelong disease that can be completely cured using IIoT-based smart inhalers.","options":["True","False"],"answer":[1],"explanation":"L51 'IIoT Applications: Healthcare' slide: 'Asthma is lifelong disease, can be controlled, not cured.'","verified":"lecture","c":1553},{"q":"Which of the following is given as an example of a wireless ECG monitoring device?","options":["iHealth BP5","Dexcom","QardioCore","Kinsa smart thermometer"],"answer":[2],"explanation":"L51 'IIoT Applications: Healthcare' slide: 'QardioCore is an example of wireless ECG monitoring device.'","verified":"lecture","c":1554},{"q":"State True or False: In Advanced Metering Infrastructure (AMI), Broadband over PowerLine and Fixed radio frequency are used for communication networks.","options":["True","False"],"answer":[0],"explanation":"L52 'IIoT Applications: Power Plants': AMI 'communication network broadband over power line, fixed radio frequency'.","verified":"lecture","c":1555},{"q":"Which specific issue can IoT predict in the water sector besides tracking water pressure and water quality?","options":["Water freezing points","Exact rainwater volume","Water leakage","New underground water sources"],"answer":[2],"explanation":"L52 'IIoT Applications: Power Plants' slide (water sector): IoT sensors track water pressure, water quality; 'It also predicts the water leakage.'","verified":"lecture","c":1556},{"q":"How does a digital power plant reduce costs?","options":["By increasing manpower","By increasing fuel consumption","By using manual monitoring","By utilizing automated devices reducing the need for manpower and maintenance"],"answer":[3],"explanation":"L52 'IIoT Applications: Power Plants': digital power plant reduces cost via automated devices, reduced manpower, fuel and maintenance.","verified":"lecture","c":1557},{"q":"Which type of RFID tag relies on backscattering and has no internal power source?","options":["Active RFID","Passive RFID","Battery-Assisted Passive RFID","Hybrid RFID"],"answer":[1],"explanation":"L53 'Inventory Management & Quality Control': passive RFID tags 'do not require any internal power source ... work on the principle of backscattering'.","verified":"lecture","c":1558},{"q":"Which of the following is considered a primary function of Inventory Management?","options":["Increasing data scattering","Decoupling components of the production-distribution system","Broadcasting information signals","Creating additional noise"],"answer":[1],"explanation":"L53 'Inventory Management & Quality Control' functions of inventory management include 'decoupling components of the production distribution system'.","verified":"lecture","c":1559},{"q":"Fill in the blank. Quality Control is defined as a system of routine technical activities to measure and control the quality of the inventory as it is being ________.","options":["Developed","Transported to retail","Sold to the customer","Disposed of"],"answer":[0],"explanation":"L53 'Inventory Management & Quality Control' slide: QC is a 'system of routine technical activities, to measure and control the quality of the inventory as it is being developed'.","verified":"lecture","c":1560},{"q":"Fill in the blank. The Intrusion Triangle consists of Opportunity, Means, and ________.","options":["Integrity","Motive","Availability","Authentication"],"answer":[1],"explanation":"L54 'Plant Security and Safety' slide: Intrusion Triangle = Opportunity, Motive, Means.","verified":"lecture","c":1561},{"q":"Which Software Security concept is responsible for the verification of credentials entered locally or remotely?","options":["Integrity","Authentication","Availability","Network segmentation"],"answer":[1],"explanation":"L54 'Plant Security and Safety' slide 'Authentication': identification of user, verification of credentials entered (local or remote).","verified":"lecture","c":1562},{"q":"Which type of Network Security specifically scans for malware detection and prevention?","options":["Access control","Application security","Behavioral analytics","Antivirus/antimalware software"],"answer":[3],"explanation":"L54 'Plant Security and Safety' slide: 'Antivirus and antimalware software - Scan for malware detection and prevention'.","verified":"lecture","c":1563},{"q":"According to the Facilities Management Good Practice Guide, what does Facility Management manage on behalf of property owners?","options":["Factory assembly lines","Buildings, precincts, community infrastructure","Cloud computing servers","Retail supply chains"],"answer":[1],"explanation":"L55 'Facility Management' slide quoting Facilities Management Good Practice Guide: managing O&M of 'buildings, precincts and community infrastructure on behalf of property owners'.","verified":"lecture","c":1564},{"q":"State True or False: In the scope of IoT in Facility Management, implementing new technology includes Light Fidelity (Li-Fi) and data security.","options":["True","False"],"answer":[0],"explanation":"L55 'Facility Management' slide 'Scope of IoT': 'Implementing new technology like Li-Fi (Light Fidelity) and data security'.","verified":"lecture","c":1565},{"q":"Which support service focuses on researching potential customers?","options":["Administrative Support","Marketing","Business Development","Information Technology"],"answer":[1],"explanation":"L55 'Facility Management' slide 'Support Services (contd.)': 'Marketing - Research potential customers'; Business Development = overall growth of business.","verified":"lecture","c":1566}]},{"year":2026,"session":"Jan-Apr 2026","week":12,"source":"https://myquizprep.pages.dev/solutions/introduction-to-industry-4-0-and-industrial-internet-of-things-apr26/week12","questions":[{"q":"In the Oil and Gas Industry Work-flow, which step immediately precedes the data moving to a cloud-based analytics platform?","options":["Deploy IoT solutions","Apply predictive analytics","Data analysis by extraction, transform and load","Identify required maintenance"],"answer":[2],"explanation":"L56 'Oil, Chemical and Pharmaceutical Industry' workflow slide: ... Generate on-premises simulated data -> Data analysis by ETL -> Data moves to a cloud-based analytics platform.","verified":"lecture","c":1567},{"q":"State True or False: In the Machine Learning and Cloud Services work-flow, identifying specific data types occurs after analyzing and evaluating data.","options":["True","False"],"answer":[1],"explanation":"Corrected after checking the lecture (was: True). L56 'Oil, Chemical and Pharmaceutical Industry' slide 'Machine learning and cloud services': Examine current state architecture -> Identifies specific data types -> Find assumptions ... -> ML algorithm -> cloud platform -> Analyze and evaluate data. Data types are identified BEFORE analysis, so the statement is False.","verified":"lecture","c":1568},{"q":"In the Chemical Industry, what is a primary goal of Predictive Maintenance?","options":["Address real time issues","Track vehicle locations","Increase energy usage","Optimize medicine routing"],"answer":[0],"explanation":"L56 'Oil, Chemical and Pharmaceutical Industry' slide 'Predictive maintenance': 'Address real time issues'.","verified":"le er for all case studies is the reduction of ______ of workers.","options":["Mandatory work hours","Annual paid leaves","Technical training costs","Health hazards"],"answer":[3],"explanation":"L58 'Case Studies for Industry 4.0 & IIoT' slide 'Points to ponder': 'reduction of health hazards of workers'.","verified":"lecture","c":1580},{"q":"What do case studies explore and investigate through detailed analysis?","options":["Real-life phenomenon","Purely fictional events","Ancient historical myths","Unknown future predictions"],"answer":[0],"explanation":"L58 'Case Studies for Industry 4.0 & IIoT' slide: case studies 'explore and investigate real-life phenomenon'.","verified":"lecture","c":1581}]}]};
