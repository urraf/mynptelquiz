les across nodes for consistent, accessible and fault-tolerant storage; other options are negatives.","verified":"reasoning","c":565},{"q":"Suppose you write a program which uses an API to collect data continuously from LinkedIn and Facebook. You then wish to analyze such data. What type of big data source are you using?","options":["Internal data source","External data source","Complimentary data source","All of the above"],"answer":[1],"explanation":"Data pulled from third-party platforms (LinkedIn/Facebook APIs) is an external data source, not internal enterprise data.","verified":"reasoning","c":566}]},{"year":2024,"session":"Jan-Apr 2024","week":4,"source":"https://progiez.com/introduction-to-industry-4-and-industrial-iot-week-4","questions":[{"q":"What does Cybersecurity protect?","options":["Only physical infrastructure","Only software","Hardware, software, and data","Only company policies"],"answer":[2],"explanation":"L16: 'how to protect the hardware, how to protect the software and how to protect the data'.","verified":"lecture","c":567},{"q":"What is the focus of Network Security?","options":["Only securing physical buildings","Protecting network architecture from unauthorized access and improper use","Protecting only the company CEO’s information","Solely focused on securing paper documents"],"answer":[1],"explanation":"L16: network security protects the network architecture from unauthorized access and improper use.","verified":"lecture","c":568},{"q":"What does the CIA Triad in Cybersecurity stand for?","options":["Confidentiality, Integrity, Availability","Costing, Integrity, Assets","Company, Internet, Availability","Communication, Information, Assessment"],"answer":[0],"explanation":"L16: 'C stands for confidentiality, I stands for integrity and A stands for availability'.","verified":"lecture","c":569},{"q":"What are the key differences between IIoT and traditional Automation?","options":["No significant differences","Ubiquitous sensing, advanced analytics, IT tools, and methodologies","Only in terms of cost","Limited to the type of machinery used"],"answer":[1],"explanation":"L17: differences with respect to ubiquitous sensing, advanced analytics, and IT tools and methodologies.","verified":"lecture","c":570,"rel":[["Jan-Apr 2023",4,0]]},{"q":"What are the benefits of deploying sensors and actuators in IIoT?","options":["Limited to academic purposes","To sell more software","To control, enhance, and optimize various functions","To reduce operational efficiency"],"answer":[2],"explanation":"L17: 'in IIoT sensors and actuators have been also used everywhere to control, enhance, and optimize various functions'.","verified":"lecture","c":571},{"q":"How does IIoT benefit the mining industry?","options":["By relaxing safety standards","Increasing disaster risks","Early disaster warning","Ignoring carbon footprint metrics"],"answer":[2],"explanation":"L17: IIoT in mining benefits 'in terms of having early disaster warning'.","verified":"lecture","c":572},{"q":"What is the Third Wave in GE’s industrial level innovation?","options":["The Industrial Intranet","The Digital Revolution","The Industrial Revolution","The Industrial Internet"],"answer":[3],"explanation":"L18: 'the third wave ... is this industrial internet'.","verified":"lecture","c":573,"rel":[["Jul-Oct 2024",4,0],["Jul-Oct 2026",4,0]]},{"q":"Scarcity of non-renewable sources of energy pose a significant challenge with respect to energy consumption for the future smart industries and industrial internet?","options":["True","False"],"answer":[0],"explanation":"Not in the W4 transcripts (L7 discusses finite non-renewable energy). Scarcity of non-renewable energy is a recognized challenge for future smart industries, so True.","verified":"reasoning","c":574},{"q":"What was the negative effect of the Industrial Revolution?","options":["Increased life expectancy","Environmental pollution","Rise in literacy","Technological advancement"],"answer":[1],"explanation":"L18: industrial revolution 'increased the amount of waste products ... adverse effects on the environment'.","verified":"lecture","c":575},{"q":"Which of the following is not one of the three key elements of the Industrial Internet?","options":["Intelligent machines","Advanced analytics","People at work","Social Networking"],"answer":[3],"explanation":"L18: three key elements are 'intelligent machines ... advanced analytics, and ... people at work'.","verified":"lecture","c":576,"rel":[["Jul-Oct 2022",4,0],["Jul-Oct 2024",4,0],["Jan-Apr 2025",4,0],["Jul-Oct 2025",4,0]]},{"q":"How is a smart sensor defined according to IEEE 1451 standard?","options":["Sensor with large storage capacity","Sensor with standardized physical connection for communication","Sensor that operates independently","Sensor without the need for a power supply"],"answer":[1],"explanation":"L19: smart sensors have 'small memory and standardized physical connection ... as per the IEEE 1451 standard'.","verified":"lecture","c":577},{"q":"What is the purpose of the MRAA library in Intel IoT devices?","options":["High-level gaming interface","Large data analysis","Cloud storage management","Low-level communication in GNU/Linux platform"],"answer":[3],"explanation":"L19: 'MRAA component which is a low-level skeleton library for communication in the GNU Linux platform'.","verified":"lecture","c":578},{"q":"What is a key aspect of the design philosophy for IIoT in industrial processes?","options":["Facilitating communication between heterogeneous objects","Prioritizing manual control over automated systems","Limiting data interoperability","Reducing smart object autonomy"],"answer":[0],"explanation":"L20 Industrial Processes Part 1: 'Interoperability is about facilitating communication between heterogeneous objects'.","verified":"lecture","c":579},{"q":"What is a feature of the Autonomous Pull Economy in Industrial Process 4.0?","options":["High waste generation","Manual data processing","Limited resource optimization","End-to-end automation facility"],"answer":[3],"explanation":"L20: autonomous pull economy benefits are 'end-to-end automation facility, updated demand information, low waste generation'.","verified":"lecture","c":580,"rel":[["Jan-Apr 2025",4,0]]},{"q":"Considering the future architecture of the smart Industrial plant, which among the following layers is responsible for autonomous decision making, machine learning and decision support system?","options":["Connection Layer","Conversion Layer","Cyber Layer","Cognition Layer"],"answer":[3],"explanation":"L20: in the futuristic plant's 5C layers, 'the cognitive layer ... systems for optimized decision making', which best fits decision support and autonomous decisions.","verified":"lecture","c":581}]},{"year":2024,"session":"Jan-Apr 2024","week":5,"source":"https://progiez.com/introduction-to-industry-4-and-industrial-iot-week-5","questions":[{"q":"What is a key technology driver in Amazon’s Smart Warehousing?","options":["Warehouse Automation","Drone Delivery","Cryptocurrency Payments","3D Printing"],"answer":[0],"explanation":"Lecture 21 (Industrial Processes - Part 2): Amazon smart warehousing tech-drivers are 'warehouse automation and the human-machine interaction'.","verified":"lecture","c":582},{"q":"Which of the following is not covered under the domain of Industry 4.0?","options":["Intelligent manufacturing","Smart warehousing","Smart logistics","Rapid deforestation"],"answer":[3],"explanation":"Lecture 21 (Industrial Processes - Part 2): Industry 4.0 sectors listed: smart robotics, intelligent manufacturing, smart warehousing, smart logistics, etc.; deforestation is not one.","verified":"lecture","c":583},{"q":"Which of the following IIoT platforms is used by Hitachi?","options":["UnifyTwin","Lumada","Insights Hub","RootCloud"],"answer":[1],"explanation":"Lecture 21 (Industrial Processes - Part 2): Hitachi 'have the Lumada IoT platform'.","verified":"lecture","c":584},{"q":"Which of the following is not a type of business model for IoT?","options":["Subscription Model","Outcome-Based Model","Asset-Sharing Model","Loss-Sharing Model"],"answer":[3],"explanation":"Lecture 22 (Business Models - Part 1): IoT business models are subscription, outcome-based, asset-sharing and IoT-as-a-service; no loss-sharing model.","verified":"lecture","c":585},{"q":"Which is an advantage of the Subscription Model in IoT?","options":["Predictable recurring revenue","High initial costs","Limited customer interaction","Single revenue stream"],"answer":[0],"explanation":"Lecture 22 (Business Models - Part 1): subscription model advantage - 'it is a predictable kind of model' generating recurring revenue.","verified":"lecture","c":586},{"q":"Which is a critical challenge of the IoT-as-a-Service model?","options":["Limited product applicability","Over-dependence on manual processes","Security of data","Reduced licensing costs"],"answer":[2],"explanation":"Lecture 22 (Business Models - Part 1): IoT-as-a-Service challenges: 'product compatibility, maintaining data accuracy, security of data'.","verified":"lecture","c":587},{"q":"Which of the following is NOT offered by a Service-Oriented IIoT Business Model?","options":["CapEx-focused investment strategies","Aggregation and analysis of data","On-demand services backed by cloud-based Business Models","Self-service interface"],"answer":[0],"explanation":"Lecture 23 (Business Models - Part 2): service-oriented model offers data utilization/aggregation/analysis, on-demand cloud-based services and self-service interfaces; CapEx investment is not mentioned.","verified":"lecture","c":588},{"q":"Process Oriented Business Model is a __________ business model?","options":["Static","Actuating","Hybrid","Defunct"],"answer":[2],"explanation":"Lecture 23 (Business Models - Part 2) stresses that cloud-based, service-oriented and process-oriented models are interlinked (process-oriented uses data from the others); 'Hybrid' is the only fitting option.","verified":"reasoning","c":589},{"q":"What is IIRA?","options":["A standard architecture for IIoT Systems","A scheme for corporate tax rebate","A package for installing IIoT Software","An internship program for IoT enthusiasts"],"answer":[0],"explanation":"Lecture 24 (Reference Architecture - Part 1): IIRA is 'sort of a standard architecture that IIoT systems globally tend to use'.","verified":"lecture","c":590},{"q":"Which of the following statements is incorrect about IIRA?","options":["Safety is not a concern in the IIRA infrastructure,","The IIRA infrastructure allows interoperability","The IIRA infrastructure is proposed by the IIC Technology Working Group","The IIRA infrastructure maps application technologies"],"answer":[0],"explanation":"Lecture 24 (Reference Architecture - Part 1): 'for the IIRA one of the central thematic concerns is the safety' - so the 'safety is not a concern' statement is the incorrect one.","verified":"lecture","c":591},{"q":"Which of the following is not a component of the three-tier architecture pattern of IIRA?","options":["Edge layer","Fog layer","Platform layer","Enterprise layer"],"answer":[1],"explanation":"Lecture 24 (Reference Architecture - Part 1): three-tier pattern has 'the edge layer, the platform layer and the enterprise layer'; no fog layer.","verified":"lecture","c":592},{"q":"What are the IIRA Viewpoints?","options":["Mining, Smelting, Forging and Casting","User, Demand, Production and Supply","Analysis, Management, Manipulation and Modification","Business, Usage, Functional and Implementation"],"answer":[3],"explanation":"Lecture 25 (Reference Architecture - Part 2): viewpoints are business, usage, functional and implementation.","verified":"lecture","c":593},{"q":"The elements of an activity in IIRA are ___________.","options":["Controls, Events, Feedback, and Termination","Cause and Effect","Trigger, Workflow, Effect, and Constraints","Planning, Projection, Execution, and Feedback"],"answer":[2],"explanation":"Lecture 25 (Reference Architecture - Part 2): 'The elements of an activity are trigger, workflow, effects and constraints'.","verified":"lecture","c":594},{"q":"In the Business Viewpoint of IIRA, what are fundamental capabilities?","options":["High-level specifications essential for business tasks","Detailed technical standards","Financial goals","Marketing strategies"],"answer":[0],"explanation":"Lecture 25 (Reference Architecture - Part 2): 'Fundamental capabilities are high level specifications, which are essential to complete business tasks'.","verified":"lecture","c":595},{"q":"With respect to the IIRA functional domain, industrial actuation falls under which of the following domains?","options":["Operations Domain","Business Domain","Control Domain","Application Domain"],"answer":[2],"explanation":"Lecture 25 (Reference Architecture - Part 2): control domain functions include sensing, 'actuation writing data and controlling signals into an actuator' and communication.","verified":"lecture","c":596}]},{"year":2024,"session":"Jan-Apr 2024","week":6,"source":"https://progiez.com/introduction-to-industry-4-and-industrial-iot-week-6","questions":[{"q":"Which of the following temperature sensors generates an analog voltage proportional to the temperature?","options":["DS1621","DHT11","DS18B20","LM 35"],"answer":[3],"explanation":"Lecture 26 (Key Enablers: Sensing - Part 1): LM35 is an analog sensor whose output voltage is proportional to Celsius temperature.","verified":"lecture","c":597},{"q":"What are the key components of an IoT Sensing Device?","options":["Sensor, Processor, Wireless Communication Module, Power Management Unit","Battery, Processor, Universal Serial Bus, Visual Display Unit","Sensor, Compiler, Interpreter, Energy Harvester","None of the above"],"answer":[0],"explanation":"Lecture 26 (Key Enablers: Sensing - Part 1): IoT sensing device = sensor, processor, power management unit, wireless communication module.","verified":"lecture","c":598},{"q":"What kind of sensor is ADXL335?","options":["Accelerometer","Gyroscope","Magnetometer","Proximity sensor"],"answer":[0],"explanation":"Lecture 26 (Key Enablers: Sensing - Part 1): 'ADXL335 accelerometer sensor'.","verified":"lecture","c":599},{"q":"“MOS gas sensor depend on the thermal energy for its operation which is supplied with a heater.” State True or False.","options":["True","False"],"answer":[0],"explanation":"Lecture 27 (Key Enablers: Sensing - Part 2): chemi-resistive gas sensors 'depend on the thermal energy for its operation which is basically supplied through some heater'.","verified":"lecture","c":600},{"q":"Which of the following is not a probable application of Gas Sensors?","options":["Air quality monitoring","Leakage Detection of Toxic gases","Alcohol Breath Test","Motion Tracking"],"answer":[3],"explanation":"Lecture 27 (Key Enablers: Sensing - Part 2): applications: air-quality monitoring, toxic gas leakage detection, automotive exhaust, alcohol breath test; not motion tracking.","verified":"lecture","c":601},{"q":"What is meant by the Sensitivity of a Gas Sensor?","options":["Change in the output signal for a unit change in gas concentration","Ability to detect a particular gas in a mixture of different gases","Ability to provide consistent output over a long period of time","The time taken by the sensor to stabilize its response"],"answer":[0],"explanation":"Lecture 27 (Key Enablers: Sensing - Part 2): sensitivity is 'the change in the output signal, with respect to the unit change in the input' (gas concentration).","verified":"lecture","c":602},{"q":"The ModBus-TCP protocol defines two units in the data frame. One of them is Protocol Data Unit. What is the other one?","options":["Analogous Data Unit","Advanced Data Unit","Application Data Unit","Architectural Data Unit"],"answer":[2],"explanation":"Lecture 28 (Connectivity - Part 1): 'the protocol defines two units in the data frame; one is ... the application data unit, the other ... the protocol data unit'.","verified":"lecture","c":603},{"q":"With respect to sensors, a camera which can simultaneously sense the ambient temperature as well as capture live video recordings is a type of ________ sensor.","options":["Scalar","Multimedia","Hybrid","All of the above"],"answer":[2],"explanation":"Sensor that senses both scalar (temperature) and multimedia (video) data is a hybrid sensor (scalar/multimedia/hybrid classification from Misra's IoT material).","verified":"reasoning","c":604},{"q":"EtherNet/IP defines two primary types of communications. What are those?","options":["Explicit and Implicit","Internal and External","Inbound and Outbound","Telemetric and Geometric"],"answer":[0],"explanation":"Lecture 28 (Connectivity - Part 1): 'in EtherNet/IP there are two types of communications; explicit and implicit'.","verified":"lecture","c":605},{"q":"Which of the following statements is incorrect about Profinet?","options":["Profinet is the standard for industrial Ethernet","Profinet is based upon Ethernet/IP","Profinet can not be used for process control or process measurement","Profinet uses NRT, RT and IRT communication channels"],"answer":[2],"explanation":"Lecture 28 (Connectivity - Part 1): Profinet 'is used for process control, process measurement', so the 'cannot be used' statement is incorrect.","verified":"lecture","c":606},{"q":"Modbus-RTU is a serial protocol that follows the ________ architecture.","options":["Producer/Consumer","Master/Slave","Scalar/Vector","None of the above"],"answer":[1],"explanation":"Lecture 28 (Connectivity - Part 1): Modbus RTU 'provides the serial communication between the master/slave'.","verified":"lecture","c":607},{"q":"Which of the following network topologies is used by Profibus?","options":["Ring Topology","Bus Topology","Mesh Topology","Star Topology"],"answer":[1],"explanation":"Lecture 29 (Connectivity - Part 2): 'the bus topology is very popular in Profibus'.","verified":"lecture","c":608},{"q":"In the context of DeviceNet, CAN is the acronym for ___________.","options":["Cognitive Adaptable Network","Campus Area Network","Controller Area Network","Captive Area Network"],"answer":[2],"explanation":"Lecture 29 (Connectivity - Part 2): DeviceNet 'is based on the standard controller area network protocols'.","verified":"lecture","c":609},{"q":"How shorter TTL is achieved in uRLLC?","options":["By using smaller slot length","By reducing Orthogonal Frequency Division Multiplexing symbols in TTL","Reducing symbol duration","All of the above"],"answer":[3],"explanation":"Lecture 30 (Connectivity - Part 3): shorter TTI via 'smaller slot lengths ... reducing the orthogonal frequency division multiplexing symbols, reducing symbol duration'.","verified":"lecture","c":610},{"q":"What is the frequency spectrum of mmWave Communication?","options":["30-300 MHz","550-1720 KHz","88-108 MHz","30-300 GHz"],"answer":[3],"explanation":"Lecture 30 (Connectivity - Part 3): mmWave communication is in 'the spectrum 30 to 300 Giga hertz band'.","verified":"lecture","c":611,"rel":[["Jan-Apr 2023",6,1],["Jul-Oct 2023",6,0]]}]},{"year":2024,"session":"Jan-Apr 2024","week":7,"source":"https://progiez.com/introduction-to-industry-4-and-industrial-iot-week-7","questions":[{"q":"Which of the following stands for LP in LPWAN?","options":["Large Power","Light Power","Low Power","Long Range"],"answer":[2],"explanation":"'low power wide area network ... LPWAN' (Lecture 31: Key Enablers of IIoT: Connectivity – Part 4 (LoRa/SIGFOX + NodeMCU demo)).","verified":"lecture","c":612},{"q":"“We need to pay a license fee to use LoRa in the 868 MHz radio frequency band in Europe.” State True or False.","options":["True","False"],"answer":[1],"explanation":"'LoRa operates in the license free sub gigahertz radio frequency band' incl. 868 MHz (Lecture 31: Key Enablers of IIoT: Connectivity – Part 4 (LoRa/SIGFOX + NodeMCU demo)).","verified":"lecture","c":613},{"q":"Which of the following is true about the SIGFOX network in terms of messages and payload?","options":["Up to 50 messages per day with a payload of 8 bytes per message","Up to 75 messages per day with a payload of 10 bytes per message","Up to 140 messages per day with a payload of 12 bytes per message","Up to 200 messages per day with a payload of 15 bytes per message"],"answer":[2],"explanation":"'up to 140 messages per day, with a payload of 12 bytes per message' (Lecture 31: Key Enablers of IIoT: Connectivity – Part 4 (LoRa/SIGFOX + NodeMCU demo)).","verified":"lecture","c":614},{"q":"Which library (header file) is used for interfacing the DHT22 sensor as demonstrated in the Hands On Industrial Environment Monitoring project?","options":["DHT.h","DHT22.h","DHT11.h","Adafruit_DHT.h"],"answer":[0],"explanation":"Demo uses the Adafruit DHT library for DHT22 (Lecture 31: Key Enablers of IIoT: Connectivity – Part 4 (LoRa/SIGFOX + NodeMCU demo)); that library's header is DHT.h (DHT22.h/DHT11.h/Adafruit_DHT.h are not its header).","verified":"reasoning","c":615},{"q":"Which of the following topologies are supported by Zigbee?","options":["Point-to-Point and Star","Bus and Ring","Tree, and Mesh","Ring and Mesh"],"answer":[2],"explanation":"'different topologies that are supported by ZigBee, star topology, tree topology, and mesh topology' (Lecture 32: Key Enablers of IIoT: Connectivity – Part 5 (Zigbee/Xbee demo)); the 'Bus' answer in the 2025 copy is wrong.","verified":"lecture","c":927,"rel":[["Jan-Apr 2025",7,1],["Jan-Apr 2026",7,0]]},{"q":"The physical and MAC layers of the Zigbee communication protocol is based on _______. Fill in the blanks.","options":["IEEE 802.11","IEEE 802.15.4","IEEE 802.3","IEEE 802.16"],"answer":[1],"explanation":"Zigbee follows IEEE 802.15.4 (Lecture 32: Key Enablers of IIoT: Connectivity – Part 5 (Zigbee/Xbee demo)).","verified":"lecture","c":617},{"q":"“Xbee is a mesh communication protocol based on the IEEE 802.15.4 whereas Zigbee is the product that uses the Xbee communication protocol for radio communication.” State true or false.","options":["True","False"],"answer":[1],"explanation":"Reversed: 'ZigBee protocol is a mesh communication protocol based on IEEE 802.15.4 ... Xbee is a product from the company Digi' (Lecture 32: Key Enablers of IIoT: Connectivity – Part 5 (Zigbee/Xbee demo)).","verified":"lecture","c":618},{"q":"Which of the following functions is performed by the coordinator node in a Zigbee network?","options":["Data relay","End device connector","Acts as the root of the network and bridge between different networks","Control plane"],"answer":[2],"explanation":"Coordinator 'is the root of the network and it acts as the bridge between these different networks' (Lecture 32: Key Enablers of IIoT: Connectivity – Part 5 (Zigbee/Xbee demo)).","verified":"lecture","c":619},{"q":"Which of the following is/are the data characteristics of IIoT processing?","options":["Polymorphism","Temporal relationships in data","Correlation in space, time, and other dimensions","All of the above"],"answer":[3],"explanation":"Polymorphism, temporal/causal relationships and correlation in space/time are all listed data characteristics (Lecture 33: Key Enablers of IIoT: Processing – Part 1).","verified":"lecture","c":620,"rel":[["Jan-Apr 2023",7,0]]},{"q":"Which of the following is false about the rule-based engine?","options":["Extract causal and temporal patterns using predefined rules","Handles multiple data streams and correlates them to provide meaningful output","Cannot process data in near real-time","Performs decision-making processes based on predefined rules"],"answer":[2],"explanation":"Lecture stresses CEP must 'process the data in real near real-time' (Lecture 33: Key Enablers of IIoT: Processing – Part 1), so 'cannot process data in near real-time' is the false one.","verified":"lecture","c":934,"rel":[["Jul-Oct 2022",7,0],["Jan-Apr 2025",7,1]]},{"q":"Which of the following represents the limitation of current CEP systems?","options":["Manual threshold specification","Run-time update of threshold not possible","Not context-aware","All of the above"],"answer":[3],"explanation":"Limitations of traditional CEP: 'manual thresholding ... specified beforehand manually' and 'not context aware'; micro-CEP adaptively updates thresholds (Lecture 33: Key Enablers of IIoT: Processing – Part 1).","verified":"lecture","c":622},{"q":"Which of the following options is false about the services rendered by the Smart Water Management System?","options":["Entirely non-replicable services","Fully customizable services","Application-specific services","Entirely replicable services"],"answer":[0],"explanation":"SWAMP offers 'replicable services ..., customizable service ..., application specific services' (Lecture 34: Key Enablers of IIoT: Processing – Part 2); non-replicable is false.","verified":"lecture","c":623},{"q":"“iRobot-Factory is a cognitive manufacturing factory which applies cognitive intelligence and edge computing for improved manufacturing.” State true or false.","options":["True","False"],"answer":[0],"explanation":"iRobot-Factory is about 'cognitive manufacturing' with components incl. 'edge computing node' and cloud cognitive engine (Lecture 34: Key Enablers of IIoT: Processing – Part 2).","verified":"lecture","c":624},{"q":"Which of the following is false about the design of the SmartSantander?","options":["Heterogeneity","Reliability","Mobility","Unrealistic experimentation"],"answer":[3],"explanation":"SmartSantander design considerations: 'experimentation realism, heterogeneity, scale, mobility, reliability, user involvement' (Lecture 34: Key Enablers of IIoT: Processing – Part 2).","verified":"lecture","c":625},{"q":"Which of the following represents a type of Industrial Control System?","options":["Programmable Logic Compiler","Decentralized Control Suite","Supervisory Control and Data Acquisition","Distributed Compiled System"],"answer":[2],"explanation":"ICS types: PLC, DCS and SCADA (Lecture 35: Key Enablers of IIoT: Process Control).","verified":"lecture","c":626}]},{"year":2024,"session":"Jan-Apr 2024","week":8,"source":"https://progiez.com/introduction-to-industry-4-and-industrial-iot-week-8","questions":[{"q":"Which of the following does not characterize big data analytics?","options":["Volume","Velocity","Vector","Variability"],"answer":[2],"explanation":"Big data attributes: volume, velocity, variability, veracity, variety (Lecture 36: IIoT Analytics and Data Management: Introduction).","verified":"lecture","c":627},{"q":"Which of the following algorithms is useful when it is feasible to acquire training data for the different states (or classes) that need to be modeled?","options":["Unsupervised learning algorithm","Supervised learning algorithm","Reinforcement learning algorithm","None of the above"],"answer":[1],"explanation":"'supervised learning basically uses training data' (Lecture 36: IIoT Analytics and Data Management: Introduction).","verified":"lecture","c":628},{"q":"Which of the following is false about the deep learning models?","options":["Learns features automatically without manually specifying them","Does not use neural networks","Raw data from sensors can be directly fed into the model","Generally require a large amount of computation power"],"answer":[1],"explanation":"'most of these deep learning methods are based on traditional neural networks' (Lecture 36: IIoT Analytics and Data Management: Introduction).","verified":"lecture","c":629},{"q":"Which of the following software may be used for batch-oriented analytics?","options":["Apache Hadoop and Apache Spark","Eclipse","Sublime","None of the above"],"answer":[0],"explanation":"'software such as Apache Hadoop, Apache Spark etc. may be used' for batch/distributed analytics (Lecture 36: IIoT Analytics and Data Management: Introduction).","verified":"lecture","c":630,"rel":[["Jan-Apr 2025",8,0]]},{"q":"Which of the following is an example of a classification algorithm?","options":["Density-Based Spatial Clustering of Applications with Noise","Support Vector Machine","K-Means","Bayes Regression"],"answer":[1],"explanation":"'for classification SVM or Support Vector Machines' (Lecture 36: IIoT Analytics and Data Management: Introduction).","verified":"lecture","c":631,"rel":[["Jul-Oct 2023",8,0]]},{"q":"In ________ data points may belong to more than one cluster. Fill in the blanks.","options":["Hard Clustering","Soft Clustering","Hard Classification","Soft Classification"],"answer":[1],"explanation":"'Soft clustering ... certain points may belong to two or more clusters' (Lecture 37: Machine Learning and Data Science – Part 1).","verified":"lecture","c":632},{"q":"Which of the following supervised learning algorithms may be used when the output variable is a real number instead of a categorical value?","options":["Regression","Classification","Both (a) and (b)","Neither (a) nor (b)"],"answer":[0],"explanation":"'regression is when the output variable is a real number' (Lecture 37: Machine Learning and Data Science – Part 1).","verified":"lecture","c":633},{"q":"Which of the following statements about the reinforcement learning algorithm is false?","options":["There is no external supervisor to guide the agent","Builds a knowledge graph from the constant feedback of the corresponding actions","There is no reward function","There is a mapping between input and output"],"answer":[2],"explanation":"RL has 'a reward-penalty structure'; it has no external supervisor, builds a knowledge graph from feedback, and has an input-output mapping (Lecture 37: Machine Learning and Data Science – Part 1).","verified":"lecture","c":810,"rel":[["Jul-Oct 2024",8,1]]},{"q":"“Machine learning is a subset of deep learning that can learn automatically by finding the features of the object on its own.” State true or false.","options":["True","False"],"answer":[1],"explanation":"'deep learning is a subset of machine learning. And machine learning itself is a subset of artificial intelligence' (Lecture 38: Machine Learning and Data Science – Part 2).","verified":"lecture","c":635,"rel":[["Jul-Oct 2024",8,0]]},{"q":"Why is cloud computing necessary for IIoT?","options":["High computational speed for data monitoring and analytics","Scalable and secure services","Effective data acquisition","All of the above"],"answer":[3],"explanation":"Need for cloud: high computational speed, storage, scalable/secure services, and data acquisition 'can be made much more efficient' (Lecture 39: Cloud Computing in IIoT – Part 1).","verified":"lecture","c":636},{"q":"Which of the following is not true about Platform-as-a-service for IIoT?","options":["Allows industries to self-develop applications","Clients have control over the application and the configuration environment","The service provider manages everything","Software firms like Cumulocity, Bosch IoT, and Carriots offer PaaS for IoT industries"],"answer":[2],"explanation":"PaaS: 'the clients over here have control over the applications and the configuration environment' (Lecture 39: Cloud Computing in IIoT – Part 1).","verified":"lecture","c":637},{"q":"Who among the following does not provide Industrial Cloud Platform?","options":["C3 IoT","Uptake","Netbeans","GE Predix"],"answer":[2],"explanation":"Industrial cloud providers named: ThingWorx, Cumulocity, Uptake, C3 IoT, Meshify, GE Predix, etc. (Lecture 39: Cloud Computing in IIoT – Part 1); Netbeans is an IDE.","verified":"lecture","c":638},{"q":"Which of the following is/are the advantage(s) of using a Cloud simulator before real deployment?","options":["Pre-deployment test before real implementation","System testing at no cost","Repeatable evaluation of the system","All of the above"],"answer":[3],"explanation":"Not in the original lectures; a cloud simulator gives cost-free, repeatable pre-deployment testing, so all options apply.","verified":"reasoning","c":639},{"q":"Which of the following does not represent the objective of Industry 4.0?","options":["Rigid solutions","Expanded security","Better performance","Higher production"],"answer":[0],"explanation":"Industry 4.0 objectives: robust solutions, higher production, improved customer satisfaction, expanded security, improved performance (Lecture 40: Cloud Computing in IIoT – Part 2).","verified":"lecture","c":640},{"q":"“K-medoid is a clustering algorithm that is used to maximize the distance between some randomly selected points in a cluster.” State true or false.","options":["True","False"],"answer":[1],"explanation":"Not in the original lectures; K-medoids minimizes the dissimilarity between points and the cluster medoid, it does not maximize distances.","verified":"reasoning","c":641}]},{"year":2024,"session":"Jan-Apr 2024","week":9,"source":"https://www.beubihar.org.in/2024/03/r-nptel-introduction-to-industry-40-and.html","questions":[{"q":"Which of the following is not a valid reason for employing fog computing in IIoT?","options":["Consistent release of data from sensors and machines","Need for immediate action and quick response","Devaluing existing functionalities of IIoT","Data may be critical as well as time-sensitive"],"answer":[2],"explanation":"Lecture 41 (Fog Computing in IIoT) lists continuous high-speed data, need for immediate action/quick response, critical & time-sensitive data, and enabling/enriching functionalities as reasons; 'devaluing' functionalities is the opposite.","verified":"lecture","c":642},{"q":"Which of the following statements is false about the fog-enabled IIoT for Smart Grid and Power Industry?","options":["Dynamic demand of appliances","Unidirectional communication between the consumer and supplier","Power supply is provided from micro-grids, local distribution companies","Advanced metering infrastructure for bi-directional communication"],"answer":[1],"explanation":"Lecture 41 (Fog Computing in IIoT): smart grid uses dynamic demand scheduling of appliances; smart grid/AMI communication is bidirectional, so 'unidirectional communication' is false.","verified":"lecture","c":643},{"q":"Nebbiolo Technologies, who is one of the pioneers of Fog Computing, brought together IT and OT for real-time services and rendered optimized solutions with smarter decision-making capability in lower cost. Which of the following products is not produced by Nebbiolo Technologies?","options":["fogOS","fogNode","fogSM","fogBCD"],"answer":[3],"explanation":"Lecture 41 (Fog Computing in IIoT): Nebbiolo 'have different products, Fog OS, FogNode, FogSM'. No fogBCD.","verified":"lecture","c":644},{"q":"SONM is a Decentralized Fog Computing Platform that renders distributed cloud services with fog as the backend. Which of the following facilities is not supported by SONM?","options":["Blockchain infrastructure","Video streaming","Machine learning","Digital triplet"],"answer":[3],"explanation":"Lecture 41 (Fog Computing in IIoT): SONM/'Swim' components support 'blockchain infrastructure, video streaming, machine learning, video rendering'; no digital triplet.","verified":"lecture","c":645},{"q":"“In R Programming, it is compulsory to specify the datatype at the time of variable declaration.” State true or false.","options":["True","False"],"answer":[1],"explanation":"Lecture 42 (Tutorial for R & Julia): variables are simply assigned (a = 20, x = 'hello', y = TRUE) with no type declaration.","verified":"lecture","c":646},{"q":"Which of the following can be used to calculate a^b (a raised to the power b) in R programming?","options":["a+b","a/b","a^b","a@b"],"answer":[2],"explanation":"Lecture 42 (Tutorial for R & Julia): 'this cap is basically for power'.","verified":"lecture","c":647},{"q":"Which of the following operands is used to create a series of numbers for a vector in R programming?","options":["<=","#",":","!"],"answer":[2],"explanation":"Lecture 42 (Tutorial for R & Julia): special operators - ': basically creates a series of numbers for a vector'.","verified":"lecture","c":648},{"q":"Which of the following is/are supported by the Julia programming language?","options":["Tuples","Dictionary","Arrays","All of the above"],"answer":[3],"explanation":"Lecture 42 (Tutorial for R & Julia): Julia data structures shown are tuples, dictionaries (Dict) and arrays.","verified":"lecture","c":649},{"q":"Which of the following represents the essential characteristics of cloud computing according to NIST?","options":["On-demand self-service","Resource pooling","Broad network access","All of the above"],"answer":[3],"explanation":"Lecture 43 (Data Management with Hadoop)/Lecture 39 (Cloud Computing in IIoT Part 1): cloud characteristics 'on demand self service, broad network access, resource pooling, rapid elasticity, measured service'.","verified":"lecture","c":650,"rel":[["Jul-Oct 2022",9,0],["Jul-Oct 2025",9,0]]},{"q":"Why is it necessary to perform integration which is a part of data pre-processing in the context of Data management?","options":["Mitigating redundancy","Combining data from various sources","Cleaning incomplete data","Identifying inaccurate data"],"answer":[1],"explanation":"Lecture 43 (Data Management with Hadoop): 'Integration talks about combination of data arriving from different sources and providing users with unified integrated view'.","verified":"lecture","c":651},{"q":"“There are three main NoSQL databases. They are Key-value databases, column-oriented databases, and document-oriented databases.” State true or false.","options":["True","False"],"answer":[0],"explanation":"Lecture 43 (Data Management with Hadoop): 'NoSQL databases ... key value database, column oriented database and document oriented database'.","verified":"lecture","c":652},{"q":"“In Hadoop Master/Slave Architecture, the master serves read and write requests from the file system’s clients whereas slave executes operations like opening, closing, and renaming files and directories.” State true or false.","options":["True","False"],"answer":[1],"explanation":"Lecture 43 (Data Management with Hadoop): 'the master executes the operations like opening, closing, renaming files... Slaves ... read write request from the file system's clients' - roles reversed in statement, so False.","verified":"lecture","c":653},{"q":"Which of the following is false about the Cube topology of the data center network?","options":["Follow switch-oriented practice, rather than the server-centric approach","Provides multiple parallel short paths between any pair of server","Places intelligence on modular data center (MDC) servers","Forms multiple edge-disjoint server spanning tree"],"answer":[0],"explanation":"Corrected after checking the lecture (was: Places intelligence on modular data center (MDC) servers). Lecture 44 (Data Center Networks): BCube 'is a server centric approach rather than a switch centric practice', places intelligence on MDC servers, multiple parallel short paths, edge-disjoint spanning trees. So the false one is 'switch-oriented practice'.","verified":"lecture","c":654,"rel":[["Jan-Apr 2025",9,0]]},{"q":"Which of the following protocols is used by the SDN?","options":["OpenByte","OpenFlow","WideFlow","ClosedByte"],"answer":[1],"explanation":"Lecture 45 (SDN in IIoT Part 1): 'a very popular protocol which is known as the open flow protocol ... specifically designed' for SDN.","verified":"lecture","c":655},{"q":"Which of the following is incorrect about Software-defined networks (SDN)?","options":["SDN increases the complexity of traditional networks by separating the control and data planes","SDN and NFV are separate paradigms","SDN provides a centralized view of the whole network which improves controllability, efficiency, and network stability","SDN can provide seamless transition of data routes, self-organization, configuration optimization, and smart transmissions"],"answer":[0],"explanation":"Lecture 45 (SDN in IIoT Part 1): SDN decouples control and data planes to improve/simplify network management, not to increase complexity.","verified":"lecture","c":656}]},{"year":2024,"session":"Jan-Apr 2024","week":10,"source":"https://progiez.com/nptel-introduction-to-industry-4-assignment-10-answers","questions":[{"q":"Which of the following is not a part of the SDIIoT Architecture?","options":["WSN","Private network","Industrial cloud","Industrial bus and network"],"answer":[1],"explanation":"Lecture 46 (SDN in IIoT Part 2): SDIIoT covers sensor networks, public networks, industrial cloud, industrial bus networks - not private network.","verified":"lecture","c":657,"rel":[["Jan-Apr 2025",10,0]]},{"q":"Which of the following is not a part of the SDWSN platform in the context of Industry 4.0?","options":["Applications","Data plane","Control plane","Terrestrial plane"],"answer":[3],"explanation":"Lecture 46 (SDN in IIoT Part 2): SD sensor network has data plane, control plane and applications.","verified":"lecture","c":658},{"q":"Data processing is generally performed in ________ present in the SDIIoT architecture?","options":["LAN","Public network","Industrial cloud","None of the above"],"answer":[2],"explanation":"Lecture 46 (SDN in IIoT Part 2): industrial cloud control plane has 'process unit monitoring, data processing service ...'.","verified":"lecture","c":659},{"q":"R stands for _________ in STRIDE Threat Model of IoT security. Fill in the blanks.","options":["Repudiation","Reliable","Replicable","Resonance"],"answer":[0],"explanation":"Lecture 47 (Security in IIoT Part 1): STRIDE - 'Repudiation ... you send the data and later on you deny'.","verified":"lecture","c":660},{"q":"Application layer of the IoT attack surface is vulnerable to which of the following IIoT Attack Vectors?","options":["Reversal attack","Man-in-the-middle attack","Jamming attack","None of the above"],"answer":[0],"explanation":"Lecture 47 (Security in IIoT Part 1): reversal attack is an application-layer vector; MITM is network, jamming is physical.","verified":"lecture","c":661},{"q":"What does trust permeation aim to establish within the IIoT system?","options":["Unit hierarchies","Device integrity","Manufacturing logistics","Development life cycle"],"answer":[0],"explanation":"Lecture 47 (Security in IIoT Part 1): 'trust permeation ... hierarchical flow of trust ... IIoT system consists of many units; design, development, manufacturing logistics' - trust across unit hierarchies.","verified":"lecture","c":662},{"q":"Which of the following does not represent the building blocks of IIoT security framework?","options":["Fog device protection","Cloud security","Data protection","Embezzlement protection"],"answer":[3],"explanation":"Lecture 48 (Security in IIoT Part 2): building blocks - end device, fog device, cloud security, data protection, communication protection, security management.","verified":"lecture","c":663,"rel":[["Jul-Oct 2023",10,0]]},{"q":"Which of the following standards is supported by the OT security of IIoT?","options":["ISO/IEC 154083","ISO 27017, NIST SP 800-144, ENISA standard","NERC-CIP","ISO series of standards for privacy, framework and regulations"],"answer":[2],"explanation":"Lecture 48 (Security in IIoT Part 2): OT standards like IEC 62443 and NIST ones; slide's OT list includes NERC-CIP, whereas ISO/IEC 15408 is IT and ISO 27017/NIST SP 800-144/ENISA are cloud standards.","verified":"reasoning","c":664},{"q":"Which of the following is not a key component of cloud security of IIoT framework?","options":["Data privacy","Flow-rule protection","Access control","Identity management"],"answer":[1],"explanation":"Lecture 48 (Security in IIoT Part 2): cloud security - 'physical security, data privacy, security controls, identity management and access control'.","verified":"lecture","c":665},{"q":"Which of the following is not a key feature of smart factory?","options":["Connected","Optimized","Ambiguous","Agile"],"answer":[2],"explanation":"Lecture 49 (Factories and Assembly Line): features connected, optimized, transparent, proactive, agile.","verified":"lecture","c":666,"rel":[["Jan-Apr 2025",10,0]]},{"q":"Which of the following is incorrect about Kuka – an IoT-Enabled Factory?","options":["A German robotics maker","Built an IoT-enabled factory","Robots are connected with a private cloud","Deployed on the A330 and A350 final assembly lines in Toulouse"],"answer":[3],"explanation":"Lecture 49 (Factories and Assembly Line): A330/A350 Toulouse lines belong to Airbus factory of the future, not Kuka.","verified":"lecture","c":667},{"q":"_________ is carried out by Amazon – Robotic Shelves. Fill in the blanks.","options":["Automated product search","Manufacturing of drones","AR app based end-to-end factory floor view","None of the above"],"answer":[0],"explanation":"Lecture 49 (Factories and Assembly Line): Amazon robotic shelves 'robots can efficiently locate and search different items'.","verified":"lecture","c":668},{"q":"Which of the following is incorrect about Maersk – Intelligent Shipping?","options":["It is a container shipping company","Uses IoT for preserving refrigerated containers","Does not use blockchain technology for supply chain optimization","Tracks assets and fuel consumption using sensors"],"answer":[2],"explanation":"Lecture 49 (Factories and Assembly Line): Maersk 'uses blockchain technology for supply chain optimization'.","verified":"lecture","c":669},{"q":"Which of the following represents the applications of IoT in Livestock Barns?","options":["Soil moisture sensors optimize irrigation and fertilization","Monitoring health parameters of animals","Drone-assisted mining monitoring","None of the above"],"answer":[1],"explanation":"Lecture 50 (Food Industry): 'in the live stock barns sensors can help in monitoring the health parameters of different animals'.","verified":"lecture","c":670},{"q":"In the context of Agricultural IoT, what do we mean by LAI?","options":["Leaf Area Index","Layout Area Increment","Low Achor Installation","None of the above"],"answer":[0],"explanation":"LAI = Leaf Area Index, a standard crop-monitoring parameter in agricultural IoT; other options are nonsense.","verified":"reasoning","c":671}]},{"year":2024,"session":"Jan-Apr 2024","week":11,"source":"https://progiez.com/nptel-introduction-to-industry-4-assignment-11-answers","questions":[{"q":"Which of the following is/are a challenge faced by IoT in healthcare?","options":["Devices have limited computational capability","Devices have limited memory","Devices use low-power battery hence have short battery life","All of the above"],"answer":[3],"explanation":"L51 'IIoT Applications: Healthcare' slide 'IoT Healthcare Challenges': less computational capability, less on-device memory, energy limitation (low power battery).","verified":"lecture","c":672},{"q":"What is the general action of healthcare body sensors in case some abnormalities are detected?","options":["Sensors do nothing","Sensors automatically turned off","Sensors trigger an alarm","None of the above"],"answer":[2],"explanation":"L51 'IIoT Applications: Healthcare' slide: sensors collect BP, respiration, etc. 'It triggers alarm, if any abnormal situation is there'.","verified":"lecture","c":673},{"q":"Confidentiality, Integrity, __________ and Availability are the four security cornerstones of IIoT based Healthcare monitoring and management.","options":["Accelerometer","Authentication","Automation","Auxiliary"],"answer":[1],"explanation":"L51 'IIoT Applications: Healthcare' slide 'IIoT Healthcare Security Requirement': Confidentiality, Integrity, Authentication, Availability.","verified":"lecture","c":674},{"q":"Optimization and Autonomy are the features of which among the following IIoT models in the Power sector?","options":["SLA Model","Peripheral Model","Maturity Model","Component Model"],"answer":[2],"explanation":"L52 'IIoT Applications: Power Plants' slide 'IIoT Maturity Model': Monitor -> Control -> Optimization -> Autonomy.","verified":"lecture","c":675},{"q":"In Smart grids supported by IIoT, data communication network is not integrated with the physical power transmission network?","options":["True","False"],"answer":[1],"explanation":"L52 'IIoT Applications: Power Plants': smart grid carries both power flow and information flow (WAN/NAN/HAN) together; the networks are integrated, so the statement is False.","verified":"lecture","c":676},{"q":"Consider the following two statements with respect to Passive RFID tags and Active RFID tags. 1. Passive RFID tags have no internal power source whereas active RFID has a battery power source 2. Passive RFID tags have longer range than Active RFID tags","options":["Both Statements 1 and 2 are correct","Statement 1 is correct but 2 is not","Statement 1 is incorrect while 2 is correct","Both Statements 1 and 2 are incorrect"],"answer":[1],"explanation":"L53 'Inventory Management & Quality Control': passive tags have no internal power source; active tags have batteries and 'longer range and memory than the passive RFID tags'.","verified":"lecture","c":677},{"q":"IIoT can be deployed in inventory management to automate which of the following activities?","options":["Only Stock-In Activities","Only Stock-Out Activities","Both Stock-In and Stock-Out Activities","Neither Stock-In nor Stock-Out Activities"],"answer":[2],"explanation":"L53 'Inventory Management & Quality Control': 'the stocking in and stocking out ... can be done efficiently with the incorporation of IIoT'.","verified":"lecture","c":678},{"q":"In the context of Network Security, what does behavioral analytics deal with?","options":["Detects abnormal behavior by the network","Establishes a connection between the sender and receiver","Generates new routes across the network","None of the above"],"answer":[0],"explanation":"L54 'Plant Security and Safety' slide 'Types of Network Security': 'Behavioral analytics - Detection of abnormal behavior by the network'.","verified":"lecture","c":679},{"q":"IP rights are a risk when using AR/VR?","options":["True","False"],"answer":[0],"explanation":"L54 'Plant Security and Safety' slide 'Risks (AR/VR)': lists 'Intellectual Property (IP) rights'.","verified":"lecture","c":680},{"q":"Which of the following is NOT a stakeholder in Facility Management?","options":["Buildings","Finance","People","Patents"],"answer":[3],"explanation":"L55 'Facility Management': stakeholders/dimensions are buildings, finance, people, contracts; patents are not listed.","verified":"lecture","c":681,"rel":[["Jan-Apr 2023",11,0]]},{"q":"Which of the following challenges arise due to ageing of inventory?","options":["Increase in network traffic","Need for proactive, preventive and maintenance procedures","Recurring taxation levied by the Government","All of the above"],"answer":[1],"explanation":"L55 'Facility Management' slide challenges: 'Ageing inventory - Need for proactive preventive and maintenance procedures'.","verified":"lecture","c":682},{"q":"In IIoT enabled facility management, logically where do subcontractors are located?","options":["In between Owners and Customers","As a part of the owners","As a part of the customers","As a master authority of the owners"],"answer":[0],"explanation":"L55 'Facility Management' diagram: Owner (left) -> Subcontractors (middle) -> Customers/Tenants (right).","verified":"lecture","c":683},{"q":"Optimized usage of which of the following resources is preferable?","options":["Manpower","Assets","Technology","All of the above"],"answer":[3],"explanation":"L55 'Facility Management' slide 'Optimization': optimized usage of resources - manpower, assets, technology, cost-effectiveness.","verified":"lecture","c":684},{"q":"Transponders and Beacons are types of what kind of RFID tags?","options":["Active RFID tags","Passive RFID tags","Semi-passive tags","All of the above"],"answer":[0],"explanation":"L53 'Inventory Management & Quality Control': active RFID tags 'broadcast the information signal in the form of beacons'; transponders and beacons are the two active-tag types.","verified":"lecture","c":685},{"q":"Real time and easy diagnosis are ________ of Healthcare IoT?","options":["Advantages","Risks","Disadvantages","None of the above"],"answer":[0],"explanation":"L51 'IIoT Applications: Healthcare': real-time remote monitoring and diagnosis are presented as benefits of IIoT in healthcare.","verified":"lecture","c":686}]},{"year":2024,"session":"Jan-Apr 2024","week":12,"source":"https://progiez.com/nptel-introduction-to-industry-4-assignment-12-answers","questions":[{"q":"What are the advantages of implementing IoT in the chemical industry?","options":["Increase Energy Expenses","Maximize Supply Chain Risk","Improve Logistics","Deteriorate Quality and equipment management"],"answer":[2],"explanation":"L56 'Oil, Chemical and Pharmaceutical Industry': chemical-industry benefits include improve logistics (others are inverted).","verified":"lecture","c":687},{"q":"Which of the following is one of the primary goals of predictive maintenance?","options":["Maximizing equipment breakdowns","Addressing historical issues only","Reducing equipment breakdown","Ignoring real-time problems"],"answer":[2],"explanation":"L56 'Oil, Chemical and Pharmaceutical Industry' slide 'Predictive maintenance': address real time issues, reduce equipment breakdown.","verified":"lecture","c":688},{"q":"What is/are the benefits of using IoT sensors in the Pharmaceutical Industry?","options":["Access huge data of different manufacturing departments","Real time monitoring","Reduce production cost and wastage","All of the above"],"answer":[3],"explanation":"L56 'Oil, Chemical and Pharmaceutical Industry' pharma slide: access huge data, real time monitoring, reduce production cost and wastage.","verified":"lecture","c":689},{"q":"“By applying IoT in the pharmaceutical industry, it is possible to detect Adverse Drugs Reaction (ADR), effects of pharmaceutical excipients, and allergies.” State true or false.","options":["True","False"],"answer":[0],"explanation":"L56 'Oil, Chemical and Pharmaceutical Industry' slide: detect ADR, effects of pharmaceutical excipients, allergies.","verified":"lecture","c":690},{"q":"UAVs are capable of performing which of the following operations?","options":["Aerial imagery","Visual imagery","Thermal imagery","All of the above"],"answer":[3],"explanation":"L57 'UAVs in Industries' slide: 'UAVs are capable of taking aerial imagery, visual imagery, thermal imagery and also radio-frequency imagery'.","verified":"lecture","c":691},{"q":"Which of the following is true about the first generation of the UAV technology?","options":["Fundamental Remote-Control UAVs of different forms","Enhanced intelligent piloting models and full autonomy, full airspace awareness, auto action","Transformable designs with 360° gimbals, high quality video or higher-value instrumentation, improved piloting modes","Improved safety and regulatory, platform and payload adaptability, automated safety modes, intelligent piloting models and full autonomy, airspace awareness"],"answer":[0],"explanation":"L57 'UAVs in Industries' generations slide: First - 'Fundamental Remote Control UAVs of different forms'.","verified":"lecture","c":692},{"q":"How is the application of UAVs in the construction site beneficial?","options":["It does not show clients work progress when they are far away from job sites","Require more time, energy and money","Monitor shoreline erosion","All of the above"],"answer":[2],"explanation":"L57 'UAVs in Industries' construction slide (survey, monitoring job sites, inspecting structures) does not mention shoreline erosion, but the other options are false/negative and 'All' includes them; only 'Monitor shoreline erosion' can be the key.","verified":"reasoning","c":693},{"q":"What are the advantages of using UAVs in telecommunication?","options":["Monitor towers from any angle and height","Broadcasting only historical events","Decrease work safety","Covers local areas with high cost"],"answer":[0],"explanation":"L57 'UAVs in Industries' telecom slide: 'Tower inspection by UAVs: Monitor towers from any angle and height'.","verified":"lecture","c":694},{"q":"“By using UAVs it is possible to scan a huge number of items in a warehouse, check the missing items and monitoring full inventory in a day.” State true or false.","options":["True","False"],"answer":[0],"explanation":"L57 'UAVs in Industries' slide 'Warehousing and Inventory': scans a huge number of items, check the missing items, monitor full inventory in a day.","verified":"lecture","c":695},{"q":"Which of the following can be performed by using UAVs in the forestry?","options":["Manage forest plantations and evenly distribute seedlings sprinkling fertilizer","Measure the carbon storage in biomass by remote sensing","Resist deforestation and increase security","All of the above"],"answer":[3],"explanation":"L57 'UAVs in Industries' forestry slides: manage forest plantations & distribute seedlings sprinkling fertilizer; measure carbon storage in biomass by remote sensing; resist deforestation and increase security.","verified":"lecture","c":696},{"q":"Which of the following activities can be performed by using UAVs in the mining?","options":["Regular surface survey for optimized blast design","Manage stockpiles","Site exploration","All of the above"],"answer":[3],"explanation":"L57 'UAVs in Industries' slide 'Application in Mining': regular surface survey for optimized blast design, manage stockpiles, site exploration.","verified":"lecture","c":1193,"rel":[["Jul-Oct 2025",12,1]]},{"q":"“Case study enables a researcher to closely examine the data within a specific context by following certain procedures and providing quantitative and qualitative analysis of the data.” State true or false.","options":["True","False"],"answer":[0],"explanation":"L58 'Case Studies for Industry 4.0 & IIoT' slide: case study enables a researcher to closely examine data within a specific context, follows certain procedures, provides quantitative and qualitative analysis.","verified":"lecture","c":698},{"q":"What is the primary purpose of case studies?","options":["Create fictional scenarios for analysis","Explore and investigate real-life phenomena","Focus on large geographical areas","Involve a vast number of individuals in the study"],"answer":[1],"explanation":"L58 'Case Studies for Industry 4.0 & IIoT' slide: 'Case studies explore and investigate real-life phenomenon through detailed analysis of related events.'","verified":"lecture","c":699},{"q":"What does loD stand for in the context of IoT and IIoT?","options":["Internet of Devics","Internet of Drones","Intensity of Data","Intention of Damage"],"answer":[1],"explanation":"L57 'UAVs in Industries' covers drones connected to IoT; IoD = Internet of Drones (domain knowledge; other options are nonsense).","verified":"reasoning","c":700},{"q":"Which of the following is false about the application of UAVs in agriculture?","options":["Increase effective yields","Crop health monitoring","Hinder farmers in scouting their crops","Optimize use of seed, fertilizer, water"],"answer":[2],"explanation":"L57 'UAVs in Industries' agriculture slide: 'Save time: Help farmers in scouting their crops' - so 'hinder' is false.","verified":"lecture","c":701}]},{"year":2024,"session":"Jul-Oct 2024","week":1,"source":"https://progiez.com/introduction-to-industry-4-and-industrial-iot-week-1-assignment-answers ; cross-checked with https://www.beubihar.org.in/2024/07/nptel-introduction-to-industry-40-and.html","questions":[{"q":"What is the primary function of a transducer?","options":["To store energy","To convert signal from one physical form to another physical form","To generate eddy current","To generate heat"],"answer":[1],"explanation":"Lecture 01 (Sensing & Actuation): transducer 'converts a signal from one physical form to another physical form'.","verified":"lecture","c":702},{"q":"Which device converts sound to an electrical signal?","options":["Speaker","Antenna","Microphone","Strain gauge"],"answer":[2],"explanation":"Lecture 01 (Sensing & Actuation): 'microphone basically converts sound signals to electrical signals'.","verified":"lecture","c":703},{"q":"Which sensor can detect gases like LPG, CH4, and CO?","options":["DHT22","MQ-5","HC-SR04","PIR"],"answer":[1],"explanation":"Lecture 01 (Sensing & Actuation) shows a 'gas sensor for detecting LPG gas, methane, carbon monoxide'; MQ-5 is that LPG/CH4/CO module (DHT22 temp/humidity, HC-SR04 ultrasonic, PIR motion).","verified":"lecture","c":1212,"rel":[["Jul-Oct 2026",1,1]]},{"q":"What does ‘Resolution’ indicate in a sensor?","options":["The correctness of the output","The smallest change in input that can be detected","The range of sensing","The difference between standard and measured values"],"answer":[1],"explanation":"Lecture 01 (Sensing & Actuation): resolution = smallest change in input the sensor can sense.","verified":"lecture","c":705,"rel":[["Jan-Apr 2025",1,0],["Jul-Oct 2026",1,0]]},{"q":"Which modulation technique is used by Zigbee for the 2.4 GHz band?","options":["BPSK","QPSK","OQPSK","FSK"],"answer":[2],"explanation":"Lecture 02 (IoT Connectivity Part I): 'the 2.4 gigahertz band uses OQPSK'.","verified":"lecture","c":706,"rel":[["Jul-Oct 2026",1,0]]},{"q":"What does 6LoWPAN optimize?","options":["Load balancing in Legacy High-power networks","Packet transmission in Low-power and lossy networks (LLN)","Cryptography in Medium-power networks","Error detection in Long-range networks"],"answer":[1],"explanation":"Lecture 02 (IoT Connectivity Part I): '6LoWPAN optimizes IPv6 packet transmission in low power lossy networks'.","verified":"lecture","c":707},{"q":"How long is the Network ID in a Z-Wave network?","options":["1 Byte","2 Bytes","4 Bytes","8 Bytes"],"answer":[2],"explanation":"Lecture 03 (IoT Connectivity Part II): Z-wave 'The network ID is of length 4 bytes and node ID ... 1 byte'.","verified":"lecture","c":708},{"q":"Which range is typical for Class 1 Bluetooth radios?","options":["1 meter","10 meters","30 meters","100 meters"],"answer":[3],"explanation":"Lecture 03 (IoT Connectivity Part II): '100 meters for class 1 radios'.","verified":"lecture","c":709},{"q":"What does the Constrained RESTful Environments (CORE) framework include for service discovery?","options":["Registration Interface (RI)","Resource Directory (RD)","REST based protocols such as HTTP and CoAP","All of the above"],"answer":[3],"explanation":"Lecture 04 (IoT Networking Part I): CoRE service discovery uses the resource directory, the registration interface and REST-based protocols (HTTP/CoAP).","verified":"lecture","c":1214,"rel":[["Jul-Oct 2026",1,1]]},{"q":"Which policy controls the duration for which transmitted data is considered to be valid in an IoT network?","options":["History policy","Latency budget policy","Lifespan policy","Deadline policy"],"answer":[2],"explanation":"Lecture 04 (IoT Networking Part I): 'Lifespan policy talks about the control over the duration for which the transmitted data will remain valid'.","verified":"lecture","c":711},{"q":"How many levels of QoS does MQTT support?","options":["2","3","4","5"],"answer":[1],"explanation":"Lecture 05 (IoT Networking Part II): MQTT QoS 0, 1 and 2 - three levels.","verified":"lecture","c":712},{"q":"Which protocol is CoAP based on?","options":["TCP","FTP","UDP","HTTP"],"answer":[2],"explanation":"Lecture 05 (IoT Networking Part II): CoAP 'works on top of UDP in the transport layer'.","verified":"lecture","c":1216,"rel":[["Jul-Oct 2026",1,1]]},{"q":"For what kind of applications is AMQP optimized for?","options":["Entertainment","Financial","Vehicular","Educational"],"answer":[1],"explanation":"Lecture 05 (IoT Networking Part II): AMQP 'is typically used for application such as financial applications'.","verified":"lecture","c":714},{"q":"Which layer in IoT architecture is responsible for predictive analytics and data management?","options":["Sensing layer","Networking layer","Service layer","Interface layer"],"answer":[2],"explanation":"Not in Weeks 1-2 lectures; in the 4-layer SoA IoT architecture (sensing, network, service, interface) data management/analytics sit in the service layer.","verified":"reasoning","c":715},{"q":"State True or False. A sensor’s accuracy does not depend upon it’s resolution.","options":["True","False"],"answer":[0],"explanation":"Not in the IIoT transcript; Misra's IoT-course sensor-resolution slide states a sensor's accuracy does not depend upon its resolution.","verified":"reasoning","c":716}]},{"year":2024,"session":"Jul-Oct 2024","week":2,"source":"https://progiez.com/introduction-to-industry-4-and-industrial-iot-week-2 ; cross-checked with https://www.beubihar.org.in/2024/07/nptel-introduction-to-industry-40-and_26.html","questions":[{"q":"Which of the following is NOT a characteristic of the Fourth Industrial Revolution?","options":["Extensive use of ubiquitous and mobile internet","Use of artificial intelligence and machine learning","Invention of the steam engine","Development of Cyber Physical Systems (CPS)"],"answer":[2],"explanation":"Lecture 06 (The Fourth Revolution): steam engine belongs to the first revolution (1760-1840).","verified":"lecture","c":1228,"rel":[["Jan-Apr 2024",2,0],["Jul-Oct 2026",2,1]]},{"q":"What is a significant characteristic of new materials in the context of the Fourth Industrial Revolution?","options":["High cost and scarcity","Lighter, stronger, recyclable, and adaptive","Easily available but very expensive","Non-recyclable and heavy"],"answer":[1],"explanation":"Lecture 06 (The Fourth Revolution): 'Newer materials, lighter materials, stronger materials, materials that are recyclable'.","verified":"lecture","c":1227,"rel":[["Jul-Oct 2026",2,1]]},{"q":"Which of the following equipment can manifest physical objects based on digital specifications?","options":["3D Printer","Digital Microscope","DSLR Camera","Magnetic Separator"],"answer":[0],"explanation":"Lecture 06 (The Fourth Revolution): '3D printers ... will manufacture a particular product according to the specified shape'.","verified":"lecture","c":719},{"q":"Which of the following is not a characteristic of a sustainable industry?","options":["Energy efficiency","Reliance on government subsidy","Conservation of resource","Low-waste production"],"answer":[1],"explanation":"Lecture 07 (Sustainability Assessment of Manufacturing Industry): sustainable industry = energy efficiency, resource conservation, low waste - not reliance on subsidy.","verified":"lecture","c":1230,"rel":[["Jul-Oct 2022",2,0],["Jul-Oct 2026",2,1]]},{"q":"What is considered the main nervous system of any manufacturing industry?","options":["Human Resources","Information and Communication Technology (ICT)","Supply Chain Management (SCM)","Marketing"],"answer":[1],"explanation":"Lecture 07 (Sustainability Assessment of Manufacturing Industry): ICT is the backbone/nervous system of manufacturing industries.","verified":"lecture","c":1229,"rel":[["Jul-Oct 2022",2,0],["Jul-Oct 2025",2,0],["Jul-Oct 2026",2,1]]},{"q":"What is the impact of increasing renewable energy consumption on sustainability?","options":["Increases sustainability","Increases waste product","Unpredictable consumption","Introduces delay"],"answer":[0],"explanation":"Lecture 07 (Sustainability Assessment of Manufacturing Industry): reducing non-renewable and increasing renewable energy use improves sustainability.","verified":"lecture","c":722},{"q":"What is the concept of JIDOKA in Lean Production System?","options":["Producing just what is needed","Stopping production when there is a problem","Reducing inventory","Increasing production speed"],"answer":[1],"explanation":"Lecture 08 (Lean Production System): JIDOKA: 'If there is a problem, stop the production'.","verified":"lecture","c":723},{"q":"What is a ‘value stream’ in Lean Production System?","options":["A set of tools for production","All the actions required for a product from order to delivery","A method of employee training","A type of waste reduction"],"answer":[1],"explanation":"Lecture 08 (Lean Production System): 'value streams are all the actions that are required for a product from order ... to the delivery'.","verified":"lecture","c":1237,"rel":[["Jan-Apr 2025",2,1],["Jul-Oct 2026",2,1]]},{"q":"What does L, D and T stand for under ‘People Engagement’ in the Lean production System?","options":["Learn, Do, Teach","Leverage, Dialogue, Teardown","Lean, Diverse, Timid","Loan, Deploy, Test"],"answer":[0],"explanation":"Lecture 08 (Lean Production System): people engagement objectives 'learn, do, teach'.","verified":"lecture","c":1231,"rel":[["Jul-Oct 2026",2,1]]},{"q":"Which of the following is a benefit of smart and connected products?","options":["Increased manual labor","Improved recall process of product","Higher production costs","Decreased automation"],"answer":[1],"explanation":"Lecture 09 (Smart and Connected Business Perspective): 'Improved recall process of the product' is a benefit.","verified":"lecture","c":726,"rel":[["Jan-Apr 2024",2,0]]},{"q":"Which resource is associated with the ‘Optimization’ categorization of Smart and connected products?","options":["Optimization algorithms","Manual controls","Marketing data","Financial reports"],"answer":[0],"explanation":"Lecture 09 (Smart and Connected Business Perspective): optimization uses optimization solutions/algorithms.","verified":"lecture","c":1232,"rel":[["Jul-Oct 2026",2,1]]},{"q":"Which of the following technologies can provide safety in radio active zones within a smart factory?","options":["Cybersecurity","Augmented Reality","Additive Manufacturing","Smart Grid"],"answer":[1],"explanation":"Lecture 10 (Smart Factories): AR/VR provide 'safety, improving the safety especially for radioactive zones'.","verified":"lecture","c":728},{"q":"What are the characteristics of smart factories?","options":["Connection, Optimization, Transparent, Proactivity, Agility","Manual operation, High cost, Slow processing","Limited connectivity, High energy consumption","Inefficient resource usage"],"answer":[0],"explanation":"Lecture 10 (Smart Factories): characteristics: connection, optimization, transparency, proactivity, agility.","verified":"lecture","c":729},{"q":"State True or False. The amalgamation of CPS and the evolution of Internet-based technologies led to the development of the Industrial Internet.","options":["True","False"],"answer":[0],"explanation":"Not in Weeks 1-2 transcripts; the Industrial Internet is described in the course as CPS combined with Internet-based technologies - True.","verified":"reasoning","c":730,"rel":[["Jul-Oct 2026",2,0]]},{"q":"State True or False. The real-time monitoring of the supply chain reduces inventory and capital requirements.","options":["True","False"],"answer":[0],"explanation":"Not in Weeks 1-2 transcripts; real-time supply-chain visibility lowers safety stock, inventory and tied-up capital - True.","verified":"reasoning","c":731,"rel":[["Jul-Oct 2026",2,0]]}]},{"year":2024,"session":"Jul-Oct 2024","week":3,"source":"https://progiez.com/introduction-to-industry-4-and-industrial-iot-week-3 ; cross-checked with https://www.beubihar.org.in/2024/08/nptel-introduction-to-industry-40-and.html","questions":[{"q":"What are Cyber-Physical Systems (CPS)?","options":["Systems that operate solely on physical components","Systems that operate only on computational components","Interacting networks of physical and computational components","Systems without any computational components"],"answer":[2],"explanation":"L11 NIST definition: 'interacting networks of physical and computational components'.","verified":"lecture","c":732},{"q":"What is one of the key features of CPS in terms of computation?","options":["Static computation","Reactive computation","Limited computation","Redundant computation"],"answer":[1],"explanation":"L11: 'Reactive computation is very important'.","verified":"lecture","c":1251,"rel":[["Jul-Oct 2026",3,1]]},{"q":"What architecture is used for designing CPS-based manufacturing systems for Industry 4.0?","options":["3C architecture","5C architecture","7C architecture","9C architecture"],"answer":[1],"explanation":"L11: '5C architecture goals ... achieved with the help of cyber physical system'.","verified":"lecture","c":734},{"q":"What is a collaboration platform in the context of Industry 4.0?","options":["A type of business software that combines organizational networking capacities with operations","A social media platform for employees","A traditional project management tool","A financial management system"],"answer":[0],"explanation":"L12 describes a business software platform combining a social/networking layer with business operations, matching option A.","verified":"reasoning","c":1252,"rel":[["Jul-Oct 2026",3,1]]},{"q":"What does Single Source of Truth (SSoT) refer to in collaboration productivity?","options":["Storing every data element exactly once","Storing multiple copies of each data element","Using outdated software for decision making","Storing the same data across different systems"],"answer":[0],"explanation":"L12: SSoT is a model 'storing every data element exactly once'.","verified":"lecture","c":736},{"q":"What is required for effective coordination in Industry 4.0 collaboration productivity?","options":["Isolated decision-making","Centralized authority","Stronger coordination between multiple industry agents","Reducing the exchange of information"],"answer":[2],"explanation":"L12: coordination ensures 'stronger coordination between multiple industry agents'.","verified":"lecture","c":737},{"q":"What is a key feature of Augmented Reality (AR)?","options":["Completely replacing the physical environment","Enhancing the present perception of reality","Only providing auditory feedback","Operating in isolated systems"],"answer":[1],"explanation":"L13: AR gives an 'amplified environment, where the present perception of reality is improved'.","verified":"lecture","c":1253,"rel":[["Jul-Oct 2026",3,1]]},{"q":"What is a characteristic of Projection-based Augmented Reality?","options":["Can provide location data without GPS","Projects light onto real-world surfaces","Uses only 4K displays for projection","Does not have acoustic element"],"answer":[1],"explanation":"L13: projection-based AR projects light onto real world surfaces.","verified":"lecture","c":739},{"q":"What does a fully immersive VR simulation provide?","options":["No interaction with the virtual environment","A wide field of view with head-mounted displays and motion detecting devices","Only visual feedback without interaction with the user","Manual control over the real environment"],"answer":[1],"explanation":"L13: fully immersive offers 'a wide field of view using different head mounted displays, motion detecting devices'.","verified":"lecture","c":740},{"q":"What type of AR uses visual markers for outcomes?","options":["Marker-based Augmented Reality","Markerless Augmented Reality","Projection Based Augmented Reality","Superimposition Based Augmented Reality"],"answer":[0],"explanation":"L13: 'Marker based augmented reality gives an outcome when the reader is sensed by the camera and the visual marker'.","verified":"lecture","c":741,"rel":[["Jan-Apr 2024",3,1]]},{"q":"Who proposed the first use of the phrase “Artificial Intelligence”?","options":["Alan Turing","John McCarthy","Marvin Minsky","Herbert Simon"],"answer":[1],"explanation":"Not in the transcript; John McCarthy coined the term 'Artificial Intelligence' (1955-56 Dartmouth proposal).","verified":"reasoning","c":1254,"rel":[["Jul-Oct 2026",3,1]]},{"q":"Which of the following statements is true?","options":["A program without AI uses a large knowledge base and heuristic search method","A program with AI uses a large database and algorithmic search method","A program with AI uses a large knowledge base and heuristic search method","A program without AI uses a large database and heuristic search method"],"answer":[2],"explanation":"L14: program with AI 'uses large knowledge base and heuristic search method'.","verified":"lecture","c":743},{"q":"According to NIST, what restricts the capacity of using conventional methods to manage Big Data?","options":["Data quality","Acquisition speed, data volume, or data characterization","Data accessibility","Data format"],"answer":[1],"explanation":"L15 definition: 'acquisition speed, the data volume, data characterization, restricts the capacity of using conventional ... methods'.","verified":"lecture","c":744},{"q":"What does the velocity characteristic of Big Data refer to?","options":["The category of the data","The speed of generation of data","The quality of the data","The volume of the data"],"answer":[1],"explanation":"L15: velocity = speed of generation of data.","verified":"lecture","c":745},{"q":"Which of the following are constraints of mobile CPS?","options":["Network stability","Power requirement","Security","All of the above"],"answer":[3],"explanation":"Not in the transcripts; network stability, power requirement and security are all standard mobile-CPS constraints.","verified":"reasoning","c":1256,"rel":[["Jan-Apr 2025",3,0],["Jul-Oct 2026",3,1]]}]},{"year":2024,"session":"Jul-Oct 2024","week":4,"source":"https://progiez.com/introduction-to-industry-4-and-industrial-iot-week-4 ; cross-checked with https://www.beubihar.org.in/2024/08/nptel-introduction-to-industry-40-and_14.html","questions":[{"q":"What role does Application Security play in Cybersecurity for Industry 4.0?","options":["Prevents unauthorized physical access","Ensures the protection of applications from outer threats","Lock’s the user’s computer files by using an encryption and demands some money to unlock them","Resolves network architecture issues"],"answer":[1],"explanation":"L16: application security 'ensures that you are protecting the different applications from outsider threats'.","verified":"lecture","c":747},{"q":"What is Operational Security (OPSEC)?","options":["A method to increase hardware performance","An analytical action that categorizes information benefits and regulates control for protection","A technique to reduce software complexity","A process to enhance network speed"],"answer":[1],"explanation":"L16: 'Operation security is an analytical action, which categorizes the information benefits and ... regulates the control'.","verified":"lecture","c":748},{"q":"What is Ransomware?","options":["A type of malware that provides a facility to the attacker to lock user’s computer files by using encryption and demand money to unlock them","A program that increases computer performance","A system to enhance network speed","A method to secure data from unauthorized access"],"answer":[0],"explanation":"L16: ransomware 'provides a facility to the attacker in which the attacker locks the user's computer files by using an encryption and ... demand some money'.","verified":"lecture","c":1258,"rel":[["Jul-Oct 2026",4,1]]},{"q":"What is the primary aim of the Industrial Internet of Things (IIoT)?","options":["Increase machine life and optimize operational efficiency","Enhance social media presence","Decrease manufacturing costs significantly","Replace human labor completely"],"answer":[0],"explanation":"L17: IIoT aims at 'enhancing the working condition ... increasing the machine life, optimizing the operational efficiency'.","verified":"lecture","c":750},{"q":"What is a major challenge in the deployment of IIoT?","options":["Legacy installations","Cybersecurity","Lack of standardization","All of the above"],"answer":[3],"explanation":"L17: challenges include cyber security, lack of standardization and legacy installations.","verified":"lecture","c":1259,"rel":[["Jul-Oct 2022",4,0],["Jul-Oct 2026",4,1]]},{"q":"What does IIoT provide in the context of firefighting?","options":["Increased data redundancy","Real-time monitoring and early warning of disasters","Manual rescue operations","Reduced connectivity among devices"],"answer":[1
