,"explanation":"AI Policies, AGI with Prof. David Krueger - Part 1: personal assistants that adapt to work habits put \"knowledge ... in the hands of these big companies ... dangerous amount of power\".","verified":"lecture","c":113},{"q":"According to the lecture, why is training models on copyrighted data not constitute \"transformative fair use\"?","options":["The models fail to provide accurate citations for the generated content.","The resulting model directly competes economically with the creators.","The generated outputs are legally indistinguishable from the copyrighted data.","The training process stores exact copies of the original works."],"answer":[1],"explanation":"AI Policies, AGI with Prof. David Krueger - Part 1: \"one of the important criteria for ... fair use is that you aren't directly competing with the creators of the copyright data\".","verified":"lecture","c":114},{"q":"According to the lecture, why might single-nation AI regulations fail to prevent the deployment of dangerous AI systems?","options":["National regulators lack the technical tools needed to monitor large computing data centers within their own borders.","Individual nations may have the need to bypass regulations and build dangerous AI systems anyways.","International copyright laws prevent individual countries from enforcing safety standards on foreign models.","Private AI companies can legally overturn single-nation safety laws in international judicial systems."],"answer":[1],"explanation":"AI Policies, AGI with Prof. David Krueger - Part 1: nations and companies \"will still ... use them to pursue selfish and short-term objectives ... to survive as a nation\"; coordination is the problem.","verified":"lecture","c":115},{"q":"Which mechanism explains why safety fine-tuning may fail to eliminate deep-seated societal biases in LLMs?","options":["Catastrophic learning episodes","Superficial behaviour alignment","Inference latency optimization","Data scaling bottlenecks"],"answer":[1],"explanation":"AI Policies, AGI with Prof. David Krueger - Part 2: \"safety fine-tuning ... it's really superficial\"; models keep biases \"deep down\".","verified":"lecture","c":116},{"q":"Why is it dangerous for AI systems to be optimized for user persuasiveness?","options":["It requires continuous access to quantum compute.","It degrades latency during multi-turn dialogue.","It creates incentives to manipulate human intent.","It prevents models from processing implicit or indirect input cues"],"answer":[2],"explanation":"AI Policies, AGI with Prof. David Krueger - Part 2: \"don't build systems in a way that they have the incentive to manipulate people\".","verified":"lecture","c":117},{"q":"Why is it better to have upstream regulation for companies developing AI systems and hardware than having downstream regulation on the people using the AI systems?","options":["Developers are completely free of standard regulations.","Developers lack any technical control over baseline models.","Users control the underlying training data pipeline.","Users face high market pressure to adopt AI systems."],"answer":[3],"explanation":"AI Policies, AGI with Prof. David Krueger - Part 2: governing users \"puts way too much onus on the user ... really hard to resist using AI systems because they provide such a ... competitive advantage\".","verified":"lecture","c":118},{"q":"According to the lecture, why is cross-modal capability considered to be a characteristic of Artificial General Intelligence (AGI)?","options":["Text processing requires higher computational memory.","Multimodal models eliminate risks of hallucinations in the outputs.","Language models cannot represent abstract reasoning.","Excluding human modalities creates a gap in real-world understanding."],"answer":[3],"explanation":"AI Policies, AGI with Prof. David Krueger - Part 2: \"if you have a system that can't process certain data modalities that humans are able to process then that's a qualitative cognitive deficit ... not AGI\".","verified":"lecture","c":119}]},{"year":2026,"session":"Jul-Oct 2026","week":11,"source":"https://www.youtube.com/watch?v=CiWWrbXEX5E, https://www.youtube.com/watch?v=RYDRH3iNjzw, https://www.youtube.com/watch?v=M43GSwgbsGU, https://www.youtube.com/watch?v=iC-EfjQRgJw","questions":[{"q":"In the context of data privacy, which right requires companies to delete user data when requested?","options":["Right to intellectual property retention","Right to be forgotten","Right to data portability","Right to transparency"],"answer":[1],"explanation":"AI Governance: \"right to be forgotten ... the company should be able to delete in a certain period of time\".","verified":"lecture","c":120},{"q":"Which OECD AI Principle states that AI systems should operate safely and function properly under normal use, misuse, or adverse conditions?","options":["Inclusive growth, sustainable development and well-being","Transparency and explainability","Robustness, security, and safety","Accountability"],"answer":[2],"explanation":"AI Governance: robustness, security and safety: systems should function appropriately \"in conditions of normal use, foreseeable use or misuse or other adverse conditions\".","verified":"lecture","c":121},{"q":"Under the EU AI Act, which application category is classified as an 'unacceptable risk'? (Select all that apply.)","options":["Social Scoring Systems","Critical Infrastructure Management","Law Enforcement","Cognitive Behavioural Manipulation"],"answer":[0,3],"explanation":"AI Governance: unacceptable risk = cognitive behavioural manipulation, social scoring, biometric ID. Critical infrastructure and law enforcement are listed as high risk.","verified":"lecture","c":122},{"q":"When a system like an email spam server filters out malicious messages in the background without requiring user intervention, which type of threat mitigation is it demonstrating?","options":["Educating and training users","Providing interface-level threat warnings","Silently eliminating the threat","Enforcing legal regulations"],"answer":[2],"explanation":"AI Governance: \"silently eliminating the threat ... One technical side could be email spam server\".","verified":"lecture","c":123},{"q":"What specific transparency requirement does the EU AI Act impose on deepfakes or generated media?","options":["They must be exclusively hosted on European-based servers.","They must be clearly labeled as AI-generated.","They must not be published on the internet at all.","They must be heavily taxed before distribution."],"answer":[1],"explanation":"AI Governance: AI-generated or modified images/audio/video \"need to be clearly labeled as AI generated\".","verified":"lecture","c":124},{"q":"In the AI Value Chain, who is considered the \"deployer\"?","options":["The person or organization that uses the AI systems under its own authority.","The original engineering team that built the AI model.","The individual who imports the AI system into the EU market.","The government official responsible for writing the regulations."],"answer":[0],"explanation":"AI Governance: \"deployer: persons that uses the systems under its authority\".","verified":"lecture","c":125},{"q":"To satisfy the OECD principle of \"accountability,\" AI actors should ensure \"traceability\" throughout the system's lifecycle. What does this specifically help achieve?","options":["It allows companies to track user information that can lead to their location, such as IP addresses.","It ensures one can trace back how data was collected and how it influences decision-making.","It guarantees the system uses minimal computing power and has a low carbon footprint.","It allows the AI to completely wipe its training period after a set period."],"answer":[1],"explanation":"AI Governance: traceability: \"one can trace back to the point of how the data was collected, how the data is helping to make the choice\".","verified":"lecture","c":126},{"q":"In the SaGE framework, how is semantic inconsistency functionally defined?","options":["Failing to identify commonsense reasoning violations within a single prompt.","Generating factually incorrect statements in response to a factual prompt.","Utilizing grammatically disparate structures to answer identical prompts.","Providing semantically disparate answers to semantically equivalent prompts."],"answer":[3],"explanation":"Research Overview: SaGE: \"semantically equivalent questions should yield semantically equivalent answers\"; LLMs give contradictory answers to paraphrased questions.","verified":"lecture","c":127},{"q":"In the SaGE framework, what does a higher semantic graph entropy indicate about the LLM?","options":["The model is exhibiting higher semantic consistency.","The model is exhibiting higher semantic inconsistency.","The model is exhibiting lower syntactic divergence.","The model is exhibiting lower fundamental judgment."],"answer":[1],"explanation":"Research Overview: SaGE: \"more entropy in the graph ... your answers are inconsistent\".","verified":"lecture","c":128},{"q":"A developer attempts to reduce an LLM's tendency to give contradictory answers to moral questions by lowering the generation temperature. Based on SaGE, what is the expected outcome?","options":["The consistency score will improve to near perfection.","The consistency score will perfectly match human scores.","The consistency score will drop to near zero.","The consistency score will remain largely unaffected."],"answer":[3],"explanation":"Research Overview: SaGE: across temperatures the scores \"do not really change beyond a point ... consistency is not really a property of temperature\".","verified":"lecture","c":129},{"q":"According to the SaGE framework, how does an LLM's accuracy on standard commonsense reasoning benchmarks correlate with its moral consistency?","options":["Accuracy negatively correlates with consistency.","Accuracy does not correlate with consistency.","Accuracy strictly correlates with consistency.","Accuracy conditionally correlates with consistency."],"answer":[1],"explanation":"Research Overview: SaGE: \"the accuracy of a benchmark does not correlate with its consistency at all\".","verified":"lecture","c":130}]},{"year":2026,"session":"Jul-Oct 2026","week":12,"source":"https://www.youtube.com/watch?v=FD4Ptu1qDQY, https://www.youtube.com/watch?v=AQsMnIQTdgQ, https://www.youtube.com/watch?v=UwjObFcBaSE, https://www.youtube.com/watch?v=tlpgooDKgoY","questions":[{"q":"What does a 'guarded' attribute mean in a language model's representation space?","options":["The attribute can only be classified by specific linear probes.","The attribute requires non-linear transformations to be classified.","The attribute is heavily emphasized during the initial pre-training process.","The attribute is entirely impossible to classify based on the representation."],"answer":[3],"explanation":"Research Overview: Representation Surgery: guardedness = \"you cannot draw a classifier on the representations ... to classify this attribute Z\".","verified":"lecture","c":131},{"q":"What is the primary objective of modifying vectors from one distribution (e.g., toxic to non-toxic) to look like another?","options":["To increase the computational cost of generating toxic content.","To guard an attribute with the smallest possible change to unrelated semantics.","To fundamentally alter the underlying vocabulary of the model.","To completely randomize the vector outputs of specific trigger tokens."],"answer":[1],"explanation":"Research Overview: Representation Surgery: make toxic vectors look non-toxic \"with the smallest change possible ... to preserve all semantics that is unrelated to Z\".","verified":"lecture","c":132},{"q":"According to the lecture, what is the implication behind using Affine Steering?","options":["It is a no-gradient and cheap way to control model generation.","It fine-tunes the model to effectively remove bias using minimal training data.","It is a highly interpretable, gradient-based optimization method.","It depends heavily on reinforcement learning and human feedback."],"answer":[0],"explanation":"Research Overview: Representation Surgery: \"we get a no gradient way to cheaply control the generation from the language model\".","verified":"lecture","c":133},{"q":"How does the size of a conventional cell complex scale as the size of the graph increases?","options":["It scales inversely with respect to graph size.","It scales quadratically with respect to graph size.","It scales logarithmically with respect to graph size.","It scales linearly with respect to graph size."],"answer":[1],"explanation":"Research Overview: Higher Order Structures for Graph Explanations: \"the size of a conventional cell complex will scale quadratically as the size of the graph increases\".","verified":"lecture","c":134},{"q":"In the molecule toxicity detection task, why might a standard Graph Neural Network Explainer fail to identify the correct explanation?","options":["It removes all nodes that have a high edge degree.","It processes node features too slowly for a chemical dataset.","It cannot capture specific multi-node groupwise interactions.","It assigns zero weight to all the chemical bonds by default."],"answer":[2],"explanation":"Research Overview: Higher Order Structures for Graph Explanations: the benzene ring is a group interaction that a GNN treats as separate pairwise edges; GNNExplainer gets only two ring nodes right.","verified":"lecture","c":135},{"q":"How does FORGE reduce the computational complexity of the cell complex to a linear scale?","options":["By randomly sampling only 10% of the original graph edges.","By strategically removing specific types of boundary relations.","By completely deleting all nodes with a degree higher than a threshold degree.","By executing the explainer algorithm on highly compressed latent space."],"answer":[1],"explanation":"Research Overview: Higher Order Structures for Graph Explanations: \"if we strategically generate or strategically add the boundary edges we can bring this ... down to linear\" (dropping 1-cell to 1-cell and 2-cell to 2-cell relations).","verified":"lecture","c":136},{"q":"How are cycles structurally represented in the cell complex?","options":["They are represented as 0-cells.","They are represented as 1-cells.","They are represented as 2-cells.","They are represented as 3-cells."],"answer":[2],"explanation":"Research Overview: Higher Order Structures for Graph Explanations slide: \"Cycles are 2-cells, which are connected to all edges that make up that cycle\".","verified":"lecture","c":137},{"q":"Which of the following are examples of graph explainers? (Select all that apply.)","options":["Predicting the next token in a language model","Toxicity detection of molecules","Affine concept erasure","Drug prediction","Fraud detection"],"answer":[1,3,4],"explanation":"Research Overview: Higher Order Structures for Graph Explanations: graph applications listed include molecules for drug/property prediction (toxicity) and transaction networks for fraud detection.","verified":"lecture","c":138},{"q":"Which of the following methods benefits the most from the FORGE framework?","options":["Attention-based methods","Surrogate-based methods","Gradient-based methods","Perturbation-based methods"],"answer":[3],"explanation":"Research Overview: Higher Order Structures for Graph Explanations: \"perturbation based methods which are GNNExplainer and SubgraphX ... benefit the most from our framework\".","verified":"lecture","c":139},{"q":"Based on the mathematical definitions of cell complexes presented in the FORGE slides, which of the following statements are correct? (Select all that apply.)","options":["A 0-cell corresponds to a vertex, while a 1-cell corresponds to an edge in traditional graphs.","The 1-skeleton X^(1) of a cell complex consists exclusively of 1-dimensional cells.","Vertical boundary relations connect two cells of the same dimension that share a common boundary.","Boundary relations in the framework are restricted to be undirected, meaning σ_{c1,c2} = σ_{c2,c1}.","A p-cell c^(p) is considered a face or boundary of a (p+1)-cell c^(p+1) if the set of points composing c^(p) is a subset of those composing c^(p+1)."],"answer":[0,3,4],"explanation":"Research Overview: Higher Order Structures for Graph Explanations slides (Def 3.4/3.5): the p-skeleton has cells \"of dimension at most p\"; \"horizontal\" relations join same-dimension cells and \"vertical\" ones join different dimensions; \"we further restrict the boundary relations to be undirected\". The face/boundary definition matches statement 5.","verified":"lecture","c":140}]},{"year":2025,"session":"Jul-Oct 2025","week":12,"source":"https://www.youtube.com/watch?v=12dhGX6IVnM; https://www.youtube.com/watch?v=c9BOAXFyRFk","questions":[{"q":"According to the lecture, what is the primary limitation of graphs as data structures?","options":["They can only model high-risk applications.","They are difficult to interpret.","They can only model pairwise relationships between nodes.","They cannot be used for fraud detection."],"answer":[2],"explanation":"Research Overview: Higher Order Structures for Graph Explanations: \"in graphs we can only model pairwise relationships\".","verified":"lecture","c":141},{"q":"What is a \"p-cell\" in a cell complex?","options":["An element of dimension p.","A vertex (0-dimensional).","An edge (1-dimensional).","A general graph."],"answer":[0],"explanation":"Research Overview: Higher Order Structures for Graph Explanations: a p-cell \"refers to a cell of dimension p\".","verified":"lecture","c":142},{"q":"How does a cell complex overcome the limitation of graphs?","options":["By using more complex algorithms.","By capturing interactions between multiple nodes.","By reducing computational costs.","By simplifying the graph structure."],"answer":[1],"explanation":"Research Overview: Higher Order Structures for Graph Explanations: the 2-cell gives \"the whole interaction of six nodes a feature vector\", modelling group-wise interactions.","verified":"lecture","c":143},{"q":"What does FORGE stand for?","options":["Framework For Real-time Graph Explanations.","Fundamental Operations for Relevant Graph Embeddings.","Framework For Higher-Order Representations In Graph Explanations.","Fast Optimization of Graph Explanations."],"answer":[2],"explanation":"Research Overview: Higher Order Structures for Graph Explanations slide: \"FORGE (Framework For Higher-Order Representations In Graph Explanations)\".","verified":"lecture","c":144},{"q":"Based on the \"Lifting the Graph\" algorithm, which of the following are represented as augmented nodes? (Select all that apply.)","options":["All nodes (0-cells)","Edges (1-cells)","Cycles (2-cells)","Boundary relations"],"answer":[1,2],"explanation":"Corrected after checking the lecture (was: All nodes (0-cells), Edges (1-cells), Cycles (2-cells)). Research Overview: Higher Order Structures for Graph Explanations \"Lifting the Graph\" slide: \"All nodes are 0-cells; Edges are 1-cells, which are represented as augmented nodes connected to the original nodes; Cycles are 2-cells\". Narration: a cycle \"gets its own node and we add another augmented node\". The 0-cells are the original nodes, not augmented ones.","verified":"lecture","c":145},{"q":"What do Language Models (LMs) primarily train to predict?","options":["The previous token.","The next token.","Grammatical structure.","Semantic relationships."],"answer":[1],"explanation":"Research Overview: Representation Surgery: \"language models are trained to predict the next token\".","verified":"lecture","c":146},{"q":"According to the lecture, what is a \"guarded\" attribute in the context of representations?","options":["An attribute that is easily classified.","An attribute that is protected from manipulation.","An attribute that cannot be classified based on the representations.","An attribute that enhances model performance."],"answer":[2],"explanation":"Research Overview: Representation Surgery: guarded = cannot train a classifier on the representations to classify attribute Z.","verified":"lecture","c":147},{"q":"What is the goal of \"Affine Concept Erasure\"?","options":["To enhance a particular attribute.","To remove all attributes from a representation.","To apply a transformation that guards a particular attribute.","To make representations more easily interpretable."],"answer":[2],"explanation":"Research Overview: Representation Surgery: affine transformation \"such that the representations ... are guarded with respect to attribute Z\".","verified":"lecture","c":148},{"q":"When making vectors from one distribution to look like those of another (e.g., toxic to non-toxic), what is a key desired outcome besides guarding?","options":["Increasing the model's complexity.","Preserving semantics unrelated to the changed attribute.","Introducing new semantic meanings.","Reducing the dimensionality of the vectors."],"answer":[1],"explanation":"Research Overview: Representation Surgery: smallest change, \"because we want to preserve all semantics that is unrelated to Z\".","verified":"lecture","c":149},{"q":"What is a \"Black Swan\"?","options":["A common, predictable event.","An unforeseen event with extreme consequences.","An event that happens frequently in training data.","An event with minor consequences."],"answer":[1],"explanation":"Summary - Part 1: black swans are events \"rare to occur but when it occurs it has actually a lot of implications ... extreme impact\".","verified":"lecture","c":150},{"q":"What is \"Probing\"?","options":["A method to physically modify neural networks.","A method to analyze information stored in a model's representations.","A technique for speeding up model training.","A way to generate new data for models."],"answer":[1],"explanation":"Interpretability - II: probing refers to methods \"to check whether representations encode information reliably for some specific tasks\".","verified":"lecture","c":151},{"q":"What is the term for hidden functionality implanted into models by adversaries that can cause dangerous changes in behavior when triggered?","options":["Trojan","Worm","Swarm","Backdoor"],"answer":[0],"explanation":"Corrected after checking the lecture (was: Backdoor). Interpretability - II (Trojans section, following Hendrycks): \"adversaries can implement hidden functionalities into the models ... cause a sudden or dangerous change in behavior ... what is Trojan here\". The question quotes the Trojan definition word for word.","verified":"lecture","c":152}]},{"year":2025,"session":"Jul-Oct 2025","week":11,"source":"https://www.youtube.com/watch?v=Dz1GD2elEE0","questions":[{"q":"What are the countermeasures for computer security? (Select all that apply.)","options":["Train the users","Wait until the threat goes away on its own.","Silently eliminate the threat.","Warn users about the threat."],"answer":[0,2,3],"explanation":"Corrected after checking the lecture (was: Train the users, Warn users about the threat.). AI Governance: the three computer-security countermeasures are \"train the users\", interface warnings to users, and \"silently eliminating the threat\" (e.g. a spam server).","verified":"lecture","c":153},{"q":"Which of the following is an OECD AI Principle? (Select all that apply.)","options":["International co-operation for trustworthy AI","Transparency and Explainability","Deletion of AI systems","Removing guardrails from AI","Robustness, Security and Safety","Investing in AI research and development"],"answer":[0,1,4,5],"explanation":"AI Governance: the OECD principles covered include transparency & explainability, robustness/security/safety, investing in AI R&D and international co-operation.","verified":"lecture","c":154},{"q":"According to the AI Value Chain, who uses AI systems under authority?","options":["Provider","Deployer","Distributor","Representative"],"answer":[1],"explanation":"AI Governance: \"deployer: persons that uses the systems under its authority\".","verified":"lecture","c":155},{"q":"According to the OECD AI principles, what is 'Accountability'?","options":["AI actors should respect the rule of law, human rights, democratic and human-centered values throughout the AI system lifecycle.","AI actors should commit to transparency and responsible disclosure regarding AI systems.","AI systems should be robust, secure, and safe throughout their entire lifecycle so that, in conditions of normal use, foreseeable use or misuse, or other adverse conditions, they function appropriately and do not pose unreasonable safety and/or security risks.","AI actors should be accountable for the proper functioning of AI systems and for the respect of the above principles, based on their roles, the context, and consistent with the state of the art."],"answer":[3],"explanation":"AI Governance: \"AI actors should be accountable for proper functioning of AI systems and for the respect of the above principles based on the roles, the context...\".","verified":"lecture","c":156},{"q":"According to the EU AI Act, what AI Systems are considered \"Unacceptable Risk\"?","options":["AI systems that understand too many languages.","AI systems that can understand logic but not emotional statements.","AI systems that can generate media such as images, videos, and audio.","AI systems that are able to behaviorally manipulate people."],"answer":[3],"explanation":"AI Governance: unacceptable risk \"include cognitive behavioral manipulation of people or specific vulnerable groups\".","verified":"lecture","c":157},{"q":"According to Semantic Graph Entropy, which of the following is true?","options":["Entropy and consistency are not related.","Entropy and consistency are proportional.","Entropy and consistency are inversely proportional.","Consistency is constant regardless of entropy."],"answer":[2],"explanation":"Research Overview: SaGE: \"if you have more entropy in the graph it would mean that your answers are inconsistent\".","verified":"lecture","c":158},{"q":"What is the main problem identified with Large Language Models (LLMs)?","options":["They are too slow.","They are inconsistent.","They lack creativity.","They cannot identify human emotions."],"answer":[1],"explanation":"Research Overview: SaGE: \"here's one problem ... large language models are inconsistent\".","verified":"lecture","c":159},{"q":"What does \"Semantic Consistency\" mean?","options":["The ability to understand different languages.","The ability to make consistent decisions.","The ability to generate grammatically correct sentences.","The ability to learn new vocabulary."],"answer":[1],"explanation":"Research Overview: SaGE: semantic consistency \"is the ability to make consistent decisions in semantically equivalent contexts\".","verified":"lecture","c":160},{"q":"According to the lecture, what type of scenarios do LLMs \"struggle\" with more?","options":["Commonsense scenarios.","Mathematical problems.","Moral scenarios.","Factual questions."],"answer":[2],"explanation":"Research Overview: SaGE: LLMs \"may perform consistently in scenarios that align with ... common sense ... but it may struggle in moral scenarios\".","verified":"lecture","c":161},{"q":"What was a key finding of the SaGE framework regarding consistency and accuracy?","options":["Consistency and accuracy are the same problem.","Consistency and accuracy are not the same problem and need separate evaluation.","Accuracy automatically implies consistency.","Consistency is irrelevant if accuracy is high."],"answer":[1],"explanation":"Research Overview: SaGE: \"consistency and accuracy are not the same problem which shows that language models have to be evaluated for consistency separately\".","verified":"lecture","c":162},{"q":"What is \"Rule of Thumb\" generation?","options":["Developing general guidelines from practical experience.","A method for generating paraphrases.","A general guideline for model training.","A statistical measure of model performance."],"answer":[0],"explanation":"Research Overview: SaGE: a rule of thumb is \"a guiding principle or ... a fundamental judgment about right or wrong\", generated from Q&A pairs. \"General guidelines\" is the closest option.","verified":"lecture","c":163}]},{"year":2025,"session":"Jul-Oct 2025","week":10,"source":"https://www.youtube.com/watch?v=hy2rpaoGVTw","questions":[{"q":"What does 'AGI' stand for?","options":["Augmented General Intelligence","Artificial Guided Intelligence","Augmented Guided Intelligence","Artificial General Intelligence"],"answer":[3],"explanation":"AGI = Artificial General Intelligence (matches the official 2024 key for the same question).","verified":"reasoning","c":164,"rel":[["Jul-Oct 2024",10,0]]},{"q":"According to the lecture, why is 'blackbox access' insufficient for AI agents?","options":["It is too expensive to implement for most companies.","It poses a significant security risk for the company that developed the AI.","It prevents auditors from understanding the model's internal workings and decision-making processes.","It doesn't allow for the assessment of the model's training data."],"answer":[2],"explanation":"AI Policies, AGI with Prof. David Krueger - Part 1: black-box audits are insufficient \"because the auditor might fail to identify and surface the problematic behavior ... much easier ... if you had more access\".","verified":"lecture","c":165},{"q":"Which of the following best describes one of the possible definitions of AGI?","options":["AI systems that are limited to specific tasks.","AI systems surpassing human intelligence.","AI models trained for basic automation.","AI systems which show high training accuracy."],"answer":[1],"explanation":"Official NPTEL key: AI systems surpassing human intelligence.","verified":"official","c":318,"rel":[["Jul-Oct 2024",10,1]]},{"q":"What is the key difference between 'reward gaming' and 'goal miss generalization' in AI systems?","options":["Reward gaming is an intentional exploitation of the reward function, while goal miss generalization is an accidental misinterpretation of the goal.","Reward gaming is easier to detect and correct than goal miss generalization.","Reward gaming involves optimizing the wrong reward function, while goal miss generalization involves optimizing a correlated but incorrect reward function.","Reward gaming is a more significant threat to AI safety than goal miss generalization."],"answer":[2],"explanation":"Corrected after checking the lecture (was: Reward gaming is an intentional exploitation of the reward function, while goal miss generalization is an accidental misinterpretation of the goal.). AI Policies, AGI with Prof. David Krueger - Part 1: reward hacking = \"you have the wrong reward function and then you optimize it\"; goal misgeneralization = right reward but the system \"ends up optimizing a different reward function because it was ... correlated with the true reward function\".","verified":"lecture","c":167},{"q":"According to the lecture, what is the primary concern regarding the arrival of AGI?","options":["AGI will be primarily used for malicious purposes by bad actors and rogue states.","AGI will be too expensive to develop and maintain, leading to a new form of global inequality.","The arrival of AGI could lead to chaotic power struggles, the extinction of humanity, or other severe negative consequences.","AGI will lead to massive job displacement and economic disruption."],"answer":[2],"explanation":"AI Policies, AGI with Prof. David Krueger - Part 1: AGI \"is going to ... unleash a lot of chaotic power struggles and probably lead to ... the extinction of humanity\".","verified":"lecture","c":168},{"q":"As mentioned in the lecture, what is the main concern about the use of social media data for training AI models?","options":["The data is often of low quality, which leads to inaccurate and unreliable AI models.","There is a lack of incentive to protect user privacy in the current business models of tech companies.","The data is not diverse enough, which leads to biased and unfair AI models.","The data is too expensive for smaller companies to acquire, leading to a monopolization of AI development."],"answer":[1],"explanation":"AI Policies, AGI with Prof. David Krueger - Part 1: on social-media training data, \"there just isn't a proper incentive to protect users privacy ... business models are not really set up to do that\".","verified":"lecture","c":169},{"q":"According to the lecture, what 'dangerous amount of power' do AI assistants create for the companies that develop them?","options":["The power to censor information and control the user's access to knowledge.","The power to manipulate users' beliefs and behaviors based on their personal information and habits.","The power to control the user's personal finances and investments.","The power to replace human workers in a wide range of industries."],"answer":[1],"explanation":"AI Policies, AGI with Prof. David Krueger - Part 1: assistants give companies \"such an incredible and dangerous amount of power ... potential for misuse of that data to ... manipulate you ... manipulate your political opinions\".","verified":"lecture","c":170},{"q":"Which of the following are identified as significant challenges or concerns related to the development and deployment of advanced AI? (Select all that apply.)","options":["The difficulty of achieving global coordination to pause or regulate AI development, similar to challenges like climate change.","The potential for AI systems to be misused by individuals for personal entertainment, leading to decreased productivity.","The legal and ethical issues surrounding the use of copyrighted material for training Large Language Models (LLMs).","The risk of \"goal miss generalization,\" where an AI optimizes for a correlated but incorrect goal, leading to unintended and potentially harmful behavior.","The high computational cost of training advanced AI models, making them accessible only to a few large tech companies."],"answer":[0,2,3],"explanation":"Corrected after checking the lecture (was: The difficulty of achieving global coordination to pause or regulate AI development, similar to challenges like climate change., The legal and ethical issues surrounding the use of copyrighted material for training Large Language Models (LLMs)., The risk of \"goal miss generalization,\" where an AI optimizes for a correlated but incorrect goal, leading to unintended and potentially harmful behavior., The high computational cost of training advanced AI models, making them accessible only to a few large tech companies.). AI Policies, AGI with Prof. David Krueger - Part 1/AI Policies, AGI with Prof. David Krueger - Part 2 discuss global coordination (compared to climate change), fair use of copyrighted data and goal misgeneralization. Training compute cost limiting access to a few big firms is never raised as a concern, so that option is removed.","verified":"lecture","c":171},{"q":"According to the lecture, what is the main legal challenge when an AI system makes a biased mistake in an employment context?","options":["It is difficult to prove that the AI was the sole cause of the mistake.","Current laws primarily hold the employer responsible, not the AI developer.","AI developers are protected by international treaties.","There are no existing laws that cover discrimination in hiring."],"answer":[1],"explanation":"AI Policies, AGI with Prof. David Krueger - Part 2: \"existing employment law really only allows you to go after the employer and not after the provider of the software\".","verified":"lecture","c":172},{"q":"What is meant by 'implicit bias' in an AI system?","options":["Unconscious and involuntary stereotypes and assumptions embedded within algorithms","Biases that are intentionally programmed into the AI by developers.","Biases that only appear when the AI interacts with specific users.","A safety feature that helps the AI avoid making biased statements."],"answer":[0],"explanation":"AI Policies, AGI with Prof. David Krueger - Part 2: models still carry biases \"at a deeper level ... the idea of implicit bias ... popular in Psychology\".","verified":"lecture","c":173},{"q":"Which of the following are presented as key areas of concern or focus for the future of AI? (Select all that apply)","options":["The need for international regulation based on fundamental human rights.","The difficulty in marketing AI products to a skeptical public.","The environmental impact, particularly energy and water consumption.","The challenge of assigning legal responsibility when AI systems cause harm."],"answer":[0,2,3],"explanation":"AI Policies, AGI with Prof. David Krueger - Part 2: wants \"International regulation ... in terms of fundamental rights\", discusses energy use and data-centre water, and assigning responsibility to developers and deployers. Marketing is never raised.","verified":"lecture","c":174},{"q":"What is the primary danger of the 'arms race' mentality in AI development?","options":["It slows down innovation by focusing too much on safety.","It encourages collaboration and open-sourcing of models.","It leads to rapid, unchecked development without adequate time for regulation and safety checks.","It reduces the profitability of AI companies."],"answer":[2],"explanation":"AI Policies, AGI with Prof. David Krueger - Part 2: worried about the \"move fast and break things like arms race mentality ... winning these short-term competitions\" (GPT-4 release called irresponsible).","verified":"lecture","c":175},{"q":"How is 'multimodality' viewed in the context of achieving AGI?","options":["It has already been fully achieved by current AI models.","It is seen as essential for an AI to match the full range of human cognitive abilities.","It is considered a distraction from the more efficient text-based training methods.","It is believed to be the primary cause of bias in AI systems."],"answer":[1],"explanation":"AI Policies, AGI with Prof. David Krueger - Part 2: multimodality \"is a crucial component for AGI ... we do need to have those capabilities to deal with all the same modalities that humans can\".","verified":"lecture","c":176}]},{"year":2025,"session":"Jul-Oct 2025","week":9,"source":"https://www.youtube.com/watch?v=N-caT4gIIpo","questions":[{"q":"Which of the following is NOT mentioned as one of the RAI (Responsible AI) principles in the slides?","options":["Fairness","Explainability","Sustainability","Privacy"],"answer":[2],"explanation":"Fairness, explainability and privacy are standard RAI principles; sustainability is the odd one out. The W9 videos are panel recordings without slides, so this could not be checked against the slide.","verified":"reasoning","c":177},{"q":"According to the lecture, how many Executive Orders on AI were issued?","options":["One","Two","Three","Four"],"answer":[1],"explanation":"The slide behind this question is not shown in the W9 videos. \"Two\" is kept, but the US has several AI executive orders (13859, 13960, 14110), so the count the slide used is uncertain.","verified":"unsure","c":178},{"q":"What does PEMAT stand for in the context of healthcare video assessment?","options":["Patient Education Materials Assessment Tool","Patient Evaluation Medical Assessment Test","Public Education Medical Assessment Tool","Patient Educational Material Analysis Tool"],"answer":[0],"explanation":"PEMAT is AHRQ's Patient Education Materials Assessment Tool (factual; the slide is not in the W9 videos).","verified":"reasoning","c":179},{"q":"According to the presentation, which domains need AI emergency response capabilities?","options":["Only .com domains","Only .gov domains",".mil, .com and .gov domains","Only .edu domains"],"answer":[2],"explanation":"The slide is not in the videos. Covering .mil, .com and .gov is the only option consistent with a cross-sector AI emergency-response capability.","verified":"reasoning","c":180},{"q":"Which of the following statement(s) is true regarding the development and implementation of AI systems?","options":["Policy considerations and technical details are equally important","Technical details alone are sufficient for effective AI development","Policy considerations are only important in few countries","AI systems do not require any policy or ethical considerations"],"answer":[0],"explanation":"Official NPTEL key: Policy considerations and technical details are equally important.","verified":"official","c":328,"rel":[["Jul-Oct 2024",9,1]]},{"q":"In the suffix attacks, what is the vulnerability related to?","options":["Data poisoning","Model stealing","Breaking alignment policies of chatbots","Privacy breaches"],"answer":[2],"explanation":"Adversarial suffix attacks (GCG) jailbreak chatbots by breaking their alignment policies; the Representation Engineering hands-on also describes an \"adversarial suffix\" making the model explain bomb-making.","verified":"reasoning","c":182},{"q":"What type of multi-disciplinary approaches are required for AI evaluation?","options":["Only computer science approaches","Only engineering approaches","Social science, engineering, and computer science approaches","Only social science approaches"],"answer":[2],"explanation":"AI evaluation is presented as multidisciplinary (social science + engineering + CS); the other options all say \"only\".","verified":"reasoning","c":183},{"q":"Based on the lecture content: From a mathematical perspective, which of the following is not considered a major problem in AI today, compared among others?","options":["Explainability","Hallucinations","Data privacy","Bias"],"answer":[2],"explanation":"Official NPTEL key: Data privacy.","verified":"official","c":330,"rel":[["Jul-Oct 2024",9,1]]},{"q":"According to the lecture, who is primarily responsible for self-regulation in the context of AI and technology?","options":["Individuals / Individual organizations","Government agencies","Only the organizations with more than 1 crore turnover","International organizations"],"answer":[0],"explanation":"Official NPTEL key: Individuals / Individual organizations.","verified":"official","c":333,"rel":[["Jul-Oct 2024",9,1]]},{"q":"What is the six-step process for adopting a systems approach to fairness?","options":["Define, Measure, Understand, Improve, Mitigate, Monitor","Design, Build, Test, Deploy, Evaluate, Maintain","Plan, Execute, Review, Adjust, Scale, Optimize","Collect, Process, Analyze, Model, Validate, Implement"],"answer":[0],"explanation":"Rayid Ghani's fairness deck (the CMU material the W9 speakers drew on; the slides are not shown in the course videos): Define (fairness goals) -> Measure and Detect (bias) -> Understand (root causes) -> Improve (fairness of AI systems) -> Mitigate (impact through adjusting interventions) -> Monitor & Evaluate.","verified":"reasoning","c":186},{"q":"In the Accuracy vs. Disparity chart, what represents the Ideal model?","options":["High accuracy, high disparity","Low accuracy, low disparity","High accuracy, low disparity","Moderate accuracy, moderate disparity"],"answer":[2],"explanation":"Rayid Ghani's fairness deck (the CMU material the W9 speakers drew on; the slides are not shown in the course videos): the Disparity vs Precision@k chart labels \"Ideal model\" at high accuracy and low disparity.","verified":"reasoning","c":187}]},{"year":2025,"session":"Jul-Oct 2025","week":8,"source":"https://www.youtube.com/watch?v=Y06BNTTrjA8","questions":[{"q":"In pixel-attribution methods, which statement best distinguishes perturbation-based approaches from gradient-based saliency?","options":["Perturbation-based methods compute input gradients; gradient-based methods fit local surrogate models.","Perturbation-based methods are model-agnostic and computationally expensive; gradient-based methods use model internals and are faster.","Perturbation-based methods always produce sparser explanations; gradient-based methods always produce denser explanations.","Perturbation-based methods require access to intermediate activations; gradient-based methods are strictly black-box."],"answer":[1],"explanation":"Perturbation methods (LIME/SHAP) \"doesn't bother about the model\"; gradient-based methods are \"faster to compute\", while \"LIME and SHAP are expensive\" - Interpretability - I (0llPpGFPoQg).","verified":"lecture","c":188},{"q":"Which behavior of a saliency map under layer-randomization is a red flag that the map is not capturing learned model structure?","options":["The saliency map remains largely unchanged after randomizing many layers.","The saliency map changes dramatically as earlier layers are randomized.","The saliency map's sign (positive/negative) flips while spatial structure remains.","Absolute saliency values shrink while layout shifts."],"answer":[0],"explanation":"\"if you randomize the layers some saliency maps do not change much, which suggests that they do not capture what the model has learned\" - Interpretability - I (0llPpGFPoQg).","verified":"lecture","c":189},{"q":"Which of the following is fully equivariant to translation and rotation:","options":["StyleGAN2","ProtoPNet","StyleGAN3","None of the above"],"answer":[2],"explanation":"\"in StyleGAN3 ... it is equivariant to translation and rotation\" - Interpretability - I (0llPpGFPoQg).","verified":"lecture","c":190},{"q":"Optimized-mask saliency methods (optimize a mask that when applied alters prediction) are brittle because:","options":["Their masks always converge to a single-pixel trigger.","They require closed-form solutions for mask gradients.","Results strongly depend on mask initialization and hyperparameters.","They are invariant to adversarial perturbations."],"answer":[2],"explanation":"Optimized masks are \"super sensitive to hyperparameters and mask initialization\" - Interpretability - I (0llPpGFPoQg).","verified":"lecture","c":191},{"q":"For token-level gradient saliency in text, a large gradient magnitude for a token most reliably indicates:","options":["The token is causally required for the model's prediction.","The model's output is sensitive to small embedding perturbations at that token.","The token is semantically important to humans.","The token was the only one used during training for that class."],"answer":[1],"explanation":"Text saliency uses \"the magnitude of the gradient of the classifier's logits with respect to the token's embedding\", i.e. local sensitivity, not causal necessity - Interpretability - I (0llPpGFPoQg).","verified":"lecture","c":192},{"q":"Which of the following is NOT a name commonly associated with pixel attribution methods?","options":["Saliency map","Sensitivity map","Feature attribution","Convolution map"],"answer":[3],"explanation":"NPTEL official accepted answer: Convolution map","verified":"official","c":339,"rel":[["Jul-Oct 2024",8,1]]},{"q":"Which of the following are realistic attack vectors for implanting Trojans into neural networks?","options":["Poisoning a fraction of a public training dataset with triggers and target labels.","Fine-tuning a model on carefully curated clean data only.","Distributing pretrained models via model libraries that already contain hidden functionality.","Applying purely random weight perturbation after training without trigger examples.","Injecting triggers only at inference time without altering training data or model weights."],"answer":[0,2],"explanation":"Trojans get in via \"public data sets\" (poisoning, even 0.05%) and \"model sharing libraries\" (Hugging Face, PyTorch, TensorFlow) - Interpretability - II (VvCbwm2yzM4).","verified":"lecture","c":194},{"q":"Defenses that reverse-engineer potential triggers (e.g., via optimization) rely on which observations?","options":["One can optimize small masks/patterns that cause misclassification to a target label.","If an optimized trigger for a particular label is significantly smaller/simpler than others, it suggests a Trojan.","Reverse-engineered triggers always exactly match the original poisoning trigger used at training.","Pruning neurons highly activated by a reverse-engineered trigger can mitigate the Trojan.","Training a meta-classifier to detect Trojaned models is computationally cheap and always generalizes."],"answer":[0,1,3],"explanation":"Neural Cleanse searches for a mask/pattern per target label, flags anomalously small triggers, \"doesn't always recover the original trigger\", and pruning neurons hit by the reverse trigger removes the Trojan; meta-classifiers are \"computationally expensive\" - Interpretability - II (VvCbwm2yzM4).","verified":"lecture","c":195},{"q":"How does Guided BackProp differ from standard backpropagation in generating saliency maps?","options":["It only considers positive gradients by zeroing out negative activations and gradients.","It back propagates gradients with all activations zeroed out.","It focuses on highlighting both negative and positive contributions.","It requires padding 1 to the image before backpropagation."],"answer":[0],"explanation":"NPTEL official accepted answer: It only considers positive gradients by zeroing out negative activations and gradients.","verified":"official","c":343,"rel":[["Jul-Oct 2024",8,1]]},{"q":"In the context of mechanistic interpretability, what do inhibitory connections in neural circuits primarily accomplish?","options":["They amplify signal strength between neurons","They create redundant pathways for information flow","They reduce the probability of information transfer between neurons","They store long-term memory patterns"],"answer":[2],"explanation":"\"inhibitory reduces the probability that such a transfer will take place\" - Interpretability - II (VvCbwm2yzM4).","verified":"lecture","c":197},{"q":"What is the primary limitation of LIME's local explanations?","options":["LIME only works on image data","LIME explanations are locally faithful but not necessarily globally consistent","LIME requires access to model internals","LIME cannot handle categorical features"],"answer":[1],"explanation":"LIME explanations are \"faithful locally ... but it may not be the same case globally\" - Interpretability - I (0llPpGFPoQg).","verified":"lecture","c":198}]},{"year":2025,"session":"Jul-Oct 2025","week":7,"source":"https://www.youtube.com/watch?v=L_ObqGIGGW0; https://www.youtube.com/watch?v=oEt2GNl9-kU","questions":[{"q":"In approximate differential privacy, what role does the delta (δ) parameter play? (Notation same as in the lecture)","options":["It ensures that epsilon differential privacy holds for all possible sets","It allows for some rare events (set S) where epsilon differential privacy may not hold","It reduces the amount of noise required in all cases","It eliminates the need for the epsilon parameter"],"answer":[1],"explanation":"δ \"can be thought of as giving us some leeway ... low probability events where the ε-DP property may not hold\" - Approximate Differential Privacy (G_pn8G09-KI).","verified":"lecture","c":199},{"q":"What is a key advantage of approximate differential privacy over standard differential privacy?","options":["It provides stronger privacy guarantees","It eliminates the need for noise addition","It can increase utility","It works only with categorical data"],"answer":[2],"explanation":"\"the gaussian noise helps you achieve higher utility because the amount of noise that you add is lower\" - Approximate Differential Privacy (G_pn8G09-KI).","verified":"lecture","c":200},{"q":"In approximate differential privacy, the Gaussian noise follows which pattern?","options":["N(0, σ) where σ = √(d log(1/δ))/(n+ε)","N(0, σ) where σ = √(d log(1/δ))/(ε)","N(0, σ) where σ = d log(1/δ)/(n-ε)","N(0, σ) where σ = √(d log(1/δ))/(n·ε)"],"answer":[3],"explanation":"Corrected after checking the lecture (was: N(0, σ) where σ = √(d log(1/δ))/(ε)). \"in the gaussian case ... we will end up getting something like square root of D log 1 by Delta by n Epsilon ... this is the standard deviation\" - Approximate Differential Privacy (G_pn8G09-KI).","verified":"lecture","c":201},{"q":"What does Statistical Parity require for a fair classifier?","options":["The classifier should have equal accuracy across all groups","The probability of positive predictions should be equal across protected and non-protected groups","The true positive rates should be identical for all demographic groups","Individual similar cases should receive similar predictions"],"answer":[1],"explanation":"Statistical parity = P(M(x)=1 | x∈C) − P(M(x)=1), ideally 0 - Fairness in Machine Learning (UAXIj2IVvpU).","verified":"lecture","c":202},{"q":"For an ideal fair algorithm under Equality of Opportunity, what condition must be satisfied?","options":["The overall prediction rates must be equal across groups","The false positive rates of unprivileged and privileged groups should be equal","The true positive rates of unprivileged and privileged groups should be equal","The precision should be identical for both protected and non-protected groups"],"answer":[2],"explanation":"Equality of opportunity compares P(M=1 | y=1, C) with P(M=1 | y=1), i.e. true positive rates - Fairness in Machine Learning (UAXIj2IVvpU).","verified":"lecture","c":203},{"q":"What is the Post-Processing property in differential privacy?","options":["Any preprocessing of data before applying DP mechanisms maintains the privacy guarantee","Privacy guarantees are strengthened when multiple post-processing steps are applied","Any data-independent transformation applied to the output of a differentially private mechanism does not degrade its privacy guarantee","Post-processing can be used to improve the privacy guarantee of any mechanism"],"answer":[2],"explanation":"Post-processing property: any function of the (ε,δ)-DP output stays (ε,δ)-DP - Approximate Differential Privacy (G_pn8G09-KI).","verified":"lecture","c":204},{"q":"In a PCA analysis, if the reconstruction error for female data points is lower than for male data points, what does this indicate?","options":["The dataset is biased against females","The dataset is biased against males","Reconstruction error differences are due to random noise","Male data is more correlated"],"answer":[1],"explanation":"In Fair PCA the group with higher reconstruction error is the one treated unfairly (there, females), so lower female error means the PCA disadvantages males - Fairness in Machine Learning (UAXIj2IVvpU).","verified":"lecture","c":205},{"q":"In the exponential mechanism to calculate the price to maximize the revenue, identify the correct statement in the scenario where 2 unequal prices result in the same revenue.","options":["Both prices have an unequal probability of being selected","Both prices have an equal probability of being selected","A higher price has a higher probability of being chosen due to normalisation","A lower price has a higher probability of being chosen due to normalisation"],"answer":[1],"explanation":"\"I will get the same probability for two different prices which give me the same revenue\" - Exponential Mechanism (Ir_wOyCFohs).","verified":"lecture","c":358,"rel":[["Jul-Oct 2024",7,1]]},{"q":"In an ideal situation where the models are completely fair, the different parity values are:","options":["Approach 0","1","Approach 1","0"],"answer":[0],"explanation":"\"in an ideal classifier the parity should be zero\"; in practice it is pushed \"closer and closer to zero\" - Fairness in Machine Learning (UAXIj2IVvpU). Both \"Approach 0\" and \"0\" fit; kept the majority uploader choice.","verified":"unsure","c":362,"rel":[["Jul-Oct 2024",7,1]]},{"q":"In a classifier, if a data point lies exactly on the decision boundary (hyperplane), what is the probability of it belonging to the positive class?","options":["Greater than 50%","Less than 50%","Equal to 50%","Cannot be determined from the given information"],"answer":[2],"explanation":"A point on the separating line is labeled each way with 50% probability - Fairness in Machine Learning (UAXIj2IVvpU).","verified":"lecture","c":208},{"q":"In Fair Logistic Regression, the equation P(M(x)=1|C=1) - P(M(x)=1|C=0) represents which fairness metric?","options":["Equality of Opportunity","Statistical Parity","Predictive Parity","Individual Fairness"],"answer":[1],"explanation":"In fair logistic regression \"the notion of parity\" is |P(M=1|C=1) − P(M=1|C=0)|, a statistical-parity measure - Fairness in Machine Learning (UAXIj2IVvpU).","verified":"lecture","c":209}]},{"year":2025,"session":"Jul-Oct 2025","week":6,"source":"https://www.youtube.com/watch?v=CdsxrrkjaSA","questions":[{"q":"What are the primary disadvantages of cryptographic solutions for privacy protection? Select all that apply.","options":["Inference possibility remains uncertain in all scenarios","Utility reduces","It is expensive","Security guarantees are absolute in all cases"],"answer":[0,2],"explanation":"Corrected after checking the lecture (was: Utility reduces, It is expensive). The two reasons given: \"it is unclear whether you can always do this inference in an encrypted space\" and \"it might be an expensive solution\" - Data Privacy (etOgdDVr3mk). Utility loss is not a crypto drawback.","verified":"lecture","c":210},{"q":"Why do anonymization techniques often fail to provide adequate privacy protection?","options":["They require excessive computational resources","Adversaries can leverage auxiliary databases for de-anonymization attacks","They only work with structured data formats","The anonymization process introduces too much noise"],"answer":[1],"explanation":"\"the deanonymization attack used auxiliary databases ... information from IMDb\" - Data Privacy (etOgdDVr3mk).","verified":"lecture","c":211},{"q":"In the randomized response model, what does the parameter epsilon in e^ε represent?","options":["The percentage of truthfulness of the response that is allowed to be revealed","The ratio between falsehood and randomness in responses","The computational complexity of the algorithm","The number of participants in the study"],"answer":[0],"explanation":"\"should I reveal the truth with 60%, 70% is something that Epsilon is controlling\" - Data Privacy (etOgdDVr3mk).","verified":"lecture","c":212},{"q":"What characterizes an ideal privacy model?","options":["Maximum utility with zero privacy guarantees","Perfect privacy with minimal utility","Balanced trade-off between utility and privacy requirements","Complete data suppression for absolute privacy"],"answer":[2],"explanation":"The coin toss (full privacy, no utility) and full truth (no privacy) are both useless; \"we somehow want to be somewhere in between\" - Data Privacy (etOgdDVr3mk).","verified":"lecture","c":213},{"q":"Given: Xi represents truth, Yi represents randomized value of Xi, and Zi = (Yi − (1/(1+e^ε))) × (e^ε + 1)/(e^ε − 1). What is the expected value Zi?","options":["E[Zi] = Yi","E[Zi] = Xi","E[Zi] = e^ε × Xi","E[Zi] = 0"],"answer":[1],"explanation":"\"if I compute the expected value of Zi now this would just be Xi\" - Data Privacy (etOgdDVr3mk).","verified":"lecture","c":214},{"q":"In the randomized response model, which statements are correct? Select all that apply.","options":["Privacy guarantee can be controlled by parameter ε","Privacy and utility are independent of sample size","Higher ε values provide stronger utility","Utility guarantee scales with √n"],"answer":[0,2,3],"explanation":"ε controls privacy; larger ε gives smaller deviation O(1/(ε√n)), so utility improves with √n; n does not enter the privacy guarantee - Data Privacy (etOgdDVr3mk).","verified":"lecture","c":215},{"q":"Consider datasets: X = {x1, x2, ..., xN} (truth), Y = {y1, y2, ..., yN} (revealed values). To derive better estimators Z = {z1, z2, ..., zN} from Y, what process is required?","options":["Removing bias from Y introduced through randomization","Adding bias to Y removed through randomization","Removing variance from Y introduced through randomization","Adding variance to Y removed through randomization"],"answer":[0],"explanation":"Zi is obtained by unbiasing/debiasing Yi - Data Privacy (etOgdDVr3mk).","verified":"lecture","c":216,"rel":[["Jul-Oct 2024",6,0]]},{"q":"Which factors directly influence the privacy guarantee in differential privacy mechanisms? Select all that apply.","options":["Sensitivity of the query function","Magnitude of added noise","Size of the dataset","Privacy parameter Epsilon"],"answer":[0,1,3],"explanation":"Noise ∝ Δ/ε ties the guarantee to sensitivity, noise and ε; \"n does not appear in my privacy guarantee\" - Data Privacy (etOgdDVr3mk)/Differential Privacy (cBU6545k-v0).","verified":"lecture","c":217},{"q":"Which trust scenario correctly describes the differential privacy model?","options":["Trust the curator; Trust the world","Do not trust the curator; Trust the world","Trust the curator; Do not trust the world","Do not trust the curator; Do not trust the world"],"answer":[2],"explanation":"Corrected after checking the lecture (was: Do not trust the curator; Trust the world). \"even though you can trust the curator, you don't trust the world ... one way to do this is using differential privacy\" - Differential Privacy (cBU6545k-v0). The 2026 copy of this question was also answered this way.","verified":"lecture","c":218,"rel":[["Jul-Oct 2026",6,1]]},{"q":"For fixed privacy levels, how do sample size requirements differ between Laplacian mechanism and Randomized response?","options":["Constant factor difference","Exponential factor difference","Logarithmic factor difference","Quadratic factor difference"],"answer":[3],"explanation":"\"quadratically lesser number of people to achieve the same privacy-utility trade-off using the Laplace mechanism\" - Differential Privacy (cBU6545k-v0).","verified":"lecture","c":219},{"q":"Higher privacy guarantees can be achieved in which scenarios? Select all correct options.","options":["When Epsilon parameter is increased","When noise magnitude is increased","When inverse sensitivity is high","When variance in the mechanism is high","When utility requirements are maximized"],"answer":[1,2,3],"explanation":"Corrected after checking the lecture (was: When noise magnitude is increased, When variance in the mechanism is high). With Laplace scale b=Δ/ε, ε=Δ/b: more noise/variance or lower sensitivity (high inverse sensitivity) gives stronger privacy; raising ε weakens it (Differential Privacy (cBU6545k-v0)). The key might count only noise/variance.","verified":"unsure","c":220,"rel":[["Jul-Oct 2024",6,0]]},{"q":"In the context of randomized response, what happens to utility as privacy guarantees increase?","options":["Utility remains constant","Utility increases proportionally","Utility decreases due to increased noise","Utility becomes undefined"],"answer":[2],"explanation":"\"smaller the epsilon, the larger the noise ... and so the utility goes down\" - Differential Privacy (cBU6545k-v0).","verified":"lecture","c":221}]},{"year":2025,"session":"Jul-Oct 2025","week":5,"source":"https://www.youtube.com/watch?v=ldr_9y9VlpU; https://www.youtube.com/watch?v=Lp3FFtsKc1I; https://www.youtube.com/watch?v=hp8yuyW1h3I","questions":[{"q":"What is considered an ideal Stereotype Score (ss)?","options":["0%","25%","50%","75%"],"answer":[2],"explanation":"\"The SS of an ideal language model will be 50\" - Bias - III (EGZDLTvqndI).","verified":"lecture","c":222},{"q":"What does SEAT stand for?","options":["Standard Evaluation Assessment Test","Semantic Evaluation Annotation Test","Structured Embedding Accuracy Test","Sentence Embedding Association Test"],"answer":[3],"explanation":"NPTEL official accepted answer: Sentence Embedding Association Test","verified":"official","c":376,"rel":[["Jul-Oct 2024",5,1]]},{"q":"In counterfactual data augmentation (CDA), what is altered to rebalance the corpus?","options":["Sentence Length","Syntex","Bias attribute words","Vocabulary complexity"],"answer":[2],"explanation":"CDA swaps bias attribute words (\"his\"->\"her\"); \"diversity in the set of bias attributes perturbed is key to effective CDA\" - Bias - IV (h6am1pcDFh8).","verified":"lecture","c":224},{"q":"Which characteristic makes a language model more likely to generate gender-neutral responses in text-to-text tasks? (Select all that apply.)","options":["Training on diverse and balanced datasets.","Use of bias-specific adapter modules.","Conditioning outputs on explicit gender tokens.","Reliance on pretrained token embeddings without fine-tuning."],"answer":[0,1],"explanation":"Balanced/diverse training data and bias-specific debiasing adapters (MAFIA, Bias - IV) push toward neutral outputs; conditioning on explicit gender tokens or un-fine-tuned embeddings does not.","verified":"reasoning","c":225},{"q":"Which toolkit is used to add programmable guardrails to LLM-based conversational applications like ChatGPT?","options":["GPT-4","NVIDIA NeMo","CoDi","MAFIA"],"answer":[1],"explanation":"\"NeMo Guardrails is an open source toolkit for easily adding programmable guardrails to LLM-based conversational applications\" - Bias - IV (h6am1pcDFh8).","verified":"lecture","c":226,"rel":[["Jul-Oct 2026",5,1]]},{"q":"Which of the following is the correct formula for Pointwise Mutual Information (PMI)?","options":["PMI(w_i, w_j) = log2 [ N·c(w_i, w_j) / (c(w_i)^2 · c(w_j)^2) ]","PMI(w_i, w_j) = log2 [ c(w_i)·c(w_j) / (N·c(w_i, w_j)) ]","PMI(w_i, w_j) = log2 [ N·c(w_i, w_j) / (c(w_i)·c(w_j)) ]","PMI(w_i, w_j) = log2 [ c(w_i, w_j) / (N·c(w_i)·c(w_j)) ]"],"answer":[2],"explanation":"PMI \"is log base 2 of the ratio of the bigram probability of word i and word j\" over the unigram probabilities, i.e. log2[N·c(wi,wj)/(c(wi)c(wj))] - Bias Handon Part 1 (pwY3sKDt1Oo).","verified":"lecture","c":227},{"q":"'Useful fairness' couples which of the following? (Select all that apply.)","options":["Context awareness","Bias Score","STS task performance","Dataset diversity"],"answer":[1,2],"explanation":"Corrected after checking the lecture (was: Context awareness, STS task performance). On Bias-STS-B: \"we couple the bias score with an actual STS task performance, that's the fairness measure\" - Bias - IV (h6am1pcDFh8). Context awareness is not part of it.","verified":"lecture","c":228},{"q":"What is the key architectural idea behind the MAFIA model for effective debiasing?","options":["Fusing bias-specific adapters while keeping the base model the same.","Replacing all model weights with debiased adapters.","Dynamically routing inputs based on detected bias type.","Using GANs to hallucinate fair outputs."],"answer":[0],"explanation":"MAFIA \"fuse[s] various debiasing adapters\"; \"we only tune green blocks, purple blocks are adapters trained for specific biases\" - Bias - IV (h6am1pcDFh8).","verified":"lecture","c":229},{"q":"Which of the following is true about proprietary models?","options":["They are more neutral compared to CoDi and other open source models.","They are less neutral compared to CoDi and other open source models.","They have more bias than CoDi and other open source models.","They have the same neutrality as CoDi and other open source models."],"answer":[0],"explanation":"\"Proprietary models are more neutral compared to the CoDi and the open source models\" - Bias in VLM's (sxV1_8CXj4M); matches the 2024 official key.","verified":"lecture","c":230},{"q":"Which of the following are benchmark datasets commonly used to measure bias in language models? (Select all that apply.)","options":["Stereoset","CrowS-Pairs","ImageNet","Bias-STS-S","SQuAD"],"answer":[0,1,3],"explanation":"StereoSet and CrowS-Pairs (Bias - III) and Bias-STS-B (Bias - IV) are the bias benchmarks covered; ImageNet and SQuAD are not bias benchmarks.","verified":"lecture","c":231},{"q":"What is 'gender-bleaching' in the context of VLMs?","options":["Improving the quality of input images.","Turning all people in the input images white.","Enhancing gender-specific features in input images.","Removing/Obscuring visual cues related to gender in input images."],"answer":[3],"explanation":"Gender-bleached inputs replace people with robots instead of blurring/blacking out faces, removing gender cues - Bias in VLM's (sxV1_8CXj4M).","verified":"lecture","c":232},{"q":"Why might a single adapter for all bias types (like iDEBall) fail?","options":["Cannot effectively debias across all categories.","Trains slower than other models.","Requires more input data.","Does not understand contextual information."],"answer":[0],"explanation":"\"the single adapter trained on CDA from all bias dimensions finds it difficult to effectively debias across dimensions\" - Bias - IV (h6am1pcDFh8).","verified":"lecture","c":233}]},{"year":2025,"session":"Jul-Oct 2025","week":4,"source":"https://www.youtube.com/watch?v=QX64An5veaQ; https://www.youtube.com/watch?v=nTJRJfzehCg","questions":[{"q":"As per the lecture, in the context of Machine Learning, what is the definition of 'bias'?","options":["Systematic deviation from rationality and judgement.","Systematic error in the collection, analysis, or interpretation of data.","Systematic favoritism or discrimination towards certain groups/outcomes.","Systematic behaviour when solving complex tasks."],"answer":[2],"explanation":"Corrected after checking the lecture (was: Systematic error in the collection, analysis, or interpretation of data.). 'statistically... a systematic error in the collection, analysis and interpretation of data; our focus is the CS and ML side: systematic favoritism or discrimination towards certain groups or outcomes' (Bias - I (W4)); the old key was the statistics definition.","verified":"lecture","c":234},{"q":"Why did Microsoft's Tay chatbot become offensive shortly after it was launched?","options":["It learned toxic behaviour from user interactions on Twitter.","It was hacked by a rival company.","It was trained on outdated information.","It was programmed to be controversial for publicity."],"answer":[0],"explanation":"Tay learned offensive behaviour from (malicious) Twitter users within hours of launch.","verified":"reasoning","c":235},{"q":"As per the lecture, which of the following is a/are a category of bias? (Select all that apply.)","options":["Gender","Race","Scientific Facts","Profession","Currency exchange rates"],"answer":[0,1,3],"explanation":"Bias categories listed: 'gender... profession, race, religion' (Bias - I (W4)).","verified":"lecture","c":236,"rel":[["Jul-Oct 2026",4,1]]},{"q":"According to the ML Pipeline, what may be a source of bias? (Select all that apply.)","options":["Annotators beliefs","Hardware used for computation","Balanced dataset","Biased training data"],"answer":[0,3],"explanation":"'who are the annotators, what about their beliefs'... 'training on biased data' (Source of Bias (W4)).","verified":"lecture","c":237},{"q":"What does the Legal Safety Score (LSS_β) represent?","options":["The model's ability to predict legal outcomes based solely on accuracy.","A metric combining fairness and accuracy using a β-weighted harmonic mean.","A score based on the usage of legal jargon for marginalized groups.","An evaluation metric used to define how well a model understands legal jargon."],"answer":[1],"explanation":"'LSS metric is our legal safety score' combining fairness and accuracy (InSaAF, Bias - II (W4)); defined as a beta-weighted harmonic mean.","verified":"lecture","c":238},{"q":"What do LLMs use to prevent harmful outputs?","options":["Data augmentation","Guardrails","Faster GPUs","Dropout layers"],"answer":[1],"explanation":"Lecture discusses guardrails stopping harmful responses (Bias - I (W4)).","verified":"lecture","c":239},{"q":"Which of the following is true about bias?","options":["It never exists.","It sometimes exists.","It only exists in American-created models.","It always exists."],"answer":[3],"explanation":"'we agree that bias is always there; we agree that humans are not perfect' (Bias - I (W4)).","verified":"lecture","c":240},{"q":"A researcher is evaluating a facial recognition model they helped develop. During testing, they select images where the model performs better, such as images with ideal lighting or frontal faces, while ignoring diverse or difficult cases (like low-light, non-white faces, or side angles). Which type of bias is this?","options":["Reporting bias","Sampling bias","Experimenter's bias","Historical bias"],"answer":[2],"explanation":"Researcher choosing favourable test cases to confirm their own model = experimenter's (confirmation) bias; not sampling/reporting/historical.","verified":"reasoning","c":241},{"q":"What is the issue with evaluating models only based on accuracy?","options":["Accuracy only reflects hardware performance.","Accuracy doesn't reveal bias.","Accuracy checks for fairness.","Accuracy changes the labelling."],"answer":[1],"explanation":"'what if accuracy is used as a metric on unbalanced data, it could be biased' (Source of Bias (W4)); accuracy alone does not reveal bias.","verified":"lecture","c":242},{"q":"Why might using Western-aligned datasets be problematic for the Indian demographic?","options":["The datasets are too large which may slow down training time.","They are written in a different language.","They don't reflect Indian social/societal norms.","They contain too many low-resolution images."],"answer":[2],"explanation":"'existing data sets are aligned towards the Western societies' (NLPositionality/Perspective API example, Bias - II (W4)).","verified":"lecture","c":243},{"q":"What is a 'stereotype'?","options":["A factual statement that applies to all humans.","A scientifically proven characteristic.","A legal rule used to govern a society.","A widely held belief about some group/entity."],"answer":[3],"explanation":"Stereotype = a widely held (over-generalised) belief about a group (StereoSet discussion).","verified":"lecture","c":244,"rel":[["Jul-Oct 2026",4,1]]},{"q":"What does the CrowS-Pairs dataset contain?","options":["Pairs of sentences that differ only in minimally distant social bias.","Dialogues between humans and a chatbot.","Pairs of biased and unbiased images.","Code snippets with and without bugs."],"answer":[0],"explanation":"CrowS-Pairs: 'two sentences are minimally distant... bias in the words that are changed' (Bias - I (W4)).","verified":"lecture","c":245},{"q":"What is sampling bias?","options":["When historical data reflects inequalities that existed in the world at that time.","When data is collected from a completely random and diverse group.","If proper randomization is not used during data collection.","When a model builder keeps training a model until it produces a result that aligns with their original hypothesis."],"answer":[2],"explanation":"Sampling bias: proper randomization is not used during data collection (Google ML fairness taxonomy).","verified":"reasoning","c":246}]},{"year":2025,"session":"Jul-Oct 2025","week":3,"source":"https://github.com/progiez/nptel-assignment-answers/blob/main/responsible-and-safe-ai-systems/week-03.md (questions only); https://www.youtube.com/watch?v=dRsKLwahYmk; https://www.youtube.com/watch?v=-IQ3LYth_K0","questions":[{"q":"What is the definition of \"Machine Unlearning\"?","options":["Removing the influences of training data from a trained model","The ability of a machine learning model to adapt to new data","A technique used to compress machine learning models","The ability of a machine learning model to learn a variety of data"],"answer":[0],"explanation":"Unlearning = removing the influence of (specific) training data from a trained model (Unlearning (W3)).","verified":"lecture","c":247},{"q":"What might be some types of information that one might want to remove from model data? (Select all that apply.)","options":["Private data","Toxic or unsafe content","Accurate information","Model hyperparameter settings","Stale knowledge"],"answer":[0,1,4],"explanation":"'edit/remove private data, stale knowledge, copyrighted materials, toxic/unsafe content, dangerous capabilities' (Unlearning (W3)).","verified":"lecture","c":248},{"q":"What is GDPR's Article 17 about in the context of Machine Learning?","options":["Right to be remembered","Right to be modified","Right to be distributed","Right to be forgotten"],"answer":[3],"explanation":"GDPR 'right to erasure'... 'right to be forgotten' (Unlearning (W3)).","verified":"lecture","c":249,"rel":[["Jul-Oct 2026",3,1]]},{"q":"What are the steps in the SISA approach?","options":["Sampled, Isolated, Stopped, Aggregated","Sharded, Imitate, Sliced, Annotated","Sharded, Isolated, Sliced, Aggregated","Sampled, Imitate, Stopped, Annotated"],"answer":[2],"explanation":"'SISA training is called sharded, isolated, sliced and aggregated' (Unlearning (W3)).","verified":"lecture","c":250},{"q":"What is Membership Inference Attack (MIA) used for?","options":["To train LLMs faster","To improve the models robustness","To remove accurate data","To classify between training and unseen data"],"answer":[3],"explanation":"'membership inference attack is a method to distinguish training data from unseen data; a classifier is trained for this' (Approximate unlearning (W3)).","verified":"lecture","c":251},{"q":"What is the role of differential privacy?","options":["To improve model accuracy","To make the model forget everything","To make models indistinguishable with/without certain data points","To speed up training time"],"answer":[2],"explanation":"DP guarantees the model is (nearly) indistinguishable whether or not a given data point was included (Approximate unlearning (W3) 'unlearning via DP').","verified":"reasoning","c":252},{"q":"Which benchmarks are used to evaluate unlearning in LLMs? (Select all that apply.)","options":["TOFU","GLUE","WMDP","GUIDE"],"answer":[0,2],"explanation":"Benchmarks covered: 'TOFU, a task of fictitious unlearning for LLMs' and 'WMDP, weapons of mass destruction proxy' (Evaluation of Unlearning and Graph Unlearning Part 1 (W3)); GUIDE is a graph-unlearning method, GLUE is not an unlearning benchmark.","verified":"lecture","c":253},{"q":"Case: A hospital wants to share patient health data with research institutions to support public health studies. However, it must ensure that a patient's identity cannot be inferred. To achieve this, the hospital generates and sends aggregate statistics to the institute. Which form of unlearning is this?","options":["Exact unlearning","Unlearning via differential privacy","Just ask for unlearning","Empirical Unlearning"],"answer":[1],"explanation":"Releasing aggregate statistics so no individual can be inferred is the differential-privacy approach (lecture taxonomy: exact / unlearning via DP / empirical / just ask, Unlearning (W3)).","verified":"reasoning","c":254},{"q":"Which isn't a type of graph unlearning?","options":["Node unlearning","Edge unlearning","Label unlearning","Node feature unlearning"],"answer":[2],"explanation":"'three types of removal requests: node removal, edge removal and node feature removal' (Evaluation of Unlearning and Graph Unlearning Part 2 (W3)).","verified":"lecture","c":255},{"q":"Which methods are used for Node unlearning? (Select all that apply.)","options":["GraphEraser","GUIDE","Projector","GraphdEditor","GNNDelete","MEGU"],"answer":[0,1,3,4,5],"explanation":"Corrected after checking the lecture (was: GraphEraser, GNNDelete, MEGU). Lecture table (Evaluation of Unlearning and Graph Unlearning Part 2 (W3)): GraphEraser does node+edge (not feature); 'GUIDE can do node, cannot do edge, cannot do feature'; 'Projector does only feature unlearning'; 'Graph Editor does all three'; 'GNNDelete and MEGU do all three'. So every method except Projector supports node unlearning.","verified":"lecture","c":256,"rel":[["Jul-Oct 2026",3,1]]},{"q":"What are \"hidden representations\"?","options":["The final model outputs","Raw training data stored in memory","Intermediate activation vector
