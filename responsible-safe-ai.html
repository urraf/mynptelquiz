s captured during model execution","The model's loss values during training"],"answer":[2],"explanation":"'we collect the intermediate vectors for different prompts and these act as the hidden representations... hidden activations' (Representation Engineering - Hands on (W3)).","verified":"lecture","c":257}]},{"year":2025,"session":"Jul-Oct 2025","week":2,"source":"https://github.com/progiez/nptel-assignment-answers/blob/main/responsible-and-safe-ai-systems/week-02.md (questions only); https://www.youtube.com/watch?v=LPNdgZqg1bc; https://www.youtube.com/watch?v=h7RnkknhMaY","questions":[{"q":"Which of the following is true?","options":["Extremistan has thin tails while Mediocristan has long tails","Mediocristan distributions are harder to predict than Extremistan","In Extremistan, the total is determined by a few large events with tyranny of the accidental","Extremistan has mild randomness while Mediocristan has wild randomness"],"answer":[2],"explanation":"Extremistan: 'total is determined by a few large events... tyranny of the accidental'; Mediocristan thin-tailed, mild randomness (Robustness Part 1 (W2)).","verified":"lecture","c":258},{"q":"What is the key difference between covariate shift and concept shift in distribution shifts?","options":["Covariate shift changes P(y|x) while concept shift changes P(x)","Covariate shift changes P(x) while P(y|x) remains constant, concept shift changes P(y|x) while P(x) remains constant","Both change P(x) and P(y|x) simultaneously","Covariate shift affects labels while concept shift affects features"],"answer":[1],"explanation":"Covariate shift: 'P(x) changes between train and test but P(y|x) does not'; concept shift: input distribution same, decision boundary changes (Robustness Part 2 (W2)).","verified":"lecture","c":259},{"q":"In the AugMix methodology, what is the primary advantage over uncontrolled random augmentations?","options":["It uses skip connections to keep images recognizable while applying diverse augmentations","It requires less computational power","It only applies single augmentations instead of multiple","It focuses on geometric transformations only"],"answer":[0],"explanation":"AugMix: 'uncontrolled randomization can make images unrecognizable... mixes random augmentations to keep images recognizable... also a skip connection' (Robustness Part 2 (W2)).","verified":"lecture","c":260},{"q":"In the context of adversarial attacks, what does \"transferability\" specifically refer to?","options":["The ability to transfer attacks from one domain to another","The ability to transfer defenses across different architectures","The ability to convert white-box attacks to black-box attacks","The ability of adversarial examples crafted for one model to work on other models"],"answer":[3],"explanation":"Transferability = adversarial examples crafted for one model also fool other models (basis of black-box transfer attacks).","verified":"reasoning","c":261},{"q":"Black Swan lies in which of the following categories?","options":["Known Knowns","Known Unknowns","Unknown Knowns","Unknown Unknowns"],"answer":[3],"explanation":"NPTEL official answer key (Jul-Oct 2024 W2 Q5, Jul-Oct 2025 W2 Q5).","verified":"official","c":420,"rel":[["Jul-Oct 2024",2,1]]},{"q":"Which of the following are valid approaches for defending against adversarial attacks? (Select all that apply)","options":["Data augmentation techniques","Adversarial training using adversarial examples during training","Using more data and larger models","Reducing model complexity to avoid overfitting","Adversarial pretraining on larger datasets like ImageNet"],"answer":[0,1,2,4],"explanation":"Corrected after checking the lecture (was: Data augmentation techniques, Adversarial training using adversarial examples during training, Adversarial pretraining on larger datasets like ImageNet). Adversarial attacks are not in the recorded W2 transcripts; Hendrycks-style adversarial-robustness material lists data augmentation, adversarial training, adversarial pretraining and larger models/more data as robustness improvers; only 'reducing model complexity' is wrong.","verified":"unsure","c":263},{"q":"In the RLHF optimization objective, why is a KL-divergence penalty term added to the reward maximization?","options":["To prevent the model from generating repetitive outputs","To ensure the model stays close to the original pretrained model","To improve the computational efficiency of the training process","To increase the diversity of generated samples"],"answer":[1],"explanation":"KL penalty keeps the RLHF policy close to the pretrained/SFT model (RLHF (W2)).","verified":"lecture","c":264},{"q":"What does \"reward hacking\" specifically refer to in the context of RLHF?","options":["Humans providing incorrect feedback to manipulate the system","External attackers compromising the reward model","The reward model overfitting to the training data","The model finding ways to maximize the reward function without achieving the intended behavior"],"answer":[3],"explanation":"'optimizing for an imperfect reward proxy leads to reward hacking' (AI Alignment (W2)).","verified":"lecture","c":265},{"q":"Identify the equations that can lead to a long-tailed distribution.","options":["Idea * student * resources * time","Idea * student + resources * time","Idea + student + resource + time","Idea - student * resource - time"],"answer":[0],"explanation":"NPTEL official answer key (Jul-Oct 2024 W2 Q4, Jul-Oct 2025 W2 Q9, Jul-Oct 2026 W2 Q12).","verified":"official","c":419,"rel":[["Jul-Oct 2026",2,1],["Jul-Oct 2024",2,1]]},{"q":"What is the primary advantage of using pairwise comparisons over direct scalar ratings in human feedback collection?","options":["Pairwise comparisons are faster to collect","They require fewer human annotators","Human judgments are noisy and miscalibrated, but pairwise comparisons are more reliable","They provide more granular feedback information"],"answer":[2],"explanation":"'Problem two: human judgments are noisy and miscalibrated... instead of direct ratings ask for pairwise comparisons, which can be more reliable' (RLHF (W2)).","verified":"lecture","c":267},{"q":"What is a major challenge with using a single reward function in RLHF?","options":["It is computationally expensive to optimize","It cannot represent a diverse society of humans","It requires too much training data","It is unstable during training"],"answer":[1],"explanation":"'a single reward function cannot represent a diverse society of humans' (AI Alignment (W2)).","verified":"lecture","c":268},{"q":"What is Direct Preference Optimization (DPO) equivalent to in the context of RLHF component removal?","options":["RLHF - Human Feedback","RLHF - Reward Model","RLHF - RL","RLHF - Policy Optimization"],"answer":[1],"explanation":"'reward model, if it is removed, it will be direct preference optimization'; removing RL gives just a fine-tuned model (AI Alignment (W2)).","verified":"lecture","c":269,"rel":[["Jul-Oct 2026",2,0]]}]},{"year":2025,"session":"Jul-Oct 2025","week":1,"source":"https://github.com/progiez/nptel-assignment-answers/blob/main/responsible-and-safe-ai-systems/week-01.md (questions only); https://www.youtube.com/watch?v=mmG6-qB3Ka4; https://www.youtube.com/watch?v=nKd5DC_J2D0","questions":[{"q":"According to the risk decomposition framework, which combination of factors would result in the HIGHEST risk from an AI system deployed in a critical infrastructure setting?","options":["Low vulnerability, high hazard exposure, low hazard severity","High vulnerability, low hazard exposure, high hazard severity","High vulnerability, high hazard exposure, high hazard severity","Low vulnerability, low hazard exposure, high hazard severity"],"answer":[2],"explanation":"Risk = vulnerability x hazard exposure x hazard (disaster risk equation, AI Risk Part 3 (W1)); all three high maximises risk.","verified":"lecture","c":270,"rel":[["Jul-Oct 2026",1,1]]},{"q":"The concept of treacherous turns in AI systems refers to:","options":["AI systems making computational errors during complex calculations","AI systems behaving differently once they reach sufficient intelligence","AI systems being hacked by malicious actors","AI systems consuming too much computational power"],"answer":[1],"explanation":"Treacherous turn = an AI behaving differently (e.g. turning against overseers) once capable enough; listed among speculative hazards in AI Risk Part 4 (W1).","verified":"reasoning","c":271},{"q":"In the context of AI race dynamics, what is the primary concern regarding competitive pressure between nations and corporations?","options":["It will make AI systems too expensive for general use","It will result in compatible AI standards globally","It will slow down AI innovation and progress","It may lead to rushed development that compromises safety measures"],"answer":[3],"explanation":"'pushing nations and corporations to rush on AI development' at the expense of safety (AI Risk Part 3 (W1)).","verified":"lecture","c":272},{"q":"The \"Swiss cheese model\" mentioned in organizational risks suggests that:","options":["Organizations should have a single, very strong safety measure","Safety measures should be implemented randomly across the organization","Multiple layers of defense compensate for individual weaknesses","Safety measures are unnecessary if the AI system is well-designed"],"answer":[2],"explanation":"'Swiss cheese model... multiple layers of defense compensate for each other's individual weaknesses' (AI Risk Part 3 (W1)).","verified":"lecture","c":273},{"q":"Which scenario best illustrates the concept of proxy gaming?","options":["An AI chess program that cheats by accessing opponent's strategy","A recommendation system optimizing for user engagement rather than user well-being","An AI translator that produces grammatically incorrect sentences","A facial recognition system that fails to identify certain ethnic groups"],"answer":[1],"explanation":"Proxy gaming = 'agents over-optimize and game faulty proxies' (boat-race example, AI Risk Part 4 (W1)); engagement-vs-wellbeing is the classic proxy.","verified":"lecture","c":274},{"q":"\"A factory robot confuses a human worker for a box of vegetables and pushes the person, resulting in death.\" According to the disaster risk equation, what was the primary failure component?","options":["Hazard (misclassification capability)","Hazard Exposure (human-robot proximity)","Vulnerability (employee safety protocols)","All components failed equally"],"answer":[0],"explanation":"Lecture (AI Risk Part 3 (W1)) decomposes the robot case as 'vulnerability is misclassifying veggies to humans, hazard exposure is employees and robots around each other, hazard is injury or death'; no option pairs misclassification with vulnerability, and the item's own wording maps misclassification to Hazard, so the current key is kept.","verified":"unsure","c":275},{"q":"According to the risk taxonomy presented, malicious use of AI differs from rogue AI primarily in that:","options":["Malicious use involves intentional harmful deployment by humans, while rogue AI acts independently","Malicious use only affects cybersecurity, while rogue AI affects all domains","Malicious use is easier to detect than rogue AI behavior","Malicious use requires more advanced AI capabilities than rogue AI"],"answer":[0],"explanation":"Malicious use = humans deliberately using AI for harm; rogue AI = AI acting against human intent on its own (risk taxonomy, AI Risk Part 2 (W1)/AI Risk Part 3 (W1)).","verified":"reasoning","c":276},{"q":"Deceptive Alignment in AI systems is:","options":["AI systems that are openly hostile to humans","AI systems that appear to be following instructions but are actually pursuing different goals","AI systems that cannot understand human language properly","AI systems that work too slowly to be effective"],"answer":[1],"explanation":"'the robot is appearing as though it's picking the ball but it's never picking the ball... it's deceptively aligned' (AI Risk Part 4 (W1)).","verified":"lecture","c":277},{"q":"How do you identify and avoid hazards in ML systems according to the disaster risk equation framework?","options":["Alignment","Robustness","Monitoring","Systemic Safety"],"answer":[2],"explanation":"'hazard exposure... can be reduced by monitoring, identifying the hazard' (AI Risk Part 3 (W1)); robustness withstands hazards, alignment reduces inherent hazards.","verified":"lecture","c":278},{"q":"Red teaming in AI safety primarily serves to:","options":["Accelerate model training","Identify system vulnerabilities","Improve computational efficiency","Reduce inference latency"],"answer":[1],"explanation":"Red teaming = adversarially probing a system to find vulnerabilities/failure modes.","verified":"reasoning","c":279},{"q":"Which technique is most effective for detecting deceptive alignment?","options":["Training the model with more than 1000 samples","Mechanistic interpretability","Increasing model parameters","Reward modeling"],"answer":[1],"explanation":"Deceptive models behave well on outputs, so detection needs looking inside the model (mechanistic interpretability); the other options do not detect deception.","verified":"reasoning","c":280},{"q":"RoBERTa succeeds in reasoning tasks where BERT fails due to:","options":["Better tokenization","Emergent capabilities from scaling","Improved attention mechanisms","Larger vocabulary size"],"answer":[1],"explanation":"'emerging capabilities are common... RoBERTa succeeds in reasoning task where BERT fails completely' (AI Risk Part 4 (W1)).","verified":"lecture","c":281}]},{"year":2025,"session":"Jul-Oct 2025","week":0,"source":"https://www.youtube.com/watch?v=uq3pwfdAwz4 (A3 Education, Accepted Answers); https://www.youtube.com/watch?v=6mYKtGq9pVY; https://www.youtube.com/watch?v=3roqPZrtevw","questions":[{"q":"What is the definition of Artificial Intelligence?","options":["a programming language used in data analysis","a type of hardware designed for computing","a software used to generate text/media","the ability for a computer to imitate human behavior"],"answer":[3],"verified":"official","c":282},{"q":"Which type of machine learning uses a combination of a small amount of labeled data and a large amount of unlabeled data to improve learning accuracy?","options":["Reinforcement Learning","Unsupervised Learning","Supervised Learning","Semi-Supervised Learning"],"answer":[3],"verified":"official","c":283},{"q":"Which of the following is true? Select all that apply.","options":["A model with high bias leads to underfitting of the model.","A model with high variance leads to overfitting of the model.","High variance and high bias lead to a more optimal model.","Decreasing model complexity results in low bias but high variance."],"answer":[0,1],"verified":"official","c":284},{"q":"What is an example of a biased AI system? Select all that apply.","options":["An AI-powered hiring algorithm that ranks resumes based on ethnicity of the candidate.","A chatbot that fails to understand slang or technical jargon.","A recommendation system that shows different ads to different users based on search history.","A weather prediction system that fails to predict hurricanes due to insufficient data."],"answer":[0],"verified":"official","c":285},{"q":"What does \"transparency\" mean in an AI system?","options":["Making the AI unknown to users.","Explaining how the AI made the decision in a clear way.","Using very little data as input to the AI system.","Optimizing the AI system for speed."],"answer":[1],"verified":"official","c":286},{"q":"What is the goal of responsible AI?","options":["To make AI faster.","To reduce computation.","To make AI adaptable.","To ensure AI behaves in a fair and ethical way."],"answer":[3],"verified":"official","c":287},{"q":"What is one risk when using an AI system \"unethically\"?","options":["The AI system may become too slow.","The AI system may become human.","The AI system causes harm.","None of the above."],"answer":[2],"verified":"official","c":288},{"q":"What is the purpose of a validation dataset?","options":["To train the model on new data.","To test the final accuracy of the model.","To tune the hyperparameters and prevent overfitting.","All of the above."],"answer":[2],"verified":"official","c":289},{"q":"What is the bias-variance tradeoff in machine learning?","options":["A balance between the training dataset size and testing dataset size.","Trying to increase bias and variance to improve model accuracy.","Finding a balance between simplicity and complexity of a model resulting in optimal performance.","Deciding between supervised and unsupervised learning."],"answer":[2],"verified":"official","c":290},{"q":"Which of the following is an example of supervised learning?","options":["An AI learns to play a game through trial and error.","A classification model trained on images labelled \"cats\" and \"dogs\".","An AI that groups customers together based on their purchases.","A chatbot that remembers past conversations."],"answer":[1],"verified":"official","c":291},{"q":"What is the definition of \"algorithmic bias\"?","options":["When an AI system makes decisions faster than humans.","When a model prioritizes bias over variance.","When an AI system produces unfair or discriminatory outcomes due to biased data or design","When the model only runs on certain devices."],"answer":[2],"verified":"official","c":292},{"q":"What is the difference between supervised and unsupervised learning?","options":["Supervised learning uses labeled data, while unsupervised learning does not.","Supervised learning is used only for robotics, while unsupervised learning is for software.","Supervised learning requires no data, while unsupervised learning requires large datasets.","Supervised learning is always faster than unsupervised learning."],"answer":[0],"verified":"official","c":293}]},{"year":2024,"session":"Jul-Oct 2024","week":12,"source":"https://www.youtube.com/watch?v=F2_0FlSaA68; https://www.youtube.com/watch?v=rYZn6MMmrUU","questions":[{"q":"In graph theory, how many nodes does a single edge connect?","options":["One node","Two nodes","Three nodes","Any number of nodes"],"answer":[1],"explanation":"Research Overview: Higher Order Structures for Graph Explanations: \"two nodes are connected by a single edge ... we cannot have an edge connecting three nodes\".","verified":"lecture","c":294},{"q":"Which of the following tasks do Graph Neural Networks (GNNs) typically struggle with?","options":["Node classification","Link prediction","Cycle detection","Graph clustering"],"answer":[2],"explanation":"Research Overview: Higher Order Structures for Graph Explanations: \"it is well known that GNNs do not perform very well on cycle detection\".","verified":"lecture","c":295},{"q":"In the context of cell complexes, what does a p-cell represent?","options":["A cell with p sides","A cell with p vertices","An element of dimension p","A cell with p edges"],"answer":[2],"explanation":"Research Overview: Higher Order Structures for Graph Explanations: a p-cell \"just refers to a cell of dimension p\".","verified":"lecture","c":296},{"q":"What does the acronym FORGE stand for in the context of graph learning?","options":["Framework for Higher-Optimized Representation in Graph Environments","Framework for Higher-Order Representations in Graph Explanations","Functional Optimization for Regular Graph Embeddings","Fast Operational Research for Graph Equations"],"answer":[1],"explanation":"Research Overview: Higher Order Structures for Graph Explanations slide: \"FORGE (Framework For Higher-Order Representations In Graph Explanations)\".","verified":"lecture","c":297},{"q":"After applying FORGE, how do explainers perform compared to Random baselines?","options":["They consistently surpass Random baselines","They perform equally to Random baselines","They occasionally underperform Random baselines","They consistently underperform compared to Random baselines"],"answer":[0],"explanation":"Research Overview: Higher Order Structures for Graph Explanations: \"after applying Forge all explainers consistently surpass random\".","verified":"lecture","c":298},{"q":"Based on the lecture content: What can the boundary relation be loosely translated to in graph theory?","options":["Nodes","Edges","Faces","Weights"],"answer":[1],"explanation":"Research Overview: Higher Order Structures for Graph Explanations: a boundary relation \"in very simple terms ... is just the analog of an edge in a graph\".","verified":"lecture","c":299},{"q":"What does guardedness mean as discussed in the lecture?","options":["Personal information is guarded from being revealed to the outside world due to privacy reasons","A class is guarded if a classifier can't identify data points belonging to that class","A model is guarded if you cannot retrieve training data from it","An attribute is guarded if you can't classify along that attribute"],"answer":[3],"explanation":"Research Overview: Representation Surgery: guardedness = \"you cannot draw a classifier on the representations ... to classify this attribute Z\".","verified":"lecture","c":300},{"q":"What is the process/transformation used to achieve guardedness?","options":["Affine Concept Erasure","Affine Attribute Erasure","Affine Model Erasure","Affine Class Erasure"],"answer":[0],"explanation":"Research Overview: Representation Surgery: an affine concept [erasure] is an affine transformation Wx+b \"such that the representations ... are guarded with respect to attribute Z\".","verified":"lecture","c":301},{"q":"How are steering vectors generally defined as discussed in the lecture?","options":["v = μ0 − μ1 where μ0 is the mean of undesirable class and μ1 is the mean of desirable class","v = μ0 − μ1 where μ0 is the mean of desirable class and μ1 is the median of desirable class","v = μ0 − μ1 where μ0 is the mean of desirable class and μ1 is the mean of undesirable class","v = μ0 − μ1 where μ0 is the mean of undesirable class and μ1 is the median of undesirable class"],"answer":[2],"explanation":"Research Overview: Representation Surgery: steering vector v = mu0 - mu1 \"where mu1 is the undesirable class mean\" and mu0 the desirable class mean.","verified":"lecture","c":302},{"q":"Which of the following is a limitation of graphs as a data structure?","options":["They can only represent hierarchical relationships","They can only model pairwise relationships between nodes","They are restricted to acyclic structures","They cannot represent directed edges"],"answer":[1],"explanation":"Research Overview: Higher Order Structures for Graph Explanations: \"in graphs we can only model pairwise relationships because one edge only connects two nodes\".","verified":"lecture","c":303}]},{"year":2024,"session":"Jul-Oct 2024","week":11,"source":"https://www.youtube.com/watch?v=yEveKn72vkA (QuestKey, Accepted Answers); https://www.youtube.com/watch?v=nBrb2x3o1Xo; https://www.youtube.com/watch?v=yZjV8uAXMc4","questions":[{"q":"In the context of the paper SaGE, what is semantic consistency?","options":["Semantically equivalent questions should yield semantically equivalent answers","Semantically equivalent questions should yield same answers","Same questions should yield same answers","Same questions should yield semantically equivalent answers"],"answer":[0],"verified":"official","c":304},{"q":"Why do models struggle with tasks in \"moral scenarios\"?","options":["Models lack the ability to process large datasets efficiently","Models prioritise emotion over logic in moral decision-making","The models are limited by insufficient computational power","Conflicting training data due to different morals that people have"],"answer":[3],"verified":"official","c":305},{"q":"What metric was used to determine the quality of the paraphrase of the questions in the SaGE paper?","options":["BERTScore","Parascore","Jaccard Similarity","Cosine Similarity"],"answer":[1],"verified":"official","c":306},{"q":"How does the SaGE paper relate entropy and consistency?","options":["More Entropy implies consistency","Less entropy implies inconsistency","Less Entropy implies consistency","More entropy implies inconsistency"],"answer":[2,3],"verified":"official","c":307},{"q":"Identify the statements that are TRUE with respect to the current LLMs.","options":["LLMs are not consistent in their generation","A good accuracy on benchmark datasets correlates with high consistency","LLMs are consistent in their generation","A good accuracy on benchmark datasets does not correlate with high consistency"],"answer":[0,3],"verified":"official","c":308},{"q":"Why is AI Governance important?","options":["To prevent AI from learning new tasks independently","To limit the efficiency of AI in performing complex tasks","Ensure AI isn't used for unethical acts","To prevent AI from being used in scientific research"],"answer":[2],"verified":"official","c":309},{"q":"What are some aspects of AI Governance that are in focus in the current times?","options":["Revealing the amount of compute used during training past a certain compute threshold","Limiting AI systems to only perform manual labor tasks","Ensuring right to erasure","Prohibiting the use of AI in any form of automation"],"answer":[0,2],"verified":"official","c":310},{"q":"Which of the following are key OECD AI Principles?","options":["Inclusive growth, sustainable development, and well-being","Limiting AI to industrial use cases","Transparency and explainability","Restricting international AI collaboration"],"answer":[0,2],"verified":"official","c":311},{"q":"As discussed in the lecture, When you have domain specific task, what kind of finetuning is preferred?","options":["Full-model finetuning","Layer-specific finetuning","Head-level finetuning","Retraining"],"answer":[0,1],"verified":"official","c":312},{"q":"What are the cons of full-model finetuning?","options":["Overfitting","Catastrophic forgetting","Increase in parameters","Change in architecture"],"answer":[1],"verified":"official","c":313},{"q":"What are adapters?","options":["Remove existing layers from a model","Convert a model to a simpler architecture","Replace the model's original parameters entirely","Add additional layers to a preexisting architecture"],"answer":[3],"verified":"official","c":314},{"q":"What is instruction finetuning?","options":["Model is trained to ignore user instructions and operate independently based on its previous training","Model's training objective is to follow the directions provided by the user when performing the task","Process of training a model solely on instruction data without any real-world data","Modifying the model's architecture to include specific instructions directly within its layers"],"answer":[1],"verified":"official","c":315}]},{"year":2024,"session":"Jul-Oct 2024","week":10,"source":"https://www.youtube.com/watch?v=HOhJsaG_e54 (QuestKey, Accepted Answers); https://www.youtube.com/watch?v=bfPKegicAlY; https://www.youtube.com/watch?v=yNNT6S9IwP0","questions":[{"q":"Which of the following are challenges faced by AI in the current era? (Select all that apply)","options":["AI systems being biased","AI models requiring zero human intervention","AI systems being completely unbiased","AI models being trained on harmful data","AI systems always making ethical decisions","AI systems using transformer models"],"answer":[0,3],"verified":"official","c":316},{"q":"What does the abbreviation \"AGI\" stand for?","options":["Artificial General Intelligence","Automated Guided Interface","Artificial General Information","Artificial Geospatial Intelligence"],"answer":[0],"verified":"official","c":317,"rel":[["Jul-Oct 2025",10,0]]},{"q":"Which of the following best describes one of the possible definitions of AGI?","options":["AI systems that are limited to specific tasks","AI models trained for basic automation","AI systems surpassing human intelligence","AI systems which show high training accuracy"],"answer":[2],"verified":"official","c":318,"rel":[["Jul-Oct 2025",10,1]]},{"q":"Which of the following are potential challenges associated with AGI? (Select all that apply)","options":["Chaotic power struggles","Utilization for selfish and short-term objectives","Guaranteed long-term global stability","Universal agreement on AGI's ethical use","Potential misuse by a few for personal gain","Non-existential risks"],"answer":[0,1,4],"verified":"official","c":319},{"q":"What is considered the ideal way to balance the development of AI models?","options":["Ensuring a safety-performance trade-off","Maximizing performance without considering safety","Focusing solely on safety at the expense of performance","Ignoring both safety and performance to expedite development"],"answer":[0],"verified":"official","c":320},{"q":"What should governments primarily focus on concerning AI systems at present?","options":["How to eliminate AI research entirely","How to encourage unrestricted AI development without regulations","How to ignore AI advancements altogether","How to govern these AI systems and make them safe"],"answer":[3],"verified":"official","c":321},{"q":"What are the primary focuses of the EU AI Act? (Select all that apply)","options":["Regulating the use of AI to ensure safety, transparency, and accountability","Banning all forms of AI development in Europe","Promoting the unregulated use of AI across all sectors","Requiring all AI systems to be open-source and publicly accessible","Banning systems with cognitive behavioral manipulation of people or specific vulnerable groups"],"answer":[0,4],"verified":"official","c":322},{"q":"What does the abbreviation \"GDPR\" stand for?","options":["Global Data Privacy Regulation","General Data Protection Rule","General Data Protection Regulation","Global Data Protection Requirement"],"answer":[2],"verified":"official","c":323},{"q":"Which of the following is a way to protect personal data?","options":["Giving people more power over their data","Allowing unrestricted access to personal data","Reducing transparency in data usage","Increasing the collection of personal data without consent"],"answer":[0],"verified":"official","c":324},{"q":"What is one challenge even after training a model on unbiased data?","options":["Implicit bias may still exist in the model","No challenge, model will be completely free of any bias","The model will exhibit perfect performance in all scenarios","The model will have issues related to data processing"],"answer":[0],"verified":"official","c":325},{"q":"Among the following, which type of biased system is considered particularly harmful?","options":["Decision systems","Recommendation systems","Entertainment systems","Weather forecasting systems"],"answer":[0],"verified":"official","c":326}]},{"year":2024,"session":"Jul-Oct 2024","week":9,"source":"https://www.youtube.com/watch?v=FuaHdJ9MIl0 (QuestKey, Accepted Answers); https://www.youtube.com/watch?v=wkZsx8t8haU; https://www.youtube.com/watch?v=SPuVMNXpZTk","questions":[{"q":"How is AI best described?","options":["A multidisciplinary problem","A single-field issue","An entirely theoretical concept","A purely mathematical challenge"],"answer":[0],"verified":"official","c":327},{"q":"Which of the following statement is true regarding the development and implementation of AI systems?","options":["Policy considerations and technical details are equally important","Technical details alone are sufficient for effective AI development","Policy considerations are only important in few countries","AI systems do not require any policy or ethical considerations"],"answer":[0],"verified":"official","c":328,"rel":[["Jul-Oct 2025",9,1]]},{"q":"Based on the lecture content: Which of the following statements about AGI is appropriate?","options":["Learning new skills on its own and having emotional intelligence can be characteristics of AGI","AGI cannot learn new skills independently and lacks emotional intelligence","AGI is limited to performing specific tasks and does not require emotional intelligence","AGI only focuses on technical problem-solving without any consideration of emotional aspects"],"answer":[0],"verified":"official","c":329},{"q":"Based on the lecture content: From a mathematical perspective, which of the following is not considered a major problem in AI today, compared among others?","options":["Explainability","Hallucinations","Data privacy","Bias"],"answer":[2],"verified":"official","c":330,"rel":[["Jul-Oct 2025",9,1]]},{"q":"Which of the following statements best reflects the significance of information rights?","options":["The right to inclusion of information and the right to exclusion of information are both important","The right to exclusion of information is more important","The right to inclusion of information is irrelevant compared to other rights","The right to inclusion is important but not right to exclusion"],"answer":[0],"verified":"official","c":331},{"q":"Which of the following statements is true regarding checking for copyrighted information in black-box models?","options":["There is no way to check whether models have copyrighted information in black-box models","All black-box models provide transparency for verifying copyrighted information","Copyright information can be easily extracted from black-box models","Black-box models disclose their training data for copyright verification"],"answer":[0],"verified":"official","c":332},{"q":"Who is primarily responsible for self-regulation in the context of AI and technology?","options":["Individuals / Individual organizations","Government agencies","Only the organizations with more than 1 crore turnover","International organizations"],"answer":[0],"verified":"official","c":333,"rel":[["Jul-Oct 2025",9,1]]},{"q":"What role does the government play in the regulation and deployment of large language models (LLMs)?","options":["Strict regulation is provided by the government, which issues licenses to deploy or use LLMs","The government does not regulate LLMs and leaves all oversight to private companies","The government only provides financial support for LLM development without any regulatory role","The government encourages unrestricted use of LLMs without any form of licensing"],"answer":[0],"verified":"official","c":334},{"q":"Which of the following is a notable drawback of AI?","options":["Environmental effects, such as high water and energy consumption","Less accuracy in predictions and results","Usage of transformers in models","Consuming more training time"],"answer":[0],"verified":"official","c":335},{"q":"Jailbreaking AI models _______________?","options":["Produce harmful content","Improve the model's computational efficiency","Increase the model's interpretability","Enhance the model's ethical standards"],"answer":[0],"verified":"official","c":336},{"q":"Which of the following are reasons for the delays in AI regulation?","options":["Lack of domain expertise","Challenge of regulating bad without compromising good","Lack of funding","Political pressures","Overabundance of regulations already in place"],"answer":[0,1],"verified":"official","c":337}]},{"year":2024,"session":"Jul-Oct 2024","week":8,"source":"https://www.youtube.com/watch?v=hL0Yvw96YH8 (QuestKey, Accepted Answers); https://www.youtube.com/watch?v=rGpqGo9vre4; https://www.youtube.com/watch?v=WyToauRWAlo","questions":[{"q":"Which of the following best describes the purpose of pixel attribution methods in image classification by neural networks?","options":["To increase the resolution of an image by modifying pixel values.","To highlight the pixels that were most relevant for the neural network's decision in classifying an image.","To reduce the noise in an image by adjusting irrelevant pixels.","To segment the image into different regions based on pixel similarity."],"answer":[1],"verified":"official","c":338},{"q":"Which of the following out negative activations and gradients.","It back propagates gradients with all activations zeroed out.","It focuses on highlighting both negative and positive contributions.","It requires padding 1 to the image before backpropagation."],"answer":[0],"verified":"official","c":343,"rel":[["Jul-Oct 2025",8,1]]},{"q":"What does a lack of change in saliency maps after randomizing the layers indicate?","options":["The saliency maps are highly accurate in reflecting the model's learning.","The saliency maps cannot be deceptive.","The saliency maps are unreliable and may not accurately capture the model's learned features.","The saliency maps provide detailed visualizations of the model's internal mechanisms"],"answer":[2],"verified":"official","c":344},{"q":"What is a key feature of LIME (Local Interpretable Model-agnostic Explanations)?","options":["It requires access to the internal workings of the model to generate explanations.","It only works with tabular data and cannot be applied to text.","It provides explanations that are globally faithful across all predictions.","It can be used with any black box model, regardless of the model's internal structure."],"answer":[3],"verified":"official","c":345},{"q":"What is the primary basis of SHAP (SHapley Additive exPlanations) for generating explanations?","options":["It employs a game theoretic approach to allocate credit and explain predictions.","It uses a neural network to generate explanations based on model weights.","It applies statistical sampling methods to estimate the importance of features.","It utilizes clustering techniques to group similar data points for explanation."],"answer":[0],"verified":"official","c":346},{"q":"How do ProtoPNet models determine which patches are most important for classification?","options":["By evaluating the overall texture patterns of images.","By using statistical correlation between different patches of images.","By identifying and using patches that are representative or prototypical of each class.","By performing dimensionality reduction on the image data to find key features."],"answer":[2],"verified":"official","c":347},{"q":"Why is probing important even when a model shows strong performance on a task?","options":["To check if the model is using irrelevant data for making predictions.","To verify if the model's high accuracy is due to performing specific subtasks effectively.","To understand whether the model is overfitting to the training data.","To determine the computational efficiency of the model during training and inference."],"answer":[1],"verified":"official","c":348},{"q":"Which of the following best describes the TokFSM dataset?","options":["It is a dataset focused on image classification.","It is a dataset for natural language generation.","It is a dataset for reinforcement learning tasks.","It is an algorithmic sequence modeling dataset."],"answer":[3],"verified":"official","c":349},{"q":"How do we identify \"pure\" codes in a codebook model?","options":["By checking if they activate on only one bigram or trigram","By evaluating their impact on training time","By measuring their effect on model accuracy","By analyzing their computational complexity"],"answer":[0],"verified":"official","c":350},{"q":"Which of the following methods belong to the occlusion- or perturbation-based category of pixel attribution methods?","options":["Gradient Class Activation Mapping (Grad-CAM)","Integrated Gradient","DeepLIFT","SHAP","LIME"],"answer":[3,4],"verified":"official","c":351}]},{"year":2024,"session":"Jul-Oct 2024","week":7,"source":"https://www.youtube.com/watch?v=s85ISPoZdAU; https://www.youtube.com/watch?v=fcmkluD3yA8; https://www.youtube.com/watch?v=SYdlN522YW4","questions":[{"q":"When calculating the sensitivity in ε-Differential Privacy where the values to be derived from the data points is a d-dimension vector, identify the normalisation technique. (Notations are the same as used in the lecture)","options":["Manhattan normalisation","Eucledian normalisation","Max normalisation","Min-max normalisation","Sigmoid normalisation"],"answer":[0],"explanation":"For vector outputs in ε-DP \"we will compute the L1 norm\" (sum of absolute component differences) - Approximate Differential Privacy (G_pn8G09-KI).","verified":"lecture","c":352},{"q":"In (ε, δ)-Differential privacy what does δ = 0 imply? (Notations are the same as used in the lecture)","options":["The equation P(M(x)∈S) ≤ e^ε P(M(x')∈S) should hold for some of the subsets S","The equation P(M(x)∈S) ≤ e^ε P(M(x')∈S) should hold for most of the subsets S","The equation P(M(x)∈S) ≤ e^ε P(M(x')∈S) should hold for all of the subsets S","The equation P(M(x)∈S) ≤ e^ε P(M(x')∈S) should hold for none of the subsets S"],"answer":[2],"explanation":"\"if Delta is zero this means that it's exactly the same as the definition of differential privacy\", i.e. it holds for every S - Approximate Differential Privacy (G_pn8G09-KI).","verified":"lecture","c":353},{"q":"How do the utilities vary in the Laplacian mechanism vs the Gaussian mechanism in a higher dimension differential privacy setting?","options":["As the dimension increases, the Gaussian mechanism requires quadratically more amount of noise than the Laplacian mechanism, decreasing the utility","As the dimension increases, the Gaussian mechanism requires quadratically lesser amount of noise than the Laplacian mechanism, decreasing the utility","As the dimension increases, the Gaussian mechanism requires quadratically lesser amount of noise than the Laplacian mechanism, increasing the utility","As the dimension increases, the Gaussian mechanism requires quadratically more amount of noise than the Laplacian mechanism, increasing the utility"],"answer":[2],"explanation":"\"there is quadratically lesser amount of noise ... so you will have higher utility\" with the Gaussian mechanism - Approximate Differential Privacy (G_pn8G09-KI).","verified":"lecture","c":354},{"q":"_____ property ensures that a function applied on the privacy-protected data _____ its privacy aspect after applying a function over it.","options":["i. Post-processing ii. Retains","i. Post-processing ii. Loses","i. Composition ii. Retains","i. Composition ii. Loses"],"answer":[0],"explanation":"Post-processing: applying a function to the (ε,δ)-DP output \"should not suddenly become less private\" - Approximate Differential Privacy (G_pn8G09-KI).","verified":"lecture","c":355},{"q":"After using k mechanisms for getting k(ε, δ)-differentially private data variations for a dataset, the combined leakage that is observed from these k mechanisms can be minimized by:","options":["Using Laplacian Mechanism","Using Gaussian Mechanism","Using Uniform Mechanism","Using Exponential Mechanism"],"answer":[1],"explanation":"Advanced composition gives about √k·ε loss \"which you cannot do if you're using a Laplace mechanism ... you have to use a gaussian mechanism\" - Approximate Differential Privacy (G_pn8G09-KI).","verified":"lecture","c":356},{"q":"In a buyer-seller problem, given n buyers and n valuations by the buyers, what is the total revenue given a price p.","options":["p Σ_{i=1}^{n} A where A = 1 if vi ≥ p and A = 0 if vi ≤ p","p Σ_{i=1}^{n} A where A = 0 if vi ≥ p and A = 1 if vi ≤ p","pn","p(n − 1)","p(1/n)"],"answer":[0],"explanation":"\"revenue is just P times sum over i of indicator of v_i greater than or equal to P\" - Exponential Mechanism (Ir_wOyCFohs).","verified":"lecture","c":357},{"q":"In the exponential mechanism to calculate the price to maximize the revenue, identify the correct statement in the scenario where 2 unequal prices result in the same revenue:","options":["Both prices have an unequal probability of being selected","Both prices have an equal probability of being selected","A higher price has a higher probability of being chosen due to normalisation","A lower price has a higher probability of being chosen due to normalisation"],"answer":[1],"explanation":"\"I will get the same probability for two different prices which give me the same revenue\" - Exponential Mechanism (Ir_wOyCFohs).","verified":"lecture","c":358,"rel":[["Jul-Oct 2025",7,1]]},{"q":"In a classification problem, if a data point lies on a hyperplane that perfectly separates the two classes, the probability of the data point belonging to class A is:","options":["25%","50%","75%","100%"],"answer":[1],"explanation":"\"if a point falls exactly on this line ... the chance that it is red or blue is same, it's 50%\" - Fairness in Machine Learning (UAXIj2IVvpU).","verified":"lecture","c":359},{"q":"In a vanilla Principle Component Analysis method, the reconstruction loss of a protected group is _______ than the remaining data before resampling and _______ than the remaining data after resampling.","options":["Higher, higher","Higher, lower","Lower, higher","Lower, lower"],"answer":[0],"explanation":"\"even if the number of males and females were the exact same number ... the males had a lesser reconstruction error than the females\" - Fairness in Machine Learning (UAXIj2IVvpU).","verified":"lecture","c":360},{"q":"The goal of a Fair PCA is to find a PCA solution U where U=[Ua, Ub] such that reconstruction loss of the two groups A and B where A is the protected group is:","options":["Equal","Unequal","The protected group has a lower reconstruction loss","The protected group has a higher reconstruction loss"],"answer":[0],"explanation":"\"the optimal U has the exact same amount of loss for both the male population and the female population\" - Fairness in Machine Learning (UAXIj2IVvpU).","verified":"lecture","c":361,"rel":[["Jul-Oct 2026",7,1]]},{"q":"In an ideal situation where the models are completely fair, the different parity values are:","options":["Approach 0","1","Approach 1","0"],"answer":[0],"explanation":"\"in an ideal classifier the parity should be zero\"; in practice it is pushed \"closer and closer to zero\" - Fairness in Machine Learning (UAXIj2IVvpU). Both \"Approach 0\" and \"0\" fit; kept the majority uploader choice.","verified":"unsure","c":362,"rel":[["Jul-Oct 2025",7,1]]},{"q":"Match the following: i. P(M(x)=1 | x in C) − P(M(x)=1) ii. P(M(x)=1 | y=1 and C) − P(M(x)=1 | y=1) iii. P(M(x)=1 | C=1) − P(M(x)=1 | C=0) a. Fair Logistic regression, b. Statistical Parity, c. Equality of Opportunity","options":["i. - a, ii. - b, iii. - c","i. - b, ii. - a, iii. - c","i. - c, ii. - a, iii. - b","i. - b, ii. - c, iii. - a"],"answer":[3],"explanation":"i = statistical parity, ii = equality of opportunity (conditioned on y=1), iii = |P(M=1|C=1) − P(M=1|C=0)| is the parity used in fair logistic regression - Fairness in Machine Learning (UAXIj2IVvpU).","verified":"lecture","c":363}]},{"year":2024,"session":"Jul-Oct 2024","week":6,"source":"https://www.youtube.com/watch?v=NfoLWck15ZY; https://www.youtube.com/watch?v=fhXcGqjURJ0; https://www.youtube.com/watch?v=dimR_OgRrEY","questions":[{"q":"Which of the following methods is the best method to efficiently protect the data to preserve the privacy of the users?","options":["Anonymization","Cryptographical Solution","Statistical solution","Data Compression","Data Duplication"],"answer":[2],"explanation":"Corrected after checking the lecture (was: Cryptographical Solution). Cryptographic solutions \"might be an expensive solution\" and anonymization fails (Netflix/IMDb); \"what we are going to look at is a statistical solution\" - Data Privacy (etOgdDVr3mk).","verified":"lecture","c":364},{"q":"Between a randomized response (with epsilon>0) and a fair coin toss response, which algorithm would you use to preserve privacy but have a better utility?","options":["Randomized response because the chance of falsehood is 50%","Randomized response because the chance of truth is greater than 50%","Randomized response because the chance of falsehood is greater than 50%","Coin toss response because the chance of falsehood is 50%","Coin toss response because the chance of truth is greater than 50%","Coin toss response because the chance of falsehood is greater than 50%"],"answer":[1],"explanation":"RR reveals the truth with e^ε/(1+e^ε) > 50% for ε>0, while a coin toss carries no information - Data Privacy (etOgdDVr3mk).","verified":"lecture","c":365},{"q":"Consider the equation in the context of privacy guarantees (The notations used are the same as used during the lecture). P(RR(x') = b) * e^(-ε) ≤ P(RR(x) = b) ≤ P(RR(x') = b) * e^(ε) To maximize the privacy gains, which of the following values should be changed and how?","options":["ε should be maximum for privacy, ε should be minimum for utility","ε should be minimum for privacy, ε should be minimum for utility","ε should be maximum for privacy, ε should be maximum for utility","ε should be minimum for privacy, ε should be maximum for utility","ε is unrelated"],"answer":[3],"explanation":"\"smaller the epsilon, the better the privacy\"; larger ε gives better utility - Differential Privacy (cBU6545k-v0).","verified":"lecture","c":366},{"q":"Consider the below values: X = x1, x2, ..... xN is the truth of an experiment Y = y1, y2, ..... yN is the revealed values instead of the truth To identify the average of truth, Y as an estimator cannot be used for the process by which it was obtained. You derive new values Z where Z = z1, z2, ..... zN from Y which are better estimators of X. How do you arrive at the values Z?","options":["Removing the bias from Y introduced through the random process","Adding the bias to Y removed through the random process","Removing the variance from Y introduced through the random process","Adding the variance to Y removed through the random process"],"answer":[0],"explanation":"\"Yi is a biased estimator for Xi ... we can unbias it or debias it\" to get Zi - Data Privacy (etOgdDVr3mk).","verified":"lecture","c":367,"rel":[["Jul-Oct 2025",6,0]]},{"q":"If ε is fixed, given a privacy guarantee, to improve the utility, which of the following values can be modified?","options":["Increase the number of experiments","Increase the amount of randomness","Increase the amount of bias introduced in the random process","Increase the amount of variance introduced in the random process"],"answer":[0],"explanation":"\"for a fixed Epsilon the utility becomes better and better as I survey more and more people\" - Data Privacy (etOgdDVr3mk).","verified":"lecture","c":368},{"q":"Identify the equation for the ε-differential mechanism (The notations used are the same as used during the lecture):","options":["P(M(x)∈S) / P(M(x')∈S) ≤ e^ε","P(M(x')∈S) / P(M(x')∈S) ≤ e^ε","P(M(x)∈S) / P(M(x)∈S) ≤ e^ε","P(M(x)∈S) / P(M(x')∈S) ≥ e^ε","P(M(x')∈S) / P(M(x')∈S) ≥ e^ε","P(M(x)∈S) / P(M(x)∈S) ≥ e^ε"],"answer":[0],"explanation":"\"probability that M of X belongs to S divided by probability that M of X' belongs to S is at most e^ε\" - Differential Privacy (cBU6545k-v0).","verified":"lecture","c":369},{"q":"Identify the correct scenario in the case of differential privacy","options":["Trust the curator; Trust the world","Do not trust the curator; Trust the world","Trust the curator; Do not trust the world","Do not trust the curator; Do not trust the world"],"answer":[2],"explanation":"Corrected after checking the lecture (was: Do not trust the curator; Trust the world). Differential privacy is introduced in the trusted curator model: \"even though you can trust the curator, you don't trust the world\" - Differential Privacy (cBU6545k-v0)/Data Privacy (etOgdDVr3mk). The untrusted-curator case is randomized response.","verified":"lecture","c":370},{"q":"Identify all the values representing sensitivity in a laplacian mechanism where the function under consideration is an average of n binary values {0,1} (The notations used are the same as used during the lecture).","options":["1/n","(1/n)|x'_n − x_n|","ε","ε/n","−1/n","Δ/ε"],"answer":[0,1],"explanation":"Corrected after checking the lecture (was: 1/n). Sensitivity of the average \"is just 1 over n absolute value of x_n minus x_n prime ... so this is just 1 by n\" - Differential Privacy (cBU6545k-v0); both expressions equal Δ.","verified":"lecture","c":371},{"q":"Identify the distribution from which the noise is derived in a laplacian mechanism. The representation is of the form Laplacian(a,b) where a is the mean and b is the spread parameter. (The notations used are the same as used during the lecture)","options":["laplacian(1, Δ/ε)","laplacian(Δ/ε, 0)","laplacian(Δ/ε, 1)","laplacian(0, Δ/ε)","laplacian(1, 1)","laplacian(0, 0)"],"answer":[3],"explanation":"Noise \"comes from a Laplace distribution with mean zero and the spread parameter given by delta by epsilon\" - Differential Privacy (cBU6545k-v0).","verified":"lecture","c":372},{"q":"Higher privacy guarantees can be achieved in which of the following scenarios? Identify all the possible scenarios.","options":["Epsilon should be high","Inverse Sensitivity should be high","Variance should be high","Noise should be high","Utility should be high"],"answer":[1,2,3],"explanation":"Corrected after checking the lecture (was: Variance should be high, Noise should be high). Privacy improves as ε shrinks; with Laplace scale b=Δ/ε, ε=Δ/b, so more noise/variance or lower sensitivity (high inverse sensitivity) gives stronger privacy, while high ε or high utility do not (Differential Privacy (cBU6545k-v0)). The key might count only noise/variance.","verified":"unsure","c":373,"rel":[["Jul-Oct 2025",6,0]]},{"q":"Identify the deviation of the value from the truth in the scenario of a laplacian mechanism. (The notations used are the same as used during the lecture).","options":["o(1/(εn))","o(n'/(εn))","o(ε/n)","o(e/(εn))","o(εn)"],"answer":[0],"explanation":"\"with high probability the deviation from truth is something like order of 1/epsilon n\" - Differential Privacy (cBU6545k-v0).","verified":"lecture","c":374},{"q":"In the scenario of a privacy-utility trade-off, for fixed privacy, the number of samples required for a particular utility varies between the Laplacian mechanism and Randomized response is different by what factor?","options":["Constant factor","Linear factor","Exponential factor","Logarithmic factor","Quadratic factor"],"answer":[4],"explanation":"\"you would have to survey quadratically lesser number of people ... using the Laplace mechanism\" - Differential Privacy (cBU6545k-v0).","verified":"lecture","c":375}]},{"year":2024,"session":"Jul-Oct 2024","week":5,"source":"https://www.youtube.com/watch?v=nGuat9T9mnw (QuestKey, Accepted Answers); https://www.youtube.com/watch?v=TTx0SyFbSs0; https://www.youtube.com/watch?v=ae8YHtE5giA","questions":[{"q":"What does SEAT stand for?","options":["Sentence Evaluation and Association Test","Semantic Embedding and Association Test","Sentence Embedding Association Test","Sentiment Embedding Analysis Test"],"answer":[2],"verified":"official","c":376,"rel":[["Jul-Oct 2025",5,1]]},{"q":"What is coreference resolution?","options":["Identifying all mentions in a text referring to different entities","Finding all mentions in a text that refer to the same real-world entity","Analyzing sentence structure for grammatical correctness","Determining the sentiment of a text"],"answer":[1],"verified":"official","c":377},{"q":"For a reliable COBIAS score, the context variance (CV) should:","options":["Tend to 0","Tend to 1","Be maximized","Be minimized to 1"],"answer":[0],"verified":"official","c":378},{"q":"Given the sentences \"A man is walking\" and \"A nurse is walking,\" a higher similarity score indicates:","options":["More bias","Less bias","No bias","Ambiguous bias"],"answer":[1],"verified":"official","c":379},{"q":"Pointwise Mutual Information (PMI) is used to measure the association between two events. Which of the following statements best describes PMI?","options":["PMI measures the likelihood of two events occurring together compared to the likelihood of their independent occurrence.","PMI is a measure of the difference between the probabilities of two events occurring together and separately.","PMI calculates the expected frequency of two events occurring together.","PMI assesses the correlation between two events based on their joint probability distribution."],"answer":[0],"verified":"official","c":380},{"q":"Consider the following prompt: \"The image shows a subject with occupation '{occupation}'. What is the gender of the central subject in this image?\" This prompt provides specific information about the subject's occupation in the image before asking about their gender. Based on this description, how would you classify the prompt?","options":["Informed Task","Blind Task","Follow-up Task","Generic Task"],"answer":[0],"verified":"official","c":381},{"q":"Which of the following statements is true?","options":["Proprietary models are more neutral compared to CoDi and other open-source models.","Proprietary models are less neutral compared to CoDi and other open-source models.","There is no difference in neutrality between proprietary models and CoDi or other open-source models.","Neutrality in models is not related to whether they are proprietary or open-source."],"answer":[0],"verified":"official","c":382},{"q":"Mitigating bias can be done through:","options":["Fine-Tuning","Increasing the parameters","Using encoder models","Guardrails"],"answer":[0,3],"verified":"official","c":383},{"q":"In the paper AutoDebias, we search for bias by _________ JS Divergence and debias by ___________ JS Divergence.","options":["Maximizing, Minimizing","Minimizing, Maximizing","Maximizing, Not Changing","Not Changing, Minimizing"],"answer":[0],"verified":"official","c":384},{"q":"What does a high language modeling score indicate?","options":["The model ranks meaningless associations higher than meaningful associations.","The model ranks meaningful associations higher than meaningless associations.","The model equally ranks meaningful and meaningless associations.","The model's performance is not related to ranking associations."],"answer":[1],"verified":"official","c":385},{"q":"What does the Idealized CAT score represent?","options":["Combination of language model score and bias score","Combination of stereotype score and fairness score","Combination of language model score and stereotype score","Combination of language model score and accuracy score"],"answer":[2],"verified":"official","c":386}]},{"year":2024,"session":"Jul-Oct 2024","week":4,"source":"https://www.youtube.com/watch?v=dohXqQC4ylg; https://www.youtube.com/watch?v=3ajck4O3LcI; https://www.youtube.com/watch?v=OgM67N1HAMg","questions":[{"q":"Which of the following define bias? (Select all that apply)","options":["Systematic favoritism towards certain groups","Random errors in data collection","Neutral and unbiased judgment","Systematic exclusion of certain data points","Random selection of samples","Systematic deviation from rationality in judgment"],"answer":[0,3,5],"explanation":"Definitions given: psychology 'systematic deviation from rationality in judgment', statistics 'systematic error in collection/analysis', CS/ML 'systematic favoritism or discrimination towards certain groups' (Bias - I (W4)); systematic exclusion matches the data-collection sense; random/neutral options are not bias.","verified":"lecture","c":387},{"q":"Which of the following is one of the ways to measure bias","options":["Random sampling","Cross-Validation","Using Benchmark datasets","Chi-Square test"],"answer":[2],"explanation":"Bias is measured with benchmark datasets such as CrowS-Pairs/StereoSet (Bias - I (W4), Bias-Handson (W4)).","verified":"lecture","c":388},{"q":"Which of the following statements is true?","options":["Demographics do not influence the perception of bias.","Demographics can influence the perception of bias.","Perception of bias is unaffected by demographics.","Demographics and bias perception are unrelated."],"answer":[1],"explanation":"'demographics can affect perception of who's looking at it' (Bias - II (W4)).","verified":"lecture","c":389},{"q":"What does each pair in the CrowS-Pairs dataset consist of?","options":["One stereotype sentence and one neutral sentence","One biased sentence and one unbiased sentence","One stereotype sentence and one opposite stereotype sentence","One stereotype sentence and one less stereotype sentence"],"answer":[3],"explanation":"CrowS-Pairs: two minimally distant sentences, one more and one less stereotyping (Bias - I (W4)).","verified":"lecture","c":390,"rel":[["Jul-Oct 2026",4,1]]},{"q":"The statement \"Women are bad drivers\" is a","options":["Stereotype","Anti-Stereotype","Non-Stereotype","Neutral Statement"],"answer":[0],"explanation":"A generalisation about a group ('women are bad drivers') is a stereotype.","verified":"reasoning","c":391},{"q":"Which of the following is NOT a common source of bias in data?","options":["Historical inequities reflected in the data","Data collection methods that over-represent certain groups","Balanced representation of all demographic groups","Labeling errors or subjective annotations"],"answer":[2],"explanation":"Balanced representation is the remedy, not a source of bias.","verified":"reasoning","c":392},{"q":"At which stage of the machine learning process can bias be introduced by over- or under-representing certain groups?","options":["Data Collection","Data Pre-processing","Data Annotation","All of the above"],"answer":[3],"explanation":"Source-of-bias pipeline: bias can creep in at collection, labelling, training... 'every part of the pipeline' (Source of Bias (W4)).","verified":"lecture","c":393},{"q":"Which of the following characteristics can make a statement biased?","options":["Being stereotypical","Being socially aligned","Having inaccurate information","Having emotional language"],"answer":[0],"explanation":"Course operationalises bias as 'a stereotypical inclination to one entity over another' (Bias-Handson (W4)).","verified":"lecture","c":394},{"q":"One of the reasons bias exists in models is:","options":["Algorithm complexity","Data","Model architecture","Training duration"],"answer":[1],"explanation":"Biased training data / data collection is the main source discussed (Source of Bias (W4)).","verified":"lecture","c":395},{"q":"When is bias a problem?","options":["When it reduces the models performance","When it has negative impact","When it aligns with train data but not test data","When it increases the complexity"],"answer":[1],"explanation":"'we should treat it as a problem only when it has a negative impact' (Bias - I (W4)).","verified":"lecture","c":396},{"q":"Which of the following is the correct setting for contrastive learning?","options":["Irrespective of the sentences, minimise the distance between their embeddings","Irrespective of the sentences, maximise the distance between their embeddings","If sentences are similar, minimise the distance between their embeddings","If sentences are different, minimise the distance between their embeddings","If sentences are different, maximise the distance between their embeddings","If sentences are different, minimise the distance between their embeddings"],"answer":[2,4],"explanation":"Contrastive (tension) loss pulls similar/positive pairs together and pushes dissimilar/negative pairs apart (Bias-Handson (W4)).","verified":"lecture","c":397,"rel":[["Jul-Oct 2026",4,1]]}]},{"year":2024,"session":"Jul-Oct 2024","week":3,"source":"https://www.youtube.com/watch?v=ho0vlMUThYg (QuestKey, Accepted Answers); https://www.youtube.com/watch?v=fpi_QsyyWpY; https://www.youtube.com/watch?v=q3kFWzjb5Vg; https://www.youtube.com/watch?v=OMzku5J5J-8","questions":[{"q":"What kind of content information do you want to remove from the model data?","options":["Biased or discriminatory data","Useful patterns and trends","General public data","Random noise","Personally identifiable information","Valid and accurate data"],"answer":[0,4],"verified":"official","c":398},{"q":"What are the reasons to choose unlearning over retraining?","options":["To improve the overall performance of the model","To add new data to the model","To change the underlying algorithm of the model","To completely overhaul the model's architecture","To save computational resources and time"],"answer":[4],"verified":"official","c":399},{"q":"Identify the steps involved in the exact unlearning as discussed in the course.","options":["Isolate the data -> shard the data -> slice the data -> aggregate the data","Aggregate the data -> isolate the data -> slice the data -> shard the data","Shard the data -> Slice the data -> Isolate the data -> Aggregate the data","Shard the data -> Isolate the data -> Slice the data -> Aggregate the data","Isolate the data -> slice the data -> shard the data -> aggregate the data"],"answer":[3],"verified":"official","c":400},{"q":"Which model should be retrained in the exact unlearning process?","options":["The constituent model that is trained over the isolated data","The constituent model that is trained over the sharded data","The constituent model that is trained over the aggregated data","The constituent model that is trained over the sliced data"],"answer":[1],"verified":"official","c":401},{"q":"How should the original model and the model after the below unlearning methods behave? 1) exact unlearning 2) approximate unlearning","options":["1) distributionally identical 2) distributionally identical","1) distributionally close 2) distributionally close","1) distributionally identical 2) distributionally close","1) distributionally close 2) distributionally identical"],"answer":[2],"verified":"official","c":402},{"q":"How does unlearning via differential privacy work?","options":["check whether an adversary can reliably tell apart the models before unlearning and after unlearning","check whether the model can output private and sensitive information before and after unlearning","check whether the model's predictions become more consistent and stable for private information before and after unlearning.","check whether an adversary can identify the differences in the distribution of output data of the model before and after unlearning"],"answer":[0],"verified":"official","c":403},{"q":"Identify all the methods for privacy unlearning.","options":["Gradient descent on encountering the forget set","Remove noise from the weights influencing the forget set","Add noise to weights influencing data in forget set","Gradient ascent on encountering the forget set","Increase the learning rate when encountering the forget set","Apply dropout to all layers when encountering the forget set"],"answer":[2,3],"verified":"official","c":404},{"q":"Match the unlearning method to their corresponding concept 1) privacy unlearning, 2) concept unlearning, 3) example unlearning, 4) ask for unlearning I. data and model architecture is not modified, II. use membership inference attack concept, III. forget set is not clearly defined, IV. forget set is clearly defined","options":["1-III, 2-I, 3-IV, 4-II","1-II, 2-III, 3-IV, 4-I","1-IV, 2-II, 3-I, 4-III","1-I, 2-IV, 3-II, 4-III","1-IV, 2-I, 3-III, 4-II"],"answer":[1],"verified":"official","c":405,"rel":[["Jul-Oct 2026",3,1]]},{"q":"The forget set to be unlearned is not known in which of the following:","options":["Example Unlearning","Differential Privacy Unlearning","Privacy unlearning","Concept unlearning"],"answer":[3],"verified":"official","c":406},{"q":"In the scenario of ask for unlearning, what kind of things can be easily unlearned?","options":["Hate speech","Toxic content","Factual Information","Sensitive information"],"answer":[2],"verified":"official","c":407},{"q":"When evaluating the quality of unlearning using Membership Inference Attack, which of the following scenarios implies that the unlearning is successful?","options":["The accuracy increases on the forget set","The accuracy drops on the forget set","The accuracy stays the same on the forget set","The accuracy increases on the test set","The accuracy drops on the test set","The the dataset","Oversampling minority classes in imbalanced datasets","Adding hidden functionalities to control the model behaviour","Encrypting sensitive information in the training data"],"answer":[2],"verified":"official","c":436},{"q":"When is a data poisoning attack considered successful?","options":["The model's overall accuracy decreases significantly","The model fails to converge during training","The model becomes computationally inefficient","The model outputs the specific behaviour when it encounters the trigger"],"answer":[3],"verified":"official","c":437},{"q":"Consider the following scenario: You have a dataset with 10000 samples and a model trained over it has a test accuracy of almost 94%. You then introduce a trojan data poisoning attack in your dataset such that every time it looks at a certain trigger pattern, the model behaves in a certain way. You get a success rate of 99% for your data poisoning attack through the trigger by poisoning 0.01% of your samples. What is the new test accuracy of your model? Identify the correct range.","options":["40 to 50 percent","50 to 60 percent","60 to 70 percent","70 to 80 percent","80 to 90 percent","90 to 100 percent"],"answer":[5],"explanation":"Trojan/backdoor poisoning of a tiny fraction of the data leaves clean test accuracy almost unchanged (about 94%).","verified":"official","c":438},{"q":"What are the different defence mechanism(s) against poisoning attacks?","options":["Biasing","Filtering","Unlearning","Representation engineering","AutoDebias"],"answer":[1,2],"verified":"official","c":439}]},{"year":2024,"session":"Jul-Oct 2024","week":1,"source":"https://www.youtube.com/watch?v=CY4zd35DGfw (QuestKey, Accepted Answers); https://www.youtube.com/watch?v=LVJMavjXHro; https://www.youtube.com/watch?v=7-gveeOsJGk","questions":[{"q":"Consider the following prompt: \"A squirrel gives an apple to a bird\". The below images are generated from two image generation models. Which of the models has a higher number o
