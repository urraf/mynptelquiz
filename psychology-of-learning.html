<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Psychology of Learning Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: control-panel bench. Left rail = drill builder + settings, main = week grid / active question. Stack-light dots (red/amber/green) encode your best score per week. */
:root{
  --bg:#e9edf1; --panel:#fbfcfd; --ink:#16202a; --muted:#566373; --line:#cdd5de; --chip:#dfe5ec;
  --accent:#b97c00; --accent-soft:#f6e7c4; --accent-ink:#1d1500;
  --warn:#c98a00; --ok:#17834a; --ok-soft:#dcf2e5; --bad:#bf3434; --bad-soft:#f8e0e0; --idle:#9aa6b3;
  --f-display:"Chakra Petch","Arial Narrow",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f141a; --panel:#171e26; --ink:#e4e9ef; --muted:#93a1b0; --line:#2a3542; --chip:#222c37;
  --accent:#f0b429; --accent-soft:#3a2d0c; --accent-ink:#1d1500;
  --warn:#f0b429; --ok:#41c97c; --ok-soft:#123423; --bad:#f07272; --bad-soft:#3d1a1c; --idle:#56636f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141a; --panel:#171e26; --ink:#e4e9ef; --muted:#93a1b0; --line:#2a3542; --chip:#222c37;
  --accent:#f0b429; --accent-soft:#3a2d0c; --accent-ink:#1d1500;
  --warn:#f0b429; --ok:#41c97c; --ok-soft:#123423; --bad:#f07272; --bad-soft:#3d1a1c; --idle:#56636f; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--f-body);margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:20px 48px}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font:600 12px/1.2 var(--f-display);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

/* header */
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;padding-bottom:16px;border-bottom:2px solid var(--ink);margin-bottom:20px}
.brand h1{font:700 clamp(24px,4vw,34px)/1.05 var(--f-display);margin:4px 0 0;text-wrap:balance}
.brand h1 span{color:var(--accent)}
.meters{display:flex;gap:20px;flex-wrap:wrap}
.meter b{display:block;font:700 22px/1 var(--f-mono)}
.meter small{font-size:12px;color:var(--muted)}

/* layout */
.grid{display:grid;grid-template-columns:300px minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}
aside{display:grid;gap:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.panel h2{font:600 15px/1.2 var(--f-display);letter-spacing:.04em;text-transform:uppercase;margin:0 0 12px}

.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{background:transparent;border:0;padding:8px 4px;font-size:14px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel);font-weight:700}
.hintline{font-size:13px;color:var(--muted);margin:8px 0 0}
.check{display:flex;gap:8px;align-items:center;font-size:14px;margin-top:10px}
.check input{accent-color:var(--accent);width:16px;height:16px}

.weekpick{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.runpick{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pickhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.weekpick label,.runpick label{display:block}
.weekpick input,.runpick input{position:absolute;opacity:0;pointer-events:none}
.weekpick span,.runpick span{display:block;text-align:center;padding:6px 0;border:1px solid var(--line);border-radius:4px;font:500 13px var(--f-mono);background:var(--bg)}
.weekpick input:checked+span,.runpick input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.weekpick input:focus-visible+span,.runpick input:focus-visible+span{outline:2px solid var(--ink);outline-offset:1px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
.row select{padding:7px 8px;border:1px solid var(--line);border-radius:4px;background:var(--bg)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:9px 14px;font-weight:700;font-size:14px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.block{width:100%;margin-top:12px}
.linkish{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;font-size:13px}

/* session tabs */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px}
.tabs button{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 14px;font-size:14px;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--panel);font-weight:700}

.session{margin-bottom:28px}
.session-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.session-head h3{font:700 20px/1.2 var(--f-display);margin:0}
.weeks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.wk{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:8px}
.wk-top{display:flex;justify-content:space-between;align-items:center}
.wk-num{font:700 18px/1 var(--f-display)}
.wk-meta{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.wk-actions{display:flex;gap:6px}
.wk-actions .btn{flex:1;padding:6px 8px;font-size:13px}
.lamp{display:inline-flex;gap:3px}
.lamp i{width:9px;height:9px;border-radius:50%;background:var(--chip);border:1px solid var(--line)}
.lamp[data-l="r"] i:nth-child(1){background:var(--bad);border-color:var(--bad)}
.lamp[data-l="a"] i:nth-child(2){background:var(--warn);border-color:var(--warn)}
.lamp[data-l="g"] i:nth-child(3){background:var(--ok);border-color:var(--ok)}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}

/* quiz */
.qbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.qbar .title{font:700 18px/1.2 var(--f-display);flex:1;min-width:0}
.progress{height:4px;background:var(--chip);border-radius:2px;overflow:hidden;margin-bottom:18px}
.progress div{height:100%;background:var(--accent);transition:width .2s}
.qcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:clamp(16px,3vw,28px);max-width:820px}
.qhead{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:10px;font-size:13px;color:var(--muted)}
.qtext{font:700 clamp(18px,2.4vw,21px)/1.45 var(--f-body);margin:0 0 6px;white-space:pre-line}
.ok-chip{display:inline-block;font:600 11px var(--f-display);letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--ok);color:var(--ok);padding:1px 6px;border-radius:3px;margin-left:6px}
.flag{display:inline-block;font:600 11px var(--f-display);letter-spacing:.08em;text-transform:uppercase;border:1px dashed var(--accent);color:var(--muted);padding:1px 6px;border-radius:3px;margin-left:6px}
.imp{display:inline-block;font:600 11px/1.5 var(--f-display);letter-spacing:.08em;text-transform:uppercase;padding:1px 7px;border-radius:3px;margin-left:6px;white-space:nowrap;border:1px solid var(--accent)}
.imp.t2{background:var(--accent);color:var(--accent-ink)}
.imp.t1{color:var(--ink)}
.relq{font-size:13px;color:var(--muted);margin-top:8px}
.focus{display:grid;gap:14px;margin-bottom:20px;border-color:var(--accent)}
.focus p{margin:0;color:var(--muted);font-size:14px;max-width:62ch}
.fstats{display:flex;gap:28px;flex-wrap:wrap}
.fstat{display:grid;gap:4px;justify-items:start}
.fstat b{font:700 30px/1 var(--f-mono)}
.fstat .imp{margin-left:0}
.fstat small{font-size:12px;color:var(--muted)}
.focus .row{margin-top:0}
.wk-imp{font-size:13px;color:var(--muted)}
.wk-imp b{color:var(--ink);font-family:var(--f-mono)}
.multi{display:inline-block;font:600 12px var(--f-display);letter-spacing:.08em;text-transform:uppercase;background:var(--accent-soft);color:var(--ink);padding:2px 8px;border-radius:3px;margin-bottom:10px}
.opts{display:grid;gap:8px;margin-top:14px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:var(--r);padding:12px 14px;line-height:1.45;width:100%}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt:disabled{cursor:default}
.opt .k{flex:none;width:26px;height:26px;display:grid;place-items:center;border:1px solid var(--line);border-radius:4px;font:700 13px var(--f-mono);background:var(--panel)}
.opt span:last-child{min-width:0;overflow-wrap:anywhere}
.opt.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.opt.sel .k{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft);box-shadow:inset 0 0 0 1px var(--ok)}
.opt.ok .k{background:var(--ok);border-color:var(--ok);color:var(--panel)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft);box-shadow:inset 0 0 0 1px var(--bad)}
.opt.bad .k{background:var(--bad);border-color:var(--bad);color:var(--panel)}
.feedback{margin-top:16px;padding:12px 14px;border-radius:var(--r);border:1px solid var(--line);font-size:15px}
.feedback.ok{border-color:var(--ok);background:var(--ok-soft)}
.feedback.bad{border-color:var(--bad);background:var(--bad-soft)}
.feedback strong{font-family:var(--f-display);letter-spacing:.03em}
.src{font-size:12px;color:var(--muted);margin-top:8px;overflow-wrap:anywhere}
.src a{color:inherit}
.qactions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;justify-content:space-between}
.qactions .sp{flex:1}
.dots{display:flex;flex-wrap:wrap;gap:5px;margin-top:18px;max-width:820px}
.dots button{width:30px;height:30px;border:1px solid var(--line);background:var(--panel);border-radius:4px;font:500 12px var(--f-mono);padding:0}
.dots button.cur{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.dots button.ans{background:var(--accent-soft)}
.dots button.ok{background:var(--ok);border-color:var(--ok);color:var(--panel)}
.dots button.bad{background:var(--bad);border-color:var(--bad);color:var(--panel)}
.keys{font-size:12px;color:var(--muted);margin-top:14px}
.keys kbd{font:500 11px var(--f-mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;padding:0 4px;background:var(--panel)}

/* results + study */
.score{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin-bottom:8px}
.score b{font:700 56px/1 var(--f-mono)}
.score .of{font:500 20px var(--f-mono);color:var(--muted)}
.verdict{font:700 20px var(--f-display)}
.list{display:grid;gap:12px;margin-top:20px;max-width:820px}
.item{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.item .qtext{font-size:16px}
.item ul{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:4px}
.item li{display:flex;gap:8px;font-size:15px;padding:4px 8px;border-radius:4px}
.item li .k{font:700 13px var(--f-mono);flex:none;width:18px}
.item li.right{background:var(--ok-soft);font-weight:700}
.item li.wrong{background:var(--bad-soft);text-decoration:line-through}
.item .exp{font-size:14px;color:var(--muted);margin-top:8px}
.note{font-size:13px;color:var(--muted);max-width:820px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:8px 16px;border-radius:4px;font-size:14px}
.courses{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;margin-bottom:10px}
.courses a{color:var(--muted)}
.courses b{color:var(--ink);border-bottom:2px solid var(--accent)}
:root{--accent:#5b3fa8;--accent-soft:#e8e1f6;--accent-ink:#ffffff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--accent:#b7a1f2;--accent-soft:#2a2140;--accent-ink:#170f29}}
:root[data-theme="dark"]{--accent:#b7a1f2;--accent-soft:#2a2140;--accent-ink:#170f29}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>

<script>window.QUIZ_DATA = {"sets":[{"year":2026,"session":"Jul-Oct 2026","week":1,"source":"https://www.youtube.com/watch?v=MQaXXes68Cs | https://www.youtube.com/watch?v=y-gMf696Mq8 | https://www.youtube.com/watch?v=h3YdeHhKueo | https://www.youtube.com/watch?v=qQyY-UI85Wc | https://www.youtube.com/watch?v=AILecUHw-XQ | https://www.youtube.com/watch?v=DZzL3zxZFcU","questions":[{"q":"Learning is often seen as the contiguous causal effect of ___ on behavior.","options":["blood","bone density","trauma","experience"],"answer":[3],"explanation":"\"learning as in contiguous cause causal effect of experience and the behavior\" (Lecture 1: Psychology of Learning)","verified":"lecture","c":0},{"q":"In order to say that learning has occurred, a hidden change in behavior must occur.","options":["True","False"],"answer":[1],"explanation":"Lecture says learning is an \"observable change in the behavior\", not a hidden change, so False. (Lecture 1: Psychology of Learning)","verified":"lecture","c":1},{"q":"Which of the following is not a mental construct?","options":["skeleton","knowledge","representations","associations"],"answer":[0],"explanation":"\"mental construct ... includes all kinds of the knowledge, information, representation, thoughts, ideas, association\"; skeleton is not one. (Lecture 1: Psychology of Learning)","verified":"lecture","c":2},{"q":"Learning changes the ___ structure of the brain through the process of continuous interactions between the learner and the external environment.","options":["physical","social","biological","none of the given"],"answer":[0],"explanation":"\"learning changes the physical structure of the brain\" (Lecture 1: Psychology of Learning)","verified":"lecture","c":3},{"q":"___ shapes the learning process.","options":["Only thoughts","Only emotions","Both thoughts and emotions","Neither thoughts nor emotions"],"answer":[2],"explanation":"Lecture stresses blending of cognition and emotion (\"emotion also plays an important part\") in learning; both thoughts and emotions. (Lecture 2: Psychology of Learning (Contd.))","verified":"lecture","c":4},{"q":"Watson's work included the famous Little Albert experiment in which he conditioned a small child to ___ a white rat.","options":["fear","love","hate","play with"],"answer":[0],"explanation":"Little Albert was frightened by a noise paired with a white rat (conditioned fear). (Lecture 2: Psychology of Learning (Contd.))","verified":"lecture","c":5},{"q":"Behaviorism dominated psychology for much of the early ___ century.","options":["20th","19th","18th","17th"],"answer":[0],"explanation":"\"behaviorism dominated the psychology for much of the early 20th century\" (Lecture 2: Psychology of Learning (Contd.))","verified":"lecture","c":6},{"q":"The state of \"conscious incompetence\" may be valuable ___ of a learning experience.","options":["at the end","in the middle","2 years after the end","at the start"],"answer":[3],"explanation":"\"the state of conscious incompetent may be valuable at the start of learning\" (Lecture 2: Psychology of Learning (Contd.))","verified":"lecture","c":134,"rel":[["Jul-Oct 2025",1,1]]},{"q":"Which of the following is not an outcome of effective e-learning?","options":["wider range of strategies","more reflective approach","more positive emotions towards learning","more disconnected knowledge"],"answer":[3],"explanation":"Outcomes listed include \"more connected knowledge\", \"wider range of strategies\", reflective approach, positive emotions; disconnected knowledge is the opposite. (Lecture 3)","verified":"lecture","c":8,"rel":[["Jul-Oct 2023",1,0]]},{"q":"Instrumental conditioning is an example of ___ learning.","options":["sensitization","habituation","associative","meaningful"],"answer":[2],"explanation":"Instrumental (operant) conditioning, like classical conditioning, is associative learning (lecture 5 covers associative learning).","verified":"reasoning","c":9}]},{"year":2026,"session":"Jul-Oct 2026","week":2,"source":"https://www.youtube.com/watch?v=9Nr_NxWi8ro | https://www.youtube.com/watch?v=SKgoeV7Z3_I | https://www.youtube.com/watch?v=4U2PN2tiq8c | https://www.youtube.com/watch?v=MhUp56HD2ig | https://www.youtube.com/watch?v=z6mz1gJh6ak","questions":[{"q":"The three major types of learning described by ___ psychology are classical conditioning, operant conditioning and observational learning.","options":["cognitive","behavioral","emotional","evolutionary"],"answer":[1],"explanation":"Behavioural psychology describes classical conditioning, operant conditioning and observational learning. (Lecture 2: Psychology of Learning (Contd.))","verified":"lecture","c":10},{"q":"According to the view of Watson, psychology is ___.","options":["subjective","only descriptive","experimental","about internal mental processes that cannot be measured and observed"],"answer":[2],"explanation":"Behaviourists (Watson): \"psychology was an experimental science and the internal mental processes ... doesn't have any existence in the scope of psychology\". (Lecture 6: Major Theories of Learning)","verified":"lecture","c":11},{"q":"___ is given by Ivan Pavlov.","options":["Operant conditioning","Functional conditioning","Classical conditioning","Modern conditioning"],"answer":[2],"explanation":"Classical conditioning is Pavlov's (bell-food salivation). (Lecture 6: Major Theories of Learning)","verified":"lecture","c":12},{"q":"The process by which organisms learn to respond to certain stimuli but not to others is known as ___.","options":["stimulus generalization","stimulus appreciation","stimulus discrimination","stimulus differentiation"],"answer":[2],"explanation":"\"stimulus discrimination ... process which organism learn to respond to certain stimulus but not others\". (Lecture 6: Major Theories of Learning)","verified":"lecture","c":13},{"q":"Higher-order conditioning is intrinsically weaker than its first-order counterpart.","options":["True","False"],"answer":[0],"explanation":"Lecture 6 covers higher-order conditioning but does not state its strength; standard texts say higher-order conditioning is intrinsically weaker than first-order.","verified":"reasoning","c":14},{"q":"___ is the process of gradually changing the quality of a response.","options":["Shaping","Modeling","Cueing","Shifting"],"answer":[0],"explanation":"\"shaping is the process of gradually changing the quality of response\" (Lecture 6: Major Theories of Learning)","verified":"lecture","c":387,"rel":[["Jul-Oct 2023",1,1]]},{"q":"The works of ___ were instrumental in engendering the dramatic shift from behaviorism to cognitive theories.","options":["Edward C. Tolman","Jean Piaget","German Gestalt","All of the given"],"answer":[3],"explanation":"Lecture names Tolman, Bruner and German Gestalt psychologists as instrumental in the shift; Tolman and Gestalt are both listed here, so \"All of the given\". (Lecture 7)","verified":"lecture","c":16},{"q":"___ intelligence is the ability to perceive the visual-spatial world accurately and involves sensitivity to color, line, shape, form, space, and the potential for recognizing and manipulating the patterns of spaces.","options":["Interpersonal","Spatial","Bodily-kinesthetic","Linguistic"],"answer":[1],"explanation":"Gardner's spatial intelligence = perceiving the visual-spatial world accurately (lecture 8 multiple intelligences).","verified":"reasoning","c":17},{"q":"Sternberg proposed his theory in 1985 as an alternative to the idea of the ___.","options":["general intelligence factor","multiple intelligences","specific intelligence factor","unconscious intelligence"],"answer":[0],"explanation":"Sternberg's triarchic theory \"is an alternative ... to the general idea of the general intelligence\". (Lecture 8)","verified":"lecture","c":18},{"q":"Which of the following is not a kind of product in the structure of intellect model?","options":["symbolic","classes","systems","implications"],"answer":[0],"explanation":"Guilford SOI products: units, classes, relations, systems, transformations, implications; \"symbolic\" is a content category, not a product.","verified":"reasoning","c":19}]},{"year":2026,"session":"Jul-Oct 2026","week":3,"source":"https://www.youtube.com/watch?v=tcG5iEKUDjs | https://www.youtube.com/watch?v=6IA5inWolAU | https://www.youtube.com/watch?v=NdUh2T3KGjo | https://www.youtube.com/watch?v=DlcbPGcOzT0 | https://www.youtube.com/watch?v=nN0LJNCMkEw","questions":[{"q":"The connections between nerves cells are called ___.","options":["systems","syntaxes","neurons","synapses"],"answer":[3],"explanation":"\"connection between the nerve cells ... synapses\". (Lecture 11: Memory & Cognition)","verified":"lecture","c":20},{"q":"In order to create a ___, information must be changed into a usable form, which occurs through a process known as encoding.","options":["past memory","new imagination","new memory","past imagination"],"answer":[2],"explanation":"\"information must be changed to a usable form which occurs through a process known as encoding\" (to create a new memory). (Lecture 11: Memory & Cognition)","verified":"lecture","c":21},{"q":"Calling back the stored information in response to some cue for use in a process or activity is called ___.","options":["Retrieval","Recall","Recollection","All of the given"],"answer":[3],"explanation":"\"the next process is the retrieval, recall or the recollection\" (all three names used). (Lecture 11: Memory & Cognition)","verified":"lecture","c":22},{"q":"For many with ___ deficits, reading facial expressions and knowing how to respond are confusing daily challenges.","options":["memory","intelligence","social cognition","biological cognition"],"answer":[2],"explanation":"Social cognition is listed as a domain; difficulty reading facial expressions is the standard description of social-cognition deficits. (Lecture 11: Memory & Cognition)","verified":"lecture","c":23},{"q":"The Information Processing View of Learning assumes that there are limits to how much information can be processed at each stage.","options":["True","False"],"answer":[0],"explanation":"\"there are limits on how much information can be processed at each stage\" is listed as an assumption. (Lecture 11: Memory & Cognition)","verified":"lecture","c":24},{"q":"The Information Processing View of Learning assumes that information process is involved in ___.","options":["forgetting","remembering","perceiving","All of the given"],"answer":[3],"explanation":"\"information processing is also involved in all activities ... problem solving, remembering, thinking ... imagining\". (Lecture 11: Memory & Cognition)","verified":"lecture","c":25},{"q":"The capacity of the sensory register is ___.","options":["very small","very large","7+/-2 chunks","unlimited"],"answer":[1],"explanation":"The lecture table says a lot of information can come into the sensory register for 1-3 seconds, but the lecturer also says \"limited capacity\" in passing.","verified":"unsure","c":26},{"q":"Most children do not begin to engage in the process of rehearsal on their own until about age ___.","options":["seven","two","thirteen","one"],"answer":[0],"explanation":"Lecture: \"most children actually they do not begin to rehearse on their own\" (slide/Woolfolk: until about age 7). (Lecture 12)","verified":"lecture","c":27},{"q":"___ provides an interface between the sub-systems of working memory and the part of long term memory specialized for episodic memory.","options":["Phonological loop","Visuo-spatial sketchpad","Retrieval buffer","Episodic buffer"],"answer":[3],"explanation":"Episodic buffer integrates sub-systems and links to episodic LTM. (Lecture 13)","verified":"lecture","c":28},{"q":"Memories of specific episodes of one's life refers to ___.","options":["declarative memory","experimental episodic memory","autobiographical episodic memory","procedural memory"],"answer":[2],"explanation":"\"autobiographical episodic memory that is about our life events\". (Lecture 14)","verified":"lecture","c":29}]},{"year":2026,"session":"Jul-Oct 2026","week":4,"source":"https://www.youtube.com/watch?v=QRK86oJ2yC4 | https://www.youtube.com/watch?v=Ula8Tb6K1y0 | https://www.youtube.com/watch?v=-IcRBDnO9iA | https://www.youtube.com/watch?v=iSMptrfCsEo","questions":[{"q":"___ thinking is the ability to create mental representations of objects, places, events, or people in your mind.","options":["General","Creative","Divergent","Symbolic"],"answer":[3],"explanation":"\"symbolic thinking is ... when we create a kind of mental representations of the reality of particular events or particular people in mind or objects\". (Lecture 16: Thinking & Cognition)","verified":"lecture","c":30},{"q":"We compare new information to our ___ of the person, place, or thing, so we know how to categorize the new information mentally.","options":["protofit","protobite","prototype","none of the given"],"answer":[2],"explanation":"New things are mapped \"against the prototype\" (Himalayan mountains example). (Lecture 16: Thinking & Cognition)","verified":"lecture","c":31},{"q":"Which of the following is not true?","options":["Thinking is a higher mental process","Thinking is a sub-vocal talking","Thinking is fulfilling a need or problem solving","Thinking is only done in verbal symbols"],"answer":[3],"explanation":"Thinking also happens in mathematical symbols, gestures, art etc., so \"only verbal symbols\" is false. (Lecture 16: Thinking & Cognition)","verified":"lecture","c":32},{"q":"Mental images are ___","options":["Auditory","Visual","Gustatory","All of the given"],"answer":[3],"explanation":"Mental images can be in any sensory modality (images, musical tones, etc.); all of the given. (Lecture 16: Thinking & Cognition)","verified":"lecture","c":33},{"q":"___ organize complex phenomena into simpler, easily understandable, and usable categories and help to solve our problems.","options":["Concepts","Propositions","Constructs","Components"],"answer":[0],"explanation":"Concepts \"organize the whole learning tasks or the phenomena and make it very simpler\". (Lecture 16: Thinking & Cognition)","verified":"lecture","c":34},{"q":"The lowermost level of Bloom's taxonomy is ___","options":["remember","apply","understand","analyze"],"answer":[0],"explanation":"Revised Bloom: remember is the lowest level. (Lecture 17)","verified":"lecture","c":35},{"q":"The psychomotor domain of the Bloom's taxonomy is concerned with","options":["Biological makeup","Thoughts and beliefs","Feelings and emotions","Skilled behavior"],"answer":[3],"explanation":"Psychomotor domain = physical/skilled behaviour (hierarchy of psychomotor domain). (Lecture 17)","verified":"lecture","c":36},{"q":"Which of the following is an example of meta-cognition skills?","options":["Ignoring your limits","Self-monitoring","Skimming all important information","All of the given"],"answer":[1],"explanation":"Examples: \"knowing our limits\", \"self monitoring\", modifying, skimming; \"ignoring your limits\" is not, so only self-monitoring. (Lecture 18)","verified":"lecture","c":37},{"q":"___ critical thinking skill helps you analyze and process information to come to an unbiased conclusion.","options":["Open-mindedness","Self-regulation","Self-control","Observation"],"answer":[0],"explanation":"\"open-mindedness ... objectivity without any bias ... unbiased conclusion, unbiased observation\". (Lecture 18)","verified":"lecture","c":38},{"q":"The inspiration phase of the creative thinking process refers to the ___ stage.","options":["Incubation","Insight","Evaluation","Preparation"],"answer":[3],"explanation":"\"we start preparation, preparation that means that is called the initial inspiration phase\". (Lecture 19)","verified":"lecture","c":39,"rel":[["Jul-Oct 2024",4,0],["Jul-Oct 2023",4,0]]}]},{"year":2026,"session":"Jul-Oct 2026","week":5,"source":"https://www.youtube.com/watch?v=9WZUsZ1F0A4 | https://www.youtube.com/watch?v=BkAnlE5jXfE | https://www.youtube.com/watch?v=XadkIVzz-54 | https://www.youtube.com/watch?v=NqCSrPExFec","questions":[{"q":"Which of the following is true about motivation?","options":["It is a physical impulse","It is an external process","It has a willingness to activate but not channel the attitudes of learners","None of the given"],"answer":[3],"explanation":"L21 slide: motivation is a mental (not physical) impulse, an internal process, with 'willingness to activate, mobilize, channel and direct' - so A-C are false.","verified":"lecture","c":40},{"q":"The term \"motivation\" comes from a ___ word.","options":["Greek","Latin","Hindi","Bengali"],"answer":[1],"explanation":"L21: 'motivation has come from the Latin word movere, to move'.","verified":"lecture","c":41},{"q":"It is called extrinsic motivation if causal factor is ___.","options":["curiosity","social pressure","self-satisfaction","needs"],"answer":[1],"explanation":"L21: extrinsic when the causal factor lies in the external environment, e.g. reward, social pressure, punishment.","verified":"lecture","c":42},{"q":"___ motivation is considered to be more crucial for students as it is associated with deep learning, better performance and self-efficacy.","options":["Intrinsic","Extrinsic","Introjected regulation","None of the given"],"answer":[0],"explanation":"L21: 'intrinsic motivation is also considered to be more crucial for the students as it is associated with deep learning, better performance and self-efficacy'.","verified":"lecture","c":43},{"q":"___ proposed that there are three primary drives that drive human behavior.","options":["Hull","Watson","Piaget","Gestalt"],"answer":[0],"explanation":"L22 slide: 'Hull proposed that there are three primary drives that drive human behavior'.","verified":"lecture","c":44},{"q":"Expectancy Theory of Motivation was developed by ___.","options":["Vroom","Hull","Murray","None of the given"],"answer":[0],"explanation":"L22 slide: 'Expectancy Theory of Motivation was developed by Victor H. Vroom in 1964'.","verified":"lecture","c":45},{"q":"An example of ___ is thinking, \"If I work hard I can achieve the targets my boss has set for me\".","options":["purposeful","valence","instrumentality","expectancy"],"answer":[3],"explanation":"L22 slide: 'Expectancy is the belief that if we work hard (effort) we will be able to hit the target'.","verified":"lecture","c":46},{"q":"In SMART goals, T stands for ___.","options":["Temporary","Time-based","Tough","Testing"],"answer":[1],"explanation":"L23: SMART - '...realistic, time based, it has some stipulated time'.","verified":"lecture","c":47},{"q":"Friendship is a ___ need in Maslow's hierarchy.","options":["Love and belonging","Esteem","Physiological","Safety"],"answer":[0],"explanation":"L24: third tier is love/belongingness - 'want to be a member of the group... to care for others and to be cared by others'.","verified":"lecture","c":48},{"q":"___ theory differentiates between autonomous motivation and controlled motivation.","options":["Arousal","Goal-setting","Need hierarchy","Self-determination"],"answer":[3],"explanation":"L24: 'self determination theory differences between the autonomous motivation and control motivation'.","verified":"lecture","c":49}]},{"year":2026,"session":"Jul-Oct 2026","week":6,"source":"https://www.youtube.com/watch?v=NnC5aBo0OPE | https://www.youtube.com/watch?v=zj8zFP0l-NE | https://www.youtube.com/watch?v=IryolvLxgP8","questions":[{"q":"According to Daniel Goleman, ___ handle relationships with others.","options":["self-awareness","motivation","empathy","emotional regulation"],"answer":[2],"explanation":"L26 slide: EI encompasses personal competencies 'as well as how we handle relationships with others (Empathy and Social Skills)'.","verified":"lecture","c":50},{"q":"Emotional intelligence can be considered a type of ___ intelligence.","options":["academic","genetic","social","external"],"answer":[2],"explanation":"L26: EI 'is a type of social intelligence'.","verified":"lecture","c":51},{"q":"Noticing a difficult emotion and slowing down or resisting any impulsive action that may follow highlights ___ component of emotional intelligence.","options":["Self-regulation","Motivation","Emotional literacy","Empathy"],"answer":[0],"explanation":"L27/L28: self-regulation/self-management = keeping disruptive emotions and impulses in check, slowing down before acting.","verified":"lecture","c":52},{"q":"The following are signs of emotional intelligence, except ___.","options":["strong sense of curiosity","holding onto mistakes","ability to manage emotions in difficult situations","self-confidence"],"answer":[1],"explanation":"L27: EI signs include 'being able to move on after making a mistake'; holding onto mistakes is not a sign.","verified":"lecture","c":53,"rel":[["Jul-Oct 2023",6,0]]},{"q":"Perceiving emotions means ___.","options":["Ignoring signals","Understanding only what somebody is saying to you","Understanding only somebody's facial expression","Understanding both verbal and nonverbal signals"],"answer":[3],"explanation":"L27: perceiving emotions means understanding verbal and nonverbal signals (body language, facial expressions).","verified":"lecture","c":54},{"q":"___ suggests that 10 distinct components provide the scaffolding of emotionally and socially intelligent behaviors.","options":["Bar-On","Goleman","Salovey","Mayer"],"answer":[0],"explanation":"L27: 'Bar-On suggests that the 10 distinct components provide the scaffolding of the emotionally and socially intelligent behavior'.","verified":"lecture","c":55},{"q":"Which of the following is a facilitator of EQ?","options":["optimism","happiness","independence","all of the given"],"answer":[3],"explanation":"L28 slide: 'Self-actualization, independence, social responsibility, optimism, and happiness... reframed as facilitators of EQ (Bar-On)'.","verified":"lecture","c":56},{"q":"___ is a strategy for improving one's self-awareness.","options":["rejecting feedback","using critical self-talk daily","developing a fixed mindset","pursuing one's passion"],"answer":[3],"explanation":"L28 slide 'Strategies for improving one's Self-awareness': '...Pursue one's passions and do what makes one happy... Use positive self-talk... growth mindset'.","verified":"lecture","c":57},{"q":"Having students create autobiographies is an example of creating opportunities for ___.","options":["emotional labor","emotional contagion","metacognition","none of the given"],"answer":[2],"explanation":"Not found in the L26-30 transcripts or sampled slides; writing autobiographies is a reflective 'thinking about one's own thinking/experience' activity, i.e. metacognition; the other options clearly don't fit.","verified":"reasoning","c":58},{"q":"Which of the following is not true about management of emotions?","options":["It is essentially a private act","It is directly regulated by others","It is influenced by cultural norms","It is influenced by what society defines as appropriate to feel and express"],"answer":[1],"explanation":"L29: 'the management of emotion is essentially private act... culture specific... what is appropriate to feel and express... we are not regulated' by others.","verified":"lecture","c":59}]},{"year":2026,"session":"Jul-Oct 2026","week":7,"source":"https://www.youtube.com/watch?v=kQhYmSFZwTQ | https://www.youtube.com/watch?v=bglyqpd0q2Y | https://www.youtube.com/watch?v=Fp7aiijtm0g | https://www.youtube.com/watch?v=zGRIlP-S0vY","questions":[{"q":"Simon defined learning as changes in a system that result in ___ over time on tasks similar to those done previously.","options":["boredom","decreased anxiety","improved performance","reduced performance"],"answer":[2],"explanation":"L31 slide: 'Simon defined learning as changes in a system that result in improved performance over time on tasks similar to those done previously'.","verified":"lecture","c":60},{"q":"Robert Gagne defined learning as ___.","options":["a change in human disposition or capacity","a change that persists over a period of time","a change not simply ascribable to processes of growth","all of the given"],"answer":[3],"explanation":"L31: Gagne - 'change in human disposition or capacity that persists over a period of time and is not simply ascribable to processes of growth' - all three parts.","verified":"lecture","c":61},{"q":"Psychomotor skills are ___ skills.","options":["cognitive","spiritual","mental","physical"],"answer":[3],"explanation":"L31: psychomotor objectives are physical/movement skills (reflex, fundamental movement, physical activities, skilled movement).","verified":"lecture","c":62},{"q":"Returning to experience refers to ___.","options":["attending to feelings","re-examining experience in the light of one's intent and existing knowledge","using helpful feelings and removing obstructive ones","recalling or detailing salient events"],"answer":[3],"explanation":"L31 slide (Dewey): 'Returning to experience - that is to say recalling or detailing salient events'.","verified":"lecture","c":63},{"q":"Which of the following assumptions does not come under the behaviorist orientation to learning?","options":["Differences between individuals are important as they will affect learning","Observable behavior rather than internal thought processes are the focus of study.","Environment shapes one's behavior","The principle of contiguity is central"],"answer":[0],"explanation":"L31: 'difference between individuals are important... individual differences' is an assumption of the cognitive orientation, not behaviorist.","verified":"lecture","c":64},{"q":"Reinforcement can come through sharing of results rather than a reward.","options":["True","False"],"answer":[0],"explanation":"L31: 'reinforcement can come through giving information, that is knowledge of the result' rather than simply a reward.","verified":"lecture","c":65},{"q":"___ has contributed to the humanistic orientations to learning.","options":["linguistic","kinesthetic","visual","Carl Rogers"],"answer":[3],"explanation":"L31: humanistic orientation 'has been propagated by Carl Rogers'.","verified":"lecture","c":66},{"q":"In the process of learning, which of the following is not a component of output?","options":["certification","attitude change","knowledge enhancement","training plan"],"answer":[3],"explanation":"L32: outputs of learning = competency development, knowledge, skills, attitudinal change, certification; a training plan is an input.","verified":"lecture","c":67},{"q":"Ambience, space and decorum do not affect learning.","options":["True","False"],"answer":[1],"explanation":"L32: environmental variables include 'ambience', space, 'decorum', noise, lighting - they do affect learning.","verified":"lecture","c":68},{"q":"Role-playing can motivate ___ type of learners effectively.","options":["solitary","social","reading/writing","logical/analytical"],"answer":[1],"explanation":"L32: for social/linguistic learners 'the teacher can motivate them by giving them some assignments like role playing, group activities'.","verified":"lecture","c":69}]},{"year":2026,"session":"Jul-Oct 2026","week":8,"source":"https://www.youtube.com/watch?v=mhdjBQlSKkY | https://www.youtube.com/watch?v=YN-uGlyPcxw | https://www.youtube.com/watch?v=9XSgPgkby_U | https://www.youtube.com/watch?v=j653sk8WY5c","questions":[{"q":"The word 'pedagogy' has been derived from the ___ word \"pedagogue\".","options":["Latin","Sanskrit","Greek","English"],"answer":[2],"explanation":"L36: 'it has come from the Greek word... pedagogue'.","verified":"lecture","c":70},{"q":"Which of the following statements is not true about pedagogy?","options":["It is a method or way of teaching","It is derived from the Greek word \"pedagogue\"","It helps a teacher understand how learning should be facilitated.","It harms the quality of teaching and learning."],"answer":[3],"explanation":"L36: pedagogy 'improves the quality of teaching and learning', so 'harms the quality' is not true.","verified":"lecture","c":71,"rel":[["Jul-Oct 2024",8,0]]},{"q":"Pedagogy can enhance the student-teacher relationship.","options":["True","False"],"answer":[0],"explanation":"L36/L37: pedagogy builds teacher-student interaction and relationships (modern pedagogy lets teachers guide/coach each student); statement true.","verified":"lecture","c":72},{"q":"___ learning is based on the model that knowledge can be created within a population where members actively interact by sharing experiences and take on asymmetry roles.","options":["integrative","inquiry-based","collaborative","constructivist"],"answer":[2],"explanation":"L36: collaborative learning 'is based on knowledge can be created in the group context by sharing the experiences and by playing different roles that is asymmetric'.","verified":"lecture","c":73},{"q":"The Pedagogical Model provides an overview of the learning cycle and breaks it down into ___ domains or phases of instruction.","options":["five","three","two","seven"],"answer":[0],"explanation":"L36: pedagogical model learning cycle has 'five stages' - engage, explore, explain, elaborate, evaluate.","verified":"lecture","c":74},{"q":"Which of the following is not a type of inquiry-based approach?","options":["confrontation","structure","guided","open"],"answer":[0],"explanation":"Inquiry types (confirmation, structured, guided, open) are not listed in the L36-37 transcripts/slides sampled; 'confrontation' is not an inquiry type while structured, guided and open are.","verified":"reasoning","c":75},{"q":"In experiential learning, students are engaged ___.","options":["intellectually","soulfully","socially","all of the given"],"answer":[3],"explanation":"L37 slide: 'Students are engaged intellectually, emotionally, socially, soulfully and/or physically'.","verified":"lecture","c":76},{"q":"___ stage of experiential theory by Kolb focuses on planning.","options":["concrete experience","abstract conceptualization","reflective observation","active experimentation"],"answer":[3],"explanation":"L37 slide (Kolb): 'Active Experimentation (planning / trying out what you have learned)'.","verified":"lecture","c":77},{"q":"People with a ___ learning style can often act on \"gut feeling\" and will rely on others' analysis rather than their own.","options":["accommodating","converging","diverging","assimilating"],"answer":[0],"explanation":"L37: accommodating learners 'rely more on intuition, gut feeling, relying on others'.","verified":"lecture","c":78},{"q":"According to the ___ principle, students learn better from animation and narration than from animation and on-screen text.","options":["multimedia","modality","coherence","temporal contiguity"],"answer":[1],"explanation":"L38: modality principle - 'students learn better from animation and narration than from animation and on-screen text'.","verified":"lecture","c":79}]},{"year":2026,"session":"Jul-Oct 2026","week":9,"source":"https://www.youtube.com/watch?v=vd_WDHfcsMY | https://www.youtube.com/watch?v=gYbIhCjEa_A | https://www.youtube.com/watch?v=FA3GFzEuowg | https://www.youtube.com/watch?v=gFFILc4VAhc","questions":[{"q":"E-learning is any form of ___.","options":["teaching","training","tutoring","all of the given"],"answer":[3],"explanation":"L41: e-learning is 'any form of teaching, training or tutoring' delivered electronically.","verified":"lecture","c":80},{"q":"___ is a feature of e-learning.","options":["difficulty in access","user friendliness","social injustice","closed learning"],"answer":[1],"explanation":"L41 features include 'user friendliness'; the others are opposites of listed features (accessibility, social justice, open learning).","verified":"lecture","c":81,"rel":[["Jul-Oct 2025",9,0],["Jul-Oct 2023",9,0]]},{"q":"E-learning is a synonym of audio-visual learning, multimedia learning, and distance learning.","options":["True","False"],"answer":[1],"explanation":"L41 slide: 'It is not a synonym of audio-visual learning, multimedia learning, distance learning as these are just complementary.'","verified":"lecture","c":82},{"q":"Which of the following is not a type of e-learning?","options":["text-driven","interactive","simulation","physical"],"answer":[3],"explanation":"L41 types: text-driven, interactive, simulation; 'physical' is not a type.","verified":"lecture","c":83},{"q":"Which of the following is not a benefit of e-learning?","options":["It can accommodate the need of a housewife","People can revise the learning content as many times as they want","It facilitates in developing and communicating new training policies","None of the given"],"answer":[3],"explanation":"L41 slide benefits: suits 'a working person or housewife or a student', content accessible any number of times, 'facilitates in developing and communicating new training policies' - all benefits.","verified":"lecture","c":84,"rel":[["Jul-Oct 2023",9,0]]},{"q":"Good learners know ___.","options":["What they are learning","Why they are learning","How they are learning","All of the given"],"answer":[3],"explanation":"L42 slide: 'Good learners know not only what and why they are learning' but also how (self-awareness).","verified":"lecture","c":85},{"q":"Learners may multitask when engaging in an online course, which could be resulting in ___.","options":["hyperfocus","better retrieval","shorter attention spans","None of the given"],"answer":[2],"explanation":"L43: continuous multitasking 'makes our attention span very short'.","verified":"lecture","c":344,"rel":[["Jul-Oct 2025",9,1],["Jul-Oct 2024",9,1]]},{"q":"___ learning is the crucial determinant of successful e-learning.","options":["passive","retrospective","social","active"],"answer":[3],"explanation":"L42 slide: 'Active learning is the crucial determinant of successful E-learning'.","verified":"lecture","c":87},{"q":"The brain can process 36,000 visual cues per ___.","options":["hour","second","day","year"],"answer":[0],"explanation":"L42 slide: 'The brain can process 36,000 visual cues per hour!'","verified":"lecture","c":88},{"q":"For effective learning, online courses should ___.","options":["use headings","use complex language","present long pieces of text","use random images"],"answer":[0],"explanation":"L43: content language should be lucid and 'highlight the important things by using the headings, categories, bullet points'.","verified":"lecture","c":89}]},{"year":2026,"session":"Jul-Oct 2026","week":10,"source":"https://www.youtube.com/watch?v=cWnnsvTzMiM | https://www.youtube.com/watch?v=6nPQjYL7WRc | https://www.youtube.com/watch?v=skd8U9N2s9s","questions":[{"q":"During Covid-19 the world was busy in preparing 1.5 billion learners for the new normal, i.e., ___ learning.","options":["ineffective","physical","remote","experiential"],"answer":[2],"explanation":"L46 slide: 'During Covid-19 the world was busy in preparing 1.5 billion learners for the new normal, i.e., remote learning'.","verified":"lecture","c":90},{"q":"To develop learner readiness for online learning, training sessions on ___ are helpful.","options":["netiquettes","time management","developing study skills","all of the given"],"answer":[3],"explanation":"L46: learners needed training on net etiquette, time management and developing study skills.","verified":"lecture","c":91},{"q":"The typical picture of a teacher being a dispenser of knowledge to the students has been replaced by that of a ___.","options":["obstructor","parent","friend","facilitator"],"answer":[3],"explanation":"L46 slide: dispenser of knowledge 'replaced by that of a facilitator'.","verified":"lecture","c":92},{"q":"In 2018, Global Education and Skills Forum noted that the 'future' teacher would need the 5 skills to thrive in the 21st century. Which of the following is not one of them?","options":["Strong social skills","Data analysis","External focus","Strictness"],"answer":[3],"explanation":"Lecture 46 slide: the \"future\" teacher needs 5 skills to thrive in the 21st century, including strong social skills, data analysis, being a facilitator and an external focus. Strictness is not one of them.","verified":"lecture","c":349,"rel":[["Jul-Oct 2024",10,1]]},{"q":"Participatory education demands ___ so as to build a needs-based approach to teaching.","options":["creativity","stubbornness","reward","none of the given"],"answer":[0],"explanation":"L46 slide: 'Participatory education demands creativity so as to build a needs-based approach to teaching'.","verified":"lecture","c":94},{"q":"Students who consider intelligence as a malleable entity tend to focus on their obstacles instead of goals.","options":["True","False"],"answer":[1],"explanation":"L46 slide (Principle 1): malleable-intelligence students 'tend to focus on their goals despite obstacles' - the statement reverses this, so False.","verified":"lecture","c":95},{"q":"Which of the following is not a principle to enhance student learning?","options":["What students already know affects their learning","Learning is context-based","Students' cognitive development and learning is limited by the general stages of development.","The acquisition of knowledge and skills in the long term depends largely on practice."],"answer":[2],"explanation":"L46 principle 3: cognitive development 'is not limited by the general stages of development' - option c contradicts it.","verified":"lecture","c":96},{"q":"___ feedback to students is important for learning.","options":["Unclear","Late","Harsh","Explanatory"],"answer":[3],"explanation":"L47: 'clear, explanatory and timely feedback' is important.","verified":"lecture","c":97,"rel":[["Jul-Oct 2025",10,0]]},{"q":"Mastery goals are those that are geared towards the acquisition or improvement of ___.","options":["Skills","Number of students in a classroom","Teacher feedback","None of the given"],"answer":[0],"explanation":"L47: 'Mastery goals are those that are geared towards the acquisition or improvement of skills'.","verified":"lecture","c":98},{"q":"The vast majority of formative assessment is ___.","options":["Formal","Incorrect","Written","informal"],"answer":[3],"explanation":"L49 slide: 'The vast majority of genuine formative assessment is informal, with interactive and timely feedback'.","verified":"lecture","c":99}]},{"year":2026,"session":"Jul-Oct 2026","week":11,"source":"https://www.youtube.com/watch?v=ebr-QzeHikw | https://www.youtube.com/watch?v=hRgoNNgCzZ4 | https://www.youtube.com/watch?v=09KozyIEL6o","questions":[{"q":"Social cognition has a protracted development through infancy to ___.","options":["teenage","old-age","adulthood","death"],"answer":[2],"explanation":"L51 slide: 'Social cognition has a protracted development through infancy to adulthood.'","verified":"lecture","c":100},{"q":"Which of the following abilities comes under social cognition?","options":["Face processing","Joint attention","Theory of mind","All of the given"],"answer":[3],"explanation":"L51 slide: social cognition includes 'face processing and joint attention, and more complex ones, such as theory of mind'.","verified":"lecture","c":101},{"q":"Under social cognition, abilities involved in affective processing are often called ___.","options":["hot","cold","white","black"],"answer":[0],"explanation":"L51 slide: 'abilities involved in affective (\"hot\"; e.g., facial expression processing) vs cognitive (\"cold\")'.","verified":"lecture","c":102},{"q":"Social schemas refer to people's mental representations of social ___.","options":["values","memories","skills","patterns"],"answer":[3],"explanation":"L51 slide: 'Social schemas refer to people's mental representations of social patterns and norms.'","verified":"lecture","c":103},{"q":"During the earliest stages of development, children are very ___-centric. They see the world from their own perspective and struggle to think about how other people may view the world.","options":["selfish","ego","conscious","emotional"],"answer":[1],"explanation":"L51: young children are 'very much egocentric'.","verified":"lecture","c":104},{"q":"A theory of mind refers to a person's ability to understand and think about the ___ of other people.","options":["behaviors","family backgrounds","mental states","language"],"answer":[2],"explanation":"L52: theory of mind = ability to understand and think about the mental state of others.","verified":"lecture","c":105,"rel":[["Jul-Oct 2025",11,0]]},{"q":"The same social behavior in one cultural setting might have a very different meaning and interpretation if it were to occur or be observed in another culture.","options":["True","False"],"answer":[0],"explanation":"L52: cultural differences - e.g. smiling has different interpretations in different cultures.","verified":"lecture","c":106},{"q":"Social cognitive theory by Bandura focuses on concepts of ___","options":["self-efficacy","modeling","observational learning","all of the given"],"answer":[3],"explanation":"L52: Bandura's theory covers observational learning, modeling and self-efficacy.","verified":"lecture","c":107},{"q":"The central tenet of Bandura's social-cognitive theory is that people seek to develop a sense of ___ over the important events in their lives.","options":["agency","dependency","attachment","emotion"],"answer":[0],"explanation":"L52: 'the central tenet of Bandura's theory ... is that people seek to develop a sense of agency'.","verified":"lecture","c":108},{"q":"___ hypothesis suggests that social processes influence how information is selected, organized, integrated, and retrieved.","options":["activation","cognitive influence","interaction","social cue strength"],"answer":[1],"explanation":"L54: cognitive influence hypothesis - social processes influence how information is selected, organized, integrated and retrieved.","verified":"lecture","c":109,"rel":[["Jul-Oct 2024",11,0]]}]},{"year":2026,"session":"Jul-Oct 2026","week":12,"source":"https://www.youtube.com/watch?v=ioWtxm7yhQ4 | https://www.youtube.com/watch?v=d6oJtslue8M | https://www.youtube.com/watch?v=KuDm-ly6M0o","questions":[{"q":"Sustainability in economic sustainability is ___","options":["multidimensional","bidimensional","unidimensional","none of the given"],"answer":[2],"explanation":"Corrected after checking the lecture (was: multidimensional). L56 slide (Eggert 2009): sustainability as used in 'economic sustainability' (like environmental and social) 'is a one dimensional concept'; only sustainable development is multidimensional.","verified":"lecture","c":110},{"q":"The term \"sustainable development\" was first mentioned in a book related to the 1972 UN Stockholm conference on ___.","options":["water","poverty","economic crisis","human environment"],"answer":[3],"explanation":"L56: 'the term has been mentioned in a book in 1972 ... UN Stockholm conference on human environment'.","verified":"lecture","c":111},{"q":"Environmental sustainability focuses on impacts of processes, products and services on ___.","options":["water","biodiversity","human health","all of the given"],"answer":[3],"explanation":"L56: natural resources affected - air, water, land, biodiversity, human health, ocean environment.","verified":"lecture","c":112,"rel":[["Jul-Oct 2025",12,0]]},{"q":"Which of the following does not come under social sustainability?","options":["Labour practices","Revenue generation","Human rights","Business ethics"],"answer":[1],"explanation":"L56: social sustainability covers labour practices, human rights, business ethics, workplace health and safety; revenue generation is economic sustainability.","verified":"lecture","c":113},{"q":"SDG ___ focuses on clean water and sanitation.","options":["1","17","6","3"],"answer":[2],"explanation":"L56: 'six is that clean water and sanitation'.","verified":"lecture","c":114},{"q":"SDG 16 focuses on ___","options":["No poverty","No hunger","Good health","Peace and justice"],"answer":[3],"explanation":"L56: 'sdg 16 is for peace and justice'.","verified":"lecture","c":115},{"q":"On 20 October 2020, the Higher Education Sustainability Initiative (HESI) raised the flag of higher education as a driver for sustainable development and inclusive societies on the first day of the ___ 2020.","options":["National Sustainability Meeting","National Teachers Meeting","Global Childrens' Meeting","Global Education Meeting"],"answer":[3],"explanation":"L57: HESI raised the flag 'on the first day of Global Education Meeting in 2020 on October 20th'.","verified":"lecture","c":116},{"q":"Education is related to all SDGs.","options":["True","False"],"answer":[0],"explanation":"L57: 'how education plays a vital role in all the 17 goals' - ESD is important for every SDG.","verified":"lecture","c":117},{"q":"Successful implementation of ESD requires a shift in focus from ___.","options":["teaching to learning","learning to teaching","reading to speaking","knowing to ignoring"],"answer":[0],"explanation":"Lecture 58 slide: ESD requires a \"shift in focus from teaching to learning\".","verified":"lecture","c":246,"rel":[["Jul-Oct 2025",12,1],["Jul-Oct 2024",12,0]]},{"q":"___ competency is the ability to reflect on one's own role in the local community and (global) society.","options":["collaboration","self-awareness","strategic","normative"],"answer":[1],"explanation":"L59: 'self-awareness competencies, that is our ability to reflect on our own role in the local community as well as the global society'.","verified":"lecture","c":119,"rel":[["Jul-Oct 2025",12,0]]}]},{"year":2025,"session":"Jul-Oct 2025","week":0,"source":"https://myquizprep.pages.dev/quiz/psychology-of-learning-nov25/week0","questions":[{"q":"What is Psychology?","options":["A Science subject","Is objective perception","An art of living","A thought process","A study of cognitive processes & behavior"],"answer":[4],"explanation":"Week 0 is a general pre-course quiz with no lectures; answer is standard introductory psychology. Psychology = scientific study of mind (cognitive processes) and behavior.","verified":"reasoning","c":249,"rel":[["Jul-Oct 2024",0,1]]},{"q":"A broad field of study that explores a variety of questions about thoughts, feelings and actions is___?","options":["Society","Globalization","Psychology","Social Science","Human Development"],"answer":[2],"explanation":"Week 0 is a general pre-course quiz with no lectures; answer is standard introductory psychology.","verified":"reasoning","c":250,"rel":[["Jul-Oct 2024",0,1]]},{"q":"A systematic assessment that provides information on political views, consumer buying habits and many other topics is called___?","options":["Standardized test.","Projects","Experiments","Survey","Psychological tests"],"answer":[3],"explanation":"Week 0 is a general pre-course quiz with no lectures; answer is standard introductory psychology. Surveys gather data on political views, buying habits etc.","verified":"reasoning","c":251,"rel":[["Jul-Oct 2024",0,1]]},{"q":"The word Psyche means","options":["Body or physique","Mind or soul","Science & spirituality","Mental health","Neuropsychology"],"answer":[1],"explanation":"Week 0 is a general pre-course quiz with no lectures; answer is standard introductory psychology. Greek psyche = mind/soul.","verified":"reasoning","c":252,"rel":[["Jul-Oct 2024",0,1]]},{"q":"Who established psychology laboratory in Germany?","options":["B.F. Skinner","J. Thorndike","Sigmund Freud","David Kolb","Wilhelm Wundt"],"answer":[4],"explanation":"Week 0 is a general pre-course quiz with no lectures; answer is standard introductory psychology. Wundt founded the first lab at Leipzig (1879).","verified":"reasoning","c":253,"rel":[["Jul-Oct 2024",0,1]]},{"q":"To help people to function effectively and fulfill their own unique potential\" is the aim of___?","options":["Humanistic psychology","Social Psychiatry","Philosophy","Development studies","Sustainable development"],"answer":[0],"explanation":"Week 0 is a general pre-course quiz with no lectures; answer is standard introductory psychology. Humanistic psychology aims at self-actualization.","verified":"reasoning","c":254,"rel":[["Jul-Oct 2024",0,1]]},{"q":"Behaviorists use a learning process to change abnormal behavior is called___?","options":["Rationalism","Experiential intervention","Gestalt mechanism","Hypotheses verification","Conditioning"],"answer":[4],"explanation":"Week 0 is a general pre-course quiz with no lectures; answer is standard introductory psychology. Behaviour therapy uses conditioning.","verified":"reasoning","c":255,"rel":[["Jul-Oct 2024",0,1]]},{"q":"The study of changes in behavior during life time is called","options":["Behaviorism","Individual difference","Developmental Psychology","Maturational theory","Genetics or Heredity"],"answer":[2],"explanation":"Week 0 is a general pre-course quiz with no lectures; answer is standard introductory psychology.","verified":"reasoning","c":256,"rel":[["Jul-Oct 2024",0,1]]},{"q":"The study of differences and similarities in the behavior of animals of different species is called","options":["Sociology","Social work","Rehabilitation studies","Comparative Psychology","Cultural Psychology"],"answer":[3],"explanation":"Week 0 is a general pre-course quiz with no lectures; answer is standard introductory psychology.","verified":"reasoning","c":257,"rel":[["Jul-Oct 2024",0,1]]}]},{"year":2025,"session":"Jul-Oct 2025","week":1,"source":"https://myquizprep.pages.dev/quiz/psychology-of-learning-nov25/week1","questions":[{"q":"Which of the following is true regarding learning in psychology?","options":["Learning has not been an important topic in psychology","Learning involves no change in the organism","Learning focuses on how humans speak","Learning can be defined in many ways"],"answer":[3],"explanation":"Lecture: learning \"has been defined differently by different group of psychologists\"; the other options contradict the lecture. (Lecture 1: Psychology of Learning)","verified":"lecture","c":129,"rel":[["Jul-Oct 2024",1,0]]},{"q":"Learning is seen as an effect attributed to an element in","options":["blood","environment","hormones","none of the above"],"answer":[1],"explanation":"\"observable change in the behavior that is attributed to an element in the environment\" (Lecture 1: Psychology of Learning)","verified":"lecture","c":130},{"q":"Non-associative learning refers to ____________ in the intensity of a response as the result of the repeated presentation of a stimulus.","options":["a decrease","an increase","no change","none of the above"],"answer":[0],"explanation":"\"the non-associative learning ... refers to the decrease in the intensity of a response\" (Lecture 1: Psychology of Learning)","verified":"lecture","c":131},{"q":"Which of the following is a type of learning style?","options":["visual","auditory","kinesthetic","all of the above"],"answer":[3],"explanation":"\"visual learners, auditory learners, kinesthetic learners\" are named as learner preferences. (Lecture 2: Psychology of Learning (Contd.))","verified":"lecture","c":132},{"q":"'Psychology as the Behaviorist Views It' is the famous work of","options":["Sigmund Freud","John Watson","Albert Bandura","Ivan Pavlov"],"answer":[1],"explanation":"\"his work is the psychology as the behaviorist views it\" (Watson). (Lecture 2: Psychology of Learning (Contd.))","verified":"lecture","c":133},{"q":"The state of conscious incompetence may be valuable ____________ of a learning experience.","options":["at the start","at the end","in the middle","throughout the process"],"answer":[0],"explanation":"\"the state of conscious incompetent may be valuable at the start of learning\" (Lecture 2: Psychology of Learning (Contd.))","verified":"lecture","c":134,"rel":[["Jul-Oct 2026",1,1]]},{"q":"Adding to existing student knowledge is known as","options":["conceptual change","conceptual pattern","conceptual exploration","conceptual growth"],"answer":[3],"explanation":"\"adding to the existing student knowledge known as the conceptual growth\" (Lecture 3)","verified":"lecture","c":135,"rel":[["Jul-Oct 2023",1,0]]},{"q":"Deliberate practice involves the following, except","options":["attention","rehearsal","repetition","forgetting"],"answer":[3],"explanation":"\"deliberate practice involves attention rehearsal and repetition over time\" (Lecture 4)","verified":"lecture","c":136},{"q":"Students persist in the face of challenging tasks and process information more deeply when they adopt ____________ goals.","options":["performance","insignificant","mastery","repetitive"],"answer":[2],"explanation":"Principle: students persist ... and process information more deeply when they adopt mastery goals (APA principle, read in lecture). (Lecture 4)","verified":"lecture","c":137},{"q":"____________ refers to a decrease in response rate while ____________ refers to an increase in response rate.","options":["sensitization, habituation","meaningful learning, association","habituation, sensitization","association, meaningful learning"],"answer":[2],"explanation":"Habituation = reduced response through regular exposure; sensitization described as \"just opposite\" (heightened response). (Lecture 5)","verified":"lecture","c":138}]},{"year":2025,"session":"Jul-Oct 2025","week":2,"source":"https://myquizprep.pages.dev/quiz/psychology-of-learning-nov25/week2","questions":[{"q":"According to constructivism, reality is determined by","options":["the experiences of the learner","the blood type of the learner","the future goals of the learner","none of the above"],"answer":[0],"explanation":"Constructivism: learners construct knowledge from their own experiences. (Lecture 10)","verified":"lecture","c":139},{"q":"Teachers and instructors who understand the constructivist learning theory understand that their students","options":["are all the same","bring their own unique experiences","do not demand much effort in the classroom","are careless"],"answer":[1],"explanation":"\"students bring their own unique experience in their classroom\". (Lecture 10)","verified":"lecture","c":140},{"q":"The domain of social constructivism is largely attributed to the work done by ____________ by adding the focus on societal and peer influence on learning.","options":["Jean Piaget","Lev Vygotsky","Sigmund Freud","John Watson"],"answer":[1],"explanation":"\"social constructivism ... Lev Vygotsky ... societies and peer influence has a significant role\". (Lecture 10)","verified":"lecture","c":141},{"q":"Which of the following is not a major type of learning described by behavioral psychology?","options":["classical conditioning","operant conditioning","observational learning","traditional learning"],"answer":[3],"explanation":"Behavioural psychology's three types: classical, operant, observational learning; \"traditional learning\" is not one. (Lecture 2: Psychology of Learning (Contd.))","verified":"lecture","c":142},{"q":"Which of the following is true according to behaviorism?","options":["all behaviors can be unlearned","all behaviors are directed by one's parents","all behaviors are fundamentally destructive in nature","all behaviors are unobservable"],"answer":[0],"explanation":"\"behavior can be unlearned can be unlearned and replaced by the new behavior\" (Lecture 6: Major Theories of Learning)","verified":"lecture","c":143},{"q":"In ____________ conditioning, presentation of unconditioned stimulus precedes the presentation of the conditioned stimulus.","options":["backward","delay","trace","simultaneous"],"answer":[0],"explanation":"\"backward condition is that an unconditioned stimulus precedes the presentation of the [conditioned] stimulus\" (Lecture 6: Major Theories of Learning)","verified":"lecture","c":144},{"q":"Smiling and complimenting students for good performance is a type of","options":["negative punishment","positive punishment","negative reinforcement","positive reinforcement"],"answer":[3],"explanation":"Praise/smiles added after good performance = positive reinforcement (operant conditioning, lecture 6).","verified":"reasoning","c":145},{"q":"Which of the following psychologists was instrumental in engendering the dramatic shift from behaviorism to cognitive theories?","options":["Tolman","Bruner","Gestalt","All of the above"],"answer":[3],"explanation":"\"Tolman ... Bruner ... German Gestalt psychologists ... instrumental in changing ... bringing this cognitive theories\". (Lecture 7)","verified":"lecture","c":146},{"q":"IQ is a typical measurement for","options":["intelligence","personality","emotions","classical learning"],"answer":[0],"explanation":"IQ is the standard measure of intelligence (lecture 8 intelligence theories). (Lecture 8)","verified":"lecture","c":147},{"q":"BBL deals with the concept of learning in a ____________ context.","options":["neuro-physiological","cognitive","social","behavioral"],"answer":[0],"explanation":"\"brain based learning ... the concept of learning in a neurophysiological context\". (Lecture 9)","verified":"lecture","c":148}]},{"year":2025,"session":"Jul-Oct 2025","week":3,"source":"https://myquizprep.pages.dev/quiz/psychology-of-learning-nov25/week3","questions":[{"q":"Which of the following is true?","options":["Human memory involves the ability to only preserve information","Human memory involves the ability to only recover information","Human memory involves the ability to neither preserve nor recover information","Human memory involves the ability to both preserve and recover information"],"answer":[3],"explanation":"Memory = encoding, storage and retrieval, i.e. both preserving and recovering information. (Lecture 11: Memory & Cognition)","verified":"lecture","c":149},{"q":"____ refers to connections between the nerve cells","options":["Storage","Synapses","Neuron","Blood"],"answer":[1],"explanation":"\"changes in this connection between the nerve cells ... synapses\". (Lecture 11: Memory & Cognition)","verified":"lecture","c":150},{"q":"In order to create a new memory, information must be changed into ____","options":["a usable form","a long form","a short form","a visual form"],"answer":[0],"explanation":"\"information must be changed to a usable form\". (Lecture 11: Memory & Cognition)","verified":"lecture","c":151},{"q":"The memory ____ process allows us to bring stored memories into conscious awareness.","options":["storage","retrieval","encoding","forgetting"],"answer":[1],"explanation":"\"memory retrieval process also allows us to bring the stored memory into the conscious awareness\". (Lecture 11: Memory & Cognition)","verified":"lecture","c":152},{"q":"Which of the following is not a major domain of cognition?","options":["Judgment","Attention","Aggression","Intelligence"],"answer":[2],"explanation":"Domains of cognition: attention, perception, memory, intelligence, executive function, social cognition, judgment; not aggression. (Lecture 11: Memory & Cognition)","verified":"lecture","c":153},{"q":"Which of the following is not an assumption of the information processing view?","options":["Information is processed in steps or stages","There are limits on how much information can be processed","The human information processing system is interactive","Information processing is analogous to computer processing"],"answer":[1],"explanation":"The question looks flawed: Lecture 11 lists all four options as assumptions of information processing (the 2024 version says \"There is no limit\"). The answer key gives this option.","verified":"unsure","c":154},{"q":"____ refers to rote rehearsal of repetition","options":["elaborative rehearsal","maintenance rehearsal","meaningful rehearsal","none of the above"],"answer":[1],"explanation":"Maintenance rehearsal = rote repetition.","verified":"reasoning","c":155},{"q":"____ presentations can enhance working memory capacity","options":["multimodal","unimodal","one by one","antimodal"],"answer":[0],"explanation":"Not found in the captions; dual-channel working memory (lecture 13) implies multimodal (audio+visual) presentation increases effective capacity.","verified":"reasoning","c":156},{"q":"Episodic and semantic memories are categorized under ____ memory","options":["procedural","structural","phonemic","declarative"],"answer":[3],"explanation":"Episodic and semantic memory are subtypes of declarative (explicit) memory. (Lecture 14)","verified":"lecture","c":157},{"q":"According to the neural network model, memory capacity depends on ____","options":["complexity of the synapses","sparseness of representations","spatial and temporal correlations between memories","all of the above"],"answer":[3],"explanation":"\"memory capacity ... depends on the complexity of the synapses, the sparseness of the representation, the spatial and temporal [correlations]\". (Lecture 14)","verified":"lecture","c":158}]},{"year":2025,"session":"Jul-Oct 2025","week":4,"source":"https://myquizprep.pages.dev/quiz/psychology-of-learning-nov25/week4","questions":[{"q":"Creative thinking is the ability to generate ____ ideas.","options":["innovative","unconventional","useful","all of the above"],"answer":[3],"explanation":"Creative thinking generates new, unconventional and useful ideas (lecture 19); all of the above.","verified":"reasoning","c":159},{"q":"____ are representative items within each concept.","options":["Constructs","Symbols","Prototypes","Categories"],"answer":[2],"explanation":"Prototypes are representative items of a concept. (Lecture 16: Thinking & Cognition)","verified":"lecture","c":160,"rel":[["Jul-Oct 2023",4,0]]},{"q":"A mental representation can take the form of a ____.","options":["word","image","sound","all of the given"],"answer":[3],"explanation":"Mental representations take the form of images, musical tones, words, etc. (Lecture 16: Thinking & Cognition)","verified":"lecture","c":161},{"q":"Which of the following is true?","options":["Thinking is a lower mental process","Thinking is a sub-vocal talking","Thinking is unrelated to problem solving","We can only think in numbers or words"],"answer":[1],"explanation":"\"thinking is a sub vocal talking\"; thinking is a higher-level function. (Lecture 16: Thinking & Cognition)","verified":"lecture","c":162},{"q":"Cognitive architecture is a theory about the ____ that create a mind in natural or artificial systems.","options":["structures","facts","images","sounds"],"answer":[0],"explanation":"\"cognitive architecture is the structure\"; a theory of the fixed structures that make up a mind. (Lecture 14)","verified":"lecture","c":163},{"q":"Bloom's Taxonomy is a system of hierarchical models (arranged in a hierarchical rank,) used to categorize ____ into varying levels of complexity.","options":["learning objectives","attention goals","prototypes","none of the above"],"answer":[0],"explanation":"Bloom's taxonomy classifies learning (educational) objectives by complexity. (Lecture 17)","verified":"lecture","c":164},{"q":"____ knowledge refers to knowledge of terminology and specific details.","options":["Metacognitive","Conceptual","Kinesthetic","Factual"],"answer":[3],"explanation":"\"factual knowledge ... relates to specific details, information, data\" (terminology and details). (Lecture 17)","verified":"lecture","c":292,"rel":[["Jul-Oct 2024",4,1]]},{"q":"Choosing to skim subheadings of unimportant information to get to the information we need as a metacognitive skill is called ____.","options":["skimming","rehearsing","self-monitoring","modifying"],"answer":[0],"explanation":"Metacognitive skill examples: knowing limits, self-monitoring, modifying, \"skimming\". (Lecture 18)","verified":"lecture","c":166},{"q":"____ refers to the ability to regulate your thoughts and set aside any personal biases to come to the best conclusion.","options":["Self-regulation","Openmindedness","Observation","Interpretation","elaboration"],"answer":[0],"explanation":"Corrected after checking the lecture (was: Openmindedness). Lecture: \"self regulation ... whenever we are reaching ... the conclusion ... we have to keep aside our personal bias ... regulating ... monitoring our thought processes\" = self-regulation, not open-mindedness. (Lecture 18)","verified":"lecture","c":167},{"q":"____ method of solving problems refers to a rule that guarantees the solution to a problem","options":["imagination","trial and error","analogy","algorithm"],"answer":[3],"explanation":"Algorithm = rule/procedure that guarantees a solution (vs heuristics/trial and error).","verified":"reasoning","c":168}]},{"year":2025,"session":"Jul-Oct 2025","week":5,"source":"https://myquizprep.pages.dev/quiz/psychology-of-learning-nov25/week5","questions":[{"q":"Motivation is seen as a ____ that drives and directs human behavior.","options":["hormonal impulse","mental impulse","attention deficit","judgment delay"],"answer":[1],"explanation":"L21 slide: 'Motivation is seen as a mental impulse that drives and directs human behavior'.","verified":"lecture","c":169},{"q":"Which of the following is false regarding motivation?","options":["Motivation is an internal process","Motivation can be directly observed","Motivation activates people's actions","None of the above"],"answer":[1],"explanation":"L21 slide: motivation is 'an internal process that can't be directly observed', so 'can be directly observed' is false.","verified":"lecture","c":170},{"q":"Which of the following does not come under intrinsic motivation?","options":["interests","social pressure","curiosity","self-satisfaction"],"answer":[1],"explanation":"L21: intrinsic factors are needs, interest, curiosity, self-satisfaction; social pressure is an extrinsic causal factor.","verified":"lecture","c":171},{"q":"Doing something/behaving well because one feels pressure from within is called ____.","options":["introjected regulation","amotivation","identified motivation","None of the given"],"answer":[0],"explanation":"L21: introjected regulation = 'doing something or behave well because one feels pressure within'.","verified":"lecture","c":172,"rel":[["Jul-Oct 2023",5,0]]},{"q":"Which of the following is not a biological need/drive?","options":["love","food","w
