ater","oxygen"],"answer":[0],"explanation":"L22 slide: biological drives relate to food, water, shelter, sex; love is a psychological drive.","verified":"lecture","c":173},{"q":"____ theory suggests that people are motivated to take action in order to receive a reward","options":["incentive","biological","arousal","goal setting"],"answer":[0],"explanation":"L22 slide: incentive theory 'suggests that people are motivated to take action in order to receive a reward'.","verified":"lecture","c":174,"rel":[["Jul-Oct 2024",5,0]]},{"q":"The Arousal Theory of Motivation was first proposed by ____.","options":["Hall","Watson","Bandura","Murray"],"answer":[3],"explanation":"L22 slide: 'The Arousal Theory of Motivation was first proposed by Henry Murray in 1938'.","verified":"lecture","c":175},{"q":"____ theory is based on the assumption that our behavior is based on making a conscious choice from a set of possible alternative behaviors.","options":["arousal","expectancy","drive","goal setting"],"answer":[1],"explanation":"L22 slide: expectancy theory 'is based on the assumption that our behavior is based on making a conscious choice from a set of possible alternative behaviors'.","verified":"lecture","c":176},{"q":"Which of the following is not an attribute of effective goal setting?","options":["unrealistic goals","specific goals","time based goals","assignable goals"],"answer":[0],"explanation":"L23: effective goals are specific, measurable, assignable, realistic, time-based; unrealistic goals are not an attribute.","verified":"lecture","c":177},{"q":"Maslow's hierarchy of needs consists of ____ tiers.","options":["four","three","six","five"],"answer":[3],"explanation":"L24: Maslow's 'five tier model... five layers'.","verified":"lecture","c":178}]},{"year":2025,"session":"Jul-Oct 2025","week":6,"source":"https://myquizprep.pages.dev/quiz/psychology-of-learning-nov25/week6","questions":[{"q":"____ is mainly responsible for popularizing emotional intelligence.","options":["John Watson","Daniel Goleman","Sigmund Freud","Albert Bandura"],"answer":[1],"explanation":"L26 slide: 'Dr. Daniel Goleman popularized the term in his 1995 book'.","verified":"lecture","c":179},{"q":"EQ is used to measure ____.","options":["cognitive intelligence","memory","emotional intelligence","attention"],"answer":[2],"explanation":"L26: emotional intelligence and emotional quotient (EQ) are used interchangeably; EQ measures EI.","verified":"lecture","c":180},{"q":"Experts suggest that EQ is more important than IQ.","options":["True","False"],"answer":[0],"explanation":"L26: 'expert says that EQ is more important than the IQ'.","verified":"lecture","c":181},{"q":"Being able to put words to feelings refers to ____.","options":["emotional responsibility","emotional cognition","emotional attention","emotional literacy"],"answer":[3],"explanation":"L26: putting feelings into words 'is called the emotional literacy'.","verified":"lecture","c":182},{"q":"The first step in emotional intelligence is ____.","options":["perceiving emotions accurately","reasoning with emotions","managing emotions","dismissing emotions"],"answer":[0],"explanation":"L27: 'perceiving emotions in the beginning first step... first is perceiving emotion'.","verified":"lecture","c":183},{"q":"According to nine-layer model pyramid, ____ lies at the bottom of the pyramid.","options":["Emotional stimuli","Self awareness","Self management","Transcendence"],"answer":[0],"explanation":"L27: the nine-layer pyramid starts 'with emotional stimuli' at its base.","verified":"lecture","c":184},{"q":"The mixed model by ____ claims that EQ is a combination of competencies, skills, and “facilitators” that contribute to how people express themselves, respond to challenges in their environment, and connect with others.","options":["Watson","Goleman","Salovey and Mayer","Bar-On"],"answer":[3],"explanation":"L27: 'Bar-On's mixed model... says that EQ is a combination of competencies, skills and facilitators'.","verified":"lecture","c":185},{"q":"The transfer of emotions from one person to another is called ____.","options":["social effect","emotional effect","social contagion","emotional contagion"],"answer":[3],"explanation":"L29 slide: 'emotional contagion - the transfer of emotional state from person to person'.","verified":"lecture","c":186},{"q":"Hochschild has given the concept of ____ using the example of flight attendants.","options":["emotional indifference","emotional difficulty","emotional labor","emotional literacy"],"answer":[2],"explanation":"L29: emotional labor illustrated with flight attendants (Hochschild).","verified":"lecture","c":187},{"q":"Review of literature shows that ____ is associated with increasing levels of burnout.","options":["emotional intelligence","deep acting","surface acting","emotional literacy"],"answer":[2],"explanation":"L29: 'surface acting is associated with increasing level of burnout' (teacher burnout literature).","verified":"lecture","c":188}]},{"year":2025,"session":"Jul-Oct 2025","week":7,"source":"https://myquizprep.pages.dev/quiz/psychology-of-learning-nov25/week7","questions":[{"q":"Which of the following is false about learning according to Gagne’s definition?","options":["It is a change in human disposition","It persists over a period of time","It is simply ascribable to processes of growth","None of the above"],"answer":[2],"explanation":"L31: Gagne - learning 'is not simply ascribable to processes of growth'.","verified":"lecture","c":189},{"q":"Manual or physical skills come under ____ component of Bloom’s taxonomy.","options":["Cognitive","Affective","Psychomotor","Physical"],"answer":[2],"explanation":"L31: psychomotor domain covers reflex/fundamental movements, physical activities, skilled movement.","verified":"lecture","c":190},{"q":"Reflection, learning and education was explored by ____.","options":["Carl Rogers","John Watson","Benjamin Bloom","John Dewey"],"answer":[3],"explanation":"L31 slide: 'John Dewey's Reflection, learning and education: Returning to experience...'.","verified":"lecture","c":191},{"q":"The principles of ____ refer to how close in time two events must be for a bond to be formed.","options":["behavior","reinforcement","repetition","contiguity"],"answer":[3],"explanation":"L31: principle of contiguity - how close in time two events must be for a bond to form (behaviorist orientation).","verified":"lecture","c":192},{"q":"____ gives information to learners about their success or failure concerning the task at hand.","options":["Cognitive feedback","Emotional feedback","Reinforcement","Physical feedback"],"answer":[0],"explanation":"L31: 'cognitive feedback... gives the idea to the learner how successful he has been, where is the failure' (knowledge of results).","verified":"lecture","c":193},{"q":"The ____ orientation to learning has a quality of personal involvement—the whole person in both feeling and cognitive aspects being in the learning event.","options":["behavioral","cognitive","humanistic","social"],"answer":[2],"explanation":"L31: humanistic orientation (Carl Rogers) - 'not just about only cognition but cognition and feeling', personal involvement.","verified":"lecture","c":194},{"q":"Learning through play is ____ learning.","options":["primary","secondary","passive","active"],"answer":[3],"explanation":"L32: active learning = learning by doing, 'learning by playing', experimenting.","verified":"lecture","c":195},{"q":"People with ____ learning style are prone to sorting their ideas after speaking, rather than thinking ideas through before.","options":["logical","solitary","visual","auditory"],"answer":[3],"explanation":"L32: auditory learners learn by 'speaking... reading aloud, sorting their ideas after speaking'.","verified":"lecture","c":196},{"q":"Which of the following statements is false?","options":["Effective instruction is static","Effective instruction is eclectic","Effective instruction is generative","Effective instruction is interactive"],"answer":[0],"explanation":"L33: effective instruction 'is generative and dynamic, it's not fixed', eclectic, interactive - so 'static' is false.","verified":"lecture","c":197},{"q":"In ADDIE model, I stand for ____.","options":["instruction","implementation","integration","induction"],"answer":[1],"explanation":"L33: ADDIE - analysis, design, development, implementation, evaluation.","verified":"lecture","c":198}]},{"year":2025,"session":"Jul-Oct 2025","week":8,"source":"https://myquizprep.pages.dev/quiz/psychology-of-learning-nov25/week8","questions":[{"q":"Pedagogy can be defined as a way of ____ any theoretical topic or academic subject.","options":["forgetting","teaching","remembering","memorizing"],"answer":[1],"explanation":"L36: pedagogy 'can be defined as a way of teaching of both the theoretical subjects, practical subjects'.","verified":"lecture","c":199},{"q":"Good pedagogy is about ____.","options":["enabling self to be good at rote memorization","eliciting responses that demonstrate understanding","hampering cognitive development of learners","None of the above"],"answer":[1],"explanation":"L36: 'the primary focus of good pedagogy... is to elicit the responses that demonstrate that understanding'.","verified":"lecture","c":200},{"q":"Which of the following is a pedagogical approach in teaching?","options":["inductive","integrative","instance-based","intuitive"],"answer":[1],"explanation":"L36 slide: integrative approach is one of the five pedagogical approaches.","verified":"lecture","c":201,"rel":[["Jul-Oct 2024",8,0],["Jul-Oct 2023",8,0]]},{"q":"According to the ____ approach, learners are the makers of meaning and knowledge.","options":["solitary learning","passive learning","constructivist learning","metalearning"],"answer":[2],"explanation":"L36: in the constructivist approach 'Learners are the makers of the meaning and knowledge'.","verified":"lecture","c":202},{"q":"Which of the following is false about inquiry-based learning?","options":["is a form of passive learning","includes problem-based learning","generally used in small scale investigations","starts by posing questions"],"answer":[0],"explanation":"L36: inquiry-based 'is a form of active learning', starts by posing questions, problem-based, 'used in the small scale investigation' - so 'passive' is false.","verified":"lecture","c":203},{"q":"The ____ model describes what effective teachers do in their classrooms to engage students in intellectually challenging work.","options":["pedagogical","systematic","engagement","intellectual"],"answer":[0],"explanation":"L36: 'the pedagogical model... what effective teachers do in the classroom to engage the students in intellectually challenging work'.","verified":"lecture","c":204},{"q":"In experiential learning, experiences are structured to require the student to ____.","options":["take initiative","make decisions","be accountable for results","all of the above"],"answer":[3],"explanation":"L37 slide: 'Experiences are structured to require the student to take initiative, make decisions and be accountable for results'.","verified":"lecture","c":205},{"q":"The following are the roles of an instructor in experiential learning, except ____.","options":["setting suitable experiences","posing problems","supporting students","blurring the boundaries"],"answer":[3],"explanation":"L37 slide: roles are 'setting suitable experiences, posing problems, setting boundaries, supporting students...'; blurring boundaries is not a role.","verified":"lecture","c":206},{"q":"Kolb's experiential learning style theory is typically represented by a ____-stage learning cycle","options":["three","five","four","seven"],"answer":[2],"explanation":"L37: Kolb's 'four stage learning cycle'.","verified":"lecture","c":207},{"q":"People with ____ learning style are hands-on learners, and rely on intuition over logic.","options":["converging","accommodating","integrating","emotional"],"answer":[1],"explanation":"L37: 'accommodating is more of hands-on learners, they rely more on intuition, gut feeling, relying on others'.","verified":"lecture","c":208}]},{"year":2025,"session":"Jul-Oct 2025","week":9,"source":"https://myquizprep.pages.dev/quiz/psychology-of-learning-nov25/week9","questions":[{"q":"A ____ classroom is the changing face of learning.","options":["digital","closed","passive","none of the above"],"answer":[0],"explanation":"L41: the digital classroom 'has completely changed the face of learning and education in 21st century'.","verified":"lecture","c":209},{"q":"Which of the following is not a feature of e-learning?","options":["accessibility","teacher-centeredness","social justice","personalization"],"answer":[1],"explanation":"Lecture 41 slide lists the features of e-learning: \"Accessibility, user friendliness and social justice; Personalization, individualization and learner-centeredness\". It is learner-centred, not teacher-centred.","verified":"lecture","c":458,"rel":[["Jul-Oct 2026",9,0],["Jul-Oct 2023",9,1]]},{"q":"Which of the following is a synonym of e-learning?","options":["audio-visual learning","multimedia learning","distance learning","none of the above"],"answer":[3],"explanation":"L41 slide: 'It is not a synonym of audio-visual learning, multimedia learning, distance learning as these are just complementary.'","verified":"lecture","c":211},{"q":"In ____ e-learning course, the content is simple and comprises text, images, audio, powerpoint presentation and text questions.","options":["simulation-based","interactive","powerpoint-driven","text-driven"],"answer":[3],"explanation":"L41 slide: 'Text Driven: In a text-driven e-learning course, the content is simple and comprises text, images, audio, power-point presentation and text questions.'","verified":"lecture","c":212},{"q":"Recent thinking in cognitive psychology places the ____ firmly at the center of the learning experience.","options":["computer","parent","teacher","individual"],"answer":[3],"explanation":"L42: 'recent thinking on the cognitive psychology places the individual firmly at the center'.","verified":"lecture","c":213},{"q":"Which of the following is true?","options":["Learning depends on self-awareness.","Learning is social","Learning is goal-oriented","All of the above"],"answer":[3],"explanation":"L42: principles - learning is goal oriented, learning depends on self-awareness, learning is social (and active).","verified":"lecture","c":214},{"q":"Learners may multitask when engaging in an online course, which could be resulting in ____.","options":["hyperfocus","better retrieval","shorter attention spans","None of the given"],"answer":[2],"explanation":"L43: continuous multitasking 'makes our attention span very short'.","verified":"lecture","c":344,"rel":[["Jul-Oct 2026",9,1],["Jul-Oct 2024",9,1]]},{"q":"The brain can process ____ visual cues per hour!","options":["36","360","3600","36,000"],"answer":[3],"explanation":"L42 slide: 'The brain can process 36,000 visual cues per hour!'","verified":"lecture","c":216},{"q":"Our brain has approximately ____ neurons that send information to one another.","options":["85 billion","85 million","85 lakhs","85,000"],"answer":[0],"explanation":"L42 slide: 'Our brain has approximately 85 billion neurons that send information to one another.'","verified":"lecture","c":217},{"q":"____ is referring to learners' automatic performance on specific procedures with predetermined steps to be followed.","options":["chaining","automatization","framing","none of the above"],"answer":[0],"explanation":"L44 slide: 'Chaining is referring to learners' automatic performance on specific procedures...' - keyed term is chaining.","verified":"lecture","c":218}]},{"year":2025,"session":"Jul-Oct 2025","week":10,"source":"https://myquizprep.pages.dev/quiz/psychology-of-learning-nov25/week10","questions":[{"q":"The ____ Model for New Normal in Education has been designed by many educational institutions.","options":["Pedagogical","Readiness","Instructional","Systematic"],"answer":[1],"explanation":"L46: 'Readiness model for the New Normal education has been prepared'.","verified":"lecture","c":219},{"q":"The most critical factor that plays a significant role in the success of any remote learning program is the ____.","options":["software used by teacher","readiness of the participants","personality of the teacher","the quality of schooling"],"answer":[1],"explanation":"L46 slide: 'Learners' Readiness: The most critical factor that plays a significant role in the success of any remote learning program is the readiness of the participants.'","verified":"lecture","c":220},{"q":"The typical picture of a teacher being a ____ of knowledge to the students has been replaced.","options":["absorber","collector","exploiter","dispenser"],"answer":[3],"explanation":"L46 slide: 'the typical picture of a teacher being a dispenser of knowledge to the students has been replaced by that of a facilitator'.","verified":"lecture","c":221},{"q":"What does today's teacher need to be successful in the classroom?","options":["digital skills","life skills","communication skills","all of the above"],"answer":[3],"explanation":"L46: today's teacher needs digital skills, life skills, communication skills (plus creativity etc.).","verified":"lecture","c":222},{"q":"Students who consider intelligence as a ____ entity tend to focus on their goals despite obstacles.","options":["malleable","rigid","God-given","unreliable"],"answer":[0],"explanation":"L46 slide (Principle 1): 'Students who consider intelligence as a malleable entity tend to focus on their goals despite obstacles.'","verified":"lecture","c":223},{"q":"____ feedback to students is important for learning.","options":["clear","explanatory","timely","all of the above"],"answer":[3],"explanation":"L47 principle 6: 'clear, explanatory and timely feedback to students is very important for learning'.","verified":"lecture","c":224,"rel":[["Jul-Oct 2026",10,0]]},{"q":"Students tend to enjoy learning and have better outcomes when their motivation is more intrinsic than extrinsic.","options":["False","True"],"answer":[1],"explanation":"L47 principle 9: motivation more intrinsic than extrinsic gives more enjoyment and better outcomes.","verified":"lecture","c":225},{"q":"Long term goals are also called ____ goals.","options":["non urgent","principal","proximal","distal"],"answer":[3],"explanation":"L47 slide (Principle 12): 'Short-term (proximal), specific and challenging objectives are more motivating than long-term (distal), general' ones.","verified":"lecture","c":226},{"q":"Which of the following is an example of a reward?","options":["clapping","giving money","giving a compliment","all of the above"],"answer":[3],"explanation":"L48 slide: 'A reward may be social, such as clapping, or tangible, such as giving' money; verbal praise/compliments also rewards - all of the above.","verified":"lecture","c":227},{"q":"____ is a teaching approach that generates feedback students can use to improve their performance.","options":["Assessment for performance","Assessment for marks","Assessment for rewards","Assessment for learning"],"answer":[3],"explanation":"L49: 'assessment for learning is also a teaching approach that generates the feedback to the students that can use to improve their performance'.","verified":"lecture","c":228}]},{"year":2025,"session":"Jul-Oct 2025","week":11,"source":"https://myquizprep.pages.dev/quiz/psychology-of-learning-nov25/week11","questions":[{"q":"Social cognition is the cognitive processes that influence ____.","options":["social schema","social behavior","social media","none of the above"],"answer":[1],"explanation":"L51: 'social cognition is the cognitive process that influences social behavior'.","verified":"lecture","c":229},{"q":"Smooth and adaptive social interactions depend on the recruitment of ____.","options":["perception","attention","language","all of the above"],"answer":[3],"explanation":"L51 slide: 'Smooth and adaptive social interactions depend on the recruitment of virtually all core cognitive functions (e.g., perception, attention, language, memory, executive functions)'.","verified":"lecture","c":230},{"q":"Which of the following abilities does not come under social cognition?","options":["rote memory","face processing","joint attention","moral reasoning"],"answer":[0],"explanation":"L51 slide: social cognition includes face processing, joint attention, theory of mind, moral reasoning, social decision-making; rote memory is not listed.","verified":"lecture","c":231},{"q":"Social cognition develops primarily in old age.","options":["True","False"],"answer":[1],"explanation":"L51: 'social cognition develops in childhood and adolescence' - not primarily in old age.","verified":"lecture","c":232},{"q":"A theory of mind refers to a person’s ability to understand and think about the ____ of other people.","options":["biological states","mental states","physical traits","none of the above"],"answer":[1],"explanation":"L52: 'theory of mind refers to the person's ability to understand and think about the mental state of others'.","verified":"lecture","c":233,"rel":[["Jul-Oct 2026",11,0]]},{"q":"The ____ theory details the processes of observational learning and modeling, and the influence of self-efficacy on the production of behavior.","options":["behavioral","socio-emotional","social-cognitive","cognitive-emotional"],"answer":[2],"explanation":"L52: social cognitive theory deals with 'observational learning, modeling and the influence of self-efficacy'.","verified":"lecture","c":234},{"q":"____ processes account for the information that is selected for observation in the environment.","options":["motivational","production","retention","attentional"],"answer":[3],"explanation":"L53: 'attentional processes ... account for the information that is selected for observation'.","verified":"lecture","c":235},{"q":"Children become more aggressive when they observe aggressive or violent models.","options":["True","False"],"answer":[0],"explanation":"L53: 'children become more aggressive when they observe the aggressive or violent models'.","verified":"lecture","c":236},{"q":"The ____ model of observational learning involves real or fictional characters displaying behaviors in books, films, television programs, or online media.","options":["symbolic","live","verbal instructional","contextual"],"answer":[0],"explanation":"L53: symbolic model - characters from fiction, books, films, television or online media.","verified":"lecture","c":237},{"q":"____ refers to the anticipated consequences of a person’s behavior.","options":["self-efficacy","expectations","intrinsic reinforcement","extrinsic reinforcement"],"answer":[1],"explanation":"L54: 'expectation is the anticipated consequence of the person's behavior'.","verified":"lecture","c":238}]},{"year":2025,"session":"Jul-Oct 2025","week":12,"source":"https://myquizprep.pages.dev/quiz/psychology-of-learning-nov25/week12","questions":[{"q":"Sustainability in the context of environmental sustainability is ____.","options":["multidimensional","bidimensional","unidimensional","none of the given"],"answer":[2],"explanation":"L56 slide (Eggert 2009): 'Sustainability as used in environmental sustainability, economic sustainability and social sustainability is a one dimensional concept'.","verified":"lecture","c":239},{"q":"As discussed by the Brundtland commission, sustainable development was the solution to the problems of ____.","options":["poor health","recession","poverty","environmental degradation"],"answer":[3],"explanation":"L56: 'sustainable development was the solution to the problems of environmental degradation discussed by the Brundtland commission'.","verified":"lecture","c":240},{"q":"Environmental sustainability focuses on the impacts of processes, products and services on ____.","options":["biodiversity","ocean environment","air","all of the above"],"answer":[3],"explanation":"L56: impacts of processes, products and services on air, water, land, biodiversity, human health, ocean environment.","verified":"lecture","c":241,"rel":[["Jul-Oct 2026",12,0]]},{"q":"Social entrepreneurship is defined as solving social problems using ____.","options":["generational wealth","market-based methods","bank loans","magical methods"],"answer":[1],"explanation":"L56 slide: 'Social entrepreneurship, defined as solving social problems using market-based methods'.","verified":"lecture","c":242},{"q":"HESI stands for.","options":["Health and Education Sustainability Initiative","Higher Education Systematic Initiative","Higher Education Sustainability Initiative","none of the above"],"answer":[2],"explanation":"L57: 'higher education sustainability initiative' (HESI).","verified":"lecture","c":243},{"q":"Universal primary and secondary education is an outcome target of ____.","options":["SDG 1","SDG 2","SDG 3","SDG 4"],"answer":[3],"explanation":"L57: SDG 4 target 4.1 - universal primary and secondary education.","verified":"lecture","c":244},{"q":"____ is a target group for ESD for 2030 framework.","options":["policymakers","parents","institutional leaders","all of the above"],"answer":[3],"explanation":"L57: ESD for 2030 target groups - policy makers, institutional leaders, teachers, learners, parents, educators, youth, community.","verified":"lecture","c":245},{"q":"Successful implementation of ESD requires a shift in focus to ____.","options":["learning","teaching","exploiting","reading"],"answer":[0],"explanation":"L58 slide: 'Successful implementation of ESD requires a shift in focus from teaching to learning'.","verified":"lecture","c":246,"rel":[["Jul-Oct 2026",12,1],["Jul-Oct 2024",12,0]]},{"q":"____ competency refers to the ability to reflect on one's own role in community and society.","options":["self-awareness","emotional","normative","anticipatory"],"answer":[0],"explanation":"L58/L59: 'self-awareness competencies - our ability to reflect on our own role in the local community as well as the global society'.","verified":"lecture","c":247,"rel":[["Jul-Oct 2026",12,0]]},{"q":"In 2021, the European Centre for the Development of Vocational Training published a skills forecast scenario on the likely employment and skills implications of the ____.","options":["European Greenhouse Initiative","European Green Deal","European Green Agreement","none of the above"],"answer":[1],"explanation":"L60 slide: 'In 2021, the European Centre for the Development of Vocational Training published a skills forecast scenario on the likely employment and skills implications of the European Green Deal'.","verified":"lecture","c":248}]},{"year":2024,"session":"Jul-Oct 2024","week":0,"source":"https://myquizprep.pages.dev/quiz/psychology-of-learning-jul24/week0","questions":[{"q":"What is Psychology?","options":["A Science subject","Is objective perception","An art of living","A thought process","A study of cognitive processes & behavior"],"answer":[4],"explanation":"Week 0 is a general pre-course quiz with no lectures; answer is standard introductory psychology. Psychology = scientific study of mind (cognitive processes) and behavior.","verified":"reasoning","c":249,"rel":[["Jul-Oct 2025",0,1]]},{"q":"A broad field of study that explores a variety of questions about thoughts, feelings and actions is -------?","options":["Society","Globalization","Psychology","Social Science","Human Development"],"answer":[2],"explanation":"Week 0 is a general pre-course quiz with no lectures; answer is standard introductory psychology.","verified":"reasoning","c":250,"rel":[["Jul-Oct 2025",0,1]]},{"q":"A systematic assessment that provides information on political views, consumer buying habits and many other topics is called--------------?","options":["Standardized test.","Projects","Experiments","Survey","Psychological tests"],"answer":[3],"explanation":"Week 0 is a general pre-course quiz with no lectures; answer is standard introductory psychology. Surveys gather data on political views, buying habits etc.","verified":"reasoning","c":251,"rel":[["Jul-Oct 2025",0,1]]},{"q":"The word Psyche means -------------?","options":["Body or physique","Mind or soul","Science & spirituality","Mental health","Neuropsychology"],"answer":[1],"explanation":"Week 0 is a general pre-course quiz with no lectures; answer is standard introductory psychology. Greek psyche = mind/soul.","verified":"reasoning","c":252,"rel":[["Jul-Oct 2025",0,1]]},{"q":"Who established psychology laboratory in Germany?","options":["B.F. Skinner","J. Thorndike","Sigmund Freud","David Kolb","Wilhelm Wundt"],"answer":[4],"explanation":"Week 0 is a general pre-course quiz with no lectures; answer is standard introductory psychology. Wundt founded the first lab at Leipzig (1879).","verified":"reasoning","c":253,"rel":[["Jul-Oct 2025",0,1]]},{"q":"To help people to function effectively and fulfill their own unique potential\" is the aim of------","options":["Humanistic psychology","Social Psychiatry","Philosophy","Development studies","Sustainable development"],"answer":[0],"explanation":"Week 0 is a general pre-course quiz with no lectures; answer is standard introductory psychology. Humanistic psychology aims at self-actualization.","verified":"reasoning","c":254,"rel":[["Jul-Oct 2025",0,1]]},{"q":"Behaviorists use a learning process to change abnormal behavior is called----?","options":["Rationalism","Experiential intervention","Gestalt mechanism","Hypotheses verification","Conditioning"],"answer":[4],"explanation":"Week 0 is a general pre-course quiz with no lectures; answer is standard introductory psychology. Behaviour therapy uses conditioning.","verified":"reasoning","c":255,"rel":[["Jul-Oct 2025",0,1]]},{"q":"The study of changes in behavior during life time is called","options":["Behaviorism","Individual difference","Developmental Psychology","Maturational theory","Genetics or Heredity"],"answer":[2],"explanation":"Week 0 is a general pre-course quiz with no lectures; answer is standard introductory psychology.","verified":"reasoning","c":256,"rel":[["Jul-Oct 2025",0,1]]},{"q":"The study of differences and similarities in the behavior of animals of different species is called","options":["Sociology","Social work","Rehabilitation studies","Comparative Psychology","Cultural Psychology"],"answer":[3],"explanation":"Week 0 is a general pre-course quiz with no lectures; answer is standard introductory psychology.","verified":"reasoning","c":257,"rel":[["Jul-Oct 2025",0,1]]}]},{"year":2024,"session":"Jul-Oct 2024","week":1,"source":"https://myquizprep.pages.dev/quiz/psychology-of-learning-jul24/week1","questions":[{"q":"Which of the following is true regarding learning in psychology?","options":["The psychology of learning focuses on how people learn and how they interact with the environments in which they have not learnt","Learning does not involve any changes in the organism","Learning is a relatively temporary change in behavior","none of the given"],"answer":[3],"explanation":"Lecture: learning is a relatively permanent change; options a-c are all false, so \"none of the given\". (Lecture 1: Psychology of Learning)","verified":"lecture","c":258,"rel":[["Jul-Oct 2025",1,0]]},{"q":"In order to say that learning has occurred, a/an ___ must occur during the lifetime of the organism.","options":["hidden change in behavior","small change in personality","visible change in emotions","observable change in behavior"],"answer":[3],"explanation":"\"it is an observable change in the behavior that is attributed to an element in the environment\" (Lecture 1: Psychology of Learning)","verified":"lecture","c":259},{"q":"Learning changes the ___ through the process of continuous interactions between the learner and the external environment.","options":["physical structure of the brain","chemical structure of neurons","physical structure of the heart","chemical structure of the spinal cord"],"answer":[0],"explanation":"\"learning changes the physical structure of the brain through the process of continuous interaction between the learner and the external environment\" (Lecture 1: Psychology of Learning)","verified":"lecture","c":260},{"q":"Watson, one of the first psychologists to study learning and behavior is known for the","options":["Little Albert experiment","Little John experiment","Little Robert experiment","Little Johnny experiment"],"answer":[0],"explanation":"\"Watson ... conducted a small experiment with little Albert ... exposed to a white rat\". (Lecture 2: Psychology of Learning (Contd.))","verified":"lecture","c":261},{"q":"Which of the following is not explored and described by the psychology of learning?","options":["principles of motivation","principles of forgetting","principles of genetic disorders","principles of memory","principles of retention"],"answer":[2],"explanation":"Scope listed: motivation, transfer, memory retention, cognition, emotion; genetic disorders are not part of it. (Lecture 2: Psychology of Learning (Contd.))","verified":"lecture","c":262},{"q":"The state of ___ may be valuable at the start of a learning experience.","options":["conscious incompetence","unconscious incompetence","conscious over-competence","unconscious over-competence"],"answer":[0],"explanation":"\"the state of conscious incompetent may be valuable at the start of learning\" (Lecture 2: Psychology of Learning (Contd.))","verified":"lecture","c":263},{"q":"___ is the decrease in the response that an organism gives to a stimulus to which it is exposed in numerous trials or occasions.","options":["Habituation","Sensitization","Forgetting","Meaningful learning"],"answer":[0],"explanation":"Habituation = decreasing response with repeated exposure (wall-clock example); matches lecture and standard definition. (Lecture 5)","verified":"lecture","c":264},{"q":"Cooperative learning is shaped by three crucial elements. Which of the following is one of them?","options":["formation of heterogeneous groups","positive interdependence","individual responsibility","all of the given"],"answer":[3],"explanation":"\"Cooperative learning is primarily shaped by three crucial elements\": heterogeneous groups, (positive interdependence), individual responsibility, so all of the given. (Lecture 5)","verified":"lecture","c":265},{"q":"Which of the following psychologists is an important contributor to the concept of observational learning?","options":["Watson","Dewey","Bruner","Bandura"],"answer":[3],"explanation":"Observational learning is Bandura's social learning theory (lecture 7 covers attention-retention-production-motivation).","verified":"reasoning","c":266},{"q":"Which of the following is not considered a pioneer of the behaviorism school of thought in psychology?","options":["Watson","Skinner","Freud","Pavlov"],"answer":[2],"explanation":"\"JB Watson, BF Skinner, Ivan Pavlov ... these are the pioneers of behaviorism\"; Freud was a psychoanalyst. (Lecture 6: Major Theories of Learning)","verified":"lecture","c":267}]},{"year":2024,"session":"Jul-Oct 2024","week":2,"source":"https://myquizprep.pages.dev/quiz/psychology-of-learning-jul24/week2","questions":[{"q":"___ is known as the father of modern psychology.","options":["Sigmund Freud","Wilhelm Wundt","John Watson","Lev Vygotsky"],"answer":[1],"explanation":"Standard: Wundt is called the father of modern (experimental) psychology.","verified":"reasoning","c":268},{"q":"Cognitivists objected to behaviorists because they felt that behaviorists ignored the important role of ___.","options":["genetics","emotions","thinking","stimulus reaction"],"answer":[2],"explanation":"Cognitivists rejected behaviourism for explaining behaviour only as S-R links and ignoring internal mental processes (thinking). (Lecture 7)","verified":"lecture","c":269},{"q":"___ is viewed as the mainstream for all research on learning designs.","options":["Psychoanalysis","Positive psychology","Cognitivism","Evolutionary psychology"],"answer":[2],"explanation":"Cognitivism is presented as the dominant approach for learning research and instructional design; other options do not fit. (Lecture 7)","verified":"lecture","c":270},{"q":"___ is a perspective in psychology focusing on the belief that human consciousness cannot be broken down into its elements and is based on the concept of a 'whole'.","options":["Cognitivism","Behaviorism","Gestalt psychology","Positive psychology"],"answer":[2],"explanation":"Gestalt: \"whole is more meaningful than the sum of its parts\". (Lecture 7)","verified":"lecture","c":271},{"q":"Theory of multiple intelligences is given by","options":["Howard Gardner","Edward Tolman","German Gestalt","Robert J. Sternberg"],"answer":[0],"explanation":"Gardner's multiple intelligences (intrapersonal, interpersonal, logical-mathematical, musical ...). (Lecture 8)","verified":"lecture","c":272},{"q":"The general intelligence factor, also known as g, is what intelligence tests typically measure and refers only to ___ intelligence.","options":["academic","practical","linguistic","kinesthetic"],"answer":[0],"explanation":"Sternberg: g (general/academic intelligence) covers only academic/analytical ability. (Lecture 8)","verified":"lecture","c":273},{"q":"Cognitive evaluation for planning, attention, simultaneous, and successive processing of individuals can be done through CAS based on PASS theory. CAS here stands for ___.","options":["Cognitive Achievement System","Cognitive Ability System","Cognitive Appraisal System","Cognitive Assessment System"],"answer":[3],"explanation":"\"they have developed the scale cognitive assessment system\" based on PASS. (Lecture 9)","verified":"lecture","c":274},{"q":"BBL is a new science that shapes the learning process and is an approach that is based on the structure and function of the human brain. BBL stands for ___.","options":["Biological based learning","Brain based learning","Biological battery learning","Brain biology learning"],"answer":[1],"explanation":"\"brain based learning ... the concept of learning in a neurophysiological context\". (Lecture 9)","verified":"lecture","c":275},{"q":"Gagne's Conditions of Learning is also known as ___ Events of Instruction.","options":["nine","five","ten","seven"],"answer":[0],"explanation":"Gagne \"nine events ... provides a framework for designing and delivering the instruction\". (Lecture 10)","verified":"lecture","c":276},{"q":"Which of the following is not a type of constructivism?","options":["biological","cognitive","social","radical"],"answer":[0],"explanation":"Types named: cognitive (Piaget), social (Vygotsky), radical (von Glasersfeld); no biological constructivism. (Lecture 10)","verified":"lecture","c":277}]},{"year":2024,"session":"Jul-Oct 2024","week":3,"source":"https://myquizprep.pages.dev/quiz/psychology-of-learning-jul24/week3","questions":[{"q":"Which of the following is not one of the three major processes involved in memory?","options":["encoding","retrieval","storage","imagination"],"answer":[3],"explanation":"Three basic processes: encoding, storage, retrieval. (Lecture 11: Memory & Cognition)","verified":"lecture","c":278},{"q":"___ refers to changing information into a usable form.","options":["Storage","Recall","Encoding","Recollection","Forgetting"],"answer":[2],"explanation":"\"information must be changed to a usable form which occurs through a process known as encoding\". (Lecture 11: Memory & Cognition)","verified":"lecture","c":279},{"q":"___ refers to a range of mental processes relating to the acquisition, storage, manipulation and retrieval of information.","options":["Cognition","Construction","Encoding","Thinking"],"answer":[0],"explanation":"\"cognition refers to the range of mental processes starting from acquisition to storage to manipulation to retrieval\". (Lecture 11: Memory & Cognition)","verified":"lecture","c":280},{"q":"Which of the following is a challenge faced by people with social cognition deficits?","options":["talking too much to people","responding to well to people","difficulty in reading facial expressions","difficulty in getting good academic scores"],"answer":[2],"explanation":"Social cognition is a domain of cognition in the lecture; deficits = difficulty reading facial expressions (standard description). (Lecture 11: Memory & Cognition)","verified":"lecture","c":281},{"q":"Which of the following is not true about the assumptions underlying the Information Processing View of Learning?","options":["Information processing is analogous to computer processing","The human information processing system is interactive","There is no limit on how much information can be processed at each stage","Information is processed in steps"],"answer":[2],"explanation":"Assumptions: processed in stages, \"there are limits on how much information can be processed at each stage\", interactive, analogous to computer. (Lecture 11: Memory & Cognition)","verified":"lecture","c":282},{"q":"___ prevents the quick disappearance from short term memory of information","options":["Rehearsal","Encoding","Retrieval","None of the given"],"answer":[0],"explanation":"\"rehearsal prevents the quick disappearance of the information from short term memory\" (Lecture 12)","verified":"lecture","c":283},{"q":"The Multicomponent Model of Working Memory is largely attributed to the work by","options":["Atkinson & Shiffrin","Baddeley","Piaget","Craik & Lockhart"],"answer":[1],"explanation":"Multicomponent working memory model (episodic buffer, phonological loop, sketchpad) = Baddeley. (Lecture 13)","verified":"lecture","c":284},{"q":"___ memory refers to the events that can be reported from a person's life.","options":["Episodic","Semantic","Procedural","None of the given"],"answer":[0],"explanation":"Episodic memory = life events that can be reported (autobiographical episodes). (Lecture 14)","verified":"lecture","c":285},{"q":"The memory capacity depends on which of the following?","options":["complexity of the synapses","spatial and temporal correlations between memories","specific way memories are retrieved","all of the given"],"answer":[3],"explanation":"Neural network model: capacity \"depends on the complexity of the synapses, the sparseness of the representation, the spatial and temporal [correlations]\" (and retrieval mode), so all. (Lecture 14)","verified":"lecture","c":286},{"q":"Which of the following is not one of the three measurable dimensions of cognitive load?","options":["mental effort","mental load","physical effort","performance"],"answer":[2],"explanation":"\"mental load, mental effort and the performances [are] the three measurable dimensions of cognitive load\". (Lecture 15)","verified":"lecture","c":287}]},{"year":2024,"session":"Jul-Oct 2024","week":4,"source":"https://myquizprep.pages.dev/quiz/psychology-of-learning-jul24/week4","questions":[{"q":"The three main types of thinking in psychology include the following except","options":["symbolic","creative","divergent","convergent"],"answer":[3],"explanation":"\"primary types of thinking ... creative thinking, divergent thinking, symbolic thinking\"; convergent is the exception. (Lecture 16: Thinking & Cognition)","verified":"lecture","c":288},{"q":"Young children engaging in imaginative play often engage in ___ thinking.","options":["creative","divergent","symbolic","convergent"],"answer":[2],"explanation":"Imaginative play (playing roles like father, caretaker) is symbolic thinking. (Lecture 16: Thinking & Cognition)","verified":"lecture","c":289},{"q":"Which of the following is a way in which we think?","options":["in verbal symbols","in mathematical symbols","in gestures and movements","all of the given"],"answer":[3],"explanation":"\"thinking also takes place in terms of mathematical symbols, in terms of gestures\", and verbal symbols. (Lecture 16: Thinking & Cognition)","verified":"lecture","c":290},{"q":"People experience the ___ experience when they find the solution to a problem suddenly that had been in their mind for hours or days, late.","options":["\"oh no\"","\"wow\"","\"aha\"","none of the given"],"answer":[2],"explanation":"Sudden solution after incubation = \"Eureka moment\"/aha experience (insight). (Lecture 19)","verified":"lecture","c":291},{"q":"___ knowledge refers to knowledge of terminology and specific details.","options":["factual","conceptual","procedural","metacognitive"],"answer":[0],"explanation":"\"factual knowledge ... relates to specific details, information, data\" (terminology and details). (Lecture 17)","verified":"lecture","c":292,"rel":[["Jul-Oct 2025",4,1]]},{"q":"Which of the following is not true about metacognition?","options":["allows people to be dependent on others for their learning","often referred to as \"thinking about thinking\"","is crucial for efficient independent learning because it fosters self-reflection","is a regulatory system that helps a person understand and control his or her own cognitive performance"],"answer":[0],"explanation":"Metacognition builds self-regulation and makes the learner independent; dependence on others is not true. (Lecture 18)","verified":"lecture","c":293},{"q":"Which of the following is not an effective way to develop reflective thinking?","options":["asking questions","self-questioning","negotiated learning","avoiding reflective discussions"],"answer":[3],"explanation":"Ways listed: self-checking questions, asking questions, \"joining reflective discussion\", negotiated learning; avoiding discussion is not one. (Lecture 19)","verified":"lecture","c":294},{"q":"Which of the following is not true about creative thinking?","options":["It is the ability to consider something in a new way","It is not a skill anybody can develop","It is the process of nurturing our imagination","It is all about developing innovative solutions to problems.","It requires a compilation of analytical, problem-solving, organizational and communication skills"],"answer":[1],"explanation":"Lecture gives strategies to enhance creative thinking (puzzles, questioning, travel), so it can be developed. (Lecture 19)","verified":"lecture","c":295},{"q":"The ___ stage of the creative thinking process refers to the \"eureka\" moment.","options":["insight","incubation","evaluation","preparation","elaboration"],"answer":[0],"explanation":"\"all of a sudden that Eureka moment ... that is the Insight\". (Lecture 19)","verified":"lecture","c":296,"rel":[["Jul-Oct 2026",4,0],["Jul-Oct 2023",4,0]]},{"q":"In a concept map, two nodes connected with a labeled arrow are called a","options":["preposition","nodal link","schema","proposition"],"answer":[3],"explanation":"\"the two nodes when they are connected they are called a proposition\". (Lecture 20)","verified":"lecture","c":297}]},{"year":2024,"session":"Jul-Oct 2024","week":5,"source":"https://myquizprep.pages.dev/quiz/psychology-of-learning-jul24/week5","questions":[{"q":"Which of the following is not a causal factor for extrinsic motivation?","options":["rewards","social pressure","curiosity","financial gain","punishment"],"answer":[2],"explanation":"L21: extrinsic causal factors 'lie in the external environment like reward, social pressure, punishment, financial gain'; curiosity is intrinsic.","verified":"lecture","c":298},{"q":"___ refers to realizing the value of developing a skill/behavior.","options":["Amotivation","Identified regulation","Introjected regulation","Motivational learning"],"answer":[1],"explanation":"L21: 'identified regulation is that he is now realizing the whole value of developing that particular skill'.","verified":"lecture","c":299},{"q":"Drive theory is a psychological concept that attempts to explain why and how people behave in the ways they do. It is given by","options":["Murray","Hull","Atkinson","Zajonc"],"answer":[1],"explanation":"L22 slide: drive theory 'was created by behaviorist Clark Hull in 1943'.","verified":"lecture","c":300},{"q":"___ theory that suggests that people are motivated to take action in order to receive a reward and is based on the idea of operant conditioning.","options":["Incentive","Arousal","Goal setting","None of the given"],"answer":[0],"explanation":"L22 slide: 'Incentive theory... suggests that people are motivated to take action in order to receive a reward... based on operant conditioning'.","verified":"lecture","c":301,"rel":[["Jul-Oct 2025",5,0]]},{"q":"The Yerkes Dodson law gives ___ relationship between arousal and performance.","options":["inverted U shaped","linear","no","parabolic"],"answer":[0],"explanation":"L22: Yerkes-Dodson curve - performance rises with arousal to an optimum then is impaired by excess arousal (inverted U).","verified":"lecture","c":302},{"q":"The expectancy theory is based on the assumption that ___.","options":["our behavior is based on making a conscious choice from a set of possible alternative behaviors","individuals are motivated to seek out stimulation when they have low levels of arousal, but will become bored and unmotivated when they become too highly aroused","biological needs produce unpleasant states of arousal which people seek to reduce","none of the given"],"answer":[0],"explanation":"L22 slide: expectancy theory 'is based on the assumption that our behavior is based on making a conscious choice from a set of possible alternative behaviors'.","verified":"lecture","c":303},{"q":"Valence, or the perceived value of reward, would have ___ value if one wants to avoid that reward.","options":["one","zero","positive","negative"],"answer":[3],"explanation":"L23: valence is the perceived value of the reward; 'it could be negative, it could be zero...' - negative when one wants to avoid it (Vroom).","verified":"lecture","c":304},{"q":"Which of the following is not true about Maslow's need hierarchy?","options":["Needs lower down in the hierarchy must be satisfied before individuals can attend to higher needs","Safety needs lie at the bottom of the pyramid","Deficiency needs are concerned with basic survival a","Growth needs are more psychological needs","Motivation is seen as being not just concerned with tension reduction and survival but also with human growth and development"],"answer":[1],"explanation":"L24: base of the pyramid is physiological needs (food, water, warmth), safety is second, so 'safety needs at the bottom' is false.","verified":"lecture","c":305},{"q":"Self-Determination Theory differentiates between ___ and ___ motivation types.","options":["autonomous and controlled","autonomous and intrinsic","controlled and extrinsic","introjected and extrinsic","introjected and intrinsic"],"answer":[0],"explanation":"L24: 'self determination theory differentiates between the autonomous motivation and control(led) motivation'.","verified":"lecture","c":306},{"q":"In achievement motivation, the motive to avoid failure often consists of","options":["worries about the consequences of failing","self-criticism","accelerated heart rate","all of the given"],"answer":[3],"explanation":"L25 slide: 'motive to avoid failure includes worries about the consequences of failing, self-criticism, ... accelerated heart rate'.","verified":"lecture","c":307}]},{"year":2024,"session":"Jul-Oct 2024","week":6,"source":"https://www.youtube.com/watch?v=d71eYeW1sN8","questions":[{"q":"Daniel Goleman's work in emotional intelligence (EI) has outlined ___ main areas of this intelligence.","options":["three","four","five","six"],"answer":[2],"explanation":"L26 slide: 'Daniel Goleman's work in emotional intelligence has outlined five main areas'.","verified":"lecture","c":308},{"q":"Which of the following statements is not true?","options":["Experts even suggested that emotional intelligence/ EQ, is more important than IQ/academic intelligence","An individual with high EI is not only aware of what emotions they are feeling but can put words to their feelings","Studies show that EI does not impact aspects of one's life like academic performance","Peter Salovey and John Mayer were the first to develop a psychological theory of emotional intelligence."],"answer":[2],"explanation":"L26: 'emotional intelligence can... positively impact their academic performance', so the 'does not impact' statement is false.","verified":"lecture","c":309},{"q":"___ refers to how tuned to the emotions of others a person is.","options":["Empathy","Motivation","Emotional literacy","Self regulation"],"answer":[0],"explanation":"L26: empathy is 'how tuned to the emotion of others a person is'.","verified":"lecture","c":310},{"q":"The following are advantages of developing emotional intelligence, except------","options":["Being able to accept criticism and responsibility","Knowing why we do the things we do","Being able to say no when we need to","Being able to hide our feelings from others"],"answer":[3],"explanation":"L27 slide 'Advantages of Developing EI' lists accepting criticism, saying no, knowing why we do things, sharing (not hiding) feelings.","verified":"lecture","c":311},{"q":"The Pyramid of Emotional Intelligence is also known as the ___ layer model.","options":["nine","five","seven","eleven"],"answer":[0],"explanation":"L27: 'it is nine layer pyramid through which we can understand how emotional intelligence develops'.","verified":"lecture","c":312},{"q":"EI can be developed at any stage of life through self-effort & training.","options":["True","False"],"answer":[0],"explanation":"L28 slide: 'EI can be developed at any stage of life through self-effort & training'.","verified":"lecture","c":313},{"q":"When someone engages in ___, they can regulate their emotions to ensure that others feel more comfortable.","options":["emotional exhaustion","emotional literacy","empathy","emotional labor"],"answer":[3],"explanation":"L29: emotional labor = managing/displaying emotions as the job demands to make others (passengers, customers) feel good.","verified":"lecture","c":314},{"q":"The management of emotions is ___","options":["a private act","influenced by cultural and social norms","done by actively shaping and directing feelings","all of the given"],"answer":[3],"explanation":"L29: management of emotion 'is essentially a private act' yet culture-specific, shaped by social norms of what is appropriate to feel; all apply.","verified":"lecture","c":315},{"q":"___ is seen when workers change their outward emotional expressions but do not attempt to feel the emotions that they are displaying.","options":["deep acting","emotional contagion","surface acting","emotional literacy"],"answer":[2],"explanation":"L29: surface acting 'is when the workers change their outward emotional expression but do not attempt to feel the emotion that they are displaying'.","verified":"lecture","c":316},{"q":"The concept of emotional contagion can be linked to biological basis of ___","options":["emotional neurons","mirror neurons","contagious neurons","None of the given"],"answer":[1],"explanation":"L29: emotional contagion explained by mirror neurons in the cortex.","verified":"lecture","c":317}]},{"year":2024,"session":"Jul-Oct 2024","week":7,"source":"https://www.youtube.com/watch?v=N-PrUQKDQeI","questions":[{"q":"___ defined learning as 'a change in human disposition or capacity that persists over a period of time and is not simply ascribable to processes of growth.'","options":["Bloom","Dewey","Gagne","Kolb"],"answer":[2],"explanation":"L31: 'Robert Gagne defined learning as a change in human disposition or capacity that persists over a period of time and is not simply ascribable to processes of growth'.","verified":"lecture","c":318},{"q":"The principles of contiguity (how close in time two events must be for a bond to be formed) and reinforcement (any means of increasing the likelihood that an event will be repeated) are central to explaining the learning process in the ___ orientation to learning.","options":["Cognitive","Humanistic","Social and social-constructivist","Behaviorist"],"answer":[3],"explanation":"L31: in behaviorist orientation 'this principle of contiguity and reinforcement these are the primary factors that explain the learning process'.","verified":"lecture","c":319},{"q":"Which of the following is not true about humanistic orientations to learning?","options":["It has a quality of personal involvement","It is self-initiated","It is pervasive","The locus of evaluation resides definitely outside the learner"],"answer":[3],"explanation":"L31: humanistic learning - personal involvement, self-initiated, pervasive; 'locus of evaluation... resides within the learner'.","verified":"lecture","c":320},{"q":"The concept of situated learning is studied under which school of thought of learning theories?","options":["behaviorist","cognitive","humanistic","social"],"answer":[3],"explanation":"L32: situated learning discussed under the social & situational orientation (co-participation, communities of practice).","verified":"lecture","c":321},{"q":"Which of the following is not one of the individual variable factors affecting learning?","options":["ergonomics","interest","endurance","ego","perception"],"answer":[0],"explanation":"L32: individual variables = interest, perception, past experience, learning capabilities, endurance, ego; ergonomics is an environmental variable.","verified":"lecture","c":322},{"q":"___ learners prefer maps, graphs, diagrams and charts to learn.","options":["Visual","Solitary","Kinesthetic","Auditory"],"answer":[0],"explanation":"L32: visual learners learn through 'maps, graphs, diagrams, charts, visual aids'.","verified":"lecture","c":323},{"q":"___ learners search for connections, causes, patterns, and results in their learning.","options":["linguistic","kinesthetic","visual","logical"],"answer":[3],"explanation":"L32: logical/analytical learners look for 'the connection between the concepts, causes, factors, the patterns'.","verified":"lecture","c":324},{"q":"Effective instruction is ___","options":["interactive, generative and dynamic","designed to accommodate student learning needs and styles","guided by general pedagogical approaches","eclectic","all of the given"],"answer":[4],"explanation":"L33: effective instruction is interactive, eclectic, generative and dynamic, accommodates learner needs, uses pedagogical approaches - all of the given.","verified":"lecture","c":325,"rel":[["Jul-Oct 2023",7,0]]},{"q":"___ role of the trainer consists of transmitting information about a subject to the audience.","options":["expert","instructor","facilitator","co-learner"],"answer":[0],"explanation":"L33: 'the role of the trainer... he's an expert... because he transmits the information about the subject to the audience'.","verified":"lecture","c":326},{"q":"Which of the following is not a component of the ADDIE model?","options":["analysis","integration","development","evaluation"],"answer":[1],"explanation":"L33: ADDIE = analysis, design, development, implementation, evaluation; integration not a component.","verified":"lecture","c":327}]},{"year":2024,"session":"Jul-Oct 2024","week":8,"source":"https://myquizprep.pages.dev/quiz/psychology-of-learning-jul24/week8","questions":[{"q":"The word 'pedagogy' has been derived from the Greek word \"pedagogue\" which stands for","options":["the science of learning","the art of observing","the art of teaching children","none of the given"],"answer":[2],"explanation":"L36: 'it has come from the Greek word... pedagogue means the art of teaching the children'.","verified":"lecture","c":328},{"q":"Which of the following statements is not true about pedagogy?","options":["It assists both students and teachers in gaining an in-depth understanding of fundamental material.","It is about suppressing responses from learners","It enhances the student-teacher relationship","It enables teachers to influence student learning with an intention to capture the attention of students"],"answer":[1],"explanation":"L36: good pedagogy aims 'to elicit the responses that demonstrate understanding', not to suppress them.","verified":"lecture","c":329,"rel":[["Jul-Oct 2026",8,0]]},{"q":"Which of the following is not a pedagogical approach in teaching?","options":["reflective","collective","collaborative","integrative"],"answer":[1],"explanation":"L36 slide: five approaches - constructivist, collaborative, inquiry-based, integrative, reflective; 'collective' is not one.","verified":"lecture","c":330,"rel":[["Jul-Oct 2025",8,0],["Jul-Oct 2023",8,0]]},{"q":"___ is a form of active learning that starts by posing questions, problems or scenarios rather than simply presenting established facts or portraying a smooth path to knowledge.","options":["constructivist learning","passive learning","inquiry-based learning","metalearning"],"answer":[2],"explanation":"L36: inquiry-based approach 'is a form of active learning... posing questions, problems'.","verified":"lecture","c":331},{"q":"Which of the following is a primary role of the instructor in experiential learning?","options":["posing problems","providing solutions","blurring boundaries","none of the given"],"answer":[0],"explanation":"L37 slide: 'instructor's primary roles include setting suitable experiences, posing problems, setting boundaries, supporting students...'.","verified":"lecture","c":332},{"q":"The \"what is important?\" stage of the experiential learning process refers to the ___ stage","options":["processing","generalizing","application","reflecting"],"answer":[0],"explanation":"L37 slide: 'Processing/Analyzing \"What's Important?\"'.","verified":"lecture","c":333},{"q":"The ___ learning style as given by Kolb suggests that these individuals prefer to look at things from multiple perspectives and prefer to watch rather than do.","options":["Assimilating","Accommodating","Converging","Diverging"],"answer":[3],"explanation":"L37: diverging style - 'look at things from multiple perspectives... prefer to watch rather than do'.","verified":"lecture","c":334},{"q":"The following factors influence preferred learning style except","options":["career choice","personality","educational specialization","genes"],"answer":[3],"explanation":"L37: factors influencing learning style - adaptive competencies, career choice, current job role, educational specialization, personality type; not genes.","verified":"lecture","c":335},{"q":"Integrative learning often involves three steps. Which of the following is not one of them?","options":["collaboration","integrative enquiry","application and transfer","reflection"],"answer":[0],"explanation":"L37: integrative learning 'involves these three steps... integrative inquiry, application and transfer, and then reflection'.","verified":"lecture","c":336},{"q":"In transformative learning, ___ includes a student's habit of the mind, as well as a personal point of view.","options":["intentional content","frame of reference","frame of context","none of the given"],"answer":[1],"explanation":"L39: 'a frame of reference includes... a student's habit of mind as well as the personal point of view'.","verified":"lecture","c":337}]},{"year":2024,"session":"Jul-Oct 2024","week":9,"source":"https://myquizprep.pages.dev/quiz/psychology-of-learning-jul24/week9","questions":[{"q":"E-learning implies ___ learning.","options":["mentor assisted","teacher enhanced","computer enhanced","electricity enhanced"],"answer":[2],"explanation":"L41: 'e-learning is the very comprehensive term which implies the computer enhanced learning, technology enhanced learning'.","verified":"lecture","c":338},{"q":"___ type of e-learning is highly interactive, which includes graphics, video, audio and games too.","options":["text driven","simulation","interactive","none of the given"],"answer":[1],"explanation":"L41 slide: 'Simulation: It is a highly interactive kind of e-learning, which includes graphics, video, audio and games too.'","verified":"lecture","c":339},{"q":"Which of the following is not true about e-learning?","options":["one can have access to the content any number of times","it helps in developing new policies","it saves time for the students, they don't need to travel to the institution","it is targeted to cater to the needs of students specifically"],"answer":[3],"explanation":"L41 slide benefits: accommodates everyone's needs (working person, housewife or student), lectures can be taken multiple times/'access the content any number of times', scalability 'facilitates in developing and communicating new training policies' - so d (targeted specifically at students) is not true.","verified":"lecture","c":340},{"q":"As learning depends on the learner's prior experience, and no two learners will have the same experiences, new information will be dealt with in different ways by different learners. This statement means that learning is","options":["goal-oriented","dependent on self-awareness","social","idiosyncratic"],"answer":[3],"explanation":"L42: 'learning is very peculiar, very idiosyncratic ... as the learning depends on learners prior experience'.","verified":"lecture","c":341},{"q":"Which of the following is a way of facilitating the social dimension to learning?","options":["e-mails","online discussions","virtual communities","all of the given"],"answer":[3],"explanation":"L41/L42: social dimension via discussion forums, emails/instant messages, blogs, virtual communities of practice - all of these.","verified":"lecture","c":342},{"q":"We can say that when we're good at something after practice, it's usually because","options":["our brain has become automated","our brain has released better chemicals","our brain has made stronger connections with this information","our brain has prioritized this information over others"],"answer":[2],"explanation":"L42 slide: 'when we're good at something, it's usually because our brain has made stronger connections with this information'.","verified":"lecture","c":343},{"q":"Learners may multitask when engaging in an online course, which could be resulting in","options":["hyperfocus","better retrieval","shorter attention spans","None of the given"],"answer":[2],"explanation":"L43: continuous multitasking 'makes our attention span very short'.","verified":"lecture","c":344,"rel":[["Jul-Oct 2026",9,1],["Jul-Oct 2025",9,1]]},{"q":"The cognitive load theory suggests that when we overload our ___ we are unable to acquire and process new information.","options":["sensory memory","encoding","retrieval","working memory"],"answer":[3],"explanation":"L43: working memory has limited capacity; continuous e-learning overloads it creating cognitive load.","verified":"lecture","c":345},{"q":"There are five critical aspects of psychology which are needed to guarantee the implementation of successful eLearning. Which of the following is not one of them?","options":["evolution","self-discipline","stress","emotion"],"answer":[0],"explanation":"L43: five critical aspects - motivation, emotion, self-discipline, social skills, stress; evolution is not one.","verified":"lecture","c":346},{"q":"___ is a learning tool, because the explicit navigation of the topic and association types might enable meaningful learning and it helps to reduce the cognitive loads caused by E-learning content and constant attention.","options":["topic map","schema","prototype","instructional map"],"answer":[0],"explanation":"L43: 'topic map ... is a tool and explicit navigation ... enables the meaningful learning ... reduces cognitive load'.","verified":"lecture","c":347}]},{"year":2024,"session":"Jul-Oct 2024","week":10,"source":"https://myquizprep.pages.dev/quiz/psychology-of-learning-jul24/week10","questions":[{"q":"The Readiness Model for New Normal in Education designed by many educational institutions caters to the following components except","options":["parent readiness","learner readiness","society readiness","teacher readiness"],"answer":[2],"explanation":"L46 slides: Readiness Model for New Normal - Parents' Readiness, Teachers' Readiness, Learners' Readiness; no society readiness.","verified":"lecture","c":348},{"q":"In 2018, Global Education and Skills Forum noted that the 'future' teacher would need some skills to thrive in the 21st century. Which of the following is not one of them?","options":["Being a facilitator","Internal focus","Strong social skills","Data analysis"],"answer":[1],"explanation":"L46 slide (GESF 2018) skills: strong subject knowledge, being a facilitator, strong social skills, external focus, data analysis; 'internal focus' is not one.","verified":"lecture","c":349,"rel":[["Jul-Oct 2026",10,1]]},{"q":"Which of the following impacts student learning?","options":["Their perception about their intelligence and ability","Prior knowledge","Their context","All of the given"],"answer":[3],"explanation":"L46 principles: self-perception of intelligence/ability, prior knowledge, and context all affect learning.","verified":"lecture","c":350},{"q":"Which of the following statements is not true?","options":["Techniques linked to self-control contribute to more effective learning if taught and applied correctly","Student creativity can be encouraged.","Clear, explanatory and timely feedback to students is important for learning","Students tend to enjoy learning and have better outcomes when their motivation is more extrinsic than intrinsic"],"answer":[3],"explanation":"L47 principle 9: students enjoy learning and do better 'when their motivation is more intrinsic than extrinsic' - option d reverses it.","verified":"lecture","c":351},{"q":"Both formative and summative assessment are important and useful, provided they are applied and interpreted appropriately.","options":["True","False"],"answer":[0],"explanation":"L47/L49: formative and summative assessment are both important and useful, complementary.","verified":"lecture","c":352},{"q":"Individual differences are the unique ways each human being differs from another. It can be handled through using different techniques. Which of the following is not one of them?","options":["observation","sociograms","rating scales","ignorance"],"answer":[3],"explanation":"L48 slide: individual differences handled through 'observation, interviews, rating scales', sociograms etc.; ignorance is not a technique.","verified":"lecture","c":353},{"q":"Clapping is an example of ___ reward.","options":["tangible","financial","social","none of the given"],"answer":[2],"explanation":"L48 slide: 'A reward may be social, such as clapping, or tangible, such as giving...'.","verified":"lecture","c":354},{"q":"___ is the process of judging the value or worth of an individual's achievements or characteristics.","options":["Goal-setting","Classroom conduct","Formation","Evaluation"],"answer":[3],"explanation":"L49: 'evaluation is the process for verifying, valuing or judging the worth of an individual's achievements and/or characteristics'.","verified":"lecture","c":355},{"q":"___ refers to the frequent, interactive assessment of student progress to identify learning needs and shape teaching.","options":["Formative assessment","Summative assessment","Collective assessment","None of the given"],"answer":[0],"explanation":"L49: formative assessment is frequent, intermittent assessment to map progress, give feedback and modify teaching.","verified":"lecture","c":356},{"q":"\"That is an intelligent response, well done\" is an example of a ___ level feedback.","options":["Task-level","Process-level","Facilitator-level","Personal-level"],"answer":[3],"explanation":"L50 slide: '3: Personal-level feedback ... directed to the self ... Example: That's an intelligent response, well done.'","verified":"lecture","c":357}]},{"year":2024,"session":"Jul-Oct 2024","week":11,"source":"https://myquizprep.pages.dev/quiz/psychology-of-learning-jul24/week11","questions":[{"q":"___ refers to a complex set of mental abilities underlying social stimulus perception, processing, interpretation, and response.","options":["social schema","emotional cognition","social cognition","emotional schema"],"answer":[2],"explanation":"L51: 'social cognition ... refers to a complex set of mental abilities underlying social stimulus perception, processing, interpretation and response'.","verified":"lecture","c":358},{"q":"Piaget's conception of ___ views information inconsistent with an individual's cognitive structures as an initiator for assimilation and accommodation processes.","options":["assimilation and accommodation schema","cognitive determinism","reciprocal dynamism","cognitive conflict"],"answer":[3],"explanation":"L54 slide: 'Piaget's conception of cognitive conflict views information' inconsistent with cognitive structures as initiator of assimilation/accommodation.","verified":"lecture","c":359},{"q":"During the earliest stages of development, children see the world from their own perspective and struggle to think about how other people may view the world. This highlights that initially, children are","options":["egocentric","idiosyncratic","egoistic","egomaniac"],"answer":[0],"explanation":"L51: 'at the young stage every child is very much egocentric'.","verified":"lecture","c":360},{"q":"Which of the following is false regarding social cognition?","options":["It develops in childhood and adolescence","When looking at a social situation, any two people may have wildly different interpretations.","It includes complex abilities like theory of mind","There are no cultural differences in social cognition"],"answer":[3],"explanation":"L51/L52: social cognition develops in childhood and adolescence, two people may interpret wildly differently, includes theory of mind, and 'there are cultural differences in social cognition'.","verified":"lecture","c":361},{"q":"Social processes influence how information is selected, organized, integrated, and retrieved. This highlights the ___ hypothesis.","options":["social cue","cognitive influence","schema influence","social mediation"],"answer":[1],"explanation":"L54: 'cognitive influence hypothesis ... social processes influence how the information is selected, organized, integrated and retrieved'.","verified":"lecture","c":362,"rel":[["Jul-Oct 2026",11,0]]},{"q":"The social cognitive theory is developed by ___.","options":["Watson","Piaget","Bandura","Freud"],"answer":[2],"explanation":"L52: 'social cognitive theory is actually a learning theory developed by Albert Bandura'.","verified":"lecture","c":363},{"q":"___ refers to the internal or external responses to a person's behavior that affect the likelihood of continuing or discontinuing the behavior.","options":["modeling","schemas","awards","reinforcements"],"answer":[3],"explanation":"L53: reinforcement 'refers to the internal and external responses ... that affects the likelihood of continuing ... or discontinuing' the behaviour.","verified":"lecture","c":364},{"q":"Observational learning occurs through the sequence of ___ number of processes. One of those is attentional processes.","options":["four","five","six","seven"],"answer":[0],"explanation":"L53: 'observational learning occur through a sequence of the four processes' - attentional, retention, production, motivational.","verified":"lecture","c":365},{"q":"The ___ model of observational learning involves an actual individual demonstrating or acting out a behavior.","options":["live","symbolic","verbal instructional","contextual"],"answer":[0],"explanation":"L53: Bandura's three models - live model (actual individual demonstrating behaviour), symbolic, verbal instructional.","verified":"lecture","c":366},{"q":"___ suggests that our behavior, personal factors, and environmental factors all influence each other.","options":["environmental dynamism","reciprocal determinism","collective determinism","reciprocal dynamism"],"answer":[1],"explanation":"L53: 'reciprocal determinism ... our behavior, personal factor, environmental factors all influence each other'.","verified":"lecture","c":367}]},{"year":2024,"session":"Jul-Oct 2024","week":12,"source":"https://myquizprep.pages.dev/quiz/psychology-of-learning-jul24/week12","questions":[{"q":"Sustainable development is","options":["unidimensional","bidimensional","multidimensional","none of the given"],"answer":[2],"explanation":"L56 slide (Eggert 2009): 'Sustainable development is multidimensional as it integrates...'.","verified":"lecture","c":368},{"q":"Revenue generation and resource use are components of","options":["environmental sustainability","social sustainability","financial sustainability","economic sustainability"],"answer":[3],"explanation":"L56: economic sustainability relates to 'revenue generation, alternative uses of resources, resource monitoring ... resource use'.","verified":"lecture","c":369},{"q":"___ as a practice is defined as solving social problems using market based methods and can create both economic and social value.","options":["social entrepreneurship","economic entrepreneurship","social marketing","social economics"],"answer":[0],"explanation":"L56 slide: 'Social entrepreneurship, defined as solving social problems using market-based methods' creating economic and social value.","verified":"lecture","c":370},{"q":"In the context of sustainability, HESI highlights the role of ___ in building a better world for current and future generations.","options":["Financial stability","Higher education","Climate change","Natural resources"],"answer":[1],"explanation":"L57: HESI 'highlights the role of higher education and higher education institutions in building a better world for current and future generations'.","verified":"lecture","c":371},{"q":"The following are the outcome targets of SDG 4, except.","options":["Relevant skills for decent work","Gender equality and inclusion","Privatization of institutes","Universal youth literacy"],"answer":[2],"explanation":"L57 SDG 4 outcome targets: universal primary/secondary, early childhood, equal access to TVET/higher ed, relevant skills for decent work, gender equality and inclusion, universal youth literacy, citizenship/ESD; no privatization.","verified":"lecture","c":372},{"q":"One of the means to implement SDG 4 is exponentially increasing the number of scholarships available to developing contexts.","options":["False","True"],"answer":[1],"explanation":"L57 slide: '4.b Scholarships - By 2030, substantially expand globally the number of scholarships available to developing countries'. 'Exponentially' is probably a paraphrase (True), but the changed word could be an intended falsification.","verified":"unsure","c":373},{"q":"Successful implementation of ESD requires a shift in focus from","options":["feeling to thinking","learning to teaching","teaching to feeling","teaching to learning"],"answer":[3],"explanation":"L58 slide: 'Successful implementation of ESD requires a shift in focus from teaching to learning and a multidisciplinary approach'.","verified":"lecture","c":374,"rel":[["Jul-Oct 2026",12,0],["Jul-Oct 2025",12,0]]},{"q":"___ refers to the ability to understand and evaluate multiple possible futures to deal with risks and changes.","options":["anticipatory competency","collaboration competency","normative competency","systems thinking competency"],"answer":[0],"explanation":"L58/L59: anticipatory competency - 'ability to understand and evaluate multiple futures ... to deal with the risk and changes'.","verified":"lecture","c":375},{"q":"Fostering competencies requires integration of three interrelated dimensions of learning as described by UNESCO. Which of the following is not one of them?","options":["biological learning","cognitive learning","behavioral learning","social and emotional learning"],"answer":[0],"explanation":"L58 slide: three interrelated dimensions of learning (UNESCO) - cognitive, social and emotional, behavioral; biological is not one.","verified":"lecture","c":376},{"q":"GAP in the context of Education for Sustainable Development stands for","options":["General Activity Priority","Global Action Programme","Global Achievement Programme","General Awareness Programme"],"answer":[1],"
