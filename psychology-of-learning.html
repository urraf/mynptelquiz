explanation":"L59 slide: 'Global Action Programme (GAP) on ESD states that...'.","verified":"lecture","c":377}]},{"year":2023,"session":"Jul-Oct 2023","week":1,"source":"https://www.youtube.com/watch?v=bjXMNsQ_XqA","questions":[{"q":"Psychologists agree that learning results from ___","options":["running","talking","experience","seeing","reacting"],"answer":[2],"explanation":"\"learning causes relatively permanent change in the behavior that results from the experience\" (Lecture 1: Psychology of Learning)","verified":"lecture","c":378},{"q":"Learning is defined as a ___ change in behavior","options":["temporary","large","small","easy","relatively permanent"],"answer":[4],"explanation":"\"learning brings a relatively permanent change in our behavior that results from experience\" (Lecture 1: Psychology of Learning)","verified":"lecture","c":379},{"q":"___ definitions of learning refer to a specific change in mental constructs (e.g., knowledge, representations, associations) of an organism.","options":["Cognitive","Psychodynamic","Experimental","Anthropological","Humanistic"],"answer":[0],"explanation":"\"the cognitive definition of learning ... refer to the specific change in the organism ... change in the mental constructs\" (Lecture 1: Psychology of Learning)","verified":"lecture","c":380},{"q":"Who among the following was one of the first psychologists to study how learning influences behavior?","options":["Carl Jung","John B. Watson","Sigmund Freud","Albert Einstein","Abraham Maslow"],"answer":[1],"explanation":"Lecture presents John B. Watson as founder of behaviourism who studied learning and behaviour (Little Albert); others listed are not learning researchers. (Lecture 2: Psychology of Learning (Contd.))","verified":"lecture","c":381},{"q":"Which of the following is not an outcome of effective learning?","options":["more connected knowledge","more sad and anxious feelings","more reflective approach","more positive emotions","more developed vision of future self as a learner"],"answer":[1],"explanation":"Effective learning outcomes listed: \"more connected knowledge\", \"wider range of strategies\", reflective approach, positive emotions; sad/anxious feelings is not one. (Lecture 3)","verified":"lecture","c":382,"rel":[["Jul-Oct 2026",1,0]]},{"q":"Learning that consists of adding to existing student knowledge is known as","options":["conceptual growth","conceptual decline","conceptual change","conceptual decay","conceptual budding"],"answer":[0],"explanation":"\"adding to the existing student knowledge known as the conceptual growth or the transforming or revising ... known as the conceptual change\" (Lecture 3)","verified":"lecture","c":383,"rel":[["Jul-Oct 2025",1,0]]},{"q":"What type of feedback to students is important for increasing learning?","options":["Clear, assertive, and delayed","Clear, explanatory, and timely","Ambiguous, explanatory, timely","Strict, assertive, delayed","Clear, harsh, timely"],"answer":[1],"explanation":"\"clear explanatory And Timely feedback to student is important for learning\" (Lecture 4)","verified":"lecture","c":384},{"q":"Getting used to of something like the ticking of a wall clock is an example of","options":["Sensitization","Conditioning","Meaningful learning","Habituation","Associative learning"],"answer":[3],"explanation":"Habituation explained with the example \"clicking of the wall clock ... as we become habituated to that then we overlook it\". (Lecture 5)","verified":"lecture","c":385},{"q":"In ___ learning, special emphasis is placed on exchanges of information as a way of enriching work and the confluence of ideas","options":["associative","observational","emotional","non-associative","cooperative"],"answer":[4],"explanation":"Cooperative learning: \"it is also exchange of information it is also enriching our work with the confluence of ideas\". (Lecture 5)","verified":"lecture","c":386},{"q":"___ is the process of gradually changing the quality of a response.","options":["Modeling","Cueing","Reinforcement","Shaping","Punishment"],"answer":[3],"explanation":"\"shaping is the process of gradually changing the quality of response\" (Lecture 6: Major Theories of Learning)","verified":"lecture","c":387,"rel":[["Jul-Oct 2026",2,1]]}]},{"year":2023,"session":"Jul-Oct 2023","week":2,"source":"https://www.youtube.com/watch?v=IPFWuNPI1l8","questions":[{"q":"___ established the first psychological laboratory at the University of Leipzig in Germany.","options":["Sigmund Freud","Albert Einstein","Wilhelm Wundt","Aristotle","Carl Jung"],"answer":[2],"explanation":"Standard fact: Wundt opened the first psychology laboratory at Leipzig in 1879 (name not found in the captions).","verified":"reasoning","c":388},{"q":"___ is a theory of learning that uses mind as an information processor, like a computer","options":["Behaviorism","Information Technology","Psychoanalysis","Cognitivism","Motivation"],"answer":[3],"explanation":"\"just like the computer mind is an information processor\" in the cognitive school (cognitivism). (Lecture 7)","verified":"lecture","c":389},{"q":"According to Gardner's theory of multiple intelligences, ___ intelligence is about self-knowledge and the ability to act adaptively on the basis of that knowledge","options":["Interpersonal","Spatial","Intrapersonal","Linguistic","Musical"],"answer":[2],"explanation":"Lecture: \"intrapersonal ... the self-knowledge ... ability to act adaptively\". (Lecture 8)","verified":"lecture","c":390},{"q":"In the PASS theory of intelligence, PASS stands for ___","options":["Practice, Attention, Selection, Sensation","Planning, Attention-Arousal, Simultaneous and Successive","Processing, Arousal, Simultaneous Selection","Problem solving, Attention, Sensation, Substitution","Perception, Attention, Selection, Sensation"],"answer":[1],"explanation":"\"PASS model ... planning, attention, simultaneous and successive processing\" (Das). (Lecture 9)","verified":"lecture","c":391},{"q":"Pre-assessment, group based initial instruction, regular formative assessments, corrective instruction, and parallel formative assessments are all components of ___","options":["Mastery learning","Structure of Intellect","Instructional learning","Positive learning","Intelligence"],"answer":[0],"explanation":"Mastery learning: pre-assessment, instruction, formative assessment, \"corrective instruction, parallel formative assessments\" and enrichment. (Lecture 10)","verified":"lecture","c":392},{"q":"Which of the following is an approach to learning which suggests that reality is determined by the experiences of the learner?","options":["Constructivism","Cognitivism","Conceptualism","Instructionism","Conceptualization"],"answer":[0],"explanation":"Constructivism: every learner constructs their own knowledge from experience. (Lecture 10)","verified":"lecture","c":393},{"q":"___ constructivism is based on the work of Lev Vygotsky.","options":["Cognitive","Behavioral","Motivational","Positive","Social"],"answer":[4],"explanation":"\"social constructivism ... Lev Vygotsky is the propagator\". (Lecture 10)","verified":"lecture","c":394},{"q":"Which of the following is not a stage of development as given by Piaget?","options":["Preoperational","Formal operational","Sensory-motor","Post operational","Concrete operational"],"answer":[3],"explanation":"Piaget's four stages: sensory-motor, pre-operational, concrete operational, formal operational. (Lecture 10)","verified":"lecture","c":395},{"q":"According to Vygotsky, ___ is the gap between what a learner can do independently and what they can do with the help of a more knowledgeable other.","options":["knowledge gap","zone of proximal development","zone of intelligence","intelligence gap","zone of knowledge"],"answer":[1],"explanation":"Vygotsky \"has defined ... the zone of proximal development\". (Lecture 10)","verified":"lecture","c":396},{"q":"___ teaching involves an interactive dialogue between a teacher and a small group of students.","options":["Reciprocal","Instructional","Reinforcing","Corrective","Restricted"],"answer":[0],"explanation":"\"reciprocal teaching ... having an interactive dialogue between the teacher and the small groups\" (Lecture 10)","verified":"lecture","c":397}]},{"year":2023,"session":"Jul-Oct 2023","week":3,"source":"https://www.youtube.com/watch?v=9qAsSFznkzs","questions":[{"q":"Researchers have long believed that memories form due to changes in the brain ___","options":["muscles","bones","blood","skull","neurons"],"answer":[4],"explanation":"Memory forms through changes in connections between nerve cells (neurons/synapses); only \"neurons\" fits. (Lecture 11: Memory & Cognition)","verified":"lecture","c":398},{"q":"___ refers to calling back the stored information in response to some cue for use in a process or activity","options":["Encoding","Storage","Registration","Retrieval","Forgetting"],"answer":[3],"explanation":"\"the next process is the retrieval, recall or recollection\" when information is needed in response to cues. (Lecture 11: Memory & Cognition)","verified":"lecture","c":399},{"q":"The duration of the sensory register is ___","options":["1-3 seconds","1-3 minutes","15-30 seconds","15-30 minutes","1 hour"],"answer":[0],"explanation":"Sensory register: \"the duration is one to three seconds\". (Lecture 12)","verified":"lecture","c":400},{"q":"Maintenance rehearsal in the context of short term memory is also known as ___","options":["elaborative rehearsal","rote rehearsal","elaborative encoding","dual coding","visual imagery encoding"],"answer":[1],"explanation":"Maintenance rehearsal = rote repetition (lecture 12 contrasts rote rehearsal with elaborative rehearsal).","verified":"reasoning","c":401},{"q":"Which of the following is not a component of the working memory model?","options":["Central executive","Visuo-spatial sketchpad","Language repository","Episodic buffer","Phonological loop"],"answer":[2],"explanation":"Baddeley model: central executive, phonological loop, visuo-spatial sketchpad, episodic buffer; no \"language repository\". (Lecture 13)","verified":"lecture","c":402},{"q":"___ describes our implicit knowledge of tasks that usually do not require conscious recall to perform them","options":["Procedural memory","Declarative memory","Semantic memory","Episodic memory","Collective memory"],"answer":[0],"explanation":"Procedural knowledge/memory = know-how of performing tasks, implicit. (Lecture 14)","verified":"lecture","c":403},{"q":"The Levels of Processing theory in memory is given by -","options":["Atkinson & Shiffrin","Craik & Lockhart","Baddley","Piaget","Freud"],"answer":[1],"explanation":"Levels of processing (shallow structural vs deep) = Craik & Lockhart. (Lecture 14)","verified":"lecture","c":404},{"q":"___ processing is when we encode only the physical qualities of something.","options":["Phonemic","Structural","Semantic","Deep","Elaborative"],"answer":[1],"explanation":"\"shallow processing is the structural encoding ... emphasizes the physical structure of the stimulus\". (Lecture 14)","verified":"lecture","c":405},{"q":"___ refers to the cognitive capacity actually allocated to the task.","options":["Mental load","Mental effort","Performance","Capacity load","Task load"],"answer":[1],"explanation":"\"mental effort actually refers to the cognitive capacity actually allocated to the task\"; mental load is imposed by the task. (Lecture 15)","verified":"lecture","c":406},{"q":"Which of the following is not a helpful way of improving memory?","options":["Writing it down","Repetition","Taking a mental picture","Over-exerting yourself","Attaching meaning to it"],"answer":[3],"explanation":"Writing down, repetition, imagery and meaning help memory; over-exertion does not.","verified":"reasoning","c":407}]},{"year":2023,"session":"Jul-Oct 2023","week":4,"source":"https://www.youtube.com/watch?v=0ZSetTI9vQE","questions":[{"q":"When there are many possible answers to a solution, we rely on ___ to help us choose the best solution, like trying to answer or solve an open-ended question","options":["luck","divergent thinking","remembering","sensory memory","symbolic thinking"],"answer":[1],"explanation":"\"diversion [divergent] thinking ... multiple solutions to a question which is probably open-ended question\". (Lecture 16: Thinking & Cognition)","verified":"lecture","c":408},{"q":"___ are representative items within each concept.","options":["Imaginations","Focuses","Architectures","Prototypes","Images"],"answer":[3],"explanation":"Prototype = representative example of a concept (Himalayan mountains example). (Lecture 16: Thinking & Cognition)","verified":"lecture","c":409,"rel":[["Jul-Oct 2025",4,0]]},{"q":"Cognitive, affective, and psychomotor are three learning domains as given by -","options":["Cognitive architectures","Maslow's hierarchy","Bloom's Taxonomy","Propositions","Working memory theory"],"answer":[2],"explanation":"Bloom's taxonomy domains: cognitive, affective, psychomotor. (Lecture 17)","verified":"lecture","c":410},{"q":"___ knowledge defines knowledge about own knowledge or self-knowledge","options":["Factual","Metacognitive","Cognitive","Procedural","Conceptual"],"answer":[1],"explanation":"Types of knowledge: factual, conceptual, procedural, metacognitive (knowledge of one's own cognition). (Lecture 17)","verified":"lecture","c":411},{"q":"___ is the ability to collect and analyze information to come to a conclusion.","options":["Critical thinking","Metacognition","Intuition","Affective thinking","Learning"],"answer":[0],"explanation":"\"critical thinking ... is the ability to collect and analyze the information to come to a conclusion\". (Lecture 18)","verified":"lecture","c":412},{"q":"'Think out of the box' refers to which of the following?","options":["Creative thinking","Critical thinking","Reflective thinking","Analytical thinking","Metacognition"],"answer":[0],"explanation":"Creative thinking = going beyond the boundary, new ideas (\"think out of the box\"). (Lecture 19)","verified":"lecture","c":413},{"q":"Which of the following is not a stage of the creative thinking process?","options":["Elaboration","Evaluation","Preparation","Insight","Information"],"answer":[4],"explanation":"Stages: preparation, incubation, insight, evaluation, elaboration; \"information\" is not a stage. (Lecture 19)","verified":"lecture","c":414,"rel":[["Jul-Oct 2026",4,0],["Jul-Oct 2024",4,0]]},{"q":"___ is a method of problem solving in which possible solutions are tried until one is successful.","options":["Analogy","Trial and error","Chance","Algorithm","Creativity"],"answer":[1],"explanation":"Trial and error: trying again and again until success. (Lecture 19)","verified":"lecture","c":415},{"q":"In the traditional approach to learning, a student's role is ___","options":["passive","active","experiential","absent","unrecognized"],"answer":[0],"explanation":"Traditional (teacher-centred) approach treats the student as a passive recipient.","verified":"reasoning","c":416},{"q":"___ are versatile graphic organizers that can represent many different forms of relationships between concepts.","options":["Prototypes","Concepts","Emotional maps","Cognitive aids","Cognitive maps"],"answer":[4],"explanation":"\"mental maps or versatile graphic organizers ... which can represent many different forms of relationship between the concepts\"; mental map = cognitive map. (Lecture 20)","verified":"lecture","c":417}]},{"year":2023,"session":"Jul-Oct 2023","week":5,"source":"https://www.youtube.com/watch?v=SFTs_f0OhFQ","questions":[{"q":"Which of the following is not a major component of motivation?","options":["Activation","Confusion","Persistence","Intensity","Direction"],"answer":[1],"explanation":"L21 (Motivation of Learning) lists major components as activation, persistence, intensity (and direction); confusion is not one.","verified":"lecture","c":418},{"q":"___ refers to doing something or behaving well because one feels an internal pressure to do so.","options":["Identified regulation","Amotivation","Introjected regulation","Curiosity","Motivational learning"],"answer":[2],"explanation":"L21: introjected regulation = 'doing something or behave well because one feels pressure within'.","verified":"lecture","c":419,"rel":[["Jul-Oct 2025",5,0]]},{"q":"___ drives are often referred to as 'tertiary drives'.","options":["Biological","Psychological","Social","Hunger","None of the above"],"answer":[2],"explanation":"L22: 'the social drives are found as the tertiary drives'; slide 'Types of Drive' biological=primary, psychological=secondary.","verified":"lecture","c":420},{"q":"Incentive theory of motivation is based on the concept of ___","options":["Operant conditioning","Classical conditioning","Memory","Forgetting","Drive theory"],"answer":[0],"explanation":"L22 slide: 'Incentive theory... is based on the idea of operant conditioning'.","verified":"lecture","c":421},{"q":"The Yerkes Dodson law gives a relationship between ___ and ___","options":["arousal, performance","intelligence, stress","stress, happiness","learning, marks","None of the above"],"answer":[0],"explanation":"L22: Yerkes-Dodson law plots level of arousal (x-axis) against performance (y-axis).","verified":"lecture","c":422},{"q":"The letter 'M' in the acronym 'SMART' used in the context of goal setting stands for -","options":["measurable","microscopic","maintained","motivated","none of the above"],"answer":[0],"explanation":"L23: SMART goals - specific, measurable ('can be measured, evaluated'), achievable/assignable, realistic, time-based.","verified":"lecture","c":423},{"q":"Maslow's need hierarchy has ___ number of stages.","options":["Two","Three","Seven","Four","Five"],"answer":[4],"explanation":"L24: Maslow's hierarchy 'is the five tier model... five layers'.","verified":"lecture","c":424},{"q":"What are the three psychological needs highlighted by the self determination theory?","options":["Autonomy, Comfort, Rationalization","Autonomy, Competence, Relatedness","Attention, Comfort, Relationship","Attention, Competence, Relationship","None of the above"],"answer":[1],"explanation":"L24: self-determination theory's three psychological needs are 'autonomy, competence, relatedness' (Ryan & Deci 2000).","verified":"lecture","c":425},{"q":"Which of the following is not an example of esteem needs in the context of Maslow's hierarchy?","options":["sleep","achievement","education","respect","competence"],"answer":[0],"explanation":"L24: esteem needs = prestige, accomplishment, achievement; sleep is a physiological (basic) need.","verified":"lecture","c":426},{"q":"Achievement motivation stems from two needs: need to achieve and need to ___","options":["enjoy","relax","avoid failure","be respected","seek attention"],"answer":[2],"explanation":"L25 slide: achievement motivation - 'motive to achieve' and 'the motive to avoid failure'.","verified":"lecture","c":427}]},{"year":2023,"session":"Jul-Oct 2023","week":6,"source":"https://www.youtube.com/watch?v=qSC60TngbIg","questions":[{"q":"Who among the following is given major credit for the popularization of the term 'Emotional Intelligence'?","options":["Dr. Abraham Maslow","Dr. Carl Jung","Dr. Daniel Goleman","Dr. John Mayer","Dr. Sigmund Freud"],"answer":[2],"explanation":"L26 slide: 'Psychologist Dr. Daniel Goleman popularized the term in his 1995 book'.","verified":"lecture","c":428},{"q":"Which of the following is not a component of emotional intelligence?","options":["Self-awareness","Self-regulation","Knowledge","Motivation","Empathy"],"answer":[2],"explanation":"L26 slide: Goleman's five areas are self-awareness, self-regulation, motivation, empathy, social skills; knowledge is not one.","verified":"lecture","c":429},{"q":"___ refers to the ability of putting words to feelings.","options":["Emotional literacy","Emotional testing","Social knowledge","Emotional ability","Emotional aptitude"],"answer":[0],"explanation":"L26: identifying and putting words to what we feel 'is called the emotional literacy'.","verified":"lecture","c":430},{"q":"The following are signs of emotional intelligence, except","options":["The ability to let go of mistakes","Feelings of empathy and concern for others","An awareness of personal strengths and limitations","Self-confidence and self-acceptance","Not taking responsibility for one's mistakes"],"answer":[4],"explanation":"L26/L27: EI signs include accepting responsibility for mistakes and moving on; not taking responsibility is not a sign.","verified":"lecture","c":431,"rel":[["Jul-Oct 2026",6,0]]},{"q":"According to Hochschild, the ___ are attempts by organizations to control employees' inner lives or thoughts and feelings; e.g. in the case of flight attendants.","options":["feeling rules","emotional syntax","emotional norms","feeling norms","None of the above"],"answer":[0],"explanation":"L29: 'some organizations... have the feeling rules to control the employees' inner lives and thoughts and feelings' (flight attendants example).","verified":"lecture","c":432},{"q":"___ occurs when someone's emotions and related behaviors lead to similar emotions and behaviors in others.","options":["Deep acting","Emotional domino","Surface acting","Emotional contagion","Emotional norms"],"answer":[3],"explanation":"L29: emotional contagion occurs when someone's emotions/behaviours lead to similar emotions/behaviours in others.","verified":"lecture","c":433},{"q":"The biological explanation of emotional contagion can be through the existence of ___","options":["emotional neurons","emotional nerves","feeling neurons","heart","mirror neurons"],"answer":[4],"explanation":"L29: mimicry 'comes naturally... based on the existence of mirror neurons'.","verified":"lecture","c":434},{"q":"Which of the following is not one of three main areas of general creativity?","options":["nonverbal and verbal creativity","biological creativity","creativity in problem solving","emotional creativity"],"answer":[1],"explanation":"L30 slide: 'EC is considered to be one of three main areas of general creativity, together with nonverbal and verbal creativity and creativity in problem solving'.","verified":"lecture","c":435},{"q":"'A breakup gives rise to song lyrics' is an example of how ___","options":["emotions can inspire creativity","heartbreak can inspire emotional intelligence","emotional intelligence is lowered","none of the above"],"answer":[0],"explanation":"L30 slide: 'Emotions can inspire creativity - such as when a breakup gives rise to song lyrics'.","verified":"lecture","c":436},{"q":"Which of the following is false?","options":["Emotional intelligence can predict academic performance and workplace success","Meditation or journal keeping can be effective strategies to improve self-awareness","Emotional intelligence cannot be learnt or improved through training; it is genetic.","Improving communication skills aids in improving conflict resolution.","None of the above"],"answer":[2],"explanation":"L28 slide: 'EI can be developed at any stage of life through self-effort & training', so 'cannot be learnt; genetic' is false.","verified":"lecture","c":437}]},{"year":2023,"session":"Jul-Oct 2023","week":7,"source":"https://www.youtube.com/watch?v=kMPPcEFwH1k","questions":[{"q":"Which of the following is not a component of Benjamin S. Bloom's taxonomy of educational objectives?","options":["Cognitive","Affective","Psychomotor","Biological","None of the above"],"answer":[3],"explanation":"L31: Bloom's taxonomy domains are cognitive, affective, psychomotor.","verified":"lecture","c":438},{"q":"Which of the following is not included in the major schools of learning theories?","options":["Behaviorist orientation","Cognitive orientation","Humanistic orientation","Social and social-constructivist orientations","Biological and evolutionary orientation"],"answer":[4],"explanation":"L31: schools are behaviorist, cognitive, humanistic, social & situational, constructivist/social-constructivist; biological/evolutionary not listed.","verified":"lecture","c":439},{"q":"Which of the following affect learning?","options":["Task variables","Environmental variables","Individual variables","All of the above"],"answer":[3],"explanation":"L32: factors affecting learning are individual, task and environmental variables.","verified":"lecture","c":440},{"q":"Which of the following is not a task variable?","options":["Trainer's competence","Communication gap","Rationality","Task overload","Learning capabilities"],"answer":[4],"explanation":"L32: task variables = objectives, trainer's competence, variety, communication gap, rationality, task overload; learning capabilities is an individual variable.","verified":"lecture","c":441},{"q":"___ learning refers to learning that gets students to learn through doing; such as experimentation and play","options":["Active","Passive","Deep","Shallow","None of the above"],"answer":[0],"explanation":"L32: 'Active learning... directs the students to learn through doing... experimentation, learning by playing'.","verified":"lecture","c":442},{"q":"___ learners favor educational lessons that include peer work or participation.","options":["Social/linguistic","Solitary","Kinesthetic","Auditory","Visual"],"answer":[0],"explanation":"L32: 'social and linguistic learners... favor the educational lessons that include the peer work, participation, group learning'.","verified":"lecture","c":443},{"q":"Which of the following is not true for effective instruction?","options":["It is interactive","It is eclectic","It is generative and dynamic","It incorporates components of core curriculum","It is independent of the success of the learning experience"],"answer":[4],"explanation":"L33: effective instruction 'is directly related to the success of the learning experiences', so 'independent of' is false.","verified":"lecture","c":444,"rel":[["Jul-Oct 2024",7,0]]},{"q":"The following are principles of instruction given by Merrill, except ___","options":["Activation","Formation","Demonstration","Integration","Application"],"answer":[1],"explanation":"L33: Merrill's principles - problem-centred, activation, demonstration, application, integration; no 'formation'.","verified":"lecture","c":445},{"q":"Which of the following is a principle of Instructional Systems Design (ISD)?","options":["It should move at an efficient pace","It should keep information outside of context","It should be independent of the community","It should create opportunities for learners to replicate past work and output"],"answer":[0],"explanation":"L33: ISD principles - 'should be able to teach the subject matter efficiently'; other options contradict the principles.","verified":"lecture","c":446},{"q":"According to Ausubel, ___ occurs when new information is integrated into existing knowledge structures, also known as mental schemas.","options":["structural learning","mental learning","meaningful learning","integrative learning","None of the above"],"answer":[2],"explanation":"L34: Ausubel - 'meaningful learning... takes place when the information is integrated into the existing knowledge structure'.","verified":"lecture","c":447}]},{"year":2023,"session":"Jul-Oct 2023","week":8,"source":"https://www.youtube.com/watch?v=r9f2h38Pmyk","questions":[{"q":"Which of the following is not a pedagogical approach in teaching?","options":["Collaborative approach","Inquiry-based approach","Constructivist approach","Refractive approach","Integrative approach"],"answer":[3],"explanation":"L36 slide: five pedagogical approaches - constructivist, collaborative, inquiry-based, integrative, reflective; no 'refractive'.","verified":"lecture","c":448,"rel":[["Jul-Oct 2025",8,0],["Jul-Oct 2024",8,0]]},{"q":"Constructivism with respect to learning suggests that ___","options":["the role of learners is passive","learners are the makers of meaning and knowledge","facilitators are the makers of meaning and knowledge","internet is the maker of meaning and knowledge","none of the above"],"answer":[1],"explanation":"L36: constructivist approach - 'Learners are the makers of the meaning and knowledge'.","verified":"lecture","c":449},{"q":"Which of the following is false about pedagogy in education and learning?","options":["Effective pedagogies are an amalgamation of various teaching techniques","Pedagogy is based on a facilitator-centered approach","Pedagogy allows teachers to evaluate individual students' performance regularly","Pedagogy allows students to meet like-minded people and learn from their peers","None of the above"],"answer":[1],"explanation":"L37 slide: 'Pedagogy is based on a student-centered approach'; the other three statements are on the same slide, so the facilitator-centred option is the false one.","verified":"lecture","c":450},{"q":"Which of the following is not a major component of the experiential learning process?","options":["Generalizing","Experiencing","Analyzing","Sharing","Overthinking","Applying"],"answer":[4],"explanation":"L37 slide: experiential learning cycle - experiencing, sharing, processing/analyzing, generalizing, application; no 'overthinking'.","verified":"lecture","c":451},{"q":"David Kolb's experiential learning style theory typically suggests ___ number of stages in the experiential learning cycle.","options":["Four","Nine","Fifteen","Seven","None of the above"],"answer":[0],"explanation":"L37: Kolb's model 'has the four stage of learning cycle'.","verified":"lecture","c":452},{"q":"The stages of the experiential learning cycle given by Kolb are dissected by two continuums relating to perception and ___","options":["emotion","motivation","processing","perseveration","none of the above"],"answer":[2],"explanation":"L37: 'these are two continuums... how do we perceive... and how do we process' (perception and processing continuums).","verified":"lecture","c":453},{"q":"The ___ learning style as given by Kolb suggests that these individuals prefer technical tasks and like to be left alone to solve them.","options":["Assimilating","Accommodating","Diverging","Converging"],"answer":[3],"explanation":"L37: converging style - 'prefer technical tasks... would like to be left alone to solve them'.","verified":"lecture","c":454},{"q":"The model of multimedia learning is based upon some primary assumptions as given by Mayer that are mentioned below. Which of the following is false?","options":["Visual and auditory experiences/information are processed through separate and distinct information processing 'channels'","Each information processing channel is limited in its ability to process experience/information","Processing experience/information in channels is an active cognitive process designed to construct coherent mental representations","None of the above"],"answer":[3],"explanation":"L38: Mayer's assumptions - two separate channels, each limited in capacity, processing is an active cognitive process; all true, so none is false.","verified":"lecture","c":455},{"q":"The ___ principle of multimedia learning suggests that students learn better when corresponding words and pictures are presented simultaneously rather than successively","options":["temporal contiguity","spatial contiguity","modality","coherence","redundancy"],"answer":[0],"explanation":"L38: 'temporal contiguity principle says the students learn better when corresponding words and the pictures are presented simultaneously rather than successively'.","verified":"lecture","c":456},{"q":"Mezirow(1978) identified ___ number of steps that are required for transformative learning to occur.","options":["Four","Five","Seven","Ten","Thirteen"],"answer":[3],"explanation":"L39: Mezirow 'has suggested the 10 steps for transformative learning to occur, first thing is the disorienting dilemma'.","verified":"lecture","c":457}]},{"year":2023,"session":"Jul-Oct 2023","week":9,"source":"https://www.youtube.com/watch?v=RzmKMTcEu8Y","questions":[{"q":"Which of the following is not a feature of e-learning?","options":["individualization","accessibility","personalization","stereotypical","social justice"],"answer":[3],"explanation":"L41 (Psychology of E-Learning) lists features: accessibility, user friendliness, social justice, personalization, individualization, learner-centredness, open/lifelong learning; 'stereotypical' is not one.","verified":"lecture","c":458,"rel":[["Jul-Oct 2026",9,0],["Jul-Oct 2025",9,1]]},{"q":"Many students in the context of a digital classroom regard knowledge of ___ as more important than 'what'.","options":["'who'","'why not'","'where'","'how to'","none of the above"],"answer":[3],"explanation":"L41 slide: 'Many students regard knowledge of how to as more important than what'.","verified":"lecture","c":459},{"q":"Which of the following is not a benefit of e-learning?","options":["It accommodates everybody's needs","It is self-paced","It is motivating and interactive","It is scalable","None of the above"],"answer":[2],"explanation":"Corrected after checking the lecture (was: None of the above). L41-42 slides list benefits: accommodates everyone's needs, lectures multiple times, scalability, quick delivery ('learners can determine their own speed'), consistency, reduced costs, environment-friendly; not 'motivating' - the L42 slide instead says 'Learners are required to keep themselves motivated'.","verified":"lecture","c":460,"rel":[["Jul-Oct 2026",9,0]]},{"q":"When we are learning or practicing something, our brain ___","options":["does not do anything","releases hormones","builds strong connections between the muscles and bones","builds strong connections between neurons"],"answer":[3],"explanation":"L42 slide: 'When we're learning, our brain makes new connections between neurons.'","verified":"lecture","c":461},{"q":"The ___ theory suggests that when we overload our working memory, we are unable to acquire and process new information.","options":["cognitive load","emotional labor","memory","psychological stress","None of the above"],"answer":[0],"explanation":"L43: overloading limited-capacity working memory during e-learning 'creates a cognitive load ... cognitive overload takes place'.","verified":"lecture","c":462},{"q":"The brain often benefits from physically writing in a notebook since it contributes to ___. Learners during e-learning are hence often advised to take notes.","options":["emotion","motivation","encoding","forgetting","decoding"],"answer":[2],"explanation":"L43: writing notes while attending 'enhances the encoding process ... expedite our encoding processes'.","verified":"lecture","c":463},{"q":"In the context of virtual learning, ___ refers to the speed and ease with which a novice user can achieve proficiency with the system.","options":["Efficiency","Memorability","Novice index","Learnability","None of the above"],"answer":[3],"explanation":"L43: 'learnability ... refers to the speed and ease with which the novice user can achieve the proficiency' with the system.","verified":"lecture","c":464},{"q":"Which of the following is not a critical factor that impacts e-learning?","options":["Motivation","Self-discipline","Stress","Social skills","Genes"],"answer":[4],"explanation":"L43/L44: five critical aspects of successful e-learning are motivation, emotion, self-discipline, social skills, stress; genes are not one.","verified":"lecture","c":465},{"q":"In the context of instructional design, ___ refers to learners' automatic performance on specific procedures with predetermined steps to be followed.","options":["chaining","association","discrimination","none of the above"],"answer":[0],"explanation":"L44 slide: 'Chaining is referring to learners' automatic performance on specific procedures...'.","verified":"lecture","c":466},{"q":"___ provides the context to learners in the form of simulated job-related situations where learners have to judge a situation, use the information they have at hand, and make the best possible choice to solve the problem.","options":["Problem-focused e-learning","Scenario-based e-learning","Guided e-learning","None of the above"],"answer":[1],"explanation":"L45: instructional strategies for rapid e-learning - immersive learning 'through simulation, job related situations' (scenario-based), then guided learning, exploration; definition matches scenario-based e-learning.","verified":"lecture","c":467}]},{"year":2023,"session":"Jul-Oct 2023","week":10,"source":"https://www.youtube.com/watch?v=Yf72mODxR2k","questions":[{"q":"Which of the following is not an essential skill needed for today's teacher (post pandemic era)","options":["digital skills","communication","life skills","non-inclusive education","participative education"],"answer":[3],"explanation":"L46: teacher skills listed - digital skills, life skills, communication, creativity, participatory education, inclusive education; non-inclusive education is not one.","verified":"lecture","c":468},{"q":"The following psychological principles about how students think and learn are true except","options":["Students' cognitive development and learning is not limited by the general stages of development","Students existing knowledge is not related to and does not impact their present learning","The beliefs or perceptions students have about their intelligence and ability affect their learning and cognitive functioning","Learning is context-based"],"answer":[1],"explanation":"L46 principles: belief about intelligence affects learning; 'what students already know affect their learning'; development 'not limited by the general stages'; learning is context based.","verified":"lecture","c":469},{"q":"Which of the following is true regarding the social and emotional learning of students?","options":["Learning is situated in a single isolated social context","Interpersonal relationships are unimportant for development of students","Emotional well-being impacts students' educational performance","None of the above"],"answer":[2],"explanation":"L47 principle 15: 'emotional well-being influences the educational performance, learning and development'.","verified":"lecture","c":470},{"q":"Learners who have a ___ believe that intelligence is malleable and success is related to effort level","options":["communication","academic intelligence","fixed mindset","intelligent mindset","growth mindset"],"answer":[4],"explanation":"L48: 'growth mindset ... the intelligence is malleable and success is related to effort level'.","verified":"lecture","c":471},{"q":"Acquiring long-term knowledge and skill is largely dependent on ___","options":["practice","good luck","genes","money","None of the above"],"answer":[0],"explanation":"L46: 'the acquisition of the knowledge and the skills in the long term depends largely on practice'.","verified":"lecture","c":472},{"q":"Use of ___ goals increase self-efficacy and competency towards larger goals.","options":["ambiguous","extremely challenging","extremely non-challenging","proximal","none of the above"],"answer":[3],"explanation":"L47 slide (Principle 12): short-term (proximal), specific, challenging objectives are more motivating; L48 links proximal goals to self-efficacy and competency.","verified":"lecture","c":473},{"q":"The following are examples of formative assessment except ___","options":["anecdotal records","essays","lab reports","entrance tests"],"answer":[3],"explanation":"L49 slide: types of formative evaluation - anecdotal records, quizzes, essays, lab reports, diagnostics; entrance exams are listed under summative evaluation.","verified":"lecture","c":474},{"q":"Summative assessment is conducted ___","options":["during instruction","before instruction","before and during instruction","after instruction"],"answer":[3],"explanation":"L49: summative assessment is at the end of the unit/semester, after instruction.","verified":"lecture","c":475},{"q":"Which of the following is not an appropriate principle of good feedback practice?","options":["Aims to hamper self-reflection","Provides opportunities to close the gap between current and desired performance","Helps clarify what good performance is","Provides information to teachers that can be used to help shape the teaching","Encourages positive motivational beliefs and self-esteem"],"answer":[0],"explanation":"L50 seven principles of good feedback practice: facilitates self-assessment/reflection, clarifies good performance, closes the gap, encourages motivational beliefs and self-esteem, informs teaching.","verified":"lecture","c":476},{"q":"Which of the following is not one of the levels of feedback?","options":["Task-level","Process-level","Facilitator-level","Personal-level"],"answer":[2],"explanation":"L50 levels of feedback: task level, process level, personal level; no facilitator level.","verified":"lecture","c":477}]}]};
window.COURSE = {"lskey":"psychq","meta":"NPTEL · IIT Kharagpur · Prof. Atasi Mohanty","heading":"Psychology of <span>Learning<\/span> Quiz Bench","note":"Every answer was checked against Prof. Mohanty’s NPTEL lectures, using both what she says and the text on her slides. 440 are confirmed by the lecture, and 3 answers from answer-key sites and solution videos were corrected; the reason is shown after you answer. 35 questions aren’t covered in the lectures and were decided by reasoning. The 3 marked “Check this answer” are still uncertain. This is not NPTEL’s official key.","nav":[{"name":"Industry 4.0 & IIoT","current":false,"href":"index.html"},{"name":"Psychology of Learning","current":true,"href":"psychology-of-learning.html"}]};</script>
<script>
(function(){
"use strict";
const D = window.QUIZ_DATA || {sets:[]};
const C = window.COURSE || {lskey: 'quiz', meta: '', heading: 'Quiz', note: '', nav: []};
const app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s ?? '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
const LS = {
  get(k, d){ try { const v = localStorage.getItem(C.lskey+':'+k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(C.lskey+':'+k, JSON.stringify(v)); } catch(e){} }
};
const hash = s => { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36); };
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const LETTERS = 'ABCDEFGH';
const pad = n => String(n).padStart(2, '0');

// ---- data prep
const sessKey = s => { const y = +((String(s).match(/\d{4}/) || [0])[0]); return y + (/jul|aug|sep|oct/i.test(s) ? 0.5 : 0); };
const sets = (D.sets || []).filter(s => s.questions && s.questions.length).map(s => ({...s, id: (s.session + '|w' + s.week).replace(/\s+/g, '_')}))
  .sort((a, b) => sessKey(b.session) - sessKey(a.session) || a.week - b.week);
const sessions = [...new Set(sets.map(s => s.session))];
const allQ = [];
sets.forEach(s => s.questions.forEach(q => {
  q.key = hash(norm(q.q) + '|' + q.options.map(norm).sort().join('|'));
  q.origin = s.session + ' · Week ' + s.week;
  q.source = q.source || s.source;
  q.week = s.week;
  q.sess = s.session;
  q.rel = (q.rel || []).sort((a, b) => sessKey(b[0]) - sessKey(a[0]));
  q.runs = 1 + new Set(q.rel.map(r => r[0])).size;
  q.tier = q.runs >= 3 ? 2 : q.runs === 2 ? 1 : 0;
  q.unsure = q.verified ? q.verified === 'unsure' : /uncertain|verify|caution|not confirmed|unconfirmed|could not (be )?confirm|couldn.t confirm|unverified|judg(e)?ment call|only one source|single source|beubihar lists|progiez lists|arguably|another .*video .*marked|source answer false|videos split|judged wrong|chose [a-d]\b.*\bchose [a-d]\b|but this is corrected/i.test(q.explanation || '');
  allQ.push(q);
}));
// sets are newest-first, so each repeat cluster keeps its newest wording
const uniqueQ = []; { const seen = new Set(); allQ.forEach(q => { if (!seen.has(q.c)) { seen.add(q.c); uniqueQ.push(q); } }); }
const byKey = new Map(); allQ.forEach(q => { if (!byKey.has(q.key)) byKey.set(q.key, q); });
const focusN = t => uniqueQ.filter(q => q.tier === t).length;
const weeksAvail = [...new Set(sets.map(s => s.week))].sort((a, b) => a - b);

// ---- persistent prefs
const S = {
  view: 'home',
  tab: LS.get('tab', 'all'),
  mode: LS.get('mode', 'practice'),
  shuf: LS.get('shuf', false),
  drillWeeks: LS.get('dw', weeksAvail),
  drillRuns: LS.get('dr', sessions),
  drillCount: LS.get('dc', 20),
  uniq: LS.get('uniq', true),
  pool: LS.get('dp', 'all'),
  quiz: null
};
if (S.tab !== 'all' && !sessions.includes(S.tab)) S.tab = 'all';
S.drillRuns = S.drillRuns.filter(x => sessions.includes(x));
if (!S.drillRuns.length && !LS.get('dr', null)) S.drillRuns = sessions.slice();
const best = () => LS.get('best', {});
const mistakes = () => LS.get('miss', []);
function setMistake(key, wrong){
  let m = mistakes().filter(k => k !== key);
  if (wrong) m.unshift(key);
  LS.set('miss', m.slice(0, 1000));
}
function lampLevel(r){ if (!r) return ''; const p = r.s / r.n; return p >= .8 ? 'g' : p >= .5 ? 'a' : 'r'; }
const flag = q => q.verified === 'lecture' ? '<span class="ok-chip" title="This answer was checked against what the lecture says.">Checked against lecture</span>' : q.unsure ? '<span class="flag" title="No official key found for this one. Check it against the lecture slides.">Check this answer</span>' : '';
const imp = q => q.tier === 2 ? `<span class="imp t2" title="Same question or topic asked in ${q.runs} course runs">Must know · ${q.runs} runs</span>`
  : q.tier === 1 ? '<span class="imp t1" title="Same question or topic asked in 2 course runs">Repeated</span>' : '';
const relHTML = q => q.rel.length ? `<div class="relq">Also asked in: ${q.rel.map(r => esc(r[0]) + ' W' + r[1] + (r[2] ? '' : ' (reworded)')).join(' · ')}</div>` : '';
const lamp = l => `<span class="lamp" data-l="${l}" aria-hidden="true"><i></i><i></i><i></i></span>`;

let toastT;
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 1800); }

// ---- quiz construction
function buildItem(q){
  let opts = q.options.map((t, i) => ({t, c: q.answer.includes(i)}));
  const fixed = opts.some(o => /(all|none|both|neither) of (the )?(the )?(above|these)|^both|^none|^all of/i.test(o.t));
  if (S.shuf && !fixed) opts = shuffle(opts);
  return {q, opts, multi: q.answer.length > 1, chosen: [], checked: false};
}
function startQuiz(title, questions, extra = {}){
  if (!questions.length) { toast('No questions match that selection.'); return; }
  S.quiz = {title, items: questions.map(buildItem), i: 0, mode: extra.mode || S.mode, finished: false, setId: extra.setId || null, review: !!extra.review};
  S.view = 'quiz';
  render(); window.scrollTo(0, 0);
}
function startSet(id){ const s = sets.find(x => x.id === id); startQuiz(s.session + ' · Week ' + s.week, s.questions, {setId: s.id}); }
function drillPool(){
  const weeks = new Set(S.drillWeeks), runs = new Set(S.drillRuns);
  const minTier = {all: 0, rep: 1, must: 2}[S.pool] || 0;
  let pool = allQ.filter(q => runs.has(q.sess) && weeks.has(q.week) && q.tier >= minTier);
  // allQ is newest-first, so skipping repeats keeps the newest wording
  if (S.uniq) { const seen = new Set(); pool = pool.filter(q => !seen.has(q.c) && seen.add(q.c)); }
  return pool;
}
function startDrill(){
  let pool = shuffle(drillPool());
  if (S.drillCount !== 'all') pool = pool.slice(0, +S.drillCount);
  const runs = S.drillRuns.length === sessions.length ? 'All runs' : S.drillRuns.join(', ');
  startQuiz('Mixed drill · ' + runs + ' · Weeks ' + compactWeeks(S.drillWeeks.slice()), pool);
}
function nextSet(id){
  const i = sets.findIndex(x => x.id === id), n = sets[i + 1];
  return i >= 0 && n && n.session === sets[i].session ? n : null;
}
function nextBtn(){
  const n = S.quiz.setId && nextSet(S.quiz.setId);
  return n ? `<button class="btn primary" data-act="nextweek">Next: Week ${pad(n.week)} →</button>` : '';
}
function startFocus(minTier, mode){
  let qs = uniqueQ.filter(q => q.tier >= minTier);
  qs = mode === 'study' ? qs.slice().sort((a, b) => b.runs - a.runs || a.week - b.week) : shuffle(qs);
  startQuiz(minTier === 2 ? 'Must know · asked in 3+ runs' : 'Repeated questions · asked in 2+ runs', qs, mode ? {mode} : {});
}
function startMistakes(){
  const qs = mistakes().map(k => byKey.get(k)).filter(Boolean);
  startQuiz('Mistake review', shuffle(qs), {review: true});
}
function compactWeeks(w){
  w = w.sort((a, b) => a - b); const out = []; let s = w[0], p = w[0];
  for (let i = 1; i <= w.length; i++) { if (w[i] === p + 1) { p = w[i]; continue; } out.push(s === p ? s : s + '–' + p); s = p = w[i]; }
  return out.join(', ');
}
const isRight = it => { const want = it.opts.map((o, i) => o.c ? i : -1).filter(i => i >= 0); return want.length === it.chosen.length && want.every(i => it.chosen.includes(i)); };

function choose(idx){
  const Q = S.quiz, it = Q.items[Q.i];
  if (it.checked) return;
  if (it.multi) it.chosen = it.chosen.includes(idx) ? it.chosen.filter(x => x !== idx) : [...it.chosen, idx];
  else it.chosen = [idx];
  if (Q.mode === 'practice' && !it.multi) return check();
  render();
}
function check(){
  const it = S.quiz.items[S.quiz.i];
  if (!it.chosen.length || it.checked) return;
  it.checked = true;
  setMistake(it.q.key, !isRight(it));
  render();
}
function go(n){ const Q = S.quiz; Q.i = Math.max(0, Math.min(Q.items.length - 1, n)); render(); }
function finish(){
  const Q = S.quiz;
  if (Q.mode === 'exam') Q.items.forEach(it => { if (!it.checked) { it.checked = true; if (it.chosen.length) setMistake(it.q.key, !isRight(it)); } });
  Q.finished = true;
  const s = Q.items.filter(isRight).length, n = Q.items.length;
  if (Q.setId) { const b = best(); if (!b[Q.setId] || s / n > b[Q.setId].s / b[Q.setId].n) { b[Q.setId] = {s, n}; LS.set('best', b); } }
  render(); window.scrollTo(0, 0);
}

// ---- views
function header(){
  return `<header class="top">
    <div class="brand">${C.nav.length > 1 ? `<nav class="courses" aria-label="Courses">${C.nav.map(c => c.current ? `<b>${esc(c.name)}</b>` : `<a href="${esc(c.href)}">${esc(c.name)}</a>`).join('')}</nav>` : ''}
      <div class="label">${esc(C.meta)}</div>
      <h1>${C.heading}</h1></div>
    <div class="meters">
      <div class="meter"><b>${sessions.length}</b><small>course runs</small></div>
      <div class="meter"><b>${sets.length}</b><small>weekly sets</small></div>
      <div class="meter"><b>${uniqueQ.length}</b><small>unique questions</small></div>
      <div class="meter"><b>${mistakes().filter(k => byKey.has(k)).length}</b><small>to review</small></div>
    </div></header>`;
}
function sidebar(){
  const missN = mistakes().filter(k => byKey.has(k)).length;
  const modeHint = {practice: 'Answer is checked as soon as you pick.', exam: 'No feedback until you submit, like the real assignment.', study: 'Answer sheet: every question shown with its answer.'}[S.mode];
  return `<aside>
    <section class="panel"><h2>Mode</h2>
      <div class="seg" role="group" aria-label="Quiz mode">
        ${['practice', 'exam', 'study'].map(m => `<button data-mode="${m}" aria-pressed="${S.mode === m}">${m[0].toUpperCase() + m.slice(1)}</button>`).join('')}
      </div>
      <p class="hintline">${modeHint}</p>
      <label class="check"><input type="checkbox" id="opt-shuf" ${S.shuf ? 'checked' : ''}> Shuffle answer options</label>
    </section>
    <section class="panel"><h2>Mixed drill</h2>
      <div class="pickhead"><span class="label">Runs</span><span><button class="linkish" data-drall="1">All</button> · <button class="linkish" data-drall="0">None</button></span></div>
      <div class="runpick">${sessions.map((ss, i) => `<label><input type="checkbox" id="dr-${i}" data-dr="${esc(ss)}" ${S.drillRuns.includes(ss) ? 'checked' : ''}><span>${esc(ss)}</span></label>`).join('')}</div>
      <div class="label" style="margin:14px 0 8px">Weeks</div>
      <div class="weekpick">${weeksAvail.map(w => `<label><input type="checkbox" id="dw-${w}" data-dw="${w}" ${S.drillWeeks.includes(w) ? 'checked' : ''}><span>${pad(w)}</span></label>`).join('')}</div>
      <div class="row" style="justify-content:space-between">
        <button class="linkish" data-dwall="1">All</button><button class="linkish" data-dwall="0">None</button>
        <span class="sp" style="flex:1"></span>
        <label for="dc" class="label">Questions</label>
        <select id="dc">${['10', '20', '30', '50', 'all'].map(v => `<option value="${v}" ${String(S.drillCount) === v ? 'selected' : ''}>${v === 'all' ? 'All' : v}</option>`).join('')}</select>
      </div>
      <div class="row"><label for="dp" class="label">From</label>
        <select id="dp">${[['all', 'All questions'], ['rep', 'Repeated only'], ['must', 'Must know only']].map(([v, t]) => `<option value="${v}" ${S.pool === v ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
      <label class="check"><input type="checkbox" id="opt-uniq" ${S.uniq ? 'checked' : ''}> Skip repeats across years</label>
      <button class="btn primary block" data-act="drill" ${S.drillWeeks.length && S.drillRuns.length ? '' : 'disabled'}>Start mixed drill</button>
      <p class="hintline">${drillPool().length} questions match these choices</p>
    </section>
    <section class="panel"><h2>Mistakes</h2>
      <p class="hintline" style="margin-top:0">${missN ? `${missN} question${missN > 1 ? 's' : ''} you got wrong. Answer one right and it leaves this list.` : 'Questions you get wrong collect here.'}</p>
      <button class="btn block" data-act="miss" ${missN ? '' : 'disabled'}>Review mistakes</button>
      ${missN ? '<button class="linkish" data-act="clearmiss" style="margin-top:8px">Clear list</button>' : ''}
    </section>
  </aside>`;
}
function weekCard(s){
  const b = best()[s.id];
  return `<div class="wk">
    <div class="wk-top"><span class="wk-num">Week ${pad(s.week)}</span>${lamp(lampLevel(b))}</div>
    <div class="wk-meta"><span>${s.questions.length} Qs</span><span class="mono">${b ? 'best ' + b.s + '/' + b.n : 'not tried'}</span></div>
    <div class="wk-imp"><b>${s.questions.filter(q => q.tier).length}</b> repeated in other years</div>
    <div class="wk-actions"><button class="btn primary" data-set="${esc(s.id)}">Start</button></div>
  </div>`;
}
function home(){
  const shown = S.tab === 'all' ? sessions : [S.tab];
  const body = !sets.length ? `<div class="empty">No question sets loaded yet.</div>` : shown.map(ss => {
    const list = sets.filter(s => s.session === ss);
    const n = list.reduce((a, s) => a + s.questions.length, 0);
    return `<section class="session"><div class="session-head"><h3>${esc(ss)}</h3><span class="label">${list.length} weeks · ${n} questions</span></div>
      <div class="weeks">${list.map(weekCard).join('')}</div></section>`;
  }).join('');
  const focus = `<section class="panel focus"><div><h2>Focus on repeats</h2>
      <p>These questions, or the same topic in new wording, came up in more than one run of the course. The examiners keep returning to them, so learn them first.</p></div>
      <div class="fstats">
        <div class="fstat"><b>${focusN(2)}</b><span class="imp t2">Must know</span><small>asked in 3 or more runs</small></div>
        <div class="fstat"><b>${focusN(1)}</b><span class="imp t1">Repeated</span><small>asked in 2 runs</small></div>
      </div>
      <div class="row">
        <button class="btn primary" data-act="focus2">Practice must know</button>
        <button class="btn" data-act="focus1">Practice all repeated</button>
        <button class="btn ghost" data-act="focusStudy">Read the repeated list</button>
      </div></section>`;
  app.innerHTML = header() + `<div class="grid">${sidebar()}<main>${focus}
    <div class="tabs" role="tablist">${['all', ...sessions].map(t => `<button role="tab" data-tab="${esc(t)}" aria-selected="${S.tab === t}">${t === 'all' ? 'All runs' : esc(t)}</button>`).join('')}</div>
    ${body}
    <p class="note">${esc(C.note)}</p>
  </main></div>`;
}

function quizBar(){
  const Q = S.quiz;
  return `<div class="qbar"><button class="btn ghost" data-act="home">← All sets</button><div class="title">${esc(Q.title)}</div>
    <span class="label">${Q.mode}</span></div>`;
}
function optHTML(it, o, i, reveal){
  let cls = it.chosen.includes(i) ? 'sel' : '';
  if (reveal) { if (o.c) cls = 'ok'; else if (it.chosen.includes(i)) cls = 'bad'; }
  return `<button class="opt ${cls}" data-opt="${i}" ${reveal ? 'disabled' : ''}><span class="k">${LETTERS[i]}</span><span>${esc(o.t)}</span></button>`;
}
function srcHTML(q){
  return `<div class="src">${esc(q.origin)}${q.source ? ` · <a href="${esc(q.source)}" target="_blank" rel="noopener">source</a>` : ''}</div>`;
}
function question(){
  const Q = S.quiz, it = Q.items[Q.i], n = Q.items.length;
  const reveal = Q.mode === 'practice' && it.checked;
  const last = Q.i === n - 1;
  const right = reveal && isRight(it);
  const correctLetters = it.opts.map((o, i) => o.c ? LETTERS[i] : '').filter(Boolean).join(', ');
  const done = Q.items.filter(x => Q.mode === 'practice' ? x.checked : x.chosen.length).length;
  const score = Q.items.filter(x => x.checked && isRight(x)).length;
  let actions = `<button class="btn" data-act="prev" ${Q.i ? '' : 'disabled'}>Prev</button><span class="sp"></span>`;
  if (Q.mode === 'practice') {
    if (!it.checked && it.multi) actions += `<button class="btn primary" data-act="check" ${it.chosen.length ? '' : 'disabled'}>Check answer</button>`;
    if (it.checked) actions += last ? `<button class="btn primary" data-act="finish">See results</button>` : `<button class="btn primary" data-act="next">Next</button>`;
    else if (!last) actions += `<button class="btn" data-act="next">Skip</button>`;
  } else {
    actions += last ? `<button class="btn primary" data-act="finish">Submit (${done}/${n} answered)</button>` : `<button class="btn primary" data-act="next">Next</button>`;
  }
  const dots = Q.items.map((x, i) => {
    let c = i === Q.i ? 'cur ' : '';
    if (Q.mode === 'practice' && x.checked) c += isRight(x) ? 'ok' : 'bad';
    else if (x.chosen.length) c += 'ans';
    return `<button class="${c}" data-go="${i}" aria-label="Question ${i + 1}">${i + 1}</button>`;
  }).join('');
  app.innerHTML = quizBar() + `
    <div class="progress"><div style="width:${(done / n * 100).toFixed(1)}%"></div></div>
    <article class="qcard">
      <div class="qhead"><span class="mono">Q ${pad(Q.i + 1)} / ${pad(n)}${imp(it.q)}${reveal ? flag(it.q) : ''}</span>${Q.mode === 'practice' ? `<span class="mono">score ${score}/${Q.items.filter(x => x.checked).length}</span>` : ''}</div>
      <h2 class="qtext">${esc(it.q.q)}</h2>
      ${it.multi ? '<span class="multi">Select all that apply</span>' : ''}
      <div class="opts">${it.opts.map((o, i) => optHTML(it, o, i, reveal)).join('')}</div>
      ${reveal ? `<div class="feedback ${right ? 'ok' : 'bad'}"><strong>${right ? 'Correct.' : 'Not quite.'}</strong> ${right ? '' : 'Answer: ' + correctLetters + '.'}
        ${it.q.explanation ? `<div style="margin-top:6px">${esc(it.q.explanation)}</div>` : ''}${relHTML(it.q)}${srcHTML(it.q)}</div>` : ''}
      <div class="qactions">${actions}</div>
    </article>
    <nav class="dots" aria-label="Jump to question">${dots}</nav>
    <p class="keys"><kbd>A</kbd>–<kbd>D</kbd> or <kbd>1</kbd>–<kbd>4</kbd> pick · <kbd>Enter</kbd> check / next · <kbd>←</kbd> <kbd>→</kbd> move</p>`;
}
function itemHTML(it, idx, showPick){
  return `<div class="item"><div class="qhead"><span class="mono">Q ${pad(idx + 1)}${imp(it.q)}${flag(it.q)}</span><span>${esc(it.q.origin)}</span></div>
    <div class="qtext">${esc(it.q.q)}</div>
    <ul>${it.opts.map((o, i) => `<li class="${o.c ? 'right' : (showPick && it.chosen.includes(i) ? 'wrong' : '')}"><span class="k">${LETTERS[i]}</span><span>${esc(o.t)}</span></li>`).join('')}</ul>
    ${it.q.explanation ? `<div class="exp">${esc(it.q.explanation)}</div>` : ''}
    ${relHTML(it.q)}
    ${it.q.source ? `<div class="src"><a href="${esc(it.q.source)}" target="_blank" rel="noopener">source</a></div>` : ''}</div>`;
}
function results(){
  const Q = S.quiz, n = Q.items.length, s = Q.items.filter(isRight).length, p = s / n;
  const wrong = Q.items.map((it, i) => [it, i]).filter(([it]) => !isRight(it));
  const verdict = p >= .8 ? 'Exam ready on this set.' : p >= .5 ? 'Close. Review the misses below.' : 'Go back over these lectures.';
  app.innerHTML = quizBar() + `
    <section class="panel" style="max-width:820px">
      <div class="score"><div><b>${s}</b><span class="of"> / ${n}</span></div>${lamp(p >= .8 ? 'g' : p >= .5 ? 'a' : 'r')}
        <div><div class="verdict">${Math.round(p * 100)}%</div><div class="hintline" style="margin:0">${verdict}</div></div></div>
      <div class="row">
        ${nextBtn()}
        <button class="btn ${nextBtn() ? '' : 'primary'}" data-act="retry">Retry all</button>
        ${wrong.length ? `<button class="btn" data-act="retrywrong">Retry the ${wrong.length} missed</button>` : ''}
        <button class="btn ghost" data-act="home">Back to sets</button>
      </div>
    </section>
    ${wrong.length ? `<h2 class="label" style="margin-top:24px">Missed or skipped</h2><div class="list">${wrong.map(([it, i]) => itemHTML(it, i, true)).join('')}</div>` : ''}`;
}
function study(){
  const Q = S.quiz;
  app.innerHTML = quizBar() + `<p class="note">Correct options are highlighted. Switch to Practice or Exam mode to test yourself.</p>
    <div class="list">${Q.items.map((it, i) => itemHTML(it, i, false)).join('')}</div>
    <div class="row">${nextBtn()}<button class="btn ${nextBtn() ? '' : 'primary'}" data-act="practiceThis">Practice this set</button><button class="btn ghost" data-act="home">Back to sets</button></div>`;
}
function render(){
  if (S.view === 'home' || !S.quiz) return home();
  if (S.quiz.mode === 'study') return study();
  if (S.quiz.finished) return results();
  question();
}

// ---- events
app.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const d = b.dataset;
  if (d.mode) { S.mode = d.mode; LS.set('mode', S.mode); return render(); }
  if (d.tab) { S.tab = d.tab; LS.set('tab', S.tab); return render(); }
  if (d.set) return startSet(d.set);
  if (d.drall) { S.drillRuns = d.drall === '1' ? sessions.slice() : []; LS.set('dr', S.drillRuns); return render(); }
  if (d.dwall) { S.drillWeeks = d.dwall === '1' ? weeksAvail.slice() : []; LS.set('dw', S.drillWeeks); return render(); }
  if (d.opt != null) return choose(+d.opt);
  if (d.go != null) return go(+d.go);
  const Q = S.quiz;
  switch (d.act) {
    case 'drill': return startDrill();
    case 'miss': return startMistakes();
    case 'focus2': return startFocus(2);
    case 'focus1': return startFocus(1);
    case 'focusStudy': return startFocus(1, 'study');
    case 'clearmiss': LS.set('miss', []); toast('Mistake list cleared'); return render();
    case 'home': S.view = 'home'; render(); return window.scrollTo(0, 0);
    case 'prev': return go(Q.i - 1);
    case 'next': return go(Q.i + 1);
    case 'check': return check();
    case 'finish': return finish();
    case 'retry': return startQuiz(Q.title, Q.items.map(it => it.q), {setId: Q.setId});
    case 'retrywrong': return startQuiz(Q.title + ' · missed', Q.items.filter(it => !isRight(it)).map(it => it.q));
    case 'nextweek': { const n = nextSet(Q.setId); if (n) startSet(n.id); return; }
    case 'practiceThis': S.mode = 'practice'; LS.set('mode', 'practice'); return startQuiz(Q.title, Q.items.map(it => it.q), {setId: Q.setId});
  }
});
app.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'opt-shuf') { S.shuf = t.checked; LS.set('shuf', S.shuf); }
  else if (t.id === 'opt-uniq') { S.uniq = t.checked; LS.set('uniq', S.uniq); render(); }
  else if (t.id === 'dp') { S.pool = t.value; LS.set('dp', S.pool); render(); }
  else if (t.dataset.dr) {
    const r = t.dataset.dr;
    S.drillRuns = t.checked ? [...new Set([...S.drillRuns, r])] : S.drillRuns.filter(x => x !== r);
    LS.set('dr', S.drillRuns); render();
  }
  else if (t.id === 'dc') { S.drillCount = t.value; LS.set('dc', S.drillCount); }
  else if (t.dataset.dw) {
    const w = +t.dataset.dw;
    S.drillWeeks = t.checked ? [...new Set([...S.drillWeeks, w])] : S.drillWeeks.filter(x => x !== w);
    LS.set('dw', S.drillWeeks); render();
  }
});
document.addEventListener('keydown', e => {
  if (S.view !== 'quiz' || !S.quiz || S.quiz.finished || S.quiz.mode === 'study') return;
  if (e.metaKey || e.ctrlKey || e.altKey || /input|select|textarea/i.test(e.target.tagName)) return;
  const Q = S.quiz, it = Q.items[Q.i], k = e.key.toLowerCase();
  let idx = '1234'.indexOf(k); if (idx < 0) idx = 'abcd'.indexOf(k);
  if (idx >= 0 && idx < it.opts.length) { e.preventDefault(); return choose(idx); }
  if (k === 'arrowright') return go(Q.i + 1);
  if (k === 'arrowleft') return go(Q.i - 1);
  if (k === 'enter') {
    e.preventDefault();
    const last = Q.i === Q.items.length - 1;
    if (Q.mode === 'practice' && !it.checked && it.multi && it.chosen.length) return check();
    if (Q.mode === 'practice' && !it.checked) return;
    return last ? finish() : go(Q.i + 1);
  }
});
render();
})();
</script>

</body>
